<header class="site-header">
  <a class="wordmark" href="{{ site.Home.RelPermalink }}" aria-label="Westside Watch home">
    {{ readFile "static/images/westside-watch-masthead.svg" | safeHTML }}
  </a>
  <nav aria-label="Primary navigation">
    <a href="{{ "journal/" | relURL }}"{{ if or (eq .Section "journal") (eq .Section "vol-00") }} aria-current="page"{{ end }}>Journal</a>
    <a href="{{ "church/" | relURL }}"{{ if eq .Section "church" }} aria-current="page"{{ end }}>Church</a>
    <a href="{{ "resources/" | relURL }}"{{ if eq .Section "resources" }} aria-current="page"{{ end }}>Resources</a>
    <a href="{{ "about/" | relURL }}"{{ if eq .RelPermalink "/about/" }} aria-current="page"{{ end }}>About</a>
  </nav>
</header>
