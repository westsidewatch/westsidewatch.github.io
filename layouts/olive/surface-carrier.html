{{ define "main" }}
<article class="olive-archive">
  <header class="olive-hero">
    <p class="olive-eyebrow">WESTSIDE WATCH · SERMON ARCHIVE</p>
    <h1>Olive<br>Mountain.</h1>
    <p class="olive-zh">橄欖山</p>
    <p class="olive-intro">中文講道、教導與信息。沿人物進入系列，在系列中閱讀與觀看。已有完整系列與播放表者優先整理；其餘先收錄已核實的代表信息。</p>
  </header>

  <aside class="olive-preview" aria-hidden="true">
    <div class="olive-preview__field"><div class="olive-preview__mark">01</div></div>
    <div class="olive-preview__copy"><small>OLIVE MOUNTAIN</small><strong>江秀琴</strong><span>內在生活 · 45</span></div>
  </aside>

  <section class="olive-index olive-home-stage" aria-label="橄欖山講道首頁">
    <article class="olive-feature" data-person="大衛鮑森">
      <a class="olive-feature__media" href="https://www.youtube.com/channel/UCKkUuEC1rNnuQ1yZ-RCAHPQ" target="_blank" rel="noopener noreferrer" aria-label="大衛鮑森國際中文頻道">
        <div class="olive-feature__art"><span class="olive-feature__ghost">DP</span><span class="olive-feature__play">▶</span></div>
        <div class="olive-feature__caption">
          <small>FEATURED CHANNEL · 01</small>
          <h2>大衛鮑森</h2>
          <p>大衛鮑森國際中文頻道</p>
        </div>
      </a>
    </article>

    <div class="olive-speaker-grid" aria-label="其他講員">
      <button class="olive-speaker-card" type="button" data-person="江秀琴" data-preview="內在生活 · 讚美 · 安息美地"><span>02</span><strong>江秀琴</strong><small>內在生活</small></button>
      <button class="olive-speaker-card" type="button" data-person="賴若瀚" data-preview="啟示錄 · 十分釋經 · 傳道書"><span>03</span><strong>賴若瀚</strong><small>十分釋經</small></button>
      <button class="olive-speaker-card" type="button" data-person="劉彤" data-preview="信仰的傳承 · 活出最好的你"><span>04</span><strong>劉彤</strong><small>信仰的傳承</small></button>
      <button class="olive-speaker-card" type="button" data-person="葉光明" data-preview="葉光明中文事工"><span>05</span><strong>葉光明</strong><small>中文事工</small></button>
      <button class="olive-speaker-card" type="button" data-person="倪柝聲" data-preview="中文講道 · 出版信息"><span>06</span><strong>倪柝聲</strong><small>講道與出版</small></button>
      <button class="olive-speaker-card" type="button" data-person="康來昌" data-preview="中文講道"><span>07</span><strong>康來昌</strong><small>中文講道</small></button>
      <button class="olive-speaker-card" type="button" data-person="唐崇榮" data-preview="中文講道"><span>08</span><strong>唐崇榮</strong><small>中文講道</small></button>
      <button class="olive-speaker-card" type="button" data-person="寇紹恩" data-preview="天聲傳播 · 系列信息"><span>09</span><strong>寇紹恩</strong><small>系列信息</small></button>
    </div>
  </section>

  <section id="olive-detail" class="olive-detail" hidden>
    <button class="detail-close" type="button" aria-label="返回">← 返回</button>
    <div class="detail-lead"><div><p class="detail-kicker"></p><h2 class="detail-title"></h2></div><p class="detail-deck"></p></div>
    <div class="detail-rule"><span>講次</span><span class="detail-count"></span></div>
    <ol class="detail-list"></ol>
  </section>
</article>

<style>
.olive-archive{width:var(--comp-canvas);margin:auto;padding:clamp(28px,3vw,52px) 0 0;color:#252525;font-size:var(--ui-body);position:relative}
.olive-hero{display:grid;grid-template-columns:minmax(250px,.65fr) minmax(300px,1fr);gap:7vw;align-items:end;border-bottom:1px solid rgba(37,37,37,.25);padding-bottom:clamp(20px,2.2vw,34px)}
.olive-eyebrow{grid-column:1/-1;font:var(--ui-small)/1.2 Arial,sans-serif;letter-spacing:.16em}
.olive-hero h1{font:400 clamp(54px,5.8vw,108px)/.76 "Cormorant Garamond",Georgia,serif;margin:.16em 0 .04em;letter-spacing:-.045em}
.olive-zh{font-size:var(--ui-h3);margin:.15em 0}
.olive-intro{max-width:38em;font-size:var(--ui-body-lg);line-height:1.6;margin:0 0 .3em}
.olive-home-stage{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(300px,.75fr);gap:clamp(14px,1.5vw,26px);height:clamp(430px,52vh,690px);margin-top:clamp(18px,2vw,30px);padding-bottom:clamp(24px,3vw,48px)}
.olive-feature{min-width:0;height:100%}
.olive-feature__media{height:100%;display:block;position:relative;overflow:hidden;color:#fff;text-decoration:none;background:#2c2a25}
.olive-feature__art{position:absolute;inset:0;background:radial-gradient(circle at 24% 22%,rgba(231,218,165,.82),transparent 25%),linear-gradient(128deg,#b5a878 0,#766c4c 42%,#292824 100%)}
.olive-feature__art:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(105deg,transparent 0 7px,rgba(255,255,255,.07) 8px,transparent 9px)}
.olive-feature__ghost{position:absolute;right:-.03em;top:-.12em;font:400 min(31vw,520px)/1 "Cormorant Garamond",serif;letter-spacing:-.12em;color:rgba(255,255,255,.1)}
.olive-feature__play{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);width:68px;height:68px;border:1px solid rgba(255,255,255,.7);border-radius:50%;display:grid;place-items:center;padding-left:4px;font-size:18px}
.olive-feature__caption{position:absolute;left:clamp(24px,3vw,50px);right:clamp(24px,3vw,50px);bottom:clamp(24px,3vw,48px);text-shadow:0 1px 18px rgba(0,0,0,.3)}
.olive-feature__caption small{font:10px/1 Arial,sans-serif;letter-spacing:.18em}
.olive-feature__caption h2{font:400 clamp(46px,5vw,90px)/.9 "Noto Serif TC",serif;margin:.16em 0 .08em}
.olive-feature__caption p{font-size:var(--ui-body-lg);margin:0}
.olive-speaker-grid{height:100%;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(4,1fr);gap:clamp(8px,.8vw,14px)}
.olive-speaker-card{appearance:none;border:1px solid rgba(37,37,37,.2);background:rgba(255,255,255,.22);color:inherit;text-align:left;padding:clamp(14px,1.4vw,24px);display:grid;grid-template-rows:auto 1fr auto;cursor:pointer;transition:transform .25s,background .25s,border-color .25s}
.olive-speaker-card:hover,.olive-speaker-card:focus-visible{transform:translateY(-4px);background:rgba(206,189,116,.12);border-color:rgba(37,37,37,.5);outline:0}
.olive-speaker-card span{font:9px/1 Arial,sans-serif;letter-spacing:.14em;opacity:.48}
.olive-speaker-card strong{align-self:center;font:400 clamp(20px,1.65vw,30px)/1.05 "Noto Serif TC",serif}
.olive-speaker-card small{font-size:10px;opacity:.58;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.olive-preview{display:none}
@media(max-width:900px){.olive-home-stage{grid-template-columns:minmax(0,1.4fr) minmax(260px,.8fr)}.olive-speaker-grid{grid-template-columns:1fr}}
@media(max-width:760px){.olive-archive{width:calc(100vw - (2 * var(--ui-gutter)));padding-top:4vh}.olive-hero{display:block}.olive-intro{margin-top:22px}.olive-home-stage{display:flex;height:62svh;overflow-x:auto;scroll-snap-type:x mandatory;margin-right:calc(-1 * var(--ui-gutter));padding-right:18vw;gap:12px}.olive-feature{flex:0 0 86vw;scroll-snap-align:start}.olive-speaker-grid{flex:0 0 86vw;grid-template-columns:1fr 1fr;grid-template-rows:repeat(4,1fr);scroll-snap-align:start}.olive-feature__caption h2{font-size:clamp(42px,12vw,64px)}}
.olive-detail{min-height:90vh;margin-top:clamp(80px,9vw,160px);border-top:1px solid rgba(37,37,37,.3);padding-top:clamp(42px,5vw,82px);view-transition-name:olive-detail}
.olive-archive.is-detail .olive-hero,.olive-archive.is-detail .olive-index{opacity:.08;filter:blur(3px);transition:opacity .35s,filter .35s;pointer-events:none}
.olive-archive.is-detail .olive-preview{opacity:0!important}
.olive-archive.is-detail .olive-detail{position:relative;z-index:10}
.detail-close{border:0;background:none;padding:0 0 clamp(42px,5vw,76px);font:inherit;cursor:pointer}
.detail-close:focus-visible{outline:1px solid currentColor;outline-offset:6px}
.detail-lead{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(240px,.6fr);gap:clamp(30px,6vw,110px);align-items:end;padding-bottom:clamp(48px,6vw,96px)}
.detail-kicker{font:var(--ui-small)/1.2 Arial,sans-serif;letter-spacing:.14em}
.detail-title{font:400 clamp(52px,7vw,120px)/.9 "Noto Serif TC",serif;margin:.2em 0 0}
.detail-deck{font-size:var(--ui-body-lg);line-height:1.6;max-width:32em}
.detail-rule{display:flex;justify-content:space-between;border-top:1px solid rgba(37,37,37,.35);padding:14px 0;font:var(--ui-small)/1.2 Arial,sans-serif;letter-spacing:.12em}
.detail-list{list-style:none;margin:0;padding:0;border-bottom:1px solid rgba(37,37,37,.25)}
.detail-entry{display:grid;grid-template-columns:clamp(44px,6vw,92px) minmax(0,1fr) auto;gap:24px;align-items:baseline;padding:clamp(24px,3vw,48px) 0;border-top:1px solid rgba(37,37,37,.2);color:inherit;text-decoration:none}
.detail-entry__no{font:400 clamp(28px,3vw,52px)/1 "Cormorant Garamond",serif;opacity:.45}
.detail-entry h3{font:400 clamp(25px,2.3vw,44px)/1.18 "Noto Serif TC",serif;margin:0}
.detail-entry__meta{font-size:var(--ui-small);white-space:nowrap;opacity:.62}
.detail-entry:hover h3,.detail-entry:focus-visible h3{text-decoration:underline;text-underline-offset:.18em}
.detail-entry:focus-visible{outline:1px solid currentColor;outline-offset:6px}
::view-transition-old(olive-detail){animation:olive-out .24s ease both}::view-transition-new(olive-detail){animation:olive-in .46s cubic-bezier(.2,.75,.2,1) both}
@keyframes olive-in{from{opacity:0;transform:translateY(28px) scale(.985)}to{opacity:1;transform:none}}@keyframes olive-out{to{opacity:0;transform:translateY(-10px)}}
@media(prefers-reduced-motion:reduce){.olive-preview,.series-chip,.olive-archive.is-detail .olive-hero,.olive-archive.is-detail .olive-index{transition:none!important;transform:none!important;filter:none!important}::view-transition-old(olive-detail),::view-transition-new(olive-detail){animation:none!important}}
@media(max-width:1100px) and (min-width:761px){.person-row{flex-basis:54vw}.olive-preview{width:40vw}}
@media(max-width:760px){.olive-archive{width:calc(100vw - (2 * var(--ui-gutter)));padding-top:4vh;min-height:100svh;overflow:hidden}.olive-hero{height:auto;display:block}.olive-intro{margin-top:28px}.olive-index{height:62svh;min-height:430px;margin-top:26px;overflow:hidden}.olive-index-track{margin-right:calc(-1 * var(--ui-gutter));padding-right:18vw;gap:14px}.person-row,.person-row:first-child{flex-basis:84vw;height:100%;min-height:0;padding:26px 20px}.person-head h2{font-size:clamp(44px,12vw,66px)}.series-rail{gap:22px;scroll-snap-type:x proximity;mask-image:none}.series-chip{scroll-snap-align:start}.olive-preview{display:none}}
</style>

<script>
(() => {
  document.querySelectorAll('a.series-chip[href*="topic="]').forEach(link=>{
    link.addEventListener('click',e=>{
      if(e.metaKey||e.ctrlKey||e.shiftKey||e.altKey||link.target) return;
      if(!document.startViewTransition || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      e.preventDefault();
      link.style.viewTransitionName='olive-detail';
      document.startViewTransition(()=>location.assign(link.href));
    });
  });

  const q=new URLSearchParams(location.search), person=q.get('person'), topic=q.get('topic');
  const detail=document.querySelector('#olive-detail');
  const works={
    'jiang-xiuqin-goodtv-good-message':[
      ['承受美地為業的祕訣','https://www.youtube.com/watch?v=SeWck245iSE','道在人間'],
      ['追求認識神','https://www.youtube.com/watch?v=nelt0FmxwiA','道在人間'],
      ['興起發光 迎接復興浪潮','https://www.youtube.com/watch?v=4l-MLiv3Kto','道在人間']],
    'jiang-xiuqin-goodtv-forerunner-message':[['脫離努力 進入恩寵','https://www.youtube.com/watch?v=-esBfKgikXg','慕主先鋒信息']],
    'jiang-xiuqin-goodtv-rest':[['等候神好像沒什麼感覺？放掉努力進入神的安息！','https://www.youtube.com/watch?v=ZWGlQkGDgMU','進入神的安息美地']],
    'liu-tong-faith-legacy':[['信仰的傳承','https://www.youtube.com/watch?v=S2oKTZSziZ4','劉彤 · 2026']],
    'liu-tong-best-you':[['活出最好的你','https://www.youtube.com/watch?v=jczVDiJGC5Q','劉彤 · 2024']]
  };
  const people={'jiang-xiuqin':'江秀琴','lai-ruohan':'賴若瀚','liu-tong':'劉彤'};
  if(detail && people[person] && topic){
    document.querySelector('.olive-archive')?.classList.add('is-detail');
    const title=document.querySelector('[href*="topic='+CSS.escape(topic)+'"]')?.textContent.trim()||people[person];
    detail.hidden=false;
    const entries=works[topic]||[];
    detail.querySelector('.detail-kicker').textContent=people[person];
    detail.querySelector('.detail-title').textContent=title;
    detail.querySelector('.detail-deck').textContent=entries.length?'已核實內容。沿講次進入原始來源；完整系列優先整理，其餘先收錄代表信息。':'此系列已確認進入館藏；講次與原始來源正在逐項核實，不以未核實條目補足篇數。';
    detail.querySelector('.detail-count').textContent=entries.length?String(entries.length).padStart(2,'0'):'—';
    const list=detail.querySelector('.detail-list');
    entries.forEach(([name,url,meta],i)=>{
      const li=document.createElement('li');
      const a=document.createElement('a'); a.className='detail-entry'; a.href=url; a.target='_blank'; a.rel='noopener noreferrer';
      a.innerHTML='<span class="detail-entry__no">'+String(i+1).padStart(2,'0')+'</span><h3>'+name+'</h3><span class="detail-entry__meta">'+meta+' ↗</span>';
      li.append(a); list.append(li);
    });
    requestAnimationFrame(()=>detail.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'}));
    detail.querySelector('.detail-close').addEventListener('click',()=>{
      const leave=()=>history.length>1?history.back():location.assign('/olive/');
      if(document.startViewTransition && !matchMedia('(prefers-reduced-motion: reduce)').matches) document.startViewTransition(leave); else leave();
    });
  }
})();
</script>
{{ end }}
