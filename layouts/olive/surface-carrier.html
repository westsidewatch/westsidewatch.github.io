{{ define "main" }}
<article class="olive-archive" data-ws-color-family="sermon">

          <img class="olive-feature__poster" data-pawson-poster alt="" decoding="async" fetchpriority="high">

      <button class="olive-speaker-card olive-speaker-card--clone" aria-hidden="true" tabindex="-1" type="button" data-person="賴若瀚"><span>03</span><strong>賴若瀚</strong><small>十分釋經</small></button>
      <button class="olive-speaker-card olive-speaker-card--clone" aria-hidden="true" tabindex="-1" type="button" data-person="劉彤"><span>04</span><strong>劉彤</strong><small>信仰的傳承</small></button>
      <button class="olive-speaker-card olive-speaker-card--clone" aria-hidden="true" tabindex="-1" type="button" data-person="葉光明"><span>05</span><strong>葉光明</strong><small>中文事工</small></button>
      <button class="olive-speaker-card olive-speaker-card--clone" aria-hidden="true" tabindex="-1" type="button" data-person="倪柝聲"><span>06</span><strong>倪柝聲</strong><small>講道與出版</small></button>
      <button class="olive-speaker-card olive-speaker-card--clone" aria-hidden="true" tabindex="-1" type="button" data-person="康來昌"><span>07</span><strong>康來昌</strong><small>中文講道</small></button>
      <button class="olive-speaker-card olive-speaker-card--clone" aria-hidden="true" tabindex="-1" type="button" data-person="唐崇榮"><span>08</span><strong>唐崇榮</strong><small>中文講道</small></button>
      <button class="olive-speaker-card olive-speaker-card--clone" aria-hidden="true" tabindex="-1" type="button" data-person="寇紹恩"><span>09</span><strong>寇紹恩</strong><small>系列信息</small></button>
      <button class="olive-speaker-card olive-speaker-card--clone" aria-hidden="true" tabindex="-1" type="button" data-person="華理克"><span>10</span><strong>華理克</strong><small>中文講道</small></button>
      <button class="olive-speaker-card olive-speaker-card--clone" aria-hidden="true" tabindex="-1" type="button" data-person="于宏潔"><span>11</span><strong>于宏潔</strong><small>講道</small></button>
      <button class="olive-speaker-card olive-speaker-card--clone" aria-hidden="true" tabindex="-1" type="button" data-person="黃淑華"><span>12</span><strong>黃淑華</strong><small>講道</small></button>    </div>

</article>

<style>
.olive-archive{width:var(--comp-canvas);margin:auto;color:var(--ws-text);position:relative}
.olive-home-stage{height:calc(100svh - var(--site-header-height,42px));min-height:650px;position:relative;overflow:hidden;margin:0}
.olive-feature{position:absolute;inset:0 0 clamp(138px,16vh,190px) 0;z-index:1}
.olive-feature__media{position:absolute;inset:0;display:block;overflow:hidden;color:var(--ws-paper);text-decoration:none;background:var(--ws-olive)}
.olive-feature__art{position:absolute;inset:0;background:var(--ws-olive);overflow:hidden}
.olive-feature__poster,.olive-feature__youtube{position:absolute;left:50%;top:50%;width:100%;height:100%;min-width:100%;min-height:100%;border:0;transform:translate(-50%,-50%) scale(1.015)}
.olive-feature__poster{object-fit:cover;object-position:center;filter:saturate(var(--ws-image-sat,.86));transition:opacity .28s ease}
.olive-feature__youtube[hidden]{display:none}
.olive-feature__play{position:absolute;left:50%;top:50%;z-index:4;transform:translate(-50%,-50%);width:clamp(52px,4.5vw,74px);height:clamp(52px,4.5vw,74px);border:1px solid color-mix(in oklab,var(--ws-paper) 64%,transparent);border-radius:50%;background:color-mix(in oklab,var(--ws-olive) 72%,transparent);color:var(--ws-paper);display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(5px)}
.olive-feature__play span{font-size:clamp(16px,1.4vw,23px);margin-left:.15em}
.olive-feature.is-playing .olive-feature__poster,.olive-feature.is-playing .olive-feature__play,.olive-feature.is-playing .olive-feature__veil{opacity:0;pointer-events:none}
.olive-feature__veil{position:absolute;inset:0;background:linear-gradient(90deg,color-mix(in oklab,var(--ws-deep) 64%,transparent) 0,color-mix(in oklab,var(--ws-deep) 18%,transparent) 38%,color-mix(in oklab,var(--ws-deep) 5%,transparent) 68%,color-mix(in oklab,var(--ws-deep) 30%,transparent) 100%);pointer-events:none}
.olive-brand{position:absolute;left:clamp(30px,4.2vw,78px);top:clamp(34px,5vh,70px);display:grid;gap:10px;text-shadow:0 1px 20px color-mix(in oklab,var(--ws-shadow) 28%,transparent)}
.olive-brand small,.olive-feature__caption small{font:10px/1 Arial,sans-serif;letter-spacing:.18em}
.olive-brand h1{font:400 clamp(70px,8.4vw,154px)/.72 "Cormorant Garamond",Georgia,serif;letter-spacing:-.055em;margin:.08em 0 .02em}
.olive-brand>span{font:400 clamp(18px,1.5vw,27px)/1 "Noto Serif TC",serif}
.olive-feature__caption{position:absolute;left:clamp(30px,4.2vw,78px);bottom:clamp(38px,5vh,76px);display:grid;gap:8px;text-shadow:0 1px 18px color-mix(in oklab,var(--ws-shadow) 34%,transparent)}
.olive-feature__caption h2{font:400 clamp(44px,4.7vw,82px)/.9 "Noto Serif TC",serif;margin:.08em 0}
.olive-feature__caption p{font-size:var(--ui-body-lg);margin:0}
.olive-feature__caption i{font:normal 10px/1 Arial,sans-serif;letter-spacing:.14em;margin-left:18px}
.olive-speaker-rail{position:absolute;z-index:3;left:clamp(26%,31vw,38%);right:clamp(18px,2vw,34px);bottom:clamp(154px,18vh,214px);height:clamp(176px,20vh,226px);display:flex;gap:clamp(10px,1vw,16px);overflow-x:auto;overflow-y:hidden;scrollbar-width:none;overscroll-behavior-inline:contain;padding:0 18vw 8px 0}
.olive-speaker-rail::-webkit-scrollbar{display:none}
.olive-speaker-card{appearance:none;text-decoration:none;flex:0 0 clamp(240px,19vw,340px);border:1px solid color-mix(in oklab,var(--ws-paper) 46%,transparent);background:var(--ws-raised);color:var(--ws-paper);text-align:left;padding:clamp(16px,1.5vw,25px);display:grid;grid-template-rows:auto 1fr auto;cursor:pointer;position:relative;overflow:hidden;isolation:isolate;transition:transform .28s,filter .28s}
.olive-speaker-card:before{content:"";position:absolute;inset:0;z-index:-2;background-image:var(--preview,linear-gradient(135deg,color-mix(in oklab,var(--ws-olive) 72%,var(--ws-paper)),var(--ws-deep)));background-size:cover;background-position:center;transform:scale(1.02);transition:transform .45s ease}
.olive-speaker-card:after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,color-mix(in oklab,var(--ws-deep) 8%,transparent),color-mix(in oklab,var(--ws-deep) 16%,transparent) 38%,color-mix(in oklab,var(--ws-deep) 78%,transparent));pointer-events:none}
.olive-speaker-card:hover,.olive-speaker-card:focus-visible{transform:translateY(-8px);filter:brightness(1.06);outline:0}.olive-speaker-card:hover:before,.olive-speaker-card:focus-visible:before{transform:scale(1.07)}
.olive-speaker-card span{font:9px/1 Arial,sans-serif;letter-spacing:.16em;opacity:.72;position:relative;z-index:1}
.olive-speaker-card strong{align-self:center;font:400 clamp(25px,2vw,38px)/1.05 "Noto Serif TC",serif;position:relative;z-index:1}
.olive-speaker-card small{font-size:10px;opacity:.82;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative;z-index:1}
.olive-speaker-card--clone{pointer-events:none}
@media(prefers-reduced-motion:reduce){.olive-speaker-card{transition:none}}
@media(max-width:760px){.olive-home-stage{height:calc(100svh - var(--site-header-height,42px));min-height:620px;margin-right:calc(-1 * var(--ui-gutter))}.olive-feature{inset:0 0 128px 0}.olive-brand{left:24px;top:34px}.olive-brand h1{font-size:clamp(64px,20vw,96px)}.olive-feature__caption{left:24px;bottom:34px}.olive-feature__caption h2{font-size:clamp(40px,12vw,62px)}.olive-speaker-rail{left:24px;bottom:24px;height:138px;padding-right:22vw}.olive-speaker-card{flex-basis:58vw;padding:14px}}
</style>

<script>
(() => {
  const pawsonPool=[
    ['fizg-bxIjuY','舊約縱覽 · 創世記（一）'],
    ['jlHOgXhkEMo','舊約縱覽 · 出埃及記（一）'],
    ['YpBGW86YsYA','舊約縱覽 · 以斯帖記'],
    ['cabJrRVBt7E','舊約縱覽 · 但以理書（一）']
  ];
  const pawsonFrame=document.querySelector('[data-pawson-preview]');
  const pawsonPoster=document.querySelector('[data-pawson-poster]');
  const pawsonPlay=document.querySelector('[data-pawson-play]');
  const pawsonTitle=document.querySelector('[data-pawson-title]');
  if(pawsonFrame && pawsonPoster && pawsonPlay){
    const previous=Number(sessionStorage.getItem('olive-pawson-index'));
    let index=Number.isFinite(previous)?(previous+1)%pawsonPool.length:Math.floor(Math.random()*pawsonPool.length);
    sessionStorage.setItem('olive-pawson-index',String(index));
    const [videoId,label]=pawsonPool[index];
    const maxres='https://i.ytimg.com/vi/'+videoId+'/maxresdefault.jpg';
    const fallback='https://i.ytimg.com/vi/'+videoId+'/hqdefault.jpg';
    pawsonPoster.src=maxres;
    pawsonPoster.onerror=()=>{ if(pawsonPoster.src!==fallback) pawsonPoster.src=fallback; };
    pawsonPoster.alt=label;
    if(pawsonTitle) pawsonTitle.textContent=label;
    pawsonPlay.addEventListener('click',()=>{
      pawsonFrame.src='https://www.youtube-nocookie.com/embed/'+videoId+'?autoplay=1&rel=0&modestbranding=1';
      pawsonFrame.hidden=false;
      document.querySelector('.olive-feature')?.classList.add('is-playing');
    },{once:true});
  }

  const speakerRoutes={
    '江秀琴':'jiang-xiuqin','賴若瀚':'jerry-lai','劉彤':'tong-liu','葉光明':'derek-prince',
    '倪柝聲':'watchman-nee','康來昌':'kang-lai-chang','唐崇榮':'stephen-tong','寇紹恩':'kou-shao-en',
    '華理克':'rick-warren','于宏潔':'yu-hong-jie','黃淑華':'huang-shuhua'
  };
  document.querySelectorAll('.olive-speaker-card:not(.olive-speaker-card--clone)').forEach(card=>{
    const slug=speakerRoutes[card.dataset.person];
    if(!slug) return;
    card.addEventListener('click',()=>location.assign('/olive/?person='+encodeURIComponent(slug)));
  });

  const speakerRail=document.querySelector('.olive-speaker-rail');
  if(speakerRail){
    const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)');
    let last=performance.now(), boost=0, raf=0;
    const halfWidth=()=>speakerRail.scrollWidth/2;
    const normalize=()=>{
      const half=halfWidth();
      if(half>0 && speakerRail.scrollLeft>=half) speakerRail.scrollLeft-=half;
      else if(speakerRail.scrollLeft<0) speakerRail.scrollLeft+=half;
    };
    const tick=now=>{
      const dt=Math.min(40,now-last); last=now;
      if(!reduceMotion.matches){
        speakerRail.scrollLeft+=(0.018*dt)+boost;
        boost*=.88;
        normalize();
      }
      raf=requestAnimationFrame(tick);
    };
    raf=requestAnimationFrame(tick);
    speakerRail.addEventListener('wheel',e=>{
      if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){
        e.preventDefault();
        boost+=Math.max(-18,Math.min(18,e.deltaY*.11));
      }
    },{passive:false});
    speakerRail.addEventListener('scroll',normalize,{passive:true});
    window.addEventListener('pagehide',()=>cancelAnimationFrame(raf),{once:true});
  }
  document.querySelectorAll('a.series-chip[href*="topic="]').forEach(link=>{
    link.addEventListener('click',e=>{
      if(e.metaKey||e.ctrlKey||e.shiftKey||e.altKey||link.target) return;
      if(!document.startViewTransition || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      e.preventDefault();
      link.style.viewTransitionName='olive-detail';
      document.startViewTransition(()=>location.assign(link.href));
    });
  });

  const q=new URLSearchParams(location.search), person=q.get('person'), topic=q.get('topic');
  const detail=document.querySelector('#olive-detail');
  const works={
    'jiang-xiuqin-goodtv-good-message':[
      ['承受美地為業的祕訣','https://www.youtube.com/watch?v=SeWck245iSE','道在人間'],
      ['追求認識神','https://www.youtube.com/watch?v=nelt0FmxwiA','道在人間'],
      ['興起發光 迎接復興浪潮','https://www.youtube.com/watch?v=4l-MLiv3Kto','道在人間']],
    'jiang-xiuqin-goodtv-forerunner-message':[['脫離努力 進入恩寵','https://www.youtube.com/watch?v=-esBfKgikXg','慕主先鋒信息']],
    'jiang-xiuqin-goodtv-rest':[['等候神好像沒什麼感覺？放掉努力進入神的安息！','https://www.youtube.com/watch?v=ZWGlQkGDgMU','進入神的安息美地']],
    'liu-tong-faith-legacy':[['信仰的傳承','https://www.youtube.com/watch?v=S2oKTZSziZ4','劉彤 · 2026']],
    'liu-tong-best-you':[['活出最好的你','https://www.youtube.com/watch?v=jczVDiJGC5Q','劉彤 · 2024']]
  };
  const people={'jiang-xiuqin':'江秀琴','lai-ruohan':'賴若瀚','liu-tong':'劉彤'};
  if(detail && people[person] && topic){
    document.querySelector('.olive-archive')?.classList.add('is-detail');
    const title=document.querySelector('[href*="topic='+CSS.escape(topic)+'"]')?.textContent.trim()||people[person];
    detail.hidden=false;
    const entries=works[topic]||[];
    detail.querySelector('.detail-kicker').textContent=people[person];
    detail.querySelector('.detail-title').textContent=title;
    detail.querySelector('.detail-deck').textContent=entries.length?'已核實內容。沿講次進入原始來源；完整系列優先整理，其餘先收錄代表信息。':'此系列已確認進入館藏；講次與原始來源正在逐項核實，不以未核實條目補足篇數。';
    detail.querySelector('.detail-count').textContent=entries.length?String(entries.length).padStart(2,'0'):'—';
    const list=detail.querySelector('.detail-list');
    entries.forEach(([name,url,meta],i)=>{
      const li=document.createElement('li');
      const a=document.createElement('a'); a.className='detail-entry'; a.href=url; a.target='_blank'; a.rel='noopener noreferrer';
      a.innerHTML='<span class="detail-entry__no">'+String(i+1).padStart(2,'0')+'</span><h3>'+name+'</h3><span class="detail-entry__meta">'+meta+' ↗</span>';
      li.append(a); list.append(li);
    });
    requestAnimationFrame(()=>detail.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'}));
    detail.querySelector('.detail-close').addEventListener('click',()=>{
      const leave=()=>history.length>1?history.back():location.assign('/olive/');
      if(document.startViewTransition && !matchMedia('(prefers-reduced-motion: reduce)').matches) document.startViewTransition(leave); else leave();
    });
  }
})();
</script>
{{ end }}
