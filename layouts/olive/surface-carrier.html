<script>
(() => {
  // The hero is a video surface. Editorial portraits are fallbacks, never the primary preview.
  const featured=[
    {speaker:'大衛鮑森',slug:'david-pawson',id:'fizg-bxIjuY',title:'舊約縱覽 · 創世記（一）'},
    {speaker:'江秀琴',slug:'jiang-xiuqin',id:'ZWGlQkGDgMU',title:'進入神的安息美地'},
    {speaker:'大衛鮑森',slug:'david-pawson',id:'jlHOgXhkEMo',title:'舊約縱覽 · 出埃及記（一）'},
    {speaker:'劉彤',slug:'tong-liu',id:'S2oKTZSziZ4',title:'信仰的傳承'},
    {speaker:'大衛鮑森',slug:'david-pawson',id:'YpBGW86YsYA',title:'舊約縱覽 · 以斯帖記'},
    {speaker:'江秀琴',slug:'jiang-xiuqin',id:'SeWck245iSE',title:'承受美地為業的祕訣'},
    {speaker:'大衛鮑森',slug:'david-pawson',id:'cabJrRVBt7E',title:'舊約縱覽 · 但以理書（一）'},
    {speaker:'劉彤',slug:'tong-liu',id:'jczVDiJGC5Q',title:'活出最好的你'}
  ];
  const feature=document.querySelector('.olive-feature');
  const frame=document.querySelector('[data-pawson-preview]');
  const poster=document.querySelector('[data-pawson-poster]');
  const play=document.querySelector('[data-pawson-play]');
  const title=document.querySelector('[data-pawson-title]');
  const caption=feature?.querySelector('.olive-feature__caption h2');
  const next=document.querySelector('[data-feature-next]');
  const prev=document.querySelector('[data-feature-prev]');
  const source=document.querySelector('[data-feature-source]');
  const fallbackBase='/images/olive/';
  let index=0,previewGeneration=0;
  const imageExists=(url,callback)=>{
    const img=new Image();
    img.onload=()=>callback(img.naturalWidth>=480 && img.naturalHeight>=270);
    img.onerror=()=>callback(false);
    img.src=url;
  };
  const selectFeatured=(newIndex)=>{
    if(!feature||!poster||!frame||!play)return;
    index=(newIndex+featured.length)%featured.length;
    const item=featured[index],generation=++previewGeneration;
    feature.dataset.person=item.speaker;
    feature.classList.remove('is-playing');
    frame.hidden=true;
    frame.removeAttribute('src');
    frame.title=item.speaker+' · '+item.title;
    if(title)title.textContent=item.title;
    if(caption)caption.textContent=item.speaker;
    if(source){source.href='https://www.youtube.com/watch?v='+item.id;source.setAttribute('aria-label','在 YouTube 觀看'+item.speaker+' · '+item.title);}
    play.setAttribute('aria-label','播放'+item.speaker+' · '+item.title);
    const fallback=fallbackBase+item.slug+'-editorial.png';
    poster.style.backgroundImage='url('+JSON.stringify(fallback)+')';
    poster.style.backgroundSize='contain';
    poster.style.backgroundPosition='center';
    poster.style.backgroundRepeat='no-repeat';
    // YouTube sometimes serves a tiny 120×90 placeholder with HTTP 200. Reject it.
    const max='https://i.ytimg.com/vi/'+item.id+'/maxresdefault.jpg';
    const hq='https://i.ytimg.com/vi/'+item.id+'/hqdefault.jpg';
    const applyThumbnail=url=>{
      if(generation!==previewGeneration)return;
      poster.style.backgroundImage='url('+JSON.stringify(url)+')';
      poster.style.backgroundSize='contain';
      poster.dataset.previewSource='video';
    };
    poster.dataset.previewSource='fallback';
    imageExists(fallback,available=>{if(generation===previewGeneration&&!available&&poster.dataset.previewSource==='fallback'){poster.style.removeProperty('background-image');poster.dataset.previewSource='gradient';}});
    imageExists(max,ok=>{
      if(generation!==previewGeneration)return;
      if(ok)applyThumbnail(max);
      else imageExists(hq,available=>{if(available)applyThumbnail(hq);});
    });
  };
  if(feature&&frame&&poster&&play){
    selectFeatured(0);
    play.addEventListener('click',()=>{
      const item=featured[index];
      frame.src='https://www.youtube-nocookie.com/embed/'+item.id+'?autoplay=1&rel=0';
      frame.hidden=false;
      feature.classList.add('is-playing');
    });
    next?.addEventListener('click',()=>selectFeatured(index+1));
    prev?.addEventListener('click',()=>selectFeatured(index-1));
    feature.addEventListener('keydown',event=>{
      if(event.target?.tagName==='IFRAME')return;
      if(event.key==='ArrowRight'){event.preventDefault();selectFeatured(index+1);}
      if(event.key==='ArrowLeft'){event.preventDefault();selectFeatured(index-1);}
    });
    document.addEventListener('visibilitychange',()=>{if(document.hidden && !frame.hidden){frame.removeAttribute('src');frame.hidden=true;feature.classList.remove('is-playing');}});
  }

  const speakerRoutes={
    '江秀琴':'jiang-xiuqin','賴若瀚':'jerry-lai','劉彤':'tong-liu','葉光明':'derek-prince',
    '倪柝聲':'watchman-nee','康來昌':'kang-lai-chang','唐崇榮':'stephen-tong','寇紹恩':'kou-shao-en',
    '華理克':'rick-warren','于宏潔':'yu-hong-jie','黃淑華':'huang-shuhua'
  };
  document.querySelectorAll('.olive-speaker-card:not(.olive-speaker-card--clone)').forEach(card=>{
    const slug=speakerRoutes[card.dataset.person];
    if(!slug)return;
    card.dataset.doreSurface='speaker-card';
    card.dataset.doreSpeaker=slug;
    card.dataset.doreIdentitySynthesis='false';
    card.addEventListener('click',()=>location.assign('/olive/'+slug+'/'));
  });

  const speakerRail=document.querySelector('.olive-speaker-rail');
  if(speakerRail){
    const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)');
    let last=performance.now(), boost=0, raf=0;
    const halfWidth=()=>speakerRail.scrollWidth/2;
    const normalize=()=>{
      const half=halfWidth();
      if(half>0 && speakerRail.scrollLeft>=half) speakerRail.scrollLeft-=half;
      else if(speakerRail.scrollLeft<0) speakerRail.scrollLeft+=half;
    };
    const tick=now=>{
      const dt=Math.min(40,now-last); last=now;
      if(!reduceMotion.matches){
        speakerRail.scrollLeft+=(0.018*dt)+boost;
        boost*=.88;
        normalize();
      }
      raf=requestAnimationFrame(tick);
    };
    raf=requestAnimationFrame(tick);
    speakerRail.addEventListener('wheel',e=>{
      if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){
        e.preventDefault();
        boost+=Math.max(-18,Math.min(18,e.deltaY*.11));
      }
    },{passive:false});
    speakerRail.addEventListener('scroll',normalize,{passive:true});
    window.addEventListener('pagehide',()=>cancelAnimationFrame(raf),{once:true});
  }
  document.querySelectorAll('a.series-chip[href*="topic="]').forEach(link=>{
    link.addEventListener('click',e=>{
      if(e.metaKey||e.ctrlKey||e.shiftKey||e.altKey||link.target) return;
      if(!document.startViewTransition || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      e.preventDefault();
      link.style.viewTransitionName='olive-detail';
      document.startViewTransition(()=>location.assign(link.href));
    });
  });

  const q=new URLSearchParams(location.search), person=q.get('person'), topic=q.get('topic');
  const verifiedSpeakerChannels={'jiang-xiuqin':{label:'江秀琴',entries:[
    ['內在生活 45 講','45 講系列','/olive/?person=jiang-xiuqin&topic=jiang-xiuqin-inner-life-45'],
    ['道在人間 · 江秀琴','GOOD TV','/olive/?person=jiang-xiuqin&topic=jiang-xiuqin-goodtv-good-message'],
    ['慕主先鋒信息','GOOD TV','/olive/?person=jiang-xiuqin&topic=jiang-xiuqin-goodtv-forerunner-message'],
    ['進入神的安息美地','GOOD TV','/olive/?person=jiang-xiuqin&topic=jiang-xiuqin-goodtv-rest']
  ]}};
  const renderSpeakerChannel=(slug)=>{
    const channel=verifiedSpeakerChannels[slug];
    if(!channel) return;
    const stage=document.querySelector('.olive-home-stage');
    if(!stage || stage.querySelector('.olive-speaker-channel')) return;
    const section=document.createElement('section'); section.className='olive-speaker-channel';
    section.setAttribute('aria-label',channel.label+'講員頻道');
    section.innerHTML='<p class="olive-speaker-channel__eyebrow">VERIFIED SERIES</p><h2>'+channel.label+'</h2><div class="olive-speaker-channel__list"></div>';
    const list=section.querySelector('.olive-speaker-channel__list');
    channel.entries.forEach(([name,meta,url])=>{const a=document.createElement('a');a.className='olive-speaker-channel__entry';a.href=url;a.innerHTML='<strong>'+name+'</strong><span>'+meta+' →</span>';list.append(a);});
    stage.append(section);
  };
  const personNames={
    'jiang-xiuqin':'江秀琴','jerry-lai':'賴若瀚','tong-liu':'劉彤','derek-prince':'葉光明',
    'watchman-nee':'倪柝聲','kang-lai-chang':'康來昌','stephen-tong':'唐崇榮','kou-shao-en':'寇紹恩',
    'rick-warren':'華理克','yu-hong-jie':'于宏潔','huang-shuhua':'黃淑華'
  };
  if(person && personNames[person] && !topic){
    const selected=document.querySelector('.olive-speaker-card[data-person="'+CSS.escape(personNames[person])+'"]');
    if(selected){
      selected.setAttribute('aria-current','true');
      selected.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',inline:'center',block:'nearest'});
    }
    const caption=document.querySelector('.olive-feature__caption h2');
    const title=document.querySelector('[data-pawson-title]');
    if(caption) caption.textContent=personNames[person];
    if(title) title.textContent=verifiedSpeakerChannels[person]?'講員頻道 · 已核實系列':'講員頻道';
    renderSpeakerChannel(person);
  }
  const detail=document.querySelector('#olive-detail');
  const works={
    'jiang-xiuqin-goodtv-good-message':[
      ['承受美地為業的祕訣','https://www.youtube.com/watch?v=SeWck245iSE','道在人間'],
      ['追求認識神','https://www.youtube.com/watch?v=nelt0FmxwiA','道在人間'],
      ['興起發光 迎接復興浪潮','https://www.youtube.com/watch?v=4l-MLiv3Kto','道在人間']],
    'jiang-xiuqin-goodtv-forerunner-message':[['脫離努力 進入恩寵','https://www.youtube.com/watch?v=-esBfKgikXg','慕主先鋒信息']],
    'jiang-xiuqin-goodtv-rest':[['等候神好像沒什麼感覺？放掉努力進入神的安息！','https://www.youtube.com/watch?v=ZWGlQkGDgMU','進入神的安息美地']],
    'liu-tong-faith-legacy':[['信仰的傳承','https://www.youtube.com/watch?v=S2oKTZSziZ4','劉彤 · 2026']],
    'liu-tong-best-you':[['活出最好的你','https://www.youtube.com/watch?v=jczVDiJGC5Q','劉彤 · 2024']]
  };
  const people={'jiang-xiuqin':'江秀琴','lai-ruohan':'賴若瀚','liu-tong':'劉彤'};
  if(detail && people[person] && topic){
    document.querySelector('.olive-archive')?.classList.add('is-detail');
    const title=document.querySelector('[href*="topic='+CSS.escape(topic)+'"]')?.textContent.trim()||people[person];
    detail.hidden=false;
    const entries=works[topic]||[];
    detail.querySelector('.detail-kicker').textContent=people[person];
    detail.querySelector('.detail-title').textContent=title;
    detail.querySelector('.detail-deck').textContent=entries.length?'已核實內容。沿講次進入原始來源；完整系列優先整理，其餘先收錄代表信息。':'此系列已確認進入館藏；講次與原始來源正在逐項核實，不以未核實條目補足篇數。';
    detail.querySelector('.detail-count').textContent=entries.length?String(entries.length).padStart(2,'0'):'—';
    const list=detail.querySelector('.detail-list');
    entries.forEach(([name,url,meta],i)=>{
      const li=document.createElement('li');
      const a=document.createElement('a'); a.className='detail-entry'; a.href=url; a.target='_blank'; a.rel='noopener noreferrer';
      a.innerHTML='<span class="detail-entry__no">'+String(i+1).padStart(2,'0')+'</span><h3>'+name+'</h3><span class="detail-entry__meta">'+meta+' ↗</span>';
      li.append(a); list.append(li);
    });
    requestAnimationFrame(()=>detail.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'}));
    detail.querySelector('.detail-close').addEventListener('click',()=>{
      const leave=()=>history.length>1?history.back():location.assign('/olive/');
      if(document.startViewTransition && !matchMedia('(prefers-reduced-motion: reduce)').matches) document.startViewTransition(leave); else leave();
    });
  }
})();
</script>
<script src="/js/olive-editorial-rail.js?v=20261009-v1" defer></script>
<script src="/js/olive-journey.js?v=20261009-v1" defer></script>
