{{ define "main" }}
<section class="dawn-library-brand" aria-labelledby="dawn-library-title">
  <header class="dawn-library-brand__header">
    <p class="section-label">Westside Watch · Dawn Library</p>
    <h1 id="dawn-library-title" lang="zh-Hant">黎明書局</h1>
    <p class="dawn-library-brand__dek">Theology · Scripture · Inner Life</p>
    <p lang="zh-Hant">館藏身份仍由 Dawn canonical substrate 統一管理；封面與書架重新作為正式前台投射，不再把工程驗收介面暴露給讀者。</p>
  </header>
  <div class="dawn-library-brand__frame-wrap">
    <iframe id="dawn-library-product-surface" class="dawn-library-brand__frame" src="{{ "dawn-library/product/" | relURL }}" title="黎明書局館藏" loading="eager"></iframe>
  </div>
</section>
<style>
  .dawn-library-brand{width:min(1500px,96vw);margin:0 auto;padding:clamp(2rem,5vw,5rem) 0 4rem;color:#30291d}
  .dawn-library-brand__header{max-width:880px;margin:0 auto clamp(1.5rem,3vw,2.75rem);text-align:center;padding:0 1rem;animation:dawn-arrive .8s cubic-bezier(.22,.7,0,1) both}
  .dawn-library-brand__header h1{margin:.15em 0;font-family:'Cormorant Garamond','Noto Sans TC',sans-serif;font-size:clamp(3.6rem,9vw,8rem);font-weight:500;letter-spacing:.02em;line-height:.84}
  .dawn-library-brand__dek{font-family:'Cormorant Garamond',serif;font-size:clamp(1.1rem,2vw,1.5rem);letter-spacing:.16em;text-transform:uppercase;color:#8c6818}
  .dawn-library-brand__header>p:last-child{font-family:'Noto Sans TC',sans-serif;line-height:1.9;color:#59534a}
  .dawn-library-brand__frame-wrap{position:relative;overflow:hidden;border-top:1px solid rgba(162,135,42,.72);background:#e8dbb8;box-shadow:0 24px 70px rgba(64,48,22,.1);animation:dawn-arrive .9s .13s cubic-bezier(.22,.7,0,1) both}
  .dawn-library-brand__frame-wrap::before{position:absolute;inset:0;z-index:1;pointer-events:none;content:"";background:linear-gradient(115deg,rgba(210,188,105,.16),transparent 42%)}
  .dawn-library-brand__frame{display:block;position:relative;z-index:0;width:100%;height:1200px;min-height:760px;border:0;background:#e8dbb8}
  @keyframes dawn-arrive{from{opacity:0;transform:translateY(1.5rem)}to{opacity:1;transform:none}}
  @media(max-width:700px){.dawn-library-brand{width:100%;padding-top:1.5rem}.dawn-library-brand__frame{min-height:900px;height:1200px}}
  @media(prefers-reduced-motion:reduce){.dawn-library-brand__header,.dawn-library-brand__frame-wrap{animation:none}}
</style>
{{ end }}
