{{ define "main" }}
<article class="olive-editorial" data-surface="OliveMountain" aria-labelledby="olive-editorial-title">
  <div class="olive-editorial__spread" data-align="{{ .Params.portrait_align | default "right" }}" style="--poster-x:{{ .Params.portrait_text_x | default 55 }}%;--poster-width:{{ .Params.portrait_text_width | default 40 }}%;--poster-size:{{ .Params.portrait_text_size | default 8 }}cqw">
    <figure class="olive-editorial__portrait">
      {{ with .Params.portrait_image }}<img src="{{ . | relURL }}" alt="{{ $.Params.portrait_alt | default "Editorial portrait" }}" loading="eager">{{ end }}
    </figure>
    <div class="olive-editorial__type">
      <h1 id="olive-editorial-title">{{ range .Params.portrait_title }}<span>{{ . }}</span>{{ end }}</h1>
      <p class="olive-editorial__zh" lang="zh-Hant">{{ .Params.portrait_name }}</p>
      {{ with .Params.channel_url }}<a class="olive-editorial__channel" href="{{ . | relURL }}">講道與系列 →</a>{{ end }}
    </div>
  </div>
</article>
<style>
/* Coordinates are measured against the uncropped artwork, including on mobile. */
.olive-editorial{box-sizing:border-box;background:var(--ws-paper,#F5F1E8);color:var(--ws-olive,#174B35);padding:clamp(12px,2vw,28px)}
.olive-editorial__spread{position:relative;container-type:inline-size;width:min(100%,780px);margin-inline:auto;isolation:isolate}
.olive-editorial__portrait{margin:0;display:block}
.olive-editorial__portrait img{display:block;width:100%;height:auto}
.olive-editorial__type{position:absolute;z-index:1;top:5%;left:var(--poster-x);width:var(--poster-width);text-align:left}
.olive-editorial__spread[data-align="right"] .olive-editorial__type{text-align:right}
.olive-editorial .olive-editorial__type h1{font-family:var(--ws-type-display-en,"Bodoni Moda",serif);font-weight:400;font-synthesis:none;font-size:calc(var(--poster-size) * var(--poster-fit,1));letter-spacing:-.045em;line-height:.95;color:var(--ws-olive,#174B35);margin:0;text-transform:uppercase;overflow-wrap:normal}
.olive-editorial__type h1 span{display:block;white-space:nowrap}
.olive-editorial .olive-editorial__zh{font-family:var(--ws-type-display-zh);font-weight:var(--ws-olive-speaker-name-weight,200);font-size:3cqw;line-height:1.3;letter-spacing:.12em;margin:2cqw 0 0;color:inherit}
.olive-editorial__channel{display:inline-block;font-family:var(--ws-type-display-zh);font-size:1.7cqw;line-height:1.4;margin-top:1.5cqw;color:inherit;text-decoration:none}
.olive-editorial__channel:hover{text-decoration:underline}
.olive-editorial__channel:focus-visible{outline:2px solid currentColor;outline-offset:3px}
</style>
<script>
(() => {
  const poster=document.querySelector('.olive-editorial__spread');
  const title=poster?.querySelector('h1');
  if(!title)return;
  const fit=()=>{
    poster.style.setProperty('--poster-fit','1');
    const width=title.getBoundingClientRect().width;
    const longest=Math.max(...Array.from(title.children,span=>{
      const range=document.createRange();range.selectNodeContents(span);
      return range.getBoundingClientRect().width;
    }));
    if(longest>width)poster.style.setProperty('--poster-fit',String(width/longest));
  };
  new ResizeObserver(fit).observe(poster);
  document.fonts.ready.then(fit);
})();
</script>
{{ end }}
