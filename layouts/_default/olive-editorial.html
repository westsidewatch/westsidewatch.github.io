{{ define "main" }}
<article class="olive-editorial" data-surface="OliveMountain" aria-labelledby="olive-editorial-title">
  <header class="olive-editorial__folio"><span>WESTSIDE WATCH / OLIVE MOUNTAIN</span><span>人物 / PORTRAIT</span></header>
  <div class="olive-editorial__spread">
    <figure class="olive-editorial__portrait">
      {{ with .Params.portrait_image }}<img src="{{ . | relURL }}" alt="{{ $.Params.portrait_alt | default "David Pawson editorial portrait" }}" loading="eager">{{ else }}<div class="olive-editorial__asset-pending" role="status">Portrait artwork pending repository asset</div>{{ end }}
    </figure>
    <div class="olive-editorial__type">
      <p class="olive-editorial__eyebrow">OLIVE MOUNTAIN / PEOPLE</p>
      <h1 id="olive-editorial-title">{{ range (.Params.portrait_title | default (slice "DAVID" "PAWSON")) }}<span>{{ . }}</span>{{ end }}</h1>
      <p class="olive-editorial__zh" lang="zh-Hant">{{ .Params.portrait_name | default "大衛鮑森" }}</p>
      <p class="olive-editorial__sub">TEACHING · SCRIPTURE · FAITH</p>
    </div>
  </div>
  <footer class="olive-editorial__foot"><span>WESTSIDE WATCH</span><span>THE OLIVE MOUNTAIN</span></footer>
</article>
<style>
.olive-editorial{--olive:#174B35;--accent:#A65F4B;--paper:#F5F1E8;background:var(--paper);color:var(--olive);min-height:100svh;overflow:hidden;padding:clamp(18px,2.5vw,40px);font-family:"Noto Serif TC",serif}
.olive-editorial__folio,.olive-editorial__foot{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--accent);padding-top:12px;font-size:10px;letter-spacing:.18em}
.olive-editorial__folio span:last-child,.olive-editorial__foot{color:var(--accent)}
.olive-editorial__spread{position:relative;min-height:min(84vw,940px);display:grid;grid-template-columns:61% 39%;align-items:center}
.olive-editorial__portrait{margin:0;align-self:stretch;min-height:700px;position:relative;overflow:hidden}
.olive-editorial__portrait img{width:100%;height:100%;object-fit:cover;object-position:25% center;display:block}
.olive-editorial__asset-pending{display:grid;place-items:center;height:100%;min-height:700px;border:1px dashed var(--olive);font-size:12px;letter-spacing:.08em}
.olive-editorial__type{position:relative;z-index:2;margin-left:-16%;padding:20px 0;pointer-events:none}
.olive-editorial__eyebrow,.olive-editorial__sub{font-size:11px;letter-spacing:.22em;color:var(--accent)}
.olive-editorial h1{font-family:"Bodoni Moda",Didot,serif;font-weight:400;font-size:clamp(74px,11vw,200px);letter-spacing:-.075em;line-height:.79;color:var(--accent);margin:clamp(35px,6vw,100px) 0 24px}
.olive-editorial h1 span{display:block}.olive-editorial__zh{font-weight:200;letter-spacing:.38em;font-size:clamp(18px,2vw,30px);margin:0 0 42px}
@media(max-width:760px){.olive-editorial{padding:16px}.olive-editorial__spread{display:block;min-height:0}.olive-editorial__portrait{min-height:0;height:64svh;margin:24px -16px 0}.olive-editorial__portrait img{object-position:20% center}.olive-editorial__type{margin:-9svh 0 35px;padding:0 5px}.olive-editorial h1{font-size:clamp(65px,17vw,130px);margin:26px 0 22px}.olive-editorial__zh{font-size:20px}.olive-editorial__folio,.olive-editorial__foot{font-size:9px}}
</style>
{{ end }}
