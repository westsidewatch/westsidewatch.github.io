{{ define "main" }}
  <article class="portal">
    <nav class="breadcrumb" aria-label="Breadcrumb">
      <a href="{{ site.Home.RelPermalink }}">Home</a>
      <span aria-hidden="true">/</span>
      <span aria-current="page">{{ .Title }}</span>
    </nav>
    <header class="portal__header">
      <p class="kicker">Westside Watch</p>
      <h1>{{ .Title }}</h1>
      {{ with .Description }}<p class="volume__description">{{ . }}</p>{{ end }}
    </header>
    <div class="portal-grid">
      {{ range .Pages.ByWeight }}
        <a class="portal-card" href="{{ .RelPermalink }}">
          <span class="portal-card__number">{{ printf "%02d" .Weight }}</span>
          <strong>{{ .Title }}</strong>
          {{ with .Params.subtitle }}<span class="portal-card__subtitle">{{ . }}</span>{{ end }}
          {{ with .Description }}<p>{{ . }}</p>{{ end }}
          <span class="portal-card__arrow" aria-hidden="true">→</span>
        </a>
      {{ end }}
    </div>
  </article>
{{ end }}
