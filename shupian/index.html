<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>薯片 / Cinema Reale</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Libre+Baskerville:ital,wght@0,400;1,400&family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap" rel="stylesheet"><style>:root{--paper:#f4f1eb;--ink:#242320;--muted:#79756e;--line:#d4d0c7;--accent:#b93430}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'DM Sans','Noto Sans TC',sans-serif}header{padding:22px 4vw;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--ink)}.brand{font:900 29px 'Noto Sans TC',sans-serif;letter-spacing:-.09em}.brand span{color:var(--accent)}.small{font-size:10px;letter-spacing:.14em;font-weight:700}.hero{padding:55px 4vw 48px;display:grid;grid-template-columns:2fr 1fr;border-bottom:1px solid var(--ink);gap:25px}.eyebrow{color:var(--accent);font-size:11px;letter-spacing:.22em;font-weight:700}.hero h1{font:400 clamp(64px,12vw,180px)/.95 'Libre Baskerville',serif;letter-spacing:-.075em;margin:19px 0 0}.hero em{color:var(--accent)}.hero aside{font-size:13px;line-height:1.9;align-self:end;max-width:320px;margin-left:auto}.hero aside strong{font-size:11px;letter-spacing:.1em}.bar{padding:18px 4vw;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:20px;align-items:center}.filters{display:flex;gap:20px;flex-wrap:wrap}button{cursor:pointer;background:none;border:0;padding:5px 0;font:600 12px 'DM Sans','Noto Sans TC',sans-serif;color:var(--muted)}button.active{color:var(--accent);box-shadow:0 2px var(--accent)}input{border:0;border-bottom:1px solid var(--ink);outline:0;background:transparent;padding:7px;font-size:13px}main{padding:27px 4vw 90px}.section{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--ink);margin-bottom:24px;padding-bottom:13px}.section h2{font:400 30px 'Libre Baskerville',serif;margin:0}.section h2 i{color:var(--accent)}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:34px 17px}.poster{position:relative;aspect-ratio:2/3;background:#dfdad0;overflow:hidden}.poster img{display:block;width:100%;height:100%;object-fit:cover;filter:saturate(.9);transition:transform .35s}.item:hover img{transform:scale(1.045)}.placeholder{position:absolute;inset:0;padding:15px;display:flex;align-items:flex-end;font:400 clamp(18px,2.5vw,34px)/1.2 'Libre Baskerville','Noto Sans TC',serif}.placeholder small{position:absolute;top:16px;left:15px;font:11px 'DM Sans',sans-serif}.poster.has-image .placeholder{display:none}.tag{position:absolute;right:8px;bottom:8px;background:var(--accent);color:#fff;font-size:10px;font-weight:700;padding:5px 8px}.meta h3{font-size:14px;margin:11px 0 4px}.en{font:italic 12px 'Libre Baskerville',serif;color:var(--muted);min-height:15px}.status{font-size:10px;margin-top:9px;color:var(--muted)}.status.pass{color:var(--accent)}footer{border-top:1px solid var(--ink);padding:25px 4vw 50px;color:var(--muted);font-size:11px;display:flex;justify-content:space-between}@media(max-width:900px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:650px){.hero{grid-template-columns:1fr}.hero aside{margin:0}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:30px 12px}.bar{display:block}.filters{margin-bottom:13px}input{width:100%}footer{display:block}.section h2{font-size:23px}}</style></head><body><header><div class="brand">薯<span>片</span></div><div class="small">CINEMA ARCHIVE / 2026</div></header><section class="hero"><div><div class="eyebrow">FILM / TELEVISION / ARCHIVE</div><h1>Cinema<br><em>reale.</em></h1></div><aside><strong>薯片 / THE CINEMA INDEX</strong><p>以義大利紀實電影的編輯語言，重新呈現電影與劇集。歷史收錄與播放驗收狀態分開記錄。</p><em>Stories, images, memory.</em></aside></section><nav class="bar"><div class="filters"><button class="active" data-filter="all">全部 ALL</button><button data-filter="film">電影 FILMS</button><button data-filter="series">劇集 SERIES</button><button data-filter="verified">歷史抽驗通過</button></div><input id="search" placeholder="搜尋片名 / Search" aria-label="搜尋"></nav><main><div class="section"><h2>Selected works <i>/</i> 典藏作品</h2><span id="total" class="small"></span></div><div id="grid" class="grid"></div></main><footer><span>薯片 © 2026 · CINEMA ARCHIVE</span><span>HISTORICAL CATALOGUE ≠ VERIFIED CURRENT STREAM</span></footer><script>
const works=[
{zh:'異能研究所',en:'',type:'series',episodes:'S1 8集 · S2 2集',verified:true},
{zh:'黑鏡',en:'Black Mirror',type:'series',episodes:'S1 · 3集',wiki:'Black Mirror'},
{zh:'神探夏洛克',en:'Sherlock',type:'series',episodes:'S1 · 3集',wiki:'Sherlock (TV series)'},
{zh:'千與千尋',en:'Spirited Away',type:'film',year:2001,wiki:'Spirited Away'},
{zh:'盜夢空間',en:'Inception',type:'film',year:2010,wiki:'Inception'},
{zh:'刺激1995',en:'The Shawshank Redemption',type:'film',year:1994,wiki:'The Shawshank Redemption'},
{zh:'阿甘正傳',en:'Forrest Gump',type:'film',year:1994,wiki:'Forrest Gump'},
{zh:'駭客任務',en:'The Matrix',type:'film',year:1999,wiki:'The Matrix'},
{zh:'黑色追緝令',en:'Pulp Fiction',type:'film',year:1994,wiki:'Pulp Fiction'},
{zh:'鐵達尼號',en:'Titanic',type:'film',year:1997,wiki:'Titanic (1997 film)'},
{zh:'辛德勒的名單',en:"Schindler's List",type:'film',year:1993,wiki:"Schindler's List"},
{zh:'新天堂樂園',en:'Cinema Paradiso',type:'film',year:1988,wiki:'Cinema Paradiso'},
{zh:'星際效應',en:'Interstellar',type:'film',year:2014,wiki:'Interstellar (film)'},
{zh:'楚門的世界',en:'The Truman Show',type:'film',year:1998,wiki:'The Truman Show'}];
let filter='all';const grid=document.getElementById('grid'), search=document.getElementById('search');const posterCache={};
function render(){let x=works.filter(w=>(filter==='all'||(filter==='verified'?w.verified:w.type===filter))&&(w.zh+' '+w.en+' '+(w.year||'')).toLowerCase().includes(search.value.toLowerCase()));document.getElementById('total').textContent=x.length+' TITLES';grid.replaceChildren();for(const w of x){const card=document.createElement('article');card.className='item';const poster=document.createElement('div');poster.className='poster';const ph=document.createElement('div');ph.className='placeholder';const small=document.createElement('small');small.textContent='ARCHIVE / '+String(works.indexOf(w)+1).padStart(3,'0');ph.append(small,document.createTextNode(w.zh));poster.append(ph);if(posterCache[w.wiki]){const img=document.createElement('img');img.src=posterCache[w.wiki];img.alt=w.zh+' 海報';img.loading='lazy';img.onerror=()=>{poster.classList.remove('has-image');img.remove()};poster.append(img);poster.classList.add('has-image')}if(w.verified){const badge=document.createElement('span');badge.className='tag';badge.textContent='ARCHIVE PASS';poster.append(badge)}const meta=document.createElement('div');meta.className='meta';const name=document.createElement('h3');name.textContent=w.zh;const en=document.createElement('div');en.className='en';en.textContent=w.en||'—';const status=document.createElement('div');status.className='status'+(w.verified?' pass':'');status.textContent=w.verified?'此前抽樣驗收通過':(w.episodes||w.year||'')+' · 舊庫收錄紀錄';meta.append(name,en,status);card.append(poster,meta);grid.append(card)}}
document.querySelectorAll('[data-filter]').forEach(btn=>btn.onclick=()=>{filter=btn.dataset.filter;document.querySelectorAll('[data-filter]').forEach(b=>b.classList.toggle('active',b===btn));render()});search.addEventListener('input',render);render();
async function fetchPosters(){for(const w of works.filter(w=>w.wiki)){try{const url='https://en.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(w.wiki);const r=await fetch(url);if(!r.ok)continue;const j=await r.json();if(j.originalimage?.source){posterCache[w.wiki]=j.originalimage.source;render()}else if(j.thumbnail?.source){posterCache[w.wiki]=j.thumbnail.source;render()}}catch(e){}}}fetchPosters();
</script></body></html>
