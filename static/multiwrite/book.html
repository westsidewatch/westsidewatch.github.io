<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>多寫 · 書稿</title>
  <link rel="stylesheet" href="./styles.css?v=20260904-4">
  <link rel="stylesheet" href="./book.css?v=20260904-7">
</head>
<body class="book-shell">
  <header class="book-topbar">
    <a class="book-back" id="homeLink" href="/multiwrite/">← 我的書</a>
    <div class="book-size" aria-label="閱讀大小">
      <button id="sizeDown" class="size-button" type="button" title="縮小工作區">A−</button>
      <button id="sizeReset" class="size-label" type="button" title="恢復自動大小"><span id="workspaceSizeLabel">自動</span></button>
      <button id="sizeUp" class="size-button" type="button" title="放大工作區">A＋</button>
    </div>
    <div class="book-actions">
      <span id="saveState" class="save-state">載入中</span>
      <button id="toggleEdit" class="book-action" type="button" disabled>編輯</button>
      <button id="saveDraft" class="book-action primary" type="button" hidden>儲存</button>
    </div>
    <div class="book-brand">多寫 · MULTIWRITE</div>
  </header>

  <main class="book-layout">
    <aside class="book-sidebar">
      <div class="book-title-wrap">
        <div class="book-kicker">IMPORTED MANUSCRIPT</div>
        <h1 id="bookTitle">載入中…</h1>
        <p id="bookSubtitle"></p>
      </div>
      <nav id="toc" class="book-toc" aria-label="章節目錄"></nav>
    </aside>

    <section class="book-reader">
      <article id="readerContent" class="reader-paper">
        <p class="reader-loading">正在載入書稿…</p>
      </article>
    </section>
  </main>

  <script type="module" src="./book.js?v=20260904-9"></script>
</body>
</html>
