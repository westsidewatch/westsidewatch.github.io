<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>P2 SVG performance isolation — diagnostic only</title>
<style>body{font:14px system-ui;margin:20px;background:#f4f1e9;color:#222}button{padding:9px 16px}iframe{width:min(100%,1000px);height:600px;border:1px solid #777}pre{white-space:pre-wrap;max-height:300px;overflow:auto}table{border-collapse:collapse}td,th{padding:7px;border:1px solid #aaa}</style>
<h1>P2 SVG performance isolation</h1><p>Diagnostic only; does not modify normal animation. Run each mode on the same browser and machine. Results are approximate RAF intervals, not a substitute for Chrome Performance tracing.</p>
<button id="run">Run four modes</button><button id="download" disabled>Download JSON</button>
<p id="status">Ready</p><table><thead><tr><th>Mode</th><th>Frames</th><th>Intervals &gt;32ms</th><th>Max interval ms</th><th>Water JS ms</th><th>Scene JS ms</th></tr></thead><tbody id="results"></tbody></table>
<iframe id="preview" title="P2 isolated performance test"></iframe><pre id="raw"></pre>
<script>
const modes=['trace','water-off','clip-off','editorial-off'];
const frame=document.getElementById('preview'),rows=document.getElementById('results'),status=document.getElementById('status'),raw=document.getElementById('raw');
let results=[],running=false;
const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
const loaded=()=>new Promise(resolve=>{frame.onload=resolve});
async function test(mode){
 frame.src='/p2/living-water.html?embed=1&p2perf='+mode+'&audit='+Date.now();
 await loaded();await sleep(600);
 const win=frame.contentWindow;
 // Embedded mode uses the production cross-frame scroll interface.
 // 1.72/2.9 is the critical door handoff. Traverse it at a repeatable cadence.
 for(let n=0;n<210;n++){
  const p=n/209;
  const progress=(1.30+p*1.15)/2.9;
  win.postMessage({type:'westside-p2-scroll',progress,active:true},location.origin);
  await new Promise(requestAnimationFrame);
 }
 await sleep(150);
 const data=Object.assign({},win.wsP2Perf||{});
 return {mode,...data};
}
document.getElementById('run').onclick=async()=>{
 if(running)return;running=true;results=[];rows.replaceChildren();status.textContent='Running…';
 try{
  for(const mode of modes){
   status.textContent='Running '+mode;
   const result=await test(mode);results.push(result);
   const tr=document.createElement('tr');
   for(const key of ['mode','frames','longFrames','maxFrameMs','waterMs','sceneMs']){
    const td=document.createElement('td');const val=result[key];
    td.textContent=typeof val==='number'?val.toFixed(key==='frames'||key==='longFrames'?0:2):String(val??'');
    tr.appendChild(td);
   }rows.appendChild(tr);
  }
  raw.textContent=JSON.stringify({url:location.href,viewport:[innerWidth,innerHeight],devicePixelRatio,results},null,2);
  status.textContent='Completed; inspect Chrome Performance trace for paint/composite attribution.';
  document.getElementById('download').disabled=false;
 }catch(err){status.textContent='Error: '+err.message}finally{running=false}
};
document.getElementById('download').onclick=()=>{
 const blob=new Blob([raw.textContent],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');
 a.href=url;a.download='p2-svg-perf-results.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
};
</script></html>
