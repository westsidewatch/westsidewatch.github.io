<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>数片 · 發布診斷</title><style>body{font:16px/1.7 system-ui,"Noto Sans TC",sans-serif;background:#f4f1eb;color:#242320;margin:0;padding:7vw;max-width:850px}h1{font-size:clamp(32px,6vw,64px);margin:0 0 15px}.accent{color:#b93430}ul{list-style:none;padding:0}li{border-top:1px solid #ccc;padding:15px 0}code{overflow-wrap:anywhere}strong{display:inline-block;min-width:100px}a{color:#b93430}small{color:#666}</style></head><body><small>CINEMA REALE / RELEASE HEALTH</small><h1>数片<span class="accent">.</span> 發布診斷</h1><p>本頁只檢查公開檔案能否讀取，不宣稱影片來源已通過即時播放驗收。</p><ul id="checks"><li>正在檢查…</li></ul><p id="summary"></p><a href="./">返回数片影院</a><script>
(async()=>{const files=['index.html','styles.css','app.js','catalog.json'];const list=document.getElementById('checks');list.textContent='';let passed=0;for(const file of files){let status='FAIL', detail='';try{const r=await fetch('./'+file+'?health='+Date.now(),{cache:'no-store'});const body=await r.text();if(!r.ok)throw Error('HTTP '+r.status);if(file==='catalog.json'){const data=JSON.parse(body);const titles=data.titles||[];const units=titles.reduce((n,t)=>n+(t.episodes||[]).length,0);if(titles.length<16||units<90)throw Error('庫存不完整：'+titles.length+'部 / '+units+'單元');detail=titles.length+'部作品 / '+units+'片集紀錄';}else{if(body.length<1000)throw Error('內容過短');detail=body.length+'字元'}status='PASS';passed++;}catch(e){detail=String(e.message||e)}const li=document.createElement('li');const strong=document.createElement('strong');strong.textContent=status;strong.style.color=status==='PASS'?'#27603d':'#b93430';const code=document.createElement('code');code.textContent=file+' — '+detail;li.append(strong,code);list.append(li)}document.getElementById('summary').textContent=passed===4?'四項檔案檢查通過；仍需實際播放驗收。':'僅 '+passed+'/4 項通過。這是公開部署或資產讀取問題。';})();
</script></body></html>
