<!doctype html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f4f1eb"><title>数片 · Cinema Reale</title>
<meta name="description" content="数片｜中英雙語電影與劇集典藏。">
<style>
:root{--paper:#f4f1eb;--ink:#262420;--red:#b93430;--mute:#76726c;--line:#d3cec5}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.6 -apple-system,BlinkMacSystemFont,"Helvetica Neue","PingFang TC","Noto Sans CJK TC",sans-serif}a{color:inherit}button,input{font:inherit}button{cursor:pointer}header{padding:20px max(22px,4vw);border-bottom:1px solid var(--ink);display:flex;justify-content:space-between;gap:20px;align-items:center}.logo{font-size:31px;font-weight:900;letter-spacing:-.12em}.logo b{color:var(--red)}.upper{font:600 10px/1.5 Arial,sans-serif;letter-spacing:.2em}.hero{padding:65px max(22px,4vw) 55px;border-bottom:1px solid var(--ink)}.hero h1{font:normal clamp(58px,12vw,165px)/.92 Georgia,serif;letter-spacing:-.075em;margin:20px 0 25px}.hero em{color:var(--red)}.hero p{max-width:640px;color:var(--mute);font-size:15px}.accent{color:var(--red)}nav{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line);padding:15px max(22px,4vw);display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}.tabs{display:flex;gap:15px;flex-wrap:wrap}.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:7px 1px;color:var(--mute);font-size:12px;font-weight:600}.tabs button[aria-pressed=true]{color:var(--red);border-bottom-color:var(--red)}input{border:0;border-bottom:1px solid var(--ink);padding:8px;background:none;min-width:180px;max-width:100%;outline:none}main{padding:35px max(22px,4vw) 110px}.head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--ink);padding-bottom:12px;margin-bottom:25px;gap:12px}.head h2{font:normal clamp(24px,4vw,39px) Georgia,serif;margin:0}.head h2 i{color:var(--red)}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:32px 17px}
.grid.single{grid-template-columns:minmax(220px,340px) minmax(0,1fr);gap:clamp(30px,6vw,95px);align-items:start}
.feature-detail{border-top:1px solid var(--ink);padding:20px 0 30px;max-width:690px}
.feature-kicker{font:700 10px/1.6 Arial,sans-serif;letter-spacing:.22em;color:var(--red);text-transform:uppercase}
.feature-detail h3{font:normal clamp(36px,5vw,75px)/.98 Georgia,serif;letter-spacing:-.055em;margin:24px 0 14px}
.feature-detail .feature-meta{display:flex;flex-wrap:wrap;gap:15px;font-size:12px;color:var(--mute);border-bottom:1px solid var(--line);padding-bottom:25px}
.feature-detail p{max-width:58ch;margin:25px 0;font-size:14px;line-height:1.9}
.feature-detail .feature-note{font-size:12px;color:var(--mute);border-left:2px solid var(--red);padding-left:14px}
.feature-detail button{font:700 13px Arial,sans-serif;letter-spacing:.04em;border:1px solid var(--ink);background:var(--ink);color:var(--paper);padding:15px 22px;cursor:pointer}
.feature-detail button:hover{background:var(--red);border-color:var(--red)}
@media(max-width:700px){.grid.single{grid-template-columns:1fr;gap:22px}.grid.single .card{max-width:400px}.feature-detail h3{font-size:42px}}.card{min-width:0}.poster{position:relative;aspect-ratio:2/3;background:radial-gradient(ellipse 75% 40% at 50% 23%,#526c70 0%,#1f343a 45%,#101c24 89%),linear-gradient(160deg,#1e3036,#6c2926 90%);width:100%;border:0;display:flex;text-align:left;justify-content:flex-end;flex-direction:column;padding:15px;color:var(--ink);overflow:hidden}.poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}.poster span{position:relative;z-index:2}.poster:not(.hasimage) .posterheading{color:#f4e7d5;text-shadow:0 2px 9px #0008;letter-spacing:-.04em;font:normal clamp(18px,2.3vw,31px)/1.17 Georgia,"PingFang TC",serif;overflow-wrap:anywhere}.poster .label{position:absolute;top:12px;left:13px;color:#f7e6cf;font:700 10px Arial,sans-serif;letter-spacing:.12em}.poster.hasimage .posterheading{display:none}.card[data-restoration='pending'] .poster{background:linear-gradient(135deg,#282f3b 0%,#633e38 52%,#c6a988 110%)}.card[data-restoration='pending'] .poster .posterheading{font-size:clamp(20px,2.3vw,33px)}.card[data-restoration='pending'] .play{background:#4a4440}.poster.hasimage .label{background:var(--paper);color:var(--red);padding:5px 7px}.poster .play{font:700 10px Arial,sans-serif;letter-spacing:.025em;position:absolute;bottom:11px;right:11px;background:var(--red);color:white;padding:5px 10px}.meta h3{margin:10px 0 3px;font-size:17px;font-weight:700}.en{color:var(--mute);font:italic 12px Georgia,serif;min-height:17px}.sub{font-size:11px;color:var(--mute);margin-top:9px}.card a{color:var(--red);font-size:12px}.card a:hover{text-decoration:none}.empty{padding:50px;border:1px solid var(--line)}footer{border-top:1px solid var(--ink);padding:22px max(22px,4vw);color:var(--mute);font-size:11px}dialog{border:0;padding:0;background:var(--paper);color:var(--ink);max-width:min(1100px,96vw);width:100%;max-height:94vh;overflow:auto}dialog::backdrop{background:#100f0fda}.playerhead{padding:16px 22px;display:flex;justify-content:space-between;align-items:center;gap:15px}.playerhead h2{margin:0;font-size:22px}.playerhead button{font-size:25px;border:0;background:none}.playerbody{display:grid;grid-template-columns:1fr 250px}.screen{padding:20px}.screen video{width:100%;aspect-ratio:16/9;background:#111}.screen p{font-size:12px}.episodebar{padding:20px;border-left:1px solid var(--line);max-height:65vh;overflow:auto}.episodebar button{display:block;width:100%;text-align:left;margin:5px 0;background:#fff9;border:1px solid var(--line);padding:10px;font-size:12px}.episodebar button[aria-pressed=true]{border-color:var(--red);color:var(--red)}.episodebar button:disabled{opacity:.55;cursor:default}@media(max-width:1000px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:700px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:27px 12px}.hero{padding-top:44px}.playerbody{grid-template-columns:1fr}.episodebar{border-left:0;border-top:1px solid var(--line)}.poster .posterheading{font-size:22px}}

/* Changzhang experiment evidence: understated editorial folio, not a fake playable card. */
.czh-audit{margin-top:42px;padding-top:19px;border-top:1px solid var(--line);max-width:1100px}.czh-audit h2{font:normal clamp(22px,3.6vw,34px)/1.2 Georgia,serif;margin:4px 0 10px}.czh-audit p{color:var(--mute);font-size:12px;margin:8px 0 16px}.czh-audit .czh-kicker{letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-size:10px;font-weight:700}.czh-audit .czh-categories{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border-top:1px solid var(--line)}.czh-audit .czh-categories>div{padding:12px 13px 8px 0;border-bottom:1px solid var(--line);font-size:12px}.czh-audit .czh-categories b{display:block;font-size:12px}.czh-audit .czh-categories span{color:var(--mute);font-size:11px}.czh-audit .czh-steps{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--mute);margin:11px 0}.czh-audit a{font-size:11px;color:var(--red)}@media(max-width:700px){.czh-audit .czh-categories{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style><style>
.engine-results{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 24px;padding:16px 0 22px}
.engine-result{border-top:1px solid var(--line);padding:13px 0;display:grid;gap:5px}
.engine-result strong{font-size:13px;font-weight:650}
.engine-result span{color:var(--mute);font-size:11px;line-height:1.7}
@media(max-width:700px){.engine-results{grid-template-columns:1fr}}
</style>
</head><body>
<header><div class="logo">数<b>片</b></div><div class="upper">CINEMA REALE / FILM ARCHIVE</div></header>
<section class="hero"><div class="upper accent">CINEMA · ARCHIVE · 2026</div><h1>Cinema<br><em>reale.</em></h1><p>光影之間，留給每部電影自己的時刻。</p></section>
<nav><div class="tabs"><button data-category="all" aria-pressed="true">全部作品</button><button data-category="film" aria-pressed="false">電影</button><button data-category="series" aria-pressed="false">劇集</button></div><input id="search" type="search" placeholder="搜尋片名 / Search" aria-label="搜尋作品"></nav>
<main><div class="head"><h2>Selected works <i>/</i> 片庫</h2><span id="totals" class="upper">0 TITLES</span></div><div id="grid" class="grid"></div><div id="empty" class="empty" hidden>目前暫無放映。</div></main>
<footer>数片 / CINEMA REALE — 光影典藏。</footer>
<dialog id="player"><div class="playerhead"><div><div class="upper accent">CINEMA REALE</div><h2 id="player-title">影片</h2></div><button id="close" aria-label="關閉">×</button></div><div class="playerbody"><div class="screen"><video id="video" controls playsinline preload="metadata"></video><p id="status" role="status" aria-live="polite"></p><p><a id="source" target="_blank" rel="noopener noreferrer">影片資訊 ↗</a></p></div><aside class="episodebar"><div class="upper">選集</div><div id="episodes"></div></aside></div></dialog>
<script id="catalog" type="application/json">[]</script>
<script>
'use strict';
const candidates=JSON.parse(document.getElementById('catalog').textContent);
const grid=document.getElementById('grid'),query=document.getElementById('search'),dialog=document.getElementById('player'),video=document.getElementById('video'),status=document.getElementById('status');
let filter='all',active=null,episodeIndex=0,hls=null;
const EXPIRES_AFTER=24*60*60*1000;
const sourceFailures=new Set();
// The catalog is fail-closed: allow a source only with recent browser playback evidence.
function media(ep){
  return (ep?.sources||[]).filter(s=>{
    try{
      const u=new URL(s.url);
      const proof=s.playbackVerification;
      const timestamp=Date.parse(proof?.observedAt||'');
      const age=Date.now()-timestamp;
      return u.protocol==='https:' && /\\.(m3u8|mp4|webm|ogv|ogg)$/i.test(u.pathname)
        && proof?.status==='passed' && proof.videoStarted===true
        && proof.seekSucceeded===true && Number.isFinite(timestamp)
        && age>=0 && age<=EXPIRES_AFTER && !sourceFailures.has(s.url);
    }catch{return false}
  });
}
const works=candidates.filter(w=>(w.episodes||[]).some(e=>media(e).length));
const countSources=work=>work.episodes.filter(e=>media(e).length).length;
function render(){grid.replaceChildren();grid.classList.remove('single');const q=query.value.toLocaleLowerCase().trim();const matches=works.filter(w=>(w.episodes||[]).some(e=>media(e).length)&&(filter==='all'||filter==='film'&&w.type==='film'||filter==='series'&&w.type==='series')&&[w.title,w.originalTitle,w.year].join(' ').toLocaleLowerCase().includes(q));document.getElementById('totals').textContent=matches.length+' TITLES';document.getElementById('empty').hidden=matches.length>0;document.getElementById('empty').textContent=q?'沒有符合搜尋條件的作品。':'目前暫無放映。';for(const w of matches){const c=document.createElement('article');c.className='card';if(w.restorationStatus)c.dataset.restoration='pending';const btn=document.createElement('button');btn.type='button';btn.className='poster';btn.title='欣賞 '+w.title;btn.setAttribute('aria-label','選擇 '+w.title);const lbl=document.createElement('span');lbl.className='label';lbl.textContent=w.type==='series'?'SERIES':'FILM';const heading=document.createElement('span');heading.className='posterheading';heading.textContent=w.posterHeadline||w.originalTitle||w.title;const play=document.createElement('span');play.className='play';play.textContent='▶';btn.append(lbl,heading,play);btn.onclick=()=>open(w);const h=document.createElement('div');h.className='meta';const name=document.createElement('h3');name.textContent=w.title;const en=document.createElement('div');en.className='en';en.textContent=w.originalTitle||'';const sub=document.createElement('div');sub.className='sub';sub.textContent=[w.year,w.country].filter(Boolean).join(' · ');h.append(name,en,sub);const a=document.createElement('a');a.href=w.sourcePage||'#';a.textContent='影片介紹';a.target='_blank';a.rel='noopener noreferrer';h.append(a);c.append(btn,h);grid.append(c);setPoster(w,btn)}
}
const commonsImages=new Map();
function commonsThumbnail(file){
  const key=String(file||'').trim();
  if(!key)return Promise.resolve(null);
  if(commonsImages.has(key))return commonsImages.get(key);
  const endpoint='https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&prop=imageinfo&iiprop=url&iiurlwidth=540&titles='+encodeURIComponent('File:'+key);
  const request=fetch(endpoint,{mode:'cors',credentials:'omit'}).then(r=>{if(!r.ok)throw Error('Commons image API '+r.status);return r.json()}).then(data=>{
    const pages=Object.values(data.query?.pages||{});
    const info=pages[0]?.imageinfo?.[0];
    const url=info?.thumburl||info?.url;
    return typeof url==='string'&&url.startsWith('https://')?url:null;
  }).catch(()=>null);
  commonsImages.set(key,request);
  return request;
}
const wikiPosterCache = new Map();
function wikiPoster(article){
  if(!article) return Promise.resolve(null);
  if(wikiPosterCache.has(article)) return wikiPosterCache.get(article);
  const u='https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&prop=pageimages&piprop=thumbnail&pithumbsize=600&redirects=1&titles='+encodeURIComponent(article);
  const p=fetch(u,{credentials:'omit',mode:'cors'}).then(r=>{if(!r.ok)throw Error('wiki images '+r.status);return r.json()}).then(data=>{
    const first=Object.values(data.query?.pages||{})[0];
    const url=first?.thumbnail?.source;
    return typeof url==='string'&&url.startsWith('https://')?url:null;
  }).catch(()=>null);
  wikiPosterCache.set(article,p);
  return p;
}
function setPoster(w,btn){
  if(w.posterUrl&&/^https:\/\//.test(w.posterUrl)){addImage(btn,w.posterUrl,w.posterWikiTitle,w.posterFallbackUrl);return}
  if(w.posterWikiTitle){wikiPoster(w.posterWikiTitle).then(url=>{if(url&&btn.isConnected)addImage(btn,url)});return}
  try{
    const source=new URL(w.sourcePage||'');
    if(source.hostname==='archive.org'){
      const id=source.pathname.split('/').filter(Boolean)[1];
      if(id){addImage(btn,'https://archive.org/services/img/'+encodeURIComponent(id));return}
    }
    if(source.hostname==='commons.wikimedia.org'&&source.pathname.includes('/wiki/File:')){
      commonsThumbnail(decodeURIComponent(source.pathname.split('/wiki/File:')[1])).then(url=>{if(url&&btn.isConnected)addImage(btn,url)});
      return;
    }
  }catch{}
  const mediaUrl=w.episodes?.flatMap(e=>e.sources||[]).find(item=>item.url&&item.url.includes('upload.wikimedia.org/'))?.url;
  if(mediaUrl){
    try{
      const filename=decodeURIComponent(new URL(mediaUrl).pathname.split('/').pop());
      commonsThumbnail(filename).then(url=>{if(url&&btn.isConnected)addImage(btn,url)});
    }catch{}
  }
}
function addImage(el,url,backupArticle,backupUrl){
  const img=document.createElement('img');
  img.alt='《'+(el.getAttribute('aria-label')||'影視作品')+'》宣傳海報';
  img.loading='lazy';img.decoding='async';img.referrerPolicy='no-referrer';
  img.onload=()=>{if(img.naturalWidth>0)el.classList.add('hasimage')};
  img.onerror=()=>{
    img.remove();el.classList.remove('hasimage');
    if(backupUrl&&!el.dataset.posterBackup){
      el.dataset.posterBackup='1';
      if(el.isConnected)addImage(el,backupUrl,backupArticle);
    }else if(backupArticle&&!el.dataset.posterBackup){
      el.dataset.posterBackup='1';
      wikiPoster(backupArticle).then(backupUrl=>{
        if(backupUrl&&el.isConnected&&backupUrl!==url)addImage(el,backupUrl);
        else el.dataset.posterState='failed';
      });
    }else el.dataset.posterState='failed';
  };
  img.src=url;
  el.prepend(img);
}
let playbackToken=0, sourceTimer=null, chosenSources=[], sourceIndex=0, sourceAttempt=0;
let hlsLoader=null;
function clearWatchdog(){if(sourceTimer){clearTimeout(sourceTimer);sourceTimer=null}}
function disposeMedia(){
  clearWatchdog();
  if(hls){const instance=hls;hls=null;instance.destroy()}
  video.pause();video.removeAttribute('src');video.load();
}
function stop(){playbackToken++;sourceAttempt++;disposeMedia()}
function mark(message){status.textContent=message}
function nextSource(token,attempt,reason){
  if(token!==playbackToken||attempt!==sourceAttempt||sourceIndex>=chosenSources.length)return;
  sourceAttempt++;
  const bad=chosenSources[sourceIndex];
  if(bad?.url)sourceFailures.add(bad.url);
  disposeMedia();
  sourceIndex++;
  render();
  if(sourceIndex<chosenSources.length){
    mark('放映中斷，正在嘗試其他播放線路…');
    trySource(token);return;
  }
  mark('暫時無法放映這一集。');
}
function ensureHls(){
  if(window.Hls)return Promise.resolve(window.Hls);
  if(hlsLoader)return hlsLoader;
  hlsLoader=new Promise((resolve,reject)=>{
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/hls.js@1.6.13/dist/hls.min.js';
    s.async=true;
    s.onload=()=>window.Hls?resolve(window.Hls):reject(new Error('HLS 元件無法初始化'));
    s.onerror=()=>reject(new Error('HLS 元件網路載入失敗'));
    document.head.append(s);
  }).catch(err=>{hlsLoader=null;throw err});
  return hlsLoader;
}
function hlsFailureMessage(data){
  const d=String(data?.details||'').toLowerCase();
  if(d.includes('manifest')||d.includes('fragload')||d.includes('level'))return 'HLS 清單／影片片段請求失敗（可能是來源失效或瀏覽器 CORS 限制）';
  if(d.includes('buffer')||data?.type==='mediaError')return '影片解碼或緩衝失敗';
  return 'HLS 網路或媒體失敗';
}
async function trySource(token){
  if(token!==playbackToken)return;
  const src=chosenSources[sourceIndex];if(!src)return;
  const attempt=++sourceAttempt;
  disposeMedia();
  const fail=reason=>nextSource(token,attempt,reason);
  mark('正在準備放映…');
  sourceTimer=setTimeout(()=>fail('載入逾時（24 秒）'),24000);
  const url=src.url,fmt=String(src.format||'').toLowerCase();
  if(fmt==='ogv'||fmt==='ogg'){
    if(!video.canPlayType('video/ogg')){fail('瀏覽器不支援 Ogg/Theora');return}
  }
  if(fmt==='m3u8'||/\.m3u8(?:$|[?#])/i.test(url)){
    // Chromium may advertise native HLS while loading cross-origin media
    // in no-CORS mode (ERR_BLOCKED_BY_RESPONSE.NotSameOrigin). Prefer MSE/hls.js
    // wherever it is supported; reserve native HLS for Safari-only fallback.
    try{
      if(typeof MediaSource==='undefined'||typeof MediaSource.isTypeSupported!=='function'){
        if(video.canPlayType('application/vnd.apple.mpegurl')){
          video.src=url;video.load();return;
        }
        fail('沒有可用的 HLS 解碼器');return;
      }
      const Hls=await ensureHls();
      if(token!==playbackToken||attempt!==sourceAttempt)return;
      if(!Hls.isSupported()){
        if(video.canPlayType('application/vnd.apple.mpegurl')){
          video.src=url;video.load();return;
        }
        fail('此瀏覽器無法解碼 HLS');return;
      }
      const instance=new Hls({enableWorker:true,maxBufferLength:30});
      hls=instance;
      instance.on(Hls.Events.ERROR,(_,data)=>{
        if(data.fatal)fail(hlsFailureMessage(data));
      });
      instance.on(Hls.Events.MEDIA_ATTACHED,()=>{
        if(token===playbackToken&&attempt===sourceAttempt)instance.loadSource(url);
      });
      instance.attachMedia(video);
    }catch(err){fail(err.message||'HLS 初始化失敗')}
  }else{
    video.src=url;video.load();
  }
}
function connect(ep){
  stop();const token=playbackToken;
  chosenSources=media(ep);sourceIndex=0;
  if(!chosenSources.length){
    mark('這一集暫時無法放映。');return;
  }
  trySource(token);
}
video.addEventListener('loadedmetadata',()=>{
  clearWatchdog();
  const duration=Number.isFinite(video.duration)?Math.round(video.duration/60)+' 分鐘':'時長未知';
  mark('影片長度：'+duration+'。按播放鍵開始。');
});
video.addEventListener('playing',()=>{
  clearWatchdog();mark('正在放映');
});
video.addEventListener('waiting',()=>{
  if(chosenSources.length&&video.readyState<3)mark('稍候，畫面正在緩衝…');
});
video.addEventListener('error',()=>{
  if(chosenSources.length&&sourceAttempt>0&&video.error){
    const reason=video.error.code===4?'瀏覽器不支援影片格式或來源無法載入':'媒體解碼或網路錯誤';
    nextSource(playbackToken,sourceAttempt,reason);
  }
});
function choose(i){episodeIndex=i;const ep=active.episodes[i];document.querySelectorAll('#episodes button').forEach((b,j)=>b.setAttribute('aria-pressed',String(i===j)));connect(ep)}
function open(w){
  const episodes=(w.episodes||[]).filter(ep=>media(ep).length);
  if(!episodes.length){render();return}
  active={...w,episodes};
  document.getElementById('player-title').textContent=w.title;
  document.getElementById('source').href=w.sourcePage||'#';
  const e=document.getElementById('episodes');e.replaceChildren();
  episodes.forEach((ep,i)=>{
    const b=document.createElement('button');
    b.textContent=ep.label||'第 '+(i+1)+' 集';
    b.setAttribute('aria-pressed','false');
    b.onclick=()=>choose(i);
    e.append(b);
  });
  dialog.showModal();choose(0)
}
document.getElementById('close').onclick=()=>dialog.close();dialog.addEventListener('close',stop);document.querySelectorAll('[data-category]').forEach(b=>b.onclick=()=>{filter=b.dataset.category;document.querySelectorAll('[data-category]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));render()});query.oninput=render;render();
</script>
</body></html>
