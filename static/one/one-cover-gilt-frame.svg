<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1600" fill="none">
  <!-- ONE canonical gilt binding frame v6.
       Structural source: supplied antique brown book-cover reference (#4).
       Flat hot-stamped double rule with four compact classical foliate corners.
       No floating stars, side badges, bevel, glow, plaster relief or Rococo mass. -->
  <g stroke="#CEBD74" stroke-linecap="round" stroke-linejoin="round">
    <rect x="28" y="28" width="944" height="1544" stroke-width="2.1" opacity=".88"/>
    <rect x="39" y="39" width="922" height="1522" stroke-width=".9" opacity=".62"/>
    <rect x="53" y="53" width="894" height="1494" stroke-width=".52" opacity=".34"/>

    <g id="corner" opacity=".90">
      <!-- binding turn -->
      <path d="M53 203V53h150" stroke-width="1.18"/>

      <!-- main inward scroll, reduced from the historical reference -->
      <path d="M57 160c27-2 49-11 63-28 13-16 18-37 15-66" stroke-width="1.30"/>
      <path d="M73 145c19 0 35-7 46-20 10-12 15-28 14-49" stroke-width=".86" opacity=".92"/>
      <path d="M93 124c-5-17 1-32 17-43-1 17-7 32-17 43Z" stroke-width=".72" opacity=".88"/>
      <path d="M101 132c17 2 32-4 43-18-18 0-33 6-43 18Z" stroke-width=".70" opacity=".80"/>

      <!-- small terminal leaves keep the ornament bookish, not floral-heavy -->
      <path d="M123 91c3-14 12-24 26-29-5 14-13 24-26 29Z" stroke-width=".62" opacity=".70"/>
      <path d="M132 103c13 1 24-4 33-15-14 1-25 6-33 15Z" stroke-width=".58" opacity=".62"/>

      <!-- slight antique foil loss -->
      <path d="M54 184c28-2 50-10 69-25" stroke-width=".48" opacity=".42" stroke-dasharray="18 7 4 11"/>
      <path d="M68 54h70" stroke-width=".44" opacity=".34" stroke-dasharray="22 5 3 13"/>
    </g>

    <use href="#corner" transform="translate(1000 0) scale(-1 1)"/>
    <use href="#corner" transform="translate(0 1600) scale(1 -1)"/>
    <use href="#corner" transform="translate(1000 1600) scale(-1 -1)"/>
  </g>

  <!-- sparse wear in the long rules: age, not decorative distress -->
  <g stroke="#8E7430" stroke-width=".55" opacity=".24" stroke-dasharray="17 10 3 18">
    <path d="M28 310v225M28 760v325M972 245v245M972 885v310"/>
    <path d="M235 28h215M590 28h180M190 1572h245M620 1572h190"/>
  </g>
</svg>
