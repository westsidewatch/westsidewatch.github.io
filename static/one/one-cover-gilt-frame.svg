<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1600" fill="none">
  <!-- ONE canonical gilt binding frame v5.
       Direction selected from reference 4: restrained double-rule bookbinding,
       compact classical corner foliage, no side ornaments, no modern stars. -->
  <g stroke="#CEBD74" stroke-linecap="round" stroke-linejoin="round">
    <rect x="31" y="31" width="938" height="1538" stroke-width="1.05" opacity=".70"/>
    <rect x="43" y="43" width="914" height="1514" stroke-width=".52" opacity=".42"/>

    <g id="corner" opacity=".76">
      <!-- structural corner turn -->
      <path d="M43 151V43h108" stroke-width=".78"/>
      <!-- primary acanthus curl: compact, attached to the rule -->
      <path d="M45 112c22-1 38-8 49-22 10-13 14-29 12-47" stroke-width=".72"/>
      <path d="M57 99c14 0 25-5 34-14 8-9 12-20 12-34" stroke-width=".52" opacity=".82"/>
      <path d="M72 87c-3-13 2-24 14-31-1 13-5 23-14 31Z" stroke-width=".46" opacity=".82"/>
      <path d="M78 92c13 1 23-3 31-14-14 0-24 5-31 14Z" stroke-width=".44" opacity=".68"/>
      <!-- second leaf, reduced from the reference so the cover stays quiet -->
      <path d="M91 68c2-10 8-17 18-21-3 10-9 17-18 21Z" stroke-width=".40" opacity=".58"/>
      <!-- fine foil-loss interruption -->
      <path d="M43 132c19-1 35-7 49-18" stroke-width=".34" opacity=".34" stroke-dasharray="12 5 3 8"/>
    </g>

    <use href="#corner" transform="translate(1000 0) scale(-1 1)"/>
    <use href="#corner" transform="translate(0 1600) scale(1 -1)"/>
    <use href="#corner" transform="translate(1000 1600) scale(-1 -1)"/>
  </g>

  <!-- aged hot-stamp loss: sparse and nearly invisible at reading distance -->
  <g stroke="#8E7430" stroke-width=".34" opacity=".20" stroke-dasharray="10 8 2 13">
    <path d="M31 258v214M31 806v326M969 205v251M969 872v297"/>
    <path d="M190 31h227M602 31h194M165 1569h256M635 1569h181"/>
  </g>
</svg>
