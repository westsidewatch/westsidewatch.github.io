<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1600" fill="none">
  <defs>
    <style>
      .outer{stroke:#000;stroke-width:3.2;stroke-linecap:square;stroke-linejoin:miter}
      .inner{stroke:#000;stroke-width:1.45;stroke-linecap:round;stroke-linejoin:round}
      .hair{stroke:#000;stroke-width:1.05;stroke-linecap:round;stroke-linejoin:round}
      .solid{fill:#000}
    </style>
    <g id="corner">
      <!-- Binding rules terminate cleanly before the ornament. -->
      <path class="outer" d="M31 214V31h183"/>
      <path class="inner" d="M48 229V48h181"/>
      <path class="hair" d="M61 207V61h146"/>

      <!-- Restrained nineteenth-century acanthus: weight stays at the corner. -->
      <path class="outer" d="M61 61c31 1 57 11 76 30 19 19 29 45 30 76"/>
      <path class="inner" d="M61 83c24 1 44 9 58 24 15 15 23 35 24 59"/>
      <path class="inner" d="M83 61c1 24 9 44 24 59 15 14 35 22 59 23"/>
      <path class="hair" d="M75 75c35 14 63 42 77 77"/>

      <!-- Three leaves, individually drawn rather than a repeated vine texture. -->
      <path class="solid" d="M82 73c16-10 31-10 46-1-5 15-16 25-34 29-9-7-13-16-12-28Z"/>
      <path class="solid" d="M111 103c17-7 32-4 45 8-8 14-21 22-39 22-8-8-10-18-6-30Z"/>
      <path class="solid" d="M73 82c-10 16-10 31-1 46 15-5 25-16 29-34-7-9-16-13-28-12Z"/>

      <!-- Fine stems and a small terminal bud keep the foil airy. -->
      <path class="hair" d="M69 153c29-9 52-26 68-51M153 69c-9 29-26 52-51 68"/>
      <path class="inner" d="M62 183c28-4 50-17 66-40M183 62c-4 28-17 50-40 66"/>
      <path class="solid" d="M153 153l7-7 7 7-7 7Z"/>
      <circle class="solid" cx="61" cy="61" r="3.6"/>
    </g>

    <g id="horizontal-knot">
      <path class="inner" d="M-42 0h29M13 0h29"/>
      <path class="solid" d="M0-9 10 0 0 9-10 0Z"/>
      <circle class="solid" cx="0" cy="0" r="2.4"/>
    </g>
    <g id="vertical-knot">
      <path class="inner" d="M0-42v29M0 13v29"/>
      <path class="solid" d="M-9 0 0-10 9 0 0 10Z"/>
      <circle class="solid" cx="0" cy="0" r="2.4"/>
    </g>
  </defs>

  <!-- Double bookbinding frame with generous image breathing room. -->
  <rect x="31" y="31" width="938" height="1538" class="outer"/>
  <rect x="48" y="48" width="904" height="1504" class="inner"/>
  <rect x="61" y="61" width="878" height="1478" class="hair"/>

  <use href="#corner"/>
  <use href="#corner" transform="translate(1000 0) scale(-1 1)"/>
  <use href="#corner" transform="translate(0 1600) scale(1 -1)"/>
  <use href="#corner" transform="translate(1000 1600) scale(-1 -1)"/>

  <!-- Tiny binder's knots articulate the long empty rules without becoming a border pattern. -->
  <use href="#horizontal-knot" transform="translate(500 48)"/>
  <use href="#horizontal-knot" transform="translate(500 1552)"/>
  <use href="#vertical-knot" transform="translate(48 800)"/>
  <use href="#vertical-knot" transform="translate(952 800)"/>
</svg>
