<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1600" fill="none">
  <defs>
    <style>
      .rule{stroke:#000;stroke-width:1.45;stroke-linecap:round;stroke-linejoin:round}
      .fine{stroke:#000;stroke-width:1.05;stroke-linecap:round;stroke-linejoin:round}
      .hair{stroke:#000;stroke-width:.72;stroke-linecap:round;stroke-linejoin:round}
      .dot{fill:#000}
    </style>

    <!-- Delicate scroll-and-flower corner redrawn from the supplied antique binding. -->
    <g id="corner">
      <path class="rule" d="M35 228V35h228"/>
      <path class="fine" d="M43 238V43h205"/>
      <path class="hair" d="M51 221V51h190"/>

      <!-- Principal vines follow the two binding edges and curl back into the corner. -->
      <path class="rule" d="M51 58c34 3 47 23 37 46-8 19-34 22-44 7-8-12 0-27 14-28 11-1 18 9 14 18"/>
      <path class="rule" d="M58 51c3 34 23 47 46 37 19-8 22-34 7-44-12-8-27 0-28 14-1 11 9 18 18 14"/>
      <path class="fine" d="M72 72c42 16 70 45 84 87 10 30 35 42 57 26 15-11 11-34-5-39-14-4-25 7-20 19"/>
      <path class="fine" d="M72 72c16 42 45 70 87 84 30 10 42 35 26 57-11 15-34 11-39-5-4-14 7-25 19-20"/>

      <!-- Secondary S-scrolls give the old stamped, hand-drawn asymmetry of the reference. -->
      <path class="fine" d="M48 129c18-13 38-12 51 2 12 13 7 32-7 37-12 4-23-5-20-16 2-8 11-12 18-8"/>
      <path class="fine" d="M129 48c-13 18-12 38 2 51 13 12 32 7 37-7 4-12-5-23-16-20-8 2-12 11-8 18"/>
      <path class="hair" d="M51 183c23-21 46-22 62-6 12 12 9 30-3 37M183 51c-21 23-22 46-6 62 12 12 30 9 37-3"/>
      <path class="hair" d="M104 112c23 0 42 8 57 25M112 104c0 23 8 42 25 57"/>

      <!-- Open leaves and small five-petal flowers: no heavy solid blobs. -->
      <path class="fine" d="M92 116c-12-8-25-7-37 3 13 8 26 8 37-3Zm24-24c-8-12-7-25 3-37 8 13 8 26-3 37Z"/>
      <path class="fine" d="M119 139c-12-5-23-2-33 9 13 5 24 2 33-9Zm20-20c-5-12-2-23 9-33 5 13 2 24-9 33Z"/>
      <path class="fine" d="M151 171c-10-3-19 1-26 11 11 3 20-1 26-11Zm20-20c-3-10 1-19 11-26 3 11-1 20-11 26Z"/>

      <g transform="translate(107 108)">
        <path class="fine" d="M0 0c-13-5-14-17-5-23 9 5 11 13 5 23Zm0 0c5-13 17-14 23-5-5 9-13 11-23 5Zm0 0c13 5 14 17 5 23-9-5-11-13-5-23Zm0 0c-5 13-17 14-23 5 5-9 13-11 23-5Z"/>
        <circle class="dot" r="2.6"/>
      </g>
      <g transform="translate(62 154) scale(.72)">
        <path class="fine" d="M0 0c-13-5-14-17-5-23 9 5 11 13 5 23Zm0 0c5-13 17-14 23-5-5 9-13 11-23 5Zm0 0c13 5 14 17 5 23-9-5-11-13-5-23Zm0 0c-5 13-17 14-23 5 5-9 13-11 23-5Z"/>
        <circle class="dot" r="2.6"/>
      </g>
      <g transform="translate(154 62) scale(.72)">
        <path class="fine" d="M0 0c-13-5-14-17-5-23 9 5 11 13 5 23Zm0 0c5-13 17-14 23-5-5 9-13 11-23 5Zm0 0c13 5 14 17 5 23-9-5-11-13-5-23Zm0 0c-5 13-17 14-23 5 5-9 13-11 23-5Z"/>
        <circle class="dot" r="2.6"/>
      </g>

      <path class="hair" d="M51 205c17-10 34-13 51-9M205 51c-10 17-13 34-9 51"/>
      <circle class="dot" cx="51" cy="51" r="2.2"/>
      <circle class="dot" cx="217" cy="51" r="1.7"/>
      <circle class="dot" cx="51" cy="217" r="1.7"/>
    </g>
  </defs>

  <!-- Closely spaced antique binding rules, as in the supplied cloth cover. -->
  <rect x="35" y="35" width="930" height="1530" class="rule"/>
  <rect x="43" y="43" width="914" height="1514" class="fine"/>
  <rect x="51" y="51" width="898" height="1498" class="hair"/>

  <use href="#corner"/>
  <use href="#corner" transform="translate(1000 0) scale(-1 1)"/>
  <use href="#corner" transform="translate(0 1600) scale(1 -1)"/>
  <use href="#corner" transform="translate(1000 1600) scale(-1 -1)"/>
</svg>
