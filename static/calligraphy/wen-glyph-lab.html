<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>拾字｜文徵明原字實驗室</title><style>
:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#eee9dc;color:#292923;font:15px/1.6 system-ui,sans-serif}header,main{max-width:1200px;margin:auto;padding:22px}header{border-bottom:1px solid #c8c0b0}h1{font:normal 36px serif;margin:0}h2{font:normal 23px serif}a{color:#435d4c}button,input,select{font:inherit}button{padding:9px 14px;cursor:pointer;background:#345344;color:white;border:0}input[type=url]{width:100%;padding:9px}main{display:grid;grid-template-columns:minmax(280px,350px) minmax(0,1fr);gap:26px}.pane{background:#faf8f1;padding:20px;border:1px solid #d6d0c4}label{display:block;margin:13px 0 5px}.muted,small{color:#716d65}.source{border-top:1px solid #ddd5c9;padding:12px 0}.source a{display:block}canvas{max-width:100%;background:white;touch-action:none;cursor:crosshair;border:1px solid #d6d0c4}#preview{width:180px;height:180px;object-fit:contain;background:white;border:1px solid #d6d0c4}#status{white-space:pre-wrap}output{display:block;margin:12px 0}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}@media(max-width:750px){main{grid-template-columns:1fr}}</style></head><body>
<header><small>拾字 / GLEAN · 原字資產研究</small><h1>文徵明｜行草原字實驗室</h1><p class="muted">遠端來源 · 人工框選 · 二值輪廓 SVG 試驗。尚非已完成字庫。</p></header>
<main><section class="pane"><h2>01 / 原作來源</h2><div id="sources"></div><label for="url">遠端原圖 URL（需允許跨來源讀取）</label><input id="url" type="url" placeholder="https://…/image.jpg"><label for="upload">或選擇本機研究圖片（不會上傳）</label><input id="upload" type="file" accept="image/*"><div class="tools"><button id="load">載入圖像</button></div><h2>02 / 原字標記</h2><label for="char">漢字</label><input id="char" maxlength="2" placeholder="文"><label for="threshold">墨色閾值 <span id="tv">150</span></label><input id="threshold" type="range" min="30" max="235" value="150"><label for="invert"><input id="invert" type="checkbox"> 反相（淺字深底）</label><p class="muted">在原圖上拖曳框選單字。連筆字組可先按整組框選，避免破壞筆勢。</p><div class="tools"><button id="vector">產生 SVG</button><button id="download" disabled>下載 SVG</button><button id="metadata" disabled>下載來源紀錄</button></div><output id="status" aria-live="polite">尚未載入圖像。</output></section>
<section class="pane"><h2>03 / 圖像與取樣</h2><canvas id="canvas" width="850" height="620"></canvas><p class="muted">拖曳矩形以選擇原字範圍；座標保存為原始圖像像素。</p><h2>04 / 矢量結果</h2><img id="preview" alt="SVG 字形預覽"><p class="muted">目前為逐掃描列合併的矩形輪廓（SVG path），用來驗證選區、墨色分離及來源索引；不是 Potrace Bézier 精修，不能當作正式書法字形。</p></section></main>
<script src="./wen-glyph-lab.js"></script></body></html>
