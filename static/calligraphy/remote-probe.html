<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>在線集字 V2</title><style>
html,body{margin:0;min-height:100%;background:#f5f1e8;color:#252525;font-family:serif}*{box-sizing:border-box}button,textarea,input{font:inherit}.app{min-height:100vh;display:grid;grid-template-columns:300px 1fr 270px;gap:24px;padding:28px}.panel{align-self:start}.eyebrow{font-size:10px;letter-spacing:.18em;color:#777}h1{font-size:20px;font-weight:400;letter-spacing:.16em;margin:8px 0 24px}.masters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;max-height:126px;overflow:auto}.masters button,.tools button,.export{border:1px solid #b8ae96;background:transparent;padding:7px 10px;cursor:pointer}.masters button.active,.tools button.active{background:#252525;color:#f5f1e8}.export{width:100%;margin-top:16px}label{display:block;font-size:11px;letter-spacing:.12em;margin:14px 0 6px}textarea{width:100%;min-height:110px;border:1px solid #b8ae96;background:rgba(255,255,255,.25);padding:12px;resize:vertical}.tools{display:flex;gap:6px;flex-wrap:wrap}.status,.hint{font-size:11px;line-height:1.7;color:#756f63;margin-top:8px}.stage{min-height:calc(100vh - 56px);display:flex;align-items:center;justify-content:center;overflow:auto;padding:24px}.paper{position:relative;background:#f8f4e9;box-shadow:0 8px 32px rgba(52,45,31,.08);padding:var(--margin,36px);min-width:220px;min-height:320px;display:flex;align-items:flex-start;justify-content:center}.composition{display:grid;grid-auto-flow:column;grid-template-rows:repeat(var(--rows,8),var(--cell,76px));direction:rtl;column-gap:var(--colgap,28px);row-gap:var(--gap,4px);align-items:center;justify-items:center}.composition.horizontal{grid-auto-flow:row;grid-template-rows:none;grid-template-columns:repeat(var(--cols,8),var(--cell,76px));direction:ltr;column-gap:var(--gap,4px);row-gap:var(--colgap,28px)}.glyph,.fallback{width:var(--cell,76px);height:var(--cell,76px);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;direction:ltr}.glyph img{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;transform:translate(var(--gx,0px),var(--gy,0px)) rotate(var(--gr,0deg)) scale(var(--gs,1));transform-origin:center}.glyph.selected:after,.fallback.selected:after{content:'';position:absolute;inset:-5px;border:1px solid #9d8c63}.fallback{font-size:calc(var(--cell,76px)*.68);opacity:.22}.variants{min-height:120px}.variants h2{font-size:13px;font-weight:400;margin:0 0 12px}.variant-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.variant{aspect-ratio:1;border:1px solid transparent;background:rgba(255,255,255,.25);padding:5px;cursor:pointer}.variant.active{border-color:#252525}.variant img{width:100%;height:100%;object-fit:contain}.empty{font-size:11px;color:#777;line-height:1.6}.range{width:100%}.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fine{border-top:1px solid #cfc5ad;margin-top:20px;padding-top:12px}.fine.disabled{opacity:.35;pointer-events:none}.fine h3{font-size:12px;font-weight:400;letter-spacing:.12em;margin:0 0 8px}.reset{border:0;border-bottom:1px solid #999;background:transparent;padding:2px 0;font-size:11px;cursor:pointer}@media(max-width:900px){.app{grid-template-columns:1fr;padding:18px}.stage{min-height:55vh}.variants{order:3}.paper{max-width:100%}}
</style></head><body><main class="app"><section class="panel"><div class="eyebrow">CALLIGRAPHY WORKBENCH / V2</div><h1>在線集字</h1><div class="masters" id="masters"></div><label for="input">正文</label><textarea id="input" maxlength="240" spellcheck="false">敬畏耶和华是智慧的开端</textarea><label>方向</label><div class="tools"><button id="vertical" class="active">豎排</button><button id="horizontal">橫排</button></div><div class="pair"><div><label for="size">字幅 <span id="sizeVal">76</span></label><input class="range" id="size" type="range" min="48" max="140" value="76"></div><div><label for="rows">每列 <span id="rowsVal">8</span> 字</label><input class="range" id="rows" type="range" min="2" max="16" value="8"></div></div><div class="pair"><div><label for="gap">字距 <span id="gapVal">4</span></label><input class="range" id="gap" type="range" min="0" max="30" value="4"></div><div><label for="colgap">列距 <span id="colgapVal">28</span></label><input class="range" id="colgap" type="range" min="8" max="80" value="28"></div></div><label for="margin">紙邊 <span id="marginVal">36</span></label><input class="range" id="margin" type="range" min="12" max="100" value="36"><button class="export" id="export">輸出高清 PNG</button><div class="status" id="status">正在連接字庫…</div><div class="hint">點字換字形；選中字後可獨立縮放、移位、旋轉。PNG 按當前作品比例高解析輸出。</div></section><section class="stage"><div class="paper" id="paper"><div class="composition" id="composition"></div></div></section><aside class="variants"><h2 id="variantTitle">字形候選</h2><div class="variant-grid" id="variantGrid"></div><div class="empty" id="empty">先點擊作品中的一個字。</div><section class="fine disabled" id="fine"><h3>單字精修</h3><label>縮放 <span id="scaleVal">100</span>%</label><input id="scale" class="range" type="range" min="50" max="180" value="100"><div class="pair"><div><label>左右 <span id="xVal">0</span></label><input id="x" class="range" type="range" min="-40" max="40" value="0"></div><div><label>上下 <span id="yVal">0</span></label><input id="y" class="range" type="range" min="-40" max="40" value="0"></div></div><label>旋轉 <span id="rotateVal">0</span>°</label><input id="rotate" class="range" type="range" min="-20" max="20" value="0"><button class="reset" id="resetFine">重設此字</button></section></aside></main><script>
const REPO='https://raw.githubusercontent.com/neil-zt/calligraphy-community/master/';let index={},selectedKey='米芾 行書',library={},choices=[],adjust=[],selectedPos=-1,mode='vertical';const $=s=>document.querySelector(s),input=$('#input'),composition=$('#composition'),paper=$('#paper'),masters=$('#masters'),status=$('#status'),variantGrid=$('#variantGrid'),variantTitle=$('#variantTitle'),empty=$('#empty'),fine=$('#fine');
function discover(){const counts={};for(const authors of Object.values(index))for(const [k,v] of Object.entries(authors||{}))if(Array.isArray(v)&&v.length)counts[k]=(counts[k]||0)+1;return Object.entries(counts).sort((a,b)=>b[1]-a[1])}function libraryFor(key){const out={};for(const [ch,authors] of Object.entries(index))if(authors&&Array.isArray(authors[key])&&authors[key].length)out[ch]=authors[key];return out}function url(ch,file){return REPO+encodeURIComponent(selectedKey)+'/'+encodeURIComponent(ch)+'/'+encodeURIComponent(file)}function chars(){return [...input.value].filter(c=>!/^\s$/.test(c))}function freshAdjust(){return{scale:100,x:0,y:0,rotate:0}}
function resetChoices(){choices=chars().map(()=>0);adjust=chars().map(freshAdjust);selectedPos=-1;showVariants(-1);syncFine()}
function showVariants(pos){variantGrid.replaceChildren();if(pos<0){variantTitle.textContent='字形候選';empty.hidden=false;empty.textContent='先點擊作品中的一個字。';return}const ch=chars()[pos],files=library[ch]||[];variantTitle.textContent=`${ch} · ${files.length} 個候選`;empty.hidden=!!files.length;if(!files.length){empty.textContent='目前書家沒有這個字。';return}files.forEach((file,i)=>{const b=document.createElement('button');b.className='variant'+(choices[pos]===i?' active':'');const img=document.createElement('img');img.src=url(ch,file);img.alt=ch;b.appendChild(img);b.onclick=()=>{choices[pos]=i;render();showVariants(pos)};variantGrid.appendChild(b)})}
function render(){const cs=chars();while(choices.length<cs.length)choices.push(0);while(adjust.length<cs.length)adjust.push(freshAdjust());choices.length=adjust.length=cs.length;composition.replaceChildren();let hit=0;cs.forEach((ch,pos)=>{const files=library[ch],cell=document.createElement('span');cell.onclick=()=>{selectedPos=pos;render();showVariants(pos);syncFine()};if(!files?.length){cell.className='fallback'+(pos===selectedPos?' selected':'');cell.textContent=ch}else{hit++;cell.className='glyph'+(pos===selectedPos?' selected':'');const img=document.createElement('img'),i=Math.min(choices[pos]||0,files.length-1),a=adjust[pos]||freshAdjust();img.src=url(ch,files[i]);img.alt=ch;img.style.setProperty('--gs',a.scale/100);img.style.setProperty('--gx',a.x+'px');img.style.setProperty('--gy',a.y+'px');img.style.setProperty('--gr',a.rotate+'deg');img.onerror=()=>{cell.className='fallback';cell.textContent=ch};cell.appendChild(img)}composition.appendChild(cell)});status.textContent=`${selectedKey} · ${Object.keys(library).length} 字目 · ${cs.length} 字 · 命中 ${hit} · 缺字 ${cs.length-hit}`}
function selectLibrary(key){selectedKey=key;library=libraryFor(key);[...masters.children].forEach(b=>b.classList.toggle('active',b.dataset.key===key));resetChoices();render()}function buildLibraries(){masters.replaceChildren();const libs=discover();for(const [key,count] of libs){const b=document.createElement('button');b.dataset.key=key;b.textContent=key.replace(/\s+/g,' · ');b.title=`${count} 字目`;b.onclick=()=>selectLibrary(key);masters.appendChild(b)}if(!Object.keys(libraryFor(selectedKey)).length&&libs[0])selectedKey=libs[0][0];selectLibrary(selectedKey)}
function setMode(next){mode=next;composition.classList.toggle('horizontal',mode==='horizontal');$('#vertical').classList.toggle('active',mode==='vertical');$('#horizontal').classList.toggle('active',mode==='horizontal');applyRows()}function applyRows(){const n=$('#rows').value;composition.style.setProperty(mode==='vertical'?'--rows':'--cols',n);$('#rowsVal').textContent=n}function bindRange(id,prop,suffix='px'){const el=$('#'+id),out=$('#'+id+'Val');el.oninput=()=>{(id==='margin'?paper:composition).style.setProperty(prop,el.value+suffix);if(out)out.textContent=el.value}}
function syncFine(){const ok=selectedPos>=0&&!!library[chars()[selectedPos]]?.length;fine.classList.toggle('disabled',!ok);if(!ok)return;const a=adjust[selectedPos]||freshAdjust();for(const [id,key] of [['scale','scale'],['x','x'],['y','y'],['rotate','rotate']]){$('#'+id).value=a[key];$('#'+id+'Val').textContent=a[key]}}
for(const [id,key] of [['scale','scale'],['x','x'],['y','y'],['rotate','rotate']])$('#'+id).oninput=e=>{if(selectedPos<0)return;adjust[selectedPos][key]=+e.target.value;$('#'+id+'Val').textContent=e.target.value;render()};$('#resetFine').onclick=()=>{if(selectedPos<0)return;adjust[selectedPos]=freshAdjust();syncFine();render()};
async function loadImage(src){return new Promise((resolve,reject)=>{const im=new Image();im.crossOrigin='anonymous';im.onload=()=>resolve(im);im.onerror=reject;im.src=src})}async function exportPNG(){const cs=chars(),cell=+$('#size').value,gap=+$('#gap').value,colgap=+$('#colgap').value,margin=+$('#margin').value,n=+$('#rows').value,scale=3,vertical=mode==='vertical',major=Math.min(n,Math.max(1,cs.length)),minor=Math.max(1,Math.ceil(cs.length/n)),w=vertical?minor*cell+(minor-1)*colgap+margin*2:major*cell+(major-1)*gap+margin*2,h=vertical?major*cell+(major-1)*gap+margin*2:minor*cell+(minor-1)*colgap+margin*2,c=document.createElement('canvas');c.width=w*scale;c.height=h*scale;const ctx=c.getContext('2d');ctx.scale(scale,scale);ctx.fillStyle='#f8f4e9';ctx.fillRect(0,0,w,h);for(let pos=0;pos<cs.length;pos++){const ch=cs[pos],files=library[ch];if(!files?.length)continue;const i=Math.min(choices[pos]||0,files.length-1),a=adjust[pos]||freshAdjust();try{const im=await loadImage(url(ch,files[i]));let col,row;if(vertical){col=Math.floor(pos/n);row=pos%n}else{row=Math.floor(pos/n);col=pos%n}const cx=vertical?w-margin-cell/2-col*(cell+colgap):margin+cell/2+col*(cell+gap),cy=vertical?margin+cell/2+row*(cell+gap):margin+cell/2+row*(cell+colgap),fit=Math.min(cell/im.width,cell/im.height),dw=im.width*fit,dh=im.height*fit;ctx.save();ctx.translate(cx+a.x,cy+a.y);ctx.rotate(a.rotate*Math.PI/180);ctx.scale(a.scale/100,a.scale/100);ctx.drawImage(im,-dw/2,-dh/2,dw,dh);ctx.restore()}catch(e){}}const link=document.createElement('a');link.download=`集字-${selectedKey.replace(/\s+/g,'-')}.png`;link.href=c.toDataURL('image/png');link.click()}
input.addEventListener('input',()=>{resetChoices();render()});$('#vertical').onclick=()=>setMode('vertical');$('#horizontal').onclick=()=>setMode('horizontal');$('#rows').oninput=applyRows;bindRange('size','--cell');bindRange('gap','--gap');bindRange('colgap','--colgap');bindRange('margin','--margin');$('#export').onclick=exportPNG;(async()=>{try{const r=await fetch(REPO+'index.json');if(!r.ok)throw Error(r.status);index=await r.json();buildLibraries();applyRows()}catch(e){status.textContent='字庫索引載入失敗 · '+e.message}})();
</script></body></html>
