<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>在線集字 V2</title><style>
:root{--ink:#24231f;--muted:#77736b;--line:#d8d1c2;--paper:#f8f4e9;--ground:#f3efe5}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--ground);color:var(--ink);font-family:"Noto Serif TC","Songti TC","STSong",serif}button,textarea,input{font:inherit}.app{min-height:100vh;display:grid;grid-template-columns:minmax(280px,340px) minmax(420px,1fr) minmax(240px,300px);gap:0}.panel,.variants{padding:34px 30px;background:rgba(248,244,233,.92)}.panel{border-right:1px solid var(--line)}.variants{border-left:1px solid var(--line)}.eyebrow{font:10px/1.2 Arial,sans-serif;letter-spacing:.16em;color:var(--muted);text-transform:uppercase}h1{font-size:26px;font-weight:400;letter-spacing:.12em;margin:10px 0 26px}.masters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin:0 0 28px;max-height:none;overflow:visible}.masters button,.tools button{border:1px solid var(--line);background:transparent;color:var(--ink);padding:10px 9px;cursor:pointer;font-size:12px;line-height:1.3;text-align:left}.masters button:hover,.tools button:hover{border-color:#8d877b}.masters button.active,.tools button.active{background:var(--ink);border-color:var(--ink);color:var(--paper)}label{display:block;font:10px/1.2 Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:18px 0 7px}textarea{width:100%;min-height:112px;border:1px solid var(--line);background:rgba(255,255,255,.35);padding:13px 14px;resize:vertical;color:var(--ink);font-size:16px;line-height:1.7;outline:none}textarea:focus{border-color:#8d877b}.tools{display:flex;gap:7px}.tools button{min-width:66px;text-align:center}.pair{display:grid;grid-template-columns:1fr 1fr;gap:15px}.range{width:100%;accent-color:#36342f}.status{margin-top:24px;padding-top:14px;border-top:1px solid var(--line);font:11px/1.65 Arial,sans-serif;color:#5f5b53}.hint{font-size:11px;line-height:1.75;color:var(--muted);margin-top:8px}.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:auto;padding:7vh 6vw;background:var(--ground)}.paper{position:relative;background:var(--paper);box-shadow:0 18px 55px rgba(52,45,31,.10);padding:var(--margin,36px);min-width:260px;min-height:380px;display:flex;align-items:flex-start;justify-content:center}.composition{display:grid;grid-auto-flow:column;grid-template-rows:repeat(var(--rows,8),var(--cell,76px));direction:rtl;column-gap:var(--colgap,28px);row-gap:var(--gap,4px);align-items:center;justify-items:center}.composition.horizontal{grid-auto-flow:row;grid-template-rows:none;grid-template-columns:repeat(var(--cols,8),var(--cell,76px));direction:ltr;column-gap:var(--gap,4px);row-gap:var(--colgap,28px)}.glyph,.fallback{width:var(--cell,76px);height:var(--cell,76px);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;direction:ltr}.glyph img{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}.glyph.selected:after,.fallback.selected:after{content:"";position:absolute;inset:-5px;border:1px solid #9d8c63}.fallback{font-size:calc(var(--cell,76px)*.68);opacity:.22}.variants h2{font-size:15px;font-weight:400;letter-spacing:.08em;margin:0 0 18px;padding-bottom:12px;border-bottom:1px solid var(--line)}.variant-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.variant{aspect-ratio:1;border:1px solid transparent;background:rgba(255,255,255,.3);padding:5px;cursor:pointer}.variant:hover{border-color:#aaa18f}.variant.active{border-color:var(--ink)}.variant img{width:100%;height:100%;object-fit:contain}.empty{font-size:12px;color:var(--muted);line-height:1.7}@media(max-width:1000px){.app{grid-template-columns:280px 1fr}.variants{grid-column:1/-1;border-left:0;border-top:1px solid var(--line)}.stage{padding:5vh 4vw}}@media(max-width:720px){.app{display:block}.panel,.variants{padding:24px 20px;border:0}.panel{border-bottom:1px solid var(--line)}.masters{grid-template-columns:repeat(2,1fr)}.stage{min-height:58vh;padding:36px 20px}.paper{max-width:100%}}
</style></head><body><main class="app"><section class="panel"><div class="eyebrow">Calligraphy Workbench / V2</div><h1>在線集字</h1><div class="masters" id="masters"></div><label for="input">正文</label><textarea id="input" maxlength="240" spellcheck="false">敬畏耶和华是智慧的开端</textarea><label>方向</label><div class="tools"><button id="vertical" class="active">豎排</button><button id="horizontal">橫排</button></div><div class="pair"><div><label for="size">字幅 <span id="sizeVal">76</span></label><input class="range" id="size" type="range" min="48" max="140" value="76"></div><div><label for="rows">每列 <span id="rowsVal">8</span> 字</label><input class="range" id="rows" type="range" min="2" max="16" value="8"></div></div><div class="pair"><div><label for="gap">字距 <span id="gapVal">4</span></label><input class="range" id="gap" type="range" min="0" max="30" value="4"></div><div><label for="colgap">列距 <span id="colgapVal">28</span></label><input class="range" id="colgap" type="range" min="8" max="80" value="28"></div></div><label for="margin">紙邊 <span id="marginVal">36</span></label><input class="range" id="margin" type="range" min="12" max="100" value="36"><div class="status" id="status">正在連接字庫…</div><div class="hint">書家完整展開，不再藏在滾動區。點擊作品中的字可查看並替換同字異體。</div></section><section class="stage"><div class="paper" id="paper"><div class="composition" id="composition"></div></div></section><aside class="variants"><h2 id="variantTitle">字形候選</h2><div class="variant-grid" id="variantGrid"></div><div class="empty" id="empty">先點擊作品中的一個字。</div></aside></main><script>
const REPO='https://raw.githubusercontent.com/neil-zt/calligraphy-community/master/';let index={},selectedKey='米芾 行書',library={},choices=[],selectedPos=-1,mode='vertical';const $=s=>document.querySelector(s),input=$('#input'),composition=$('#composition'),paper=$('#paper'),masters=$('#masters'),status=$('#status'),variantGrid=$('#variantGrid'),variantTitle=$('#variantTitle'),empty=$('#empty');function discover(){const counts={};for(const authors of Object.values(index))for(const [k,v] of Object.entries(authors||{}))if(Array.isArray(v)&&v.length)counts[k]=(counts[k]||0)+1;return Object.entries(counts).sort((a,b)=>b[1]-a[1])}function libraryFor(key){const out={};for(const [ch,authors] of Object.entries(index))if(authors&&Array.isArray(authors[key])&&authors[key].length)out[ch]=authors[key];return out}function url(ch,file){return REPO+encodeURIComponent(selectedKey)+'/'+encodeURIComponent(ch)+'/'+encodeURIComponent(file)}function chars(){return [...input.value].filter(c=>!/^\s$/.test(c))}function resetChoices(){choices=chars().map(()=>0);selectedPos=-1;showVariants(-1)}function showVariants(pos){variantGrid.replaceChildren();if(pos<0){variantTitle.textContent='字形候選';empty.hidden=false;empty.textContent='先點擊作品中的一個字。';return}const ch=chars()[pos],files=library[ch]||[];variantTitle.textContent=`${ch} · ${files.length} 個候選`;empty.hidden=!!files.length;if(!files.length){empty.textContent='目前書家沒有這個字。';return}files.forEach((file,i)=>{const b=document.createElement('button');b.className='variant'+(choices[pos]===i?' active':'');const img=document.createElement('img');img.src=url(ch,file);img.alt=ch;b.appendChild(img);b.onclick=()=>{choices[pos]=i;render();showVariants(pos)};variantGrid.appendChild(b)})}function render(){const cs=chars();while(choices.length<cs.length)choices.push(0);choices.length=cs.length;composition.replaceChildren();let hit=0;cs.forEach((ch,pos)=>{const files=library[ch],cell=document.createElement('span');cell.onclick=()=>{selectedPos=pos;render();showVariants(pos)};if(!files?.length){cell.className='fallback'+(pos===selectedPos?' selected':'');cell.textContent=ch}else{hit++;cell.className='glyph'+(pos===selectedPos?' selected':'');const img=document.createElement('img'),i=Math.min(choices[pos]||0,files.length-1);img.src=url(ch,files[i]);img.alt=ch;img.onerror=()=>{cell.className='fallback';cell.textContent=ch};cell.appendChild(img)}composition.appendChild(cell)});status.textContent=`${selectedKey} · ${Object.keys(library).length} 字目 · ${cs.length} 字 · 命中 ${hit} · 缺字 ${cs.length-hit}`}function selectLibrary(key){selectedKey=key;library=libraryFor(key);[...masters.children].forEach(b=>b.classList.toggle('active',b.dataset.key===key));resetChoices();render()}function buildLibraries(){masters.replaceChildren();const libs=discover();for(const [key,count] of libs){const b=document.createElement('button');b.dataset.key=key;b.textContent=key.replace(/\s+/g,' · ');b.title=`${count} 字目`;b.onclick=()=>selectLibrary(key);masters.appendChild(b)}if(!Object.keys(libraryFor(selectedKey)).length&&libs[0])selectedKey=libs[0][0];selectLibrary(selectedKey)}function setMode(next){mode=next;composition.classList.toggle('horizontal',mode==='horizontal');$('#vertical').classList.toggle('active',mode==='vertical');$('#horizontal').classList.toggle('active',mode==='horizontal');applyRows()}function applyRows(){const n=$('#rows').value;composition.style.setProperty(mode==='vertical'?'--rows':'--cols',n);$('#rowsVal').textContent=n}function bindRange(id,prop,suffix='px'){const el=$('#'+id),out=$('#'+id+'Val');el.oninput=()=>{(id==='margin'?paper:composition).style.setProperty(prop,el.value+suffix);if(out)out.textContent=el.value}}input.addEventListener('input',()=>{resetChoices();render()});$('#vertical').onclick=()=>setMode('vertical');$('#horizontal').onclick=()=>setMode('horizontal');$('#rows').oninput=applyRows;bindRange('size','--cell');bindRange('gap','--gap');bindRange('colgap','--colgap');bindRange('margin','--margin');(async()=>{try{const r=await fetch(REPO+'index.json');if(!r.ok)throw Error(r.status);index=await r.json();buildLibraries();applyRows()}catch(e){status.textContent='字庫索引載入失敗 · '+e.message}})();
</script></body></html>
