<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>在線集字</title><style>html,body{margin:0;min-height:100%;background:#f5f1e8;color:#252525;font-family:serif}.app{min-height:100vh;box-sizing:border-box;padding:3vh 5vw;display:grid;grid-template-columns:minmax(240px,340px) 1fr;gap:5vw}.controls{align-self:center}h1{font-size:18px;font-weight:400;letter-spacing:.18em;margin:0 0 1.2rem}.masters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1rem}.masters button{border:1px solid #b8ae96;background:transparent;padding:7px 10px;font:13px serif;cursor:pointer}.masters button.active{background:#252525;color:#f5f1e8}label{display:block;font-size:12px;letter-spacing:.12em;margin-bottom:.5rem}textarea{width:100%;box-sizing:border-box;min-height:140px;border:1px solid #b8ae96;background:rgba(255,255,255,.25);padding:14px;font:20px/1.7 serif}.hint,.status{font-size:11px;line-height:1.7;color:#756f63;margin-top:.75rem}.stage{min-height:94vh;display:flex;justify-content:center;align-items:center;overflow:auto}.line{display:flex;flex-direction:column;flex-wrap:wrap-reverse;align-content:center;justify-content:center;gap:3px 24px;max-height:88vh}.glyph,.fallback{width:70px;height:70px;display:flex;align-items:center;justify-content:center}.glyph img{max-width:100%;max-height:100%;object-fit:contain}.fallback{font-size:54px;opacity:.25}@media(max-width:760px){.app{grid-template-columns:1fr;grid-template-rows:auto 1fr}.stage{min-height:62vh}.line{max-height:62vh}}</style></head><body><main class="app"><section class="controls"><h1>在線集字</h1><div class="masters" id="masters"></div><label for="input">輸入文字</label><textarea id="input" maxlength="120" spellcheck="false">敬畏耶和華是智慧的開端</textarea><div class="hint">直接讀取開源字庫索引。點擊同字可切換不同字形。</div><div class="status" id="status">正在連接字庫…</div></section><section class="stage"><div class="line" id="line"></div></section></main><script>
const REPO='https://raw.githubusercontent.com/neil-zt/calligraphy-community/master/';
const COLLECTIONS=[{label:'米芾 行書',key:'米芾 行書'},{label:'王羲之 行書',key:'王羲之 集字聖教序 行書'}];
let selected=COLLECTIONS[0],index={};const input=document.querySelector('#input'),line=document.querySelector('#line'),status=document.querySelector('#status'),masters=document.querySelector('#masters');
function libraryFor(key){const out={};for(const [ch,authors] of Object.entries(index)){if(authors&&Array.isArray(authors[key])&&authors[key].length)out[ch]=authors[key]}return out}
let library={};
function url(ch,file){return REPO+encodeURIComponent(selected.key)+'/'+encodeURIComponent(ch)+'/'+encodeURIComponent(file)}
function render(){const chars=[...input.value].filter(c=>!/^\s$/.test(c));line.replaceChildren();let hit=0;for(const ch of chars){const files=library[ch],cell=document.createElement('span');if(!files?.length){cell.className='fallback';cell.textContent=ch}else{hit++;cell.className='glyph';let i=0;const img=document.createElement('img');const show=()=>{img.src=url(ch,files[i]);img.alt=ch};img.onerror=()=>{cell.className='fallback';cell.textContent=ch};cell.onclick=()=>{i=(i+1)%files.length;show()};cell.appendChild(img);show()}line.appendChild(cell)}status.textContent=`${selected.label} · 字庫 ${Object.keys(library).length} 字目 · 輸入 ${chars.length} · 命中 ${hit} · 缺字 ${chars.length-hit}`}
function select(c){selected=c;library=libraryFor(c.key);[...masters.children].forEach(b=>b.classList.toggle('active',b.dataset.key===c.key));render()}
function buttons(){for(const c of COLLECTIONS){const b=document.createElement('button');b.textContent=c.label;b.dataset.key=c.key;b.onclick=()=>select(c);masters.appendChild(b)}}
async function boot(){buttons();try{const r=await fetch(REPO+'index.json');if(!r.ok)throw Error(r.status);index=await r.json();select(selected)}catch(e){status.textContent='字庫索引載入失敗 · '+e.message}}
input.addEventListener('input',render);boot();
</script></body></html>
