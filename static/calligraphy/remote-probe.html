<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>在線集字｜米芾行書</title>
<style>
html,body{margin:0;min-height:100%;background:#f5f1e8;color:#252525;font-family:serif}body{min-height:100vh}.app{min-height:100vh;box-sizing:border-box;padding:3vh 5vw;display:grid;grid-template-columns:minmax(220px,320px) 1fr;gap:5vw}.controls{align-self:center}.controls h1{font-size:18px;font-weight:400;letter-spacing:.18em;margin:0 0 1.2rem}.controls label{display:block;font-size:12px;letter-spacing:.12em;margin-bottom:.5rem}.controls textarea{width:100%;box-sizing:border-box;min-height:140px;resize:vertical;border:1px solid #b8ae96;background:rgba(255,255,255,.25);color:#252525;padding:14px;font:20px/1.7 serif;outline:none}.controls textarea:focus{border-color:#756b54}.hint{font-size:11px;line-height:1.7;color:#756f63;margin-top:.75rem}.stage{min-height:94vh;display:flex;justify-content:center;align-items:center;overflow:auto}.line{display:flex;flex-direction:column;flex-wrap:wrap-reverse;align-content:center;justify-content:center;gap:clamp(0px,.35vh,4px) clamp(12px,2vw,32px);max-height:88vh}.glyph,.fallback{width:clamp(46px,6vh,86px);height:clamp(46px,6vh,86px);display:flex;align-items:center;justify-content:center}.glyph img{display:block;max-width:100%;max-height:100%;object-fit:contain}.fallback{font-size:clamp(38px,5vh,68px);line-height:1}.status{margin-top:1rem;font-size:11px;letter-spacing:.08em;color:#756f63}@media(max-width:760px){.app{grid-template-columns:1fr;grid-template-rows:auto 1fr;padding:3vh 5vw;gap:2vh}.controls{align-self:start}.controls textarea{min-height:88px}.stage{min-height:62vh}.line{max-height:62vh}.glyph,.fallback{width:clamp(42px,7vh,70px);height:clamp(42px,7vh,70px)}}
</style>
</head>
<body>
<main class="app">
<section class="controls">
<h1>在線集字</h1>
<label for="input">輸入文字</label>
<textarea id="input" maxlength="120" spellcheck="false">敬畏耶和華是智慧的開端</textarea>
<div class="hint">米芾行書。輸入後即時集字、即時顯示；庫中暫無的字以正文標示。</div>
<div class="status" id="status"></div>
</section>
<section class="stage" aria-live="polite"><div class="line" id="line"></div></section>
</main>
<script>
const BASE='https://raw.githubusercontent.com/neil-zt/calligraphy-community/master/%E7%B1%B3%E8%8A%BE%20%E8%A1%8C%E6%9B%B8/';
const KNOWN={
'敬':'97481.gif','畏':'99077.gif','耶':'100100.gif','和':'95562.gif','華':'95310.gif','华':'95310.gif','是':'97588.gif','智':'97631.gif','慧':'97026.gif','的':'99213.gif','開':'96686.gif','开':'96686.gif','端':'99620.gif'
};
const input=document.getElementById('input'),line=document.getElementById('line'),status=document.getElementById('status');
function glyphUrl(ch){return KNOWN[ch]?BASE+encodeURIComponent(ch)+'/'+KNOWN[ch]:null}
function render(){
 const chars=[...input.value].filter(ch=>!/^\s$/.test(ch)); line.replaceChildren(); let found=0;
 chars.forEach(ch=>{const cell=document.createElement('span'),url=glyphUrl(ch); if(url){cell.className='glyph';const img=document.createElement('img');img.src=url;img.alt=ch;img.onerror=()=>{cell.className='fallback';cell.textContent=ch};cell.appendChild(img);found++}else{cell.className='fallback';cell.textContent=ch}line.appendChild(cell)});
 status.textContent=chars.length?`${chars.length} 字 · 已集 ${found} · 待補 ${chars.length-found}`:'請輸入文字';
}
input.addEventListener('input',render);render();
</script>
</body>
</html>
