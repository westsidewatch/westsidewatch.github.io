<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>拾字 · GLEAN</title><style>
:root{--ink:#24231f;--muted:#77736b;--line:#d8d1c2;--paper:#fff;--ground:#f3efe5;--ui:clamp(1rem,.42rem + .48vw,1.55rem);--small:clamp(.78rem,.45rem + .27vw,1.08rem);--pad:clamp(1.5rem,.5rem + 1.2vw,3.5rem)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--ground);color:var(--ink);font-family:"Noto Serif TC","Songti TC","STSong",serif;font-size:var(--ui)}button,textarea,input{font:inherit}.app{min-height:100vh;display:grid;grid-template-columns:clamp(22rem,21vw,34rem) minmax(28rem,1fr) clamp(18rem,18vw,28rem);gap:0}.panel,.variants{padding:var(--pad);background:rgba(248,244,233,.92)}.panel{border-right:1px solid var(--line)}.variants{border-left:1px solid var(--line);position:relative}.variants:before{content:'CONTEXT';display:block;margin-bottom:.8rem;font:10px/1 Arial,sans-serif;letter-spacing:.18em;color:#9d8c63}.variants h2{margin-top:0}.eyebrow{font:var(--small)/1.2 Arial,sans-serif;letter-spacing:.16em;color:var(--muted);text-transform:uppercase}h1{font-size:clamp(1.75rem,1rem + .7vw,2.7rem);font-weight:400;letter-spacing:.12em;margin:.65em 0 1em}.masters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(.45rem,.25rem + .2vw,.8rem);margin:0 0 1.5em;max-height:none;overflow:visible}.masters button,.tools button,.history button{border:1px solid var(--line);background:transparent;color:var(--ink);padding:clamp(.65rem,.4rem + .25vw,1rem);cursor:pointer;font-size:clamp(.82rem,.5rem + .28vw,1.15rem);line-height:1.35;text-align:left;min-height:2.7em}.masters button:hover,.tools button:hover,.history button:hover{border-color:#8d877b}.masters button.active,.tools button.active{background:var(--ink);border-color:var(--ink);color:var(--paper)}.history{display:grid;grid-template-columns:repeat(3,1fr);gap:.55rem;margin:0 0 1.35em}.history button{text-align:center;padding:.55rem .35rem}.history button:disabled{opacity:.32;cursor:default}label{display:block;font:var(--small)/1.2 Arial,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:1.35em 0 .55em}textarea{width:100%;min-height:clamp(7rem,10vh,11rem);border:1px solid var(--line);background:rgba(255,255,255,.35);padding:.85em 1em;resize:vertical;color:var(--ink);font-size:clamp(1rem,.65rem + .32vw,1.4rem);line-height:1.7;outline:none}textarea:focus{border-color:#8d877b}.tools{display:flex;gap:.55rem}.tools button{min-width:5.2em;text-align:center}.pair{display:grid;grid-template-columns:1fr 1fr;gap:clamp(.8rem,.4rem + .4vw,1.4rem)}.range{width:100%;min-height:1.25rem;accent-color:#36342f}.status{margin-top:1.5em;padding-top:1em;border-top:1px solid var(--line);font:var(--small)/1.65 Arial,sans-serif;color:#5f5b53}.hint{font-size:var(--small);line-height:1.75;color:var(--muted);margin-top:.75em}.stage{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:auto;padding:clamp(3rem,7vh,8rem) clamp(2rem,5vw,8rem);background:linear-gradient(rgba(206,189,116,.76),rgba(206,189,116,.76)),url("/api/dore/assets/site-file?code=SITE-TEMPLE-STONE-LIGHT");background-size:520px auto}.stage-flow{display:flex;align-items:center;justify-content:center;gap:1.1em;margin-top:2.4rem;color:#8f7b35;font:clamp(.92rem,.72rem + .18vw,1.15rem)/1.4 Arial,sans-serif;letter-spacing:.13em}.stage-flow button,.stage-flow span{border:0;background:transparent;color:inherit;padding:.55em .25em;letter-spacing:inherit}.stage-flow button{cursor:pointer}.stage-flow button:hover,.stage-flow button:focus{color:var(--ink);outline:0}.stage-flow #stageInscribe{font-size:1.14em;color:#6f5b1f}.stage-flow .rule{width:clamp(2.5rem,4vw,5.5rem);height:1px;background:currentColor;opacity:.62}.paper{position:relative;background:var(--paper);box-shadow:0 18px 55px rgba(52,45,31,.10);padding:var(--margin,36px);min-width:260px;min-height:380px;display:flex;align-items:flex-start;justify-content:center}.composition{display:grid;grid-auto-flow:column;grid-template-rows:repeat(var(--rows,8),var(--cell,76px));direction:rtl;column-gap:var(--colgap,28px);row-gap:var(--gap,4px);align-items:center;justify-items:center}.composition.horizontal{grid-auto-flow:row;grid-template-rows:none;grid-template-columns:repeat(var(--cols,8),var(--cell,76px));direction:ltr;column-gap:var(--gap,4px);row-gap:var(--colgap,28px)}.glyph,.fallback{width:var(--cell,76px);height:var(--cell,76px);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;direction:ltr;background:#fff}.glyph img{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}.glyph.selected:after,.fallback.selected:after{content:"";position:absolute;inset:-5px;border:1px solid #9d8c63}.fallback{font-size:calc(var(--cell,76px)*.68);opacity:.22}.variants h2{font-size:clamp(1.05rem,.7rem + .3vw,1.45rem);font-weight:400;letter-spacing:.08em;margin:0 0 1.1em;padding-bottom:.8em;border-bottom:1px solid var(--line)}.variant-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(.45rem,.25rem + .2vw,.8rem)}.variant{aspect-ratio:1;border:1px solid transparent;background:#fff;padding:.35rem;cursor:pointer}.variant:hover{border-color:#aaa18f}.variant.active{border-color:var(--ink)}.variant img{width:100%;height:100%;object-fit:contain}.empty{font-size:var(--small);color:var(--muted);line-height:1.7}@media(max-width:1400px){:root{--ui:1rem;--small:.78rem}.app{grid-template-columns:minmax(19rem,24vw) minmax(24rem,1fr) minmax(17rem,21vw)}.panel,.variants{padding:1.7rem}}@media(max-width:1000px){.app{grid-template-columns:minmax(18rem,34vw) 1fr}.variants{grid-column:1/-1;border-left:0;border-top:1px solid var(--line)}.stage{padding:5vh 4vw}}@media(max-width:720px){.app{display:block}.panel,.variants{padding:1.5rem 1.25rem;border:0}.panel{border-bottom:1px solid var(--line)}.masters{grid-template-columns:repeat(2,1fr)}.stage{min-height:58vh;padding:2.25rem 1.25rem}.paper{max-width:100%}}
</style></head><body><main class="app"><section class="panel"><div class="eyebrow">GLEAN</div><h1>拾字</h1><div id="gleanFlow" style="display:flex;gap:.45em;flex-wrap:wrap;margin:0 0 1.15em;color:#CEBD74;font:var(--small)/1.4 Arial,sans-serif;letter-spacing:.04em"><b>拾字 · GLEAN</b><span>→</span><span id="inscribeEntry" role="button" tabindex="0" style="cursor:pointer">寫心 · INSCRIBE</span><span>→</span><span id="sealEntry" role="button" tabindex="0" style="cursor:pointer">成卷 · SEAL</span></div><div class="history"><button id="undo" disabled>復原</button><button id="redo" disabled>重做</button><button id="reset">重置</button></div><div class="masters" id="masters"></div><label for="input">正文</label><textarea id="input" maxlength="240" spellcheck="false">敬畏耶和华是智慧的开端</textarea><label>方向</label><div class="tools"><button id="vertical" class="active">豎排</button><button id="horizontal">橫排</button></div><div class="pair"><div><label for="size">字幅 <span id="sizeVal">76</span></label><input class="range" id="size" type="range" min="48" max="140" value="76"></div><div><label for="rows">每列 <span id="rowsVal">8</span> 字</label><input class="range" id="rows" type="range" min="2" max="16" value="8"></div></div><div class="pair"><div><label for="gap">字距 <span id="gapVal">4</span></label><input class="range" id="gap" type="range" min="0" max="30" value="4"></div><div><label for="colgap">列距 <span id="colgapVal">28</span></label><input class="range" id="colgap" type="range" min="8" max="80" value="28"></div></div><label for="margin">紙邊 <span id="marginVal">36</span></label><input class="range" id="margin" type="range" min="12" max="100" value="36"><div class="status" id="status">正在連接字庫…</div><div class="hint">作品會自動保存在此瀏覽器。刷新頁面後可繼續；復原與重做包含正文、書家、異體選擇和排版參數。</div></section><section class="stage"><div class="paper" id="paper"><div class="composition" id="composition"></div></div><nav class="stage-flow" aria-label="書法工作流程"><span>拾字</span><i class="rule"></i><button id="stageInscribe" type="button">寫心</button><i class="rule"></i><button id="stageSeal" type="button">成卷</button></nav></section><aside class="variants"><h2 id="variantTitle">字形候選</h2><div class="variant-grid" id="variantGrid"></div><div class="empty" id="empty">先點擊作品中的一個字。</div></aside></main><script src="./workbench-core.js?v=942"></script><script src="./inscribe.js?v=960"></script><script src="./glean-ui.js?v=961"></script><script>const ie=document.getElementById("inscribeEntry"),se=document.getElementById("sealEntry"),si=document.getElementById("stageInscribe"),ss=document.getElementById("stageSeal");si.onclick=()=>window.INSCRIBE?.open();ss.onclick=()=>window.INSCRIBE?.seal();ie.onclick=()=>window.INSCRIBE?.open();ie.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();window.INSCRIBE?.open()}};se.onclick=()=>window.INSCRIBE?.seal();se.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();window.INSCRIBE?.seal()}};</script></body></html>
