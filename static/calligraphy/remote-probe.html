<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>在線集字 V2</title><style>html,body{margin:0;min-height:100%;background:#f5f1e8;color:#252525;font-family:serif}*{box-sizing:border-box}button,textarea,input{font:inherit}.app{min-height:100vh;display:grid;grid-template-columns:300px 1fr 250px;gap:24px;padding:28px}.panel{align-self:start}.eyebrow{font-size:10px;letter-spacing:.18em;color:#777}h1{font-size:20px;font-weight:400;letter-spacing:.16em;margin:8px 0 24px}.masters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}.masters button,.tools button{border:1px solid #b8ae96;background:transparent;padding:7px 10px;cursor:pointer}.masters button.active,.tools button.active{background:#252525;color:#f5f1e8}label{display:block;font-size:11px;letter-spacing:.12em;margin:14px 0 6px}textarea{width:100%;min-height:130px;border:1px solid #b8ae96;background:rgba(255,255,255,.25);padding:12px;resize:vertical}.tools{display:flex;gap:6px;flex-wrap:wrap}.status,.hint{font-size:11px;line-height:1.7;color:#756f63;margin-top:12px}.stage{min-height:calc(100vh - 56px);display:flex;align-items:center;justify-content:center;overflow:auto}.composition{display:flex;flex-direction:column;flex-wrap:wrap-reverse;align-content:center;justify-content:center;max-height:84vh;gap:var(--gap,4px) 28px}.composition.horizontal{flex-direction:row;flex-wrap:wrap;max-height:none;max-width:75vw}.glyph,.fallback{width:var(--size,76px);height:var(--size,76px);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}.glyph img{max-width:100%;max-height:100%;object-fit:contain}.glyph.selected:after{content:'';position:absolute;inset:-5px;border:1px solid #9d8c63}.fallback{font-size:52px;opacity:.22}.variants{min-height:120px}.variants h2{font-size:13px;font-weight:400;margin:0 0 12px}.variant-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.variant{aspect-ratio:1;border:1px solid transparent;background:rgba(255,255,255,.25);padding:5px;cursor:pointer}.variant.active{border-color:#252525}.variant img{width:100%;height:100%;object-fit:contain}.empty{font-size:11px;color:#777;line-height:1.6}.range{width:100%}@media(max-width:900px){.app{grid-template-columns:1fr;padding:18px}.stage{min-height:55vh}.variants{order:3}.composition{max-height:55vh}}</style></head><body><main class="app"><section class="panel"><div class="eyebrow">CALLIGRAPHY WORKBENCH / V2</div><h1>在線集字</h1><div class="masters" id="masters"></div><label for="input">正文</label><textarea id="input" maxlength="240" spellcheck="false">敬畏耶和华是智慧的开端</textarea><label>方向</label><div class="tools"><button id="vertical" class="active">豎排</button><button id="horizontal">橫排</button></div><label for="size">字幅</label><input class="range" id="size" type="range" min="48" max="140" value="76"><label for="gap">字距</label><input class="range" id="gap" type="range" min="0" max="30" value="4"><div class="status" id="status">正在連接字庫…</div><div class="hint">點擊作品中的任意字，在右側選擇同字的其他寫法。</div></section><section class="stage"><div class="composition" id="composition"></div></section><aside class="variants"><h2 id="variantTitle">字形候選</h2><div class="variant-grid" id="variantGrid"></div><div class="empty" id="empty">先點擊作品中的一個字。</div></aside></main><script>
const REPO='https://raw.githubusercontent.com/neil-zt/calligraphy-community/master/';let index={},selectedKey='米芾 行書',library={},choices=[],selectedPos=-1;
const input=document.querySelector('#input'),composition=document.querySelector('#composition'),masters=document.querySelector('#masters'),status=document.querySelector('#status'),variantGrid=document.querySelector('#variantGrid'),variantTitle=document.querySelector('#variantTitle'),empty=document.querySelector('#empty');
function discover(){const counts={};for(const authors of Object.values(index))for(const [k,v] of Object.entries(authors||{}))if(Array.isArray(v)&&v.length)counts[k]=(counts[k]||0)+1;return Object.entries(counts).sort((a,b)=>b[1]-a[1])}
function libraryFor(key){const out={};for(const [ch,authors] of Object.entries(index))if(authors&&Array.isArray(authors[key])&&authors[key].length)out[ch]=authors[key];return out}
function url(ch,file){return REPO+encodeURIComponent(selectedKey)+'/'+encodeURIComponent(ch)+'/'+encodeURIComponent(file)}
function chars(){return [...input.value].filter(c=>!/^\s$/.test(c))}
function resetChoices(){choices=chars().map(()=>0);selectedPos=-1;showVariants(-1)}
function showVariants(pos){variantGrid.replaceChildren();if(pos<0){variantTitle.textContent='字形候選';empty.hidden=false;return}const ch=chars()[pos],files=library[ch]||[];variantTitle.textContent=`${ch} · ${files.length} 個候選`;empty.hidden=!!files.length;if(!files.length){empty.textContent='目前書家沒有這個字。';return}files.forEach((file,i)=>{const b=document.createElement('button');b.className='variant'+(choices[pos]===i?' active':'');const img=document.createElement('img');img.src=url(ch,file);img.alt=ch;b.appendChild(img);b.onclick=()=>{choices[pos]=i;render();showVariants(pos)};variantGrid.appendChild(b)})}
function render(){const cs=chars();while(choices.length<cs.length)choices.push(0);choices.length=cs.length;composition.replaceChildren();let hit=0;cs.forEach((ch,pos)=>{const files=library[ch],cell=document.createElement('span');cell.onclick=()=>{selectedPos=pos;render();showVariants(pos)};if(!files?.length){cell.className='fallback'+(pos===selectedPos?' selected':'');cell.textContent=ch}else{hit++;cell.className='glyph'+(pos===selectedPos?' selected':'');const img=document.createElement('img');const i=Math.min(choices[pos]||0,files.length-1);img.src=url(ch,files[i]);img.alt=ch;img.onerror=()=>{cell.className='fallback';cell.textContent=ch};cell.appendChild(img)}composition.appendChild(cell)});status.textContent=`${selectedKey} · 字庫 ${Object.keys(library).length} 字目 · 輸入 ${cs.length} · 命中 ${hit} · 缺字 ${cs.length-hit}`}
function selectLibrary(key){selectedKey=key;library=libraryFor(key);[...masters.children].forEach(b=>b.classList.toggle('active',b.dataset.key===key));resetChoices();render()}
function buildLibraries(){masters.replaceChildren();for(const [key,count] of discover()){const b=document.createElement('button');b.dataset.key=key;b.textContent=key.replace(/\s+/g,' · ');b.title=`${count} 字目`;b.onclick=()=>selectLibrary(key);masters.appendChild(b)}if(!libraryFor(selectedKey)[Object.keys(libraryFor(selectedKey))[0]]){const first=discover()[0];if(first)selectedKey=first[0]}selectLibrary(selectedKey)}
input.addEventListener('input',()=>{resetChoices();render()});document.querySelector('#vertical').onclick=()=>{composition.classList.remove('horizontal');document.querySelector('#vertical').classList.add('active');document.querySelector('#horizontal').classList.remove('active')};document.querySelector('#horizontal').onclick=()=>{composition.classList.add('horizontal');document.querySelector('#horizontal').classList.add('active');document.querySelector('#vertical').classList.remove('active')};document.querySelector('#size').oninput=e=>composition.style.setProperty('--size',e.target.value+'px');document.querySelector('#gap').oninput=e=>composition.style.setProperty('--gap',e.target.value+'px');
(async()=>{try{const r=await fetch(REPO+'index.json');if(!r.ok)throw Error(r.status);index=await r.json();buildLibraries()}catch(e){status.textContent='字庫索引載入失敗 · '+e.message}})();
</script></body></html>
