<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>拾字 · GLEAN</title><style>html,body{margin:0;min-height:100%;background:#f3efe5;color:#24231f;font-family:"Noto Serif TC","Songti TC","STSong",serif}.app{min-height:100vh;display:grid;grid-template-columns:clamp(22rem,21vw,34rem) minmax(28rem,1fr) clamp(18rem,18vw,28rem)}.panel,.variants{padding:clamp(1.5rem,.5rem + 1.2vw,3.5rem);background:rgba(248,244,233,.92)}.panel{border-right:1px solid #d8d1c2}.variants{border-left:1px solid #d8d1c2}.eyebrow{font:clamp(.78rem,.45rem + .27vw,1.08rem)/1.2 Arial,sans-serif;letter-spacing:.16em;color:#77736b}h1{font-size:clamp(1.75rem,1rem + .7vw,2.7rem);font-weight:400;letter-spacing:.12em}.masters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.55rem;margin-bottom:1.5rem}.masters button,.tools button,.history button{border:1px solid #d8d1c2;background:transparent;padding:.7rem;cursor:pointer}.masters button.active,.tools button.active{background:#24231f;color:#fff}.history{display:grid;grid-template-columns:repeat(3,1fr);gap:.55rem;margin-bottom:1.35rem}label{display:block;font:clamp(.78rem,.45rem + .27vw,1.08rem)/1.2 Arial,sans-serif;letter-spacing:.1em;color:#77736b;margin:1.35em 0 .55em}textarea{width:100%;min-height:8rem;box-sizing:border-box;border:1px solid #d8d1c2;background:rgba(255,255,255,.35);padding:.85em 1em;font:inherit}.tools{display:flex;gap:.55rem}.pair{display:grid;grid-template-columns:1fr 1fr;gap:1rem}.range{width:100%}.status,.hint{font-size:.8rem;line-height:1.7;color:#77736b}.status{margin-top:1.5rem;padding-top:1rem;border-top:1px solid #d8d1c2}.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:auto;padding:5vh 5vw}.paper{background:#fff;box-shadow:0 18px 55px rgba(52,45,31,.10);padding:var(--margin,36px);min-width:260px;min-height:380px;display:flex;align-items:flex-start;justify-content:center}.composition{display:grid;grid-auto-flow:column;grid-template-rows:repeat(var(--rows,8),var(--cell,76px));direction:rtl;column-gap:var(--colgap,28px);row-gap:var(--gap,4px)}.composition.horizontal{grid-auto-flow:row;grid-template-rows:none;grid-template-columns:repeat(var(--cols,8),var(--cell,76px));direction:ltr}.glyph,.fallback{width:var(--cell,76px);height:var(--cell,76px);display:flex;align-items:center;justify-content:center;position:relative;background:#fff;cursor:pointer}.glyph img{max-width:100%;max-height:100%;object-fit:contain}.glyph.selected:after,.fallback.selected:after{content:"";position:absolute;inset:-5px;border:1px solid #9d8c63}.fallback{font-size:calc(var(--cell,76px)*.68);opacity:.22}.variant-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.55rem}.variant{aspect-ratio:1;border:1px solid transparent;background:#fff;padding:.35rem}.variant.active{border-color:#24231f}.variant img{width:100%;height:100%;object-fit:contain}.scripture-mark{position:fixed;right:clamp(1rem,2vw,2.5rem);bottom:clamp(1rem,2vw,2.5rem);z-index:5;color:#CEBD74;text-align:right;pointer-events:none}.scripture-mark span{display:block;font-size:clamp(.82rem,.7rem + .18vw,1.05rem);letter-spacing:.12em}.scripture-mark small{display:block;margin-top:.45em;font:clamp(.62rem,.55rem + .1vw,.75rem)/1.2 Arial,sans-serif;letter-spacing:.14em}@media(max-width:1000px){.app{grid-template-columns:minmax(18rem,34vw) 1fr}.variants{grid-column:1/-1}}@media(max-width:720px){.app{display:block}.stage{min-height:58vh}.scripture-mark{position:absolute}}</style></head><body><main class="app"><section class="panel"><div class="eyebrow">GLEAN</div><h1>拾字</h1><div class="history"><button id="undo" disabled>復原</button><button id="redo" disabled>重做</button><button id="reset">重置</button></div><div class="masters" id="masters"></div><label for="input">經文</label><textarea id="input" maxlength="240" spellcheck="false">敬畏耶和华是智慧的开端</textarea><label>方向</label><div class="tools"><button id="vertical" class="active">豎排</button><button id="horizontal">橫排</button></div><div class="pair"><div><label for="size">字幅 <span id="sizeVal">76</span></label><input class="range" id="size" type="range" min="48" max="140" value="76"></div><div><label for="rows">每列 <span id="rowsVal">8</span> 字</label><input class="range" id="rows" type="range" min="2" max="16" value="8"></div></div><div class="pair"><div><label for="gap">字距 <span id="gapVal">4</span></label><input class="range" id="gap" type="range" min="0" max="30" value="4"></div><div><label for="colgap">列距 <span id="colgapVal">28</span></label><input class="range" id="colgap" type="range" min="8" max="80" value="28"></div></div><label for="margin">紙邊 <span id="marginVal">36</span></label><input class="range" id="margin" type="range" min="12" max="100" value="36"><div class="status" id="status">正在連接字庫…</div><div class="hint">作品會自動保存在此瀏覽器。</div></section><section class="stage"><div class="paper" id="paper"><div class="composition" id="composition"></div></div></section><aside class="variants"><h2 id="variantTitle">字形候選</h2><div class="variant-grid" id="variantGrid"></div><div class="empty" id="empty">先點擊作品中的一個字。</div></aside></main><div class="scripture-mark"><span>敬畏耶和華是智慧的開端</span><small>箴言 9:10</small></div><script src="/calligraphy/glean-core.js"></script><script src="/calligraphy/png-export.js"></script><script src="/calligraphy/glean-ui.js"></script></body></html>
