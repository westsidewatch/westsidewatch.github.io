<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>在線集字｜米芾行書</title>
<style>
html,body{margin:0;min-height:100%;background:#f5f1e8;color:#252525;font-family:serif}.app{min-height:100vh;box-sizing:border-box;padding:3vh 5vw;display:grid;grid-template-columns:minmax(220px,320px) 1fr;gap:5vw}.controls{align-self:center}.controls h1{font-size:18px;font-weight:400;letter-spacing:.18em;margin:0 0 1.2rem}.controls label{display:block;font-size:12px;letter-spacing:.12em;margin-bottom:.5rem}.controls textarea{width:100%;box-sizing:border-box;min-height:140px;resize:vertical;border:1px solid #b8ae96;background:rgba(255,255,255,.25);color:#252525;padding:14px;font:20px/1.7 serif;outline:none}.hint,.status{font-size:11px;line-height:1.7;color:#756f63;margin-top:.75rem}.stage{min-height:94vh;display:flex;justify-content:center;align-items:center;overflow:auto}.line{display:flex;flex-direction:column;flex-wrap:wrap-reverse;align-content:center;justify-content:center;gap:clamp(0px,.35vh,4px) clamp(12px,2vw,32px);max-height:88vh}.glyph,.fallback,.loading{width:clamp(46px,6vh,86px);height:clamp(46px,6vh,86px);display:flex;align-items:center;justify-content:center}.glyph img{display:block;max-width:100%;max-height:100%;object-fit:contain}.fallback{font-size:clamp(38px,5vh,68px);opacity:.28}.loading{font-size:12px;opacity:.35}@media(max-width:760px){.app{grid-template-columns:1fr;grid-template-rows:auto 1fr;padding:3vh 5vw;gap:2vh}.controls{align-self:start}.controls textarea{min-height:88px}.stage{min-height:62vh}.line{max-height:62vh}.glyph,.fallback,.loading{width:clamp(42px,7vh,70px);height:clamp(42px,7vh,70px)}}
</style></head><body>
<main class="app"><section class="controls"><h1>在線集字</h1><label for="input">輸入文字</label><textarea id="input" maxlength="120" spellcheck="false">敬畏耶和華是智慧的開端</textarea><div class="hint">米芾行書 · 直接檢索開源完整字庫；同字有多個字形時可點擊切換。</div><div class="status" id="status">正在連接字庫…</div></section><section class="stage" aria-live="polite"><div class="line" id="line"></div></section></main>
<script>
const REPO='https://raw.githubusercontent.com/neil-zt/calligraphy-community/master/';
const INDEX_URL=REPO+'index.json';
const STYLE='米芾 行書';
const input=document.getElementById('input'),line=document.getElementById('line'),status=document.getElementById('status');
let glyphIndex=null, renderToken=0;
function findStyle(root){if(!root)return null;if(root[STYLE])return root[STYLE];if(Array.isArray(root))return null;for(const [k,v] of Object.entries(root)){if(k===STYLE)return v;if(v&&typeof v==='object'){const hit=findStyle(v);if(hit)return hit}}return null}
function normalizeStyle(raw){const out={};if(!raw)return out;if(Array.isArray(raw)){for(const item of raw){if(!item||typeof item!=='object')continue;const ch=item.word||item.char||item.character||item.name;const files=item.files||item.images||item.paths;if(ch&&files)out[ch]=Array.isArray(files)?files:[files]}return out}for(const [ch,val] of Object.entries(raw)){if(Array.isArray(val))out[ch]=val;else if(typeof val==='string')out[ch]=[val];else if(val&&typeof val==='object'){const files=val.files||val.images||val.paths||val.file;if(files)out[ch]=Array.isArray(files)?files:[files];else out[ch]=Object.values(val).filter(x=>typeof x==='string')}}return out}
function fileUrl(ch,file){if(/^https?:/.test(file))return file;const clean=String(file).replace(/^\.\//,'');if(clean.includes('/'))return REPO+clean.split('/').map(encodeURIComponent).join('/').replace(/%2F/g,'/');return REPO+encodeURIComponent(STYLE)+'/'+encodeURIComponent(ch)+'/'+encodeURIComponent(clean)}
function addCell(ch,files){const cell=document.createElement('span');if(!files||!files.length){cell.className='fallback';cell.textContent=ch;cell.title='字庫暫無此字';line.appendChild(cell);return false}cell.className='glyph';let n=0;const img=document.createElement('img');const show=()=>{img.src=fileUrl(ch,files[n]);img.alt=ch;cell.title=files.length>1?`${ch} · ${n+1}/${files.length} · 點擊切換`:ch};img.onerror=()=>{if(n<files.length-1){n++;show()}else{cell.className='fallback';cell.textContent=ch}};if(files.length>1)cell.onclick=()=>{n=(n+1)%files.length;show()};cell.appendChild(img);show();line.appendChild(cell);return true}
function render(){const token=++renderToken,chars=[...input.value].filter(ch=>!/^\s$/.test(ch));line.replaceChildren();if(!glyphIndex){status.textContent='正在載入完整米芾行書索引…';return}let found=0;for(const ch of chars)if(addCell(ch,glyphIndex[ch]))found++;if(token!==renderToken)return;status.textContent=chars.length?`${chars.length} 字 · 字庫命中 ${found} · 缺字 ${chars.length-found}`:'請輸入文字'}
async function boot(){try{const r=await fetch(INDEX_URL,{cache:'force-cache'});if(!r.ok)throw new Error(r.status);const all=await r.json();glyphIndex=normalizeStyle(findStyle(all));const count=Object.keys(glyphIndex).length;if(!count)throw new Error('米芾索引未找到');status.textContent=`米芾行書字庫已連接 · ${count} 個字目`;render()}catch(e){status.textContent='字庫索引載入失敗 · '+e.message;glyphIndex={};render()}}
input.addEventListener('input',render);boot();
</script></body></html>
