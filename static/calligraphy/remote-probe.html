<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>在線集字 V2</title><style>
:root{--ink:#24231f;--muted:#77736b;--line:#d8d1c2;--paper:#f8f4e9;--ground:#f3efe5;--ui:clamp(1rem,.42rem + .48vw,1.55rem);--small:clamp(.78rem,.45rem + .27vw,1.08rem);--pad:clamp(1.5rem,.5rem + 1.2vw,3.5rem)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--ground);color:var(--ink);font-family:"Noto Serif TC","Songti TC","STSong",serif;font-size:var(--ui)}button,textarea,input{font:inherit}.app{min-height:100vh;display:grid;grid-template-columns:clamp(22rem,21vw,34rem) minmax(28rem,1fr) clamp(18rem,18vw,28rem);gap:0}.panel,.variants{padding:var(--pad);background:rgba(248,244,233,.92)}.panel{border-right:1px solid var(--line)}.variants{border-left:1px solid var(--line)}.eyebrow{font:var(--small)/1.2 Arial,sans-serif;letter-spacing:.16em;color:var(--muted);text-transform:uppercase}h1{font-size:clamp(1.75rem,1rem + .7vw,2.7rem);font-weight:400;letter-spacing:.12em;margin:.65em 0 1em}.masters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(.45rem,.25rem + .2vw,.8rem);margin:0 0 1.5em;max-height:none;overflow:visible}.masters button,.tools button,.history button{border:1px solid var(--line);background:transparent;color:var(--ink);padding:clamp(.65rem,.4rem + .25vw,1rem);cursor:pointer;font-size:clamp(.82rem,.5rem + .28vw,1.15rem);line-height:1.35;text-align:left;min-height:2.7em}.masters button:hover,.tools button:hover,.history button:hover{border-color:#8d877b}.masters button.active,.tools button.active{background:var(--ink);border-color:var(--ink);color:var(--paper)}.history{display:grid;grid-template-columns:repeat(3,1fr);gap:.55rem;margin:0 0 1.35em}.history button{text-align:center;padding:.55rem .35rem}.history button:disabled{opacity:.32;cursor:default}label{display:block;font:var(--small)/1.2 Arial,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:1.35em 0 .55em}textarea{width:100%;min-height:clamp(7rem,10vh,11rem);border:1px solid var(--line);background:rgba(255,255,255,.35);padding:.85em 1em;resize:vertical;color:var(--ink);font-size:clamp(1rem,.65rem + .32vw,1.4rem);line-height:1.7;outline:none}textarea:focus{border-color:#8d877b}.tools{display:flex;gap:.55rem}.tools button{min-width:5.2em;text-align:center}.pair{display:grid;grid-template-columns:1fr 1fr;gap:clamp(.8rem,.4rem + .4vw,1.4rem)}.range{width:100%;min-height:1.25rem;accent-color:#36342f}.status{margin-top:1.5em;padding-top:1em;border-top:1px solid var(--line);font:var(--small)/1.65 Arial,sans-serif;color:#5f5b53}.hint{font-size:var(--small);line-height:1.75;color:var(--muted);margin-top:.75em}.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:auto;padding:clamp(3rem,7vh,8rem) clamp(2rem,5vw,8rem);background:var(--ground)}.paper{position:relative;background:var(--paper);box-shadow:0 18px 55px rgba(52,45,31,.10);padding:var(--margin,36px);min-width:260px;min-height:380px;display:flex;align-items:flex-start;justify-content:center}.composition{display:grid;grid-auto-flow:column;grid-template-rows:repeat(var(--rows,8),var(--cell,76px));direction:rtl;column-gap:var(--colgap,28px);row-gap:var(--gap,4px);align-items:center;justify-items:center}.composition.horizontal{grid-auto-flow:row;grid-template-rows:none;grid-template-columns:repeat(var(--cols,8),var(--cell,76px));direction:ltr;column-gap:var(--gap,4px);row-gap:var(--colgap,28px)}.glyph,.fallback{width:var(--cell,76px);height:var(--cell,76px);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;direction:ltr}.glyph img{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}.glyph.selected:after,.fallback.selected:after{content:"";position:absolute;inset:-5px;border:1px solid #9d8c63}.fallback{font-size:calc(var(--cell,76px)*.68);opacity:.22}.variants h2{font-size:clamp(1.05rem,.7rem + .3vw,1.45rem);font-weight:400;letter-spacing:.08em;margin:0 0 1.1em;padding-bottom:.8em;border-bottom:1px solid var(--line)}.variant-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(.45rem,.25rem + .2vw,.8rem)}.variant{aspect-ratio:1;border:1px solid transparent;background:rgba(255,255,255,.3);padding:.35rem;cursor:pointer}.variant:hover{border-color:#aaa18f}.variant.active{border-color:var(--ink)}.variant img{width:100%;height:100%;object-fit:contain}.empty{font-size:var(--small);color:var(--muted);line-height:1.7}@media(max-width:1400px){:root{--ui:1rem;--small:.78rem}.app{grid-template-columns:minmax(19rem,24vw) minmax(24rem,1fr) minmax(17rem,21vw)}.panel,.variants{padding:1.7rem}}@media(max-width:1000px){.app{grid-template-columns:minmax(18rem,34vw) 1fr}.variants{grid-column:1/-1;border-left:0;border-top:1px solid var(--line)}.stage{padding:5vh 4vw}}@media(max-width:720px){.app{display:block}.panel,.variants{padding:1.5rem 1.25rem;border:0}.panel{border-bottom:1px solid var(--line)}.masters{grid-template-columns:repeat(2,1fr)}.stage{min-height:58vh;padding:2.25rem 1.25rem}.paper{max-width:100%}}
</style></head><body><main class="app"><section class="panel"><div class="eyebrow">Calligraphy Workbench / V2</div><h1>在線集字</h1><div class="history"><button id="undo" disabled>復原</button><button id="redo" disabled>重做</button><button id="reset">重置</button></div><div class="masters" id="masters"></div><label for="input">正文</label><textarea id="input" maxlength="240" spellcheck="false">敬畏耶和华是智慧的开端</textarea><label>方向</label><div class="tools"><button id="vertical" class="active">豎排</button><button id="horizontal">橫排</button></div><div class="pair"><div><label for="size">字幅 <span id="sizeVal">76</span></label><input class="range" id="size" type="range" min="48" max="140" value="76"></div><div><label for="rows">每列 <span id="rowsVal">8</span> 字</label><input class="range" id="rows" type="range" min="2" max="16" value="8"></div></div><div class="pair"><div><label for="gap">字距 <span id="gapVal">4</span></label><input class="range" id="gap" type="range" min="0" max="30" value="4"></div><div><label for="colgap">列距 <span id="colgapVal">28</span></label><input class="range" id="colgap" type="range" min="8" max="80" value="28"></div></div><label for="margin">紙邊 <span id="marginVal">36</span></label><input class="range" id="margin" type="range" min="12" max="100" value="36"><div class="status" id="status">正在連接字庫…</div><div class="hint">作品會自動保存在此瀏覽器。刷新頁面後可繼續；復原與重做包含正文、書家、異體選擇和排版參數。</div></section><section class="stage"><div class="paper" id="paper"><div class="composition" id="composition"></div></div></section><aside class="variants"><h2 id="variantTitle">字形候選</h2><div class="variant-grid" id="variantGrid"></div><div class="empty" id="empty">先點擊作品中的一個字。</div></aside></main><script>
const REPO='https://raw.githubusercontent.com/neil-zt/calligraphy-community/master/',STORE='calligraphy-workbench-v2';let index={},selectedKey='米芾 行書',library={},choices=[],selectedPos=-1,mode='vertical',history=[],future=[],restoring=false;const $=s=>document.querySelector(s),input=$('#input'),composition=$('#composition'),paper=$('#paper'),masters=$('#masters'),status=$('#status'),variantGrid=$('#variantGrid'),variantTitle=$('#variantTitle'),empty=$('#empty');
function discover(){const counts={};for(const authors of Object.values(index))for(const [k,v] of Object.entries(authors||{}))if(Array.isArray(v)&&v.length)counts[k]=(counts[k]||0)+1;return Object.entries(counts).sort((a,b)=>b[1]-a[1])}function libraryFor(key){const out={};for(const [ch,authors] of Object.entries(index))if(authors&&Array.isArray(authors[key])&&authors[key].length)out[ch]=authors[key];return out}function url(ch,file){return REPO+encodeURIComponent(selectedKey)+'/'+encodeURIComponent(ch)+'/'+encodeURIComponent(file)}function chars(){return [...input.value].filter(c=>!/^\s$/.test(c))}
function state(){return{text:input.value,key:selectedKey,choices:[...choices],mode,size:+$('#size').value,rows:+$('#rows').value,gap:+$('#gap').value,colgap:+$('#colgap').value,margin:+$('#margin').value}}function same(a,b){return JSON.stringify(a)===JSON.stringify(b)}function buttons(){$('#undo').disabled=!history.length;$('#redo').disabled=!future.length}function save(){try{localStorage.setItem(STORE,JSON.stringify(state()))}catch(e){}}function checkpoint(before){if(restoring)return;const now=state();if(before&&!same(before,now)){history.push(before);if(history.length>60)history.shift();future=[]}save();buttons()}
function applyState(s){if(!s)return;restoring=true;input.value=s.text??input.value;selectedKey=Object.keys(libraryFor(s.key)).length?s.key:selectedKey;library=libraryFor(selectedKey);choices=Array.isArray(s.choices)?[...s.choices]:chars().map(()=>0);mode=s.mode==='horizontal'?'horizontal':'vertical';for(const id of ['size','rows','gap','colgap','margin'])if(Number.isFinite(+s[id]))$('#'+id).value=s[id];[...masters.children].forEach(b=>b.classList.toggle('active',b.dataset.key===selectedKey));composition.classList.toggle('horizontal',mode==='horizontal');$('#vertical').classList.toggle('active',mode==='vertical');$('#horizontal').classList.toggle('active',mode==='horizontal');composition.style.setProperty('--cell',$('#size').value+'px');composition.style.setProperty('--gap',$('#gap').value+'px');composition.style.setProperty('--colgap',$('#colgap').value+'px');paper.style.setProperty('--margin',$('#margin').value+'px');for(const id of ['size','rows','gap','colgap','margin'])$('#'+id+'Val').textContent=$('#'+id).value;applyRows();selectedPos=-1;showVariants(-1);render();restoring=false;save();buttons()}
function resetChoices(){choices=chars().map(()=>0);selectedPos=-1;showVariants(-1)}function showVariants(pos){variantGrid.replaceChildren();if(pos<0){variantTitle.textContent='字形候選';empty.hidden=false;empty.textContent='先點擊作品中的一個字。';return}const ch=chars()[pos],files=library[ch]||[];variantTitle.textContent=`${ch} · ${files.length} 個候選`;empty.hidden=!!files.length;if(!files.length){empty.textContent='目前書家沒有這個字。';return}files.forEach((file,i)=>{const b=document.createElement('button');b.className='variant'+(choices[pos]===i?' active':'');const img=document.createElement('img');img.src=url(ch,file);img.alt=ch;b.appendChild(img);b.onclick=()=>{const before=state();choices[pos]=i;render();showVariants(pos);checkpoint(before)};variantGrid.appendChild(b)})}
function render(){const cs=chars();while(choices.length<cs.length)choices.push(0);choices.length=cs.length;composition.replaceChildren();let hit=0;cs.forEach((ch,pos)=>{const files=library[ch],cell=document.createElement('span');cell.onclick=()=>{selectedPos=pos;render();showVariants(pos)};if(!files?.length){cell.className='fallback'+(pos===selectedPos?' selected':'');cell.textContent=ch}else{hit++;cell.className='glyph'+(pos===selectedPos?' selected':'');const img=document.createElement('img'),i=Math.min(choices[pos]||0,files.length-1);img.src=url(ch,files[i]);img.alt=ch;img.onerror=()=>{cell.className='fallback';cell.textContent=ch};cell.appendChild(img)}composition.appendChild(cell)});status.textContent=`${selectedKey} · ${Object.keys(library).length} 字目 · ${cs.length} 字 · 命中 ${hit} · 缺字 ${cs.length-hit}`}
function selectLibrary(key,record=true){const before=state();selectedKey=key;library=libraryFor(key);[...masters.children].forEach(b=>b.classList.toggle('active',b.dataset.key===key));resetChoices();render();if(record)checkpoint(before)}function buildLibraries(){masters.replaceChildren();const libs=discover();for(const [key,count] of libs){const b=document.createElement('button');b.dataset.key=key;b.textContent=key.replace(/\s+/g,' · ');b.title=`${count} 字目`;b.onclick=()=>selectLibrary(key);masters.appendChild(b)}if(!Object.keys(libraryFor(selectedKey)).length&&libs[0])selectedKey=libs[0][0];library=libraryFor(selectedKey);[...masters.children].forEach(b=>b.classList.toggle('active',b.dataset.key===selectedKey))}
function setMode(next){const before=state();mode=next;composition.classList.toggle('horizontal',mode==='horizontal');$('#vertical').classList.toggle('active',mode==='vertical');$('#horizontal').classList.toggle('active',mode==='horizontal');applyRows();checkpoint(before)}function applyRows(){const n=$('#rows').value;composition.style.setProperty(mode==='vertical'?'--rows':'--cols',n);$('#rowsVal').textContent=n}function bindRange(id,prop,suffix='px'){const el=$('#'+id),out=$('#'+id+'Val');let before=null;el.onpointerdown=()=>before=state();el.oninput=()=>{(id==='margin'?paper:composition).style.setProperty(prop,el.value+suffix);if(out)out.textContent=el.value;if(id==='rows')applyRows()};el.onchange=()=>{checkpoint(before);before=null}}
let textBefore=null;input.addEventListener('focus',()=>textBefore=state());input.addEventListener('input',()=>{resetChoices();render();save()});input.addEventListener('change',()=>{checkpoint(textBefore);textBefore=null});$('#vertical').onclick=()=>setMode('vertical');$('#horizontal').onclick=()=>setMode('horizontal');bindRange('size','--cell');bindRange('rows','--rows','');bindRange('gap','--gap');bindRange('colgap','--colgap');bindRange('margin','--margin');$('#undo').onclick=()=>{if(!history.length)return;const current=state(),prev=history.pop();future.push(current);applyState(prev)};$('#redo').onclick=()=>{if(!future.length)return;const current=state(),next=future.pop();history.push(current);applyState(next)};$('#reset').onclick=()=>{const before=state();applyState({text:'敬畏耶和华是智慧的开端',key:'米芾 行書',choices:[],mode:'vertical',size:76,rows:8,gap:4,colgap:28,margin:36});history.push(before);future=[];buttons()};
(async()=>{try{const r=await fetch(REPO+'index.json');if(!r.ok)throw Error(r.status);index=await r.json();buildLibraries();let saved=null;try{saved=JSON.parse(localStorage.getItem(STORE)||'null')}catch(e){}if(saved)applyState(saved);else{selectLibrary(selectedKey,false);applyRows();save()}buttons()}catch(e){status.textContent='字庫索引載入失敗 · '+e.message}})();
</script></body></html>
