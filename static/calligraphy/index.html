<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>經文集字</title><style>body{margin:0;background:#eee9dd;color:#252525;font-family:serif}.tool{max-width:960px;margin:auto;padding:32px}textarea{width:100%;box-sizing:border-box;font-size:22px;padding:14px;background:transparent;border:1px solid #aaa}.controls{display:flex;gap:10px;margin:12px 0}button{padding:10px 18px;background:#252525;color:#fff;border:0}.work{min-height:70vh;display:flex;flex-direction:row-reverse;justify-content:center;gap:12px;padding:36px 0}.glyph{width:112px;height:112px;object-fit:contain;mix-blend-mode:multiply}.missing{width:112px;height:112px;display:grid;place-items:center;font-size:70px}</style><main class="tool"><textarea id="text">敬畏耶和華是智慧的開端</textarea><div class="controls"><button id="write">集字</button></div><section id="work" class="work"></section></main><script>const INDEX='https://raw.githubusercontent.com/neil-zt/calligraphy-community/master/index.json',RAW='https://raw.githubusercontent.com/neil-zt/calligraphy-community/master/';let db=null;function walk(n,p='',a=[]){if(Array.isArray(n)){for(const v of n){if(typeof v==='string')a.push(p+'/'+v);else walk(v,p,a)}}else if(n&&typeof n==='object'){for(const [k,v] of Object.entries(n))walk(v,p?`${p}/${k}`:k,a)}else if(typeof n==='string')a.push(p+'/'+n);return a}function rank(path,ch){const parts=path.split('/');if(!parts.includes(ch))return-1;let s=100;if(/王羲之/.test(path))s+=70;else if(/米芾/.test(path))s+=60;else if(/趙孟頫|赵孟頫|赵孟俯/.test(path))s+=50;else if(/文徵明|文征明/.test(path))s+=40;if(/行書|行书|行草/.test(path))s+=30;return s}async function load(){if(db)return db;const j=await(await fetch(INDEX)).json();db=walk(j);return db}async function write(){const work=document.querySelector('#work');work.textContent='';const paths=await load();for(const ch of [...document.querySelector('#text').value].filter(x=>x.trim())){let best=null,score=-1;for(const p of paths){const s=rank(p,ch);if(s>score){score=s;best=p}}if(best){const im=document.createElement('img');im.className='glyph';im.alt=ch;im.src=RAW+best.split('/').map(encodeURIComponent).join('/');work.append(im)}else{const x=document.createElement('span');x.className='missing';x.textContent=ch;work.append(x)}}}document.querySelector('#write').onclick=write;write();</script></html>
