<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#CEBD74">
<title>DORÉ · 註冊／登入</title>
<meta name="description" content="DORÉ 使用者註冊與登入入口。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Noto+Serif+TC:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html{min-height:100%;background:#CEBD74}body{min-height:100vh;margin:0;color:#252525;font-family:"Noto Serif TC",serif;background:linear-gradient(rgba(206,189,116,.88),rgba(206,189,116,.88)),url('/api/dore/assets/site-file?code=SITE-BACKGROUND') center/cover fixed}.page{min-height:100vh;display:flex;flex-direction:column}.topbar{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(22px,3vw,64px);border-bottom:1px solid rgba(55,45,20,.14)}.brand{color:#8c6818;text-decoration:none;font:500 clamp(1.6rem,2vw,2.2rem) "Cormorant Garamond",serif;letter-spacing:.12em}.back{color:#252525;text-decoration:none;font-size:.8rem;opacity:.7}.main{flex:1;display:grid;place-items:center;padding:56px 20px}.card{width:min(100%,500px);padding:42px 42px 36px;background:rgba(255,253,246,.95);border:1px solid rgba(116,85,20,.38);box-shadow:0 22px 60px rgba(65,45,8,.18)}.eyebrow{text-align:center;color:#9b7015;font:500 .82rem "Cormorant Garamond",serif;letter-spacing:.25em}.title{margin:8px 0 4px;text-align:center;color:#8c6818;font:500 clamp(2.8rem,6vw,4.4rem)/1 "Cormorant Garamond",serif}.subtitle{text-align:center;margin:0 0 30px;font-size:.86rem;opacity:.7}.providers{display:grid;gap:10px}.provider{width:100%;min-height:48px;border:1px solid rgba(88,68,27,.28);background:#fffdf6;color:#252525;font:500 .88rem "Noto Serif TC",serif;cursor:pointer}.provider:hover{border-color:#9b7015}.divider{display:flex;align-items:center;gap:12px;margin:24px 0 18px;color:#777;font-size:.72rem}.divider:before,.divider:after{content:"";height:1px;flex:1;background:rgba(82,62,20,.18)}label{display:block;margin:0 0 7px;font-size:.76rem}input{width:100%;height:48px;border:1px solid rgba(88,68,27,.3);padding:0 13px;background:#fffdf6;color:#252525;font:400 .95rem "Noto Serif TC",serif;outline:none}input:focus{border-color:#9b7015;box-shadow:0 0 0 2px rgba(155,112,21,.1)}.email-submit{width:100%;margin-top:12px;height:48px;border:0;background:#8f6815;color:#fff;font:500 .86rem "Noto Serif TC",serif;cursor:pointer}.note{margin:22px 0 0;padding:14px 16px;border:1px solid rgba(116,85,20,.18);background:rgba(210,188,105,.14);font-size:.7rem;line-height:1.8;color:#66582e}.legal{text-align:center;margin:22px 0 0;font-size:.66rem;opacity:.58;line-height:1.7}.footer{text-align:center;padding:0 20px 28px;font-size:.65rem;opacity:.55}@media(max-width:560px){.topbar{height:62px;padding:0 16px}.main{padding:30px 12px}.card{padding:34px 22px 28px}.back{font-size:.7rem}}
</style>
</head>
<body>
<div class="page">
<header class="topbar"><a class="brand" href="/dore/search/">DORÉ</a><a class="back" href="/dore/search/">返回搜索</a></header>
<main class="main">
<section class="card" aria-labelledby="title">
<div class="eyebrow">DORÉ ACCOUNT</div>
<h1 class="title" id="title">註冊／登入</h1>
<p class="subtitle">保存你的 DORÉ 使用狀態與個人資料</p>
<div class="providers" aria-label="第三方登入">
<button class="provider" type="button" data-provider="google">使用 Google / Gmail</button>
<button class="provider" type="button" data-provider="apple">使用 Apple</button>
<button class="provider" type="button" data-provider="microsoft">使用 Microsoft</button>
<button class="provider" type="button" data-provider="github">使用 GitHub</button>
</div>
<div class="divider">或使用電子郵箱</div>
<form id="email-form" novalidate>
<label for="email">電子郵箱</label>
<input id="email" name="email" type="email" autocomplete="email" placeholder="name@example.com" required>
<button class="email-submit" type="submit">發送驗證連結</button>
</form>
<p class="note" id="status" role="status">身份服務尚未配置；完成 Supabase 公開設定與登入提供者設定後，登入按鈕即可啟用。</p>
<p class="legal">DORÉ 不收集 Google 或 Apple 密碼。OAuth/OIDC、驗證連結與 session 由正式身份服務處理。</p>
</section>
</main>
<footer class="footer">Westside Watch · DORÉ</footer>
</div>
<script>window.DORE_AUTH_CONFIG=window.DORE_AUTH_CONFIG||{url:"",publishableKey:""};</script>
<script src="/dore/account/auth.js" defer></script>
</body>
</html>
