<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Doré Video</title><style>@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Noto+Serif+TC:wght@400;500&display=swap');:root{--gold:#CEBD74;--ink:#252525;--paper:#f1eee5}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Serif TC",serif}.wrap{min-height:100vh;padding:7vw;display:grid;align-content:center;max-width:1180px;margin:auto}.eyebrow{font:400 14px "Cormorant Garamond";letter-spacing:.2em;text-transform:uppercase}h1{font:400 clamp(64px,12vw,160px)/.75 "Cormorant Garamond";margin:.22em 0 .35em}.rule{height:1px;background:var(--ink);opacity:.25;margin:0 0 42px}.inputrow{display:grid;grid-template-columns:1fr auto;border-bottom:1px solid var(--ink)}input{border:0;background:transparent;padding:18px 0;font:400 clamp(17px,2vw,24px) "Cormorant Garamond";outline:0;color:var(--ink)}button{border:0;background:transparent;padding:0 4px 0 30px;font:500 13px "Noto Serif TC";cursor:pointer}.result{min-height:125px;padding-top:28px;font-size:14px;line-height:1.8}.tag{display:inline-block;border:1px solid var(--gold);padding:3px 9px;margin-right:8px}.muted{opacity:.55}.cmd{margin-top:18px;padding:16px;border-left:2px solid var(--gold);font:14px/1.6 ui-monospace,monospace;word-break:break-all;background:rgba(255,255,255,.25)}footer{margin-top:70px;font:13px "Cormorant Garamond";letter-spacing:.08em}@media(max-width:600px){.wrap{padding:11vw 7vw}.inputrow{grid-template-columns:1fr}button{text-align:left;padding:10px 0 14px}} .actions{display:flex;gap:18px;align-items:center;margin-top:20px}.actions button{border:1px solid var(--ink);padding:10px 16px}.actions select{background:transparent;border:0;border-bottom:1px solid var(--ink);padding:10px;max-width:70%}</style></head><body><main class="wrap"><div class="eyebrow">Doré / Video Acquisition</div><h1>Video</h1><div class="rule"></div><div class="inputrow"><input id="url" type="url" placeholder="Paste a public or authorized video URL"><button id="probe">探测</button></div><div class="result" id="result"><span class="muted">网页、MP4、HLS · m3u8、DASH · mpd、MSS · ism</span></div><footer>WATCH FOR THE DAWN · LOCAL-FIRST</footer><!-- deploy: dore-video-runtime --></main><script>const input=document.querySelector('#url'),out=document.querySelector('#result');function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function classify(u){let p=new URL(u).pathname.toLowerCase();if(p.endsWith('.m3u8'))return['HLS','N_m3u8DL-RE'];if(p.endsWith('.mpd'))return['DASH','N_m3u8DL-RE'];if(p.endsWith('.ism')||p.includes('/manifest'))return['MSS / Manifest','N_m3u8DL-RE'];if(/\.mp4$|\.webm$|\.mov$/.test(p))return['Direct media','yt-dlp'];return['Web page','yt-dlp → static discovery → Doré runtime → N_m3u8DL-RE']}async function probe(){try{const u=input.value.trim();new URL(u);const [kind,route]=classify(u);out.innerHTML='<span class="tag">'+kind+'</span><span>'+route+'</span><div class="muted">正在连接本地 Doré…</div>';try{const r=await fetch('http://127.0.0.1:43127/probe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:u})});const data=await r.json();let target=u,info=data.result||{};if(!data.ok)throw new Error(JSON.stringify(data.result||data));if(info.manifest_candidates&&info.manifest_candidates.length)target=info.manifest_candidates[0];const formats=info.formats||[];const opts=formats.filter(f=>f.format_id).map(f=>'<option value="'+esc(String(f.format_id))+'">'+esc(String(f.format_id)+' · '+(f.height?f.height+'p ':'')+(f.ext||''))+'</option>').join('');out.innerHTML='<span class="tag">'+kind+'</span><span>'+route+'</span><div class="cmd">'+esc(JSON.stringify(info,null,2))+'</div><div class="actions">'+(opts?'<select id="format"><option value="">最佳画质 + 音频</option>'+opts+'</select>':'')+'<button id="download">下载</button></div><div id="downloadStatus" class="muted">已由本地 Doré 实际探测；媒体不经过 GitHub Pages。</div>';document.querySelector('#download').onclick=()=>downloadVideo(target)}catch(local){const cmd='python local/dore-local/video_bridge.py';out.innerHTML='<span class="tag">'+kind+'</span><span>'+route+'</span><div class="cmd">'+esc(cmd)+'</div><div class="muted">未连接本地 Doré。先在仓库根目录启动上面的 bridge，再按“探测”。</div>'}}catch(e){out.textContent='请输入完整的 http:// 或 https:// 地址。'}}async function downloadVideo(u){const s=document.querySelector('#downloadStatus'),f=document.querySelector('#format');s.textContent='正在下载…';try{const r=await fetch('http://127.0.0.1:43127/download',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:u,format:f?f.value:'',output:'downloads'})});const d=await r.json();s.textContent=d.ok?'下载完成 · 已保存到 Doré downloads 文件夹':'下载失败 · '+(d.error||JSON.stringify(d.result))}catch(e){s.textContent='无法连接本地 Doré bridge。'}}document.querySelector('#probe').onclick=probe;input.addEventListener('keydown',e=>{if(e.key==='Enter')probe()});</script></body></html>
