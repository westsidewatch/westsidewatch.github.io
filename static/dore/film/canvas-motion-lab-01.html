<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DORÉ FILM · Canonical Canvas Lab 01</title><style>:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080808;color:#ddd;font:12px system-ui,-apple-system,sans-serif}canvas{display:block}.css3d{position:fixed!important;inset:0;pointer-events:none;z-index:2}.hud{position:fixed;left:18px;top:16px;z-index:8;pointer-events:none;text-shadow:0 1px 10px #000}.hud b{letter-spacing:.15em}.hud div{margin-top:5px;color:#999}.gold{color:#cebd74!important}.legend{position:fixed;right:18px;top:16px;text-align:right;color:#777;z-index:8;pointer-events:none}.controls{position:fixed;left:18px;right:18px;bottom:18px;z-index:9;display:grid;grid-template-columns:auto auto auto auto 1fr auto;gap:8px;align-items:center;padding:10px 12px;background:#080808d9;border:1px solid #2c2c2c}button{background:#141414;color:#bbb;border:1px solid #343434;padding:7px 10px;cursor:pointer}button.active{border-color:#cebd74;color:#eadfae}input{width:100%;accent-color:#cebd74}.time{min-width:92px;text-align:right;color:#888}.progress{position:fixed;left:0;bottom:0;height:2px;background:#cebd74;width:0;z-index:10}.boot{position:fixed;inset:0;display:grid;place-items:center;background:#080808;z-index:20;color:#777;letter-spacing:.08em}.boot.done{display:none}.card{width:720px;height:960px;background:#111;border:1px solid #444;display:grid;place-items:center;overflow:hidden;box-shadow:0 0 80px #000}.card img{width:100%;height:100%;object-fit:contain;background:#0c0c0c}.card .fallback{display:none;padding:60px;text-align:center;color:#999;font:24px Georgia,serif;line-height:1.5}.card.failed img{display:none}.card.failed .fallback{display:block}.asset{color:#777}.asset.warn{color:#c99}@media(max-width:760px){.controls{left:8px;right:8px;bottom:8px;grid-template-columns:repeat(4,auto)}.controls input{grid-column:1/-2}.legend{font-size:10px}}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script></head><body><div class="boot" id="boot">STARTING CAMERA WORLD…</div><div class="hud"><b>CANONICAL CANVAS LAB · 01</b><div id="beat">P001</div><div id="state" class="gold">DWELL</div><div id="anchor"></div><div id="frame" class="gold"></div><div id="asset" class="asset">ASSETS 0/3</div></div><div class="legend">ONE CAMERA · ZERO CUTS<br>CAMERA FIRST → CANVAS PLACED<br>DOM IMAGE LAYER · NON-BLOCKING</div><div class="controls"><button id="play">PAUSE</button><button id="reset">RESET</button><button id="cameraBtn" class="active">CAMERA</button><button id="topBtn">TOP</button><input id="scrub" type="range" min="0" max="1000" value="0"><span class="time" id="time">00:00</span></div><div class="progress" id="progress"></div><script type="module">import * as THREE from 'three';import{CSS3DRenderer,CSS3DObject}from'three/addons/renderers/CSS3DRenderer.js';const RAW='https://raw.githubusercontent.com/westsidewatch/westsidewatch.github.io/main/';const timeout=(p,ms,label)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(new Error(label+' timeout')),ms))]);let spine,placement;try{[spine,placement]=await timeout(Promise.all([fetch(RAW+'docs/dore/film/camera-spine-experiment-01.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('spine '+r.status);return r.json()}),fetch(RAW+'docs/dore/film/canvas-placement-experiment-01.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('placement '+r.status);return r.json()})]),8000,'data')}catch(e){document.getElementById('boot').textContent='DATA LOAD ERROR · '+e.message;throw e}const nodes=spine.nodes,lastIndex=nodes.length-1;function buildTimeline(target=52){const d=(a,b)=>Math.hypot(b.p[0]-a.p[0],b.p[1]-a.p[1],b.p[2]-a.p[2]),dw=nodes.reduce((s,n)=>s+Number(n.dwell||0),0),raw=nodes.slice(0,-1).map((n,i)=>d(n,nodes[i+1])/Math.max(.001,(Number(n.speed||.2)+Number(nodes[i+1].speed||.2))/2)),sum=raw.reduce((s,v)=>s+v,0),travel=raw.map(v=>v/sum*Math.max(8,target-dw));let c=0;const events=[];nodes.forEach((n,i)=>{const hold=Number(n.dwell||0);if(hold){events.push({kind:'DWELL',nodeIndex:i,start:c,end:c+hold});c+=hold}if(i<lastIndex){events.push({kind:'TRAVEL',nodeIndex:i,start:c,end:c+travel[i]});c+=travel[i]}});return{duration:c,events}}function sample(tl,sec){sec=Math.max(0,Math.min(tl.duration,sec));const e=tl.events.find(x=>sec>=x.start&&sec<x.end)||tl.events.at(-1);if(e.kind==='DWELL')return{kind:'DWELL',nodeIndex:e.nodeIndex,pathT:e.nodeIndex/lastIndex};const a=(sec-e.start)/(e.end-e.start);return{kind:'TRAVEL',nodeIndex:a<.5?e.nodeIndex:e.nodeIndex+1,pathT:(e.nodeIndex+a)/lastIndex}}function vfov(lens,aspect){const h=2*Math.atan(36/(2*lens));return 2*Math.atan(Math.tan(h/2)/aspect)*180/Math.PI}function solve(node,a){const aspect=placement.viewport.aspect,d=a.distance,fill=a.frameFill,v=vfov(node.lens,aspect)*Math.PI/180,visibleH=2*d*Math.tan(v/2),visibleW=visibleH*aspect,imgAspect=.75;let w,h;if(imgAspect>=aspect){w=visibleW*fill;h=w/imgAspect}else{h=visibleH*fill;w=h*imgAspect}const cp=new THREE.Vector3(...node.p),forward=new THREE.Vector3(...node.look).sub(cp).normalize();return{center:cp.clone().add(forward.multiplyScalar(d)),w,h}}const pts=nodes.map(n=>new THREE.Vector3(...n.p)),looks=nodes.map(n=>new THREE.Vector3(...n.look)),curve=new THREE.CatmullRomCurve3(pts,false,'centripetal',.5),lookCurve=new THREE.CatmullRomCurve3(looks,false,'centripetal',.5),timeline=buildTimeline(),D=timeline.duration;const scene=new THREE.Scene(),cssScene=new THREE.Scene();scene.background=new THREE.Color(0x080808);scene.fog=new THREE.FogExp2(0x080808,.009);const gl=new THREE.WebGLRenderer({antialias:true,alpha:true});gl.setPixelRatio(Math.min(devicePixelRatio,2));gl.setSize(innerWidth,innerHeight);document.body.prepend(gl.domElement);const css=new CSS3DRenderer();css.setSize(innerWidth,innerHeight);css.domElement.className='css3d';document.body.appendChild(css.domElement);const grid=new THREE.GridHelper(190,95,0x222222,0x131313);grid.position.set(31,0,-58);scene.add(grid);scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(curve.getPoints(1000)),new THREE.LineBasicMaterial({color:0xcebd74,transparent:true,opacity:.22})));for(const n of nodes){const m=new THREE.Mesh(new THREE.SphereGeometry(.15,10,8),new THREE.MeshBasicMaterial({color:n.timeBridge?0xcebd74:0x777777}));m.position.set(...n.p);scene.add(m)}const film=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,500),top=new THREE.OrthographicCamera(-46,46,30,-30,.1,500);top.position.set(31,95,-57);top.up.set(0,0,-1);top.lookAt(31,0,-57);const marker=new THREE.Mesh(new THREE.ConeGeometry(.35,1.1,4),new THREE.MeshBasicMaterial({color:0xcebd74,wireframe:true}));marker.rotation.x=Math.PI/2;scene.add(marker);const canvases=[];let loaded=0,failed=0;const assetEl=document.getElementById('asset');function assetStatus(){assetEl.textContent=`ASSETS ${loaded}/${placement.anchors.length}`+(failed?` · ${failed} FALLBACK`:``);assetEl.classList.toggle('warn',failed>0)}function commons(file){return'https://commons.wikimedia.org/wiki/Special:Redirect/file/'+encodeURIComponent(file)+'?width=1600'}for(const a of placement.anchors){const ni=nodes.findIndex(n=>n.id===a.frameNode),node=nodes[ni],s=solve(node,a),el=document.createElement('div');el.className='card';const img=document.createElement('img');img.alt=a.title;img.decoding='async';img.loading='eager';const fb=document.createElement('div');fb.className='fallback';fb.textContent='DORÉ '+String(a.doreId).padStart(3,'0')+'\n'+a.title;el.append(img,fb);const obj=new CSS3DObject(el);obj.position.copy(s.center);obj.lookAt(new THREE.Vector3(...node.p));obj.scale.set(s.w/720,s.h/960,1);obj.userData={...a,nodeIndex:ni};cssScene.add(obj);canvases.push(obj);let settled=false;const fail=()=>{if(settled)return;settled=true;failed++;el.classList.add('failed');assetStatus()};img.onload=()=>{if(settled)return;settled=true;loaded++;assetStatus()};img.onerror=fail;setTimeout(fail,8000);img.src=commons(a.file)}assetStatus();document.getElementById('boot').classList.add('done');const q=id=>document.getElementById(id),beat=q('beat'),state=q('state'),anchor=q('anchor'),frame=q('frame'),scrub=q('scrub'),play=q('play'),reset=q('reset'),time=q('time'),progress=q('progress'),cameraBtn=q('cameraBtn'),topBtn=q('topBtn');let playing=true,sec=0,last=performance.now(),mode='camera';function fmt(s){s=Math.round(s);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}function setMode(m){mode=m;cameraBtn.classList.toggle('active',m==='camera');topBtn.classList.toggle('active',m==='top')}function update(seconds){const sm=sample(timeline,seconds),u=Math.max(0,Math.min(.999999,sm.pathT)),pos=curve.getPoint(u),look=lookCurve.getPoint(u);film.position.copy(pos);const e=u*lastIndex,i0=Math.floor(e),i1=Math.min(lastIndex,i0+1),a=e-i0,lens=THREE.MathUtils.lerp(nodes[i0].lens,nodes[i1].lens,a);film.fov=vfov(lens,innerWidth/innerHeight);film.aspect=innerWidth/innerHeight;film.updateProjectionMatrix();film.lookAt(look);marker.position.copy(pos);marker.quaternion.copy(film.quaternion);const n=nodes[sm.nodeIndex];beat.textContent=n.id+' · '+n.beat;state.textContent=sm.kind+(n.timeBridge?' · '+n.timeBridge.replaceAll('_',' → '):'');const active=canvases.find(o=>o.userData.nodeIndex===sm.nodeIndex);anchor.textContent=active?'DORÉ '+String(active.userData.doreId).padStart(3,'0')+' · '+active.userData.title:'';frame.textContent=active&&sm.kind==='DWELL'?'CANONICAL FRAME MOMENT · FULL COMPOSITION':'';canvases.forEach(o=>o.element.style.opacity=o===active&&sm.kind==='DWELL'?'1':'.88');const r=Math.min(1,seconds/D);scrub.value=Math.round(r*1000);progress.style.width=r*100+'%';time.textContent=fmt(seconds)+' / '+fmt(D)}function render(){const cam=mode==='top'?top:film;gl.render(scene,cam);css.render(cssScene,cam)}function tick(now){const dt=Math.min(.1,(now-last)/1000);last=now;if(playing){sec+=dt;if(sec>=D){sec=D;playing=false;play.textContent='PLAY'}}update(sec);render();requestAnimationFrame(tick)}play.onclick=()=>{if(sec>=D)sec=0;playing=!playing;play.textContent=playing?'PAUSE':'PLAY'};reset.onclick=()=>{sec=0;playing=false;play.textContent='PLAY';update(0)};cameraBtn.onclick=()=>setMode('camera');topBtn.onclick=()=>setMode('top');scrub.oninput=()=>{sec=Number(scrub.value)/1000*D;playing=false;play.textContent='PLAY';update(sec)};addEventListener('resize',()=>{gl.setSize(innerWidth,innerHeight);css.setSize(innerWidth,innerHeight);film.aspect=innerWidth/innerHeight;film.updateProjectionMatrix()});update(0);requestAnimationFrame(tick)</script></body></html>
