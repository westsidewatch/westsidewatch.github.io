<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DORÉ FILM · Canonical Canvas Lab 01</title><style>:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080808;color:#ddd;font:12px system-ui,-apple-system,sans-serif}canvas{display:block}.hud{position:fixed;left:18px;top:16px;z-index:5;pointer-events:none;text-shadow:0 1px 10px #000}.hud b{letter-spacing:.15em}.hud div{margin-top:5px;color:#999}.hud .gold{color:#cebd74}.legend{position:fixed;right:18px;top:16px;text-align:right;color:#777;z-index:5;pointer-events:none}.controls{position:fixed;left:18px;right:18px;bottom:18px;z-index:6;display:grid;grid-template-columns:auto auto auto auto auto 1fr auto;gap:8px;align-items:center;padding:10px 12px;background:#080808d9;border:1px solid #2c2c2c}button{background:#141414;color:#bbb;border:1px solid #343434;padding:7px 10px;cursor:pointer}button.active{border-color:#cebd74;color:#eadfae}input{width:100%;accent-color:#cebd74}.time{min-width:92px;text-align:right;color:#888}.progress{position:fixed;left:0;bottom:0;height:2px;background:#cebd74;width:0;z-index:8}.loading{position:fixed;inset:0;display:grid;place-items:center;background:#080808;z-index:20;color:#777;letter-spacing:.08em}.loading.done{display:none}@media(max-width:760px){.controls{left:8px;right:8px;bottom:8px;grid-template-columns:repeat(5,auto)}.controls input{grid-column:1/-2}.legend{font-size:10px}}</style></head><body><div class="loading" id="loading">LOADING CANONICAL DORÉ ORIGINALS…</div><div class="hud"><b>CANONICAL CANVAS LAB · 01</b><div id="beat">P001</div><div id="state" class="gold">DWELL</div><div id="anchor"></div><div id="frame" class="gold"></div></div><div class="legend">ONE CAMERA · ZERO CUTS<br>CAMERA FIRST → CANVAS PLACED<br>NO LIGHT · NO LIFE · NO AI GENERATION</div><div class="controls"><button id="play">PAUSE</button><button id="reset">RESET</button><button id="cameraBtn" class="active">CAMERA</button><button id="topBtn">TOP</button><button id="splitBtn">SPLIT</button><input id="scrub" type="range" min="0" max="1000" value="0"><span class="time" id="time">00:00</span></div><div class="progress" id="progress"></div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
const RAW='https://raw.githubusercontent.com/westsidewatch/westsidewatch.github.io/main/';
const [spine,placement]=await Promise.all([
 fetch(RAW+'docs/dore/film/camera-spine-experiment-01.json',{cache:'no-store'}).then(r=>r.json()),
 fetch(RAW+'docs/dore/film/canvas-placement-experiment-01.json',{cache:'no-store'}).then(r=>r.json())
]);
function buildTimeline(nodes,target=52){const d=(a,b)=>Math.hypot(b.p[0]-a.p[0],b.p[1]-a.p[1],b.p[2]-a.p[2]),dw=nodes.reduce((s,n)=>s+Number(n.dwell||0),0),raw=nodes.slice(0,-1).map((n,i)=>d(n,nodes[i+1])/Math.max(.001,(Number(n.speed||.2)+Number(nodes[i+1].speed||.2))/2)),rt=raw.reduce((s,v)=>s+v,0),travel=raw.map(v=>v/rt*Math.max(8,target-dw));let c=0;const events=[];nodes.forEach((n,i)=>{const hold=Number(n.dwell||0);if(hold){events.push({kind:'DWELL',nodeIndex:i,start:c,end:c+hold});c+=hold}if(i<nodes.length-1){events.push({kind:'TRAVEL',nodeIndex:i,start:c,end:c+travel[i]});c+=travel[i]}});return{duration:c,events}}
function sampleTimeline(tl,nodes,sec){sec=Math.max(0,Math.min(tl.duration,sec));const e=tl.events.find(x=>sec>=x.start&&sec<x.end)||tl.events.at(-1),last=nodes.length-1;if(e.kind==='DWELL')return{kind:'DWELL',nodeIndex:e.nodeIndex,pathT:e.nodeIndex/last};const a=(sec-e.start)/(e.end-e.start);return{kind:'TRAVEL',nodeIndex:a<.5?e.nodeIndex:e.nodeIndex+1,pathT:(e.nodeIndex+a)/last}}
function verticalFov(lens,aspect,sensor=36){const h=2*Math.atan(sensor/(2*lens));return 2*Math.atan(Math.tan(h/2)/aspect)*180/Math.PI}
function solve(node,imageAspect,a){const aspect=placement.viewport.aspect,d=a.distance,fill=a.frameFill,v=verticalFov(node.lens,aspect)*Math.PI/180,visibleH=2*d*Math.tan(v/2),visibleW=visibleH*aspect;let w,h;if(imageAspect>=aspect){w=visibleW*fill;h=w/imageAspect}else{h=visibleH*fill;w=h*imageAspect}const cp=new THREE.Vector3(...node.p),look=new THREE.Vector3(...node.look),forward=look.sub(cp).normalize(),center=cp.clone().add(forward.multiplyScalar(d));return{center,w,h}}
const nodes=spine.nodes,lastIndex=nodes.length-1,pts=nodes.map(n=>new THREE.Vector3(...n.p)),looks=nodes.map(n=>new THREE.Vector3(...n.look)),curve=new THREE.CatmullRomCurve3(pts,false,'centripetal',.5),lookCurve=new THREE.CatmullRomCurve3(looks,false,'centripetal',.5),timeline=buildTimeline(nodes,52),D=timeline.duration;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x080808);scene.fog=new THREE.FogExp2(0x080808,.009);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);document.body.prepend(renderer.domElement);
const grid=new THREE.GridHelper(190,95,0x222222,0x131313);grid.position.set(31,0,-58);scene.add(grid);scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(curve.getPoints(1000)),new THREE.LineBasicMaterial({color:0xcebd74,transparent:true,opacity:.22})));
for(const n of nodes){const m=new THREE.Mesh(new THREE.SphereGeometry(.15,10,8),new THREE.MeshBasicMaterial({color:n.timeBridge?0xcebd74:0x777777}));m.position.set(...n.p);scene.add(m)}
const film=new THREE.PerspectiveCamera(45,1,.1,500),top=new THREE.OrthographicCamera(-46,46,30,-30,.1,500);top.position.set(31,95,-57);top.up.set(0,0,-1);top.lookAt(31,0,-57);const marker=new THREE.Mesh(new THREE.ConeGeometry(.35,1.1,4),new THREE.MeshBasicMaterial({color:0xcebd74,wireframe:true}));marker.rotation.x=Math.PI/2;scene.add(marker);
const canvasObjects=[];const loader=new THREE.TextureLoader();loader.setCrossOrigin('anonymous');
function commons(file){return 'https://commons.wikimedia.org/wiki/Special:Redirect/file/'+encodeURIComponent(file)+'?width=1600'}
await Promise.all(placement.anchors.map(async a=>{const nodeIndex=nodes.findIndex(n=>n.id===a.frameNode),node=nodes[nodeIndex];const tex=await loader.loadAsync(commons(a.file));tex.colorSpace=THREE.SRGBColorSpace;const im=tex.image,imageAspect=im.naturalWidth/im.naturalHeight,s=solve(node,imageAspect,a),mat=new THREE.MeshBasicMaterial({map:tex,side:THREE.DoubleSide,toneMapped:false}),plane=new THREE.Mesh(new THREE.PlaneGeometry(s.w,s.h),mat);plane.position.copy(s.center);plane.lookAt(new THREE.Vector3(...node.p));plane.userData={...a,nodeIndex,imageAspect,width:s.w,height:s.h};scene.add(plane);canvasObjects.push(plane);const edge=new THREE.LineSegments(new THREE.EdgesGeometry(plane.geometry),new THREE.LineBasicMaterial({color:0x555555,transparent:true,opacity:.35}));plane.add(edge)}));
document.getElementById('loading').classList.add('done');
const q=id=>document.getElementById(id),beat=q('beat'),state=q('state'),anchor=q('anchor'),frame=q('frame'),scrub=q('scrub'),play=q('play'),reset=q('reset'),time=q('time'),progress=q('progress'),cameraBtn=q('cameraBtn'),topBtn=q('topBtn'),splitBtn=q('splitBtn');let playing=true,sec=0,last=performance.now(),mode='camera';
function fmt(s){s=Math.round(s);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function setMode(m){mode=m;cameraBtn.classList.toggle('active',m==='camera');topBtn.classList.toggle('active',m==='top');splitBtn.classList.toggle('active',m==='split')}
function update(seconds){const sm=sampleTimeline(timeline,nodes,seconds),u=Math.max(0,Math.min(.999999,sm.pathT)),pos=curve.getPoint(u),look=lookCurve.getPoint(u);film.position.copy(pos);const e=u*lastIndex,i0=Math.floor(e),i1=Math.min(lastIndex,i0+1),a=e-i0,lens=THREE.MathUtils.lerp(nodes[i0].lens,nodes[i1].lens,a);film.fov=verticalFov(lens,innerWidth/innerHeight);film.aspect=innerWidth/innerHeight;film.updateProjectionMatrix();film.lookAt(look);marker.position.copy(pos);marker.quaternion.copy(film.quaternion);const n=nodes[sm.nodeIndex];beat.textContent=n.id+' · '+n.beat;state.textContent=sm.kind+(n.timeBridge?' · '+n.timeBridge.replaceAll('_',' → '):'');const active=canvasObjects.find(o=>o.userData.nodeIndex===sm.nodeIndex);anchor.textContent=active?'DORÉ '+String(active.userData.doreId).padStart(3,'0')+' · '+active.userData.title:'';frame.textContent=active&&sm.kind==='DWELL'?'CANONICAL FRAME MOMENT · FULL COMPOSITION':'';canvasObjects.forEach(o=>{const exact=o.userData.nodeIndex===sm.nodeIndex&&sm.kind==='DWELL';o.material.opacity=exact?1:.9;o.material.transparent=!exact});const ratio=Math.min(1,seconds/D);scrub.value=Math.round(ratio*1000);progress.style.width=ratio*100+'%';time.textContent=fmt(seconds)+' / '+fmt(D)}
function vp(cam,x,w){renderer.setViewport(x,0,w,innerHeight);renderer.setScissor(x,0,w,innerHeight);if(cam===film){cam.aspect=w/innerHeight;cam.updateProjectionMatrix()}renderer.render(scene,cam)}function render(){renderer.setScissorTest(true);if(mode==='camera')vp(film,0,innerWidth);else if(mode==='top')vp(top,0,innerWidth);else{const w=Math.floor(innerWidth/2);vp(film,0,w);vp(top,w,innerWidth-w)}renderer.setScissorTest(false)}
function tick(now){const dt=Math.min(.1,(now-last)/1000);last=now;if(playing){sec+=dt;if(sec>=D){sec=D;playing=false;play.textContent='PLAY'}}update(sec);render();requestAnimationFrame(tick)}play.onclick=()=>{if(sec>=D)sec=0;playing=!playing;play.textContent=playing?'PAUSE':'PLAY'};reset.onclick=()=>{sec=0;playing=false;play.textContent='PLAY';update(0)};cameraBtn.onclick=()=>setMode('camera');topBtn.onclick=()=>setMode('top');splitBtn.onclick=()=>setMode('split');scrub.oninput=()=>{sec=Number(scrub.value)/1000*D;playing=false;play.textContent='PLAY';update(sec)};addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();play.click()}else if(e.key==='1')setMode('camera');else if(e.key==='2')setMode('top');else if(e.key==='3')setMode('split');else if(e.key==='ArrowRight'){sec=Math.min(D,sec+.5);playing=false}else if(e.key==='ArrowLeft'){sec=Math.max(0,sec-.5);playing=false}});addEventListener('resize',()=>renderer.setSize(innerWidth,innerHeight));update(0);requestAnimationFrame(tick);
</script></body></html>
