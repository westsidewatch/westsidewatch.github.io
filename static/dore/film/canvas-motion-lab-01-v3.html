<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DORÉ FILM · Camera-first Canonical Canvas Lab v3</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#050505;color:#ddd;font:12px system-ui}canvas{display:block;width:100%;height:100%}.hud{position:fixed;left:18px;top:16px;z-index:2;text-shadow:0 1px 8px #000}.hud b{letter-spacing:.13em}.hud div{margin-top:6px;color:#999}.gold{color:#cebd74!important}.status{position:fixed;right:18px;top:16px;text-align:right;color:#777;z-index:2}.controls{position:fixed;left:18px;right:18px;bottom:18px;z-index:2;display:grid;grid-template-columns:auto auto 1fr auto;gap:8px;align-items:center;background:#080808dc;border:1px solid #333;padding:10px}.controls button{background:#151515;color:#bbb;border:1px solid #444;padding:7px 10px}.controls input{width:100%;accent-color:#cebd74}.note{position:fixed;left:18px;bottom:72px;color:#777;z-index:2}.badge{display:inline-block;border:1px solid #5b5130;padding:3px 6px;color:#cebd74}</style><body><canvas id="c"></canvas><div class="hud"><b>CANONICAL CANVAS LAB · CAMERA-FIRST v3</b><div id="beat">P001 · Abraham enters journey</div><div id="state" class="gold">CAMERA → LENS/FOV → CANVAS PLACEMENT</div><div id="anchor"></div></div><div class="status" id="status">NO THREE.JS · NO WEBGL TEXTURE<br>CANONICAL IMAGES LOAD INDEPENDENTLY</div><div class="note"><span class="badge">ONE CAMERA · ZERO CUTS</span> Full canvas dimensions are solved from the authored camera, not fixed UI boxes.</div><div class="controls"><button id="play">PAUSE</button><button id="reset">RESET</button><input id="scrub" type="range" min="0" max="1000" value="0"><span id="time">00:00 / 00:52</span></div><script>
const N=[
{id:'P001',beat:'Abraham enters journey',p:[0,1.65,0],look:[0,1.45,-5],lens:40,dwell:1.8},
{id:'P002',beat:'Follow Abraham',p:[.7,1.6,-5],look:[.9,1.4,-9],lens:42,dwell:.4},
{id:'P003',beat:'Abraham drifts from centre',p:[1.5,1.55,-10],look:[2.3,1.35,-14],lens:45,dwell:.7},
{id:'P004',beat:'World takes frame',p:[3.2,1.7,-15],look:[5.8,1.3,-21],lens:38,dwell:1.4},
{id:'P005',beat:'Abraham age begins to recede',p:[6.4,1.85,-21],look:[9.5,1.3,-27],lens:36,dwell:1.8},
{id:'P006',beat:'Promise carries through empty time',p:[10.2,2.1,-27],look:[14.2,1.2,-34],lens:35,dwell:2.2},
{id:'P007',beat:'New figure appears at distance',p:[14.8,2,-34],look:[18.5,1.35,-40],lens:40,dwell:1.3},
{id:'P008',beat:'Isaac acquired',p:[18,1.65,-40],look:[20,1.4,-44],lens:48,dwell:1.1},
{id:'P009',beat:'Follow Isaac',p:[20.4,1.6,-45],look:[22.5,1.4,-50],lens:45,dwell:.5},
{id:'P010',beat:'Isaac settles',p:[22.5,1.55,-50],look:[24.2,1.3,-54],lens:50,dwell:1.5},
{id:'P011',beat:'Camera stops depending on Isaac',p:[24,1.6,-54],look:[27,1.25,-59],lens:45,dwell:1.8},
{id:'P012',beat:'Cross spatial threshold',p:[27.5,1.75,-59],look:[31.5,1.3,-65],lens:40,dwell:.8},
{id:'P013',beat:'World exists without patriarch',p:[32,2,-65],look:[37,1.1,-72],lens:35,dwell:2.6},
{id:'P014',beat:'Isaac age becomes Jacob age',p:[37.8,2.2,-72],look:[42,1.3,-79],lens:38,dwell:2},
{id:'P015',beat:'Jacob enters',p:[42.5,1.7,-79],look:[45,1.4,-84],lens:46,dwell:1},
{id:'P016',beat:'Jacob departs',p:[45.5,1.6,-84],look:[48.5,1.35,-90],lens:42,dwell:.4},
{id:'P017',beat:'Road bends into wilderness',p:[49,1.7,-91],look:[53,1.25,-98],lens:38,dwell:.5},
{id:'P018',beat:'Jacob becomes small in world',p:[54,2.4,-99],look:[58,1.2,-106],lens:32,dwell:1.4},
{id:'P019',beat:'Night / Jacob sleeps',p:[59,2.8,-107],look:[62,.9,-112],lens:40,dwell:3},
{id:'P020',beat:"Jacob's Dream — experiment terminus",p:[62.5,3.6,-113],look:[62,4.8,-118],lens:35,dwell:4}
];
const A=[
{id:11,node:0,title:'Abraham Journeying into the Land of Canaan',url:'https://upload.wikimedia.org/wikipedia/commons/e/e5/011.Abraham_Goes_to_the_Land_of_Canaan.jpg',w:2617,h:2074},
{id:19,node:7,title:'The Meeting of Isaac and Rebekah',url:'https://upload.wikimedia.org/wikipedia/commons/c/c6/019.The_Meeting_of_Isaac_and_Rebekah.jpg',w:2370,h:2920},
{id:21,node:19,title:"Jacob's Dream",url:"https://upload.wikimedia.org/wikipedia/commons/1/14/021.Jacob%27s_Dream.jpg",w:2315,h:2873}
];
const c=document.getElementById('c'),x=c.getContext('2d'),DPR=Math.min(2,devicePixelRatio||1),V={sub:(a,b)=>a.map((v,i)=>v-b[i]),add:(a,b)=>a.map((v,i)=>v+b[i]),mul:(a,s)=>a.map(v=>v*s),dot:(a,b)=>a.reduce((s,v,i)=>s+v*b[i],0),cross:(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],norm:a=>{let l=Math.hypot(...a)||1;return a.map(v=>v/l)},lerp:(a,b,t)=>a.map((v,i)=>v+(b[i]-v)*t)};
let W=1,H=1,aspect=16/9,t=0,playing=true,last=performance.now();
const q=id=>document.getElementById(id),play=q('play'),scrub=q('scrub'),beat=q('beat'),anchor=q('anchor'),time=q('time'),status=q('status');
function resize(){W=innerWidth;H=innerHeight;aspect=W/H;c.width=W*DPR;c.height=H*DPR;c.style.width=W+'px';c.style.height=H+'px';x.setTransform(DPR,0,0,DPR,0,0);solveAnchors()}
function fov(l){const hf=2*Math.atan(36/(2*l));return 2*Math.atan(Math.tan(hf/2)/aspect)}
function basis(p,look){const f=V.norm(V.sub(look,p)),r=V.norm(V.cross(f,[0,1,0])),u=V.norm(V.cross(r,f));return{f,r,u}}
function solveAnchors(){for(const a of A){const n=N[a.node],b=basis(n.p,n.look),d=9,vh=2*d*Math.tan(fov(n.lens)/2),vw=vh*aspect,ia=a.w/a.h;let pw,ph;if(ia>aspect){pw=vw*.82;ph=pw/ia}else{ph=vh*.82;pw=ph*ia}const center=V.add(n.p,V.mul(b.f,d));a.center=center;a.right=b.r;a.up=b.u;a.pw=pw;a.ph=ph;a.corners=[V.add(V.add(center,V.mul(b.r,-pw/2)),V.mul(b.u,ph/2)),V.add(V.add(center,V.mul(b.r,pw/2)),V.mul(b.u,ph/2)),V.add(V.add(center,V.mul(b.r,pw/2)),V.mul(b.u,-ph/2)),V.add(V.add(center,V.mul(b.r,-pw/2)),V.mul(b.u,-ph/2))]}}
function timeline(){const weights=[];for(let i=0;i<N.length-1;i++){const d=Math.hypot(...V.sub(N[i+1].p,N[i].p));weights.push(d+N[i].dwell*1.4)}let sum=weights.reduce((a,b)=>a+b,0),acc=0,marks=[0];for(const w of weights){acc+=w/sum*52;marks.push(acc)}return marks}const marks=timeline();
function pose(tt){if(tt>=52)return{...N[N.length-1],idx:N.length-1,u:1};let i=0;while(i<marks.length-2&&tt>marks[i+1])i++;const u=(tt-marks[i])/(marks[i+1]-marks[i]||1);return{p:V.lerp(N[i].p,N[i+1].p,u),look:V.lerp(N[i].look,N[i+1].look,u),lens:N[i].lens+(N[i+1].lens-N[i].lens)*u,idx:i,u}}
function project(pt,cam){const b=basis(cam.p,cam.look),r=V.sub(pt,cam.p),z=V.dot(r,b.f);if(z<=.05)return null;const fp=(H/2)/Math.tan(fov(cam.lens)/2);return[W/2+V.dot(r,b.r)/z*fp,H/2-V.dot(r,b.u)/z*fp,z]}
function tri(img,s0,s1,s2,d0,d1,d2){const det=s0[0]*(s1[1]-s2[1])+s1[0]*(s2[1]-s0[1])+s2[0]*(s0[1]-s1[1]);if(Math.abs(det)<1e-6)return;const a=(d0[0]*(s1[1]-s2[1])+d1[0]*(s2[1]-s0[1])+d2[0]*(s0[1]-s1[1]))/det,b=(d0[1]*(s1[1]-s2[1])+d1[1]*(s2[1]-s0[1])+d2[1]*(s0[1]-s1[1]))/det,cc=(d0[0]*(s2[0]-s1[0])+d1[0]*(s0[0]-s2[0])+d2[0]*(s1[0]-s0[0]))/det,d=(d0[1]*(s2[0]-s1[0])+d1[1]*(s0[0]-s2[0])+d2[1]*(s1[0]-s0[0]))/det,e=(d0[0]*(s1[0]*s2[1]-s2[0]*s1[1])+d1[0]*(s2[0]*s0[1]-s0[0]*s2[1])+d2[0]*(s0[0]*s1[1]-s1[0]*s0[1]))/det,f=(d0[1]*(s1[0]*s2[1]-s2[0]*s1[1])+d1[1]*(s2[0]*s0[1]-s0[0]*s2[1])+d2[1]*(s0[0]*s1[1]-s1[0]*s0[1]))/det;x.save();x.beginPath();x.moveTo(d0[0],d0[1]);x.lineTo(d1[0],d1[1]);x.lineTo(d2[0],d2[1]);x.closePath();x.clip();x.setTransform(DPR*a,DPR*b,DPR*cc,DPR*d,DPR*e,DPR*f);x.drawImage(img,0,0);x.restore();x.setTransform(DPR,0,0,DPR,0,0)}
function drawPlane(a,cam){const p=a.corners.map(v=>project(v,cam));if(p.some(v=>!v))return false;const pts=p.map(v=>[v[0],v[1]]),on=pts.some(v=>v[0]>-W&&v[0]<2*W&&v[1]>-H&&v[1]<2*H);if(!on)return false;if(a.loaded){tri(a.img,[0,0],[a.w,0],[0,a.h],pts[0],pts[1],pts[3]);tri(a.img,[a.w,0],[a.w,a.h],[0,a.h],pts[1],pts[2],pts[3])}else{x.save();x.strokeStyle='#5a5132';x.lineWidth=1;x.beginPath();x.moveTo(...pts[0]);for(let i=1;i<4;i++)x.lineTo(...pts[i]);x.closePath();x.stroke();x.fillStyle='#777';x.font='12px system-ui';x.fillText('DORÉ '+String(a.id).padStart(3,'0')+' · loading independently',pts[0][0]+8,pts[0][1]+18);x.restore()}return true}
function render(){x.setTransform(DPR,0,0,DPR,0,0);x.clearRect(0,0,W,H);x.fillStyle='#050505';x.fillRect(0,0,W,H);const cam=pose(t);let vis=[];for(const a of A)if(drawPlane(a,cam))vis.push(a.id);const nearest=Math.min(N.length-1,Math.round((cam.idx+cam.u)));beat.textContent=N[nearest].id+' · '+N[nearest].beat;const hit=A.find(a=>Math.abs(t-marks[a.node])<1.1);anchor.textContent=hit?'DORÉ '+String(hit.id).padStart(3,'0')+' · CANONICAL FRAME MOMENT · FULL COMPOSITION':'';scrub.value=Math.round(t/52*1000);time.textContent=fmt(t)+' / 00:52';status.innerHTML='NO THREE.JS · NO WEBGL TEXTURE<br>VISIBLE CANVAS IDS: '+(vis.join(', ')||'—')}
function fmt(s){s=Math.round(s);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
for(const a of A){a.img=new Image();a.img.referrerPolicy='no-referrer';a.img.onload=()=>{a.loaded=true};a.img.onerror=()=>{a.failed=true};a.img.src=a.url}
function tick(now){const dt=Math.min(.1,(now-last)/1000);last=now;if(playing){t+=dt;if(t>=52){t=52;playing=false;play.textContent='PLAY'}}render();requestAnimationFrame(tick)}
play.onclick=()=>{if(t>=52)t=0;playing=!playing;play.textContent=playing?'PAUSE':'PLAY'};reset.onclick=()=>{t=0;playing=false;play.textContent='PLAY';render()};scrub.oninput=()=>{t=+scrub.value/1000*52;playing=false;play.textContent='PLAY';render()};addEventListener('resize',resize);resize();render();requestAnimationFrame(tick)
</script>
