<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Doré Design · Training Evidence 01</title><style>:root{--gold:#CEBD74;--ink:#252525;--paper:#eee8db;--night:#11161b;--line:rgba(37,37,37,.22)}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Serif TC",Georgia,serif}header{min-height:54vh;padding:7vw;display:flex;flex-direction:column;justify-content:space-between;border-bottom:1px solid var(--ink)}.kicker,.meta,.label{font:10px/1.5 ui-monospace,monospace;letter-spacing:.16em;text-transform:uppercase}h1{font:400 clamp(58px,10vw,150px)/.78 Georgia,serif;letter-spacing:-.055em;margin:.6em 0 .15em;max-width:8ch}.intro{max-width:48em;font-size:clamp(16px,1.6vw,23px);line-height:1.65}.round{padding:7vw;border-bottom:1px solid var(--ink)}.head{display:grid;grid-template-columns:1fr 2fr;gap:4vw;margin-bottom:4vw}.head h2{font:400 clamp(38px,6vw,88px)/.9 Georgia,serif;letter-spacing:-.04em;margin:0}.assignment{font-size:clamp(15px,1.4vw,20px);line-height:1.6}.evidence{display:grid;grid-template-columns:1fr 1fr;gap:2vw}.phase{min-width:0}.phase h3{font:11px/1 ui-monospace,monospace;letter-spacing:.16em;text-transform:uppercase;border-top:1px solid;padding-top:12px;margin:0 0 18px}.rasters{display:grid;grid-template-columns:1fr 1fr;gap:8px}.shot{margin:0;background:#d8d0c1}.shot img{width:100%;height:auto;display:block}.shot figcaption{padding:8px 10px;font:9px/1.3 ui-monospace,monospace;letter-spacing:.12em}.learning{display:grid;grid-template-columns:1fr 1fr 1fr;gap:2vw;margin-top:3vw;padding-top:2vw;border-top:1px solid var(--line)}.learning p{margin:.6em 0 0;line-height:1.55}.weapons span{display:inline-block;border:1px solid var(--line);padding:7px 9px;margin:4px 4px 0 0;font:9px/1 ui-monospace,monospace;letter-spacing:.08em}footer{padding:5vw 7vw;background:var(--night);color:#eee8db;display:flex;justify-content:space-between;gap:3vw}.back{color:inherit;text-decoration:none;border-bottom:1px solid var(--gold)}@media(max-width:800px){.head,.evidence,.learning{grid-template-columns:1fr}.rasters{grid-template-columns:1fr}header,.round{padding:9vw 6vw}}</style></head><body><header><div><div class="kicker">DORÉ DESIGN · WEAPON PROFICIENCY · ROUND 01</div><h1>Learning<br>Evidence</h1></div><p class="intro">這不是展示稿。這裡只顯示 Doré 在同一輪訓練中真正產生並經 real-browser raster 驗證的 Before / After。Italian Editorial Atlas 是教材，Design Arsenal 是武器；沒有 winner，也沒有 production promotion。</p></header><main id="app"></main><footer><span class="meta">designer: dore · round: 01 · winner: null</span><a class="back" href="./living-water-bloom-armed-v2.html">← Living Water Bloom</a></footer><script>const ROOT='../../dore-design/training/evidence/round-01/';const names={'sacred-threshold':'Sacred Threshold','living-community':'Living Community','quiet-light':'Quiet Light','architectural-bloom':'Architectural Bloom'};function shot(src,label){return `<figure class="shot"><img loading="lazy" src="${ROOT+src.split('round-01/')[1]}" alt="${label}"><figcaption>${label}</figcaption></figure>`}fetch(ROOT+'report.json').then(r=>r.json()).then(d=>{document.querySelector('#app').innerHTML=d.candidates.map((c,i)=>`<section class="round"><div class="head"><div><div class="kicker">0${i+1} / ${c.id}</div><h2>${names[c.id]||c.id}</h2></div><div class="assignment"><div class="label">Italian editorial assignment</div><p>${c.assignment}</p></div></div><div class="evidence"><div class="phase"><h3>Before · First Pass</h3><div class="rasters">${shot(c.beforeRaster.A,'Before A · desktop raster')}${shot(c.beforeRaster.B,'Before B · desktop raster')}</div></div><div class="phase"><h3>After · Self Revision</h3><div class="rasters">${shot(c.afterRaster.A,'After A · desktop raster')}${shot(c.afterRaster.B,'After B · desktop raster')}</div></div></div><div class="learning"><div><div class="label">Doré diagnosis</div><p>${(c.diagnosis.firstPassFailureDomains||[]).join(' · ')}</p><p>${c.diagnosis.trainerQuestion||''}</p></div><div class="weapons"><div class="label">Weapons selected</div>${(c.weaponsUsed||[]).map(x=>`<span>${x}</span>`).join('')}</div><div><div class="label">Self revision</div><p>${c.selfRevision.consensus?'Consensus reached':'Revision completed; critic consensus not forced.'}</p><p class="meta">model: ${c.selfRevision.model||'dore-local'} · memory admitted: ${String(c.selfRevision.memoryAdmitted)}</p></div></div></section>`).join('')}).catch(e=>{document.querySelector('#app').innerHTML=`<section class="round"><h2>Evidence unavailable</h2><p>${e}</p></section>`})</script></body></html>
