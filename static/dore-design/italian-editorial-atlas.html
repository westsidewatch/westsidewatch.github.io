<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Doré Design · Italian Editorial Atlas</title>
<style>
:root{--p:#f2efe7;--i:#171717;--m:#716c63;--l:#c9c2b6;--paper:#e9e4da}*{box-sizing:border-box}body{margin:0;background:var(--p);color:var(--i);font-family:Arial,sans-serif}.w{max-width:1500px;margin:auto;padding:28px}h1{font:clamp(42px,7vw,92px)/.88 Georgia,serif;margin:8px 0 26px}.k{font-size:11px;letter-spacing:.16em;text-transform:uppercase}.lead{max-width:900px;line-height:1.55;color:var(--m)}.selectors{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:30px 0}.select{border-top:1px solid;padding-top:8px}.select label{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:7px}.select select{width:100%;background:transparent;border:1px solid var(--i);padding:11px;font-size:14px}.stage{display:grid;grid-template-columns:minmax(330px,.86fr) minmax(430px,1.14fr);gap:22px;border-top:1px solid;padding-top:22px}.identity{min-height:620px;border:1px solid;padding:22px;display:flex;flex-direction:column}.pub{font:58px/.9 Georgia,serif}.era{font:24px/1.1 Georgia,serif;margin-top:12px}.status{margin:8px 0 18px;color:var(--m);font-size:12px}.viewer{margin-top:auto;min-height:330px;background:#ded9ce;position:relative;overflow:hidden;display:grid;place-items:center}.viewer img{width:100%;height:100%;min-height:330px;max-height:500px;object-fit:contain;background:#ded9ce}.viewer .emptyVisual{padding:28px;max-width:390px;font:18px/1.35 Georgia,serif;color:#625e56}.viewer:after{content:'VISUAL EVIDENCE';position:absolute;left:14px;bottom:14px;background:var(--p);padding:7px;font-size:9px;letter-spacing:.15em}.evnav{display:flex;align-items:center;gap:8px;margin-top:9px}.evnav button{border:1px solid;background:transparent;padding:6px 9px;cursor:pointer}.evcount{font:10px ui-monospace,monospace;color:var(--m)}.evlabel{font:12px/1.4 Georgia,serif;margin-top:8px}.evmeta{font:9px/1.4 ui-monospace,monospace;color:var(--m);text-transform:uppercase;margin-top:4px}.evsource{font-size:10px;color:inherit}.right{display:grid;gap:14px}.panel{border:1px solid var(--l);padding:16px}.panel h2{font:26px Georgia,serif;margin:0 0 12px}.mods{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.mod{border-top:1px solid var(--l);padding-top:8px}.mod b{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:6px}.mod div,.evidence{font-size:12px;line-height:1.5;color:#4f4b45}.evidenceCard{border-top:1px solid var(--l);padding:8px 0}.evidenceCard:first-child{border-top:0}.badge{font:9px ui-monospace,monospace;text-transform:uppercase;color:var(--m)}.prompt{white-space:pre-wrap;font:12px/1.5 ui-monospace,monospace;background:var(--paper);padding:13px}.actions{display:flex;gap:8px;margin-top:10px}.actions button{border:1px solid;background:transparent;padding:8px 10px;cursor:pointer}.actions .primary{background:var(--i);color:white}.empty{color:var(--m)}@media(max-width:800px){.selectors,.stage{grid-template-columns:1fr}.mods{grid-template-columns:1fr}}
</style></head><body><main class="w">
<div class="k">Doré Design / Emergence / Research Surface</div><h1>Italian Editorial Atlas</h1><p class="lead">從刊物進入時代，再進入可組合 grammar。左側不是風格裝飾，而是當前 grammar 的 Visual Evidence：選擇改變，證據跟著改變；prompt 是被證據約束的即時壓縮。</p>
<section class="selectors"><div class="select"><label>01 Publication / 刊物</label><select id="family"></select></div><div class="select"><label>02 Era / 時代</label><select id="era"></select></div><div class="select"><label>03 Grammar / 語法</label><select id="grammar"></select></div></section>
<section class="stage"><div class="identity"><div class="k">Selected editorial lineage</div><div class="pub" id="pub"></div><div class="era" id="eraName"></div><div class="status" id="status"></div><div class="viewer" id="viewer"></div><div class="evnav"><button id="prev">←</button><span class="evcount" id="evcount"></span><button id="next">→</button></div><div class="evlabel" id="evlabel"></div><div class="evmeta" id="evmeta"></div></div>
<div class="right"><div class="panel"><h2>Composable grammar</h2><div class="mods" id="mods"></div></div><div class="panel"><h2>Issue evidence</h2><div class="evidence" id="evidence"></div></div><div class="panel"><h2>Generated prompt</h2><div class="prompt" id="prompt"></div><div class="actions"><button class="primary" id="copy">複製提示詞</button><button id="copyId">複製 Era ID</button></div></div></div></section></main>
<script>
let db,edb,currentEvidence=[],evi=0;const F=document.querySelector('#family'),E=document.querySelector('#era'),G=document.querySelector('#grammar');const modules=['all','layout','image','typography','material','density','sequence','irony','emergence'];
Promise.all([fetch('./italian-editorial-grammars.v1.json').then(r=>r.json()),fetch('./italian-editorial-evidence.v1.json').then(r=>r.json())]).then(([g,v])=>{db=g;edb=v;F.innerHTML=g.families.map(f=>`<option value="${f.id}">${f.publication}</option>`).join('');F.onchange=eras;E.onchange=render;G.innerHTML=modules.map(m=>`<option value="${m}">${m==='all'?'All grammar':m}</option>`).join('');G.onchange=render;document.querySelector('#prev').onclick=()=>step(-1);document.querySelector('#next').onclick=()=>step(1);eras()}).catch(()=>document.querySelector('#prompt').textContent='Registry load failed.');
function family(){return db.families.find(x=>x.id===F.value)}function era(){return family().eras.find(x=>x.id===E.value)}function eras(){const f=family();E.innerHTML=f.eras.map(e=>`<option value="${e.id}">${e.label}</option>`).join('');render()}
function evidenceFor(f,e,pick){const all=(edb.items||[]).filter(x=>x.family===f.id&&x.era===e.id);if(pick==='all')return all;const tokens=e.grammar[pick]||[];return all.filter(x=>(x.modules||[]).includes(pick)||tokens.some(t=>(x.tokens||[]).includes(t)))}
function showEvidence(){const v=document.querySelector('#viewer'),x=currentEvidence[evi];if(!x){v.innerHTML='<div class="emptyVisual">No visual evidence admitted for this exact selection yet.<br><br>這裡不再用假的 style placeholder 補位。</div>';document.querySelector('#evcount').textContent='0 / 0';document.querySelector('#evlabel').textContent='';document.querySelector('#evmeta').textContent='';return}v.innerHTML=x.image?`<img src="${x.image}" alt="${x.label}" referrerpolicy="no-referrer" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'emptyVisual',textContent:'Evidence image unavailable; use source record below.'}))">`:'<div class="emptyVisual">Evidence record exists; visual reproduction is not yet admitted. Use the source record below.</div>';document.querySelector('#evcount').textContent=`${evi+1} / ${currentEvidence.length}`;document.querySelector('#evlabel').innerHTML=`${x.label}${x.source?` · <a class="evsource" href="${x.source}" target="_blank" rel="noreferrer">source ↗</a>`:''}`;document.querySelector('#evmeta').textContent=`${x.authority} · ${x.id}`}
function step(d){if(!currentEvidence.length)return;evi=(evi+d+currentEvidence.length)%currentEvidence.length;showEvidence()}
function render(){const f=family(),e=era(),pick=G.value||'all';document.querySelector('#pub').textContent=f.publication;document.querySelector('#eraName').textContent=e.label;document.querySelector('#status').textContent=`${e.status} · ${e.id}`;const entries=Object.entries(e.grammar).filter(([k])=>pick==='all'||k===pick);document.querySelector('#mods').innerHTML=entries.map(([k,v])=>`<div class="mod"><b>${k}</b><div>${v.length?v.join(' · '):'—'}</div></div>`).join('');currentEvidence=evidenceFor(f,e,pick);evi=0;showEvidence();const legacy=e.evidence||[];const cards=currentEvidence.map(x=>`<div class="evidenceCard"><span class="badge">${x.authority}</span><br>${x.label}</div>`);document.querySelector('#evidence').innerHTML=[...cards,...legacy.map(x=>`<div class="evidenceCard">${x}</div>`)].join('')||'<span class="empty">No admitted evidence yet.</span>';const selected=pick==='all'?Object.entries(e.grammar).flatMap(([k,v])=>v.map(x=>`${k}: ${x}`)):(e.grammar[pick]||[]).map(x=>`${pick}: ${x}`);const base=e.prompt?.cover||`Preserve the supplied source image and subject identity. Recompose it using the selected ${f.publication} / ${e.label} editorial grammar without copying logos, mastheads or a historical cover.`;const temporal=e.prompt?.emergence?`\n\nTemporal / Emergence translation: ${e.prompt.emergence}`:'';const authority=currentEvidence.length?`\n\nVisual evidence authority: ${currentEvidence.map(x=>x.id).join(', ')}. Use these references to constrain composition, crop, hierarchy, density, material and image treatment; do not copy their literal content.`:'\n\nVisual evidence authority: none admitted for this exact selection; do not invent historical specifics.';document.querySelector('#prompt').textContent=`${base}\n\nSelected grammar:\n- ${selected.join('\n- ')}${temporal}${authority}`;document.querySelector('#copy').onclick=()=>navigator.clipboard.writeText(document.querySelector('#prompt').textContent);document.querySelector('#copyId').onclick=()=>navigator.clipboard.writeText(e.id)}
</script></body></html>
