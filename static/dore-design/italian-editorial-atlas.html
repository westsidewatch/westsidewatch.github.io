<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Doré Design · Italian Editorial Atlas</title>
<style>
:root{--paper:#f2efe7;--ink:#171717;--muted:#6f6b63;--line:#cfc8bb;--panel:#faf8f2;--accent:#9b1f24;--dark:#121212}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif}.wrap{max-width:1500px;margin:auto;padding:28px}.top{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end;border-bottom:1px solid var(--ink);padding-bottom:18px}.eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase}.title{font-family:Georgia,'Times New Roman',serif;font-size:clamp(38px,6vw,86px);line-height:.9;margin:9px 0 0;max-width:980px}.sub{max-width:520px;font-size:14px;line-height:1.5;color:var(--muted)}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}.chip{border:1px solid var(--ink);background:transparent;padding:8px 12px;cursor:pointer}.chip.active{background:var(--ink);color:var(--paper)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px}.card{border:1px solid var(--ink);background:var(--panel);display:grid;grid-template-rows:460px auto;min-height:720px}.cover{position:relative;overflow:hidden;background:#ddd}.cover .image{position:absolute;inset:0;background:linear-gradient(145deg,#bbb 0 42%,#6e6e6e 42% 62%,#d8d8d8 62%);filter:grayscale(1)}.cover .grain{position:absolute;inset:0;background-image:radial-gradient(rgba(0,0,0,.18) .45px,transparent .45px);background-size:4px 4px;mix-blend-mode:multiply;opacity:.35}.cover .mast{position:absolute;z-index:2;font-family:Georgia,serif;line-height:.8}.cover .meta{position:absolute;z-index:2;font-size:10px;letter-spacing:.16em;text-transform:uppercase}.body{padding:18px;display:flex;flex-direction:column;gap:13px}.name{font-family:Georgia,serif;font-size:28px;line-height:1}.lineage{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}.tags{display:flex;gap:6px;flex-wrap:wrap}.tag{font-size:10px;border:1px solid var(--line);padding:5px 7px}.prompt{white-space:pre-wrap;background:#ece8df;border:1px solid var(--line);padding:12px;font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;max-height:240px;overflow:auto}.actions{display:flex;gap:8px;margin-top:auto}.btn{border:1px solid var(--ink);padding:8px 10px;background:transparent;cursor:pointer}.btn.primary{background:var(--ink);color:white}.note{font-size:11px;color:var(--muted);line-height:1.45}.footer{border-top:1px solid var(--ink);margin-top:28px;padding:18px 0 40px;font-size:12px;color:var(--muted)}
/* six deliberately different editorial grammars */
.domus-ponti .image{background:linear-gradient(120deg,#cfd5d4 0 47%,#3c5a5c 47% 70%,#efe6d4 70%)}.domus-ponti .mast{top:18px;left:18px;font-size:72px;color:#f4efe4}.domus-ponti .meta{bottom:20px;left:20px;color:#fff}.domus-ponti:after{content:'';position:absolute;width:44%;height:70%;right:-5%;bottom:-5%;border:22px solid #e28f29;transform:rotate(12deg)}
.domus-lupi .image{background:linear-gradient(0deg,#d7d4ca 0 52%,#363636 52%)}.domus-lupi .mast{left:18px;bottom:95px;font-size:70px;color:#fff;transform:rotate(-90deg);transform-origin:left bottom}.domus-lupi .meta{top:16px;right:14px;text-align:right}.domus-lupi:after{content:'↘';position:absolute;right:18px;bottom:10px;font-size:110px;color:#b0191d;font-weight:bold}
.ottagono .image{background:repeating-linear-gradient(90deg,#dedbd2 0 11%,#686868 11% 22%,#f0ede4 22% 33%)}.ottagono .mast{top:22px;left:22px;font-family:Arial,sans-serif;font-size:44px;font-weight:800;letter-spacing:-.07em}.ottagono .meta{bottom:18px;right:18px;background:#171717;color:#fff;padding:8px}.ottagono:after{content:'';position:absolute;left:12%;top:22%;width:72%;height:34%;border:8px solid #d92f28}
.abitare .image{background:linear-gradient(155deg,#c9c2b2 0 35%,#746b5a 35% 57%,#d7d0c1 57%)}.abitare .mast{top:22px;right:18px;font-size:66px;color:white}.abitare .meta{left:18px;bottom:18px;color:white}.abitare:after{content:'';position:absolute;left:14%;bottom:10%;width:52%;height:36%;border-radius:50% 50% 0 0;background:rgba(63,82,51,.65)}
.casabella .image{background:linear-gradient(90deg,#eee9dc 0 39%,#555 39% 40%,#b7b4ad 40%)}.casabella .mast{top:18px;left:18px;font-family:Arial,sans-serif;font-size:34px;font-weight:700;letter-spacing:.02em;color:#9c1f23}.casabella .meta{left:18px;top:76px;width:34%;line-height:1.6}.casabella:after{content:'01';position:absolute;right:18px;bottom:2px;font:180px/1 Georgia,serif;color:rgba(255,255,255,.72)}
.il .image{background:linear-gradient(145deg,#ffe45e 0 33%,#f27c4b 33% 57%,#4677d5 57% 77%,#e9e5d8 77%)}.il .mast{left:18px;top:10px;font-family:Arial,sans-serif;font-size:124px;font-weight:900;letter-spacing:-.12em}.il .meta{right:18px;top:20px;width:38%;line-height:1.5}.il:after{content:'DATA / IMAGE / LIFE';position:absolute;left:20px;bottom:22px;background:#171717;color:white;padding:9px;font:700 12px Arial;letter-spacing:.12em}
@media(max-width:700px){.wrap{padding:16px}.top{grid-template-columns:1fr}.card{grid-template-rows:410px auto}}
</style>
</head>
<body><main class="wrap">
<header class="top"><div><div class="eyebrow">Doré Design / Emergence / Research Surface</div><h1 class="title">Italian Editorial Atlas</h1></div><div class="sub">把義大利雜誌史與編輯設計研究直接轉成可調用的出圖語法。選一個 editorial family，複製提示詞，將任意來源圖片轉化成對應的封面構成。不是複製 Logo 或歷史封面，而是調用其可遷移的視覺語法。</div></header>
<div class="controls" id="controls"></div><section class="grid" id="grid"></section>
<div class="footer">Research state: SEED v0 · 目前放入上一輪已確立的六個 family。下一輪研究將擴大人物、年代、刊物、攝影、印刷與內頁語法，並逐步加入真實生成樣本與 Doré evaluation。</div>
</main>
<script>
const families=[
{id:'domus-ponti',group:'Domus',name:'Domus / Ponti — Constructed World',lineage:'Gio Ponti · architecture as editorial construction',tags:['progetto','architecture','object-world','bold geometry'],principle:'讓建築、物件、攝影與幾何在同一張封面上成為一個被建造的世界。',prompt:`Transform the supplied source image into a sophisticated mid-century Italian architecture-and-design magazine cover grammar. Preserve the identity and essential subject of the source image. Treat the photographed object or scene as an architectural world, not as decoration. Use one dominant photographic field, a few large geometric interventions, carefully controlled negative space, refined serif display typography paired with restrained modern sans-serif metadata, unexpected but precise scale relationships, and a warm material palette recalling printed paper, stone, lacquer, brass and architectural colour. The composition should feel designed by someone who thinks simultaneously as editor, architect and industrial designer. Avoid generic luxury styling, fashion-gloss clichés, fake logos, copied mastheads, and direct replication of any historic cover. 3:4 vertical editorial cover, print-aware texture, intelligent asymmetry, strong spatial construction.`},
{id:'domus-lupi',group:'Domus',name:'Domus / Lupi — Rigor + Irony',lineage:'Italo Lupi · clarity, collage, scale shift, visual wit',tags:['rigor','irony','collage','scale-shift'],principle:'先建立精確秩序，再用比例錯置、箭頭、裁切或拼貼製造第二層意義。',prompt:`Use the supplied image as the factual visual anchor and reinterpret it through an Italian editorial-art-direction grammar built on rigor, clarity and visual irony. Preserve the subject. Build a disciplined asymmetric grid, then introduce one intelligent disturbance: an oversized directional mark, unexpected crop, visual quotation, typographic rotation, scale inversion or sharply framed fragment that creates a second meaning without explaining it. Combine documentary photography with one or two graphic interventions only. Typography should be exact, architectural and highly legible; hierarchy must be decisive. Use restrained paper-like colour with one assertive accent. The result should feel editorially witty rather than decorative. Do not imitate a specific existing cover, masthead or logo. Avoid maximalist collage, random surrealism, generic Swiss poster imitation and fashion-magazine gloss. 3:4 vertical magazine cover.`},
{id:'ottagono',group:'Systems',name:'Ottagono / Unimark — Modular Precision',lineage:'Bob Noorda · Unimark · industrial grid discipline',tags:['grid','modular','industrial','asymmetry'],principle:'秩序不是風格背景，而是讓偏離秩序變得有語義。',prompt:`Recompose the supplied image as an Italian industrial-design editorial cover governed by a strict modular grid. Preserve the source subject while dividing the page into clear proportional zones. Use disciplined sans-serif typography, strong alignment, repeated modules, rational spacing, precise cropping and one controlled asymmetrical break. Let engineering clarity and industrial intelligence dominate over ornament. Colour should be limited and functional: neutral field plus one or two decisive signal colours. Image and text should behave as parts of the same system. The cover must feel precise enough to support technical content yet alive enough to reward close looking. Do not copy any publication logo or existing layout. Avoid generic Bauhaus pastiche, excessive minimalism, decorative gradients and luxury branding. 3:4 vertical print cover.`},
{id:'abitare',group:'Living',name:'Abitare — Inhabited Space',lineage:'housing · interiors · journeys · ways of living',tags:['dwelling','photography','human-scale','journey'],principle:'不是展示房子，而是讓讀者感到「人如何在這裡生活」。',prompt:`Turn the supplied image into a refined Italian magazine cover about inhabiting space. Preserve the actual subject but reveal traces of human use, atmosphere, material, light, domestic scale and cultural context. Prefer observational photography over spectacle. Use generous breathing room, tactile surfaces, subtle colour, a calm but unconventional crop, and editorial typography that feels cultured rather than luxurious. The composition should suggest that architecture is understood through daily life, journeys, objects, gestures and memory. Avoid sterile real-estate photography, hotel-ad aesthetics, generic Scandinavian minimalism, fake brand marks and literal reproduction of historic magazine covers. 3:4 vertical editorial cover with nuanced photographic depth and paper-aware texture.`},
{id:'casabella',group:'Criticism',name:'Casabella — Analytical Authority',lineage:'architectural criticism · typography · editorial argument',tags:['criticism','analysis','typography','restraint'],principle:'讓封面像一個判斷：克制、可讀、具有編輯立場。',prompt:`Use the supplied image to create a serious Italian architectural-criticism cover. Preserve the factual image and treat it as evidence in an editorial argument. Employ restrained composition, strong typographic authority, clear intellectual hierarchy, analytical cropping and deliberate negative space. Introduce subtle numbering, issue metadata, diagrammatic alignment or marginal notes only when they clarify structure. Colour should be restrained, with one editorial accent if needed. The image must not become lifestyle advertising; it should feel examined. Avoid ornamental luxury, dramatic cinematic grading, cluttered collage, fake logos and direct imitation of any existing Casabella cover. 3:4 vertical, rigorous, critical, print-oriented.`},
{id:'il',group:'Contemporary',name:'IL — Information as Image',lineage:'creative studio · modular information · illustration + data',tags:['information','diagram','illustration','density'],principle:'資訊不是附註；資料、圖解、攝影和文字共同構成主圖。',prompt:`Transform the supplied source image into a contemporary Italian editorial cover where information itself becomes visual material. Preserve the subject, then integrate modular typography, concise data fragments, diagrammatic cues, graphic illustration and controlled high-density composition. Use a strong but intelligent colour system, multiple scales of information, playful editorial hierarchy and clear navigational logic. The image should coexist with numbers, labels and visual structures rather than sit behind them. Aim for an editorial studio sensibility: cultured, surprising, informative and highly composed. Avoid app-dashboard aesthetics, random infographic clutter, fake magazine logos, cyberpunk UI and one-to-one imitation of any existing cover. 3:4 vertical print cover.`}
];
const groups=['All',...new Set(families.map(x=>x.group))];const controls=document.querySelector('#controls'),grid=document.querySelector('#grid');let active='All';
function renderControls(){controls.innerHTML=groups.map(g=>`<button class="chip ${g===active?'active':''}" data-g="${g}">${g}</button>`).join('');controls.querySelectorAll('button').forEach(b=>b.onclick=()=>{active=b.dataset.g;renderControls();render()})}
function render(){const list=families.filter(x=>active==='All'||x.group===active);grid.innerHTML=list.map(x=>`<article class="card"><div class="cover ${x.id}"><div class="image"></div><div class="grain"></div><div class="mast">${x.group}</div><div class="meta">${x.id.replaceAll('-',' / ')}</div></div><div class="body"><div class="lineage">${x.lineage}</div><div class="name">${x.name}</div><div class="tags">${x.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div><div class="note">${x.principle}</div><div class="prompt">${x.prompt}</div><div class="actions"><button class="btn primary" data-copy="${x.id}">複製提示詞</button><button class="btn" data-id="${x.id}">Style ID</button></div></div></article>`).join('');grid.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{const f=families.find(x=>x.id===b.dataset.copy);await navigator.clipboard.writeText(f.prompt);const old=b.textContent;b.textContent='已複製';setTimeout(()=>b.textContent=old,1200)});grid.querySelectorAll('[data-id]').forEach(b=>b.onclick=async()=>{await navigator.clipboard.writeText(b.dataset.id);const old=b.textContent;b.textContent='已複製 ID';setTimeout(()=>b.textContent=old,1200)})}
renderControls();render();
</script></body></html>
