<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Doré Design · Italian Editorial Atlas</title><style>:root{--p:#f2efe7;--i:#171717;--m:#716c63;--l:#c9c2b6}*{box-sizing:border-box}body{margin:0;background:var(--p);color:var(--i);font-family:Arial,sans-serif}.w{max-width:1500px;margin:auto;padding:28px}h1{font:clamp(42px,7vw,92px)/.88 Georgia,serif;margin:8px 0 26px}.k{font-size:11px;letter-spacing:.16em;text-transform:uppercase}.lead{max-width:820px;line-height:1.55;color:var(--m)}.selectors{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:30px 0}.select{border-top:1px solid;padding-top:8px}.select label{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:7px}.select select{width:100%;background:transparent;border:1px solid var(--i);padding:11px;font-size:14px}.stage{display:grid;grid-template-columns:minmax(300px,.8fr) minmax(400px,1.2fr);gap:22px;border-top:1px solid;padding-top:22px}.identity{min-height:520px;border:1px solid;padding:22px;display:flex;flex-direction:column}.pub{font:58px/.9 Georgia,serif}.era{font:24px/1.1 Georgia,serif;margin-top:12px}.status{margin-top:8px;color:var(--m);font-size:12px}.specimen{margin-top:auto;min-height:260px;background:linear-gradient(145deg,#d5d0c4,#555 48%,#eee8dc 48%);position:relative;overflow:hidden}.specimen:after{content:'EDITORIAL DNA';position:absolute;left:18px;bottom:14px;background:var(--p);padding:7px;font-size:10px;letter-spacing:.15em}.right{display:grid;gap:14px}.panel{border:1px solid var(--l);padding:16px}.panel h2{font:26px Georgia,serif;margin:0 0 12px}.mods{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.mod{border-top:1px solid var(--l);padding-top:8px}.mod b{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:6px}.mod div,.evidence{font-size:12px;line-height:1.5;color:#4f4b45}.prompt{white-space:pre-wrap;font:12px/1.5 ui-monospace,monospace;background:#e9e4da;padding:13px}.actions{display:flex;gap:8px;margin-top:10px}.actions button{border:1px solid;background:transparent;padding:8px 10px;cursor:pointer}.actions .primary{background:var(--i);color:white}.empty{color:var(--m)}@media(max-width:800px){.selectors,.stage{grid-template-columns:1fr}.mods{grid-template-columns:1fr}}</style></head><body><main class="w"><div class="k">Doré Design / Emergence / Research Surface</div><h1>Italian Editorial Atlas</h1><p class="lead">不再把刊物壓成一張 style card。從刊物進入時代，再進入可組合 grammar；prompt 是 grammar 的即時壓縮，不是歷史封面的複製。這個頁面讀取 canonical JSON registry。</p><section class="selectors"><div class="select"><label>01 Publication / 刊物</label><select id="family"></select></div><div class="select"><label>02 Era / 時代</label><select id="era"></select></div><div class="select"><label>03 Grammar / 語法</label><select id="grammar"></select></div></section><section class="stage"><div class="identity"><div class="k">Selected editorial lineage</div><div class="pub" id="pub"></div><div class="era" id="eraName"></div><div class="status" id="status"></div><div class="specimen"></div></div><div class="right"><div class="panel"><h2>Composable grammar</h2><div class="mods" id="mods"></div></div><div class="panel"><h2>Issue evidence</h2><div class="evidence" id="evidence"></div></div><div class="panel"><h2>Generated prompt</h2><div class="prompt" id="prompt"></div><div class="actions"><button class="primary" id="copy">複製提示詞</button><button id="copyId">複製 Era ID</button></div></div></div></section></main><script>let db;const F=document.querySelector('#family'),E=document.querySelector('#era'),G=document.querySelector('#grammar');const modules=['all','layout','image','typography','material','density','sequence','irony','emergence'];fetch('./italian-editorial-grammars.v1.json').then(r=>r.json()).then(x=>{db=x;F.innerHTML=x.families.map(f=>`<option value="${f.id}">${f.publication}</option>`).join('');F.onchange=eras;E.onchange=render;G.innerHTML=modules.map(m=>`<option value="${m}">${m==='all'?'All grammar':m}</option>`).join('');G.onchange=render;eras()}).catch(()=>document.querySelector('#prompt').textContent='Registry load failed.');function family(){return db.families.find(x=>x.id===F.value)}function era(){return family().eras.find(x=>x.id===E.value)}function eras(){const f=family();E.innerHTML=f.eras.map(e=>`<option value="${e.id}">${e.label}</option>`).join('');render()}function render(){const f=family(),e=era(),pick=G.value||'all';document.querySelector('#pub').textContent=f.publication;document.querySelector('#eraName').textContent=e.label;document.querySelector('#status').textContent=`${e.status} · ${e.id}`;const entries=Object.entries(e.grammar).filter(([k])=>pick==='all'||k===pick);document.querySelector('#mods').innerHTML=entries.map(([k,v])=>`<div class="mod"><b>${k}</b><div>${v.length?v.join(' · '):'—'}</div></div>`).join('');document.querySelector('#evidence').innerHTML=(e.evidence||[]).length?(e.evidence||[]).map(x=>`• ${x}`).join('<br>'):'<span class="empty">Era evidence is still being researched.</span>';const selected=pick==='all'?Object.entries(e.grammar).flatMap(([k,v])=>v.map(x=>`${k}: ${x}`)):(e.grammar[pick]||[]).map(x=>`${pick}: ${x}`);const base=e.prompt?.cover||`Preserve the supplied source image and subject identity. Recompose it using the selected ${f.publication} / ${e.label} editorial grammar without copying logos, mastheads or a historical cover.`;const temporal=e.prompt?.emergence?`\n\nTemporal / Emergence translation: ${e.prompt.emergence}`:'';document.querySelector('#prompt').textContent=`${base}\n\nSelected grammar:\n- ${selected.join('\n- ')}${temporal}`;document.querySelector('#copy').onclick=()=>navigator.clipboard.writeText(document.querySelector('#prompt').textContent);document.querySelector('#copyId').onclick=()=>navigator.clipboard.writeText(e.id)}</script></body></html>
