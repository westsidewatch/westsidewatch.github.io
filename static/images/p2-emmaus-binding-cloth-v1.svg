<rect x="0" y="0" width="640" height="1024" fill="#1f2a18"/>
<rect x="0" y="0" width="640" height="1024" fill="url(#linen-warp)"/>
<rect x="0" y="0" width="640" height="1024" fill="url(#diagonal-binding)"/>
<rect x="0" y="0" width="640" height="1024" fill="url(#blind-tooled-diamond)"/>
