<title id="foil-title">Olive Mountain · original invitation card gold foil engraving</title>
<desc id="foil-desc">Independent antique-gold letterpress registration, olive sprigs and fine border strokes made for the sermon invitation card. It has no borrowed Bible cover texture, no raster images and no solid backing.</desc>
