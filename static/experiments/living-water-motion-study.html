<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Living Water · 上下異步水勢</title><style>*{box-sizing:border-box}body{margin:0;background:#dedbd4;color:#252525;font-family:Georgia,"Noto Serif TC",serif}header{padding:15px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}h1{font-size:23px;font-weight:400;margin:0}p{font-size:12px;margin:6px 0 0}.tools{display:flex;gap:9px;align-items:center;flex-wrap:wrap}button{font:inherit;font-size:12px;padding:9px 12px;border:1px solid #999;background:#eeeae1;color:#252525;cursor:pointer}button[aria-pressed=true]{background:#252525;color:#eeeae1}main{padding:0 12px 24px}.stage{position:relative;background:#eeeae1;aspect-ratio:16/9;overflow:hidden;border:1px solid #c6c0b5}.stage img,.stage svg{position:absolute;inset:0;width:100%;height:100%}.stage img{object-fit:fill}.stage svg{pointer-events:none}.stage svg path{fill:none;stroke:#557b8c;stroke-linecap:round}.legend{display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap;margin:9px 3px;font-size:12px;color:#555}@media(prefers-reduced-motion:reduce){.stage svg{display:none}}</style></head><body><header><div><h1>Living Water — 上下異步刻線實驗</h1><p>v10 靜態原圖不變 · 上下異步 · 24 條局部刻線持續生長與消退</p></div><div class="tools"><button data-mode="subtle" aria-pressed="true">極輕</button><button data-mode="balanced" aria-pressed="false">適中</button><button data-mode="visible" aria-pressed="false">明顯</button><button id="growth" aria-pressed="true">刻線生長：開</button><button id="pause" aria-pressed="false">暫停動畫</button></div></header><main><div class="stage" id="stage"><img src="/experiments/assets/living-water-contour-engraving-v10.svg" alt="v10 靜態刻線基準"><svg id="motion" viewBox="0 0 1600 900" preserveAspectRatio="none" aria-hidden="true"><g id="top"></g><g id="bottom"></g><g id="growth-top"></g><g id="growth-bottom"></g></svg></div><div class="legend"><span>上方：32 秒長週期 · 低幅度 · 舒緩</span><span>下方：19 秒短週期 · 略強 · 錯峰</span><span>靜態 v10 始終完整保留；減少動態偏好時停止</span></div></main><script>
const config={subtle:[.10,.14,1.3,1.8],balanced:[.17,.23,2.0,2.8],visible:[.25,.33,2.7,3.8]};let mode='subtle',paused=false,growthEnabled=true,start=performance.now(),visible=true;const svg=document.getElementById('motion'),topG=document.getElementById('top'),bottomG=document.getElementById('bottom');const growthTop=document.getElementById('growth-top'),growthBottom=document.getElementById('growth-bottom');const growthPaths=[];const reduce=matchMedia('(prefers-reduced-motion: reduce)');fetch('/experiments/assets/living-water-contour-engraving-v10.svg').then(r=>r.text()).then(txt=>{const doc=new DOMParser().parseFromString(txt,'image/svg+xml');const paths=[...doc.querySelectorAll('path')];for(let i=0;i<252;i++){if(i%5!==0)continue;const p=paths[i].cloneNode(true),side=i<126?'top':'bottom';p.dataset.i=String(i);p.dataset.opacity=p.getAttribute('opacity')||'.2';p.style.opacity='0';(side==='top'?topG:bottomG).appendChild(p)}for(let j=0;j<24;j++){const upper=j<12,source=paths[(upper?0:126)+(j%12)*9+7],total=source.getTotalLength(),fraction=.12+((j*7)%9)*.009,begin=.12+((j*11)%47)/100;const p=document.createElementNS('http://www.w3.org/2000/svg','path');let d='';for(let k=0;k<=14;k++){const at=Math.min(total,(begin+fraction*k/14)*total),pt=source.getPointAtLength(at);d+=(k?' L ':'M ')+pt.x.toFixed(2)+' '+(pt.y+(upper?-1.8:1.8)).toFixed(2)}p.setAttribute('d',d);p.setAttribute('stroke-width',String(.32+(j%4)*.08));p.setAttribute('opacity','0');p.style.stroke='#547989';p.style.strokeDasharray='1';p.style.strokeDashoffset='1';(upper?growthTop:growthBottom).appendChild(p);growthPaths.push({p,upper,phase:(j*.61803398875)%1,period:(upper?32:19)*(1+(j%5)*.14),base:.16+(j%4)*.025})}});const obs=new IntersectionObserver(entries=>{visible=entries[0]?.isIntersecting??false},{threshold:.05});obs.observe(document.getElementById('stage'));function animate(now){requestAnimationFrame(animate);if(paused||!visible||reduce.matches)return;const sec=(now-start)/1000,[a,b,ta,tb]=config[mode];for(const item of growthPaths){const {p,upper,phase,period,base}=item;const t=((sec/period+phase)%1+1)%1;const head=Math.min(1,t*2.1),tail=Math.max(0,(t-.37)*2.1);const length=Math.max(.001,head-tail);p.style.strokeDasharray=length.toFixed(4)+' '+(1-length).toFixed(4);p.style.strokeDashoffset=(-tail).toFixed(4);p.style.opacity=growthEnabled?String(base*(mode==='subtle'?.65:mode==='balanced'?1:1.4)*Math.min(1,t*7,(1-t)*7)): '0'}for(const [g,period,amp,travel,phase] of [[topG,32,a,ta,0],[bottomG,19,b,tb,1.7]]){for(const p of g.children){const i=Number(p.dataset.i),offset=i*.093;const wave=Math.sin(sec*2*Math.PI/period+offset+phase);p.style.opacity=String(Number(p.dataset.opacity)*amp*(.55+.45*wave));p.setAttribute('transform',`translate(${(Math.sin(sec*2*Math.PI/period+phase+offset)*travel).toFixed(2)} 0)`)}}}requestAnimationFrame(animate);for(const btn of document.querySelectorAll('[data-mode]'))btn.onclick=()=>{mode=btn.dataset.mode;for(const b of document.querySelectorAll('[data-mode]'))b.setAttribute('aria-pressed',String(b===btn))};document.getElementById('growth').onclick=e=>{growthEnabled=!growthEnabled;e.currentTarget.setAttribute('aria-pressed',String(growthEnabled));e.currentTarget.textContent=growthEnabled?'刻線生長：開':'刻線生長：關';if(!growthEnabled)for(const {p} of growthPaths)p.style.opacity='0'};document.getElementById('pause').onclick=e=>{paused=!paused;e.currentTarget.setAttribute('aria-pressed',String(paused));e.currentTarget.textContent=paused?'繼續動畫':'暫停動畫'};
</script></body></html>
