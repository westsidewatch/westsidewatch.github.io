<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>P2 v2 — Fixed Ocean 2.5</title>

:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#e8efed;color:#29434b;font:14px/1.6 system-ui,sans-serif}.head{padding:20px 4vw;display:flex;justify-content:space-between;gap:20px;align-items:center}.head h1{font:400 clamp(24px,3vw,42px) Georgia,serif;margin:0}.head p{margin:3px 0 0}.head a{color:inherit}.stage{position:relative;width:100%;height:min(68vh,calc(100vw * .5625));min-height:320px;overflow:hidden;background:#e8f0ed}.stage svg{position:absolute;inset:-5%;width:110%;height:110%;display:block}.stage .baseline{opacity:.10;pointer-events:none}.stage .moving{pointer-events:none}.status{position:absolute;bottom:12px;left:18px;padding:5px 9px;background:#f4f7f3cc;font:12px monospace}.controls{display:flex;flex-wrap:wrap;align-items:center;gap:18px;padding:16px 4vw}.controls label{display:flex;gap:8px;align-items:center}.controls input{accent-color:#557b8c}.note{padding:0 4vw 22px;max-width:1100px;color:#52656b}button{background:#fff;border:1px solid #a7b9ba;padding:2.5px 12px;cursor:pointer}@media(prefers-reduced-motion:reduce){.status:after{content:' · reduced motion'}} 
</style></head><body>
<header class="head"><div><h1>P2 v2 / Fixed Ocean 2.5</h1><p>第二輪 · 全體刻線共用方向場 · v2 與原圖只讀</p></div><a href="/experiments/sevenfold-first-to-second.html">已驗收第二頁 ↗</a></header>
<div class="stage"><svg class="baseline" viewBox="0 0 1600 900" preserveAspectRatio="none" aria-hidden="true"><image href="/experiments/assets/living-water-contour-engraving-v10.svg" width="1600" height="900"/></svg><svg class="moving" viewBox="0 0 1600 900" preserveAspectRatio="none" aria-label="Continuous water flow experiment"><g id="lines" fill="none" stroke="#557b8c" stroke-linecap="round"></g></svg><div class="status" id="status">Loading v10 paths…</div></div>
<p class="note">P2 v2 固定參數自動播放：1.5／2.0／6.0／2.5。沒有滑桿、時間或暫停控制；原始 620 條刻線與中央留白保留。正式 P2 不修改。</p>
<script>
(()=>{'use strict';const NS='http://www.w3.org/2000/svg',group=document.getElementById('lines'),status=document.getElementById('status'),controls=['travel','contrast','amplitude'].map(id=>document.getElementById(id));let paths=[],t=0,last=0,ready=false;const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),smooth=v=>{v=clamp(v,0,1);return v*v*(3-2*v)};
fetch('/experiments/assets/living-water-contour-engraving-v10.svg').then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.text()}).then(raw=>{const doc=new DOMParser().parseFromString(raw,'image/svg+xml');if(doc.querySelector('parsererror'))throw Error('SVG parse');const source=document.importNode(doc.documentElement,true);source.style.cssText='position:fixed;left:-99999px;top:0;width:1600px;height:900px;visibility:hidden;pointer-events:none';document.body.appendChild(source);const originals=[...source.querySelectorAll('path')];for(const original of originals){const len=original.getTotalLength();if(len<1)continue;const steps=clamp(Math.ceil(len/22),28,110),points=[];for(let j=0;j<=steps;j++){const q=original.getPointAtLength(len*j/steps);points.push([q.x,q.y])}const out=document.createElementNS(NS,'path');for(const attr of ['opacity','stroke-width','stroke','stroke-linecap'])if(original.hasAttribute(attr))out.setAttribute(attr,original.getAttribute(attr));group.appendChild(out);paths.push({points,out,baseOpacity:Number(original.getAttribute('opacity')||1)})}source.remove();ready=true;status.textContent=paths.length+' continuous engraving paths · no hard split';status.textContent+=paths.length===620?' · fixed preset':' · WARN: expected 620 paths'}).catch(e=>status.textContent='Load failed: '+e.message);
function frame(now){requestAnimationFrame(frame);if(!last)last=now;const dt=Math.min(.05,(now-last)/1000);last=now;if(!ready)return;t+=dt;const travel=1.5,contrast=2,amp=6,breath=21*Math.sin(t*Math.PI/7)+5*Math.sin(t*Math.PI/13);
// A single continuous phase field governs every engraving point; y only modulates speed smoothly.
const field=(x,y)=>{const layer=smooth((y-180)/610),speed=.78+contrast*.25*layer,warp=18*Math.sin(y*.0065+x*.0018),phase=.012*(x+warp)-t*.9*travel*speed;return {layer,phase}};
for(const {points,out,baseOpacity} of paths){let d='';for(let i=0;i<points.length;i++){const [x,y]=points[i],{layer,phase}=field(x,y),envelope=.72+.28*layer;const carrier=Math.sin(phase),secondary=Math.sin(phase*2-.6);const densityStrength=2.5,verticalMask=Math.sin(Math.PI*clamp(y/900,0,1)),stationaryRidges=.68*Math.sin(x*.008-y*.004)+.32*Math.sin(x*.014+y*.002),spacingShift=densityStrength*1.8*verticalMask*stationaryRidges*Math.sin(y*.046);const yy=y+breath*.65+amp*envelope*(.82*carrier+.12*secondary)+spacingShift;const xx=x+amp*(.35*carrier+.10*secondary);d+=(i?'L':'M')+xx.toFixed(1)+' '+yy.toFixed(1)}out.setAttribute('d',d);out.setAttribute('opacity',baseOpacity.toFixed(3))}}requestAnimationFrame(frame);
})();
</script></body></html>
