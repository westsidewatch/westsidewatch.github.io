<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>西望 P2 · 教會至雜誌銜接驗收</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101923;color:#f5efe4;font:14px/1.4 system-ui,sans-serif}
.controls{min-height:55px;padding:9px 18px;display:flex;align-items:center;flex-wrap:wrap;gap:9px}
.controls strong{font:400 13px/1.2 Georgia,serif;letter-spacing:.07em;margin-right:14px}
button{border:1px solid #6b737a;background:transparent;color:inherit;padding:7px 10px;cursor:pointer;font:inherit}
button:focus-visible,input:focus-visible{outline:2px solid #e0bd77;outline-offset:3px}
label{display:flex;align-items:center;gap:8px;margin-left:auto}input{accent-color:#dab570;width:min(19vw,180px)}
iframe{display:block;width:100%;height:calc(100svh - 55px);border:0;background:#f6efe1}
@media(max-width:820px){.controls{gap:5px;padding:7px}.controls strong{width:100%}button{padding:4px 6px;font-size:11px}label{margin-left:0}iframe{height:calc(100svh - 112px)}}
</style>
</head>
<body>
<nav class="controls" aria-label="P2 教會與雜誌進度驗收">
 <strong>CHURCH → WESTSIDE WATCH / CONTINUOUS P2</strong>
 <button type="button" data-progress=".38">洋流上升</button>
 <button type="button" data-progress=".55">教會分海</button>
 <button type="button" data-progress=".62">雜誌交接</button>
 <button type="button" data-progress=".91">晨星帶出西望</button>
 <button type="button" data-progress="1">最終 Contents</button>
 <label>進度 <input id="progress" type="range" min="0" max="100" step="1" value="100"><output id="percent">100%</output></label>
</nav>
<iframe id="p2-scene" src="/p2/living-water.html?embed=1&amp;v=p2-church-to-vol00-20261029-motion-film" title="保留原始教會動效的 P2 雜誌連續畫面"></iframe>
<script>
(()=>{'use strict';
 const frame=document.getElementById('p2-scene');
 const input=document.getElementById('progress'),out=document.getElementById('percent');
 const params=new URLSearchParams(location.search);
 let progress=params.has('p')?Math.min(1,Math.max(0,(Number(params.get('p'))||0)/100)):1;
 function apply(p){
  progress=Math.max(0,Math.min(1,Number(p)||0));
  input.value=String(Math.round(progress*100));out.textContent=input.value+'%';
  frame.contentWindow?.postMessage({type:'westside-p2-scroll',progress,active:true},location.origin);
  const url=new URL(location.href);url.searchParams.set('p',input.value);history.replaceState(null,'',url);
 }
 frame.addEventListener('load',()=>apply(progress));
 input.addEventListener('input',()=>apply(Number(input.value)/100));
 document.querySelectorAll('[data-progress]').forEach(button=>button.addEventListener('click',()=>apply(button.dataset.progress)));
})();
</script>
</body>
</html>
