<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Westside Watch · Material Atlas</title><link rel="stylesheet" href="/css/westside-design-os.css"><style>
*{box-sizing:border-box}body{margin:0;background:#faf9f5;color:#252525;font-family:var(--ws-type-display-zh),serif;font-weight:200}main{max-width:1550px;margin:auto;padding:5vw 4vw}header{margin-bottom:4vw}h1,h2{font-family:var(--ws-type-display-en-sc),serif;font-weight:700;line-height:1;margin:0}h1{font-size:clamp(42px,7vw,100px)}h1 small{display:block;font-family:var(--ws-type-display-zh),serif;font-size:.28em;font-weight:900;margin-top:.6em}header p{font-size:14px}.group{margin:4vw 0 2vw;border-top:1px solid;padding-top:1.8vw}h2{font-size:clamp(26px,3vw,44px)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:3vw 2vw}.proof{min-width:0;border-bottom:1px solid #c7c3ba;padding-bottom:1.4rem}.original,.detail{overflow:hidden;background:#fff;display:grid;place-items:center}.original{aspect-ratio:1.5}.original img{height:100%;width:100%;object-fit:contain}.pair{display:grid;grid-template-columns:1fr 1fr;gap:1px;margin-top:1px}.detail{aspect-ratio:1.5}.detail img{width:100%;height:100%;object-fit:cover;filter:grayscale(1)}.detail:nth-child(2) img{transform:scale(2);transform-origin:35% 45%}figcaption{display:flex;justify-content:space-between;gap:12px;align-items:baseline;margin-top:10px;font-size:12px}figcaption a{color:inherit;text-decoration:none;font-weight:600}figure{margin:0}.state{font-size:11px;opacity:.75}.baseline{width:100%;height:clamp(150px,24vw,350px);object-fit:cover}.missing{display:none}@media(max-width:700px){main{padding:7vw 5vw}.grid{grid-template-columns:1fr;gap:5vw}.group{margin-top:7vw}}
</style></head><body><main><header><h1>Material Atlas<small>刻線與印面</small></h1><p>完整原作 · 單色印面 · 局部放大</p></header><section><h2>Living Water</h2><p>活水原有 V10 靜態刻線對照</p><img class="baseline" src="/experiments/assets/living-water-contour-engraving-v10.svg" alt="活水原稿"></section><section class="group"><h2>Cinema</h2><p>天堂電影院 · 保留方向</p><div class="grid" id="cinema"></div></section><section class="group"><h2>Print &amp; Space</h2><p>其餘版塊 · 原作並排比較，暫不指定歸屬</p><div class="grid" id="pool"></div></section><p id="summary"></p></main><script>
(async()=>{const cfg=await fetch('candidates.json').then(r=>r.json());const rep=await fetch('assets/report.json').then(r=>r.ok?r.json():null).catch(()=>null);const ok=new Map((rep?.results||[]).map(r=>[r.id,r]));for(const a of cfg.options){const v=ok.get(a.id);if(!v?.ok)continue;const f=document.createElement('figure');f.className='proof';f.dataset.id=a.id;const original=document.createElement('div');original.className='original';const img=document.createElement('img');img.src=a.path;img.alt=a.title;original.append(img);f.append(original);const pair=document.createElement('div');pair.className='pair';for(let i=0;i<2;i++){const detail=document.createElement('div');detail.className='detail';const clone=img.cloneNode();clone.alt='';detail.append(clone);pair.append(detail)}f.append(pair);const c=document.createElement('figcaption');const link=document.createElement('a');link.href=a.page;link.textContent=a.title;const st=document.createElement('span');st.className='state';st.textContent=a.id+' · '+Math.round(v.bytes/1024)+' KB';c.append(link,st);f.append(c);document.querySelector(a.realm==='cinema-retained'?'#cinema':'#pool').append(f)}document.querySelector('#summary').textContent=rep?rep.successful+' / '+cfg.options.length+' 原生 SVG 已取得':'原檔尚未取得；不顯示替代圖片';})().catch(e=>{document.querySelector('#summary').textContent='原檔報告未能讀取'});
</script></body></html>
