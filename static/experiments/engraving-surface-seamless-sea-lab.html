<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Living Water — Continuous Flow Field Lab</title>
<style>
:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#e8efed;color:#29434b;font:14px/1.6 system-ui,sans-serif}.head{padding:20px 4vw;display:flex;justify-content:space-between;gap:20px;align-items:center}.head h1{font:400 clamp(24px,3vw,42px) Georgia,serif;margin:0}.head p{margin:3px 0 0}.head a{color:inherit}.stage{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;background:#e8f0ed}.stage svg{position:absolute;inset:-5%;width:110%;height:110%;display:block}.stage .baseline{opacity:.10;pointer-events:none}.stage .moving{pointer-events:none}.status{position:absolute;bottom:12px;left:18px;padding:5px 9px;background:#f4f7f3cc;font:12px monospace}.controls{display:flex;flex-wrap:wrap;align-items:center;gap:18px;padding:16px 4vw}.controls label{display:flex;gap:8px;align-items:center}.controls input{accent-color:#557b8c}.note{padding:0 4vw 22px;max-width:1100px;color:#52656b}button{background:#fff;border:1px solid #a7b9ba;padding:7px 12px;cursor:pointer}@media(prefers-reduced-motion:reduce){.status:after{content:' · reduced motion'}} 
</style></head><body>
<header class="head"><div><h1>Engraving Surface / Seamless Sea</h1><p>獨立擬三維海面試驗 · 保留原 Lab · v2 不動</p></div><a href="/experiments/sevenfold-first-to-second.html">已驗收第二頁 ↗</a></header>
<div class="stage"><svg class="baseline" viewBox="0 0 1600 900" preserveAspectRatio="none" aria-hidden="true"><image href="/experiments/assets/living-water-contour-engraving-v10.svg" width="1600" height="900"/></svg><svg class="moving" viewBox="0 0 1600 900" preserveAspectRatio="none" aria-label="Continuous water flow experiment"><g id="lines" fill="none" stroke="#557b8c" stroke-linecap="round"></g></svg><div class="status" id="status">Loading v10 paths…</div></div>
<div class="controls"><label>橫向傳播 <input id="travel" type="range" min="0" max="2" step=".1" value="1"><output id="travel-value">1.0×</output></label><label>上下異步 <input id="contrast" type="range" min="0" max="2" step=".1" value="1"><output id="contrast-value">1.0×</output></label><label>局部形變 <input id="amplitude" type="range" min="0" max="12" step=".5" value="7"><output id="amplitude-value">7px</output></label><button id="toggle">暫停</button></div>
<p class="note">研究方式：同一條完整 SVG 路徑逐點取樣；加強橫向推進與波峰湧流，沿 X 軸傳播；不同高度透過 smoothstep 連續過渡，不硬切上下水層。保留一份淡色原圖作為對照。此頁僅供實驗，不代表已驗收的正式效果。</p>
<script>
(()=>{'use strict';const NS='http://www.w3.org/2000/svg',group=document.getElementById('lines'),status=document.getElementById('status'),controls=['travel','contrast','amplitude'].map(id=>document.getElementById(id));let paths=[],paused=matchMedia('(prefers-reduced-motion: reduce)').matches,t=0,last=0,ready=false;const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),smooth=v=>{v=clamp(v,0,1);return v*v*(3-2*v)};const button=document.getElementById('toggle');button.textContent=paused?'播放':'暫停';button.onclick=()=>{paused=!paused;button.textContent=paused?'播放':'暫停'};for(const el of controls)el.oninput=()=>document.getElementById(el.id+'-value').textContent=Number(el.value).toFixed(1)+(el.id==='amplitude'?'px':'×');
fetch('/experiments/assets/living-water-contour-engraving-v10.svg').then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.text()}).then(raw=>{const doc=new DOMParser().parseFromString(raw,'image/svg+xml');if(doc.querySelector('parsererror'))throw Error('SVG parse');const source=document.importNode(doc.documentElement,true);source.style.cssText='position:fixed;left:-99999px;top:0;width:1600px;height:900px;visibility:hidden;pointer-events:none';document.body.appendChild(source);const originals=[...source.querySelectorAll('path')];for(const original of originals){const len=original.getTotalLength();if(len<1)continue;const steps=clamp(Math.ceil(len/22),28,110),points=[];for(let j=0;j<=steps;j++){const q=original.getPointAtLength(len*j/steps);points.push([q.x,q.y])}const out=document.createElementNS(NS,'path');for(const attr of ['opacity','stroke-width','stroke','stroke-linecap'])if(original.hasAttribute(attr))out.setAttribute(attr,original.getAttribute(attr));group.appendChild(out);paths.push({points,out})}const sorted=[...paths].map(o=>({o,y:o.points[Math.floor(o.points.length/2)][1]})).sort((a,b)=>a.y-b.y);let bridges=0;for(let k=0;k<sorted.length-1;k++){const a=sorted[k],b=sorted[k+1],gap=b.y-a.y;if(gap<26||gap>180)continue;const count=Math.min(4,Math.floor(gap/20));for(let j=1;j<=count;j++){const f=j/(count+1),points=[];for(let z=0;z<=64;z++){const q=z/64,pa=a.o.points[Math.round(q*(a.o.points.length-1))],pb=b.o.points[Math.round(q*(b.o.points.length-1))];points.push([pa[0]*(1-f)+pb[0]*f,pa[1]*(1-f)+pb[1]*f])}const out=document.createElementNS(NS,'path');out.setAttribute('stroke-width','.45');out.setAttribute('opacity','.20');group.appendChild(out);paths.push({points,out});bridges++}}source.remove();ready=true;status.textContent=paths.length+' continuous paths · '+bridges+' seam bridges'}).catch(e=>status.textContent='Load failed: '+e.message);
function frame(now){requestAnimationFrame(frame);if(!last)last=now;const dt=Math.min(.05,(now-last)/1000);last=now;if(!ready||paused)return;t+=dt;const travel=Number(controls[0].value),contrast=Number(controls[1].value),amp=Number(controls[2].value),breath=21*Math.sin(t*Math.PI/7)+5*Math.sin(t*Math.PI/13);for(const {points,out} of paths){let d='';for(let i=0;i<points.length;i++){const [x,y]=points[i],mix=smooth((y-240)/430),speed=(1-mix)*.78+mix*(.78+.65*contrast),phase=x*.016-t*speed*travel,local=amp*1.7*Math.sin(phase)*(0.75+mix*.5),fine=amp*.42*Math.sin(x*.029-t*(.38+mix*.42*contrast)),yy=y+breath*.65+local+fine,xx=x+amp*1.9*Math.sin(phase-.55)+amp*.55*Math.sin(phase*1.7);d+=(i?'L':'M')+xx.toFixed(1)+' '+yy.toFixed(1)}out.setAttribute('d',d)}}requestAnimationFrame(frame);
})();
</script></body></html>
