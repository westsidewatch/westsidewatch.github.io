<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Living Water — 雙版刻線檢視</title><style>
*{box-sizing:border-box}body{margin:0;background:#dedbd4;color:#252525;font-family:Georgia,"Noto Serif TC",serif}header{padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}h1{font-size:23px;font-weight:400;margin:0}header p{font-size:12px;margin:4px 0 0}.tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap}label{font-size:12px}select,button{font:inherit;font-size:13px;background:#f1eee8;color:#252525;border:1px solid #aaa;padding:7px 10px}button{cursor:pointer}button[aria-pressed=true]{background:#252525;color:#f1eee8}main{padding:0 16px 20px}.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.label{display:flex;justify-content:space-between;padding:6px 2px;font-size:13px}.canvas{aspect-ratio:16/9;background:#eeeae1;border:1px solid #b6b1a6;overflow:hidden;position:relative}.canvas img{position:absolute;inset:0;width:100%;height:100%;object-fit:fill}.canvas.zoom img{width:200%;height:200%;max-width:none;object-fit:fill;left:-50%;top:-50%}.canvas.zoom[data-zone="upper"] img{top:-10%;left:-70%}.canvas.zoom[data-zone="lower"] img{top:-88%;left:-28%}.canvas.zoom[data-zone="center"] img{top:-48%;left:-48%}.note{font-size:12px;margin:12px 2px;color:#555}@media(max-width:700px){.pair{grid-template-columns:1fr}header{padding:12px}main{padding:0 10px 12px}}</style></head><body><header><div><h1>Living Water — 雙版精修檢視</h1><p>每次只比較兩版 · 同紙色、同尺寸、同放大區域 · 正式第二頁維持 v6</p></div><div class="tools"><label>左側 <select id="left"><option value="v6">v6 · 正式基準</option><option value="v7">v7 · 柔化</option><option value="v8">v8 · 骨力</option><option value="v9">v9 · 微刻</option><option value="v10">v10 · 局部精修</option></select></label><label>右側 <select id="right"><option value="v10" selected>v10 · 局部精修</option><option value="v6">v6 · 正式基準</option><option value="v7">v7 · 柔化</option><option value="v8">v8 · 骨力</option><option value="v9">v9 · 微刻</option></select></label><button id="whole" aria-pressed="true">全幅</button><button id="upper" aria-pressed="false">上方細節 2×</button><button id="center" aria-pressed="false">交匯細節 2×</button><button id="lower" aria-pressed="false">下方細節 2×</button></div></header><main><div class="pair"><section><div class="label"><strong id="label-left">v6 · 正式基準</strong><span>對照 A</span></div><div class="canvas" id="canvas-left"><img id="image-left" src="/experiments/assets/living-water-contour-engraving-v6.svg" alt="左側水流刻線"></div></section><section><div class="label"><strong id="label-right">v10 · 局部精修</strong><span>對照 B</span></div><div class="canvas" id="canvas-right"><img id="image-right" src="/experiments/assets/living-water-contour-engraving-v10.svg" alt="右側水流刻線"></div></section></div><p class="note">選擇局部放大時，左右同步顯示相同位置。v6 未被修改；本頁僅供刻線比較。</p></main><script>const names={v6:'v6 · 正式基準',v7:'v7 · 柔化',v8:'v8 · 骨力',v9:'v9 · 微刻',v10:'v10 · 局部精修'};for(const side of ['left','right']){document.getElementById(side).addEventListener('change',e=>{const v=e.target.value;document.getElementById('image-'+side).src='/experiments/assets/living-water-contour-engraving-'+v+'.svg';document.getElementById('label-'+side).textContent=names[v]})}for(const zone of ['whole','upper','center','lower']){document.getElementById(zone).onclick=()=>{for(const z of ['whole','upper','center','lower'])document.getElementById(z).setAttribute('aria-pressed',String(z===zone));for(const side of ['left','right']){const c=document.getElementById('canvas-'+side);c.classList.toggle('zoom',zone!=='whole');c.dataset.zone=zone}}}</script></body></html>
