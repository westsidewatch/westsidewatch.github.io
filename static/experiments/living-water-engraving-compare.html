<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Living Water — Engraving Comparison</title>
<style>
:root{--paper:#eeeae1;--ink:#252525;--blue:#5b8fa8}*{box-sizing:border-box}body{margin:0;background:#dedbd4;color:var(--ink);font-family:Georgia,"Noto Serif TC",serif}header{padding:22px clamp(20px,4vw,60px);display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap}h1{font-size:clamp(20px,2.4vw,34px);font-weight:400;margin:0}header p{font-size:13px;margin:5px 0 0}.tools{display:flex;gap:8px;align-items:center}button{background:var(--paper);border:1px solid #aaa;padding:9px 14px;cursor:pointer;color:var(--ink)}button[aria-pressed=true]{background:var(--ink);color:var(--paper)}main{padding:0 clamp(12px,2vw,30px) 30px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px}.panel{min-width:0}.label{display:flex;justify-content:space-between;padding:10px 2px;font-size:13px}.canvas{aspect-ratio:16/9;background:var(--paper);position:relative;overflow:hidden;border:1px solid #b6b1a6}.water{position:absolute;inset:0;width:100%;height:100%;object-fit:fill}.headline{position:absolute;left:3.5%;top:18%;font-size:clamp(30px,5vw,96px);letter-spacing:-.07em;line-height:.84;pointer-events:none}.headline em{color:var(--blue);font-weight:400}.verse{position:absolute;left:55%;top:45%;width:36%;font-size:clamp(9px,1.1vw,18px);line-height:1.35;pointer-events:none}.footer{position:absolute;bottom:5%;left:3.5%;right:3.5%;border-top:1px solid #777;padding-top:5px;font-size:clamp(8px,.8vw,13px)}.single .pair{grid-template-columns:1fr}.single .panel:not(.selected){display:none}.single .headline{font-size:clamp(55px,10vw,190px)}.single .verse{font-size:clamp(12px,1.5vw,25px)}.single .footer{font-size:clamp(10px,1vw,15px)}@media(max-width:780px){.pair{grid-template-columns:1fr}.headline{font-size:clamp(40px,12vw,95px)}.verse{font-size:clamp(10px,2vw,18px)}.footer{font-size:10px}} 
</style></head><body><header><div><h1>Living Water — 刻線比較</h1><p>純第二頁活水底紋比較 · 不包含 First Look 或標題覆蓋</p></div><div class="tools"><button id="both" aria-pressed="true">並排比較</button><button id="six" aria-pressed="false">只看 v6</button><button id="seven" aria-pressed="false">只看 v7</button></div></header>
<main id="main"><div class="pair">
<section class="panel" id="panel6"><div class="label"><strong>v6 · 第二頁底紋基準</strong><span>水勢 / 明暗 / 皴法</span></div><div class="canvas"><img class="water" src="/experiments/assets/living-water-contour-engraving-v6.svg" alt="v6 水流刻線"></div></section>
<section class="panel" id="panel7"><div class="label"><strong>v7 · 第二頁底紋候選</strong><span>局部濃淡 / 線寬調節</span></div><div class="canvas"><img class="water" src="/experiments/assets/living-water-contour-engraving-v7.svg" alt="v7 水流刻線"></div></section></div></main>
<script>const main=document.getElementById('main'),buttons=['both','six','seven'];for(const id of buttons){document.getElementById(id).onclick=()=>{main.classList.toggle('single',id!=='both');document.getElementById('panel6').classList.toggle('selected',id==='six');document.getElementById('panel7').classList.toggle('selected',id==='seven');for(const b of buttons)document.getElementById(b).setAttribute('aria-pressed',String(id===b))}}</script></body></html>
