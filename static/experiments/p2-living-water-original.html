<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Living Water / Original Flow Drawing</title><style>*{box-sizing:border-box}html,body{margin:0;background:#e5ecec;color:#304a52;font:14px/1.5 Georgia,serif}header{display:flex;align-items:center;justify-content:space-between;padding:15px 3vw}h1{font-size:clamp(19px,3vw,29px);font-weight:400;margin:0}button{background:transparent;border:1px solid #89a7ac;padding:7px 13px;color:inherit}main{height:350svh}.stage{position:sticky;top:0;height:100svh;background:#d9e8ea;overflow:hidden}canvas{width:100%;height:100%;display:block}aside{position:absolute;bottom:20px;left:3vw;right:3vw;display:flex;justify-content:space-between;pointer-events:none}footer{padding:20px 3vw}</style></head><body><header><h1>Living Water / Original Flow Drawing</h1><button id="pause">Pause</button></header><main id="scroll"><div class="stage"><canvas id="water"></canvas><aside><span id="phase">01 / THE CURRENT</span><span>SVG-019 · two interacting currents</span></aside></div></main><footer>參考 v10 的雙層構圖：上層與下層分別生成刻線，流向、波相與速度不同，在中央交界形成互相交織的洋流。v10 原始資產不變。</footer><script>(()=>{'use strict';const canvas=document.querySelector('#water'),ctx=canvas.getContext('2d',{alpha:false}),root=document.querySelector('#scroll'),phase=document.querySelector('#phase'),pause=document.querySelector('#pause');let W=1,H=1,dpr=1,clock=0,last=0,halt=false,progress=0;const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),smooth=v=>{v=clamp(v);return v*v*(3-2*v)},rand=n=>{const x=Math.sin(n*127.1+78.233)*43758.5453;return x-Math.floor(x)};function resize(){const r=canvas.getBoundingClientRect();W=Math.max(1,r.width);H=Math.max(1,r.height);dpr=Math.min(2,devicePixelRatio||1);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}new ResizeObserver(resize).observe(canvas);resize();function scroll(){const r=root.getBoundingClientRect();progress=clamp(-r.top/Math.max(1,r.height-innerHeight));phase.textContent=progress<.36?'01 / THE CURRENT':progress<.74?'02 / RISING WATER':'03 / PARTING SEA'}addEventListener('scroll',scroll,{passive:true});scroll();pause.onclick=()=>{halt=!halt;pause.textContent=halt?'Resume':'Pause'};
// Two independently flowing engraved strata. v10 is a composition reference,
// never fetched or overwritten. Their moving interface creates the sea.
const strata=[
 {top:0,bottom:510,count:180,direction:1,phase:0,velocity:1.0},
 {top:365,bottom:900,count:205,direction:-1,phase:2.3,velocity:.76}
];
const guides=strata.flatMap((layer,L)=>Array.from({length:layer.count},(_,i)=>{
 const u=i/(layer.count-1),y=layer.top+(layer.bottom-layer.top)*u;
 const band=.5+.5*Math.cos(y*.023+L*1.7);
 return {L,y,seed:rand(i+1+L*1000),width:.15+.22*rand(i+101+L*1000)+.13*Math.pow(band,5),
 alpha:.07+.10*rand(i+301+L*1000)+.10*Math.pow(band,5),
 speed:12+15*rand(i+501+L*1000),length:220+380*rand(i+701+L*1000),band}
}));
function field(x,y,t,L){
 const layer=strata[L],depth=(y-layer.top)/(layer.bottom-layer.top);
 const drift=t*layer.direction*layer.velocity;
 const long=29*Math.sin(x*.0045-drift*.38+depth*2.4+layer.phase);
 const short=13*Math.sin(x*.009+drift*.24-depth*2.1+layer.phase);
 const swell=12*Math.sin(x*.0027-drift*.17+depth*5.1);
 // Opposing crests meet around the interface, creating a rolling
 // interwoven boundary instead of a straight horizontal seam.
 const interfaceWeight=Math.exp(-Math.pow((y-445)/125,2));
 const encounter=interfaceWeight*14*Math.sin(x*.007-t*.34+L*2.7);
 return long+short+swell+encounter;
}
function point(x,g,t,rise,part){
 const L=g.L,layer=strata[L],y=g.y;
 const lift=rise*(180+510*smooth(y/900));
 const split=part*(x<800?-1:1)*230;
 const interfaceWeight=Math.exp(-Math.pow((y-445)/125,2));
 const shear=interfaceWeight*14*Math.sin(x*.006-t*.3+L*Math.PI);
 return [x+split+shear,y+field(x,y,t,L)+2.5*Math.sin(t*.5+y*.011)-lift];
}
function draw(){
 ctx.fillStyle='#d9e8ea';ctx.fillRect(0,0,W,H);
 ctx.save();ctx.scale(W/1600,H/900);
 const t=clock,rise=smooth((progress-.32)/.4),part=smooth((progress-.73)/.24);
 ctx.beginPath();ctx.rect(0,0,1600,900);ctx.clip();
 for(const g of guides){
  const layer=strata[g.L],interval=g.length+40+85*(1-g.band);
  const drift=t*g.speed*layer.direction*layer.velocity;
  const offset=((drift+g.seed*interval)%interval+interval)%interval;
  ctx.lineCap='round';ctx.lineJoin='round';
  for(let k=-3;k<11;k++){
   const x0=k*interval+offset-g.length,x1=x0+g.length;
   if(x1<0||x0>1600)continue;
   const ink=g.alpha*(.75+.25*Math.sin((x0+x1)*.003+g.y*.018-t*.13)**2);
   ctx.strokeStyle='rgba(54,97,113,'+ink.toFixed(3)+')';
   ctx.beginPath();let started=false;
   for(let x=Math.max(-8,x0);x<=Math.min(1608,x1);x+=8){
    const u=clamp((x-x0)/g.length),taper=Math.pow(Math.sin(Math.PI*u),.45);
    ctx.lineWidth=Math.max(.11,g.width*taper);
    const p=point(x,g,t,rise,part);
    if(!started){ctx.moveTo(p[0],p[1]);started=true}
    else{ctx.lineTo(p[0],p[1]);ctx.stroke();ctx.beginPath();ctx.moveTo(p[0],p[1])}
   }
  }
 }
 ctx.restore();
}
function frame(now){if(!last)last=now;if(now-last>=30){const dt=Math.min(.06,(now-last)/1000);last=now;if(!halt)clock+=dt;draw()}requestAnimationFrame(frame)}requestAnimationFrame(frame)})();</script></body></html>
