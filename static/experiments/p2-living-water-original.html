<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Living Water / Original Flow Drawing</title><style>*{box-sizing:border-box}html,body{margin:0;background:#e5ecec;color:#304a52;font:14px/1.5 Georgia,serif}header{display:flex;align-items:center;justify-content:space-between;padding:15px 3vw}h1{font-size:clamp(19px,3vw,29px);font-weight:400;margin:0}button{background:transparent;border:1px solid #89a7ac;padding:7px 13px;color:inherit}main{height:350svh}.stage{position:sticky;top:0;height:100svh;background:#d9e8ea;overflow:hidden}canvas{width:100%;height:100%;display:block}aside{position:absolute;bottom:20px;left:3vw;right:3vw;display:flex;justify-content:space-between;pointer-events:none}footer{padding:20px 3vw}</style></head><body><header><h1>Living Water / Original Flow Drawing</h1><button id="pause">Pause</button></header><main id="scroll"><div class="stage"><canvas id="water"></canvas><aside><span id="phase">01 / THE CURRENT</span><span>SVG-018 · variable-pressure engraving</span></aside></div></main><footer>原創流場與變密度排線：波峰局部加密、刻線長短不一、筆觸起落收尖並有輕重變化。v10 原稿完整保留。</footer><script>(()=>{'use strict';const canvas=document.querySelector('#water'),ctx=canvas.getContext('2d',{alpha:false}),root=document.querySelector('#scroll'),phase=document.querySelector('#phase'),pause=document.querySelector('#pause');let W=1,H=1,dpr=1,clock=0,last=0,halt=false,progress=0;const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),smooth=v=>{v=clamp(v);return v*v*(3-2*v)},rand=n=>{const x=Math.sin(n*127.1+78.233)*43758.5453;return x-Math.floor(x)};function resize(){const r=canvas.getBoundingClientRect();W=Math.max(1,r.width);H=Math.max(1,r.height);dpr=Math.min(2,devicePixelRatio||1);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}new ResizeObserver(resize).observe(canvas);resize();function scroll(){const r=root.getBoundingClientRect();progress=clamp(-r.top/Math.max(1,r.height-innerHeight));phase.textContent=progress<.36?'01 / THE CURRENT':progress<.74?'02 / RISING WATER':'03 / PARTING SEA'}addEventListener('scroll',scroll,{passive:true});scroll();pause.onclick=()=>{halt=!halt;pause.textContent=halt?'Resume':'Pause'};
// Uneven engraved bands: a few strong ridges, fine subordinate hatching,
// variable line pressure and irregular negative space. No v10 dependency.
const guides=Array.from({length:300},(_,i)=>{const u=i/299;const y=900*u+4*Math.sin(i*.37)+2*Math.sin(i*1.17);const band=.5+.5*Math.cos(y*.018+1.8*Math.sin(y*.006));return {y,seed:rand(i+1),width:.16+.24*rand(i+101)+.14*Math.pow(band,5),alpha:.075+.10*rand(i+301)+.13*Math.pow(band,6),speed:13+14*rand(i+501),length:180+420*rand(i+701),band,phase:rand(i+901)}});
function field(x,y,t){const depth=y/900;const crest=31*Math.sin(x*.0047-t*.36+depth*3.1)+14*Math.sin(x*.0085+t*.19-depth*2.5);const swell=16*Math.sin(x*.0029-t*.16+depth*6.4);return crest+swell}
function point(x,y,t,rise,part){const swell=field(x,y,t);const lift=rise*(180+510*smooth(y/900));const split=part*(x<800?-1:1)*230;return [x+split,y+swell+2.5*Math.sin(t*.5+y*.011)-lift]}
function draw(){ctx.fillStyle='#d9e8ea';ctx.fillRect(0,0,W,H);ctx.save();ctx.scale(W/1600,H/900);const t=clock,rise=smooth((progress-.32)/.4),part=smooth((progress-.73)/.24);ctx.beginPath();ctx.rect(0,0,1600,900);ctx.clip();
for(const g of guides){
 const interval=g.length+32+120*(1-g.band);
 const drift=t*g.speed;
 const offset=((drift+g.seed*interval)%interval+interval)%interval;
 ctx.lineCap='round';ctx.lineJoin='round';
 for(let k=-2;k<11;k++){
  const x0=k*interval+offset-g.length;
  const x1=x0+g.length;if(x1<0||x0>1600)continue;
  const midpoint=(x0+x1)*.5;
  const emphasis=.45+.55*Math.pow(.5+.5*Math.sin(midpoint*.006+g.y*.017-t*.12),2);
  const ink=g.alpha*(.6+.4*emphasis);
  ctx.strokeStyle='rgba(54,97,113,'+ink.toFixed(3)+')';
  ctx.beginPath();let started=false;
  for(let x=Math.max(-8,x0);x<=Math.min(1608,x1);x+=7){
   const u=(x-x0)/g.length;
   const taper=Math.pow(Math.max(0,Math.sin(Math.PI*clamp(u))),.55);
   const pressure=.7+.3*Math.sin(u*6.28+g.phase*6.28);
   ctx.lineWidth=Math.max(.12,g.width*taper*pressure);
   const p=point(x,g.y,t,rise,part);
   // Each short ink stroke has its own pressure and fades naturally
   // into the paper; do not use perfectly rectangular segment ends.
   if(!started){ctx.moveTo(p[0],p[1]);started=true}
   else {ctx.lineTo(p[0],p[1]);ctx.stroke();ctx.beginPath();ctx.moveTo(p[0],p[1])}
  }
 }
}
ctx.restore()}
function frame(now){if(!last)last=now;if(now-last>=30){const dt=Math.min(.06,(now-last)/1000);last=now;if(!halt)clock+=dt;draw()}requestAnimationFrame(frame)}requestAnimationFrame(frame)})();</script></body></html>
