<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Living Water / Original Flow Drawing</title><style>*{box-sizing:border-box}html,body{margin:0;background:#e5ecec;color:#304a52;font:14px/1.5 Georgia,serif}header{display:flex;align-items:center;justify-content:space-between;padding:15px 3vw}h1{font-size:clamp(19px,3vw,29px);font-weight:400;margin:0}button{background:transparent;border:1px solid #89a7ac;padding:7px 13px;color:inherit}main{height:350svh}.stage{position:sticky;top:0;height:100svh;background:#d9e8ea;overflow:hidden}canvas{width:100%;height:100%;display:block}aside{position:absolute;bottom:20px;left:3vw;right:3vw;display:flex;justify-content:space-between;pointer-events:none}footer{padding:20px 3vw}</style></head><body><header><h1>Living Water / Original Flow Drawing</h1><button id="pause">Pause</button></header><main id="scroll"><div class="stage"><canvas id="water"></canvas><aside><span id="phase">01 / THE CURRENT</span><span id="growth-state">INK GROWTH 0%</span><span>SVG-027 · restored sea coverage</span></aside></div></main><footer>以 v10 的 620 條真實曲線保留上下洋流構圖，SVG-027：修正以幀數誤當壽命造成的短線與大片空白；恢復 v10 雙層水面的完整刻線密度，新增墨線以秒數生長並逐漸淡出。</footer><script>(()=>{'use strict';const canvas=document.querySelector('#water'),ctx=canvas.getContext('2d',{alpha:false}),root=document.querySelector('#scroll'),phase=document.querySelector('#phase'),pause=document.querySelector('#pause');let W=1,H=1,dpr=1,clock=0,last=0,halt=false,progress=0;const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),smooth=v=>{v=clamp(v);return v*v*(3-2*v)},rand=n=>{const x=Math.sin(n*127.1+78.233)*43758.5453;return x-Math.floor(x)};function resize(){const r=canvas.getBoundingClientRect();W=Math.max(1,r.width);H=Math.max(1,r.height);dpr=Math.min(2,devicePixelRatio||1);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}new ResizeObserver(resize).observe(canvas);resize();function scroll(){const r=root.getBoundingClientRect();progress=clamp(-r.top/Math.max(1,r.height-innerHeight));phase.textContent=progress<.36?'01 / THE CURRENT':progress<.74?'02 / RISING WATER':'03 / PARTING SEA'}addEventListener('scroll',scroll,{passive:true});scroll();pause.onclick=()=>{halt=!halt;pause.textContent=halt?'Resume':'Pause'};
// The v10 curves are used only as a *spatial orientation field*.
// New ink strokes have no predetermined endpoint and are born continuously.
let sourceLines=[],agents=[],spawnDebt=0,spawnId=0;
const MAX_AGENTS=1800,SPAWN_RATE=46;
// Two coherent, locally sampled v10 strata. Each stroke keeps its stratum;
// no global averaging of upper and lower tangents at their intersection.
let upperGuides=[],lowerGuides=[];
function spawn(){
 const id=++spawnId,seed=rand(id+19),stratum=seed<.5?0:1;
 const guides=stratum===0?upperGuides:lowerGuides;if(!guides.length)return;
 const g=guides[Math.floor(rand(id+31)*guides.length)],pts=g.pts;
 const j=Math.floor(rand(id+47)*(pts.length-2)),p=pts[j],q=pts[j+1];
 const angle=Math.atan2(q[1]-p[1],q[0]-p[0]);
 const x=p[0],y=p[1]+(rand(id+53)-.5)*7;
 agents.push({x,y,pts:[[x,y]],angle,age:0,life:9+rand(id+61)*9,
 speed:15+rand(id+67)*23,width:.24+rand(id+73)*.38,
 alpha:.3+rand(id+79)*.22,seed,stratum,fade:1});
}
function advance(dt){
 spawnDebt+=SPAWN_RATE*dt;while(spawnDebt>=1){spawn();spawnDebt--}
 for(const a of agents){
  if(a.age<a.life){
   // Seconds-based lifetime (not one unit per frame). Continuous ink
   // grows from its own seed; curvature is coherent within each stratum.
   const angle=a.angle+.07*Math.sin(a.y*.011+clock*.13)+.045*Math.sin(a.x*.005-clock*.1);
   const step=a.speed*dt;
   a.x+=Math.cos(angle)*step;a.y+=Math.sin(angle)*step;
   a.pts.push([a.x,a.y]);a.age+=dt;
   if(a.x>1660||a.x< -80||a.y< -80||a.y>980)a.age=a.life;
  }else a.fade-=dt*.08;
 }
 agents=agents.filter(a=>a.fade>0);
 if(agents.length>MAX_AGENTS)agents.splice(0,agents.length-MAX_AGENTS);
}
function draw(){
 ctx.fillStyle='#d9e8ea';ctx.fillRect(0,0,W,H);ctx.save();ctx.scale(W/1600,H/900);
 const rise=smooth((progress-.32)/.4),part=smooth((progress-.73)/.24);
 const breath=21*Math.sin(clock*Math.PI/7)+5*Math.sin(clock*Math.PI/13);
 // A faint v10 underdrawing keeps the two-layer sea recognizable during
 // startup, but no growth is bounded by its original path lengths.
 for(const g of sourceLines){
  ctx.strokeStyle='rgba(85,123,140,'+(g.opacity*.78).toFixed(3)+')';
  ctx.lineWidth=g.width*.88;ctx.beginPath();
  for(let j=0;j<g.pts.length;j++){const p=g.pts[j];const x=p[0],y=p[1]+breath*.18-rise*(200+650*g.seed);if(j)ctx.lineTo(x,y);else ctx.moveTo(x,y)}
  ctx.stroke();
 }
 ctx.lineCap='round';ctx.lineJoin='round';
 for(const a of agents){
  const n=a.pts.length;if(n<2)continue;
  ctx.strokeStyle='rgba(54,97,113,'+(a.alpha*a.fade).toFixed(3)+')';
  ctx.lineWidth=a.width;ctx.beginPath();
  for(let j=0;j<n;j++){
   const p=a.pts[j],x=p[0],y=p[1],split=part*(x<800?-1:1)*210;
   const yy=y+breath*.18-rise*(200+650*a.seed);
   if(j)ctx.lineTo(x+split,yy);else ctx.moveTo(x+split,yy);
  }
  ctx.stroke();
 }
 ctx.restore();
 const label=document.querySelector('#growth-state');if(label)label.textContent='LIVE INK '+agents.length+' · born '+spawnId;
}
fetch('/experiments/assets/living-water-contour-engraving-v10.svg').then(r=>{if(!r.ok)throw Error('v10 HTTP '+r.status);return r.text()}).then(xml=>{
 const doc=new DOMParser().parseFromString(xml,'image/svg+xml'),paths=[...doc.querySelectorAll('path')];
 const hidden=document.createElementNS('http://www.w3.org/2000/svg','svg');
 hidden.style.cssText='position:absolute;width:0;height:0;overflow:hidden';document.body.appendChild(hidden);
 paths.forEach((original,i)=>{const p=original.cloneNode(true);hidden.appendChild(p);let len=0;try{len=p.getTotalLength()}catch{}if(len>0){const n=Math.max(12,Math.min(48,Math.ceil(len/45))),pts=[];for(let j=0;j<=n;j++){const q=p.getPointAtLength(len*j/n);pts.push([q.x,q.y])}sourceLines.push({pts,y:pts[Math.floor(n/2)][1],width:Number(p.getAttribute('stroke-width')||'.7'),opacity:Number(p.getAttribute('opacity')||'.3'),seed:rand(i+71)})}hidden.removeChild(p)});
 upperGuides=sourceLines.filter(g=>g.y<485);lowerGuides=sourceLines.filter(g=>g.y>=485);hidden.remove();draw();
}).catch(err=>console.error('v10 guide unavailable',err));
function frame(now){if(!last)last=now;if(now-last>=30){const dt=Math.min(.06,(now-last)/1000);last=now;if(!halt){clock+=dt;if(sourceLines.length)advance(dt)}draw()}requestAnimationFrame(frame)}requestAnimationFrame(frame)})();</script></body></html>
