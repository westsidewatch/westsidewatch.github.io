<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Living Water / Original Flow Drawing</title><style>*{box-sizing:border-box}html,body{margin:0;background:#e5ecec;color:#304a52;font:14px/1.5 Georgia,serif}header{display:flex;align-items:center;justify-content:space-between;padding:15px 3vw}h1{font-size:clamp(19px,3vw,29px);font-weight:400;margin:0}button{background:transparent;border:1px solid #89a7ac;padding:7px 13px;color:inherit}main{height:350svh}.stage{position:sticky;top:0;height:100svh;background:#d9e8ea;overflow:hidden}canvas{width:100%;height:100%;display:block}aside{position:absolute;bottom:20px;left:3vw;right:3vw;display:flex;justify-content:space-between;pointer-events:none}footer{padding:20px 3vw}</style></head><body><header><h1>Living Water / Original Flow Drawing</h1><button id="pause">Pause</button></header><main id="scroll"><div class="stage"><canvas id="water"></canvas><aside><span id="phase">01 / THE CURRENT</span><span id="growth-state">INK GROWTH 0%</span><span>SVG-039 · upper-edge completion</span></aside></div></main><footer>以 v10 的 620 條真實曲線保留上下洋流構圖，直接使用既有 v10 SVG 資產與原有刻線代理流動；只在外層增加向上顯露，不改寫刻線幾何。</footer><script>(()=>{'use strict';const canvas=document.querySelector('#water'),ctx=canvas.getContext('2d',{alpha:false}),root=document.querySelector('#scroll'),phase=document.querySelector('#phase'),pause=document.querySelector('#pause');let W=1,H=1,dpr=1,clock=0,last=0,halt=false,progress=0;const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),smooth=v=>{v=clamp(v);return v*v*(3-2*v)},rand=n=>{const x=Math.sin(n*127.1+78.233)*43758.5453;return x-Math.floor(x)};function resize(){const r=canvas.getBoundingClientRect();W=Math.max(1,r.width);H=Math.max(1,r.height);dpr=Math.min(2,devicePixelRatio||1);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}new ResizeObserver(resize).observe(canvas);resize();function scroll(){const r=root.getBoundingClientRect();progress=clamp(-r.top/Math.max(1,r.height-innerHeight));phase.textContent=progress<.36?'01 / THE CURRENT':progress<.74?'02 / RISING WATER':'03 / PARTING SEA'}addEventListener('scroll',scroll,{passive:true});scroll();pause.onclick=()=>{halt=!halt;pause.textContent=halt?'Resume':'Pause'};
// The v10 curves are used only as a *spatial orientation field*.
// New ink strokes have no predetermined endpoint and are born continuously.
let sourceLines=[],agents=[],spawnDebt=0,spawnId=0;
const MAX_AGENTS=1800,SPAWN_RATE=46;
// Two coherent, locally sampled v10 strata. Each stroke keeps its stratum;
// no global averaging of upper and lower tangents at their intersection.
let upperGuides=[],lowerGuides=[],upperExtension=[];
function buildUpperExtension(){
 upperExtension=[];
 // Continue the TOP edge of the upper water stratum only.
 // Build new curves independently from its measured local tangents:
 // no reuse, duplication or translation of any existing v10 contour.
 const upper=sourceLines.filter(g=>g.y<450&&g.pts.length>8);
 if(!upper.length)return;
 // Identify the actual uppermost profile across the canvas.
 const bins=80,edge=[];
 for(let i=0;i<=bins;i++){
  const x=-120+i*1860/bins;
  let best=null;
  for(const g of upper){
   const pts=g.pts;
   for(let j=1;j<pts.length;j++){
    const p=pts[j-1],q=pts[j],dx=q[0]-p[0];
    if(Math.abs(dx)<.001||x<Math.min(p[0],q[0])||x>Math.max(p[0],q[0]))continue;
    const t=(x-p[0])/dx,y=p[1]+t*(q[1]-p[1]);
    if(y<0||y>455)continue;
    if(!best||y<best.y)best={x,y,slope:(q[1]-p[1])/dx};
   }
  }
  if(best)edge.push(best);
 }
 if(edge.length<10)return;
 const top=Math.min(...edge.map(p=>p.y));
 // Draw the missing upper area as a continuous field of new contours.
 // Smoothly suppress existing relief toward the ceiling; gradually turn
 // the flow upwards without recreating any lower crest.
 const count=Math.ceil(Math.max(0,top+85)/3.5);
 for(let k=1;k<=count;k++){
  const t=k/count,pts=[];
  for(const e of edge){
   const u=(e.x-800)/800;
   const climb=(top+100)*t;
   const originalRelief=e.y-top;
   const taper=Math.pow(1-t,1.6);
   const y=top-climb+originalRelief*taper-75*t*u;
   pts.push([e.x,y]);
  }
  upperExtension.push({pts,width:.22+.24*(1-t),opacity:.12+.18*(1-t),seed:k/count});
 }
}

function spawn(){
 const id=++spawnId,seed=rand(id+19),stratum=seed<.5?0:1;
 const guides=stratum===0?upperGuides:lowerGuides;if(!guides.length)return;
 const g=guides[Math.floor(rand(id+31)*guides.length)],pts=g.pts;
 const j=Math.floor(rand(id+47)*(pts.length-2)),p=pts[j];
 const x=p[0],y=p[1]+(rand(id+53)-.5)*4;
 // Source contours provide local curvature, not a static target drawing.
 agents.push({x,y,pts:[[x,y]],guide:g,index:j,age:0,life:8+rand(id+61)*7,
 speed:18+rand(id+67)*19,width:.18+rand(id+73)*.35,
 alpha:.23+rand(id+79)*.19,seed,stratum,fade:1});
}
function advance(dt){
 spawnDebt+=SPAWN_RATE*dt;while(spawnDebt>=1){spawn();spawnDebt--}
 for(const a of agents){
  if(a.age<a.life){
   const pts=a.guide.pts,j=Math.min(pts.length-2,Math.floor(a.index));
   const p=pts[j],q=pts[j+1];
   const dx=q[0]-p[0],dy=q[1]-p[1],length=Math.hypot(dx,dy)||1;
   // Advance in source arc length. This removes the unbounded tangent
   // extrapolation that created diagonal crosshatching across the sea.
   const increment=a.speed*dt/Math.max(1,length);
   a.index+=increment;
   const k=Math.min(pts.length-2,Math.floor(a.index)),u=Math.min(1,a.index-k);
   const m=pts[k],n=pts[k+1];
   a.x=m[0]+(n[0]-m[0])*u;a.y=m[1]+(n[1]-m[1])*u;
   a.pts.push([a.x,a.y]);a.age+=dt;
   if(a.index>=pts.length-1||a.x>1660||a.x< -80)a.age=a.life;
  }else a.fade-=dt*.13;
 }
 agents=agents.filter(a=>a.fade>0);
 if(agents.length>MAX_AGENTS)agents.splice(0,agents.length-MAX_AGENTS);
}
// SVG-033: one continuous full-screen v10-derived field.
// A smoothly varying upper-layer tilt replaces the earlier tiled plates.
// The animated engraving exists at full height from the first frame;
// only its visible region rises with scrolling.
// Direct v10 asset: retain every original sampled path and its own ink agents.
// No full-screen warping, resampling into another composition, or replacement sea.
// Travelling swell shared by original v10 contours, upper extension and ink.
// Spatially varying phases change the SHAPE of the current over time;
// unlike the previous constant offset, the water visibly undulates.
function livingWave(p){
 const x=p[0],y=p[1],u=x/1600;
 const envelope=.55+.45*Math.sin(Math.PI*clamp(y/900));
 const long=18*Math.sin(clock*.95-u*7.5+y*.0015);
 const cross=8*Math.sin(clock*1.45+u*12-y*.004);
 const drift=4*Math.sin(clock*.62-u*3.5);
 return [x,y+(long+cross+drift)*envelope];
}
function draw(){
 ctx.fillStyle='#d9e8ea';ctx.fillRect(0,0,W,H);ctx.save();ctx.scale(W/1600,H/900);
 const rise=smooth(progress/.74);
 ctx.lineCap='round';ctx.lineJoin='round';
 // Draw the full moving engraving FIRST. Then withdraw the paper mask.
 for(const g of [...sourceLines,...upperExtension]){
  ctx.strokeStyle='rgba(55,99,119,'+Math.min(.75,Math.max(.26,g.opacity*2.4)).toFixed(3)+')';
  ctx.lineWidth=Math.max(.65,g.width*1.05);ctx.beginPath();
  g.pts.forEach((p,j)=>{const q=livingWave(p);if(j)ctx.lineTo(q[0],q[1]);else ctx.moveTo(q[0],q[1])});ctx.stroke();
 }
 for(const a of agents){
  if(a.pts.length<2)continue;
  ctx.strokeStyle='rgba(54,97,113,'+(a.alpha*a.fade).toFixed(3)+')';ctx.lineWidth=a.width;ctx.beginPath();
  a.pts.forEach((p,j)=>{const q=livingWave(p);if(j)ctx.lineTo(q[0],q[1]);else ctx.moveTo(q[0],q[1])});ctx.stroke();
 }
 // White paper retracts from the existing half-screen boundary to top.
 const maskBottom=450*(1-rise);
 if(maskBottom>0){ctx.fillStyle='#d9e8ea';ctx.fillRect(0,0,1600,maskBottom)}
 ctx.restore();
 const label=document.querySelector('#growth-state');
 if(label)label.textContent='V10 '+sourceLines.length+' · EXTENDED '+upperExtension.length+' · MASK '+Math.round((1-rise)*100)+'%';
}
fetch('/experiments/assets/living-water-contour-engraving-v10.svg').then(r=>{if(!r.ok)throw Error('v10 HTTP '+r.status);return r.text()}).then(xml=>{
 const doc=new DOMParser().parseFromString(xml,'image/svg+xml'),paths=[...doc.querySelectorAll('path')];
 const hidden=document.createElementNS('http://www.w3.org/2000/svg','svg');
 hidden.style.cssText='position:absolute;width:0;height:0;overflow:hidden';document.body.appendChild(hidden);
 paths.forEach((original,i)=>{const p=original.cloneNode(true);hidden.appendChild(p);let len=0;try{len=p.getTotalLength()}catch{}if(len>0){const n=Math.max(12,Math.min(48,Math.ceil(len/45))),pts=[];for(let j=0;j<=n;j++){const q=p.getPointAtLength(len*j/n);pts.push([q.x,q.y])}sourceLines.push({pts,y:pts[Math.floor(n/2)][1],width:Number(p.getAttribute('stroke-width')||'.7'),opacity:Number(p.getAttribute('opacity')||'.3'),seed:rand(i+71)})}hidden.removeChild(p)});
 buildUpperExtension();upperGuides=sourceLines.filter(g=>g.y<485);lowerGuides=sourceLines.filter(g=>g.y>=485);hidden.remove();const label=document.querySelector('#growth-state');if(label)label.textContent='V10 PATHS '+sourceLines.length+' / '+paths.length;draw();
}).catch(err=>console.error('v10 guide unavailable',err));
function frame(now){if(!last)last=now;if(now-last>=30){const dt=Math.min(.06,(now-last)/1000);last=now;if(!halt){clock+=dt;if(sourceLines.length)advance(dt)}draw()}requestAnimationFrame(frame)}requestAnimationFrame(frame)})();</script></body></html>
