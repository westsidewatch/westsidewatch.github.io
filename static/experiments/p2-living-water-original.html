<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Living Water / Original Flow Drawing</title><style>*{box-sizing:border-box}html,body{margin:0;background:#e5ecec;color:#304a52;font:14px/1.5 Georgia,serif}header{display:flex;align-items:center;justify-content:space-between;padding:15px 3vw}h1{font-size:clamp(19px,3vw,29px);font-weight:400;margin:0}button{background:transparent;border:1px solid #89a7ac;padding:7px 13px;color:inherit}main{height:350svh}.stage{position:sticky;top:0;height:100svh;background:#d9e8ea;overflow:hidden}canvas{width:100%;height:100%;display:block}aside{position:absolute;bottom:20px;left:3vw;right:3vw;display:flex;justify-content:space-between;pointer-events:none}footer{padding:20px 3vw}</style></head><body><header><h1>Living Water / Original Flow Drawing</h1><button id="pause">Pause</button></header><main id="scroll"><div class="stage"><canvas id="water"></canvas><aside><span id="phase">01 / THE CURRENT</span><span>SVG-017 · original generative engraving</span></aside></div></main><footer>原創流場與排線；不載入、不修改 v10 SVG。刻線從流場中生成，沿局部曲率延展，密度由相鄰線距控制。</footer><script>(()=>{'use strict';const canvas=document.querySelector('#water'),ctx=canvas.getContext('2d',{alpha:false}),root=document.querySelector('#scroll'),phase=document.querySelector('#phase'),pause=document.querySelector('#pause');let W=1,H=1,dpr=1,clock=0,last=0,halt=false,progress=0;const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),smooth=v=>{v=clamp(v);return v*v*(3-2*v)},rand=n=>{const x=Math.sin(n*127.1+78.233)*43758.5453;return x-Math.floor(x)};function resize(){const r=canvas.getBoundingClientRect();W=Math.max(1,r.width);H=Math.max(1,r.height);dpr=Math.min(2,devicePixelRatio||1);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}new ResizeObserver(resize).observe(canvas);resize();function scroll(){const r=root.getBoundingClientRect();progress=clamp(-r.top/Math.max(1,r.height-innerHeight));phase.textContent=progress<.36?'01 / THE CURRENT':progress<.74?'02 / RISING WATER':'03 / PARTING SEA'}addEventListener('scroll',scroll,{passive:true});scroll();pause.onclick=()=>{halt=!halt;pause.textContent=halt?'Resume':'Pause'};
const guides=Array.from({length:235},(_,i)=>({y:8+i*3.83,seed:rand(i+1),width:.22+.27*rand(i+101),alpha:.09+.14*rand(i+301),speed:17+18*rand(i+501),length:230+320*rand(i+701)}));
function field(x,y,t){const depth=y/900;const crest=27*Math.sin(x*.0047-t*.36+depth*3.1)+13*Math.sin(x*.0085+t*.19-depth*2.5);const swell=12*Math.sin(x*.0029-t*.16+depth*6.4);return crest+swell}
function point(x,y,t,rise,part){const swell=field(x,y,t),dy=(field(x+2,y,t)-field(x-2,y,t))/4;const lift=rise*(180+510*smooth(y/900));const split=part*(x<800?-1:1)*230;return [x+split,y+swell+2.5*Math.sin(t*.5+y*.011)-lift,dy]}
function draw(){ctx.fillStyle='#d9e8ea';ctx.fillRect(0,0,W,H);ctx.save();ctx.scale(W/1600,H/900);const t=clock,rise=smooth((progress-.32)/.4),part=smooth((progress-.73)/.24);ctx.beginPath();ctx.rect(0,0,1600,900);ctx.clip();
for(const g of guides){const density=.82+.18*Math.sin(g.y*.014);const interval=g.length+26;const drift=t*g.speed;const offset=((drift+g.seed*interval)%interval+interval)%interval;const alpha=g.alpha*density;ctx.strokeStyle='rgba(59,105,122,'+alpha+')';ctx.lineWidth=g.width;ctx.lineCap='round';for(let k=-2;k<9;k++){const x0=k*interval+offset-g.length;const x1=x0+g.length;if(x1<0||x0>1600)continue;ctx.beginPath();let started=false;for(let x=Math.max(-8,x0);x<=Math.min(1608,x1);x+=9){const p=point(x,g.y,t,rise,part);if(!started){ctx.moveTo(p[0],p[1]);started=true}else ctx.lineTo(p[0],p[1])}if(started)ctx.stroke()}}
ctx.restore()}
function frame(now){if(!last)last=now;if(now-last>=30){const dt=Math.min(.06,(now-last)/1000);last=now;if(!halt)clock+=dt;draw()}requestAnimationFrame(frame)}requestAnimationFrame(frame)})();</script></body></html>
