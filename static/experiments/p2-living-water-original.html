<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Living Water / Original Flow Drawing</title><style>*{box-sizing:border-box}html,body{margin:0;background:#e5ecec;color:#304a52;font:14px/1.5 Georgia,serif}header{display:flex;align-items:center;justify-content:space-between;padding:15px 3vw}h1{font-size:clamp(19px,3vw,29px);font-weight:400;margin:0}button{background:transparent;border:1px solid #89a7ac;padding:7px 13px;color:inherit}main{height:350svh}.stage{position:sticky;top:0;height:100svh;background:#d9e8ea;overflow:hidden}canvas{width:100%;height:100%;display:block}aside{position:absolute;bottom:20px;left:3vw;right:3vw;display:flex;justify-content:space-between;pointer-events:none}footer{padding:20px 3vw}</style></head><body><header><h1>Living Water / Original Flow Drawing</h1><button id="pause">Pause</button></header><main id="scroll"><div class="stage"><canvas id="water"></canvas><aside><span id="phase">01 / THE CURRENT</span><span>SVG-022 · SVG-002 growing strokes</span></aside></div></main><footer>以 v10 的 620 條真實曲線保留上下洋流構圖，重新接入 SVG-002 的從起點向前生長技法，筆尖沿 v10 原稿曲線逐步繪製；保留上下兩層構圖、呼吸與完整底層。</footer><script>(()=>{'use strict';const canvas=document.querySelector('#water'),ctx=canvas.getContext('2d',{alpha:false}),root=document.querySelector('#scroll'),phase=document.querySelector('#phase'),pause=document.querySelector('#pause');let W=1,H=1,dpr=1,clock=0,last=0,halt=false,progress=0;const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),smooth=v=>{v=clamp(v);return v*v*(3-2*v)},rand=n=>{const x=Math.sin(n*127.1+78.233)*43758.5453;return x-Math.floor(x)};function resize(){const r=canvas.getBoundingClientRect();W=Math.max(1,r.width);H=Math.max(1,r.height);dpr=Math.min(2,devicePixelRatio||1);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}new ResizeObserver(resize).observe(canvas);resize();function scroll(){const r=root.getBoundingClientRect();progress=clamp(-r.top/Math.max(1,r.height-innerHeight));phase.textContent=progress<.36?'01 / THE CURRENT':progress<.74?'02 / RISING WATER':'03 / PARTING SEA'}addEventListener('scroll',scroll,{passive:true});scroll();pause.onclick=()=>{halt=!halt;pause.textContent=halt?'Resume':'Pause'};
// SVG-020: restore v10 as the actual geometry and composition authority.
// Preserve all 620 original paths, opacity tiers, spatial layering and spacing.
// Motion deforms the source points gently; never regenerate a guessed ocean.
let sourceLines=[];
// Original v10 geometry remains the compositional authority. Brushwork is
// generated from its arc-length samples, not from synthetic wave guides.
function draw(){
 ctx.fillStyle='#d9e8ea';ctx.fillRect(0,0,W,H);
 ctx.save();ctx.scale(W/1600,H/900);
 const t=clock,rise=smooth((progress-.32)/.4),part=smooth((progress-.73)/.24);
 const breath=21*Math.sin(t*Math.PI/7)+5*Math.sin(t*Math.PI/13);
 for(const g of sourceLines){
  const layer=smooth((g.y-180)/610),speed=.78+.5*layer;
  const pts=g.pts,N=pts.length;
  const moved=[];
  for(let j=0;j<N;j++){
   const [x,y]=pts[j],warp=18*Math.sin(y*.0065+x*.0018);
   const phase=.012*(x+warp)-t*.9*1.05*speed;
   const carrier=Math.sin(phase),secondary=Math.sin(phase*2-.6);
   const envelope=.72+.28*layer;
   const ridge=.68*Math.sin(x*.008-y*.004)+.32*Math.sin(x*.014+y*.002);
   const spacing=4.5*Math.sin(Math.PI*clamp(y/900))*ridge*Math.sin(y*.046);
   moved.push([x+6*(.35*carrier+.1*secondary)+part*(x<800?-1:1)*(150+220*g.seed),y+breath*.18+6*envelope*(.82*carrier+.12*secondary)+spacing-rise*(200+650*g.seed)]);
  }
  // Engraver's permanent foundation: preserves density and the interwoven
  // upper/lower strata, even when live ink marks move along the same contour.
  ctx.strokeStyle='rgba(85,123,140,'+(g.opacity*.66).toFixed(3)+')';
  ctx.lineWidth=g.width*.72;ctx.lineCap='round';ctx.lineJoin='round';
  ctx.beginPath();moved.forEach((p,j)=>j?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke();

  // and the finished ink remains. New passes start from the upstream
  // source without erasing the existing contour or moving a fixed dash.
  const duration=7+9*g.seed;
  const cycle=t/duration+g.seed;
  const pass=Math.floor(cycle);
  const front=smooth(cycle-pass);
  const inkStart=Math.max(0,pass===0?0:0);
  const end=Math.max(1,Math.floor(front*(N-1)));
  const accent=.22+.22*g.seed;
  for(let j=0;j<end;j++){
   const u=(j+.5)/(N-1);
   // Soft nib at the growing tip, continuous body behind it.
   const tip=clamp((front-u)*N/5);
   const pressure=(.65+.35*Math.sin(u*10+g.seed*6)**2)*(.25+.75*smooth(tip));
   ctx.strokeStyle='rgba(62,105,122,'+(g.opacity*accent*pressure).toFixed(3)+')';
   ctx.lineWidth=Math.max(.12,g.width*(.35+.55*pressure));
   ctx.beginPath();ctx.moveTo(moved[j][0],moved[j][1]);ctx.lineTo(moved[j+1][0],moved[j+1][1]);ctx.stroke();
  }
  // A new pass begins only after the previous pass is fully laid down;
  // the permanent foundation above keeps the complete drawing visible.

 }
 ctx.restore();
}
fetch('/experiments/assets/living-water-contour-engraving-v10.svg').then(r=>{if(!r.ok)throw Error('v10 HTTP '+r.status);return r.text()}).then(xml=>{
 const doc=new DOMParser().parseFromString(xml,'image/svg+xml');
 if(doc.querySelector('parsererror'))throw Error('v10 parse');
 const paths=[...doc.querySelectorAll('path')],hidden=document.createElementNS('http://www.w3.org/2000/svg','svg');
 hidden.setAttribute('viewBox','0 0 1600 900');hidden.style.cssText='position:absolute;width:0;height:0;overflow:hidden';document.body.appendChild(hidden);
 paths.forEach((original,i)=>{const p=original.cloneNode(true);hidden.appendChild(p);let len=0;try{len=p.getTotalLength()}catch{}if(len>0){const n=Math.max(18,Math.min(75,Math.ceil(len/24))),pts=[];for(let j=0;j<=n;j++){const q=p.getPointAtLength(len*j/n);pts.push([q.x,q.y])}sourceLines.push({pts,y:pts[Math.floor(n/2)][1],width:Number(p.getAttribute('stroke-width')||'.7'),opacity:Number(p.getAttribute('opacity')||'.3'),seed:rand(i+71)})}hidden.removeChild(p)});
 hidden.remove();draw();
}).catch(err=>{console.error('Cannot restore v10:',err)});
function frame(now){if(!last)last=now;if(now-last>=30){const dt=Math.min(.06,(now-last)/1000);last=now;if(!halt)clock+=dt;draw()}requestAnimationFrame(frame)}requestAnimationFrame(frame)})();</script></body></html>
