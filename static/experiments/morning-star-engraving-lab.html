<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Morning Star — Y Axis Motion Lab 02</title><style>*{box-sizing:border-box}body{margin:0;background:#ece8dd;color:#253247;font-family:Georgia,serif}.wrap{max-width:1100px;margin:auto;padding:40px 22px}h1{font-weight:400;font-size:clamp(34px,6vw,70px);margin:0}p{line-height:1.6}.samples{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:28px}.sample{position:relative;aspect-ratio:1;overflow:hidden;display:grid;place-items:center;perspective:1200px}.paper{background:#f7f0e2}.night{background:#122944}.scene{position:relative;width:90%;height:90%;transform-style:preserve-3d}.layer{position:absolute;inset:0;width:100%;height:100%;transform-style:preserve-3d;backface-visibility:visible;transform-origin:50% 50%}.body{animation:spin-body 26s linear infinite}.rays{animation:spin-rays 38s linear infinite}.layer img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none}@keyframes spin-body{from{transform:rotateY(0deg)}to{transform:rotateY(360deg)}}@keyframes spin-rays{from{transform:rotateY(0deg)}to{transform:rotateY(-360deg)}}.tag{position:absolute;bottom:16px;left:20px;font-size:12px;letter-spacing:.12em}.night .tag{color:white}@media(max-width:650px){.samples{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){.body,.rays{animation:none!important}}</style></head><body><main class="wrap"><p>WESTSIDE WATCH / DORÉ MOTION / ISOLATED LAB</p><h1>Morning Star <em>02</em></h1><p>以畫面中央豎直 Y 軸為共同旋轉軸：八芒主星繞 Y 軸旋轉，發射星光繞同軸反向旋轉。這是透視旋轉，而非畫面平面內的 rotate(2D)。尚未接入正式 Magazine。</p><div class="samples"><div class="sample paper"><div class="scene"><div class="layer rays"><img src="/experiments/assets/morning-star-rays-yaxis-v2.svg" alt=""></div><div class="layer body"><img src="/experiments/assets/morning-star-body-yaxis-v2.svg" alt="金色晨星以豎軸立體旋轉，星光反向旋轉"></div></div><span class="tag">PAPER / Y-AXIS</span></div><div class="sample night"><div class="scene"><div class="layer rays"><img src="/experiments/assets/morning-star-rays-yaxis-v2.svg" alt=""></div><div class="layer body"><img src="/experiments/assets/morning-star-body-yaxis-v2.svg" alt="金色晨星以豎軸立體旋轉，星光反向旋轉"></div></div><span class="tag">MIDNIGHT BLUE / Y-AXIS</span></div></div><p>Reduced-motion 設定會停用旋轉。當前為兩個獨立 SVG 向量層，由 CSS 3D 透視控制。</p></main></body></html>
