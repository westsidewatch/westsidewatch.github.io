 </svg><div class="small"><button id="run">啟動七重疊 · ENTER OLIVE MOUNTAIN</button><button id="reset">重置</button><span id="status">準備 · 兩個方塊和字形共用七層顏色運動</span></div><p>概念驗證：兩個經文方塊不是單獨浮在字樣前方；它們穿越字形筆劃，七色同時在字內翻折；當兩塊最後合流時，字形與方塊一起落到橄欖山專屬色。此頁不改動主站或 P2 捲動。</p></main><script>
 const A=document.getElementById('panel-a'),B=document.getElementById('panel-b'),colors=document.getElementById('moving-color'),bridge=document.getElementById('bridge'),status=document.getElementById('status');let raf=0;
 const palette=["#427D99","#B79B41","#C6AF69","#718B5F","#A56C40","#A35458","#8570A1"];
 function ease(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2}
 function mix(a,b,t){return a+(b-a)*t}
 function paint(t){
   const e=ease(t),s=Math.min(6,Math.floor(t*7));const aX=mix(-310,1050,e),bX=mix(1660,285,e),aY=mix(34,154,e),bY=mix(304,154,e);
   A.setAttribute('transform','translate('+aX+' '+aY+') rotate('+(Math.sin(t*Math.PI*2)*9)+' 132 132)');
   B.setAttribute('transform','translate('+bX+' '+bY+') rotate('+(-Math.sin(t*Math.PI*2)*9)+' 132 132)');
   const ink=palette[s];A.firstElementChild.setAttribute('fill',ink);B.firstElementChild.setAttribute('fill',palette[Math.min(6,s+1)]);
   colors.setAttribute('opacity',String(Math.min(1,t*6)));colors.setAttribute('transform','translate('+mix(-1400,0,e)+' 0) skewX('+(Math.sin(t*3.14)*-10)+')');
   bridge.setAttribute('d','M'+(aX+265)+' '+(aY+132)+' Q800 '+(270-90*Math.sin(t*Math.PI))+' '+bX+' '+(bY+132));
   bridge.setAttribute('stroke',ink);bridge.setAttribute('opacity',String(Math.sin(t*Math.PI)));
   if(t>=1){A.firstElementChild.setAttribute('fill','#718b5f');B.firstElementChild.setAttribute('fill','#718b5f');colors.querySelectorAll('rect').forEach(r=>r.setAttribute('fill','#718b5f'));status.textContent='完成 · 字形、雙方塊、七重疊共同落為橄欖綠';}
 }
 function run(){cancelAnimationFrame(raf);const start=performance.now();function tick(now){let t=Math.min(1,(now-start)/2400);paint(t);if(t<1)raf=requestAnimationFrame(tick)}raf=requestAnimationFrame(tick)}
 document.getElementById('run').addEventListener('click',run);document.getElementById('reset').addEventListener('click',()=>{cancelAnimationFrame(raf);colors.querySelectorAll('rect').forEach((r,i)=>r.setAttribute('fill',palette[i]));paint(0);status.textContent='準備 · 兩個方塊和字形共用七層顏色運動'});paint(0);
