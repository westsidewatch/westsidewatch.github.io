true),verses[3].cloneNode(true));const bridge=document.createElement('section');bridge.className='unit reading-bridge';bridge.dataset.role='reading-bridge';bridge.innerHTML='<span class="bridge-coordinate" lang="en">Luke 24:27</span><div class="bridge-copy"></div><p class="english" lang="en">And beginning at Moses and all the prophets, he expounded unto them in all the scriptures the things concerning himself.</p><a class="bridge-link" href="#study-full">本章研讀</a>';bridge.querySelector('.bridge-copy').append(verses[4]);const coordinate=document.createElement('div');coordinate.className='outer-coordinate';coordinate.innerHTML='<span class="eyebrow">Luke</span><span class="chapter-index">24</span><span class="caption">13–35 · On the Road</span>';core.append(el('prints'),titleEl,el('scripture'),el('note'),el('illustration'),bridge,intro,coordinate);const lineSvg=document.createElementNS('http://www.w3.org/2000/svg','svg');lineSvg.setAttribute('viewBox','0 0 3 3');lineSvg.setAttribute('aria-hidden','true');lineSvg.setAttribute('class','realm-construction-lines');core.append(lineSvg);

function updateNote(){const x=host.querySelector('.note-content');if(!x)return;const checked=document.getElementById('sample').checked;x.dataset.noteState=checked?'sample':'empty';x.innerHTML=checked?'<span class="note-ref">Luke 24:27</span><p>'+esc(d.note.sample)+'</p>':''}
function taperedRibbon(poly,width,phase){const lens=poly.slice(1).map((p,i)=>Math.hypot(p[0]-poly[i][0],p[1]-poly[i][1])),total=lens.reduce((a,b)=>a+b,0),samples=[];let pos=0;for(let i=0;i<lens.length;i++){const a=poly[i],b=poly[i+1],n=Math.max(6,Math.ceil(lens[i]*35));for(let j=0;j<n;j++){const t=j/n;samples.push({p:[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t],t:(pos+lens[i]*t)/total})}pos+=lens[i]}samples.push({p:poly[poly.length-1],t:1});const side=sign=>samples.map((s,i)=>{const prev=samples[Math.max(0,i-1)].p,next=samples[Math.min(samples.length-1,i+1)].p,dx=next[0]-prev[0],dy=next[1]-prev[1],len=Math.hypot(dx,dy)||1;const w=width*(.12+.88*Math.pow(Math.sin(Math.PI*s.t),.7))*(.73+.27*Math.pow(Math.sin(Math.PI*(s.t+.12+phase)),2))/2;return[(s.p[0]-sign*dy/len*w).toFixed(5),(s.p[1]+sign*dx/len*w).toFixed(5)]});return'M'+[...side(1),...side(-1).reverse()].map(p=>p.join(' ')).join('L')+'Z'}
function constructionLines(){const svg=host.querySelector('.realm-construction-lines');if(!svg)return;const style=document.getElementById('line-style').value;svg.dataset.style=style;const item=d.lineLanguage.incised[style];if(!item){svg.innerHTML=d.lineLanguage.styles[style].map(p=>'<path d="'+p.d+'" fill="none" stroke="currentColor" stroke-width="'+p.w+'" opacity="'+p.o+'" stroke-linejoin="miter" stroke-linecap="butt"/>').join('');return}const width=style==='D'?.011:.006;let ink=item.paths.map((p,i)=>'<path d="'+taperedRibbon(p,width,i*.08)+'" fill="currentColor" opacity="'+(style==='D'?.83:.69)+'"/>').join('');if(style==='E'){for(let i=1;i<=5;i++){const q=.009+i*.006,l=.40-i*.052;const p1=[[2+q,2-l],[2+q,2+q],[2-l,2+q]],p2=p1.map(([x,y])=>[3-x,3-y]);ink+=[p1,p2].map(p=>'<path d="'+taperedRibbon(p,.0022,i*.03)+'" fill="currentColor" opacity="'+(.66-i*.07)+'"/>').join('')}}svg.innerHTML=ink}
function texture(){const z=host.querySelector('.field-ink'),m=document.getElementById('texture').value;if(!z)return;z.dataset.texture=m;let lines='';if(m==='original'){z.innerHTML='<image href="'+d.source.oldTexture+'" x="0" y="0" width="3" height="3" preserveAspectRatio="xMidYMid slice" opacity=".36"/>';return}if(m==='none'){z.innerHTML='';return}if(m==='coordinated'){const bands=[];for(let i=0;i<16;i++){const q=.005+i*.0028+Math.pow(i/15,2)*.020,l=.91-i*.038;const a=[[2+q,2-l],[2+q,2+q],[2-l,2+q]],b=a.map(([x,y])=>[3-x,3-y]);for(const p of [a,b])bands.push('<path d="'+taperedRibbon(p,i%5===0?.0026:.0016,i*.015)+'" fill="currentColor" opacity="'+(.61-i*.022)+'"/>');const p3=[[1+q,.012+q],[1.987-q,.012+q],[1.987-q,.89-i*.035]],p4=p3.map(([x,y])=>[3-x,3-y]);for(const p of [p3,p4])bands.push('<path d="'+taperedRibbon(p,.0011,i*.018)+'" fill="currentColor" opacity="'+(.32-i*.012)+'"/>')}z.innerHTML=bands.join('');return}if(m==='r181'){for(let i=0;i<34;i++){const q=.018+i*.011;lines+='<path d="M'+(2-q)+' 0V'+(1-q)+'H'+(1-q)+'V2 M'+(1+q)+' 3V'+(2+q)+'H'+(2+q)+'V1" fill="none" stroke="currentColor" stroke-width="'+(i%6===0?.0022:.0012)+'" opacity="'+(.35-i*.007)+'"/>'}}else{for(let i=0;i<12;i++){const q=.004+i*.0047,len=.98-i*.025,w=i%4===0?.0019:.00105,o=.49-i*.021;const x=2-q,y=2-q,u=1+q,v=1+q;lines+='<path d="M'+q+' '+(2-len)+'V'+q+'H'+x+'V'+(1-q)+' M'+(1+len)+' '+y+'H'+q+'V'+(1+q)+' M'+u+' '+(1+len)+'V'+v+'H'+(3-q)+'V'+(3-q)+'H'+u+'V'+(2+q)+'" fill="none" stroke="currentColor" stroke-width="'+w+'" opacity="'+o+'"/>'}}z.innerHTML=lines}
for(const b of document.querySelectorAll('[data-layout]'))b.addEventListener('click',()=>{layout=b.dataset.layout;workspace.classList.toggle('layout-A',layout==='A');workspace.classList.toggle('layout-B',layout==='B');for(const x of document.querySelectorAll('[data-layout]'))x.setAttribute('aria-pressed',String(x===b));render()});document.getElementById('sample').addEventListener('change',updateNote);document.getElementById('texture').addEventListener('change',texture);document.getElementById('line-style').addEventListener('change',constructionLines);for(const id of ['guides','unmark','mono'])document.getElementById(id).addEventListener('change',e=>document.body.classList.toggle({guides:'guide-mode',unmark:'unmarked',mono:'mono'}[id],e.target.checked));render()})()
