function drawFunctionalSeam(){const lower=host.querySelector('.reading-extension'),band=host.querySelector('.reading-band.exposition'),study=band?.querySelector('.study');if(!lower||!study||!band)return;if(!document.getElementById('extension').checked||document.getElementById('texture').value!=='candidate'){lower.replaceChildren();return}const q=band.clientWidth/3,style=getComputedStyle(band),gap=parseFloat(style.paddingTop)/q,end=(study.offsetTop+study.offsetHeight)/q,edge=2,depth=band.clientHeight/q;if(!q||!depth)return;lower.setAttribute('viewBox','0 0 3 '+depth);const lines=[];for(let i=0;i<34;i++){const offset=.018+i*.011,w=i%6===0?.0022:.0012,o=.35-i*.007;const y=gap*(.12+.65*i/33),x=edge+.004+i*.0022;/* Continue original bottom starts, distributed across the seam. The longest lines define the actual study boundary. */const last=i<6?Math.max(y,end-.03-i*.018):Math.min(end,gap+.14+(33-i)*.014);lines.push('<path data-role="study-boundary" d="M'+(1+offset)+' 0V'+y+'H'+x+'V'+last+'" fill="none" stroke="currentColor" stroke-width="'+w+'" opacity="'+o+'"/>')}for(let i=0;i<6;i++){const offset=.018+i*.011,y=gap*(.12+.65*i/33),x=edge+.004+i*.0022,w=i===0?.0038:i===3?.0022:.0014,o=i===0?.82:.62-i*.035;lines.push('<path data-role="boundary-accent" d="M'+(1+offset)+' 0V'+y+'H'+x+'V'+Math.max(y,end-.03-i*.018)+'" fill="none" stroke="currentColor" stroke-width="'+w+'" opacity="'+o+'"/>')}if(band.clientWidth>850){for(const note of study.querySelectorAll('.study-note')){const y=(note.getBoundingClientRect().top-band.getBoundingClientRect().top)/q;const right=edge+Math.min(.075,(parseFloat(getComputedStyle(note).paddingLeft)-8)/q);for(let i=0;i<3;i++){const x=edge+.004+i*.0022;lines.push('<path data-role="verse-branch" data-start="'+note.dataset.start+'" d="M'+x+' '+(y+.012+i*.009)+'H'+(right-i*.009)+'" fill="none" stroke="currentColor" stroke-width="'+(i===0?.0022:.0012)+'" opacity="'+(.62-i*.14)+'"/>')}}}lower.innerHTML=lines.join('')}
function drawWholeGuidance(){const svg=host.querySelector('.whole-reading-spine');if(!svg)return;const enabled=document.getElementById('extension').checked&&document.getElementById('texture').value==='candidate';host.classList.toggle('guided',enabled);if(!enabled){svg.replaceChildren();return}const base=host.getBoundingClientRect(),q=base.width/3;if(!q){svg.replaceChildren();return}if(base.width<=850){const bands=[...host.querySelectorAll('.reading-band')];const ys=bands.map(e=>(e.getBoundingClientRect().top-base.top)/q);const last=(bands.at(-1).getBoundingClientRect().bottom-base.top)/q;svg.setAttribute('viewBox','0 0 3 '+base.height/q);const paths=[];for(let i=0;i<6;i++){const x=(3+i*.8)/q,dx=3/q;let d='M'+x+' '+ys[0];for(let k=1;k<ys.length;k++){const y=ys[k]+(5+i*.6)/q;d+=' V'+y+' H'+(x+dx)+' V'+(y+5/q)+' H'+x}d+=' V'+last;paths.push('<path data-guide-role="mobile-reading" d="'+d+'" fill="none" stroke="currentColor" stroke-width="'+(i===0?1:.45)/q+'" opacity="'+(.62-i*.07)+'"/>')}svg.innerHTML=paths.join('');return}const box=e=>{const r=e.getBoundingClientRect();return{x:(r.left-base.left)/q,y:(r.top-base.top)/q,w:r.width/q,h:r.height/q,b:(r.bottom-base.top)/q}};const ex=host.querySelector('.exposition'),study=ex.querySelector('.study'),places=host.querySelector('.places'),geo=host.querySelector('.geography'),rel=host.querySelector('.relationships'),lib=host.querySelector('.library'),sb=box(study),eb=box(ex),pb=box(places),gb=box(geo),rb=box(rel),lb=box(lib),list=places.querySelector('.route-list'),ev=[...list.children].map(box),books=box(lib.querySelector('.books')),depth=base.height/q;svg.setAttribute('viewBox','0 0 3 '+depth);const lines=[];const make=(role,d,w,o)=>'<path data-guide-role="'+role+'" d="'+d+'" fill="none" stroke="currentColor" stroke-width="'+w+'" opacity="'+o+'" stroke-linejoin="miter"/>';for(let i=0;i<12;i++){const off=.009+i*.0046,w=i===0?.0038:i%6===0?.0022:.0012,o=i===0?.78:.40-i*.018;const sx=2+.004+i*.0022,gap=parseFloat(getComputedStyle(ex).paddingTop)/q,sy=i<6?sb.b-.03-i*.018:Math.min(sb.b,eb.y+gap+.14+(33-i)*.014);const a=pb.y+.025+i*.006,b=gb.y+.025+i*.006,c=rb.y+.025+i*.006,d=lb.y+.025+i*.006;const left=.008+off,gx=1+off,rx=1+off;const end=books.b-.02-i*.009;lines.push(make('study-to-chronology','M'+sx+' '+sy+' V'+a+' H'+left+' V'+b,w,o));lines.push(make('chronology-to-geography','M'+left+' '+b+' H'+gx+' V'+c,w,o));lines.push(make('geography-to-crossrefs','M'+gx+' '+c+' H'+rx+' V'+d,w,o));lines.push(make('crossrefs-to-books','M'+rx+' '+d+' H'+left+' V'+end,w,o));/* Route folds across actual event row boundaries, through their reserved top gutters. */if(ev.length===6&&i<6){const y1=ev[0].y+.012+i*.006,y2=ev[3].y+.012+i*.006,right=2.99-off;lines.push(make('timeline-fold','M'+left+' '+y1+' H'+right+' V'+y2+' H'+left,w,o))}}svg.innerHTML=lines.join('')}
function texture(){const z=host.querySelector('.field-ink'),m=document.getElementById('texture').value;if(!z)return;let lines='';if(m==='original'){z.innerHTML='<image href="'+d.source.oldTexture+'" x="0" y="0" width="3" height="3" preserveAspectRatio="xMidYMid slice" opacity=".13"/>';return}if(m==='none'){z.innerHTML='';return}for(let i=0;i<34;i++){const q=.018+i*.011;lines+='<path d="M'+(2-q)+' 0V'+(1-q)+'H'+(1-q)+'V2 M'+(1+q)+' 3V'+(2+q)+'H'+(2+q)+'V1" fill="none" stroke="currentColor" stroke-width="'+(i%6===0?.0022:.0012)+'" opacity="'+(.35-i*.007)+'"/>'}z.innerHTML=lines}
for(const b of document.querySelectorAll('[data-layout]'))b.addEventListener('click',()=>{layout=b.dataset.layout;workspace.classList.toggle('layout-A',layout==='A');workspace.classList.toggle('layout-B',layout==='B');for(const x of document.querySelectorAll('[data-layout]'))x.setAttribute('aria-pressed',String(x===b));render()});document.getElementById('sample').addEventListener('change',updateNote);document.getElementById('texture').addEventListener('change',()=>{texture();extendTexture()});document.getElementById('extension').addEventListener('change',extendTexture);for(const id of ['guides','unmark','mono'])document.getElementById(id).addEventListener('change',e=>document.body.classList.toggle({guides:'guide-mode',unmark:'unmarked',mono:'mono'}[id],e.target.checked));render()})()
