unit('scripture',title('Scripture','經文 · 路加福音 24:13–15, 27')+'<p class="verse"><b>13</b>正當那日，門徒中有兩個人往一個村子去；這村子名叫以馬忤斯，離耶路撒冷約有二十五里。</p><p class="english">And, behold, two of them went that same day to a village called Emmaus, which was from Jerusalem about threescore furlongs.</p><p class="verse"><b>14</b>他們彼此談論所遇見的這一切事。</p><p class="verse"><b>15</b>正談論相問的時候，耶穌親自就近他們，和他們同行。</p><p class="verse"><b>27</b>於是從摩西和眾先知起，凡經上所指著自己的話都給他們講解明白了。</p><a class="caption" href="/one/?book=42&chapter=24">閱讀全章 · 路加福音 24:1–53</a>'),

].join('');const el=id=>host.querySelector('[data-role="'+id+'"]');const core=document.createElement('div');core.className='core';core.innerHTML='<svg class="core-field" viewBox="0 0 3 3" aria-hidden="true"><defs><clipPath id="field-mask"><path d="M0 0H2V1H1V2H0Z M2 1H3V3H1V2H2Z"/></clipPath></defs><path class="field-a" d="M0 0H2V1H1V2H0Z"/><path class="field-b" d="M2 1H3V3H1V2H2Z"/><g class="field-ink" clip-path="url(#field-mask)"></g><path class="mother-guide" d="M0 0H2V2H0Z M1 1H3V3H1Z"/><path class="shared-guide" d="M1 1H2V2H1Z"/></svg>';const titleEl=el('title');titleEl.prepend(el('identity'));titleEl.querySelector('.chapter-index').remove();titleEl.querySelector('.chapter-label').textContent='Luke 24';const intro=document.createElement('section');intro.className='unit study-intro';intro.dataset.role='study-intro';intro.innerHTML=title('Study','本章研讀')+'<p>'+esc(s.position)+'</p><a class="caption" href="#study-full">本章研讀全文</a>';el('study').id='study-full';const scripture=el('scripture'),verses=[...scripture.querySelectorAll('.verse,.english')];const continued=document.createElement('div');continued.className='scripture-continuation';continued.innerHTML='<span class="eyebrow">Luke 24:13–15</span>';for(const x of verses.slice(1,-1))continued.append(x);el('study').prepend(continued);scripture.querySelector('h3 small').textContent='經文 · 路加福音 24:13, 27';const coordinate=document.createElement('div');coordinate.className='outer-coordinate';coordinate.innerHTML='<span class="eyebrow">Luke</span><span class="chapter-index">24</span><span class="caption">13–35 · On the Road</span>';core.append(el('prints'),titleEl,el('scripture'),el('note'),el('illustration'),intro,coordinate);
const band=(name,...children)=>{const e=document.createElement('section');e.className='reading-band '+name;e.dataset.band=name;e.append(...children);return e};const contextual=band('places',el('map'),el('timeline'));const exposition=band('exposition',el('study'),el('background'));const relationships=band('relationships',el('connections'),el('harmony'));const library=band('library',el('books'));host.replaceChildren(core,contextual,exposition,relationships,library);for(const im of host.querySelectorAll('img')){const check=()=>{if(im.complete&&!im.naturalWidth)im.parentElement.classList.add('asset-missing')};im.addEventListener('error',check);check()}updateNote();texture();document.getElementById('annotation').textContent=d.directions[layout].description+'　筆記為內容狀態示例，未接入多寫。原圖缺失時顯示原來源。'}
function updateNote(){const x=host.querySelector('.note-content');if(!x)return;const checked=document.getElementById('sample').checked;x.dataset.noteState=checked?'sample':'empty';x.innerHTML=checked?'<span class="note-ref">Luke 24:27</span><p>'+esc(d.note.sample)+'</p>':''}
function texture(){const z=host.querySelector('.field-ink'),m=document.getElementById('texture').value;if(!z)return;let lines='';if(m==='original'){z.innerHTML='<image href="'+d.source.oldTexture+'" x="0" y="0" width="3" height="3" preserveAspectRatio="xMidYMid slice" opacity=".13"/>';return}if(m==='none'){z.innerHTML='';return}for(let i=0;i<34;i++){const q=.018+i*.011;lines+='<path d="M'+(2-q)+' 0V'+(1-q)+'H'+(1-q)+'V2 M'+(1+q)+' 3V'+(2+q)+'H'+(2+q)+'V1" fill="none" stroke="currentColor" stroke-width="'+(i%6===0?.0022:.0012)+'" opacity="'+(.35-i*.007)+'"/>'}z.innerHTML=lines}
for(const b of document.querySelectorAll('[data-layout]'))b.addEventListener('click',()=>{layout=b.dataset.layout;workspace.classList.toggle('layout-A',layout==='A');workspace.classList.toggle('layout-B',layout==='B');for(const x of document.querySelectorAll('[data-layout]'))x.setAttribute('aria-pressed',String(x===b));render()});document.getElementById('sample').addEventListener('change',updateNote);document.getElementById('texture').addEventListener('change',texture);for(const id of ['guides','unmark','mono'])document.getElementById(id).addEventListener('change',e=>document.body.classList.toggle({guides:'guide-mode',unmark:'unmarked',mono:'mono'}[id],e.target.checked));render()})()
