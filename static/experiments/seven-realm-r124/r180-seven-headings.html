<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Westside Watch · Seven Realms</title><link rel="stylesheet" href="/css/westside-design-os.css"><style>@font-face{font-family:"Bodoni Moda SC";src:url("/fonts/scripture-studio/BodoniModaSC-VF.ttf") format("truetype");font-weight:400 900;font-display:swap}*{box-sizing:border-box}body{margin:0;background:var(--ws-paper);color:var(--ws-ink);font-family:var(--ws-type-display-zh);font-synthesis:none}header,main{max-width:1440px;margin:auto;padding:clamp(16px,3vw,44px)}header{padding-bottom:0}header img{width:min(260px,60vw);height:auto}h1{font:400 var(--ws-type-scale-title-md)/1.12 var(--ws-type-display-en-sc);margin:1.3rem 0 .5rem}p{line-height:1.7}button,a{font:inherit;color:inherit}button{border:1px solid var(--ws-line);background:transparent;padding:.5em .8em;cursor:pointer}button[aria-pressed=true]{background:var(--ws-ink);color:var(--ws-paper)}.bar{display:flex;flex-wrap:wrap;align-items:center;gap:.7rem;margin:1rem 0}.bar a{margin-left:auto}.proof{margin:0 0 2.5rem}.proof-top{display:flex;align-items:center;justify-content:space-between;gap:1em;border-top:1px solid var(--ws-line);padding:.75em 0}.proof-top strong{font-size:var(--ws-type-scale-ui,14px)}.proof-top span{font:400 var(--ws-type-scale-meta)/1.2 var(--ws-type-display-en-sc)}.proof iframe{width:100%;height:800px;display:block;border:0;min-height:260px}.proof .action{display:flex;align-items:center;gap:1rem;flex-wrap:wrap;font-size:var(--ws-type-scale-meta);margin:.5em 0 0}button:focus-visible,a:focus-visible{outline:2px solid currentColor;outline-offset:3px}</style></head><body><header><img src="/images/westside-watch-masthead-landscape.svg" alt="Westside Watch"><h1 lang="en">Seven Realms</h1><p>小章帶領 · 版頭退讓</p><div class="bar"><button id="original" aria-pressed="true">原版</button><button id="candidate" aria-pressed="false">小章帶領</button><a href="r179-seal-led.html">以馬忤斯完整閱讀母版</a></div></header><main id="host"></main><script type="application/json" id="registry">{"version":"R180","base":"R179 3ce7a5b0","stage":"02","status":"candidate","rules":{"leading":"original small seal","identity":"English OS title-sm / Bodoni Moda SC 400; Chinese OS UI / Chiron 900","number":"hide redundant folio number in local identity, keep realm order","scope":"identity only; no global OS rewrite","default":"original","journal":"compact portal identity only, issue cover and issue-specific palette unchanged","daylightCinema":"R154 artwork locked, isolated identity-only alternative authorized by user; no seal, texture, screen/light geometry or print replacement"},"realms":[{"id":"water","zh":"活水堂西區","en":"Living Water","shape":"套嵌","anchor":"water-clearing","reference":"r172-reference.html","candidate":"r180-heading-reference.html?realm=water&heading=seal","lock":false},{"id":"journal","zh":"西望","en":"The Journal","shape":"橫向","anchor":"journal-name","reference":"r172-reference.html","candidate":"r180-heading-reference.html?realm=journal&heading=seal","lock":false},{"id":"emmaus","zh":"以馬忤斯","en":"Emmaus","shape":"交織","anchor":"emmaus-word","reference":"r172-reference.html","candidate":"r180-heading-reference.html?realm=emmaus&heading=seal","lock":false},{"id":"olive","zh":"橄欖山","en":"Olive Mountain","shape":"縱向","anchor":"olive-name","reference":"r172-reference.html","candidate":"r180-heading-reference.html?realm=olive&heading=seal","lock":false},{"id":"library","zh":"黎明書局","en":"Dawn Books","shape":"立體","anchor":"library-leaf","reference":"r172-reference.html","candidate":"r180-heading-reference.html?realm=library&heading=seal","lock":false},{"id":"daylight","zh":"白晝咖啡館","en":"Daylight Café","shape":"受光","anchor":"daylight-name","reference":"r172-reference.html","candidate":"r180-heading-reference.html?realm=daylight&heading=seal","lock":true},{"id":"cinema","zh":"天堂電影院","en":"Paradise Cinema","shape":"投影","anchor":"cinema-head","reference":"r172-reference.html","candidate":"r180-heading-reference.html?realm=cinema&heading=seal","lock":true}]}</script><script>(()=>{const d=JSON.parse(document.getElementById('registry').textContent),host=document.getElementById('host');let mode='original';host.innerHTML=d.realms.map((f,i)=>'<section class="proof" data-realm="'+f.id+'"><div class="proof-top"><strong>'+String(i+1).padStart(2,'0')+'　'+f.zh+'</strong><span>'+f.shape+'</span></div><iframe title="'+f.zh+'" src="r180-heading-reference.html?realm='+f.id+'"></iframe><div class="action"><a href="r180-heading-reference.html?realm='+f.id+'" target="_blank">原版單頁</a><a href="'+f.candidate+'" target="_blank">小章帶領單頁</a>'+(f.id==='emmaus'?'<a href="r179-seal-led.html">完整閱讀母版</a>':'')+'</div></section>').join('');const frames=[...host.querySelectorAll('iframe')];for(const f of frames){f.addEventListener('load',()=>{try{const doc=f.contentDocument,target=doc.querySelector('.r172-selected');if(!target)return;const fit=()=>{const h=Math.ceil(target.getBoundingClientRect().height);if(h>0&&Math.abs(f.clientHeight-h)>2)f.style.height=h+'px'};fit();const ro=new ResizeObserver(fit);ro.observe(target);f.contentWindow.addEventListener('pagehide',()=>ro.disconnect(),{once:true})}catch(e){}})}for(const id of ['original','candidate'])document.getElementById(id).addEventListener('click',()=>{mode=id;for(const j of ['original','candidate'])document.getElementById(j).setAttribute('aria-pressed',String(j===id));for(const f of frames){const u=new URL(f.src);if(mode==='candidate')u.searchParams.set('heading','seal');else u.searchParams.delete('heading');f.src=u.href}})})()</script></body></html>
