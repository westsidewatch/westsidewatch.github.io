function artwork(f){if(f.locked||view==='O')return '<iframe loading="lazy" class="reference" title="'+attr(f.zh+' 原版')+'" src="r172-reference.html?realm='+f.id+q()+'"></iframe>';const p=f[view],isJournal=f.id==='journal',seal=isJournal?'yin':'yang';let images='';if(p.image){let list=f.image?[f.image]:f.id==='olive'?['/images/olive/people-transparent-v1/david-pawson.png','/images/olive/people-transparent-v1/derek-prince.png','/images/olive/people-transparent-v1/kou-shao-en.png']:['094fdf4e045b31c1','10415f9ef2949fe8','1986afddbea09bc1'].map(x=>'/dawn-library/chinese-facsimile-covers/dawn-zh-clsc-'+x+'.webp');images='<figure class="pos image '+(f.id==='olive'?'portraits':f.id==='library'?'books':'')+'" style="'+pos(p.image)+'">'+list.map(x=>'<img loading="lazy" src="'+x+'" alt="'+attr(f.zh+' 既有圖版')+'">').join('')+'</figure>'}const guide='<svg class="guide" viewBox="0 0 16 10" aria-hidden="true">'+rect(p.a)+rect(p.b)+rect(p.title)+rect(p.text)+(p.image?rect(p.image):'')+'<path d="M'+p.a[0]+' 0V10 M'+p.b[0]+' 0V10" stroke="currentColor" stroke-width=".009" opacity=".5" stroke-dasharray=".05 .05"/></svg>';const url='r172-impressions.html?section='+f.section+'&embed=1&a='+p.a.join(',')+'&b='+p.b.join(',');return bg(f,p)+'<iframe class="impressions" loading="lazy" title="'+attr(f.zh+' 原經文雙印')+'" src="'+url+'"></iframe><div class="pos title" style="'+pos(p.title)+'"><span class="number">'+f.n+' / 07</span><img class="small-seal" src="seals/impressions/'+f.id+'-'+seal+'.svg" alt=""><h2 class="name" lang="en">'+f.en+'</h2><span class="zh">'+f.zh+'</span><p class="lead">'+f.lead+'</p></div>'+images+'<div class="pos text" style="'+pos(p.text)+'"><h3>'+f.caption+'</h3><p>'+f.detail+'</p><span class="entry"><img class="crest" src="seals/'+f.id+'-crest.svg" alt="">'+f.entry+'</span></div>'+guide}
