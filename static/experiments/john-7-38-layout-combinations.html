<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>John 7:38 — Landscape Editorial Layout Combinations</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400%3B1,6..96,400&family=Bodoni+Moda+SC:opsz,wght@6..96,400&display=swap"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/chiron-hei-hk-webfont/css/vf.css"><style>
:root{--paper:#faf9f5;--ink:#252525;--water:#5b8fa8;--en:"Bodoni Moda",serif;--zh:"Chiron Hei HK WS",sans-serif}*{box-sizing:border-box}html,body{margin:0}body{background:#e9e8e2;color:var(--ink);font-family:var(--en)}header.top{padding:20px clamp(20px,5vw,80px);display:flex;justify-content:space-between;align-items:end;gap:20px}header.top h1{font-weight:400;font-size:clamp(28px,4vw,56px);margin:0}header.top p{font:200 13px/1.5 var(--zh);margin:0;text-align:right}.index{padding:0 clamp(20px,5vw,80px) 24px;font:400 11px/1.4 var(--en);letter-spacing:.1em}.gallery{display:grid;gap:40px;padding:0 clamp(12px,3vw,50px) 70px}.unit{margin:0}.unit figcaption{padding:0 8px 10px;display:flex;justify-content:space-between;gap:15px;font:400 12px/1.3 var(--en);letter-spacing:.05em}.unit figcaption small{font:200 12px/1.4 var(--zh);letter-spacing:0}.sheet{position:relative;overflow:hidden;background:var(--paper);aspect-ratio:16/8;min-height:400px;padding:clamp(20px,3vw,55px);display:grid;isolation:isolate}.sheet:before{content:"";position:absolute;inset:0;z-index:-1;opacity:.15;background:repeating-linear-gradient(135deg,transparent 0 34px,#c2c0b7 34.5px 35px,transparent 35.5px 69px)}.meta{font:400 clamp(8px,.8vw,12px)/1.2 var(--en);letter-spacing:.12em;text-transform:uppercase}.headline{font-weight:400;letter-spacing:-.065em;line-height:.83;margin:0}.headline em{font-weight:400;color:var(--water)}.copy{font:400 clamp(12px,1.5vw,23px)/1.4 var(--en);max-width:26em;margin:0}.zh{font:200 clamp(11px,1.15vw,17px)/1.65 var(--zh);margin:0}.rule{border-top:1px solid var(--ink)}.sheet.a{grid-template-columns:1.3fr .7fr;grid-template-rows:auto 1fr auto;gap:20px}.a .meta{grid-column:1/-1}.a .headline{font-size:clamp(70px,12.5vw,220px);align-self:center}.a .copy{grid-column:2;align-self:center}.a .zh{grid-column:1/-1;align-self:end}.sheet.b{grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr auto;gap:18px}.b .meta{grid-column:1/-1}.b .headline{grid-column:1/-1;font-size:clamp(75px,13.2v t}.sheet .meta,.sheet .headline,.sheet .copy,.sheet .zh{grid-column:1/-1!important;grid-row:auto!important;text-align:left!important;align-self:auto!important}.sheet .headline{font-size:clamp(64px,14vw,130px)!important;overflow-wrap:anywhere}.sheet .copy{font-size:17px!important}.sheet .zh{font-size:14px!important}.unit figcaption{flex-direction:column}}

document.fonts.ready.then(()=>{const ok=document.fonts.check('16px "Bodoni Moda"');document.documentElement.dataset.bodoniLoaded=ok?'yes':'no';if(!ok){const notice=document.createElement('div');notice.textContent='Bodoni Moda 未載入：此瀏覽器目前顯示後備字體，請勿用作排版驗收。';notice.style.cssText='position:sticky;top:0;z-index:9999;background:#fff0d5;color:#252525;padding:12px 20px;font:16px sans-serif';document.body.prepend(notice)}});const verse='He that believeth on me, as the scripture hath said, out of his belly shall flow rivers of living water.';const zh='信我的人，就如經上所說：從他腹中要流出活水的江河來。';const modes=[['a','Feature opener','雜誌開篇：左巨字、右經文'],['b','Full-width headline','整版大標題：上下分層'],['c','Hero + rail','8:4 巨字主視覺與經文窄欄'],['d','Three-column spread','三欄編輯式跨頁'],['e','Centered typographic cover','十二欄居中封面'],['f','Editorial opener','大標題與雙語底欄'],['g','Asymmetric modular','偏置式標題與經文'],['h','Facing-page diptych','左右對頁：巨字與經文']];const title=(i)=>['<span>Living</span><br><em>Water.</em>','<span>RIVERS OF</span><br><em>LIVING WATER.</em>','<span>Living</span><br><em>Water.</em>','<em>rivers</em><br>of Living<br>Water.','<em>Living Water.</em>','<span>Rivers of</span><br><em>Living Water.</em>','<span>Living</span><br><em>Water.</em>','<span>Living</span><br><em>Water.</em>'][i];document.getElementById('gallery').innerHTML=modes.map(([id,name,desc],i)=>'<figure class="unit"><figcaption><span>'+String(i+1).padStart(2,'0')+' / '+name+'</span><small>'+desc+'</small></figcaption><section class="sheet '+id+'" data-layout="'+id+'"><div class="meta">THE GOSPEL ACCORDING TO JOHN · CHAPTER VII / VERSE 38</div><h2 class="headline" aria-hidden="true">'+title(i)+'</h2><p class="copy" lang="en">'+verse+'</p><p class="zh" lang="zh-Hant">'+zh+'</p><div class="foot">WESTSIDE WATCH / TYPOGRAPHY STUDY</div></section></figure>').join('');
</script></body></html>
