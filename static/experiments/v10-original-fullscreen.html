<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Original v10 — Lower Half Preview</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eeeae1}#upper{position:absolute;top:0;left:0;width:100vw;height:50vh;display:block;pointer-events:none}object{display:block;position:absolute;left:0;bottom:0;width:100vw;height:50vh;object-fit:fill} .version-label{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);z-index:10;background:#f2eee6;color:#253b43;border:1px solid #547e89;padding:7px 15px;font:12px/1.3 Georgia,serif;letter-spacing:.08em;white-space:nowrap;pointer-events:none}</style></head><body><svg id="upper" xmlns="http://www.w3.org/2000/svg" viewBox="0 -900 1600 900" preserveAspectRatio="none"><g id="upper-lines" fill="none" stroke="#557b8c" stroke-linecap="round"></g></svg><object id="v10" type="image/svg+xml" data="/experiments/assets/living-water-contour-engraving-v10.svg" aria-label="Original v10 animated engraving in lower half"></object><div class="version-label">V10 ORIGINAL · LOWER HALF · SVG-054 · V10 UPPER GEOMETRY + TONE</div><script>
(()=>{'use strict';
const holder=document.getElementById('v10');
holder.addEventListener('load',()=>{
 const doc=holder.contentDocument;if(!doc)return;
 const NS='http://www.w3.org/2000/svg',root=doc.documentElement;
 const group=doc.createElementNS(NS,'g');group.setAttribute('fill','none');group.setAttribute('stroke','#557b8c');group.setAttribute('stroke-linecap','round');
 const originals=[...doc.querySelectorAll('path')],paths=[];
 const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),smooth=v=>{v=clamp(v,0,1);return v*v*(3-2*v)};
 for(const original of originals){
  const len=original.getTotalLength();if(len<1)continue;
  const steps=clamp(Math.ceil(len/22),28,110),points=[];
  for(let j=0;j<=steps;j++){const q=original.getPointAtLength(len*j/steps);points.push([q.x,q.y])}
  const out=doc.createElementNS(NS,'path');
  for(const attr of ['opacity','stroke-width','stroke','stroke-linecap'])if(original.hasAttribute(attr))out.setAttribute(attr,original.getAttribute(attr));
  group.appendChild(out);paths.push({points,out,baseOpacity:Number(original.getAttribute('opacity')||1)});
 }

 // Upper completion is a separate SVG. The original lower-half v10 object
 // keeps precisely its approved dimensions, coordinates and original motion.

 // Complete the upper water with the SOURCE v10 uppermost contour geometry.
 // Preserve the approved lower-half object and its animation untouched.

 // Extend the actual upper stratum from each original v10 contour,
 // following its individual curvature and tangent, not a separate pattern.

 // Fill the entire missing upper water surface by continuing the upper
 // v10 contour family in its native x direction, with the original cadence.
 // This is a NEW upper-only geometry field; lower SVG remains untouched.

 // Extend the actual v10 upper contour FAMILY from its upper boundary.
 // Do not move, crop, rescale or edit the lower-half SVG.

 // Original v10 upper stratum: extend its path-index sequence backwards.
 // Fit each x column to the first original contour family, retaining
 // local curvature, natural line spacing and varying engraved stroke tone.
 const upperGroup=document.getElementById('upper-lines'),upperPaths=[];
 const sampleAt=(points,x)=>{
  for(let i=1;i<points.length;i++){
   const p=points[i-1],q=points[i],dx=q[0]-p[0];
   if(Math.abs(dx)<.0001||x<Math.min(p[0],q[0])||x>Math.max(p[0],q[0]))continue;
   return p[1]+(q[1]-p[1])*(x-p[0])/dx;
  }
  const p=points[0],q=points[points.length-1];
  return x<p[0]?p[1]:q[1];
 };
 const family=paths.slice(0,Math.min(34,paths.length));
 const xs=Array.from({length:151},(_,i)=>1600*i/150);
 const profiles=family.map(p=>xs.map(x=>sampleAt(p.points,x)));
 const top=profiles[0];
 const mid=profiles[16];
 const far=profiles[32];
 const column=xs.map((x,j)=>{
  const step=Math.max(2.8,Math.min(6.5,(far[j]-top[j])/32));
  const bend=(mid[j]-(top[j]+far[j])*.5);
  return {step,bend};
 });
 const topMid=top[Math.floor(top.length/2)];
 const count=225;
 for(let k=1;k<=count;k++){
  const depth=k*4.35;
  const progress=Math.min(1,depth/900);
  const points=xs.map((x,j)=>{
   const {step,bend}=column[j];
   const curvature=top[j]-topMid;
   // Continue original x-wise contour slope and measured family bending.
   // Source curvature is not flattened; it becomes more legible upstream.
   const wave=curvature*(1+.48*progress)+bend*progress*2.5;
   const y=topMid-depth*(step/4.35)+wave;
   return [x,y];
  });
  const out=document.createElementNS(NS,'path');
  const source=family[(k-1)%family.length];
  const sourceWidth=Number(source.out.getAttribute('stroke-width')||.5);
  out.setAttribute('stroke-width',String(Math.max(.35,sourceWidth)));
  upperGroup.appendChild(out);
  // Preserve varied original v10 engraving opacity instead of one flat tone.
  const tonal=source.baseOpacity;
  const shade=.72+.28*Math.cos(progress*Math.PI*.75);
  upperPaths.push({points,out,baseOpacity:Math.min(.55,Math.max(.13,tonal*shade+(.10+.07*Math.sin(k*.13))*shade))});
 }
 const originalGroup=root.querySelector('g');if(originalGroup)originalGroup.replaceWith(group);else root.appendChild(group);
 let t=0,last=0,ready=true;
 function frame(now){requestAnimationFrame(frame);if(!last)last=now;const dt=Math.min(.05,(now-last)/1000);last=now;if(!ready)return;t+=dt;const travel=1.5,contrast=2,amp=6,breath=21*Math.sin(t*Math.PI/7)+5*Math.sin(t*Math.PI/13);
// A single continuous phase field governs every engraving point; y only modulates speed smoothly.
const field=(x,y)=>{const layer=smooth((y-180)/610),speed=.78+contrast*.25*layer,warp=18*Math.sin(y*.0065+x*.0018),phase=.012*(x+warp)-t*.9*travel*speed;return {layer,phase}};
for(const {points,out,baseOpacity} of [...paths,...upperPaths]){let d='';for(let i=0;i<points.length;i++){const [x,y]=points[i],{layer,phase}=field(x,y),envelope=.72+.28*layer;const carrier=Math.sin(phase),secondary=Math.sin(phase*2-.6);const densityStrength=2.5,verticalMask=Math.sin(Math.PI*clamp(y/900,0,1)),stationaryRidges=.68*Math.sin(x*.008-y*.004)+.32*Math.sin(x*.014+y*.002),spacingShift=densityStrength*1.8*verticalMask*stationaryRidges*Math.sin(y*.046);const yy=y+breath*.18+amp*envelope*(.82*carrier+.12*secondary)+spacingShift;const xx=x+amp*(.35*carrier+.10*secondary);d+=(i?'L':'M')+xx.toFixed(1)+' '+yy.toFixed(1)}out.setAttribute('d',d);out.setAttribute('opacity',baseOpacity.toFixed(3))}}requestAnimationFrame(frame);
});
})();
</script></body></html>
