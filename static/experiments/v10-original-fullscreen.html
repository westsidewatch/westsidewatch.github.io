<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Original v10 — Lower Half Preview</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eeeae1}#upper{position:absolute;top:0;left:0;width:100vw;height:50vh;display:block;pointer-events:none}object{display:block;position:absolute;left:0;bottom:0;width:100vw;height:50vh;object-fit:fill} .version-label{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);z-index:10;background:#f2eee6;color:#253b43;border:1px solid #547e89;padding:7px 15px;font:12px/1.3 Georgia,serif;letter-spacing:.08em;white-space:nowrap;pointer-events:none}</style></head><body><svg id="upper" xmlns="http://www.w3.org/2000/svg" viewBox="0 -900 1600 900" preserveAspectRatio="none"><g id="upper-lines" fill="none" stroke="#557b8c" stroke-linecap="round"></g></svg><object id="v10" type="image/svg+xml" data="/experiments/assets/living-water-contour-engraving-v10.svg" aria-label="Original v10 animated engraving in lower half"></object><div class="version-label">V10 ORIGINAL · LOWER HALF · SVG-061 · MID-FIELD CURVATURE REFINEMENT</div><script>
(()=>{'use strict';
const holder=document.getElementById('v10');
holder.addEventListener('load',()=>{
 const doc=holder.contentDocument;if(!doc)return;
 const NS='http://www.w3.org/2000/svg',root=doc.documentElement;
 const group=doc.createElementNS(NS,'g');group.setAttribute('fill','none');group.setAttribute('stroke','#557b8c');group.setAttribute('stroke-linecap','round');
 const originals=[...doc.querySelectorAll('path')],paths=[];
 const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),smooth=v=>{v=clamp(v,0,1);return v*v*(3-2*v)};
 for(const original of originals){
  const len=original.getTotalLength();if(len<1)continue;
  const steps=clamp(Math.ceil(len/22),28,110),points=[];
  for(let j=0;j<=steps;j++){const q=original.getPointAtLength(len*j/steps);points.push([q.x,q.y])}
  const out=doc.createElementNS(NS,'path');
  for(const attr of ['opacity','stroke-width','stroke','stroke-linecap'])if(original.hasAttribute(attr))out.setAttribute(attr,original.getAttribute(attr));
  group.appendChild(out);paths.push({points,out,baseOpacity:Number(original.getAttribute('opacity')||1)});
 }

 // Upper completion is a separate SVG. The original lower-half v10 object
 // keeps precisely its approved dimensions, coordinates and original motion.

 // Complete the upper water with the SOURCE v10 uppermost contour geometry.
 // Preserve the approved lower-half object and its animation untouched.

 // Extend the actual upper stratum from each original v10 contour,
 // following its individual curvature and tangent, not a separate pattern.

 // Fill the entire missing upper water surface by continuing the upper
 // v10 contour family in its native x direction, with the original cadence.
 // This is a NEW upper-only geometry field; lower SVG remains untouched.

 // Extend the actual v10 upper contour FAMILY from its upper boundary.
 // Do not move, crop, rescale or edit the lower-half SVG.

 // Original v10 upper stratum: extend its path-index sequence backwards.
 // Fit each x column to the first original contour family, retaining
 // local curvature, natural line spacing and varying engraved stroke tone.

 // SVG-055: use the original V10 multi-contour displacement field,
 // rather than copying a single line or synthesizing parallel strokes.
 const upperGroup=document.getElementById('upper-lines'),upperPaths=[];
 const xs=Array.from({length:141},(_,j)=>1600*j/140);
 const at=(pts,x)=>{
  for(let i=1;i<pts.length;i++){
   const a=pts[i-1],b=pts[i],dx=b[0]-a[0];
   if(Math.abs(dx)<1e-5||x<Math.min(a[0],b[0])||x>Math.max(a[0],b[0]))continue;
   return a[1]+(b[1]-a[1])*(x-a[0])/dx;
  }
  return x<pts[0][0]?pts[0][1]:pts[pts.length-1][1];
 };
 // Recover original line families across the entire v10 water surface.
 const contours=paths.map(p=>({p,ys:xs.map(x=>at(p.points,x))}));
 const middle=Math.floor(xs.length/2);
 contours.sort((a,b)=>a.ys[middle]-b.ys[middle]);
 const upperOriginal=contours.slice(0,Math.min(28,contours.length));
 const surface=contours.slice(0,Math.min(380,contours.length));
 const avg=arr=>arr.reduce((a,b)=>a+b,0)/arr.length;
 // Derive the upstream boundary from several original upper lines.
 const boundary=xs.map((x,j)=>avg(upperOriginal.slice(0,6).map(c=>c.ys[j])));
 const edgeCenter=avg(boundary);
 // A v10-derived curvature field: sample a moving band of original water
 // contours, subtract each contour's centerline, and retain its local bends.
 const bands=surface.filter((c,i)=>i%7===0).map(c=>{
  const cy=avg(c.ys);
  const bends=c.ys.map(y=>y-cy);
  const meanBend=avg(bends);
  return bends.map(y=>y-meanBend);
 });
 const smoothBand=(band,j)=>{
  const a=Math.max(0,j-2),b=Math.min(band.length-1,j+2);
  let total=0;for(let i=a;i<=b;i++)total+=band[i];
  return total/(b-a+1);
 };

 // SVG-056: engrave with nonuniform spacing and source-derived raised ridges.
 // Each streamline receives a monotone density warp so that close-set lines
 // form shadow and open-set lines form highlights, without crossing.
 const count=320;
 const densityCDF=u=>u+.018*Math.sin(u*6*Math.PI)+.006*Math.sin(u*13*Math.PI);
 const norm0=densityCDF(0),norm1=densityCDF(1);
 for(let k=0;k<count;k++){
  const u=(k+.5)/count;
  const progress=(densityCDF(u)-norm0)/(norm1-norm0);
  const depth=progress*940;
  const bandPos=progress*(bands.length-1);
  const i=Math.floor(bandPos),mix=bandPos-i;
  const bandA=bands[i],bandB=bands[Math.min(i+1,bands.length-1)];
  const points=xs.map((x,j)=>{
   const sourceBend=(1-mix)*smoothBand(bandA,j)+mix*smoothBand(bandB,j);
   const boundaryBend=boundary[j]-edgeCenter;
   const blend=Math.min(1,depth/170);
   // High engraved ridges: amplify the source contour displacement field,
   // especially where the existing family bends strongly.
   const ridge=sourceBend*(1.05+.22*Math.sin(progress*Math.PI));
   // Strengthen curvature in the previously near-parallel central region.
   // Multiple long-wavelength v10-like bends with smoothly changing phase
   // preserve coherent flow, without random noise or hard dark boundaries.
   const middleWeight=Math.pow(Math.sin(progress*Math.PI),1.3);
   const xNorm=x/1600;
   const swellA=21*Math.sin(xNorm*Math.PI*2.15+progress*4.0);
   const swellB=13*Math.sin(xNorm*Math.PI*4.35-progress*5.2);
   const swellC=7*Math.sin(xNorm*Math.PI*7.1+progress*2.6);
   const localCurvature=(swellA+swellB+swellC)*middleWeight;
   const crossCurrent=5*Math.sin(x*.0085+progress*8.5)*
     Math.sin(progress*Math.PI)*(.4+.6*Math.abs(sourceBend)/45);
   const y=edgeCenter-depth+boundaryBend*(1-blend*.45)+ridge*blend+
     crossCurrent+localCurvature;
   return [x,y];
  });
  const original=surface[Math.min(surface.length-1,Math.floor(progress*(surface.length-1)))].p;
  const out=document.createElementNS(NS,'path');
  const sourceWidth=Number(original.out.getAttribute('stroke-width')||.6);
  const ridgeWeight=.82+.18*Math.pow(Math.sin(progress*8*Math.PI),2);
  out.setAttribute('stroke-width',(sourceWidth*ridgeWeight).toFixed(3));
  upperGroup.appendChild(out);
  const opacity=original.baseOpacity;
  const shadow=.90+.10*Math.cos(progress*12*Math.PI);
  upperPaths.push({points,out,baseOpacity:Math.max(.12,Math.min(.53,opacity*shadow))});
 }



 // SVG-060: inherit the ACTUAL short quadratic engravings from v10.
 // V10 uses short M ... q ... paths, not detached straight M/L dashes.
 const hatchGroup=document.createElementNS(NS,'g');
 hatchGroup.setAttribute('fill','none');
 hatchGroup.setAttribute('stroke','#557b8c');
 hatchGroup.setAttribute('stroke-linecap','round');
 upperGroup.appendChild(hatchGroup);
 const hatches=[];
 const sourceHatches=originals.map(o=>{
  const d=o.getAttribute('d')||'';
  const m=d.match(/^M\s*([\d.-]+)[ ,]+([\d.-]+)\s*q\s*([\d.-]+)[ ,]+([\d.-]+)[ ,]+([\d.-]+)[ ,]+([\d.-]+)/i);
  return m?{x:+m[1],y:+m[2],cx:+m[3],cy:+m[4],dx:+m[5],dy:+m[6],
    opacity:Number(o.getAttribute('opacity')||.15),
    width:Number(o.getAttribute('stroke-width')||.36)}:null;
 }).filter(Boolean);
 // Replicate v10's measured distribution of short quadratic curves in the
 // upper extension. Each mark is anchored to a host upper streamline.
 for(let n=0;n<sourceHatches.length;n++){
  const src=sourceHatches[n];
  const li=Math.min(upperPaths.length-3,Math.max(2,
   Math.floor((n+.5)/sourceHatches.length*(upperPaths.length-4))));
  const line=upperPaths[li],pts=line.points;
  let j=3;
  for(let q=4;q<pts.length-4;q++)if(Math.abs(pts[q][0]-src.x)<Math.abs(pts[j][0]-src.x))j=q;
  const out=document.createElementNS(NS,'path');
  out.setAttribute('stroke-width',String(src.width));
  hatchGroup.appendChild(out);
  hatches.push({src,line,j,out,growing:n%5===0,phase:n*.17});
 }
 const originalGroup=root.querySelector('g');if(originalGroup)originalGroup.replaceWith(group);else root.appendChild(group);
 let t=0,last=0,ready=true;
 function frame(now){requestAnimationFrame(frame);if(!last)last=now;const dt=Math.min(.05,(now-last)/1000);last=now;if(!ready)return;t+=dt;const travel=1.85,contrast=2.15,amp=10.5,breath=31*Math.sin(t*Math.PI/7)+9*Math.sin(t*Math.PI/13);
// A single continuous phase field governs every engraving point; y only modulates speed smoothly.
const field=(x,y)=>{const layer=smooth((y-180)/610),speed=.78+contrast*.25*layer,warp=18*Math.sin(y*.0065+x*.0018),phase=.012*(x+warp)-t*.9*travel*speed;return {layer,phase}};
for(const {points,out,baseOpacity} of [...paths,...upperPaths]){let d='';for(let i=0;i<points.length;i++){const [x,y]=points[i],{layer,phase}=field(x,y),envelope=.72+.28*layer;const carrier=Math.sin(phase),secondary=Math.sin(phase*2-.6);const densityStrength=2.5,verticalMask=Math.sin(Math.PI*clamp(y/900,0,1)),stationaryRidges=.68*Math.sin(x*.008-y*.004)+.32*Math.sin(x*.014+y*.002),spacingShift=densityStrength*1.8*verticalMask*stationaryRidges*Math.sin(y*.046);const yy=y+breath*.29+amp*envelope*(.82*carrier+.12*secondary)+spacingShift;const xx=x+amp*(.35*carrier+.10*secondary);d+=(i?'L':'M')+xx.toFixed(1)+' '+yy.toFixed(1)}out.setAttribute('d',d);out.setAttribute('opacity',baseOpacity.toFixed(3))}


 // Animate the source quadratic mark as a deforming part of its host flow.
 for(const h of hatches){
  const p=h.line.points;
  const slide=h.growing?Math.floor(2.5*Math.sin(t*.43+h.phase)):0;
  const idx=Math.max(2,Math.min(p.length-3,h.j+slide));
  const [x,y]=p[idx],dx=p[idx+1][0]-p[idx-1][0],dy=p[idx+1][1]-p[idx-1][1];
  const angle=Math.atan2(dy,dx);
  const growth=h.growing?(.7+.3*(.5+.5*Math.sin(t*.72+h.phase))):1;
  const {layer,phase}=field(x,y),envelope=.72+.28*layer;
  const carrier=Math.sin(phase),secondary=Math.sin(phase*2-.6);
  const xx=x+amp*(.35*carrier+.10*secondary);
  const yy=y+breath*.29+amp*envelope*(.82*carrier+.12*secondary);
  const cs=Math.cos(angle),sn=Math.sin(angle),src=h.src;
  const rot=(u,v)=>[(u*cs-v*sn)*growth,(u*sn+v*cs)*growth];
  const [cx,cy]=rot(src.cx,src.cy),[ex,ey]=rot(src.dx,src.dy);
  h.out.setAttribute('d','M'+xx.toFixed(1)+' '+yy.toFixed(1)+
    'q'+cx.toFixed(1)+' '+cy.toFixed(1)+' '+ex.toFixed(1)+' '+ey.toFixed(1));
  h.out.setAttribute('opacity',Math.min(.28,src.opacity).toFixed(3));
 }
 }requestAnimationFrame(frame);
});
})();
</script></body></html>
