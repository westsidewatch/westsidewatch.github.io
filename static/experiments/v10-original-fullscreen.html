<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Original v10 — Lower Half Preview</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#d9e8ea}object{display:block;position:absolute;left:0;bottom:0;width:100vw;height:50vh;object-fit:fill} .version-label{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);z-index:10;background:#f2eee6;color:#253b43;border:1px solid #547e89;padding:7px 15px;font:12px/1.3 Georgia,serif;letter-spacing:.08em;white-space:nowrap;pointer-events:none}</style></head><body><object id="v10" type="image/svg+xml" data="/experiments/assets/living-water-contour-engraving-v10.svg" aria-label="Original v10 animated engraving in lower half"></object><div class="version-label">V10 ORIGINAL · LOWER HALF · SVG-046 · MOTION</div><script>
const frame=document.querySelector('#v10');
frame.addEventListener('load',()=>{
 const doc=frame.contentDocument;
 if(!doc)return;
 const paths=[...doc.querySelectorAll('path')];
 const base=paths.map(p=>p.getAttribute('transform')||'');
 const start=performance.now();
 function animate(now){
  const time=(now-start)/1000;
  for(let i=0;i<paths.length;i++){
   const phase=i*.041;
   const drift=1.5*Math.sin(time*.8+phase)+.65*Math.sin(time*1.35+phase*1.8);
   paths[i].setAttribute('transform',base[i]+' translate(0 '+drift.toFixed(3)+')');
  }
  requestAnimationFrame(animate);
 }
 requestAnimationFrame(animate);
});
</script></body></html>
