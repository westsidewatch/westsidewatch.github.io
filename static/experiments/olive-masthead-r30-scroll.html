<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>橄欖山 · OLIVE MOUNTAIN</title>
<link rel="stylesheet" href="/css/westside-design-os.css">
<style>
:root{--olive:var(--ws-olive,#71885d);--gold:var(--ws-morning-gold,#d6c475);--paper:var(--ws-paper,#f5f0e4)}
*{box-sizing:border-box}html{background:var(--olive)}body{margin:0;background:var(--olive);color:var(--paper);font-family:var(--ws-type-display-en,Georgia,serif)}
.masthead{position:relative;isolation:isolate;min-height:clamp(660px,88svh,1030px);width:100%;background:var(--olive);overflow:hidden;display:grid;grid-template-rows:auto auto 1fr auto}
.topline{padding:22px clamp(20px,4.4vw,92px) 12px;display:flex;justify-content:space-between;gap:20px;align-items:center;border-bottom:1px solid color-mix(in srgb,var(--gold) 60%,transparent);font:200 10px/1.5 system-ui;letter-spacing:.22em;color:var(--gold)}
.name-wrap{padding:clamp(28px,4vw,64px) clamp(20px,4.4vw,92px) 0;min-width:0}
h1{margin:0;font:400 clamp(59px,10.45vw,215px)/.89 var(--ws-type-display-en,Didot,Georgia,serif);letter-spacing:-.078em;white-space:nowrap;font-variant-ligatures:common-ligatures}
.zh-name{display:block;margin:12px 0 0;font:600 clamp(25px,3vw,50px)/1.25 var(--ws-type-display-zh,'Songti TC',serif);letter-spacing:.21em}
.word{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);align-self:end;gap:0;padding:clamp(28px,3vw,54px) clamp(20px,4.4vw,92px) clamp(40px,4.5vw,74px)}
.scripture{margin:0;position:relative;min-width:0}
.scripture--zh{display:flex;gap:clamp(28px,4.5vw,76px);align-items:flex-end;padding-right:clamp(15px,3vw,48px)}
.scripture--zh blockquote{margin:0;font:200 clamp(22px,2.9vw,48px)/1.5 var(--ws-type-display-zh,'Songti TC',serif);letter-spacing:.055em;writing-mode:vertical-rl;max-height:300px}
.scripture--en{padding-left:clamp(20px,4.4vw,80px);border-left:1px solid color-mix(in srgb,var(--gold) 60%,transparent)}
.scripture--en blockquote{margin:0;max-width:26ch;font:italic 400 clamp(27px,3.45vw,62px)/1.13 var(--ws-type-display-en,Georgia,serif);letter-spacing:-.02em}
.scripture cite{align-self:end;display:block;margin-top:24px;color:var(--gold);font:200 clamp(10px,.8vw,13px)/1.5 system-ui;letter-spacing:.12em;font-style:normal}
.scripture--zh cite{writing-mode:vertical-rl;margin:0 0 0 auto}
.bottomline{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px clamp(20px,4.4vw,92px);color:var(--gold);border-top:1px solid color-mix(in srgb,var(--gold) 60%,transparent);font:200 10px/1.4 system-ui;letter-spacing:.17em}
.sevenfold{position:absolute;inset:0;z-index:9;pointer-events:none;overflow:hidden}
.sevenfold i{position:absolute;inset:0;transform:translate3d(-110%,0,0);will-change:transform;background:var(--layer)}
.posters{max-width:1450px;margin:auto;padding:clamp(32px,5vw,90px) clamp(20px,4.4vw,92px) 80px;display:grid;grid-template-columns:1fr 1fr;gap:clamp(14px,2vw,36px)}
.posters figure{margin:0;min-width:0;padding:10px;border:1px solid color-mix(in srgb,var(--gold) 55%,transparent)}
.posters img{display:block;width:100%;height:auto;aspect-ratio:3/4;object-fit:cover}
.posters figcaption{padding:9px 0 0;font:200 10px/1.4 system-ui;color:var(--gold);letter-spacing:.13em}
@media(max-width:880px){.masthead{min-height:780px}h1{font-size:clamp(44px,9.6vw,83px)}.word{grid-template-columns:1fr;gap:36px}.scripture--zh{justify-content:space-between}.scripture--zh blockquote{writing-mode:horizontal-tb;max-height:none;font-size:clamp(21px,3.6vw,34px)}.scripture--zh cite{writing-mode:horizontal-tb}.scripture--en{padding:26px 0 0;border-left:0;border-top:1px solid color-mix(in srgb,var(--gold) 60%,transparent)}.scripture--en blockquote{font-size:clamp(25px,4vw,42px)}.zh-name{font-size:clamp(28px,4vw,40px)}}
@media(max-width:520px){.masthead{min-height:740px}.topline,.bottomline{font-size:8px;letter-spacing:.09em}.name-wrap{padding-top:30px}h1{font-size:clamp(35px,8.8vw,54px);letter-spacing:-.068em}.zh-name{font-size:28px}.word{gap:24px}.scripture--zh{display:block}.scripture--zh blockquote{font-size:21px}.scripture--zh cite{margin-top:12px}.scripture--en blockquote{font-size:27px}.posters{gap:8px;padding-inline:10px}.posters figure{padding:4px}.posters figcaption{font-size:8px;letter-spacing:0}}
@media(prefers-reduced-motion:reduce){.sevenfold{display:none}}
</style>
</head>
<body>
<header class="masthead" id="masthead">
 <div class="topline"><span>WESTSIDE WATCH · P2 / VOL.00</span><span>04 / 07 · INVITATION TO HEAR</span></div>
 <div class="name-wrap"><h1 lang="en">OLIVE MOUNTAIN</h1><span class="zh-name">橄欖山</span></div>
 <div class="word">
  <div class="scripture scripture--zh" lang="zh-Hant"><blockquote>可見信道是從聽道來的，聽道是從基督的話來的。</blockquote><cite>羅馬書 10:17</cite></div>
  <div class="scripture scripture--en" lang="en"><blockquote>So then faith cometh by hearing, and hearing by the word of God.</blockquote><cite>ROMANS 10:17 · KJV</cite></div>
 </div>
 <div class="bottomline"><span>THE WORD · 聽道與信道</span><span>SCROLL ↓</span></div>
 <div class="sevenfold" aria-hidden="true">
  <i style="--layer:var(--ws-water,#6f9aa0)"></i><i style="--layer:var(--ws-first-light,#a4b5a1)"></i><i style="--layer:var(--ws-pale-gold,#e1cf8b)"></i><i style="--layer:var(--ws-olive,#71885d)"></i><i style="--layer:var(--ws-harvest,#bc8b4c)"></i><i style="--layer:var(--ws-crimson,#ae5148)"></i><i style="--layer:var(--ws-daylight-mauve,#90869d)"></i>
 </div>
</header>
<main class="posters" aria-label="橄欖山講員海報">
 <figure><img src="/images/olive/watchman-nee-editorial.png" alt="倪柝聲講員海報"><figcaption>WATCHMAN NEE · 倪柝聲</figcaption></figure>
 <figure><img src="/images/olive/derek-prince-editorial.png" alt="葉光明講員海報"><figcaption>DEREK PRINCE · 葉光明</figcaption></figure>
</main>
<script>
(()=>{
 const head=document.getElementById('masthead'),layers=[...head.querySelectorAll('.sevenfold i')];
 if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 let ticking=false;
 function render(){
  const travel=Math.max(1,head.offsetHeight*.72),progress=Math.max(0,Math.min(1,window.scrollY/travel));
  layers.forEach((layer,index)=>{
   const p=Math.max(0,Math.min(1,(progress-index*.053)/.58));
   const eased=p*p*(3-2*p);
   layer.style.transform=`translate3d(${(-110+220*eased).toFixed(3)}%,0,0)`;
  });
  ticking=false;
 }
 function update(){if(!ticking){ticking=true;requestAnimationFrame(render)}}
 addEventListener('scroll',update,{passive:true});addEventListener('resize',update,{passive:true});render();
})();
</script>
</body></html>
