<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>黎明書局</title>
<style>
:root{--ink:#252525;--paper:#f4efe5;--ground:#e8dbb8;--gold:#8c6818;--muted:#756e62;--line:rgba(80,65,38,.18)}*{box-sizing:border-box}html,body{margin:0;background:var(--ground);color:var(--ink);scroll-behavior:smooth}body{font-family:"Noto Serif TC","PingFang TC",serif}.stage{padding:10px}.spread{min-height:calc(100vh - 20px);display:grid;grid-template-columns:1fr 1fr;background:var(--paper);position:relative}.spread:after{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--line);pointer-events:none}.page{min-width:0;padding:clamp(26px,2.5vw,52px)}.k{font:500 .58rem/1.2 Arial,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}h1,h2,h3{font-weight:400}.brand,.reader-head,.lower-head{border-bottom:1px solid var(--ink);padding-bottom:16px}.brand h1,.reader-head h2,.lower-head h2{font-family:"Cormorant Garamond",serif;font-size:clamp(3.6rem,5vw,6.5rem);line-height:.76;margin:.18em 0}.brand h1 span,.reader-head h2 span,.lower-head h2 span{display:block;font-family:"Noto Serif TC";font-size:.16em;letter-spacing:.16em;margin-top:1em}.brand p,.selection p{font-size:.76rem;color:var(--muted)}.utility,.modes{display:flex;gap:1.25rem;padding:.75rem 0;border-bottom:1px solid var(--line)}button,input{font:inherit;color:inherit}.utility button,.modes button{border:0;background:none;padding:.2rem 0;cursor:pointer}.section{padding-top:clamp(22px,2vw,38px)}.section-title{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}.section-title h2{font-family:"Cormorant Garamond",serif;font-size:clamp(2.4rem,3.5vw,4.4rem);margin:0}.section-title span{font-size:.65rem;letter-spacing:.14em}.stars,.catalogue{display:grid;grid-template-columns:repeat(2,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line)}.stars{grid-template-columns:repeat(3,1fr)}.star,.work{border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer;padding:12px;display:grid;grid-template-columns:auto 1fr;gap:10px}.star{min-height:150px}.work{min-height:108px}.cover,.cover-fallback{width:54px;height:80px;object-fit:cover;background:#e8dfce;border:1px solid var(--line)}.star strong,.work strong{display:block;font-weight:400;line-height:1.15}.star em,.work small{font-style:normal;font-size:.66rem;color:var(--muted)}.tools{display:grid;grid-template-columns:1fr auto;gap:1rem;align-items:end;margin-bottom:14px}.tools input{border:0;border-bottom:1px solid var(--ink);background:none;padding:.65rem 0;outline:0}.count{font-family:"Cormorant Garamond";font-size:1.15rem}.selection{padding:18px 0;border-bottom:1px solid var(--line)}.selection h3{font-family:"Cormorant Garamond","Noto Serif TC";font-size:clamp(1.6rem,2.2vw,3rem);margin:.15em 0}.reader-body{padding:clamp(28px,3vw,58px) 0;max-width:44rem}.reader-body .empty{font-family:"Cormorant Garamond","Noto Serif TC";font-size:clamp(2rem,3vw,4rem);line-height:1.1}.reader-text{white-space:pre-wrap;line-height:1.9}.reader-link{color:inherit;text-underline-offset:.2em}.lower{margin-top:10px}.collection-page{grid-column:1/-1}.collection-head{display:flex;align-items:end;justify-content:space-between;gap:2rem}.collection-head .count{font-size:clamp(1.5rem,2vw,2.5rem)}#collection-stream{height:calc(100vh - 210px);min-height:520px;overflow:auto;margin-top:24px}.dawn-cover-stream__status{font-size:.68rem;letter-spacing:.08em;color:var(--muted);margin-bottom:14px}.dawn-cover-stream__rail{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:clamp(14px,1.6vw,28px)}.dawn-cover-stream__work{border:0;background:none;padding:0;text-align:left;cursor:pointer;min-width:0}.dawn-cover-stream__work img,.dawn-cover-stream__fallback{display:block;width:100%;aspect-ratio:2/3;object-fit:cover;background:#e8dfce;border:1px solid var(--line)}.dawn-cover-stream__work strong{display:block;font-size:.72rem;font-weight:400;line-height:1.25;margin-top:.55rem}.dawn-cover-stream__work small{display:block;font-size:.62rem;color:var(--muted);margin-top:.25rem}.dawn-cover-stream__sentinel{height:2px}.to-top{display:inline-block;margin-top:20px;color:var(--muted);font-size:.68rem;letter-spacing:.14em;text-transform:uppercase}@media(max-width:900px){.stage{padding:0}.spread{display:block;min-height:100svh}.spread:after{display:none}.page{padding:28px 22px}.stars,.catalogue{grid-template-columns:1fr}.collection-head{display:block}#collection-stream{height:75svh}.dawn-cover-stream__rail{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>
</head>
<body>
<main class="stage">
<section class="spread" id="library-top">
<section class="page"><header class="brand"><div class="k">Westside Watch · Dawn Library</div><h1>DAWN<span>黎明書局</span></h1></header><nav class="utility"><button id="jump-morning">三晨星</button><button id="jump-catalogue">館藏</button><button id="jump-search">搜尋</button><button id="jump-lower">下頁</button></nav><section class="section" id="morning"><div class="section-title"><h2>Morning Stars</h2><span>三晨星</span></div><div class="stars" id="stars"></div></section><section class="section" id="catalogue"><div class="section-title"><h2>Catalogue</h2><span>館藏</span></div><div class="tools"><input id="search" type="search" placeholder="搜尋書名、作者、主題"><div class="count" id="count">—</div></div><div class="catalogue" id="works"></div></section></section>
<section class="page"><header class="reader-head"><div class="k">Dawn Reader</div><h2>READER<span>閱讀</span></h2></header><div class="selection"><h3 id="reader-title">尚未選書</h3><p id="reader-author">從書局選擇一本書。</p><div class="modes"><button data-mode="source">原文</button><button data-mode="zh-Hant">繁中</button><button data-mode="bilingual" aria-current="true">對照</button></div></div><article class="reader-body" id="reader-body"><div class="empty">左頁尋書。<br>右頁閱讀。</div></article></section>
</section>
<section class="spread lower" id="library-lower" aria-label="館藏"><section class="page collection-page"><header class="lower-head collection-head"><div><div class="k">Dawn Library</div><h2>COLLECTION<span>館藏</span></h2></div><div class="count" id="lower-count">203,448 Works</div></header><div id="collection-stream" aria-live="polite"></div><a class="to-top" href="#library-top">Back to Dawn ↑</a></section></section>
</main>
<script type="module">
import{createDawnCoverStream}from'./cover-stream.js';
const host=document.querySelector('#collection-stream');
createDawnCoverStream(host,{onSelect:preview=>window.dispatchEvent(new CustomEvent('dawn:collection-select',{detail:{preview}}))}).catch(()=>{host.innerHTML='<div class="dawn-cover-stream__rail"></div>'});
</script>
<script type="module">
import{resourceManifest,resourceWorks,resourceFeatured,resourceSearch,resourceCoverUrl,resourceWork}from'../../js/resource-fabric-client.mjs';
import{resolveReading}from'../../js/dawn-reading-resolver.mjs';
const $=s=>document.querySelector(s),safe=async(u,f)=>{try{const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw 0;return await r.json()}catch{return f}},esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));
let choose=async()=>{};
window.addEventListener('dawn:collection-select',async e=>{const preview=e.detail?.preview;if(!preview)return;try{const work=await resourceWork(preview.workId);if(work)await choose(work)}catch{}});
const [contract,morning,manifest]=await Promise.all([safe('../catalogue-ui/view-model.json',{}),safe('../surfaces/dawn-launch.json',{items:[]}),resourceManifest()]);
$('#lower-count').textContent=`${Number(manifest.workCount||203448).toLocaleString()} Works`;
const ids=(morning.items||[]).map(x=>x.workId).filter(Boolean),resolved=await resourceWorks(ids),stars=ids.map(id=>resolved.get(id)).filter(Boolean).slice(0,3),title=x=>x?.title||x?.name||x?.workId||'Untitled',author=x=>(x?.authors||[])[0]||x?.author||'';
let selected=null,mode=contract?.secondPage?.defaultMode||'bilingual',reading=null;
const cover=x=>{const u=resourceCoverUrl(x);return u?`<img class="cover" src="${esc(u)}" alt="" loading="lazy">`:'<span class="cover-fallback"></span>'};
function renderReader(){if(!selected)return;const body=$('#reader-body');if(!reading){body.innerHTML='<div class="empty"></div>';return}if(reading.kind==='text'){if(mode==='source'){body.innerHTML=`<div class="reader-text">${esc(reading.text)}</div>`;return}if(reading.translation&&mode==='zh-Hant'){body.innerHTML=`<div class="reader-text">${esc(reading.translation)}</div>`;return}if(reading.translation&&mode==='bilingual'){body.innerHTML=`<div class="reader-text">${esc(reading.text)}\n\n——\n\n${esc(reading.translation)}</div>`;return}body.innerHTML=`<div class="reader-text">${esc(reading.text)}</div>`;return}if(reading.sourcePage){body.innerHTML=`<a class="reader-link" href="${esc(reading.sourcePage)}" target="_blank" rel="noopener">前往閱讀 ↗</a>`;return}body.innerHTML='<div class="empty">暫無可閱讀版本。</div>'}
choose=async x=>{selected=x;reading=null;$('#reader-title').textContent=title(x);$('#reader-author').textContent=author(x)||'';renderReader();reading=await resolveReading(x);renderReader();$('#library-top .reader-head').scrollIntoView({behavior:'smooth',block:'start'})};
$('#stars').innerHTML=stars.map((x,i)=>`<button class="star" data-star="${i}">${cover(x)}<span><small>0${i+1}</small><strong>${esc(title(x))}</strong><em>${esc(author(x))}</em></span></button>`).join('');$('#stars').querySelectorAll('[data-star]').forEach(b=>b.onclick=()=>choose(stars[+b.dataset.star]));
let shown=await resourceFeatured();function render(list,total=manifest.workCount){$('#count').textContent=`${Number(total||0).toLocaleString()} WORKS`;$('#works').innerHTML=list.slice(0,24).map((x,i)=>`<button class="work" data-work="${i}">${cover(x)}<span><strong>${esc(title(x))}</strong><small>${esc(author(x))}</small></span></button>`).join('')||'<p>沒有符合的館藏。</p>';$('#works').querySelectorAll('[data-work]').forEach(b=>b.onclick=()=>choose(list[+b.dataset.work]))}render(shown);
let generation=0;$('#search').oninput=async e=>{const q=e.target.value.trim(),g=++generation;if(!q){shown=await resourceFeatured();if(g===generation)render(shown);return}const found=await resourceSearch(q);if(g===generation)render(found,found.length)};
$('#jump-morning').onclick=()=>$('#morning').scrollIntoView({behavior:'smooth'});$('#jump-catalogue').onclick=()=>$('#catalogue').scrollIntoView({behavior:'smooth'});$('#jump-search').onclick=()=>{$('#catalogue').scrollIntoView({behavior:'smooth'});setTimeout(()=>$('#search').focus(),250)};$('#jump-lower').onclick=()=>$('#library-lower').scrollIntoView({behavior:'smooth'});document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.removeAttribute('aria-current'));b.setAttribute('aria-current','true');renderReader()});
</script>
</body>
</html>
