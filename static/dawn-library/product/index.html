<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>黎明書局</title>
<style>
:root{--ink:#252525;--paper:#f4efe5;--ground:#e8dbb8;--gold:#8c6818;--muted:#756e62;--line:rgba(80,65,38,.18)}*{box-sizing:border-box}html,body{margin:0;background:var(--ground);color:var(--ink)}body{font-family:"Noto Serif TC","PingFang TC",serif}.stage{padding:10px}.spread{min-height:calc(100vh - 20px);display:grid;grid-template-columns:1fr 1fr;background:var(--paper);position:relative}.spread:after{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--line);pointer-events:none}.page{min-width:0;padding:clamp(26px,2.5vw,52px)}.k{font:500 .58rem/1.2 Arial,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}h1,h2,h3{font-weight:400}.brand,.reader-head,.lower-head{border-bottom:1px solid var(--ink);padding-bottom:16px}.brand h1,.reader-head h2,.lower-head h2{font-family:"Cormorant Garamond",serif;font-size:clamp(3.6rem,5vw,6.5rem);line-height:.76;margin:.18em 0}.brand h1 span,.reader-head h2 span,.lower-head h2 span{display:block;font-family:"Noto Serif TC";font-size:.16em;letter-spacing:.16em;margin-top:1em}.utility{display:flex;gap:1.25rem;padding:.75rem 0;border-bottom:1px solid var(--line)}button{font:inherit;color:inherit;border:0;background:none;padding:.2rem 0}.section{padding-top:clamp(22px,2vw,38px)}.section-title{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}.section-title h2{font-family:"Cormorant Garamond",serif;font-size:clamp(2.4rem,3.5vw,4.4rem);margin:0}.section-title span{font-size:.65rem;letter-spacing:.14em}.notice{padding:30px 0;color:var(--muted);line-height:1.8}.lower{margin-top:10px}.collection-page{grid-column:1/-1}.collection-head{display:flex;align-items:end;justify-content:space-between;gap:2rem}.count{font-family:"Cormorant Garamond";font-size:clamp(1.5rem,2vw,2.5rem)}.dawn-cover-stream__rail{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:clamp(14px,1.6vw,28px);margin-top:24px}.dawn-cover-stream__work{padding:0;text-align:left;min-width:0}.dawn-cover-stream__work img,.dawn-cover-stream__fallback{display:block;width:100%;aspect-ratio:2/3;object-fit:cover;background:#e8dfce;border:1px solid var(--line)}.dawn-cover-stream__work strong{display:block;font-size:.72rem;font-weight:400;line-height:1.25;margin-top:.55rem}.dawn-cover-stream__work small{display:block;font-size:.62rem;color:var(--muted);margin-top:.25rem}@media(max-width:900px){.stage{padding:0}.spread{display:block;min-height:100svh}.spread:after{display:none}.page{padding:28px 22px}.collection-head{display:block}.dawn-cover-stream__rail{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style></head><body><main class="stage">
<section class="spread" id="library-top"><section class="page"><header class="brand"><div class="k">Westside Watch · Dawn Library</div><h1>DAWN<span>黎明書局</span></h1></header><nav class="utility"><button type="button">三晨星</button><button type="button">館藏</button><button type="button">搜尋</button></nav><section class="section"><div class="section-title"><h2>Morning Stars</h2><span>三晨星</span></div><div class="notice">館藏正在恢復。頁面骨架先獨立載入，不等待整個資源層。</div></section></section>
<section class="page"><header class="reader-head"><div class="k">Dawn Reader</div><h2>READER<span>閱讀</span></h2></header><div class="notice">選書後在此閱讀。</div></section></section>
<section class="spread lower"><section class="page collection-page"><header class="lower-head collection-head"><div><div class="k">Dawn Library</div><h2>COLLECTION<span>館藏</span></h2></div><div class="count">203,448 Works</div></header><div class="dawn-cover-stream__rail" id="collection-rail"></div><div class="notice" id="collection-status">正在載入第一批館藏…</div></section></section></main>
<script>
(()=>{const rail=document.getElementById('collection-rail'),status=document.getElementById('collection-status'),esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));const timeout=(ms)=>new Promise((_,reject)=>setTimeout(()=>reject(new Error('timeout')),ms));async function boot(){try{const root=await Promise.race([fetch('../cover-preview/root.json',{cache:'force-cache'}).then(r=>{if(!r.ok)throw new Error('root');return r.json()}),timeout(5000)]);const first=root?.shards?.[0];if(!first)throw new Error('shard');const data=await Promise.race([fetch('../cover-preview/'+first.href,{cache:'force-cache'}).then(r=>{if(!r.ok)throw new Error('data');return r.json()}),timeout(5000)]);const rows=(data.items||[]).slice(0,36);rail.innerHTML=rows.map(x=>`<div class="dawn-cover-stream__work">${x.cover?.src?`<img src="${esc(x.cover.src)}" alt="" loading="lazy">`:'<span class="dawn-cover-stream__fallback"></span>'}<strong>${esc(x.title)}</strong><small>${esc((x.authors||[]).join(' · '))}</small></div>`).join('');status.textContent=rows.length?'第一批館藏已載入。':'第一批館藏暫無可顯示項目。'}catch(e){status.textContent='館藏資料暫時不可用；書局頁面本身已恢復。'}}boot();})();
</script></body></html>
