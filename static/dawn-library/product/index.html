<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>黎明書局</title><style>:root{--g:#CEBD74;--i:#252525;--p:#f4efe5;--m:#756e62;--l:rgba(80,65,38,.18)}*{box-sizing:border-box}html,body{margin:0;background:#e8dbb8;color:var(--i)}body{font-family:"Noto Serif TC","PingFang TC",serif;min-height:100vh}.stage{width:100%;padding:clamp(18px,2vw,34px)}.book{width:100%;min-height:calc(100vh - 68px);display:grid;grid-template-columns:1fr 1fr;background:var(--p);box-shadow:0 28px 90px rgba(58,43,20,.16);position:relative}.book:after{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:linear-gradient(180deg,transparent,var(--l) 5%,rgba(65,50,28,.3) 50%,var(--l) 95%,transparent);box-shadow:-8px 0 18px rgba(65,50,28,.05),8px 0 18px rgba(65,50,28,.05);pointer-events:none}.page{min-width:0;padding:clamp(28px,4vw,76px);min-height:calc(100vh - 68px)}.left{display:flex;flex-direction:column}.right{display:grid;grid-template-rows:auto auto 1fr}.k{font:500 .62rem/1.2 Arial,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#8c6818}.brand{border-bottom:1px solid var(--i);padding-bottom:clamp(22px,3vw,44px)}.brand h1{font-family:"Cormorant Garamond",serif;font-size:clamp(4.6rem,8vw,9.5rem);font-weight:400;line-height:.68;letter-spacing:-.045em;margin:.22em 0}.brand h1 span{display:block;font-family:"Noto Serif TC";font-size:.17em;letter-spacing:.2em;margin-top:1.25em}.brand p{max-width:34rem;color:var(--m);line-height:1.8}.tabs{display:flex;gap:1.5rem;padding:1rem 0;border-bottom:1px solid var(--l)}button,input{font:inherit;color:inherit}.tabs button,.modes button{border:0;background:none;padding:.35rem 0;border-bottom:1px solid transparent;cursor:pointer}.tabs button[aria-current=true],.tabs button:hover,.modes button[aria-current=true]{border-color:var(--g)}.discovery{padding-top:clamp(28px,3vw,50px)}.section-title{display:flex;align-items:baseline;gap:1rem;margin-bottom:1.5rem}.section-title h2{font-family:"Cormorant Garamond",serif;font-size:clamp(2.8rem,4.6vw,5.5rem);font-weight:400;line-height:.8;margin:0}.section-title span{font-size:.75rem;letter-spacing:.15em}.stars{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--l);border-left:1px solid var(--l)}.star{min-height:clamp(180px,20vw,320px);padding:1rem;border:0;border-right:1px solid var(--l);border-bottom:1px solid var(--l);background:none;text-align:left;display:flex;flex-direction:column;cursor:pointer}.star small{font:500 .56rem/1 Arial;letter-spacing:.14em;color:#8c6818}.star strong{font-family:"Cormorant Garamond","Noto Serif TC";font-size:clamp(1.4rem,2.1vw,2.8rem);font-weight:400;line-height:1;margin:auto 0}.star em{font-style:normal;font-size:.8rem;color:var(--m)}.tools{display:grid;grid-template-columns:1fr auto;gap:1rem;align-items:end}.tools input{width:100%;border:0;border-bottom:1px solid var(--i);background:none;padding:.75rem 0;outline:0}.count{font-family:"Cormorant Garamond";font-size:1.35rem}.catalogue{display:grid;grid-template-columns:repeat(2,1fr);margin-top:1.5rem;border-left:1px solid var(--l);border-top:1px solid var(--l);max-height:45vh;overflow:auto}.work{min-height:105px;padding:1rem;border:0;border-right:1px solid var(--l);border-bottom:1px solid var(--l);background:none;text-align:left;cursor:pointer}.work strong{display:block;font-weight:400;line-height:1.35}.work small{display:block;margin-top:.8rem;color:var(--m)}.reader-head{border-bottom:1px solid var(--i);padding-bottom:clamp(22px,3vw,44px)}.reader-head h2{font-family:"Cormorant Garamond",serif;font-size:clamp(3.4rem,5.6vw,7rem);font-weight:400;line-height:.78;margin:.2em 0}.reader-head h2 span{display:block;font-family:"Noto Serif TC";font-size:.16em;letter-spacing:.18em;margin-top:1.1em}.selection{padding:1.4rem 0;border-bottom:1px solid var(--l)}.selection h3{font-family:"Cormorant Garamond","Noto Serif TC";font-size:clamp(1.8rem,2.8vw,3.4rem);font-weight:400;margin:.15em 0}.selection p{color:var(--m);margin:.4rem 0}.modes{display:flex;gap:1.1rem;margin-top:1rem}.reader-body{padding:clamp(30px,4vw,70px) 0;max-width:46rem}.reader-body .empty{font-family:"Cormorant Garamond","Noto Serif TC";font-size:clamp(2rem,3.6vw,4.5rem);font-weight:400;line-height:1.12}.reader-body p{font-size:clamp(1rem,1.2vw,1.25rem);line-height:2;color:var(--m)}[hidden]{display:none!important}@media(max-width:900px){.stage{padding:0}.book{display:block}.book:after{display:none}.page{min-height:100svh;padding:28px 22px}.left{border-bottom:1px solid var(--i)}.stars{grid-template-columns:1fr}.star{min-height:150px}.catalogue{grid-template-columns:1fr;max-height:none}}</style></head><body><main class="stage"><div class="book"><section class="page left" aria-label="發現與索引"><header class="brand"><div class="k">Westside Watch · Dawn Library</div><h1>DAWN<span>黎明書局</span></h1><p>書與出版物在這裡被發現、搜尋與選擇。左頁是索引；右頁始終保留給閱讀。</p></header><nav class="tabs"><button data-view="morning" aria-current="true">三晨星</button><button data-view="catalogue">館藏</button><button data-view="search">搜尋</button></nav><div class="discovery" id="morning"><div class="section-title"><h2>Morning Stars</h2><span>三晨星</span></div><div class="stars" id="stars"></div></div><div class="discovery" id="catalogue" hidden><div class="section-title"><h2>Catalogue</h2><span>館藏</span></div><div class="tools"><input id="search" type="search" placeholder="搜尋書名、作者、主題"><div class="count" id="count">—</div></div><div class="catalogue" id="works"></div></div></section><section class="page right" aria-label="閱讀器"><header class="reader-head"><div class="k">Dawn Reader · On Demand</div><h2>READER<span>閱讀</span></h2></header><div class="selection"><div class="k">Selected Work</div><h3 id="reader-title">尚未選書</h3><p id="reader-author">從左頁的三晨星、館藏或搜尋選擇一本書。</p><div class="modes"><button data-mode="source">原文</button><button data-mode="zh-Hant">繁中</button><button data-mode="bilingual" aria-current="true">對照</button></div></div><article class="reader-body"><div class="empty" id="reader-copy">左頁尋書。<br>右頁閱讀。</div></article></section></div></main><script type="module">import{resourceManifest,resourceWorks,resourceFeatured,resourceSearch}from'../../js/resource-fabric-client.mjs';const $=s=>document.querySelector(s),safe=async(u,f)=>{try{const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw 0;return await r.json()}catch{return f}};const [contract,morning,manifest]=await Promise.all([safe('../catalogue-ui/view-model.json',{}),safe('../surfaces/dawn-launch.json',{items:[]}),resourceManifest()]);const ids=(morning.items||[]).map(x=>x.workId).filter(Boolean),resolved=await resourceWorks(ids),stars=ids.map(id=>resolved.get(id)).filter(Boolean).slice(0,3),title=x=>x?.title||x?.titleZh||x?.title_zh||x?.name||x?.workId||'Untitled',author=x=>(x?.authors||[])[0]||x?.authorZh||x?.author||x?.creator||'';let selected=null,mode=contract?.rightPage?.defaultMode||'bilingual';function choose(x){selected=x;$('#reader-title').textContent=title(x);$('#reader-author').textContent=author(x)||'作者未標記';$('#reader-copy').textContent=`${mode==='source'?'原文':mode==='zh-Hant'?'繁中':'對照'}模式 · 內容按需載入。`;}$('#stars').innerHTML=stars.map((x,i)=>`<button class="star" data-star="${i}"><small>0${i+1}</small><strong>${title(x)}</strong><em>${author(x)}</em></button>`).join('')||'<p>三晨星正在同步 canonical 館藏。</p>';$('#stars').querySelectorAll('[data-star]').forEach(b=>b.onclick=()=>choose(stars[+b.dataset.star]));let shown=await resourceFeatured();function render(list,total=manifest.workCount){$('#count').textContent=`${Number(total||0).toLocaleString()} WORKS`;$('#works').innerHTML=list.slice(0,80).map((x,i)=>`<button class="work" data-work="${i}"><strong>${title(x)}</strong><small>${author(x)}</small></button>`).join('')||'<p>輸入關鍵字搜尋 canonical 館藏。</p>';$('#works').querySelectorAll('[data-work]').forEach(b=>b.onclick=()=>choose(list[+b.dataset.work]))}render(shown);let generation=0;$('#search').oninput=async e=>{const q=e.target.value.trim(),g=++generation;if(!q){shown=await resourceFeatured();if(g===generation)render(shown);return}const found=await resourceSearch(q);if(g===generation)render(found,found.length)};document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-view]').forEach(x=>x.removeAttribute('aria-current'));b.setAttribute('aria-current','true');const wantsSearch=b.dataset.view==='search';$('#morning').hidden=b.dataset.view!=='morning';$('#catalogue').hidden=b.dataset.view==='morning';if(wantsSearch)setTimeout(()=>$('#search').focus(),0)});document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.removeAttribute('aria-current'));b.setAttribute('aria-current','true');if(selected)choose(selected)});document.documentElement.dataset.dawnLibraryProduct='two-page-resource-fabric-v1';document.documentElement.dataset.contractSchema=contract.schema||'unavailable';</script></body></html>
