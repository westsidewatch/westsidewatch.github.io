<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>黎明書局</title>
<style>
:root{--gold:#CEBD74;--ink:#252525;--paper:#f4efe5;--muted:#756e62;--line:rgba(206,189,116,.42)}*{box-sizing:border-box}html,body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Serif TC",serif}body{min-height:100vh}.shell{width:min(1540px,97vw);margin:auto;padding:1.4rem 0 5rem}.toolbar{display:flex;gap:.8rem;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:9;padding:.8rem 0 1rem;background:linear-gradient(var(--paper) 76%,transparent)}.search{flex:1;max-width:520px;border:1px solid var(--line);background:rgba(255,255,255,.5);padding:.8rem 1rem;font:inherit;color:var(--ink);outline:none}.count{font-family:"Cormorant Garamond",serif;letter-spacing:.08em;color:#8c6818}.shelf{margin:2.2rem 0 3.4rem}.shelf h2{font-weight:500;font-size:clamp(1.2rem,2vw,1.8rem);margin:0 0 1.2rem;padding-bottom:.65rem;border-bottom:1px solid var(--line)}.rail{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:1.1rem}.book{min-width:0;cursor:pointer}.cover-wrap{aspect-ratio:5/8;position:relative;overflow:hidden;background:#ded7c7;border:1px solid rgba(37,37,37,.08);box-shadow:0 12px 28px rgba(37,37,37,.08)}.cover-wrap img{width:100%;height:100%;display:block;object-fit:cover}.fallback{position:absolute;inset:0;display:grid;align-content:space-between;padding:1rem;background:linear-gradient(145deg,#d8cc99,#efe6ca 42%,#c9b568);color:#2e2a21}.fallback small{font-family:"Cormorant Garamond",serif;letter-spacing:.12em;text-transform:uppercase}.fallback strong{font-weight:500;line-height:1.35;font-size:1rem}.book h3{font-size:.95rem;line-height:1.4;font-weight:500;margin:.7rem 0 .2rem}.book p{font-size:.8rem;line-height:1.35;color:var(--muted);margin:0}.badge{position:absolute;right:.45rem;bottom:.45rem;background:rgba(37,37,37,.82);color:#f6f1e6;font:600 .62rem/1 sans-serif;padding:.35rem .42rem;letter-spacing:.05em}.living-map{display:flex;gap:.45rem;flex-wrap:wrap;margin:-.45rem 0 1.1rem}.living-map button{border:0;border-bottom:1px solid transparent;background:transparent;color:var(--muted);font:inherit;font-size:.78rem;padding:.35rem .15rem;cursor:pointer}.living-map button:hover,.living-map button[aria-pressed="true"]{color:var(--ink);border-color:var(--gold)}.living-shelf{overflow:hidden;position:relative;isolation:isolate}.living-shelf:before{content:"";position:absolute;inset:6rem 0 0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 118px,rgba(206,189,116,.12) 119px,transparent 120px);z-index:-1}.living-rail{display:grid;grid-template-columns:repeat(14,minmax(92px,1fr));grid-auto-flow:dense;grid-auto-rows:122px;gap:14px 12px;align-items:start;padding:1rem 2vw 2rem;perspective:1400px}.living-rail .book{grid-column:span 2;grid-row:span 2;transform:translate3d(var(--drift,0),0,0);transition:transform .7s cubic-bezier(.2,.75,.2,1),filter .7s,opacity .7s}.living-rail .book[data-span="2"]{grid-column:span 4}.living-rail .book[data-classification="bible"]{--drift:-20px}.living-rail .book[data-classification="exegesis"]{--drift:12px}.living-rail .book[data-classification="theology"]{--drift:-8px}.living-rail .book[data-classification="biblical-world"]{--drift:22px}.living-rail .book[data-classification="church-history"]{--drift:-15px}.living-rail .book[data-classification="christian-life"]{--drift:8px}.living-rail .book[data-classification="ministry"]{--drift:18px}.living-rail .book[data-class-focus="match"]{opacity:1;filter:none;transform:translate3d(var(--drift),-7px,28px) scale(1.025);z-index:3}.living-rail .book[data-class-focus="context"]{opacity:.24;filter:grayscale(.55)}.living-rail .cover-wrap{aspect-ratio:8/5;height:122px}.living-rail .book h3{font-size:.78rem;margin:.42rem 0 .1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.living-rail .book p{font-size:.68rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.living-rail .book:hover{transform:translate3d(var(--drift),-8px,24px);z-index:3}.living-rail .book{view-timeline-name:--dawn-card;view-timeline-axis:block;animation:dawn-card-arrive linear both;animation-timeline:--dawn-card;animation-range:entry 0% entry 70%}.living-rail .book[data-in-view="false"][data-seen="true"]{content-visibility:auto}.living-rail .book[data-in-view="true"]{will-change:transform,opacity}@keyframes dawn-card-arrive{from{opacity:.18;transform:translate3d(var(--drift),18px,0) scale(.975)}to{opacity:1;transform:translate3d(var(--drift),0,0) scale(1)}}@supports not (animation-timeline:view()){.living-rail .book[data-in-view="false"]:not([data-seen="true"]){opacity:.18;transform:translate3d(var(--drift),14px,0) scale(.98)}.living-rail .book[data-in-view="true"]{opacity:1}}
.work-focus{position:fixed;inset:0;z-index:30;overflow:auto;background:rgba(244,239,229,.97);backdrop-filter:blur(18px);padding:clamp(1.2rem,4vw,4rem);opacity:0;transform:translateY(12px);transition:.45s cubic-bezier(.2,.75,.2,1)}.work-focus[data-open="true"]{opacity:1;transform:none}.focus-close{border:0;background:transparent;color:var(--ink);font:inherit;padding:.4rem 0;border-bottom:1px solid var(--gold);cursor:pointer}.focus-hero{display:grid;grid-template-columns:minmax(190px,28vw) 1fr;gap:clamp(2rem,7vw,8rem);align-items:center;max-width:1180px;margin:8vh auto}.focus-cover{aspect-ratio:5/8;display:grid;place-items:center;background:linear-gradient(145deg,#d8cc99,#efe6ca 42%,#c9b568);font-family:"Cormorant Garamond",serif;letter-spacing:.2em;box-shadow:0 30px 70px rgba(37,37,37,.13)}.focus-cover img{width:100%;height:100%;object-fit:cover}.focus-eyebrow{color:#8c6818;letter-spacing:.16em;font-size:.76rem}.focus-hero h2{font-weight:400;font-size:clamp(2rem,5vw,5.8rem);line-height:1.03;margin:.4rem 0 1.2rem}.focus-meta{color:var(--muted)}.focus-links{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:2rem}.focus-links button,.focus-links a{border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-size:.8rem;padding:.55rem .8rem;text-decoration:none;cursor:pointer}.focus-related{max-width:1180px;margin:0 auto 8vh;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:1rem}.focus-related h3{grid-column:1/-1;font-weight:400;border-bottom:1px solid var(--line);padding-bottom:.6rem}.focus-related .book{grid-column:span 1}.focus-related .book h3{font-size:.72rem}.focus-related .book p{font-size:.65rem}
@media(max-width:900px){.living-rail{grid-template-columns:repeat(8,minmax(74px,1fr));grid-auto-rows:105px}.living-rail .cover-wrap{height:105px}.focus-related{grid-template-columns:repeat(4,1fr)}}@media(max-width:680px){.shell{width:94vw}.toolbar{align-items:stretch;flex-direction:column}.rail:not(.living-rail){grid-template-columns:repeat(2,minmax(0,1fr));gap:.9rem}.living-rail{grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:92px;gap:12px 8px}.living-rail .book{grid-column:span 1}.living-rail .book[data-span="2"]{grid-column:span 2}.living-rail .cover-wrap{height:92px}.living-rail .book h3,.living-rail .book p{display:none}.focus-hero{grid-template-columns:1fr;margin:4vh auto}.focus-cover{width:min(62vw,260px)}.focus-related{grid-template-columns:repeat(2,1fr)}}@media(prefers-reduced-motion:reduce){.living-rail .book,.work-focus{transition:none!important;transform:none!important;animation:none!important}.living-rail .book{opacity:1!important}}
</style></head><body data-dawn-product><main class="shell"><div class="toolbar"><input class="search" type="search" placeholder="搜尋書名、作者…" aria-label="搜尋館藏" data-search><span class="count" data-count>載入中</span></div><div data-shelves></div></main><script type="module" src="./product.js"></script></body></html>
