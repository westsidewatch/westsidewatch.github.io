<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>黎明書局</title>
<style>
:root{--ink:#252525;--paper:#f4efe5;--ground:#e8dbb8;--gold:#8c6818;--muted:#756e62;--line:rgba(80,65,38,.18)}*{box-sizing:border-box}html,body{margin:0;background:var(--ground);color:var(--ink);scroll-behavior:smooth}body{font-family:"Noto Serif TC","PingFang TC",serif}.stage{padding:10px}.spread{min-height:680px;display:grid;grid-template-columns:1fr 1fr;background:var(--paper);position:relative}.spread:after{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--line);pointer-events:none}.page{min-width:0;padding:clamp(26px,2.5vw,52px)}.k{font:500 .58rem/1.2 Arial,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}h1,h2,h3{font-weight:400}.brand,.reader-head,.lower-head{border-bottom:1px solid var(--ink);padding-bottom:16px}.brand h1,.reader-head h2,.lower-head h2{font-family:"Cormorant Garamond",serif;font-size:clamp(3.6rem,5vw,6.5rem);line-height:.76;margin:.18em 0}.brand h1 span,.reader-head h2 span,.lower-head h2 span{display:block;font-family:"Noto Serif TC";font-size:.16em;letter-spacing:.16em;margin-top:1em}.selection p{font-size:.76rem;color:var(--muted)}.utility,.modes{display:flex;gap:1.25rem;padding:.75rem 0;border-bottom:1px solid var(--line)}button,input{font:inherit;color:inherit}.utility button,.modes button{border:0;background:none;padding:.2rem 0;cursor:pointer}.section{padding-top:clamp(22px,2vw,38px)}.section-title{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}.section-title h2{font-family:"Cormorant Garamond",serif;font-size:clamp(2.4rem,3.5vw,4.4rem);margin:0}.section-title span{font-size:.65rem;letter-spacing:.14em}.stars,.catalogue{display:grid;grid-template-columns:repeat(2,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line)}.stars{grid-template-columns:repeat(3,1fr)}.star,.work{border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer;padding:12px;display:grid;grid-template-columns:auto 1fr;gap:10px}.star{min-height:150px}.work{min-height:108px}.cover,.cover-fallback{width:54px;height:80px;object-fit:cover;background:#e8dfce;border:1px solid var(--line)}.star strong,.work strong{display:block;font-weight:400;line-height:1.15}.star em,.work small{font-style:normal;font-size:.66rem;color:var(--muted)}.tools{display:grid;grid-template-columns:1fr auto;gap:1rem;align-items:end;margin-bottom:14px}.tools input{border:0;border-bottom:1px solid var(--ink);background:none;padding:.65rem 0;outline:0}.count{font-family:"Cormorant Garamond";font-size:1.15rem}.selection{padding:18px 0;border-bottom:1px solid var(--line)}.selection h3{font-family:"Cormorant Garamond","Noto Serif TC";font-size:clamp(1.6rem,2.2vw,3rem);margin:.15em 0}.reader-body{padding:clamp(28px,3vw,58px) 0;max-width:44rem}.reader-body .empty{font-family:"Cormorant Garamond","Noto Serif TC";font-size:clamp(2rem,3vw,4rem);line-height:1.1}.reader-text{white-space:pre-wrap;line-height:1.9}.reader-link{color:inherit;text-underline-offset:.2em}.lower{margin-top:10px}.collection-page{grid-column:1/-1}.collection-head{display:flex;align-items:end;justify-content:space-between;gap:2rem}.collection-head .count{font-size:clamp(1.5rem,2vw,2.5rem)}#collection-stream{min-height:520px;margin-top:24px}.dawn-cover-stream__rail{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:clamp(14px,1.6vw,28px)}.dawn-cover-stream__work{border:0;background:none;padding:0;text-align:left;cursor:pointer;min-width:0}.dawn-cover-stream__work img,.dawn-cover-stream__fallback{display:block;width:100%;aspect-ratio:2/3;object-fit:cover;background:#e8dfce;border:1px solid var(--line)}.dawn-cover-stream__work strong{display:block;font-size:.72rem;font-weight:400;line-height:1.25;margin-top:.55rem}.dawn-cover-stream__work small{display:block;font-size:.62rem;color:var(--muted);margin-top:.25rem}.collection-sentinel{height:2px}.to-top{display:inline-block;margin-top:20px;color:var(--muted);font-size:.68rem;letter-spacing:.14em;text-transform:uppercase}@media(max-width:900px){.stage{padding:0}.spread{display:block;min-height:0}.spread:after{display:none}.page{padding:28px 22px}.stars,.catalogue{grid-template-columns:1fr}.collection-head{display:block}.dawn-cover-stream__rail{grid-template-columns:repeat(3,minmax(0,1fr))}}

.spread.lower{min-height:0}.spread.lower:after{display:none}.stage{max-width:1680px;margin:auto}.stars{grid-template-columns:1fr}.star{min-height:100px}.star,.work{min-width:0}.star strong,.work strong{overflow-wrap:anywhere}.cover-fallback{display:grid;place-items:center;padding:4px;font-size:.6rem;color:var(--muted)}.dawn-cover-stream__fallback{display:grid;place-items:center;font-size:.72rem;color:var(--muted)}[role=status]{font-size:.78rem;color:var(--muted);line-height:1.6}#collection-more{display:block;margin:24px auto;padding:12px 24px;border:1px solid var(--line);background:transparent;cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:4px}button:disabled{opacity:.5;cursor:default}.modes [aria-pressed=true]{border-bottom:2px solid var(--gold)}.reader-note{color:var(--muted);line-height:1.8}.reader-columns{display:grid;grid-template-columns:1fr 1fr;gap:24px}.tools{grid-template-columns:minmax(0,1fr) auto}.tools input{min-width:0;width:100%}@media(max-width:600px){.catalogue,.reader-columns{grid-template-columns:1fr}.dawn-cover-stream__rail{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(prefers-reduced-motion:reduce){html,body{scroll-behavior:auto}}
</style></head><body><main class="stage">
<section class="spread" id="library-top"><section class="page"><header class="brand"><div class="k">Westside Watch · Dawn Library</div><h1>DAWN<span>黎明書局</span></h1></header><nav class="utility"><button id="jump-morning">三晨星</button><button id="jump-reading">可閱讀</button><button id="jump-catalogue">館藏</button><button id="jump-search">搜尋</button><button id="jump-lower">下頁</button></nav><section class="section" id="morning"><div class="section-title"><h2>Morning Stars</h2><span>三晨星</span></div><div class="stars" id="stars"></div><p id="stars-status" role="status">正在載入三晨星…</p></section><section class="section" id="reading-entry"><div class="section-title"><h2>Read Now</h2><span>可直接閱讀</span></div><p class="reader-note">這些書保留在原館藏閱讀；黎明只保存書目與閱讀入口。</p><div class="reader-shelf" id="reader-ready"></div><p id="reader-ready-status" role="status">正在準備閱讀入口…</p></section><section class="section" id="catalogue"><div class="section-title"><h2>Catalogue</h2><span>館藏</span></div><div class="tools"><input id="search" type="search" placeholder="搜尋已索引書名或作者" aria-label="搜尋已索引書名或作者"><div class="count" id="count">—</div></div><p id="search-scope" class="reader-note"></p><div class="catalogue" id="works"></div><p id="catalogue-status" role="status">正在載入館藏…</p></section></section>
<section class="page" id="reader"><header class="reader-head"><div class="k">Dawn Reader</div><h2>READER<span>閱讀</span></h2></header><div class="selection"><h3 id="reader-title">尚未選書</h3><p id="reader-author">從書局選擇一本書。</p><div class="modes"><button data-mode="source">原文</button><button data-mode="zh-Hant">繁中</button><button data-mode="bilingual" aria-current="true">對照</button></div></div><article class="reader-body" id="reader-body" aria-live="polite"><div class="empty">左頁尋書。<br>右頁閱讀。</div></article></section></section>
<section class="spread lower" id="library-lower" aria-label="館藏"><section class="page collection-page"><header class="lower-head collection-head"><div><div class="k">Dawn Library</div><h2>COLLECTION<span>館藏</span></h2></div><div class="count" id="lower-count">載入館藏數量…</div></header><div id="collection-stream"><div class="dawn-cover-stream__rail" id="collection-rail"></div><p id="collection-status" role="status">正在載入封面…</p><button type="button" id="collection-more">載入更多館藏</button></div><a class="to-top" href="#library-top">Back to Dawn ↑</a></section></section></main>
<style>#library-top{display:block;min-height:0}#library-top>.page#reader{border-top:1px solid var(--ink);margin-top:20px}.chinese-works{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}.chinese-work{display:block;min-height:94px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:12px;text-decoration:none;color:inherit}.chinese-work strong,.chinese-work small,.chinese-work em{display:block}.chinese-work strong{font-weight:400}.chinese-work small,.chinese-work em{margin-top:5px;font-size:.67rem;color:var(--muted);font-style:normal}.chinese-work em{color:var(--gold)}.show-chinese{margin-top:14px;border:1px solid var(--line);background:transparent;padding:9px 12px;cursor:pointer}.reader-shelf{display:grid;grid-template-columns:1fr;border-top:1px solid var(--line);border-left:1px solid var(--line)}.reader-ready-card{border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:transparent;text-align:left;padding:14px;cursor:pointer}.reader-ready-card strong,.reader-ready-card small{display:block}.reader-ready-card small{margin-top:5px;color:var(--muted);font-size:.68rem}@media(max-width:600px){.chinese-works{grid-template-columns:1fr}}</style>
<style>.chinese-work{display:grid;grid-template-columns:48px minmax(0,1fr);gap:10px;align-items:start}.chinese-cover{width:48px;height:68px;object-fit:cover;background:#e8dfce;border:1px solid var(--line)}.chinese-cover--pending{display:grid;place-items:center;padding:4px;color:var(--muted);font-size:.55rem;line-height:1.2;text-align:center}</style>
<script type="module" src="./bookstore.mjs"></script>
<noscript>請啟用 JavaScript 以搜尋館藏與選書。</noscript></body></html>
