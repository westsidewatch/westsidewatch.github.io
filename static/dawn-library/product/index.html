<!doctype html>
<html lang="zh-Hant">
<head><link rel="stylesheet" href="/css/westside-design-os.css"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>黎明書局</title><link rel="stylesheet" href="/css/ui-scale-system.css">
<style>
:root{--ink:#252525;--paper:#f4ead2;--ground:#ead7a8;--gold:#8c6818;--muted:#756642;--line:rgba(140,104,24,.24)}*{box-sizing:border-box}html,body{margin:0;background:var(--ground);color:var(--ink);scroll-behavior:smooth}body{font-family:var(--ws-type-display-zh);font-size:var(--ui-body)}.stage{padding:clamp(10px,1vw,28px);max-width:var(--ui-wide);margin:auto}.spread{min-height:680px;display:grid;grid-template-columns:1fr 1fr;background:var(--paper);position:relative}.spread:after{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--line);pointer-events:none}.page{min-width:0;padding:var(--ui-gutter)}.k{font:500 var(--ui-caption)/1.2 Arial,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}h1,h2,h3{font-weight:400}.brand,.reader-head,.lower-head{border-bottom:1px solid var(--ink);padding-bottom:16px}.brand h1,.reader-head h2,.lower-head h2{font-family:"Bodoni Moda",serif;font-size:var(--ui-display);line-height:.76;margin:.18em 0}.brand h1 span,.reader-head h2 span,.lower-head h2 span{display:block;font-family:"Noto Serif TC";font-size:var(--ui-small);letter-spacing:.16em;margin-top:1em}.selection p{font-size:var(--ui-small);color:var(--muted)}.utility,.modes{display:flex;gap:var(--ui-gap);padding:.75rem 0;border-bottom:1px solid var(--line);font-size:var(--ui-small)}button,input{font:inherit;color:inherit}.utility button,.modes button{border:0;background:none;padding:.2rem 0;cursor:pointer}.section{padding-top:clamp(28px,2vw,54px)}.section-title{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}.section-title h2{font-family:"Bodoni Moda",serif;font-size:var(--ui-h2);margin:0}.section-title span{font-size:var(--ui-small);letter-spacing:.14em}.stars,.catalogue{display:grid;grid-template-columns:repeat(2,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line)}.stars{grid-template-columns:repeat(3,1fr)}.star,.work{border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer;padding:clamp(12px,1vw,22px);display:grid;grid-template-columns:auto 1fr;gap:clamp(10px,.8vw,18px)}.star{min-height:150px}.work{min-height:108px}.cover,.cover-fallback{width:clamp(54px,3vw,90px);aspect-ratio:2/3;height:auto;object-fit:cover;background:#e8dfce;border:1px solid var(--line)}.star strong,.work strong{display:block;font-weight:400;line-height:1.15;font-size:var(--ui-body)}.star em,.work small{font-style:normal;font-size:var(--ui-small);color:var(--muted)}.tools{display:grid;grid-template-columns:1fr auto;gap:1rem;align-items:end;margin-bottom:14px}.tools input{border:0;border-bottom:1px solid var(--ink);background:none;padding:.65rem 0;outline:0}.count{font-family:"Bodoni Moda";font-size:var(--ui-body-lg)}.selection{padding:18px 0;border-bottom:1px solid var(--line)}.selection h3{font-family:"Bodoni Moda","Noto Serif TC";font-size:var(--ui-h3);margin:.15em 0}.reader-body{padding:clamp(28px,3vw,70px) 0;max-width:var(--ui-reading)}.reader-body .empty{font-family:"Bodoni Moda","Noto Serif TC";font-size:var(--ui-h2);line-height:1.1}.reader-text{white-space:pre-wrap;line-height:1.9}.reader-link{color:inherit;text-underline-offset:.2em}.lower{margin-top:clamp(10px,1vw,24px)}.collection-page{grid-column:1/-1}.collection-head{display:flex;align-items:end;justify-content:space-between;gap:2rem}.collection-head .count{font-size:var(--ui-h3)}#collection-stream{min-height:520px;margin-top:24px}.dawn-cover-stream__rail{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(130px,7vw,210px),1fr));gap:var(--ui-gap)}.dawn-cover-stream__work{border:0;background:none;padding:0;text-align:left;cursor:pointer;min-width:0}.dawn-cover-stream__work img,.dawn-cover-stream__fallback{display:block;width:100%;aspect-ratio:2/3;object-fit:cover;background:#e8dfce;border:1px solid var(--line)}.dawn-cover-stream__work strong{display:block;font-size:var(--ui-small);font-weight:400;line-height:1.25;margin-top:.55rem}.dawn-cover-stream__work small{display:block;font-size:var(--ui-caption);color:var(--muted);margin-top:.25rem}.collection-sentinel{height:2px}.to-top{display:inline-block;margin-top:20px;color:var(--muted);font-size:var(--ui-small);letter-spacing:.14em;text-transform:uppercase}.spread.lower{min-height:0}.spread.lower:after{display:none}.stars{grid-template-columns:1fr}.star{min-height:100px}.star,.work{min-width:0}.star strong,.work strong{overflow-wrap:anywhere}.cover-fallback{display:grid;place-items:center;padding:4px;font-size:var(--ui-caption);color:var(--muted)}.dawn-cover-stream__fallback{display:grid;place-items:center;font-size:var(--ui-small);color:var(--muted)}[role=status]{font-size:var(--ui-small);color:var(--muted);line-height:1.6}#collection-more{display:block;margin:24px auto;padding:12px 24px;border:1px solid var(--line);background:transparent;cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:4px}button:disabled{opacity:.5;cursor:default}.modes [aria-pressed=true]{border-bottom:2px solid var(--gold)}.reader-note{color:var(--muted);line-height:1.8}.reader-columns{display:grid;grid-template-columns:1fr 1fr;gap:var(--ui-gap)}.tools{grid-template-columns:minmax(0,1fr) auto}.tools input{min-width:0;width:100%}
#library-top{display:block;min-height:0}#library-top>.page#reader{border-top:1px solid var(--ink);margin-top:20px}.chinese-works{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}.chinese-work{display:grid;grid-template-columns:clamp(72px,4vw,112px) minmax(0,1fr);gap:var(--ui-gap);align-items:start;min-height:126px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:clamp(12px,1vw,22px);text-decoration:none;color:inherit}.chinese-work strong,.chinese-work small,.chinese-work em{display:block}.chinese-work strong{font-weight:400;font-size:var(--ui-body)}.chinese-work small,.chinese-work em{margin-top:5px;font-size:var(--ui-small);color:var(--muted);font-style:normal}.chinese-work em{color:var(--gold)}.show-chinese{margin-top:14px;border:1px solid var(--line);background:transparent;padding:9px 12px;cursor:pointer}.reader-shelf{display:grid;grid-template-columns:1fr;border-top:1px solid var(--line);border-left:1px solid var(--line)}.reader-ready-card{border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:transparent;text-align:left;padding:14px;cursor:pointer}.reader-ready-card strong,.reader-ready-card small{display:block}.reader-ready-card small{margin-top:5px;color:var(--muted);font-size:var(--ui-small)}.chinese-cover{width:100%;aspect-ratio:72/104;height:auto;object-fit:cover;background:#e8dfce;border:1px solid var(--line);box-shadow:2px 4px 9px rgba(45,35,16,.16)}.chinese-cover--fallback{position:relative;isolation:isolate;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;gap:7px;padding:13px 9px;text-align:center;overflow:hidden;background:linear-gradient(160deg,rgba(5,16,10,.1),rgba(5,16,10,.58)),url('/one/cover-texture-antique-green.png') center/cover;color:#ddca79;border-color:#76612c;text-shadow:0 1px 2px rgba(0,0,0,.8)}.chinese-cover--fallback:after{position:absolute;z-index:-1;inset:3px;content:"";border:1px solid rgba(227,204,120,.72);box-shadow:inset 0 0 0 2px rgba(26,22,9,.25)}.chinese-cover--fallback i{font:500 var(--ui-caption)/1 Georgia,serif;letter-spacing:.12em;color:#ead58a;font-style:normal}.chinese-cover--fallback strong{font-family:"Noto Serif TC","Songti TC",serif;font-size:var(--ui-small)!important;line-height:1.25!important;font-weight:500!important;color:#f4e8b4!important}.chinese-cover--fallback small{margin:0!important;font-size:var(--ui-caption)!important;line-height:1.25!important;color:#e3d69f!important}
@media(min-width:2560px){.spread{min-height:820px}.stars{grid-template-columns:repeat(2,1fr)}.catalogue{grid-template-columns:repeat(2,1fr)}}
@media(min-width:3400px){.stage{max-width:var(--ui-wide)}.spread{min-height:900px}.stars{grid-template-columns:repeat(2,1fr)}.catalogue{grid-template-columns:repeat(3,1fr)}.chinese-works{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:900px){.stage{padding:0}.spread{display:block;min-height:0}.spread:after{display:none}.page{padding:28px 22px}.stars,.catalogue{grid-template-columns:1fr}.collection-head{display:block}.dawn-cover-stream__rail{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:600px){.catalogue,.reader-columns,.chinese-works{grid-template-columns:1fr}.dawn-cover-stream__rail{grid-template-columns:repeat(2,minmax(0,1fr))}.chinese-work{grid-template-columns:62px minmax(0,1fr)}}@media(prefers-reduced-motion:reduce){html,body{scroll-behavior:auto}}
</style></head><body data-ws-scope="dawn-library"><main class="stage">
<section class="spread" id="library-top"><section class="page"><header class="brand"><div class="k">Westside Watch · Dawn Library</div><h1>DAWN<span>黎明書局</span></h1></header><nav class="utility"><button id="jump-morning">三晨星</button><button id="jump-reading">可閱讀</button><button id="jump-catalogue">館藏</button><button id="jump-search">搜尋</button><button id="jump-lower">下頁</button></nav><section class="section" id="morning"><div class="section-title"><h2>Morning Stars</h2><span>三晨星</span></div><div class="stars" id="stars"></div><p id="stars-status" role="status">正在載入三晨星…</p></section><section class="section" id="reading-entry"><div class="section-title"><h2>Read Now</h2><span>可直接閱讀</span></div><p class="reader-note">這些書保留在原館藏閱讀；黎明只保存書目與閱讀入口。</p><div class="reader-shelf" id="reader-ready"></div><p id="reader-ready-status" role="status">正在準備閱讀入口…</p></section><section class="section" id="catalogue"><div class="section-title"><h2>Catalogue</h2><span>館藏</span></div><div class="tools"><input id="search" type="search" placeholder="搜尋已索引書名或作者" aria-label="搜尋已索引書名或作者"><div class="count" id="count">—</div></div><p id="search-scope" class="reader-note"></p><div class="catalogue" id="works"></div><p id="catalogue-status" role="status">正在載入館藏…</p></section></section>
<section class="page" id="reader"><header class="reader-head"><div class="k">Dawn Reader</div><h2>READER<span>閱讀</span></h2></header><div class="selection"><h3 id="reader-title">尚未選書</h3><p id="reader-author">從書局選擇一本書。</p><div class="modes"><button data-mode="source">原文</button><button data-mode="zh-Hant">繁中</button><button data-mode="bilingual" aria-current="true">對照</button></div></div><article class="reader-body" id="reader-body" aria-live="polite"><div class="empty">左頁尋書。<br>右頁閱讀。</div></article></section></section>
<section class="spread lower" id="library-lower" aria-label="館藏"><section class="page collection-page"><header class="lower-head collection-head"><div><div class="k">Dawn Library</div><h2>COLLECTION<span>館藏</span></h2></div><div class="count" id="lower-count">載入館藏數量…</div></header><div id="collection-stream"><div class="dawn-cover-stream__rail" id="collection-rail"></div><p id="collection-status" role="status">正在載入封面…</p><button type="button" id="collection-more">載入更多館藏</button></div><a class="to-top" href="#library-top">Back to Dawn ↑</a></section></section></main>
<script type="module" src="./bookstore.mjs"></script><noscript>請啟用 JavaScript 以搜尋館藏與選書。</noscript></body></html>
