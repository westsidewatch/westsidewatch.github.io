<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>黎明書局</title><style>:root{--g:#CEBD74;--i:#252525;--p:#f4efe5;--m:#756e62;--l:rgba(80,65,38,.18)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e8dbb8;color:var(--i)}body{font-family:"Noto Serif TC","PingFang TC",serif}.stage{width:100%;height:100%;padding:clamp(8px,.75vw,14px)}.book{width:100%;height:100%;display:grid;grid-template-columns:1fr 1fr;background:var(--p);box-shadow:0 22px 70px rgba(58,43,20,.14);position:relative;overflow:hidden}.book:after{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:linear-gradient(180deg,transparent,var(--l) 4%,rgba(65,50,28,.34) 50%,var(--l) 96%,transparent);box-shadow:-10px 0 24px rgba(65,50,28,.055),10px 0 24px rgba(65,50,28,.055);pointer-events:none}.page{min-width:0;height:100%;padding:clamp(28px,2.7vw,56px);overflow:hidden}.left,.right{display:grid;grid-template-rows:auto auto 1fr}.k{font:500 clamp(.52rem,.48vw,.66rem)/1.2 Arial,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#8c6818}.brand,.reader-head{border-bottom:1px solid var(--i);padding-bottom:clamp(16px,1.5vw,30px)}.brand h1{font-family:"Cormorant Garamond",serif;font-size:clamp(4.2rem,6.2vw,8rem);font-weight:400;line-height:.7;letter-spacing:-.045em;margin:.18em 0}.brand h1 span{display:block;font-family:"Noto Serif TC";font-size:.15em;letter-spacing:.2em;margin-top:1.15em}.brand p{max-width:31rem;margin:.9rem 0 0;color:var(--m);font-size:clamp(.7rem,.72vw,.9rem);line-height:1.65}.tabs{display:flex;gap:1.5rem;padding:.9rem 0;border-bottom:1px solid var(--l)}button,input{font:inherit;color:inherit}.tabs button,.modes button{border:0;background:none;padding:.25rem 0;border-bottom:1px solid transparent;cursor:pointer;font-size:clamp(.68rem,.72vw,.9rem)}.tabs button[aria-current=true],.tabs button:hover,.modes button[aria-current=true]{border-color:var(--g)}.discovery{padding-top:clamp(24px,2.25vw,46px);min-height:0;overflow:hidden}.section-title{display:flex;align-items:baseline;gap:.9rem;margin-bottom:clamp(18px,1.7vw,34px)}.section-title h2{font-family:"Cormorant Garamond",serif;font-size:clamp(3rem,4.2vw,5.4rem);font-weight:400;line-height:.8;margin:0}.section-title span{font-size:clamp(.6rem,.6vw,.76rem);letter-spacing:.15em}.stars{height:auto;display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--l);border-left:1px solid var(--l)}.star{height:clamp(190px,24vh,280px);padding:clamp(14px,1.15vw,22px);border:0;border-right:1px solid var(--l);border-bottom:1px solid var(--l);background:none;text-align:left;display:flex;flex-direction:column;cursor:pointer;transition:background .2s ease}.star:hover{background:rgba(206,189,116,.07)}.star small{font:500 .54rem/1 Arial;letter-spacing:.14em;color:#8c6818}.star strong{font-family:"Cormorant Garamond","Noto Serif TC";font-size:clamp(1.35rem,1.75vw,2.4rem);font-weight:400;line-height:1.04;margin:auto 0}.star em{font-style:normal;font-size:clamp(.62rem,.64vw,.8rem);color:var(--m)}.tools{display:grid;grid-template-columns:1fr auto;gap:1rem;align-items:end}.tools input{width:100%;border:0;border-bottom:1px solid var(--i);background:none;padding:.7rem 0;outline:0}.count{font-family:"Cormorant Garamond";font-size:1.25rem}.catalogue{height:calc(100% - 76px);display:grid;grid-template-columns:repeat(2,1fr);align-content:start;margin-top:1.2rem;border-left:1px solid var(--l);border-top:1px solid var(--l);overflow:auto}.work{min-height:98px;padding:.9rem;border:0;border-right:1px solid var(--l);border-bottom:1px solid var(--l);background:none;text-align:left;cursor:pointer}.work strong{display:block;font-size:clamp(.74rem,.78vw,.95rem);font-weight:400;line-height:1.35}.work small{display:block;margin-top:.65rem;font-size:.7rem;color:var(--m)}.reader-head h2{font-family:"Cormorant Garamond",serif;font-size:clamp(4rem,5.8vw,7.4rem);font-weight:400;line-height:.75;margin:.18em 0}.reader-head h2 span{display:block;font-family:"Noto Serif TC";font-size:.14em;letter-spacing:.18em;margin-top:1em}.selection{padding:clamp(18px,1.7vw,34px) 0;border-bottom:1px solid var(--l)}.selection h3{font-family:"Cormorant Garamond","Noto Serif TC";font-size:clamp(1.7rem,2.35vw,3.2rem);font-weight:400;line-height:1.05;margin:.18em 0}.selection p{font-size:clamp(.7rem,.74vw,.92rem);color:var(--m);margin:.45rem 0}.modes{display:flex;gap:1.1rem;margin-top:.9rem}.reader-body{min-height:0;padding:clamp(32px,3.2vw,64px) 0;overflow:auto;max-width:44rem}.reader-body .empty{font-family:"Cormorant Garamond","Noto Serif TC";font-size:clamp(2.4rem,3.4vw,4.6rem);font-weight:400;line-height:1.08}.reader-body p{font-size:clamp(.95rem,1.05vw,1.16rem);line-height:1.95;color:var(--m)}[hidden]{display:none!important}@media(max-width:900px){html,body{height:auto;overflow:auto}.stage{height:auto;padding:0}.book{height:auto;display:block;overflow:visible}.book:after{display:none}.page{height:auto;min-height:100svh;padding:28px 22px;overflow:visible}.left{display:flex;flex-direction:column;border-bottom:1px solid var(--i)}.right{display:grid}.stars{grid-template-columns:1fr}.star{height:auto;min-height:150px}.catalogue{height:auto;grid-template-columns:1fr;max-height:none}.reader-body{overflow:visible}}</style></head><body><main class="stage"><div class="book"><section class="page left" aria-label="發現與索引"><header class="brand"><div class="k">Westside Watch · Dawn Library</div><h1>DAWN<span>黎明書局</span></h1><p>書與出版物在這裡被發現、搜尋與選擇。左頁是索引；右頁始終保留給閱讀。</p></header><nav class="tabs"><button data-view="morning" aria-current="true">三晨星</button><button data-view="catalogue">館藏</button><button data-view="search">搜尋</button></nav><div class="discovery" id="morning"><div class="section-title"><h2>Morning Stars</h2><span>三晨星</span></div><div class="stars" id="stars"></div></div><div class="discovery" id="catalogue" hidden><div class="section-title"><h2>Catalogue</h2><span>館藏</span></div><div class="tools"><input id="search" type="search" placeholder="搜尋書名、作者、主題"><div class="count" id="count">—</div></div><div class="catalogue" id="works"></div></div></section><section class="page right" aria-label="閱讀器"><header class="reader-head"><div class="k">Dawn Reader · On Demand</div><h2>READER<span>閱讀</span></h2></header><div class="selection"><div class="k">Selected Work</div><h3 id="reader-title">尚未選書</h3><p id="reader-author">從左頁的三晨星、館藏或搜尋選擇一本書。</p><div class="modes"><button data-mode="source">原文</button><button data-mode="zh-Hant">繁中</button><button data-mode="bilingual" aria-current="true">對照</button></div></div><article class="reader-body"><div class="empty" id="reader-copy">左頁尋書。<br>右頁閱讀。</div></article></section></div></main><script type="module">import{resourceManifest,resourceWorks,resourceFeatured,resourceSearch}from'../../js/resource-fabric-client.mjs';const $=s=>document.querySelector(s),safe=async(u,f)=>{try{const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw 0;return await r.json()}catch{return f}};const [contract,morning,manifest]=await Promise.all([safe('../catalogue-ui/view-model.json',{}),safe('../surfaces/dawn-launch.json',{items:[]}),resourceManifest()]);const ids=(morning.items||[]).map(x=>x.workId).filter(Boolean),resolved=await resourceWorks(ids),stars=ids.map(id=>resolved.get(id)).filter(Boolean).slice(0,3),title=x=>x?.title||x?.titleZh||x?.title_zh||x?.name||x?.workId||'Untitled',author=x=>(x?.authors||[])[0]||x?.authorZh||x?.author||x?.creator||'';let selected=null,mode=contract?.rightPage?.defaultMode||'bilingual';function choose(x){selected=x;$('#reader-title').textContent=title(x);$('#reader-author').textContent=author(x)||'作者未標記';$('#reader-copy').textContent=`${mode==='source'?'原文':mode==='zh-Hant'?'繁中':'對照'}模式 · 內容按需載入。`;}$('#stars').innerHTML=stars.map((x,i)=>`<button class="star" data-star="${i}"><small>0${i+1}</small><strong>${title(x)}</strong><em>${author(x)}</em></button>`).join('')||'<p>三晨星正在同步 canonical 館藏。</p>';$('#stars').querySelectorAll('[data-star]').forEach(b=>b.onclick=()=>choose(stars[+b.dataset.star]));let shown=await resourceFeatured();function render(list,total=manifest.workCount){$('#count').textContent=`${Number(total||0).toLocaleString()} WORKS`;$('#works').innerHTML=list.slice(0,80).map((x,i)=>`<button class="work" data-work="${i}"><strong>${title(x)}</strong><small>${author(x)}</small></button>`).join('')||'<p>輸入關鍵字搜尋 canonical 館藏。</p>';$('#works').querySelectorAll('[data-work]').forEach(b=>b.onclick=()=>choose(list[+b.dataset.work]))}render(shown);let generation=0;$('#search').oninput=async e=>{const q=e.target.value.trim(),g=++generation;if(!q){shown=await resourceFeatured();if(g===generation)render(shown);return}const found=await resourceSearch(q);if(g===generation)render(found,found.length)};document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-view]').forEach(x=>x.removeAttribute('aria-current'));b.setAttribute('aria-current','true');const wantsSearch=b.dataset.view==='search';$('#morning').hidden=b.dataset.view!=='morning';$('#catalogue').hidden=b.dataset.view==='morning';if(wantsSearch)setTimeout(()=>$('#search').focus(),0)});document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.removeAttribute('aria-current'));b.setAttribute('aria-current','true');if(selected)choose(selected)});document.documentElement.dataset.dawnLibraryProduct='two-page-resource-fabric-v3';document.documentElement.dataset.contractSchema=contract.schema||'unavailable';</script></body></html>
