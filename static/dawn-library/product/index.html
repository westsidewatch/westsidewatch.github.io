<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>黎明書局</title><style>:root{--g:#CEBD74;--i:#252525;--p:#f4efe5;--m:#756e62;--l:rgba(206,189,116,.52)}*{box-sizing:border-box}html,body{margin:0;background:var(--p);color:var(--i)}body{font-family:"Noto Serif TC","PingFang TC",serif}.library{width:min(1540px,94vw);margin:auto;padding:4rem 0}.mast{display:grid;grid-template-columns:1.4fr .6fr;gap:5vw;align-items:end;padding:5rem 0 2rem;border-bottom:1px solid var(--i)}.k,.e{font:500 .64rem/1.2 Arial;letter-spacing:.18em;text-transform:uppercase;color:#8c6818}.mast h1{font-family:"Cormorant Garamond",serif;font-size:clamp(5rem,13vw,13rem);font-weight:400;line-height:.68;letter-spacing:-.045em;margin:.2em 0}.mast h1 span{display:block;font-family:"Noto Serif TC";font-size:.18em;letter-spacing:.2em;margin-top:1.15em}.mast p{max-width:30rem;line-height:1.9;color:var(--m)}.nav{display:flex;justify-content:flex-end;gap:1.6rem;padding:1rem 0;border-bottom:1px solid var(--l);position:sticky;top:0;background:rgba(244,239,229,.94);backdrop-filter:blur(16px);z-index:4}.nav button,.modes button{border:0;background:none;border-bottom:1px solid transparent;padding:.35rem 0;cursor:pointer}.nav button:hover,.nav button[aria-current=true]{border-color:var(--g)}.panel{padding:5rem 0;border-bottom:1px solid var(--i)}.head{display:flex;justify-content:space-between;gap:2rem;align-items:end;margin-bottom:2rem}.panel h2{font-family:"Cormorant Garamond",serif;font-size:clamp(3.2rem,7vw,7rem);font-weight:400;line-height:.8;margin:.15em 0}.panel h2 span{font-family:"Noto Serif TC";font-size:.2em;letter-spacing:.14em;margin-left:.7em}.stars{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--l);border-right:0}.star{min-height:360px;padding:1.4rem;border:0;border-right:1px solid var(--l);background:transparent;text-align:left;display:flex;flex-direction:column;cursor:pointer}.star small{font:500 .58rem/1 Arial;letter-spacing:.14em;color:#8c6818}.star strong{font-family:"Cormorant Garamond","Noto Serif TC";font-size:clamp(2rem,3.5vw,4.2rem);font-weight:400;line-height:.96;margin:auto 0}.star em{font-style:normal;color:var(--m)}.tools{display:grid;grid-template-columns:1fr auto;gap:1rem}.tools input{width:100%;border:0;border-bottom:1px solid var(--i);background:transparent;padding:.8rem 0;outline:none}.count{font-family:"Cormorant Garamond";font-size:1.6rem;align-self:end}.catalogue{display:grid;grid-template-columns:repeat(4,1fr);margin-top:2rem;border-left:1px solid var(--l);border-top:1px solid var(--l)}.work{min-height:140px;padding:1rem;border:0;border-right:1px solid var(--l);border-bottom:1px solid var(--l);background:transparent;text-align:left;cursor:pointer}.work strong{display:block;font-weight:400}.work small{display:block;margin-top:1.2rem;color:var(--m)}.reader{display:grid;grid-template-columns:minmax(220px,.35fr) 1fr;min-height:60vh}.side{border-right:1px solid var(--l);padding:2rem 2rem 2rem 0}.side h3{font-family:"Cormorant Garamond";font-size:2.2rem;font-weight:400}.modes{display:flex;gap:.8rem;margin-top:2rem}.body{padding:4rem;max-width:900px}.empty{font-family:"Cormorant Garamond";font-size:clamp(2rem,4vw,4.5rem);line-height:1.05}@media(max-width:800px){.mast{grid-template-columns:1fr}.nav{justify-content:flex-start}.stars,.catalogue{grid-template-columns:1fr}.reader{grid-template-columns:1fr}.side{border-right:0;border-bottom:1px solid var(--l)}.head{display:block}}</style></head><body><main class="library"><header class="mast"><div><div class="k">Westside Watch · Dawn Library</div><h1>DAWN<span>黎明書局</span></h1></div><p>書與出版物在這裡被發現、搜尋與閱讀。聖經、查經、影音與其他資源由各自的產品層呈現。</p></header><nav class="nav"><button data-go="morning-stars" aria-current="true">三晨星</button><button data-go="catalogue">館藏</button><button data-go="search">搜尋</button></nav><section class="panel" id="morning-stars"><div class="head"><div><div class="e">Three Morning Stars</div><h2>Morning Stars<span>三晨星</span></h2></div></div><div class="stars" id="stars"></div></section><section class="panel" id="catalogue"><div class="head"><div><div class="e">Canonical Catalogue</div><h2>Catalogue<span>館藏</span></h2></div></div><div class="tools"><input id="search" type="search" placeholder="搜尋書名、作者、主題"><div class="count" id="count">—</div></div><div class="catalogue" id="works"></div></section><section class="panel reader" id="reader"><aside class="side"><div class="e">Reader</div><h3 id="reader-title">閱讀器</h3><div id="reader-author"></div><div class="modes"><button data-mode="source">原文</button><button data-mode="zh-Hant">繁中</button><button data-mode="bilingual">對照</button></div></aside><article class="body"><div class="empty" id="reader-copy">從三晨星或館藏選擇一本書。</div></article></section></main><script type="module">import{resourceManifest,resourceWorks,resourceFeatured,resourceSearch}from'../../js/resource-fabric-client.mjs';const $=s=>document.querySelector(s),safe=async(u,f)=>{try{const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw 0;return await r.json()}catch{return f}};const [contract,morning,manifest]=await Promise.all([safe('../catalogue-ui/view-model.json',{}),safe('../surfaces/dawn-launch.json',{items:[]}),resourceManifest()]);const ids=(morning.items||[]).map(x=>x.workId).filter(Boolean),resolved=await resourceWorks(ids),stars=ids.map(id=>resolved.get(id)).filter(Boolean).slice(0,3),title=x=>x?.title||x?.titleZh||x?.title_zh||x?.name||x?.workId||'Untitled',author=x=>(x?.authors||[])[0]||x?.authorZh||x?.author||x?.creator||'';function choose(x){$('#reader-title').textContent=title(x);$('#reader-author').textContent=author(x);$('#reader-copy').textContent='內容按需載入。選擇原文、繁中或對照模式開始閱讀。';location.hash='reader'}$('#stars').innerHTML=stars.map((x,i)=>`<button class="star" data-star="${i}"><small>0${i+1}</small><strong>${title(x)}</strong><em>${author(x)}</em></button>`).join('')||'<p>三晨星正在同步 canonical 館藏。</p>';$('#stars').querySelectorAll('[data-star]').forEach(b=>b.onclick=()=>choose(stars[+b.dataset.star]));let shown=await resourceFeatured();function render(list,total=manifest.workCount){$('#count').textContent=`${Number(total||0).toLocaleString()} WORKS`;$('#works').innerHTML=list.slice(0,120).map((x,i)=>`<button class="work" data-work="${i}"><strong>${title(x)}</strong><small>${author(x)}</small></button>`).join('')||'<p>輸入關鍵字搜尋 canonical 館藏。</p>';$('#works').querySelectorAll('[data-work]').forEach(b=>b.onclick=()=>choose(list[+b.dataset.work]))}render(shown);let generation=0;$('#search').oninput=async e=>{const q=e.target.value.trim(),g=++generation;if(!q){shown=await resourceFeatured();if(g===generation)render(shown);return}const found=await resourceSearch(q);if(g===generation)render(found,found.length)};document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-go]').forEach(x=>x.removeAttribute('aria-current'));b.setAttribute('aria-current','true');document.getElementById(b.dataset.go==='search'?'catalogue':b.dataset.go)?.scrollIntoView({behavior:'smooth'})});document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>$('#reader-copy').textContent=`${b.textContent}模式：內容將按需提供。`);document.documentElement.dataset.dawnLibraryProduct='resource-fabric-v1';document.documentElement.dataset.contractSchema=contract.schema||'unavailable';</script></body></html>
