<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/css/ui-scale-system.css"><link rel="stylesheet" href="/css/typography-sitewide.css"><title>館藏</title><style>:root{--paper:#f4efe5;--ink:#252525;--line:rgba(80,65,38,.18)}*{box-sizing:border-box}html,body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Serif TC","PingFang TC",serif}.collection{min-height:100vh;padding:0}.dawn-cover-stream{height:100vh;overflow:auto;position:relative}.dawn-cover-stream__status{position:sticky;top:0;z-index:3;padding:10px 0;background:rgba(244,239,229,.94);font:500 .62rem/1.2 "Chiron Hei HK WS",sans-serif;letter-spacing:.12em;border-bottom:1px solid var(--line)}.dawn-cover-stream__rail{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:1px;background:var(--line)}.dawn-cover-stream__work{min-width:0;min-height:230px;border:0;background:var(--paper);padding:14px 10px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:10px}.dawn-cover-stream__work img,.dawn-cover-stream__fallback{display:block;width:100%;aspect-ratio:2/3;object-fit:cover;background:#e4dbc7}.dawn-cover-stream__work strong{display:block;font-size:var(--ws-size-meta,.8125rem);font-weight:400;line-height:1.25}.dawn-cover-stream__work small{display:block;margin-top:.3rem;font-size:var(--ws-size-meta,.8125rem);line-height:1.3;opacity:.62}.dawn-cover-stream__sentinel{height:1px}@media(max-width:700px){.dawn-cover-stream__rail{grid-template-columns:repeat(3,minmax(0,1fr))}.dawn-cover-stream__work{min-height:190px;padding:10px 7px}}@media(min-width:2560px){.dawn-cover-stream__status{font-size:var(--ui-small)}.collection{font-size:var(--ui-body)}} @media(min-width:2560px){.dawn-cover-stream__status{font-size:var(--ui-small)}.collection{font-size:var(--ui-body)}} </style></head><body><main id="collection" class="collection"></main><script type="module">import{createDawnCoverStream}from'./cover-stream.js';createDawnCoverStream(document.querySelector('#collection'),{onSelect:work=>parent.dispatchEvent(new CustomEvent('dawn:cover-select',{detail:{work}}))});</script></body></html>
