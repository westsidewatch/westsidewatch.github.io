<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Dawn Phase 4 Browser Acceptance</title></head>
<body>
<main id="result" data-status="RUNNING">PHASE4_BROWSER_RUNNING</main>
<script type="module">
import { buildCatalog, discoverCatalogWindow, updateDiscoveryContext, toggleCompareWork, compareSelection } from '../runtime/discovery.mjs';
import { serializeContext, restoreContext, focusContext } from '../runtime/relation-context.mjs';
import { resourceManifest, resourceWorks, resourceWork } from '/js/resource-fabric-client.mjs';

const out = document.querySelector('#result');
try {
  const [manifest, surface, fallback, authorityWork] = await Promise.all([
    resourceManifest(),
    fetch('../../surfaces/multiwrite-biblical-world.json').then(r => r.json()),
    fetch('../contexts/second-temple.v1.json').then(r => r.json()),
    resourceWork('OL10010026W')
  ]);
  if (manifest.identityAuthority !== 'Dawn' || manifest.canonicalMonolithRequired !== false || manifest.workCount < 10000) throw new Error('resource fabric authority');
  const surfaceIds = (surface.items || []).map(row => row.workId).filter(Boolean);
  const resolved = await resourceWorks(surfaceIds);
  const canonicalRows = surfaceIds.map(id => resolved.get(id)).filter(Boolean);
  if (authorityWork) canonicalRows.push(authorityWork);
  const canonicalIds = new Set(canonicalRows.map(row => row.workId));
  const catalog = buildCatalog({ canonical: canonicalRows, surface });
  if (catalog.length < 20 || !catalog.every(row => canonicalIds.has(row.workId))) throw new Error(`bounded catalog ${catalog.length}`);
  if (!catalog.some(row => row.workId.startsWith('dawn:')) || !catalog.some(row => !row.workId.startsWith('dawn:'))) throw new Error('mixed canonical ids');

  let context = structuredClone(fallback);
  const first = discoverCatalogWindow({ catalog, context, windowSize: 12 });
  if (first.items.length !== 12 || !first.nextCursor || first.total !== catalog.length) throw new Error('first window');
  context = updateDiscoveryContext(context, { cursor: first.nextCursor });
  const second = discoverCatalogWindow({ catalog, context, windowSize: 12 });
  if (second.offset !== 12 || !second.items.length || second.items.some(row => !canonicalIds.has(row.workId))) throw new Error('second window');

  const focusId = first.items[0].workId;
  context = focusContext(context, focusId);
  context = toggleCompareWork(context, focusId);
  context = toggleCompareWork(context, first.items[1].workId);
  const compared = compareSelection({ catalog, context });
  if (compared.length !== 2 || compared.some(row => !canonicalIds.has(row.workId))) throw new Error('compare');

  const restored = restoreContext(serializeContext(context));
  if (restored.focusedWork !== focusId || restored.facets.compareWorks.length !== 2) throw new Error('context restore');

  out.dataset.status = 'PASS';
  out.dataset.catalog = String(manifest.workCount);
  out.dataset.window = String(first.items.length);
  out.textContent = `PHASE4_BROWSER_PASS fabric=${manifest.workCount} active=${catalog.length} window=${first.items.length} offset=${second.offset}`;
} catch (error) {
  out.dataset.status = 'FAIL';
  out.textContent = `PHASE4_BROWSER_FAIL ${error?.message || error}`;
  document.title = 'FAIL — Dawn Phase 4 Browser Acceptance';
}
</script>
</body>
</html>
