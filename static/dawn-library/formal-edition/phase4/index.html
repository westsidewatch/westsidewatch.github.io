<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dawn Library — Phase 4 UI System</title>
  <link rel="stylesheet" href="./phase4.css">
</head>
<body>
  <main class="shell">
    <header class="masthead">
      <div><p class="eyebrow">Dawn Library · Formal Edition · Phase 4</p><h1>同一個 CollectionContext，從找書到比較</h1></div>
      <nav class="projection-nav" aria-label="Projection"><button data-kind="flow" aria-pressed="true">FLOW</button><button data-kind="shelf">SHELF</button><button data-kind="spectrum">SPECTRUM</button></nav>
    </header>
    <section class="discovery-bar" aria-label="Discovery controls">
      <label class="search-field"><span>Search / Fuzzy</span><input id="query" type="search" autocomplete="off" placeholder="書名、作者、關係或 canonical Work ID"></label>
      <label><span>Facet</span><select id="relation-facet"><option value="">全部關係</option></select></label>
      <label><span>Ordering</span><select id="ordering"><option value="relevance">Relevance</option><option value="title">Title</option><option value="author">Author</option></select></label>
      <label><span>Fuzzy distance</span><input id="distance" type="range" min="0" max="1" step="0.05" value="0.35"></label>
    </section>
    <section class="status-line" aria-live="polite">
      <span id="result-count"></span><span id="context-focus"></span>
      <span class="window-nav"><button id="window-prev" type="button">←</button><span id="window-range"></span><button id="window-next" type="button">→</button></span>
      <button id="compare-open" type="button" disabled>Compare <b id="compare-count">0</b></button>
    </section>
    <section id="surface" class="surface surface-flow" data-kind="flow" aria-label="Library projection"></section>
    <aside id="card" class="card" hidden><button id="card-close" class="icon-button" type="button" aria-label="Close card">×</button><p class="eyebrow">Library Card</p><h2 id="card-title"></h2><p id="card-author"></p><code id="card-id"></code><p id="card-relations"></p><div class="card-actions"><button id="card-compare" type="button">Add to compare</button><button id="card-spectrum" type="button">EXPAND → SPECTRUM</button></div></aside>
    <dialog id="compare-dialog"><form method="dialog" class="compare-head"><div><p class="eyebrow">Reading table</p><h2>Compare canonical Works</h2></div><button class="icon-button" aria-label="Close compare">×</button></form><div id="compare-grid" class="compare-grid"></div></dialog>
    <details class="context-debug"><summary>CollectionContext</summary><pre id="state-token"></pre></details>
  </main>
  <script type="module" src="./phase4.js"></script>
</body>
</html>
