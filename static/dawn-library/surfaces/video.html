<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dawn Video Surface</title>
  <style>
    html,body{margin:0;background:#111;color:#eee;font-family:system-ui,sans-serif}main{min-height:100vh;display:grid;grid-template-rows:1fr auto}.frame{position:relative;min-height:0}.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}.bar{display:flex;justify-content:space-between;gap:1rem;padding:.75rem 1rem;background:#191919}.bar a{color:#d8c98b;text-decoration:none}
  </style>
</head>
<body>
  <main data-dawn-video-surface data-viewer-state="booting" data-external-source="true">
    <div class="frame"><iframe data-video-frame allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>
    <div class="bar"><span data-video-label>External video</span><a data-source-link target="_blank" rel="noopener noreferrer">原网站 ↗</a></div>
  </main>
  <script src="/js/dawn-video-surface.js"></script>
</body>
</html>
