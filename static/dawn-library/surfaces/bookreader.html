<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dawn BookReader Surface</title>
  <style>
    :root{color-scheme:dark;background:#151513;color:#eee8d8;font-family:system-ui,sans-serif}html,body{margin:0;height:100%}body{display:grid;grid-template-rows:auto 1fr}header{display:flex;align-items:center;gap:1rem;padding:.65rem .8rem;background:#1d1d1a;border-bottom:1px solid #4b4636}header span{color:#cdbd82;font-size:.82rem}header a{margin-left:auto;color:#eee8d8}iframe{width:100%;height:100%;border:0;background:#24231f}
  </style>
</head>
<body data-dawn-bookreader-surface>
  <header><span data-bookreader-status>正在連接 Internet Archive BookReader…</span><a data-bookreader-source target="_blank" rel="noopener noreferrer">原始館藏 ↗</a></header>
  <iframe data-bookreader-frame title="Internet Archive BookReader" allow="fullscreen" loading="eager"></iframe>
  <script type="module" src="/js/dawn-bookreader-surface.js"></script>
</body>
</html>
