<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dawn Readability Surface</title>
  <style>
    body{margin:0;background:#f4f0e6;color:#252525;font-family:Georgia,serif}main{max-width:760px;margin:0 auto;padding:3rem 1.25rem}h1{font-size:2rem;line-height:1.2}p{font-size:1.05rem;line-height:1.7}.meta{font-size:.9rem;opacity:.7}.source{display:inline-block;margin-top:1.5rem;color:#7a6728}
  </style>
</head>
<body>
  <main data-dawn-readability-surface data-viewer-state="booting" data-external-source="true">
    <p class="meta" data-readability-byline></p>
    <h1 data-readability-title></h1>
    <p data-readability-excerpt></p>
    <a class="source" data-readability-source target="_blank" rel="noopener noreferrer">原网站 ↗</a>
  </main>
  <script src="/js/dawn-readability-surface.js"></script>
</body>
</html>
