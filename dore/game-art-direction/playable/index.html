<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>羊走迷 · G01</title>
<style>
:root{color-scheme:light;--paper:#eee8dc;--ink:#26231e;--line:#8d8372;--accent:#9b4b32;--sheep:#faf7ef}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Georgia,"Noto Serif TC",serif}.stage{min-height:100svh;display:grid;place-items:center;padding:28px}.game{width:min(92vw,680px)}.meta{display:flex;justify-content:space-between;align-items:end;margin-bottom:14px;font-size:12px;letter-spacing:.12em;text-transform:uppercase}.meta strong{font-size:18px;font-weight:500;letter-spacing:.04em}.board{position:relative;aspect-ratio:1;border:1px solid var(--ink);overflow:hidden;background:linear-gradient(135deg,rgba(255,255,255,.18),transparent 55%)}.piece{position:absolute;border:1px solid rgba(38,35,30,.7);background:rgba(141,131,114,.22);transition:left .2s ease,top .2s ease;display:grid;place-items:center;cursor:pointer;user-select:none}.piece::after{content:"";width:34%;height:1px;background:var(--ink);opacity:.45}.piece.selected{outline:2px solid var(--accent);outline-offset:-3px}.sheep{position:absolute;display:grid;place-items:center;transition:left .2s ease,top .2s ease;pointer-events:none}.sheep span{width:56%;height:42%;border:1px solid var(--ink);border-radius:50%;background:var(--sheep);position:relative}.sheep span:after{content:"";position:absolute;width:28%;height:35%;border:1px solid var(--ink);border-radius:50%;right:-18%;top:8%;background:var(--sheep)}.controls{display:grid;grid-template-columns:repeat(4,48px);gap:7px;justify-content:center;margin-top:16px}.controls button{height:44px;border:1px solid var(--ink);background:transparent;color:var(--ink);font:18px Georgia,serif;cursor:pointer}.controls button:active{background:var(--ink);color:var(--paper)}.note{text-align:center;margin-top:11px;font-size:12px;color:#665f54}.status{min-height:20px;text-align:center;margin-top:8px;font-size:13px}@media(max-width:500px){.stage{padding:16px}.meta{align-items:start;gap:10px}.meta span{text-align:right}.controls{grid-template-columns:repeat(4,44px)}}
</style>
<main class="stage"><section class="game" aria-label="羊走迷 G01 playable prototype"><div class="meta"><strong>羊走迷 · G01</strong><span>Sheep + World / before revelation</span></div><div id="board" class="board" aria-label="6 by 6 movable world"></div><div class="controls" aria-label="movement controls"><button data-dx="-1" data-dy="0" aria-label="left">←</button><button data-dx="0" data-dy="-1" aria-label="up">↑</button><button data-dx="0" data-dy="1" aria-label="down">↓</button><button data-dx="1" data-dy="0" aria-label="right">→</button></div><div class="note">點一個世界塊，再用方向鍵移動；未選世界塊時，方向鍵移動羊。</div><div id="status" class="status" aria-live="polite"></div></section></main>
<script>
const initial={cols:6,rows:6,sheep:{x:0,y:5},blocks:[{id:'a',x:0,y:0,w:2,h:2,axis:'x'},{id:'b',x:2,y:0,w:1,h:3,axis:'y'},{id:'c',x:3,y:0,w:3,h:1,axis:'x'},{id:'d',x:3,y:1,w:2,h:2,axis:'y'},{id:'e',x:1,y:3,w:3,h:1,axis:'x'},{id:'f',x:4,y:3,w:2,h:2,axis:'y'},{id:'g',x:1,y:4,w:1,h:2,axis:'y'},{id:'h',x:2,y:5,w:3,h:1,axis:'x'}]};
let state=structuredClone(initial),selected=null;const board=document.querySelector('#board'),status=document.querySelector('#status');
function occupied(x,y,except=null){return state.blocks.some(b=>b.id!==except&&x>=b.x&&x<b.x+b.w&&y>=b.y&&y<b.y+b.h)}
function legalBlock(b,dx,dy){if((b.axis==='x'&&dy)||(b.axis==='y'&&dx))return false;let nx=b.x+dx,ny=b.y+dy;if(nx<0||ny<0||nx+b.w>state.cols||ny+b.h>state.rows)return false;for(let y=ny;y<ny+b.h;y++)for(let x=nx;x<nx+b.w;x++)if(occupied(x,y,b.id)||(x===state.sheep.x&&y===state.sheep.y))return false;return true}
function move(dx,dy){if(selected){let b=state.blocks.find(x=>x.id===selected);if(!legalBlock(b,dx,dy)){status.textContent='世界沒有讓位。';return}b.x+=dx;b.y+=dy;status.textContent='世界重新構圖。';render();return}let nx=state.sheep.x+dx,ny=state.sheep.y+dy;if(nx<0||ny<0||nx>=state.cols||ny>=state.rows||occupied(nx,ny)){status.textContent='路被世界擋住。';return}state.sheep={x:nx,y:ny};status.textContent='羊向前一步。';render()}
function render(){board.replaceChildren();for(const b of state.blocks){let el=document.createElement('button');el.type='button';el.className='piece'+(selected===b.id?' selected':'');el.setAttribute('aria-label','world block '+b.id);el.style.left=(b.x/state.cols*100)+'%';el.style.top=(b.y/state.rows*100)+'%';el.style.width=(b.w/state.cols*100)+'%';el.style.height=(b.h/state.rows*100)+'%';el.addEventListener('click',()=>{selected=selected===b.id?null:b.id;status.textContent=selected?'世界塊已選取。':'羊重新取得控制。';render()});board.append(el)}let s=document.createElement('div');s.className='sheep';s.style.left=(state.sheep.x/state.cols*100)+'%';s.style.top=(state.sheep.y/state.rows*100)+'%';s.style.width=(100/state.cols)+'%';s.style.height=(100/state.rows)+'%';s.innerHTML='<span aria-hidden="true"></span>';board.append(s)}
document.querySelectorAll('.controls button').forEach(btn=>btn.addEventListener('click',()=>move(+btn.dataset.dx,+btn.dataset.dy)));document.addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key))return;e.preventDefault();move(e.key==='ArrowLeft'?-1:e.key==='ArrowRight'?1:0,e.key==='ArrowUp'?-1:e.key==='ArrowDown'?1:0)});render();
</script>
