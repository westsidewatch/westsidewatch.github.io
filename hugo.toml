baseURL = "https://westsidewatch.github.io/"
languageCode = "en-ca"
title = "Westside Watch"
copyright = "© Westside Watch"
disableKinds = ["taxonomy", "term"]

[params]
  description = "A watchful publication for the city."
  volume = "Vol.00"
  volumeTitle = "The Foundations of a Watchful City"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = false

[minify]
  minifyOutput = true

# Preserve the existing invitation page and its root-level assets in the
# generated Pages artifact while keeping their source files untouched.
[module]
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "join"
    target = "static/join"
  [[module.mounts]]
    source = "background.jpg"
    target = "static/background.jpg"
  [[module.mounts]]
    source = "wechat-qr.png"
    target = "static/wechat-qr.png"
