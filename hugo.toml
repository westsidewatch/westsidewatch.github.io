baseURL = "https://westsidewatch.github.io/"
locale = "en-CA"
title = "Westside Watch"
copyright = "© Westside Watch"
disableKinds = ["taxonomy", "term"]

[params]
  description = "A watchful publication for the city."
  volume = "Vol.00"
  volumeTitle = "守望，一座光明的城"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = false

[minify]
  minifyOutput = true

# Preserve the existing invitation page and its root-level assets in the
# generated Pages artifact while keeping their source files untouched.
[module]
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "join"
    target = "static/join"
  [[module.mounts]]
    source = "background.jpg"
    target = "static/api/dore/assets/site-file?code=SITE-BACKGROUND"
  [[module.mounts]]
    source = "wechat-qr.png"
    target = "static/api/dore/assets/site-file?code=SITE-WECHAT-QR"
