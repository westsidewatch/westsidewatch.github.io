name: Refresh Isaiah fixed assets
on:
  push:
    branches: [fix/isaiah-maps-illustrations]
permissions:
  contents: write
jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, 'refresh Isaiah fixed asset versions') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/isaiah-maps-illustrations
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('static/one/index.html');s=p.read_text()
          s=s.replace('isaiah-maps.js?v=20260816a','isaiah-maps.js?v=20260817a')
          s=s.replace('isaiah-illustrations.js?v=20260816f','isaiah-illustrations.js?v=20260817a')
          p.write_text(s)
          PY
      - run: |
          git config user.name 'WATCHMAN'
          git config user.email 'westsidewatchca@gmail.com'
          git add static/one/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix(one): refresh Isaiah fixed asset versions'
          git push origin HEAD:fix/isaiah-maps-illustrations
