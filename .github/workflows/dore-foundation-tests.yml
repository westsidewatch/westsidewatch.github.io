name: Doré Foundation Tests

on:
  push:
    paths:
      - 'dore_core/**'
      - 'tests/**'
      - 'scripts/ingest_pinned_corpora.py'
      - '.github/workflows/dore-foundation-tests.yml'
  pull_request:
    paths:
      - 'dore_core/**'
      - 'tests/**'
      - 'scripts/ingest_pinned_corpora.py'
      - '.github/workflows/dore-foundation-tests.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  original-language-reader:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Doré Foundation unit tests
        run: python -m unittest discover -s tests -v
      - name: Read real pinned biblical corpora
        run: python scripts/ingest_pinned_corpora.py
      - name: Upload Doré corpus reading report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dore-corpus-reading-report
          path: reports/DORÉ-CORPUS-READING-REPORT.json
          if-no-files-found: warn
          retention-days: 30
      - name: Persist Doré corpus reading report
        if: always() && github.event_name == 'push'
        run: |
          if [ ! -f reports/DORÉ-CORPUS-READING-REPORT.json ]; then
            echo 'No corpus report produced; nothing to persist.'
            exit 0
          fi
          git config user.name 'Doré CI'
          git config user.email 'westsidewatchca@gmail.com'
          git add reports/DORÉ-CORPUS-READING-REPORT.json
          if git diff --cached --quiet; then
            echo 'Corpus report unchanged.'
            exit 0
          fi
          git commit -m 'chore(dore): persist corpus reading report'
          git push
