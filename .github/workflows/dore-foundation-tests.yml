name: Doré Foundation Tests

on:
  push:
    paths:
      - 'dore_core/**'
      - 'tests/**'
      - 'scripts/ingest_pinned_corpora.py'
      - '.github/workflows/dore-foundation-tests.yml'
  pull_request:
    paths:
      - 'dore_core/**'
      - 'tests/**'
      - 'scripts/ingest_pinned_corpora.py'
      - '.github/workflows/dore-foundation-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-language-reader:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Doré Foundation unit tests
        run: python -m unittest discover -s tests -v
      - name: Read real pinned biblical corpora
        run: python scripts/ingest_pinned_corpora.py
