name: Doré Foundation Tests

on:
  push:
    paths:
      - 'dore_core/**'
      - 'tests/**'
      - 'scripts/ingest_pinned_corpora.py'
      - '.github/workflows/dore-foundation-tests.yml'
  pull_request:
    paths:
      - 'dore_core/**'
      - 'tests/**'
      - 'scripts/ingest_pinned_corpora.py'
      - '.github/workflows/dore-foundation-tests.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  original-language-reader:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Doré Foundation unit tests
        id: unit_tests
        continue-on-error: true
        run: python -m unittest discover -s tests -v
      - name: Read real pinned biblical corpora
        id: corpus_reading
        if: always()
        continue-on-error: true
        env:
          PYTHONPATH: .
        run: python scripts/ingest_pinned_corpora.py
      - name: Upload Doré corpus reading report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dore-corpus-reading-report
          path: reports/DORÉ-CORPUS-READING-REPORT.json
          if-no-files-found: warn
          retention-days: 30
      - name: Persist Doré corpus reading report
        if: always() && github.event_name == 'push'
        run: |
          if [ ! -f reports/DORÉ-CORPUS-READING-REPORT.json ]; then
            mkdir -p reports
            printf '{"status":"INFRA_FAIL","error":"corpus report was not produced","unit_tests":"%s","corpus_reading":"%s"}\n' "${{ steps.unit_tests.outcome }}" "${{ steps.corpus_reading.outcome }}" > reports/DORÉ-CORPUS-READING-REPORT.json
          fi
          git config user.name 'Doré CI'
          git config user.email 'westsidewatchca@gmail.com'
          git add reports/DORÉ-CORPUS-READING-REPORT.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore(dore): persist corpus reading report [skip ci]'
            git push
          fi
      - name: Enforce Doré Foundation result
        if: always()
        run: |
          test "${{ steps.unit_tests.outcome }}" = "success"
          test "${{ steps.corpus_reading.outcome }}" = "success"
