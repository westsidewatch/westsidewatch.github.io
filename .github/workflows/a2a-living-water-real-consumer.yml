name: A2A Living Water Real Consumer

on:
  pull_request:
    paths:
      - 'dore-core/runtime/capability-registry.v1.json'
      - 'local/dore-local/capability_bindings.py'
      - 'local/dore-local/capability_bus.py'
      - 'local/dore-local/a2a_living_water_real_acceptance.py'
      - 'local/dore-local/design_intelligence_a2a_worker_v11.py'
      - 'dore-design/design_intelligence_raster.py'
      - 'dore-design/design_intelligence_a2a.py'
      - 'dore-design/living_water_bloom.py'
      - 'dore-design/living_water_bloom_round1.v1.json'
      - '.github/workflows/a2a-living-water-real-consumer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  living-water-real:
    runs-on: [self-hosted, macOS, dore]
    timeout-minutes: 60
    env:
      PYTHONPATH: .
      DORE_REPO_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - name: Living Water through Universal A2A Core
        run: python3 local/dore-local/a2a_living_water_real_acceptance.py
      - name: Upload Living Water bloom evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: living-water-bloom-round1
          path: .artifacts/living-water-bloom
          if-no-files-found: warn
          retention-days: 30
