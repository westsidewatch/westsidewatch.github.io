name: 096 R19 Editorial Square
on:
  pull_request:
    paths:
      - 'static/experiments/foundation-096-r19/**'
      - 'tests/096-r19-editorial-square.cjs'
      - '.github/workflows/096-r19-editorial-square.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: npm install --no-save --no-package-lock playwright && npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 4173 --directory static >/tmp/r19-http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          node tests/096-r19-editorial-square.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r19-editorial-square
          path: artifacts/r19-editorial-square/
