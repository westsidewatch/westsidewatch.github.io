name: 115 Faith and Daylight
on:
  pull_request:
    paths:
      - 'static/experiments/section-name-seals/r115/**'
      - 'tests/115-faith-and-daylight.cjs'
      - '.github/workflows/115-faith-and-daylight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: npm install --no-save --no-package-lock playwright && npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 4173 --directory static >/tmp/seals115-http.log 2>&1 &
          node tests/115-faith-and-daylight.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editorial-115
          path: artifacts/115/
