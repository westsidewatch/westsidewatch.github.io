name: Doré Priority B direct runner
on:
  issues:
    types: [opened]
permissions: {contents: write}
jobs:
  run:
    if: startsWith(github.event.issue.title, '[DORE-RUN2] Priority B')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Migrate, cut over, verify, close
        env: {TOKEN: "${{ secrets.DORE_HEARTBEAT_TOKEN }}"}
        shell: bash
        run: |
          set -euo pipefail; test -n "${TOKEN:-}"
          python3 - <<'PY'
          import os,json,subprocess,time,urllib.parse
          items=[('background.jpg','SITE-BACKGROUND'),('static/images/damascus-gate.jpg','SITE-DAMASCUS-GATE'),('static/images/jerusalem-wall.png','SITE-JERUSALEM-WALL'),('static/images/temple-stone-light.png','SITE-TEMPLE-STONE-LIGHT'),('static/wechat-qr.png','SITE-WECHAT-QR')]
          def c(args):
            p=subprocess.run(['curl','-sS','-L']+args,capture_output=True,text=True); raw=p.stdout.strip()
            try:return json.loads(raw)
            except:return {'ok':False,'raw':raw,'stderr':p.stderr}
          out=[]
          for src,code in items:
            q=urllib.parse.quote(code); s=c(['https://westsidewatch-github-io.pages.dev/api/dore/assets/search?q='+q]); rows=s.get('results') or []
            if not any(x.get('asset_code')==code for x in rows):
              if not os.path.exists(src): raise SystemExit(f'missing source and registry: {src}')
              body=json.dumps({'source_path':src,'asset_code':code,'title':code,'products_using_it':['SITE']}); r=None
              for n in range(12):
                r=c(['-X','POST','-H',f'Authorization: Bearer {os.environ["TOKEN"]}','-H','Content-Type: application/json','--data',body,'https://westsidewatch-github-io.pages.dev/api/dore/assets/migrate-site'])
                if r.get('ok'): break
                time.sleep(15)
              if not r or not r.get('ok'): raise SystemExit(f'{code} migrate failed: {r}')
            out.append(code)
          open('/tmp/codes','w').write('\n'.join(out))
          PY
          python3 - <<'PY'
          from pathlib import Path
          R={'/background.jpg':'/api/dore/assets/site-file?code=SITE-BACKGROUND','/images/damascus-gate.jpg':'/api/dore/assets/site-file?code=SITE-DAMASCUS-GATE','/images/jerusalem-wall.png':'/api/dore/assets/site-file?code=SITE-JERUSALEM-WALL','/images/temple-stone-light.png':'/api/dore/assets/site-file?code=SITE-TEMPLE-STONE-LIGHT','/wechat-qr.png':'/api/dore/assets/site-file?code=SITE-WECHAT-QR'}
          for p in Path('.').rglob('*'):
            if not p.is_file() or '.git' in p.parts or p.parts[:2]==('.github','workflows') or p.parts[:2]==('dore-core','cloudflare'): continue
            if p.suffix.lower() not in {'.html','.css','.js','.md','.json','.toml','.yaml','.yml'}: continue
            try:s=p.read_text()
            except:continue
            o=s
            for a,b in R.items():s=s.replace(a,b)
            if s!=o:p.write_text(s)
          PY
          files=(background.jpg static/images/damascus-gate.jpg static/images/jerusalem-wall.png static/images/temple-stone-light.png static/wechat-qr.png)
          for f in "${files[@]}"; do test ! -e "$f" || git rm "$f"; done
          for c in SITE-BACKGROUND SITE-DAMASCUS-GATE SITE-JERUSALEM-WALL SITE-TEMPLE-STONE-LIGHT SITE-WECHAT-QR; do curl -fsS "https://westsidewatch-github-io.pages.dev/api/dore/assets/site-file?code=$c" -o /tmp/x; test -s /tmp/x; done
          mkdir -p dore-core/cloudflare/receipts
          printf '%s\n' '{"milestone":"priority-b-site-media","status":"PASS","asset_count":5,"runtime_cutover":"registry-private-r2","github_binaries_removed":5,"r2_delivery_verified":5,"brand_svg_policy":"KEEP_IN_GITHUB","canonical_dore_241_touched":false}' > dore-core/cloudflare/receipts/R2-PRIORITY-B-SITE-MEDIA-PASS.json
          git config user.name dore-migration-bot; git config user.email dore-migration-bot@users.noreply.github.com
          git add -A; git commit -m 'feat(dore): complete Priority B site media R2 cutover [skip ci]' || true; git pull --rebase origin main || true; git push