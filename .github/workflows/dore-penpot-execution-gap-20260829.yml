name: Doré Penpot Execution Gap Repair
on:
  push:
    paths: ['.github/workflows/dore-penpot-execution-gap-20260829.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wire executor into worker
        shell: python
        run: |
          from pathlib import Path
          p=Path('local/dore-local/coordination_worker.py')
          s=p.read_text()
          needle='from complete_recall import complete_recall\n'
          assert needle in s
          if 'from penpot_coordination_executor import execute_readonly' not in s:
              s=s.replace(needle,needle+'from penpot_coordination_executor import execute_readonly\n',1)
          anchor='def run_acceptance_tasks(prev):\n'
          assert anchor in s
          handler="""def handle_penpot_work(msg):
              if msg.get('kind')!='penpot_work': return False
              result=execute_readonly(str(msg.get('body') or ''))
              send_to_chatgpt('Doré Penpot execution: '+str(msg.get('subject') or '')[:100],json.dumps(result,ensure_ascii=False),requires_reply=False,priority='high',related_goal=str(msg.get('related_goal') or 'penpot-real-work-apprenticeship'),evidence_refs=['penpot-live-tool-execution','source-message:'+str(msg.get('message_id') or '')],thread_id=msg.get('thread_id'))
              return True

          """
          if 'def handle_penpot_work(' not in s:
              s=s.replace(anchor,handler+anchor,1)
          dispatch=''' if current and handle_complete_recall(current):
            processed.add(current["message_id"])
            prev.update({"repo_inbox_processed":sorted(processed),"checked_at":datetime.now(timezone.utc).isoformat()})
            save(prev); flush_outbox(); return 0
          '''
          assert dispatch in s
          if 'if current and handle_penpot_work(current):' not in s:
              s=s.replace(dispatch,dispatch+''' if current and handle_penpot_work(current):
            processed.add(current["message_id"])
            prev.update({"repo_inbox_processed":sorted(processed),"checked_at":datetime.now(timezone.utc).isoformat()})
            save(prev); flush_outbox(); return 0
          ''',1)
          p.write_text(s)
      - name: Verify
        run: |
          python -m py_compile local/dore-local/penpot_coordination_executor.py local/dore-local/coordination_worker.py
          grep -q 'handle_penpot_work' local/dore-local/coordination_worker.py
          grep -q 'execute_readonly' local/dore-local/coordination_worker.py
      - name: Commit
        run: |
          git config user.name WATCHMAN
          git config user.email westsidewatchca@gmail.com
          git add local/dore-local/coordination_worker.py local/dore-local/penpot_coordination_executor.py
          git commit -m 'dore: close Penpot coordination execution gap'
          git rm .github/workflows/dore-penpot-execution-gap-20260829.yml
          git commit -m 'ci: remove Penpot execution repair workflow'
          git push
