name: Dawn Visual Graph Check

on:
  pull_request:
    paths:
      - 'data/**'
      - 'content/visual/**'
      - 'layouts/**'
      - 'static/**'
      - 'scripts/dore/**'
      - '.github/workflows/dawn-visual-graph-check.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Content boundary gate
        run: node scripts/dore/content-boundary-selftest.mjs
      - name: Validate Visual Graph JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          graph=json.loads(Path('data/visual_graph.json').read_text())
          rights=json.loads(Path('data/visual_rights.json').read_text())
          policies=rights['policies']; ids=set(); native=0; crops=0
          for work in graph['visual_works']:
            assert work['id'] not in ids; ids.add(work['id'])
            assert work.get('representations')
            if work.get('generated'): assert work.get('authority_class')=='D'
            region_ids={r.get('id') for r in work.get('regions',[])}
            for preset in work.get('surface_presets',[]):
              if preset.get('focal_region_id'): assert preset['focal_region_id'] in region_ids
            for rep in work['representations']:
              assert rep.get('image_url'); assert rep['rights']['policy'] in policies
              if rep['delivery'].get('mode')=='iiif-image': native+=1
            for region in work.get('regions',[]):
              if region.get('provenance',{}).get('source')=='authority' and region.get('region_scope')=='source-cropped-manuscript-decoration': crops+=1
          assert native>=2 and crops>=1
          print('Visual Graph PASS',len(ids),'works')
          PY
      - name: Existing visual intelligence gates
        run: |
          node scripts/dore/visual-fuzzy-retrieval-selftest.mjs
          node scripts/dore/visual-editorial-director-runtime-selftest.mjs
          node scripts/dore/dawn-editorial-context-selftest.mjs
          node scripts/dore/dawn-surface-orchestrator-selftest.mjs
          node scripts/dore/storybook-art-direction-loop-selftest.mjs
          node scripts/dore/global-design-nourishment-selftest.mjs
          node scripts/dore/global-design-round2-selftest.mjs
      - name: Checkout authority corpus
        uses: actions/checkout@v4
        with:
          repository: art-institute-of-chicago/api-data
          path: aic-api-data
          fetch-depth: 1
      - name: Large nourishment corpus run
        env:
          DORE_CANDIDATE_TARGET: '100000'
          DORE_RETAIN_TARGET: '3000'
        run: node scripts/dore/global-design-round2-corpus-run.mjs aic-api-data/json/artworks
      - name: Upload corpus evidence
        uses: actions/upload-artifact@v4
        with:
          name: dore-large-nourishment-report
          path: dore-round2-corpus-report.json
      - name: Build and regression gates
        run: |
          node scripts/dore/build-dawn-visual-editorial-feed.mjs
          git diff --exit-code -- data/dawn_visual_editorial.json
          node --check scripts/dore/content-boundary.mjs
          node --check scripts/dore/content-boundary-selftest.mjs
          node --check scripts/dore/global-design-round2-corpus-run.mjs
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true
      - name: Build site
        run: hugo --minify --gc
