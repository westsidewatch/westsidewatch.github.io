name: Italian Editorial Grammar Promotion Gate
'on':
  push: {}
  pull_request: {}
  workflow_dispatch: {}
jobs:
  promotion-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate promotion contract and regression invariants
        run: python scripts/validate_italian_editorial_grammar_promotion.py
