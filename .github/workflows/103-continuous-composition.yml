name: 103 Continuous Editorial Composition
on:
  pull_request:
    paths:
      - 'static/experiments/096-editorial-composition/**'
      - 'static/church/visit/index.html'
      - 'tests/103-continuous-composition.cjs'
      - '.github/workflows/103-continuous-composition.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: npm install --no-save --no-package-lock playwright && npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 4173 --directory static >/tmp/folio103-http.log 2>&1 &
          node tests/103-continuous-composition.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editorial-103
          path: artifacts/103/