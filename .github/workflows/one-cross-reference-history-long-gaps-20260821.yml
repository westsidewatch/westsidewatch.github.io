name: ONE History Long Cross Reference Gaps
on:
  push:
    paths:
      - '.github/workflows/one-cross-reference-history-long-gaps-20260821.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fill long history reference gaps
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('static/one/one-cross-reference-scripture.js')
          s=p.read_text()
          marker="  const reviewedExplanationBooks="
          if marker not in s: raise SystemExit('map end marker not found')
          additions={
          '申命記 28:36–68':'耶和華必將你和你所立的王領到你和你列祖素不認識的國去；在那裏你必事奉木頭石頭的神。你在耶和華領你到的各國中，要令人驚駭、笑談、譏誚。你帶到田間的種子雖多，收進來的卻少，因為被蝗蟲吃了。你栽種、修理葡萄園，卻不得收葡萄，也不得喝葡萄酒，因為被蟲子吃了。你全境有橄欖樹，卻不得其油抹身，因為樹上的橄欖不熟自落了。你生兒養女，卻不算是你的，因為必被擄去。你所有的樹木和你地裏的出產必被蝗蟲所吃。在你中間寄居的，必漸漸上升，比你高而又高；你必漸漸下降，低而又低。他必借給你，你卻不能借給他；他必作首，你必作尾。這一切咒詛必追隨你，趕上你，直到你滅亡；因為你不聽從耶和華－你上帝的話，不遵守他所吩咐的誡命律例。這些咒詛必在你和你後裔的身上成為異蹟奇事，直到永遠！因為你富有的時候，不歡心樂意地事奉耶和華－你的上帝，所以你必在飢餓、乾渴、赤露、缺乏之中事奉耶和華所打發來攻擊你的仇敵。他必把鐵軛加在你的頸項上，直到將你滅絕。耶和華要從遠方、地極帶一國的民，如鷹飛來攻擊你。這民的言語，你不懂得。這民的面貌凶惡，不顧恤年老的，也不恩待年少的。他們必吃你牲畜所下的和你地土所產的，直到你滅亡。你的五穀、新酒，和油，以及牛犢、羊羔，都不給你留下，直到將你滅絕。他們必將你困在你各城裏，直到你所倚靠、高大堅固的城牆都被攻塌。他們必將你困在耶和華－你上帝所賜你遍地的各城裏。你在仇敵圍困窘迫之中，必吃你本身所生的，就是耶和華－你上帝所賜給你的兒女之肉。你們中間，柔弱嬌嫩的人必惡眼看他弟兄和他懷中的妻，並他餘剩的兒女；甚至在你受仇敵圍困窘迫的城中，他要吃兒女的肉，不肯分一點給他的親人，因為他一無所剩。你們中間，柔弱嬌嫩的婦人，是因嬌嫩柔弱不肯把腳踏地的，必惡眼看她懷中的丈夫和她的兒女。她兩腿中間出來的嬰孩與她所要生的兒女，她因缺乏一切就要在你受仇敵圍困窘迫的城中將他們暗暗地吃了。這書上所寫律法的一切話是叫你敬畏耶和華－你上帝可榮可畏的名。你若不謹守遵行，耶和華就必將奇災，就是至大至長的災，至重至久的病，加在你和你後裔的身上，也必使你所懼怕、埃及人的病都臨到你，貼在你身上，又必將沒有寫在這律法書上的各樣疾病、災殃降在你身上，直到你滅亡。你們先前雖然像天上的星那樣多，卻因不聽從耶和華－你上帝的話，所剩的人數就稀少了。先前耶和華怎樣喜悅善待你們，使你們眾多，也要照樣喜悅毀滅你們，使你們滅亡；並且你們從所要進去得的地上必被拔除。耶和華必使你們分散在萬民中，從地這邊到地那邊，你必在那裏事奉你和你列祖素不認識、木頭石頭的神。在那些國中，你必不得安逸，也不得落腳之地；耶和華卻使你在那裏心中跳動，眼目失明，精神消耗。你的性命必懸懸無定；你晝夜恐懼，自料性命難保。你因心裏所恐懼的，眼中所看見的，早晨必說，巴不得到晚上才好；晚上必說，巴不得到早晨才好。耶和華必使你坐船回埃及去，走我曾告訴你不得再見的路；在那裏你必賣己身與仇敵作奴婢，卻無人買。',
          '歷代志上 17:11–14':'你壽數滿足歸你列祖的時候，我必使你的後裔接續你的位，我也必堅定他的國。他必為我建造殿宇；我必堅定他的國位直到永遠。我要作他的父，他要作我的子；並不使我的慈愛離開他，像離開在你以前的掃羅一樣。我卻要將他永遠堅立在我家裏和我國裏；他的國位也必堅定，直到永遠。',
          '歷代志下 7:14':'這稱為我名下的子民，若是自卑、禱告，尋求我的面，轉離他們的惡行，我必從天上垂聽，赦免他們的罪，醫治他們的地。'
          }
          insert=''
          for k,v in additions.items():
            if ("'"+k+"':") not in s:
              insert += "    '"+k+"':"+repr(v)+",\n"
          if insert:
            pos=s.index(marker)
            # scripture map closes immediately before reviewedExplanationBooks
            close=s.rfind('  };',0,pos)
            if close<0: raise SystemExit('scripture map close not found')
            s=s[:close]+insert+s[close:]
          s=s.replace("batch:'history-reference-fill-postexile-gaps-complete'","batch:'history-long-gaps-cleanup'",1)
          p.write_text(s)
          idx=Path('static/one/index.html'); t=idx.read_text()
          for old in ['one-cross-reference-scripture.js?v=20260821f','one-cross-reference-scripture.js?v=20260821e']:
            if old in t:
              t=t.replace(old,'one-cross-reference-scripture.js?v=20260821g',1);break
          else: raise SystemExit('cache marker not found')
          idx.write_text(t)
          PY
      - name: Commit
        run: |
          git config user.name 'westsidewatch-scripture-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/one/one-cross-reference-scripture.js static/one/index.html
          git commit -m 'Clean remaining long history cross-reference gaps'
          git push
