name: Doré persistent conversation interface v1
on:
  push:
    branches: [main]
    paths: ['.github/workflows/dore-conversation-interface-v1.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add persistent conversation read APIs
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('local/dore-local/dore_local.py')
          s=p.read_text()
          old="import json, os, sqlite3, hashlib, uuid, urllib.request, re\n"
          new="import json, os, sqlite3, hashlib, uuid, urllib.request, re\nfrom urllib.parse import urlparse, parse_qs\n"
          if old in s and 'from urllib.parse import urlparse, parse_qs' not in s:
              s=s.replace(old,new,1)
          anchor="def context_state(cid,project,text):\n"
          helpers='''def conversation_list(project='dore-search',limit=80):\n with db() as c:\n  rows=[dict(x) for x in c.execute("SELECT id,project_id,title,created_at,updated_at FROM dore_conversations WHERE project_id=? ORDER BY updated_at DESC LIMIT ?",(project,limit))]\n  out=[]\n  for r in rows:\n   first=c.execute("SELECT content FROM dore_messages WHERE conversation_id=? AND project_id=? AND role='user' ORDER BY created_at ASC LIMIT 1",(r['id'],project)).fetchone()\n   last=c.execute("SELECT content FROM dore_messages WHERE conversation_id=? AND project_id=? ORDER BY created_at DESC LIMIT 1",(r['id'],project)).fetchone()\n   title=(r.get('title') or (first['content'] if first else 'New conversation')).strip().replace('\\n',' ')[:72]\n   out.append({**r,'title':title,'preview':(last['content'] if last else '')[:140]})\n  return out\ndef conversation_history(cid,project='dore-search'):\n with db() as c:\n  conv=c.execute('SELECT id,project_id,title,created_at,updated_at FROM dore_conversations WHERE id=? AND project_id=?',(cid,project)).fetchone()\n  if not conv:return None\n  messages=[dict(x) for x in c.execute('SELECT id,role,content,created_at FROM dore_messages WHERE conversation_id=? AND project_id=? ORDER BY created_at ASC',(cid,project))]\n  return {'conversation':dict(conv),'messages':messages}\n'''
          if 'def conversation_list(' not in s:
              if anchor not in s: raise SystemExit('context_state anchor missing')
              s=s.replace(anchor,helpers+anchor,1)
          old_get=" def do_GET(self):\n  if self.path=='/legacy-memory/status': return self.sendj({'ok':True,'legacy_memory':legacy_status()})\n"
          new_get=""" def do_GET(self):\n  parsed=urlparse(self.path); path=parsed.path; qs=parse_qs(parsed.query)\n  if path=='/conversations':\n   project=str((qs.get('project_id') or ['dore-search'])[0]); return self.sendj({'ok':True,'project_id':project,'conversations':conversation_list(project)})\n  if path=='/conversation':\n   project=str((qs.get('project_id') or ['dore-search'])[0]); cid=str((qs.get('conversation_id') or [''])[0]); item=conversation_history(cid,project)\n   if not item:return self.sendj({'ok':False,'error':'conversation_not_found'},404)\n   return self.sendj({'ok':True,**item})\n  if path=='/legacy-memory/status': return self.sendj({'ok':True,'legacy_memory':legacy_status()})\n"""
          if old_get in s:
              s=s.replace(old_get,new_get,1)
          elif "if path=='/conversations'" not in s:
              raise SystemExit('do_GET anchor missing')
          s=s.replace("if self.path in {'/memory/self/status','/learning/status'}:","if path in {'/memory/self/status','/learning/status'}:")
          s=s.replace("if self.path=='/learning/plan':","if path=='/learning/plan':")
          s=s.replace("if self.path=='/learning/autonomous/status':","if path=='/learning/autonomous/status':")
          s=s.replace("if self.path=='/health':","if path=='/health':")
          p.write_text(s)
          PY
      - name: Verify Python syntax and API markers
        run: |
          python -m py_compile local/dore-local/dore_local.py
          grep -F "if path=='/conversations'" local/dore-local/dore_local.py
          grep -F "def conversation_history" local/dore-local/dore_local.py
      - name: Commit backend and remove workflow
        run: |
          rm .github/workflows/dore-conversation-interface-v1.yml
          git config user.name 'westsidewatch-bot'
          git config user.email 'westsidewatchca@gmail.com'
          git add local/dore-local/dore_local.py .github/workflows/dore-conversation-interface-v1.yml
          git commit -m 'dore: add persistent conversation history API'
          git push origin HEAD:main
