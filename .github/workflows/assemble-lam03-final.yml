name: Assemble Lamentations 3 final binary

on:
  pull_request:
    branches: [main]
    paths:
      - 'static/one/.lam03-assemble-trigger'

permissions:
  contents: write

jobs:
  assemble:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Rebuild verified AVIF from staged chunks
        shell: bash
        run: |
          set -euo pipefail
          target='static/one/studio/lamentations-03-dore-studio-v1.avif'
          if [ -f "$target" ]; then
            echo 'Target already exists; nothing to do.'
            exit 0
          fi
          cat static/one/studio-packs/lam03/part-*.b64 | base64 --decode --ignore-garbage > "$target"
          test "$(wc -c < "$target" | tr -d ' ')" = "92695"
          echo "0716c9147109a93fd3ab1743a7e39d26c6a17b2844d0fea16274c0949cd61836  $target" | sha256sum -c -
          git config user.name 'WATCHMAN'
          git config user.email 'westsidewatchca@gmail.com'
          git add "$target"
          git rm -f static/one/.lam03-assemble-trigger
          git rm -f .github/workflows/assemble-lam03-final.yml
          git commit -m 'asset(one): publish Lamentations 3 Studio master'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
