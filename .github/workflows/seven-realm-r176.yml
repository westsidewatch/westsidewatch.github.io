name: R176 Emmaus interwoven geometry proof
on:
  pull_request:
    branches: [design/emmaus-content-skeleton-r175-20261127]
permissions:
  contents: read
jobs:
  proof:
    if: github.head_ref == 'design/emmaus-interwoven-system-r176-20261127'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 4173 --directory static >/tmp/r176-server.log 2>&1 &
          node tests/seven-realm-r176.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seven-realm-r176
          path: artifacts/r176/
