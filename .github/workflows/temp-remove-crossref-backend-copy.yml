name: Temp remove cross-reference backend copy
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: one/wisdom-major-prophets-scripture
      - name: Remove backend-only fallback copy from page renderer
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('static/one/one-app.js')
          s=p.read_text(encoding='utf-8')
          old='const quote=scripture?`<blockquote data-one-scripture="true">${scripture}</blockquote>`:`<p class="connection-scripture-missing"><span>Scripture pending · 經文待補</span>本條目前只保留串珠關係與說明，不以說明文字冒充經文引用。</p>`;'
          new='const quote=scripture?`<blockquote data-one-scripture="true">${scripture}</blockquote>`:\'\';'
          if old not in s: raise SystemExit('target fallback copy not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          q=Path('static/one/index.html'); html=q.read_text(encoding='utf-8')
          html=html.replace('./one-app.js?v=20260821a','./one-app.js?v=20260821b')
          q.write_text(html,encoding='utf-8')
          PY
      - name: Commit renderer cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add static/one/one-app.js static/one/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Hide backend-only cross-reference status copy"
          git push origin HEAD:one/wisdom-major-prophets-scripture
