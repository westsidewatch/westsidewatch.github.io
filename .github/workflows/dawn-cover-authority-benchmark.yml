name: Dawn Cover Authority Benchmark
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/build_dawn_cover_authority.py
      - .github/workflows/dawn-cover-authority-benchmark.yml
permissions:
  contents: write
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Benchmark first 100 works
        run: python3 scripts/build_dawn_cover_authority.py --shard 1 --limit 100 --delay 0.12
      - name: Verify benchmark
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('static/dawn-library/cover-authority/authority-000001.json').read_text())
          assert p['sampleCount']==100
          assert 0 <= p['resolvedCount'] <= 100
          assert 0 <= p['hitRate'] <= 1
          print('sampleCount=',p['sampleCount'])
          print('resolvedCount=',p['resolvedCount'])
          print('hitRate=',p['hitRate'])
          PY
      - name: Publish benchmark authority
        run: |
          git config user.name 'Dore CI'
          git config user.email 'dore-ci@users.noreply.github.com'
          git add static/dawn-library/cover-authority/authority-000001.json
          if git diff --cached --quiet; then
            echo 'Benchmark unchanged.'
          else
            git commit -m 'data(dawn): publish cover authority benchmark [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dawn-cover-authority-benchmark
          path: static/dawn-library/cover-authority/authority-000001.json
