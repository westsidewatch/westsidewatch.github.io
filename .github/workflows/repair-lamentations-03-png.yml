name: Repair Lamentations 3 PNG
on:
  push:
    paths:
      - '.github/workflows/repair-lamentations-03-png.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Convert final asset to PNG and remove WebP
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, io
          from PIL import Image

          src = Path('static/one/studio/lamentations-03-dore-final.webp')
          raw = base64.b64decode(src.read_text().strip())
          if raw[:4] != b'RIFF' or raw[8:12] != b'WEBP':
              raise SystemExit('Source payload is not a valid WebP image')

          im = Image.open(io.BytesIO(raw)).convert('RGB')
          out = Path('static/one/studio/lamentations-03-dore-final.png')
          im.save(out, 'PNG', optimize=True)

          policy = Path('static/one/one-cover-policy.js')
          text = policy.read_text()
          text = text.replace('/one/studio/lamentations-03-dore-final.webp?v=20260821a', '/one/studio/lamentations-03-dore-final.png?v=20260821b')
          text = text.replace('/one/studio/lamentations-03-dore-final.webp', '/one/studio/lamentations-03-dore-final.png')
          policy.write_text(text)

          src.unlink()
          print('PNG ready:', im.size, out.stat().st_size)
          PY
      - name: Verify PNG-only state
        run: |
          test -f static/one/studio/lamentations-03-dore-final.png
          test ! -e static/one/studio/lamentations-03-dore-final.webp
          ! grep -R "lamentations-03-dore-final.webp" static/one
      - name: Commit PNG-only replacement
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add static/one/studio/lamentations-03-dore-final.png static/one/one-cover-policy.js
          git rm static/one/studio/lamentations-03-dore-final.webp
          git rm .github/workflows/repair-lamentations-03-png.yml
          git commit -m 'fix(one): replace Lamentations asset with PNG only'
          git push
