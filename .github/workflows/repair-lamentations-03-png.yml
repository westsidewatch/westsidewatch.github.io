name: Repair Lamentations 3 PNG
on:
  push:
    paths:
      - '.github/workflows/repair-lamentations-03-png.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode stored WebP text and convert to PNG
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, io
          from PIL import Image
          src = Path('static/one/studio/lamentations-03-dore-final.webp')
          raw = base64.b64decode(src.read_text().strip())
          if raw[:4] != b'RIFF' or raw[8:12] != b'WEBP':
              raise SystemExit('Decoded source is not a real WebP')
          im = Image.open(io.BytesIO(raw))
          out = Path('static/one/studio/lamentations-03-dore-final.png')
          im.save(out, 'PNG', optimize=True)
          print('PNG ready:', im.size, out.stat().st_size)
          PY
      - name: Commit real PNG
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add static/one/studio/lamentations-03-dore-final.png
          git commit -m 'fix(one): publish Lamentations 3 as real PNG'
          git push
