name: Wire Isaiah into ONE
on:
  push:
    branches: [feat/one-isaiah]
permissions:
  contents: write
jobs:
  wire:
    if: ${{ !contains(github.event.head_commit.message, 'wire Isaiah book') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/one-isaiah
      - name: Add Isaiah script and catalogue label
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('static/one/index.html')
          s=p.read_text()
          tag='<script src="./isaiah-complete.js?v=20260816a"></script>'
          if tag not in s:
              needle='<script src="./one-app.js'
              i=s.find(needle)
              if i<0: raise SystemExit('one-app script not found')
              s=s[:i]+tag+s[i:]
          old='創世記 · 撒母耳記上 · 撒母耳記下 · 詩篇 · 馬太福音'
          new='創世記 · 撒母耳記上 · 撒母耳記下 · 詩篇 · 以賽亞書 · 馬太福音'
          s=s.replace(old,new)
          p.write_text(s)
          PY
      - name: Commit wiring
        run: |
          git config user.name 'WATCHMAN'
          git config user.email 'westsidewatchca@gmail.com'
          git add static/one/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'feat(one): wire Isaiah book into ONE'
          git push origin HEAD:feat/one-isaiah
