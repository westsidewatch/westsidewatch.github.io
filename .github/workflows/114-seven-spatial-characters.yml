name: 114 Seven Spatial Characters
on:
  pull_request:
    paths:
      - 'static/experiments/section-name-seals/r114/**'
      - 'tests/114-seven-spatial-characters.cjs'
      - '.github/workflows/114-seven-spatial-characters.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: npm install --no-save --no-package-lock playwright && npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 4173 --directory static >/tmp/seals114-http.log 2>&1 &
          node tests/114-seven-spatial-characters.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editorial-114
          path: artifacts/114/
