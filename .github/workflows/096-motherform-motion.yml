name: 096 Motherform Motion
on:
  pull_request:
    paths:
      - 'static/experiments/096-motherform-motion/**'
      - 'tests/096-motherform-motion.cjs'
      - '.github/workflows/096-motherform-motion.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: npm install --no-save --no-package-lock playwright && npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 4173 --directory static >/tmp/motion-http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          node tests/096-motherform-motion.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: motherform-motion
          path: artifacts/motherform-motion/
