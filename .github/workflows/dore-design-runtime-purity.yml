name: Doré Design Runtime Purity

on:
  push:
    paths:
      - 'dore-design/**'
      - '.github/workflows/dore-design-runtime-purity.yml'
  workflow_dispatch:

jobs:
  runtime-purity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: python3 -m py_compile dore-design/runtime_purity_acceptance.py dore-design/runtime_concurrency_acceptance.py dore-design/runtime_serialization.py dore-design/app_design2.py dore-design/app_visual_v2.py
      - name: Resident read purity concurrent writes and restart idempotence
        shell: bash
        run: |
          set -euo pipefail
          export DORE_DESIGN_DATA="${{ runner.temp }}/dore-design-runtime-purity"
          export DORE_DESIGN_PUBLICATION_REGISTRY="${{ runner.temp }}/dore-design-runtime-purity-publication.json"
          export DORE_DESIGN_RECOMMENDATION_LOG="${{ runner.temp }}/dore-design-runtime-purity-recommendations.json"
          export DORE_DESIGN_PORT=4321
          python3 dore-design/workspace_cli.py get >/dev/null
          python3 dore-design/upgrade_living_fortress_v2.py >/dev/null
          python3 dore-design/app_design2.py >/tmp/dore-design-runtime-purity.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          sleep 1
          if ! curl -fsS http://127.0.0.1:4321/api/health >/dev/null; then
            cat /tmp/dore-design-runtime-purity.log
            exit 1
          fi
          if ! python3 dore-design/runtime_purity_acceptance.py; then
            echo '--- purity failure resident log ---'
            cat /tmp/dore-design-runtime-purity.log
            exit 1
          fi
          if ! python3 dore-design/runtime_concurrency_acceptance.py; then
            echo '--- concurrency failure resident log ---'
            cat /tmp/dore-design-runtime-purity.log
            exit 1
          fi
          before_restart=$(curl -fsS http://127.0.0.1:4321/api/workspace | python3 -c 'import json,sys; print(json.load(sys.stdin)["revision"])')
          kill $pid
          wait $pid 2>/dev/null || true
          python3 dore-design/app_design2.py >/tmp/dore-design-runtime-restart.log 2>&1 &
          pid=$!
          sleep 1
          after_restart=$(curl -fsS http://127.0.0.1:4321/api/workspace | python3 -c 'import json,sys; print(json.load(sys.stdin)["revision"])')
          test "$after_restart" = "$before_restart" || { echo "restart revision drift: $before_restart -> $after_restart"; cat /tmp/dore-design-runtime-restart.log; exit 1; }
          curl -fsS http://127.0.0.1:4321/api/health >/dev/null
          curl -fsS 'http://127.0.0.1:4321/editor-canvas?page=living-water-candidate-01' >/dev/null
      - name: Purity serialization and restart gate
        run: echo DORE_DESIGN_RUNTIME_PURITY_SERIALIZATION_RESTART_GATE_PASS
