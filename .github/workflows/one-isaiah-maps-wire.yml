name: Wire Isaiah maps
on:
  push:
    branches: [feat/one-isaiah-maps]
permissions:
  contents: write
jobs:
  wire:
    if: ${{ !contains(github.event.head_commit.message, 'wire Isaiah maps into ONE') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/one-isaiah-maps
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('static/one/index.html');s=p.read_text()
          old='<script src="./isaiah-context.js?v=20260816g"></script><script src="./isaiah-connections-extra.js?v=20260816d"></script>'
          new='<script src="./isaiah-context.js?v=20260816g"></script><script src="./isaiah-maps.js?v=20260816a"></script><script src="./isaiah-connections-extra.js?v=20260816d"></script>'
          if old not in s: raise SystemExit('Isaiah insertion point not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - run: |
          git config user.name 'WATCHMAN'
          git config user.email 'westsidewatchca@gmail.com'
          git add static/one/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'feat(one): wire Isaiah maps into ONE'
          git push origin HEAD:feat/one-isaiah-maps
