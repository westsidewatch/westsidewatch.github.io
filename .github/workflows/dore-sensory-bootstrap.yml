name: Doré sensory experiment bootstrap

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/dore-sensory-bootstrap.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create ephemeral sensory endpoint
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl -fsS -X POST \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/json' \
            -d '{"cors":true,"default_status":204,"default_content":"","default_content_type":"text/plain","expiry":604800,"request_limit":1000}' \
            https://webhook.site/token)
          uuid=$(printf '%s' "$response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["uuid"])')
          mkdir -p static/dore/brain
          python3 - "$uuid" <<'PY'
          import json,sys,datetime
          uuid=sys.argv[1]
          now=datetime.datetime.now(datetime.timezone.utc)
          payload={
            "schema":"dore.sensory-experiment.v1",
            "mode":"experiment-only",
            "token_id":uuid,
            "write_url":f"https://webhook.site/{uuid}",
            "created_at":now.isoformat(),
            "expires_at":(now+datetime.timedelta(days=7)).isoformat(),
            "privacy":"Only enabled when dore_experiment=1. Do not treat as production storage."
          }
          open('static/dore/brain/sensory-config.json','w').write(json.dumps(payload,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Persist sensory config
        shell: bash
        run: |
          git config user.name 'Doré Learning Heartbeat'
          git config user.email 'actions@users.noreply.github.com'
          git add static/dore/brain/sensory-config.json
          git commit -m 'chore(dore): activate ephemeral sensory queue [skip ci]'
          git push
