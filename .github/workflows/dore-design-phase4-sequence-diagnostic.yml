name: Doré Design Phase4 Sequence Diagnostic
on:
  push:
    paths:
      - 'dore-design/**'
      - '.github/workflows/dore-design-phase4-sequence-diagnostic.yml'
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Phase7 precursor
        run: |
          export DORE_DESIGN_DATA="${{ runner.temp }}/phase7"
          export DORE_DESIGN_PUBLICATION_REGISTRY="${{ runner.temp }}/phase7-publication.json"
          export DORE_DESIGN_RECOMMENDATION_LOG="${{ runner.temp }}/phase7-recommendations.json"
          export DORE_DESIGN_PORT=4311
          python3 dore-design/workspace_cli.py get >/dev/null
          python3 dore-design/upgrade_living_fortress_v2.py >/dev/null
          python3 dore-design/app_design2.py >/tmp/phase7-server.log 2>&1 & pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          sleep 1
          curl -fsS http://127.0.0.1:4311/api/design2/production-health >/tmp/phase7-health.json
      - name: Phase4 capture
        id: phase4
        continue-on-error: true
        run: |
          export DORE_DESIGN_DATA="${{ runner.temp }}/phase4"
          export DORE_DESIGN_PUBLICATION_REGISTRY="${{ runner.temp }}/phase4-publication.json"
          export DORE_DESIGN_RECOMMENDATION_LOG="${{ runner.temp }}/phase4-recommendations.json"
          export DORE_DESIGN_PORT=4312
          python3 dore-design/workspace_cli.py get >/tmp/phase4-workspace.log 2>&1
          python3 dore-design/upgrade_living_fortress_v2.py >/tmp/phase4-upgrade.log 2>&1
          python3 dore-design/app_design2.py >/tmp/phase4-server.log 2>&1 & pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          sleep 1
          python3 dore-design/design2_http_acceptance.py >/tmp/phase4-acceptance.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase4-sequence-diagnostic
          path: |
            /tmp/phase4-acceptance.log
            /tmp/phase4-server.log
            /tmp/phase4-upgrade.log
            /tmp/phase4-workspace.log
            /tmp/phase7-server.log
            /tmp/phase7-health.json
      - name: Enforce
        if: steps.phase4.outcome != 'success'
        run: exit 1
