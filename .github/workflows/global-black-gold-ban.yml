name: Global Black Gold Ban
on:
  pull_request:
    branches: [main]
    paths:
      - 'static/css/**'
      - 'assets/css/**'
      - 'layouts/**'
      - 'data/dore_global_design_*.json'
      - 'scripts/check_black_gold_global_ban.py'
      - '.github/workflows/global-black-gold-ban.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  black-gold-ban:
    name: Black Gold Must Stay Retired
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/check_black_gold_global_ban.py
