name: Core Contract
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: core-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  core:
    name: Core Contract
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Design OS authority
        run: |
          python3 scripts/check_westside_design_os.py
          python3 scripts/check_design_os_entrypoints.py
      - name: First-layer and protected speaker assets
        run: |
          python3 scripts/check_first_look_contract.py
          python3 scripts/check_olive_speaker_baseline.py
      - name: Home editorial composition
        run: python3 scripts/check_home_editorial_contract.py
      - name: Italian editorial grammar
        run: python3 scripts/validate_italian_editorial_grammar_promotion.py
      - name: First-look runtime regression
        run: node --test tests/first-look-*.test.cjs
