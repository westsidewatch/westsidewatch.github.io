name: Jerusalem 3000 Production Validation

on:
  workflow_run:
    workflows: ['Deploy Hugo site to Pages']
    types: [completed]

permissions:
  contents: read

jobs:
  production-browser:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Validate production runtime and visual states
        env:
          J3K_URL: https://westsidewatch.github.io/preview/jerusalem-3000/
        run: |
          node scripts/verify_jerusalem_3000_browser.mjs
      - name: Upload production visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jerusalem-3000-production-visual
          path: work/j3k-validation/
          if-no-files-found: warn
