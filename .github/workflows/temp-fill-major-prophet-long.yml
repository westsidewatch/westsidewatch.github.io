name: Temp fill major prophet long scripture
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fill:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: one/wisdom-major-prophets-scripture
      - name: Generate public-domain CUV long references
        run: |
          python - <<'PY'
          import json, urllib.request
          from pathlib import Path
          base='https://api.getbible.net/v2/cut'
          def data(book,ch):
              with urllib.request.urlopen(f'{base}/{book}/{ch}.json',timeout=30) as r: return json.load(r)
          def chapter(book,ch):
              d=data(book,ch); return ''.join(str(v.get('text','')).strip() for v in (d.get('verses') or []))
          d25=data(12,25)
          refs={
            '列王紀下 22–25': ''.join(chapter(12,n) for n in (22,23,24,25)),
            '列王紀下 25:1–21': ''.join(str(v.get('text','')).strip() for v in (d25.get('verses') or []) if int(v.get('verse',0))<=21),
            '耶利米書 52': chapter(24,52),
            '啟示錄 21–22': chapter(66,21)+chapter(66,22),
            '啟示錄 13': chapter(66,13),
          }
          if any(not x for x in refs.values()): raise SystemExit('empty scripture')
          payload=json.dumps(refs,ensure_ascii=False,separators=(',',':'))
          out='/* ONE — public-domain CUV Traditional long references for major prophets. */\n(()=>{\n  "use strict";\n  const D=window.ONE_DATA;if(!D?.studyBooks)return;\n  const refs='+payload+';\n  let filled=0;\n  for(const bookNo of [24,25,26,27]){\n    Object.values(D.studyBooks?.[bookNo]?.chapterStudies||{}).forEach(study=>{\n      (Array.isArray(study?.connections)?study.connections:[]).forEach(row=>{\n        if(!Array.isArray(row)||String(row[3]||"").trim())return;\n        const text=refs[String(row[0]||"").trim()];\n        if(text){row[3]=text;filled++;}\n      });\n    });\n  }\n  window.ONE_MAJOR_PROPHETS_LONG_SCRIPTURE={filled,references:Object.keys(refs)};\n})();\n'
          Path('static/one/one-cross-reference-scripture-major-prophets-long.js').write_text(out,encoding='utf-8')
          p=Path('static/one/index.html'); s=p.read_text(encoding='utf-8')
          marker='<script src="./one-cross-reference-scripture-major-prophets.js?v=20260821a"></script>'
          add=marker+'<script src="./one-cross-reference-scripture-major-prophets-long.js?v=20260821b"></script>'
          if 'one-cross-reference-scripture-major-prophets-long.js' not in s:
              if marker not in s: raise SystemExit('major prophet marker missing')
              p.write_text(s.replace(marker,add,1),encoding='utf-8')
          PY
      - name: Commit to work branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add static/one/one-cross-reference-scripture-major-prophets-long.js static/one/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fill long major-prophet cross-reference Scripture"
          git push origin HEAD:one/wisdom-major-prophets-scripture
