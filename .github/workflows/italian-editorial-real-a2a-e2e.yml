name: Italian Editorial Real A2A E2E

on:
  push:
    branches:
      - dore/design-editorial-grounding-clean-v1
    paths:
      - 'local/dore-local/**'\n      - '.github/workflows/italian-editorial-real-a2a-e2e.yml'
      - '.github/workflows/italian-editorial-real-a2a-e2e.yml'
  pull_request:
    paths:
      - 'local/dore-local/editorial_visual_provider.py'
      - 'local/dore-local/editorial_visual_observation_capability.py'
      - 'local/dore-local/italian_editorial_evidence_bridge.py'
      - 'local/dore-local/editorial_observation_prompt_compiler.py'
      - 'local/dore-local/italian_editorial_real_e2e.py'
      - '.github/workflows/italian-editorial-real-a2a-e2e.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  real-editorial-e2e:
    runs-on: [self-hosted, macOS, dore]
    timeout-minutes: 60
    env:
      PYTHONPATH: .:local/dore-local
      DORE_REPO_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - name: Historical image to Doré vision to prompt to image.generate
        run: python3 local/dore-local/italian_editorial_real_e2e.py
      - name: Preserve real E2E report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: italian-editorial-real-e2e
          path: artifacts/italian-editorial-real-e2e.json
          if-no-files-found: warn
      - name: Seal successful real-machine report onto integration branch
        if: success() && github.event_name == 'push'
        run: |
          git config user.name 'dore-a2a-runner'
          git config user.email 'dore-a2a-runner@users.noreply.github.com'
          git add artifacts/italian-editorial-real-e2e.json
          git commit -m 'DORÉ Design: seal real editorial E2E evidence' || exit 0
          git push origin HEAD:${{ github.ref_name }}
