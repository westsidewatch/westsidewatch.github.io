name: DORE System Atlas

on:
  pull_request:
    paths:
      - 'data/system-atlas.v0.json'
      - 'data/system-atlas.schema.json'
      - 'data/system-record-families.v0.json'
      - 'data/system-record-families/**'
      - 'docs/CURRENT_MAINLINE.md'
      - 'docs/adr/**'
      - 'docs/one/**'
      - 'docs/dore/**'
      - 'dore-core/projects/DORÉ-MASTER-WORK-REGISTER.md'
      - 'dore-core/projects/DORÉ-MEMORY-CONSOLIDATION-SWEEP-01.md'
      - 'dore-core/projects/DORE-MEMORY-SWEEP-01-CHECKPOINT-*.md'
      - 'local/dore-local/system_atlas_acceptance.py'
      - 'local/dore-local/system_record_reconciliation_acceptance.py'
      - 'local/dore-local/system_record_registry.py'
      - 'local/dore-local/system_record_registry_acceptance.py'
      - 'local/dore-local/dore_nested_records_acceptance.py'
      - '.github/workflows/system-atlas.yml'
  push:
    branches: [main]
    paths:
      - 'data/system-atlas.v0.json'
      - 'data/system-atlas.schema.json'
      - 'data/system-record-families.v0.json'
      - 'data/system-record-families/**'
      - 'docs/CURRENT_MAINLINE.md'
      - 'docs/adr/**'
      - 'docs/one/**'
      - 'docs/dore/**'
      - 'dore-core/projects/DORÉ-MASTER-WORK-REGISTER.md'
      - 'dore-core/projects/DORÉ-MEMORY-CONSOLIDATION-SWEEP-01.md'
      - 'dore-core/projects/DORE-MEMORY-SWEEP-01-CHECKPOINT-*.md'
      - 'local/dore-local/system_atlas_acceptance.py'
      - 'local/dore-local/system_record_reconciliation_acceptance.py'
      - 'local/dore-local/system_record_registry.py'
      - 'local/dore-local/system_record_registry_acceptance.py'
      - 'local/dore-local/dore_nested_records_acceptance.py'
      - '.github/workflows/system-atlas.yml'

permissions:
  contents: read

jobs:
  atlas-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate System Atlas
        run: python3 local/dore-local/system_atlas_acceptance.py
      - name: Validate record reconciliation
        run: python3 local/dore-local/system_record_reconciliation_acceptance.py
      - name: Validate Doré nested records
        run: python3 local/dore-local/dore_nested_records_acceptance.py
      - name: Validate sharded record registry
        run: python3 local/dore-local/system_record_registry_acceptance.py
