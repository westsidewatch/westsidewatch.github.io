name: Doré Researcher06 Unit09 Dev Gate
on:
  push:
    branches: [main]
    paths:
      - 'scripts/dore/researcher06-unit09-transfer-gate.mjs'
      - 'scripts/dore/phonetic-encoders-v2.mjs'
      - 'dore-core/knowledge/researcher/fixtures/noise-retrieval-unit09-dev.json'
      - '.github/workflows/dore-researcher06-unit09-dev-gate.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  dev-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save pinyin-pro@3.29.3
      - run: node scripts/dore/researcher06-unit09-transfer-gate.mjs
      - name: Persist evidence
        run: |
          git config user.name "dore-learning-bot"
          git config user.email "actions@users.noreply.github.com"
          git add dore-core/knowledge/researcher/evidence/researcher06-unit09-dev-gate.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "dore: persist Researcher 06 Unit 09 dev gate evidence"
          git push
