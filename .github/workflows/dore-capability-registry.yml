name: Doré Capability Registry

on:
  pull_request:
    paths:
      - 'dore/dore-search.js'
      - 'dore/original-index.json'
      - 'dore-design/knowledge-lab/capabilities/**'
      - 'local/dore-local/capability_registry.py'
      - 'local/dore-local/capability_registry_acceptance.py'
      - '.github/workflows/dore-capability-registry.yml'
  push:
    branches: [main]
    paths:
      - 'dore/dore-search.js'
      - 'dore-design/knowledge-lab/capabilities/**'
      - 'local/dore-local/capability_registry.py'
      - 'local/dore-local/capability_registry_acceptance.py'

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prove discovery extends rather than replaces Doré Search
        run: python local/dore-local/capability_registry_acceptance.py
