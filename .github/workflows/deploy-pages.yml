name: Deploy Westside Watch

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: "0.167.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Restore Vol.00 producer output
        uses: actions/cache/restore@v4
        with:
          path: preview/watch-city-vol00/hosanna/media/clips
          key: vol00-media-v2-
          restore-keys: |
            vol00-media-v2-
      - name: Verify Vol.00 producer output
        id: vol00_media
        shell: bash
        run: |
          clips=preview/watch-city-vol00/hosanna/media/clips
          webm=0
          jpg=0
          if [ -d "$clips" ]; then
            webm="$(find "$clips" -name '*.webm' -size +100k | wc -l)"
            jpg="$(find "$clips" -name '*.jpg' -size +10k | wc -l)"
          fi
          if [ "$webm" -eq 6 ] && [ "$jpg" -ge 13 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Vol.00 producer media cache is incomplete ($webm webm, $jpg jpg); deploy will continue without treating cache state as site authority."
          fi
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Install Hugo
        run: |
          wget -O "$RUNNER_TEMP/hugo.deb" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "$RUNNER_TEMP/hugo.deb"
      - name: Verify approved W Icon authority
        run: python3 scripts/check_w_icon_authority.py
      - name: Protect ONE route from Hugo replacement
        shell: bash
        run: |
          set -euo pipefail
          if [ -e content/one/_index.md ] || [ -e content/one/index.md ]; then
            echo "::error::Protected ONE route: Hugo content/one page would replace the original 66-book Bible tool"
            exit 1
          fi
          test -s static/one/index.html
          test -s static/one/one-app.js
      - name: Build site
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Stage Olive JavaScript and composition data
        shell: bash
        run: |
          set -euo pipefail
          # Preserve Hugo's canonical /olive/ HTML; never overwrite it with legacy root HTML.
          test -s public/olive/index.html
          test -s olive/olive.js
          mkdir -p public/olive public/dore-design/runtime
          cp olive/olive.js public/olive/olive.js
          cp static/dore-design/runtime/olive-speaker-compositions.v1.json public/dore-design/runtime/olive-speaker-compositions.v1.json
      - name: Verify Olive Mountain in Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          # /olive/ is generated by the canonical Hugo surface-carrier template.
          # olive/index.html is intentionally excluded from the static mount.
          test -s public/olive/index.html
          test -s public/olive/olive.js
          test -s public/dore-design/runtime/olive-speaker-compositions.v1.json
          grep -q 'olive-home-stage' public/olive/index.html
          grep -q 'olive-speaker-rail' public/olive/index.html
          grep -q 'olive-editorial-rail.js' public/olive/index.html
          grep -q 'doreIndex' public/olive/olive.js
          python3 - <<'PY'
          import json
          from pathlib import Path
          records=json.loads(Path('public/dore-design/runtime/olive-speaker-compositions.v1.json').read_text())['records']
          assert len(records)==12, f'Expected 12 speaker covers, got {len(records)}'
          print('Olive Pages artifact verified: Hugo carrier HTML, JS, 12 Doré compositions')
          PY
      - name: Verify editorial candidate in Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          file=public/experiments/obys-editorial-home/index.html
          test -s "$file"
          grep -q 'Westside Watch — Editorial Candidate' "$file"
          grep -q 'chapter-inner' "$file"
          echo "Editorial candidate included in published artifact"
      - name: Restore canonical ONE Bible study application
        shell: bash
        run: |
          set -euo pipefail
          test -s static/one/index.html
          test -s static/one/one-app.js
          mkdir -p public/one
          cp -a static/one/. public/one/
          cmp static/one/index.html public/one/index.html
          grep -q 'id="cover-books"' public/one/index.html
          grep -q 'one-app.js' public/one/index.html
          echo "ONE canonical 66-book application staged at /one/"
      - name: Stage and verify Shupian cinema archive
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html styles.css app.js catalog.json health.html; do
            test -s "static/shupian/$file"
          done
          mkdir -p public/shupian
          cp -a static/shupian/. public/shupian/
          for file in index.html styles.css app.js catalog.json health.html; do
            cmp "static/shupian/$file" "public/shupian/$file"
          done
          grep -q 'id="grid"' public/shupian/index.html
          grep -q 'id="video"' public/shupian/index.html
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('public/shupian/catalog.json').read_text())
          titles=data['titles']
          assert len(titles) >= 1, 'Shupian historical Institute records missing'
          assert sum(len(x['episodes']) for x in titles) >= 10, 'Institute historical episode records regressed'
          assert any('異能研究所' in x['title'] for x in titles), 'Historical Institute records missing'
          banned={'manger-cross-1912','passion-of-christ-1903','the-general-1926','the-living-christ-1951','king-of-kings-1927','ten-commandments-1923','quo-vadis-1913','nosferatu-1922','perils-of-pauline-1914','beverly-hillbillies-1962','bonanza-1960','charade-1963','night-living-dead-1968','dementia-13-1963','terror-1963','the-kid-1921','sherlock-jr-1924','phantom-opera-1925','trip-to-the-moon-1902'}
          assert all(x['id'] not in banned for x in titles), 'Banned filler classics returned'
          institute=next(x for x in titles if x['id']=='the-institute-historical')
          assert institute.get('posterUrl','').startswith('https://www.classification.gov.au/'), 'Institute real key art regressed'
          assert len(institute['episodes']) == 10, 'Institute episode records missing'
          assert 'youtube' not in str(titles).lower(), 'YouTube media is prohibited'
          front=Path('public/shupian/index.html').read_text()
          import re
          match=re.search(r'<script id="catalog" type="application/json">(.*?)</script>',front,re.S)
          assert match, '数片 inline catalog is missing'
          inline=json.loads(match.group(1))
          assert inline == titles, '数片 HTML catalog differs from deployed catalog.json'
          assert len({x['id'] for x in titles}) == len(titles), '数片 duplicate work IDs'
          assert all('id' in x and x.get('title') and x.get('episodes') for x in titles), '数片 incomplete work data'
          assert 'grid.single' in front and 'feature-detail' in front, '数片 editorial feature layout regressed'
          assert '將軍號' not in front and '活死人之夜' not in front and '從馬槽到十字架' not in front, 'Legacy filler leaked into HTML'
          legacy=Path('public/paradiso/index.html').read_text()
          assert 'location.replace' in legacy and '/shupian/' in legacy, 'Legacy cinema still serves old catalog'
          print('Shupian Pages artifact verified: catalog, player, styles and historical episodes')
          PY
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published Shupian cinema archive
        shell: bash
        run: |
          set -euo pipefail
          base="${{ steps.deployment.outputs.page_url }}"
          base="${base%/}"
          for attempt in $(seq 1 12); do
            html="$(curl --fail --location --silent --show-error --max-time 20 "${base}/shupian/?verify=${GITHUB_SHA}" || true)"
            js="$(curl --fail --location --silent --show-error --max-time 20 "${base}/shupian/app.js?verify=${GITHUB_SHA}" || true)"
            json="$(curl --fail --location --silent --show-error --max-time 20 "${base}/shupian/catalog.json?verify=${GITHUB_SHA}" || true)"
            health="$(curl --fail --location --silent --show-error --max-time 20 "${base}/shupian/health.html?verify=${GITHUB_SHA}" || true)"
            if [[ "${html}" == *'id="grid"'* && "${html}" == *'id="video"'* && "${html}" == *'id="catalog"'* && "${json}" == *'異能研究所'* && "${json}" != *'將軍號'* && "${html}" != *'將軍號'* && "${health}" == *'RELEASE HEALTH'* ]]; then
              echo "Published Shupian cinema verified: ${base}/shupian/ at ${GITHUB_SHA}"
              exit 0
            fi
            echo "Shupian live verification not yet passing (attempt ${attempt}/12)"
            sleep 15
          done
          echo "::error::Shupian cinema or its archive absent from live GitHub Pages"
          exit 1

      - name: Verify published Olive Mountain
        shell: bash
        run: |
          set -euo pipefail
          base="${{ steps.deployment.outputs.page_url }}"
          base="${base%/}"
          for attempt in $(seq 1 12); do
            html="$(curl --fail --location --silent --show-error --max-time 20 "${base}/olive/?verify=${GITHUB_SHA}" || true)"
            js="$(curl --fail --location --silent --show-error --max-time 20 "${base}/olive/olive.js?verify=${GITHUB_SHA}" || true)"
            if [[ "${html}" == *'olive-home-stage'* && "${html}" == *'olive-speaker-rail'* && "${html}" == *'olive-editorial-rail.js'* && "${js}" == *'doreIndex'* ]]; then
              echo "Published Olive verified: ${base}/olive/ at commit ${GITHUB_SHA}"
              exit 0
            fi
            echo "Waiting for Olive deployment to propagate (attempt ${attempt}/12)"
            sleep 15
          done
          echo "::error::Olive HTML/JS changes absent from published Pages site"
          exit 1

      - name: Verify published ONE Bible study application
        shell: bash
        run: |
          set -euo pipefail
          base="${{ steps.deployment.outputs.page_url }}"
          base="${base%/}"
          for attempt in $(seq 1 12); do
            html="$(curl --fail --location --silent --show-error --max-time 20 "${base}/one/?verify=${GITHUB_SHA}" || true)"
            js="$(curl --fail --location --silent --show-error --max-time 20 "${base}/one/one-app.js?verify=${GITHUB_SHA}" || true)"
            if [[ "${html}" == *'id="one-cover"'* && "${html}" == *'id="cover-books"'* && "${html}" == *'id="book-grid"'* && "${html}" == *'one-app.js'* && "${js}" == *'book'* ]]; then
              echo "Published ONE 66-book Bible study application verified: ${base}/one/"
              exit 0
            fi
            echo "Waiting for ONE deployment to propagate (attempt ${attempt}/12)"
            sleep 15
          done
          echo "::error::ONE Bible study application is missing or replaced on the live site"
          exit 1

      - name: Verify published editorial candidate
        shell: bash
        run: |
          set -euo pipefail
          base="${{ steps.deployment.outputs.page_url }}"
          base="${base%/}"
          for attempt in $(seq 1 12); do
            html="$(curl --fail --location --silent --show-error --max-time 20 "${base}/experiments/obys-editorial-home/?verify=${GITHUB_SHA}" || true)"
            if [[ "${html}" == *'Westside Watch — Editorial Candidate'* && "${html}" == *'chapter-inner'* ]]; then
              echo "Published editorial candidate verified: ${base}/experiments/obys-editorial-home/"
              exit 0
            fi
            echo "Waiting for editorial candidate to propagate (attempt ${attempt}/12)"
            sleep 15
          done
          echo "::error::Editorial candidate absent from published Pages site"
          exit 1
