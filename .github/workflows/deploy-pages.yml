name: Deploy Westside Watch

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: "0.167.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Restore Vol.00 producer output
        uses: actions/cache/restore@v4
        with:
          path: preview/watch-city-vol00/hosanna/media/clips
          key: vol00-media-v2-
          restore-keys: |
            vol00-media-v2-
      - name: Verify Vol.00 producer output
        id: vol00_media
        shell: bash
        run: |
          clips=preview/watch-city-vol00/hosanna/media/clips
          webm=0
          jpg=0
          if [ -d "$clips" ]; then
            webm="$(find "$clips" -name '*.webm' -size +100k | wc -l)"
            jpg="$(find "$clips" -name '*.jpg' -size +10k | wc -l)"
          fi
          if [ "$webm" -eq 6 ] && [ "$jpg" -ge 13 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Vol.00 producer media cache is incomplete ($webm webm, $jpg jpg); deploy will continue without treating cache state as site authority."
          fi
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Install Hugo
        run: |
          wget -O "$RUNNER_TEMP/hugo.deb" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "$RUNNER_TEMP/hugo.deb"
      - name: Build site
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
