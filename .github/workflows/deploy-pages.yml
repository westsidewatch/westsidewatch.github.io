name: Deploy Westside Watch

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: "0.167.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Restore Vol.00 producer output
        uses: actions/cache/restore@v4
        with:
          path: preview/watch-city-vol00/hosanna/media/clips
          key: vol00-media-v2-
          restore-keys: |
            vol00-media-v2-
      - name: Verify Vol.00 producer output
        id: vol00_media
        shell: bash
        run: |
          clips=preview/watch-city-vol00/hosanna/media/clips
          webm=0
          jpg=0
          if [ -d "$clips" ]; then
            webm="$(find "$clips" -name '*.webm' -size +100k | wc -l)"
            jpg="$(find "$clips" -name '*.jpg' -size +10k | wc -l)"
          fi
          if [ "$webm" -eq 6 ] && [ "$jpg" -ge 13 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Vol.00 producer media cache is incomplete ($webm webm, $jpg jpg); deploy will continue without treating cache state as site authority."
          fi
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Install Hugo
        run: |
          wget -O "$RUNNER_TEMP/hugo.deb" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "$RUNNER_TEMP/hugo.deb"
      - name: Build site
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Stage Olive JavaScript and composition data
        shell: bash
        run: |
          set -euo pipefail
          # Preserve Hugo's canonical /olive/ HTML; never overwrite it with legacy root HTML.
          test -s public/olive/index.html
          test -s olive/olive.js
          mkdir -p public/olive public/dore-design/runtime
          cp olive/olive.js public/olive/olive.js
          cp static/dore-design/runtime/olive-speaker-compositions.v1.json public/dore-design/runtime/olive-speaker-compositions.v1.json
      - name: Verify Olive Mountain in Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          # /olive/ is generated by the canonical Hugo surface-carrier template.
          # olive/index.html is intentionally excluded from the static mount.
          test -s public/olive/index.html
          test -s public/olive/olive.js
          test -s public/dore-design/runtime/olive-speaker-compositions.v1.json
          grep -q 'olive-home-stage' public/olive/index.html
          grep -q 'olive-speaker-rail' public/olive/index.html
          grep -q 'olive-editorial-rail.js' public/olive/index.html
          grep -q 'doreIndex' public/olive/olive.js
          python3 - <<'PY'
          import json
          from pathlib import Path
          records=json.loads(Path('public/dore-design/runtime/olive-speaker-compositions.v1.json').read_text())['records']
          assert len(records)==12, f'Expected 12 speaker covers, got {len(records)}'
          print('Olive Pages artifact verified: Hugo carrier HTML, JS, 12 Doré compositions')
          PY
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published Olive Mountain
        shell: bash
        run: |
          set -euo pipefail
          base="${{ steps.deployment.outputs.page_url }}"
          base="${base%/}"
          for attempt in $(seq 1 12); do
            html="$(curl --fail --location --silent --show-error --max-time 20 "${base}/olive/?verify=${GITHUB_SHA}" || true)"
            js="$(curl --fail --location --silent --show-error --max-time 20 "${base}/olive/olive.js?verify=${GITHUB_SHA}" || true)"
            if [[ "${html}" == *'olive-home-stage'* && "${html}" == *'olive-speaker-rail'* && "${html}" == *'olive-editorial-rail.js'* && "${js}" == *'doreIndex'* ]]; then
              echo "Published Olive verified: ${base}/olive/ at commit ${GITHUB_SHA}"
              exit 0
            fi
            echo "Waiting for Olive deployment to propagate (attempt ${attempt}/12)"
            sleep 15
          done
          echo "::error::Olive HTML/JS changes absent from published Pages site"
          exit 1
