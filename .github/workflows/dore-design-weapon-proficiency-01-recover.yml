name: DORE Design Weapon Proficiency 01 Recover

on:
  pull_request:
    paths:
      - '.github/workflows/dore-design-weapon-proficiency-01-recover.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dore-design-weapon-proficiency-01-recover
  cancel-in-progress: false

jobs:
  recover:
    runs-on: [self-hosted, macOS, dore]
    timeout-minutes: 10
    steps:
      - name: Integrate completed Round 01 without retraining
        env:
          GH_PUSH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          WT="$HOME/.dore/design-weapon-proficiency-01"
          test -d "$WT/.git" -o -f "$WT/.git"
          cd "$WT"

          test -f dore-design/training/evidence/round-01/report.json
          python3 - <<'PY'
          import json, pathlib
          d=json.loads(pathlib.Path('dore-design/training/evidence/round-01/report.json').read_text())
          assert d.get('designer') == 'dore'
          assert d.get('round') == 1
          assert len(d.get('candidates', [])) == 4
          for c in d['candidates']:
              assert len(c.get('beforeRaster') or {}) == 2
              assert len(c.get('afterRaster') or {}) == 2
          assert d.get('winner') is None
          assert d.get('productionPromoted') is False
          assert d.get('canonicalWorkspaceMutated') is False
          print('DORE_WEAPON_PROFICIENCY_01_RECOVERY_EVIDENCE=PASS')
          PY

          DORE_COMMIT="$(git rev-parse HEAD)"
          test "$(git log -1 --pretty=%s "$DORE_COMMIT")" = 'DORÉ Design: complete weapon proficiency round 01'
          echo "RECOVERING_DORE_COMMIT=$DORE_COMMIT"

          AUTH="$(printf 'x-access-token:%s' "$GH_PUSH_TOKEN" | base64)"
          HEADER="AUTHORIZATION: basic $AUTH"
          git -c http.https://github.com/.extraheader="$HEADER" fetch origin dore/design-weapon-proficiency-01
          REMOTE="$(git rev-parse FETCH_HEAD)"
          echo "REMOTE_HEAD=$REMOTE"

          # Never rewrite either history. Put the completed Doré evidence on top of the current
          # control-plane branch with an explicit two-parent merge.
          git checkout --detach "$DORE_COMMIT"
          git config user.name 'dore-control-plane'
          git config user.email 'dore-control-plane@users.noreply.github.com'
          git merge --no-ff --no-edit "$REMOTE"
          MERGED="$(git rev-parse HEAD)"
          test "$(git rev-list --parents -n 1 "$MERGED" | awk '{print NF}')" -eq 3
          test -f dore-design/training/evidence/round-01/report.json
          echo "INTEGRATED_HEAD=$MERGED"

          git -c http.https://github.com/.extraheader="$HEADER" \
            push origin HEAD:refs/heads/dore/design-weapon-proficiency-01
          echo 'DORE_WEAPON_PROFICIENCY_01_TRANSPORT=PASS'
