name: Doré P01 Pages Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'functions/api/dore/video-subtitle.js'
      - 'functions/api/dore/video-subtitle-result.js'
      - 'functions/api/dore/subtitle-proofread.js'
      - 'functions/api/dore/openai-response.js'
      - 'functions/api/dore/respond.js'
      - 'functions/api/dore/conversation.js'
      - 'static/dore/dore-search-runtime.js'
      - 'static/dore/dore-search.js'
      - 'static/dore/dore-reference-router.js'
      - 'static/dore/dore-scripture-reference-parser.js'
      - 'scripts/dore/chatgpt-bridge-gate.mjs'
      - 'static/dore/dore-video-subtitle-router.js'
      - 'static/dore/dore-brain-bridge.js'
      - 'static/dore/search/index.html'
      - 'cloudflare/d1/**'
      - '.github/workflows/dore-p01-pages-deploy.yml'

permissions:
  contents: read

concurrency:
  group: dore-p01-pages-production
  cancel-in-progress: false

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true
      - name: Build Hugo site with Pages Functions
        run: hugo --gc --minify
      - name: Verify P01 production bundle contains v5 executor and reader route
        run: |
          grep -q "dore.video-subtitle.v5" functions/api/dore/video-subtitle.js
          grep -q "youtube-advertised-caption-acquisition" functions/api/dore/video-subtitle.js
          grep -q "dore.video-subtitle-result.v1" functions/api/dore/video-subtitle-result.js
          grep -q "dore-video-subtitle-router.js" static/dore/dore-brain-bridge.js
          node --check static/dore/dore-search.js
          node --check static/dore/dore-reference-router.js
          node --check static/dore/dore-scripture-reference-parser.js
          node scripts/dore/chatgpt-bridge-gate.mjs
      - name: Deploy production Pages bundle
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'CLOUDFLARE_API_TOKEN is not configured'; exit 78; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'CLOUDFLARE_ACCOUNT_ID is not configured'; exit 78; }
          npx --yes wrangler@4 pages deploy public \
            --project-name=westsidewatch-github-io \
            --branch=main \
            --commit-hash="${GITHUB_SHA}" \
            --commit-message="Doré P01 production ${GITHUB_SHA}"
      - name: Verify live production exposes P01 v5 executors
        run: |
          node - <<'NODE'
          const url='https://westsidewatch-github-io.pages.dev/api/dore/video-subtitle';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          for(let i=1;i<=24;i++){
            try{
              const r=await fetch(url,{headers:{accept:'application/json'},cache:'no-store'});
              const d=await r.json();
              const ok=r.ok&&d.schema==='dore.video-subtitle.v5'&&Array.isArray(d.executors)&&d.executors.includes('youtube-advertised-caption-acquisition')&&d.executors.includes('dore-vtt-proofread');
              console.log(JSON.stringify({attempt:i,http:r.status,schema:d.schema,executors:d.executors||null}));
              if(ok) process.exit(0);
            }catch(e){console.log(JSON.stringify({attempt:i,error:String(e)}))}
            await sleep(5000);
          }
          process.exit(1);
          NODE
      - name: Verify live Doré ChatGPT binding
        run: |
          node - <<'NODE'
          const url='https://westsidewatch-github-io.pages.dev/api/dore/conversation';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          for(let i=1;i<=24;i++){
            try{
              const r=await fetch(url,{headers:{accept:'application/json'},cache:'no-store'});
              const d=await r.json();
              const ok=r.ok&&d.schema==='dore.search-chatgpt-readiness.v1'&&d.configured===true&&d.provider?.name==='openai'&&d.provider?.api==='responses';
              console.log(JSON.stringify({attempt:i,http:r.status,schema:d.schema,configured:d.configured??null,provider:d.provider||null,error:d.error||null}));
              if(ok) process.exit(0);
            }catch(e){console.log(JSON.stringify({attempt:i,error:String(e)}))}
            await sleep(5000);
          }
          process.exit(1);
          NODE
