name: Doré P01 Pages Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'functions/api/dore/video-subtitle.js'
      - 'functions/api/dore/video-subtitle-result.js'
      - 'functions/api/dore/subtitle-proofread.js'
      - 'functions/api/dore/conversation.js'
      - 'functions/api/dore/workers-ai-response.js'
      - 'static/dore/dore-search-runtime.js'
      - 'static/dore/dore-search.js'
      - 'static/dore/dore-reference-router.js'
      - 'static/dore/dore-scripture-reference-parser.js'
      - 'static/dore/dore-video-subtitle-router.js'
      - 'static/dore/dore-brain-bridge.js'
      - 'static/dore/search/index.html'
      - 'cloudflare/d1/**'
      - '.github/workflows/dore-p01-pages-deploy.yml'

permissions:
  contents: read

concurrency:
  group: dore-p01-pages-production
  cancel-in-progress: false

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true
      - name: Build Hugo site with Pages Functions
        run: hugo --gc --minify
      - name: Verify P01 production bundle
        run: |
          grep -q "dore.video-subtitle.v5" functions/api/dore/video-subtitle.js
          grep -q "youtube-advertised-caption-acquisition" functions/api/dore/video-subtitle.js
          grep -q "dore.video-subtitle-result.v1" functions/api/dore/video-subtitle-result.js
          node --check static/dore/dore-search.js
          node --check static/dore/dore-search-runtime.js
      - name: Verify AI cost boundary and explicit mode contract
        run: |
          grep -q "cloudflare-workers-ai" functions/api/dore/conversation.js
          grep -q "env.AI.run" functions/api/dore/workers-ai-response.js
          ! grep -R -q "api.openai.com" functions/api/dore/conversation.js functions/api/dore/workers-ai-response.js
          grep -q "MODE_KEY='dore.ai.mode.v1'" static/dore/dore-search-runtime.js
          grep -q "isOpenCommand" static/dore/dore-search-runtime.js
          grep -q "isCloseCommand" static/dore/dore-search-runtime.js
          grep -q "Search mode is the default" static/dore/dore-search-runtime.js
      - name: Deploy production Pages bundle
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'CLOUDFLARE_API_TOKEN is not configured'; exit 78; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'CLOUDFLARE_ACCOUNT_ID is not configured'; exit 78; }
          npx --yes wrangler@4 pages deploy public \
            --project-name=westsidewatch-github-io \
            --branch=main \
            --commit-hash="${GITHUB_SHA}" \
            --commit-message="Doré P01 production ${GITHUB_SHA}"
      - name: Verify live production exposes P01 v5 executors
        run: |
          node - <<'NODE'
          const url='https://westsidewatch-github-io.pages.dev/api/dore/video-subtitle';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          for(let i=1;i<=24;i++){
            try{
              const r=await fetch(url,{headers:{accept:'application/json'},cache:'no-store'});
              const d=await r.json();
              const ok=r.ok&&d.schema==='dore.video-subtitle.v5'&&Array.isArray(d.executors)&&d.executors.includes('youtube-advertised-caption-acquisition')&&d.executors.includes('dore-vtt-proofread');
              if(ok) process.exit(0);
            }catch(e){}
            await sleep(5000);
          }
          process.exit(1);
          NODE
      - name: Verify Doré Workers AI binding state
        run: |
          node - <<'NODE'
          const r=await fetch('https://westsidewatch-github-io.pages.dev/api/dore/conversation',{headers:{accept:'application/json'},cache:'no-store'});
          const d=await r.json();
          console.log(JSON.stringify({http:r.status,schema:d.schema,configured:d.configured,provider:d.provider||null,model:d.model||null}));
          if(!(r.ok&&d.schema==='dore.workers-ai-readiness.v1'&&d.configured===true&&d.provider?.name==='cloudflare-workers-ai'))process.exit(1);
          NODE
      - name: Live Doré Workers AI conversation smoke test
        run: |
          node - <<'NODE'
          const url='https://westsidewatch-github-io.pages.dev/api/dore/conversation';
          const conversation_id=`deploy-smoke-${Date.now()}`;
          const r=await fetch(url,{method:'POST',headers:{'content-type':'application/json',accept:'application/json'},body:JSON.stringify({query:'請只回答：Workers AI 已連線',conversation_id,project_id:'dore-deploy-smoke',actor_id:'ci',max_output_tokens:32})});
          const d=await r.json();
          console.log(JSON.stringify({http:r.status,ok:d.ok,schema:d.schema,provider:d.provider||null,answer:d.answer||null,error:d.error||null,detail:d.detail||null}));
          const ok=r.ok&&d.ok===true&&d.schema==='dore.search-workers-ai-conversation.v1'&&d.provider?.name==='cloudflare-workers-ai'&&typeof d.answer==='string'&&d.answer.trim().length>0;
          if(!ok)process.exit(1);
          NODE
      - name: Verify Doré continuous memory across turns
        run: |
          node - <<'NODE'
          const url='https://westsidewatch-github-io.pages.dev/api/dore/conversation';
          const conversation_id=`memory-smoke-${Date.now()}`;
          const project_id='dore-memory-smoke';
          const token=`MEM-${Date.now()}-ORCHID`;
          const ask=async query=>{
            const r=await fetch(url,{method:'POST',headers:{'content-type':'application/json',accept:'application/json'},body:JSON.stringify({query,conversation_id,project_id,actor_id:'ci-memory',max_output_tokens:80})});
            const d=await r.json();
            console.log(JSON.stringify({http:r.status,ok:d.ok,query,answer:d.answer||null,memory:d.memory||null,error:d.error||null,detail:d.detail||null}));
            if(!(r.ok&&d.ok===true))process.exit(1);
            return d;
          };
          await ask(`請記住這個驗收碼：${token}。只回答「記住了」。`);
          const second=await ask('我剛才給你的驗收碼是什麼？只回答驗收碼。');
          if(!String(second.answer||'').includes(token)){
            console.error(`continuous memory failed: expected ${token}`);
            process.exit(1);
          }
          if(!(second.memory?.used===true&&Number(second.memory?.count)>=1)){
            console.error('continuous memory retrieval metadata did not confirm prior-turn use');
            process.exit(1);
          }
          console.log(JSON.stringify({continuous_memory:'PASS',token,memory:second.memory,answer:second.answer}));
          NODE
