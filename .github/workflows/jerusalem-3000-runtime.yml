name: Jerusalem 3000 Runtime
on:
  pull_request:
    paths: ['preview/jerusalem-3000/**', 'scripts/verify_jerusalem_3000_*.mjs', 'scripts/audit_jerusalem_3000_foundation_gaps.mjs', 'scripts/audit_jerusalem_3000_landmark_execution.mjs', 'scripts/jerusalem3000_ingest_dem30.py', 'scripts/ingest_jerusalem_3000_wall_reference.py', 'scripts/ingest_jerusalem_3000_core_reference.py', 'scripts/lib/jerusalem-foundation-gap-audit.mjs', '.github/workflows/jerusalem-3000-runtime.yml']
  push:
    branches: [main]
    paths: ['preview/jerusalem-3000/**', 'scripts/verify_jerusalem_3000_*.mjs', 'scripts/audit_jerusalem_3000_foundation_gaps.mjs', 'scripts/audit_jerusalem_3000_landmark_execution.mjs', 'scripts/jerusalem3000_ingest_dem30.py', 'scripts/ingest_jerusalem_3000_wall_reference.py', 'scripts/ingest_jerusalem_3000_core_reference.py', 'scripts/lib/jerusalem-foundation-gap-audit.mjs', '.github/workflows/jerusalem-3000-runtime.yml']
permissions:
  contents: read
jobs:
  city-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install test dependencies
        run: npm install --no-save playwright@1.55.0 three@0.180.0
      - name: Parse every city module and verify lifecycle projection
        run: |
          set -euo pipefail
          for file in preview/jerusalem-3000/*.js; do node --check "$file"; done
          node scripts/verify_jerusalem_3000_foundation_gaps.mjs
          node scripts/verify_jerusalem_3000_foundation_plan.mjs
          node scripts/verify_jerusalem_3000_landmark_programme.mjs
          node scripts/verify_jerusalem_3000_foundation_runtime.mjs
          node scripts/verify_jerusalem_3000_phase_registration.mjs
          node scripts/verify_jerusalem_3000_terrain_presentation.mjs
          node scripts/verify_jerusalem_3000_metric_residential.mjs
          node scripts/verify_jerusalem_3000_urban_coverage.mjs
          node scripts/verify_jerusalem_3000_housing_boundary.mjs
          node scripts/verify_jerusalem_3000_regional_terrain.mjs
          node scripts/verify_jerusalem_3000_precinct_reservations.mjs
          node scripts/verify_jerusalem_3000_haram_court.mjs
          node scripts/verify_jerusalem_3000_architectural_ground.mjs
          node scripts/verify_jerusalem_3000_herodian_dimensions.mjs
          node scripts/verify_jerusalem_3000_royal_relief.mjs
          node scripts/verify_jerusalem_3000_city_lifecycle.mjs
          node scripts/verify_jerusalem_3000_data_loader.mjs
          node scripts/verify_jerusalem_3000_continuity_ledger.mjs
          node scripts/verify_jerusalem_3000_royal_adapter.mjs
          node scripts/verify_jerusalem_3000_royal_spatial.mjs
      - name: Install browser
        run: |
          npx playwright install --with-deps chromium
      - name: Verify bounded shared generation
        run: |
          node scripts/verify_jerusalem_3000_playback.mjs
          node scripts/verify_jerusalem_3000_construction_reveal.mjs
          node scripts/verify_jerusalem_3000_construction_presentation.mjs
          node scripts/verify_jerusalem_3000_shared_era.mjs
          node scripts/verify_jerusalem_3000_period_spatial.mjs
          node scripts/verify_jerusalem_3000_district_infill.mjs
          node scripts/verify_jerusalem_3000_residential_ledger.mjs
          node scripts/verify_jerusalem_3000_water_defense.mjs
          node scripts/verify_jerusalem_3000_water_defense_adapter.mjs
          node scripts/verify_jerusalem_3000_local_plan.mjs
          node scripts/verify_jerusalem_3000_low_rise.mjs
          node scripts/verify_jerusalem_3000_persian_sanctuary.mjs
          node scripts/verify_jerusalem_3000_hellenistic_sanctuary.mjs
          node scripts/verify_jerusalem_3000_earliest.mjs
          node scripts/verify_jerusalem_3000_settlement_ledger.mjs
          node scripts/verify_jerusalem_3000_later_ledger.mjs
          node scripts/verify_jerusalem_3000_inheritance_audit.mjs
          node scripts/verify_jerusalem_3000_evidence_visibility.mjs
          node scripts/verify_jerusalem_3000_canonical_events.mjs
          node scripts/verify_jerusalem_3000_source_scopes.mjs
          node scripts/verify_jerusalem_3000_source_spatial.mjs
          node scripts/verify_jerusalem_3000_spatial_skeleton.mjs
          node scripts/verify_jerusalem_3000_city_enclosure.mjs
          node scripts/verify_jerusalem_3000_named_city_gates.mjs
          node scripts/verify_jerusalem_3000_wall_reference.mjs
          node scripts/verify_jerusalem_3000_defense_sources.mjs
          node scripts/verify_jerusalem_3000_defense_timeline.mjs
          node scripts/verify_jerusalem_3000_shared_places.mjs
          node scripts/verify_jerusalem_3000_persistent_world.mjs
          node scripts/verify_jerusalem_3000_independent_later.mjs
          node scripts/verify_jerusalem_3000_landmark_chronology.mjs
          node scripts/verify_jerusalem_3000_module_shapes.mjs
          node scripts/verify_jerusalem_3000_overview_housing.mjs
      - name: Render the proposed city and scrub through destruction
        run: |
          python3 -m http.server 8765 > /tmp/j3k-server.log 2>&1 &
          node scripts/verify_jerusalem_3000_browser.mjs
          node scripts/verify_jerusalem_3000_medieval_browser.mjs
          node scripts/verify_jerusalem_3000_hellenistic_sanctuary_browser.mjs
          node scripts/verify_jerusalem_3000_landmark_chronology_browser.mjs
          node scripts/verify_jerusalem_3000_depth_court_browser.mjs
          node scripts/verify_jerusalem_3000_callouts_ground_browser.mjs
          node scripts/verify_jerusalem_3000_enclosure_gates_browser.mjs
          node scripts/verify_jerusalem_3000_overview_browser.mjs
          node scripts/audit_jerusalem_3000_landmark_execution.mjs --report work/j3k-validation/overview-proof.json --render-commit "$GITHUB_SHA" --out work/j3k-validation/landmark-execution-audit
          node scripts/verify_jerusalem_3000_playback_browser.mjs
          node scripts/verify_jerusalem_3000_transition_browser.mjs
          node scripts/verify_jerusalem_3000_defense_browser.mjs
          node scripts/verify_jerusalem_3000_landscape_browser.mjs
          node scripts/verify_jerusalem_3000_housing_boundary_browser.mjs
          node scripts/verify_jerusalem_3000_metric_residential_browser.mjs
          node scripts/audit_jerusalem_3000_foundation_gaps.mjs --report work/j3k-validation/phase-report.json --render-commit "$GITHUB_SHA" --out work/j3k-validation/foundation-gap-audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jerusalem-3000-runtime-evidence
          path: work/j3k-validation/
