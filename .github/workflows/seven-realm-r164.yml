name: R164 paired-square evolution proof
on:
  push:
    branches: [design/paired-square-evolution-r164-20261127]
  pull_request:
    branches: [research/seven-realm-visual-system-r124-20261126]
permissions:
  contents: read
jobs:
  proof:
    if: github.event_name == 'push' || github.head_ref == 'design/paired-square-evolution-r164-20261127'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 4173 --directory static >/tmp/r164-server.log 2>&1 &
          node tests/seven-realm-r164.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seven-realm-r164
          path: artifacts/r164/
