name: Load ONE wisdom Scripture layer
on:
  push:
    branches: [one/wisdom-major-prophets-scripture]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: one/wisdom-major-prophets-scripture
      - name: Load wisdom Scripture after canonical layer
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('static/one/index.html')
          s=p.read_text()
          marker='<script src="./one-cross-reference-scripture.js?v=20260821g"></script>'
          add=marker+'<script src="./one-cross-reference-scripture-wisdom.js?v=20260821a"></script>'
          if 'one-cross-reference-scripture-wisdom.js' not in s:
              if marker not in s:
                  raise SystemExit('canonical Scripture marker not found')
              p.write_text(s.replace(marker,add,1))
          PY
      - name: Commit index load order
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add static/one/index.html
          git commit -m "Load wisdom cross-reference Scripture layer"
          git push origin HEAD:one/wisdom-major-prophets-scripture
