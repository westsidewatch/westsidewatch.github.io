name: Load ONE wisdom and major-prophet Scripture layers
on:
  push:
    branches: [one/wisdom-major-prophets-scripture]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: one/wisdom-major-prophets-scripture
      - name: Load reviewed Scripture layers after canonical layer
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('static/one/index.html')
          s=p.read_text()
          wisdom='<script src="./one-cross-reference-scripture-wisdom.js?v=20260821a"></script>'
          major='<script src="./one-cross-reference-scripture-major-prophets.js?v=20260821a"></script>'
          if wisdom not in s:
              marker='<script src="./one-cross-reference-scripture.js?v=20260821g"></script>'
              if marker not in s: raise SystemExit('canonical Scripture marker not found')
              s=s.replace(marker,marker+wisdom,1)
          if major not in s:
              if wisdom not in s: raise SystemExit('wisdom layer marker not found')
              s=s.replace(wisdom,wisdom+major,1)
          p.write_text(s)
          PY
      - name: Commit index load order
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add static/one/index.html
          git commit -m "Load major-prophet cross-reference Scripture layer"
          git push origin HEAD:one/wisdom-major-prophets-scripture
