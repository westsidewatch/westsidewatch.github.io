name: Doré Corpus Admission

on:
  workflow_dispatch:
    inputs:
      source:
        description: Corpus source
        required: true
        default: eebo-tcp-phase1
        type: choice
        options: [eebo-tcp-phase1]
      limit:
        description: Optional record limit; 0 means full catalogue
        required: true
        default: '0'
        type: string
      authority_enrichment:
        description: Optional authority enrichment; never required for Dawn reading
        required: true
        default: 'none'
        type: choice
        options: [none, openlibrary-local-cache]
  push:
    paths:
      - 'dore_core/corpus/**'
      - 'data/dawn-corpus/bulk/**'
      - 'data/dawn-corpus/admission/**'
      - '.github/workflows/dore-corpus-admission.yml'
permissions:
  contents: read
jobs:
  admission:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Resolve admission mode
        id: mode
        run: |
          LIMIT="1000"; AUTHORITY="none"; REQUEST="data/dawn-corpus/admission/full-eebo-remote-holdings.request.json"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then LIMIT="${{ inputs.limit }}"; AUTHORITY="${{ inputs.authority_enrichment }}";
          elif [ -s "$REQUEST" ]; then
            REQUEST_MODE=$(python -c 'import json; print(json.load(open("data/dawn-corpus/admission/full-eebo-remote-holdings.request.json")).get("mode", ""))')
            REQUEST_LIMIT=$(python -c 'import json; print(json.load(open("data/dawn-corpus/admission/full-eebo-remote-holdings.request.json")).get("limit", 1000))')
            REQUEST_DOWNLOAD=$(python -c 'import json; print(str(json.load(open("data/dawn-corpus/admission/full-eebo-remote-holdings.request.json")).get("fullTextDownload", True)).lower())')
            if [ "$REQUEST_MODE" = "full-catalogue" ] && [ "$REQUEST_LIMIT" = "0" ] && [ "$REQUEST_DOWNLOAD" = "false" ]; then LIMIT="0"; fi
          fi
          echo "limit=$LIMIT" >> "$GITHUB_OUTPUT"; echo "authority=$AUTHORITY" >> "$GITHUB_OUTPUT"
      - name: Acquire EEBO-TCP catalogue metadata
        run: |
          git clone --depth 1 https://github.com/textcreationpartnership/Texts.git /tmp/tcp-texts
          test -s /tmp/tcp-texts/TCP.csv
      - name: Run admission and build UI consumption index
        env:
          DORE_CORPUS_LIMIT: ${{ steps.mode.outputs.limit }}
          DORE_AUTHORITY_MODE: ${{ steps.mode.outputs.authority }}
        run: |
          mkdir -p artifacts/dore-corpus
          LIMIT_ARGS=(); if [ "$DORE_CORPUS_LIMIT" != "0" ]; then LIMIT_ARGS=(--limit "$DORE_CORPUS_LIMIT"); fi
          AUTHORITY_ARGS=(); if [ "$DORE_AUTHORITY_MODE" = "openlibrary-local-cache" ] && [ -s data/dawn-corpus/authority/openlibrary-works.txt.gz ]; then AUTHORITY_ARGS=(--openlibrary data/dawn-corpus/authority/openlibrary-works.txt.gz); fi
          python -m dore_core.corpus.run_bulk_admission /tmp/tcp-texts/TCP.csv --format csv "${LIMIT_ARGS[@]}" "${AUTHORITY_ARGS[@]}" --out artifacts/dore-corpus/eebo-tcp-admission-report.json --catalogue-out artifacts/dore-corpus/dawn-library-catalogue.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          from dore_core.corpus.catalogue_consumption import enrich_languages, write_consumption_index
          p=Path('artifacts/dore-corpus/eebo-tcp-admission-report.json'); c=Path('artifacts/dore-corpus/dawn-library-catalogue.json')
          report=json.loads(p.read_text()); catalogue=enrich_languages(json.loads(c.read_text()))
          if report['sourceRecords']==0: raise SystemExit('EEBO-TCP admission emitted zero records')
          if catalogue['count']!=report['workCandidates']: raise SystemExit('catalogue/work candidate count mismatch')
          index=write_consumption_index(catalogue, 'artifacts/dore-corpus/dawn-library', page_size=250)
          report['requestedLimit']=int(os.environ['DORE_CORPUS_LIMIT']); report['fullCatalogueRun']=os.environ['DORE_CORPUS_LIMIT']=='0'; report['holdingsModel']='remote-pointer-on-demand-reading'
          report['catalogueManifest']={'schema':catalogue['schema'],'works':catalogue['count'],'file':c.name}
          report['consumptionIndex']={'schema':index['schema'],'works':index['count'],'pageSize':index['pageSize'],'pageCount':index['pageCount'],'file':'dawn-library/index.json'}
          report['readingContract']={'catalogueAdmissionRequiresFullTextDownload':False,'authorityEnrichmentRequiredForReading':False,'initialFullCatalogueLoad':False,'contentFetch':'on-demand when a reader opens source/zh-Hant/bilingual text','translation':'Doré Language Faculty after readable source resolution'}
          c.write_text(json.dumps(catalogue,ensure_ascii=False,separators=(',',':'))+'\n'); p.write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(report,indent=2,ensure_ascii=False))
          PY
      - name: Upload admission and reader catalogue artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dore-corpus-admission-report
          path: artifacts/dore-corpus/
          retention-days: 30
