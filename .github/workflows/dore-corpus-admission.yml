name: Doré Corpus Admission

on:
  workflow_dispatch:
    inputs:
      source:
        description: Corpus source
        required: true
        default: eebo-tcp-phase1
        type: choice
        options:
          - eebo-tcp-phase1
      limit:
        description: Optional record limit; 0 means full catalogue
        required: true
        default: '0'
        type: string
  push:
    paths:
      - 'dore_core/corpus/**'
      - 'data/dawn-corpus/bulk/**'
      - 'data/dawn-corpus/admission/**'
      - '.github/workflows/dore-corpus-admission.yml'

permissions:
  contents: read

jobs:
  admission:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Acquire EEBO-TCP catalogue
        run: |
          git clone --depth 1 https://github.com/textcreationpartnership/Texts.git /tmp/tcp-texts
          test -s /tmp/tcp-texts/TCP.csv
      - name: Acquire Open Library Works authority dump
        run: |
          curl --fail --location --retry 3 \
            https://openlibrary.org/data/ol_dump_works_latest.txt.gz \
            --output /tmp/ol_dump_works_latest.txt.gz
          test -s /tmp/ol_dump_works_latest.txt.gz
      - name: Run Doré corpus admission with authority reconciliation
        env:
          DORE_CORPUS_LIMIT: ${{ inputs.limit || '1000' }}
        run: |
          mkdir -p artifacts/dore-corpus
          LIMIT_ARGS=()
          if [ "$DORE_CORPUS_LIMIT" != "0" ]; then
            LIMIT_ARGS=(--limit "$DORE_CORPUS_LIMIT")
          fi
          python -m dore_core.corpus.run_bulk_admission \
            /tmp/tcp-texts/TCP.csv \
            --format csv \
            "${LIMIT_ARGS[@]}" \
            --openlibrary /tmp/ol_dump_works_latest.txt.gz \
            --out artifacts/dore-corpus/eebo-tcp-admission-report.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('artifacts/dore-corpus/eebo-tcp-admission-report.json')
          report = json.loads(p.read_text())
          if report['sourceRecords'] == 0:
              raise SystemExit('EEBO-TCP admission emitted zero records')
          if 'OpenLibrary' not in report.get('authority', {}).get('sources', []):
              raise SystemExit('Open Library authority reconciliation did not run')
          print(json.dumps(report, indent=2, ensure_ascii=False))
          PY
      - name: Upload admission report
        uses: actions/upload-artifact@v4
        with:
          name: dore-corpus-admission-report
          path: artifacts/dore-corpus/
          retention-days: 30
