name: Doré Corpus Admission

on:
  workflow_dispatch:
    inputs:
      source:
        description: Corpus source
        required: true
        default: eebo-tcp-phase1
        type: choice
        options:
          - eebo-tcp-phase1
      limit:
        description: Optional record limit; 0 means full corpus
        required: true
        default: '0'
        type: string
  push:
    paths:
      - 'dore_core/corpus/**'
      - '.github/workflows/dore-corpus-admission.yml'

permissions:
  contents: read

jobs:
  admission:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Acquire EEBO-TCP Phase I metadata/corpus
        if: ${{ inputs.source == 'eebo-tcp-phase1' || github.event_name == 'push' }}
        run: |
          git clone --depth 1 https://github.com/textcreationpartnership/Texts.git /tmp/tcp-texts
      - name: Run Doré corpus admission
        env:
          DORE_CORPUS_LIMIT: ${{ inputs.limit || '1000' }}
        run: |
          mkdir -p artifacts/dore-corpus
          LIMIT_ARGS=()
          if [ "$DORE_CORPUS_LIMIT" != "0" ]; then
            LIMIT_ARGS=(--limit "$DORE_CORPUS_LIMIT")
          fi
          python -m dore_core.corpus.run_bulk_admission \
            /tmp/tcp-texts \
            --format tei \
            "${LIMIT_ARGS[@]}" \
            --out artifacts/dore-corpus/eebo-tcp-admission-report.json
      - name: Upload admission report
        uses: actions/upload-artifact@v4
        with:
          name: dore-corpus-admission-report
          path: artifacts/dore-corpus/
          retention-days: 30
