name: Doré Narrative Engine Tests

on:
  pull_request:
    paths:
      - 'tools/dore/narrative-engine/**'
      - '.github/workflows/dore-narrative-engine.yml'
  push:
    paths:
      - 'tools/dore/narrative-engine/**'
      - '.github/workflows/dore-narrative-engine.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  narrative-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Scene extraction and audit tests
        run: python3 tools/dore/narrative-engine/narrative.py test
      - name: Training exercises and evidence gate tests
        run: python3 tools/dore/narrative-engine/training_runner.py test
      - name: Revision loop tests
        run: python3 tools/dore/narrative-engine/revision_loop.py test
      - name: Local subprocess adapter integration test
        run: python3 tools/dore/narrative-engine/local_adapter.py test
      - name: Real Golden Gate manuscript integration test
        run: python3 tools/dore/narrative-engine/manuscript_integration_test.py
      - name: Revision history and feedback loop tests
        run: python3 tools/dore/narrative-engine/iteration.py test
      - name: Narrative climax regression tests
        run: python3 tools/dore/narrative-engine/climax_gate.py test
      - name: Golden Gate baseline completeness report
        run: python3 tools/dore/narrative-engine/climax_gate.py
      - name: Syntax validation
        run: python3 -m compileall -q tools/dore/narrative-engine
