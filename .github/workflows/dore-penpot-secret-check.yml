name: Doré Penpot Secret Check
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/dore-penpot-secret-check.yml'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check repository-side probe credential
        env:
          DORE_HEARTBEAT_TOKEN: ${{ secrets.DORE_HEARTBEAT_TOKEN }}
        run: |
          if [ -z "$DORE_HEARTBEAT_TOKEN" ]; then
            echo 'DORE_HEARTBEAT_TOKEN is not available to GitHub Actions; live probe must use another authorized execution path.'
            exit 2
          fi
          echo 'DORE_HEARTBEAT_TOKEN available; live probe can run.'
