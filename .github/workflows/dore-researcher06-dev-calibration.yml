name: Doré Researcher 06 Dev Calibration

on:
  push:
    branches: [main]
    paths:
      - 'scripts/dore/noise-retrieval-baseline.mjs'
      - 'scripts/dore/phonetic-encoders.mjs'
      - 'scripts/dore/phonetic-encoder-selftest.mjs'
      - 'dore-core/knowledge/researcher/fixtures/noise-retrieval-dev.json'
      - '.github/workflows/dore-researcher06-dev-calibration.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dore-researcher06-dev-calibration
  cancel-in-progress: false

jobs:
  dev-calibration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Encoder self-test
        run: node scripts/dore/phonetic-encoder-selftest.mjs
      - name: Run development retrieval measurement
        run: |
          mkdir -p dore-core/knowledge/researcher/evidence
          node scripts/dore/noise-retrieval-baseline.mjs --dev > /tmp/researcher06-dev.ndjson
          tail -n 1 /tmp/researcher06-dev.ndjson > dore-core/knowledge/researcher/evidence/researcher06-unit06-dev-summary.json
          cp /tmp/researcher06-dev.ndjson dore-core/knowledge/researcher/evidence/researcher06-unit06-dev.ndjson
      - name: Persist measured evidence
        run: |
          git config user.name 'Doré Researcher'
          git config user.email 'westsidewatchca@gmail.com'
          git add dore-core/knowledge/researcher/evidence/researcher06-unit06-dev-summary.json
          git add dore-core/knowledge/researcher/evidence/researcher06-unit06-dev.ndjson
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'test(dore): persist Researcher 06 dev calibration evidence [skip ci]'
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          exit 1
