name: Doré publish Lamentations 3 HQ

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - '.dore-upload/lam03-hq/**'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          fetch-depth: 0
      - name: Rebuild verified AVIF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p static/one/studio
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, re
          files=sorted(Path('.dore-upload/lam03-hq').glob('part-*.b64'))
          parts=[]
          for f in files:
              s=re.sub(rb'\s+',b'',f.read_bytes())
              print(f.name, 'chars=',len(s),'mod4=',len(s)%4,'pads=',s.count(b'='),'tail=',s[-12:])
              parts.append(s)
          joined=b''.join(parts)
          print('joined chars=',len(joined),'mod4=',len(joined)%4,'pads=',joined.count(b'='))
          out=base64.b64decode(joined, validate=False)
          target=Path('static/one/studio/lamentations-03-dore-studio-v1.avif')
          target.write_bytes(out)
          print('bytes=',len(out),'sha256=',hashlib.sha256(out).hexdigest())
          assert len(out)==92695
          assert hashlib.sha256(out).hexdigest()=='0716c9147109a93fd3ab1743a7e39d26c6a17b2844d0fea16274c0949cd61836'
          PY
      - name: Commit binary if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- static/one/studio/lamentations-03-dore-studio-v1.avif && git ls-files --error-unmatch static/one/studio/lamentations-03-dore-studio-v1.avif >/dev/null 2>&1; then
            echo "HQ AVIF already current"
            exit 0
          fi
          git config user.name "Westside Watch Doré Publisher"
          git config user.email "westsidewatchca@gmail.com"
          git add static/one/studio/lamentations-03-dore-studio-v1.avif
          git commit -m "asset(one): publish Lamentations 3 HQ Doré cover"
          git push origin HEAD
