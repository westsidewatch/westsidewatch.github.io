name: Doré publish Lamentations 3 HQ

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - '.dore-upload/lam03-hq/**'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          fetch-depth: 0
      - name: Recover and rebuild verified AVIF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p static/one/studio
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, re
          alphabet=b'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'
          expected='0716c9147109a93fd3ab1743a7e39d26c6a17b2844d0fea16274c0949cd61836'
          root=Path('.dore-upload/lam03-hq')
          files=sorted(root.glob('part-*.b64'))
          parts=[re.sub(rb'\s+',b'',f.read_bytes()) for f in files]
          bad=next(i for i,p in enumerate(parts) if len(p)%4)
          assert files[bad].name=='part-003.b64' and len(parts[bad])==9999
          before=b''.join(parts[:bad]); broken=parts[bad]; after=b''.join(parts[bad+1:])
          found=None
          for pos in range(len(broken)+1):
              prefix=before+broken[:pos]
              suffix=broken[pos:]+after
              for ch in alphabet:
                  joined=prefix+bytes((ch,))+suffix
                  try: out=base64.b64decode(joined,validate=True)
                  except Exception: continue
                  if len(out)==92695 and hashlib.sha256(out).hexdigest()==expected:
                      found=(pos,ch,out,broken[:pos]+bytes((ch,))+broken[pos:]); break
              if found: break
              if pos and pos%1000==0: print('searched',pos)
          if not found: raise SystemExit('missing base64 character not recovered')
          pos,ch,out,repaired=found
          print('recovered part-003 position',pos,'character',chr(ch))
          files[bad].write_bytes(repaired+b'\n')
          target=Path('static/one/studio/lamentations-03-dore-studio-v1.avif')
          target.write_bytes(out)
          print('bytes=',len(out),'sha256=',hashlib.sha256(out).hexdigest())
          PY
      - name: Commit repaired source and HQ binary
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Westside Watch Doré Publisher"
          git config user.email "westsidewatchca@gmail.com"
          git add .dore-upload/lam03-hq/part-003.b64 static/one/studio/lamentations-03-dore-studio-v1.avif
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "asset(one): recover and publish Lamentations 3 HQ Doré cover"
          git push origin HEAD
