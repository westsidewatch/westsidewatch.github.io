name: Doré publish Lamentations 3 HQ

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - '.dore-upload/lam03-hq/**'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          fetch-depth: 0
      - name: Rebuild verified AVIF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p static/one/studio
          cat .dore-upload/lam03-hq/part-*.b64 | base64 --decode > static/one/studio/lamentations-03-dore-studio-v1.avif
          bytes=$(wc -c < static/one/studio/lamentations-03-dore-studio-v1.avif | tr -d ' ')
          sha=$(sha256sum static/one/studio/lamentations-03-dore-studio-v1.avif | awk '{print $1}')
          test "$bytes" = "92695"
          test "$sha" = "0716c9147109a93fd3ab1743a7e39d26c6a17b2844d0fea16274c0949cd61836"
      - name: Commit binary if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- static/one/studio/lamentations-03-dore-studio-v1.avif && git ls-files --error-unmatch static/one/studio/lamentations-03-dore-studio-v1.avif >/dev/null 2>&1; then
            echo "HQ AVIF already current"
            exit 0
          fi
          git config user.name "Westside Watch Doré Publisher"
          git config user.email "westsidewatchca@gmail.com"
          git add static/one/studio/lamentations-03-dore-studio-v1.avif
          git commit -m "asset(one): publish Lamentations 3 HQ Doré cover"
          git push origin HEAD
