name: Holy Light Cinema
on:
  pull_request:
    paths:
      - 'cinema/**'
      - 'local/dore-local/video_reflex.py'
      - 'local/dore-local/video_reflex_acceptance.py'
      - '.github/workflows/holy-light-cinema.yml'
jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: test -f cinema/index.html && test -f cinema/cinema.css && test -f cinema/cinema.js && test -f cinema/data/video-resource.v0.json
      - run: python3 local/dore-local/video_reflex_acceptance.py
