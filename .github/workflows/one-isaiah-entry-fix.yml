name: Wire Isaiah entry fix
on:
  push:
    branches: [fix/one-isaiah-entry-detail]
permissions:
  contents: write
jobs:
  wire:
    if: ${{ !contains(github.event.head_commit.message, 'refresh Isaiah context assets') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/one-isaiah-entry-detail
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('static/one/index.html');s=p.read_text()
          s=s.replace('isaiah-context.js?v=20260816c','isaiah-context.js?v=20260816g')
          s=s.replace('isaiah-audit.js?v=20260816f','isaiah-audit.js?v=20260816g')
          p.write_text(s)
          PY
      - run: |
          git config user.name 'WATCHMAN'
          git config user.email 'westsidewatchca@gmail.com'
          git add static/one/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix(one): refresh Isaiah context assets'
          git push origin HEAD:fix/one-isaiah-entry-detail
