name: Doré Design Intelligence Acceptance

on:
  push:
    paths:
      - 'dore-design/design_intelligence_runtime.py'
      - 'dore-design/design2_phase8_http.py'
      - 'dore-design/design_intelligence_acceptance.py'
      - 'dore-design/app_design2.py'
      - 'local/dore-local/ui_taste_memory.py'
      - 'local/dore-local/ui_preference_field.py'
      - '.github/workflows/dore-design-intelligence-acceptance.yml'
  workflow_dispatch:

jobs:
  phase8-intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: |
          python3 -m py_compile \
            dore-design/design_intelligence_runtime.py \
            dore-design/design2_phase8_http.py \
            dore-design/design_intelligence_acceptance.py \
            local/dore-local/ui_taste_memory.py \
            local/dore-local/ui_preference_field.py \
            dore-design/app_design2.py
      - name: Deterministic preference loop
        env:
          PYTHONPATH: ${{ github.workspace }}/dore-design:${{ github.workspace }}/local/dore-local
        run: |
          python3 dore-design/design_intelligence_acceptance.py | tee /tmp/design-intelligence.json
          grep -q '"ok": true' /tmp/design-intelligence.json
      - name: Resident Phase 8 HTTP contract
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/dore-design:${{ github.workspace }}/local/dore-local
          DORE_DESIGN_DATA: ${{ runner.temp }}/design-intelligence-workspace
          DORE_DESIGN_PUBLICATION_REGISTRY: ${{ runner.temp }}/design-intelligence-publication.json
          DORE_DESIGN_RECOMMENDATION_LOG: ${{ runner.temp }}/design-intelligence-recommendations.json
          DORE_UI_TASTE_DB: ${{ runner.temp }}/design-intelligence-taste.sqlite3
          DORE_DESIGN_PORT: '4315'
        run: |
          set -euo pipefail
          python3 dore-design/workspace_cli.py get >/dev/null
          python3 dore-design/upgrade_living_fortress_v2.py >/dev/null
          python3 dore-design/app_design2.py >/tmp/design-intelligence-resident.log 2>&1 & pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:4315/api/design2/intelligence/health >/tmp/intelligence-health.json && break
            sleep .25
          done
          python3 - <<'PY'
          import json, urllib.request
          base='http://127.0.0.1:4315'
          h=json.load(open('/tmp/intelligence-health.json'))
          assert h['ok'] and h['phase']==8
          assert h['model_inference_connected'] is False
          def post(path,payload):
              req=urllib.request.Request(base+path,data=json.dumps(payload).encode(),headers={'Content-Type':'application/json'},method='POST')
              return json.load(urllib.request.urlopen(req))
          context={'surface_id':'fresh','surface_family':'fresh-family','task_context':'fresh test','primary_axis':'composition','viewport_context':'desktop','content_context':'bilingual','candidates':['A','B']}
          first=post('/api/design2/intelligence/route',context)
          assert first['decision']=='explore' and first['variant_generation_required'] is True
          for i in range(4):
              p=dict(context,candidate_a='A',candidate_b='B',winner='A',winner_reason='A observed stronger',loser_reason='B observed weaker',brand_fit='fresh-family',usability_floor_passed=True,evidence_refs=[f'http:{i}'],confidence=.95,scope='surface-family',surface_id=f'fresh-{i}')
              post('/api/design2/intelligence/comparison',p)
          final=post('/api/design2/intelligence/route',context)
          assert final['decision']=='exploit', final
          assert final['pair_prediction']['prediction']=='A', final
          print('DORE_DESIGN_INTELLIGENCE_RESIDENT_PASS')
          PY
