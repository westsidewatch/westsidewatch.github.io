name: Dawn Bulk Corpus Refresh

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: dawn-bulk-corpus-refresh
  cancel-in-progress: false

env:
  DAWN_GROWTH_STATE_BRANCH: dawn-autonomous-growth-state
  DAWN_PROMOTION_BATCH: '250000'

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout canonical baseline
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Restore autonomous harvest state
        run: |
          git fetch origin "$DAWN_GROWTH_STATE_BRANCH" || true
          git show "origin/$DAWN_GROWTH_STATE_BRANCH:data/dawn-harvest-ledger-openlibrary.json" > data/dawn-harvest-ledger-openlibrary.json 2>/dev/null || true
          git show "origin/$DAWN_GROWTH_STATE_BRANCH:data/dawn-10k-openlibrary-works.json" > data/dawn-10k-openlibrary-works.json 2>/dev/null || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh Dawn pre-canonical corpus
        run: python3 scripts/refresh_dawn_bulk_corpus.py

      - name: Index current library and project refreshed Chinese collection
        run: python3 scripts/build_dawn_library_index.py

      - name: Gate current canonical promotion queue
        run: python3 scripts/gate_dawn_canonical_promotion.py

      - name: Drain current canonical promotion queue
        run: python3 scripts/promote_dawn_canonical_batch.py

      - name: Persist harvest state only
        run: |
          set -euo pipefail
          state_dir="$(mktemp -d)"
          worktree_dir="$(mktemp -d)"
          cp data/dawn-harvest-ledger-openlibrary.json "$state_dir/ledger.json"
          cp data/dawn-10k-openlibrary-works.json "$state_dir/openlibrary.json"
          git config user.name "Dore CI"
          git config user.email "dore-ci@users.noreply.github.com"
          git fetch origin "$DAWN_GROWTH_STATE_BRANCH"
          git worktree add --detach "$worktree_dir" "origin/$DAWN_GROWTH_STATE_BRANCH"
          git -C "$worktree_dir" switch -C "$DAWN_GROWTH_STATE_BRANCH"
          mkdir -p "$worktree_dir/data"
          cp "$state_dir/ledger.json" "$worktree_dir/data/dawn-harvest-ledger-openlibrary.json"
          cp "$state_dir/openlibrary.json" "$worktree_dir/data/dawn-10k-openlibrary-works.json"
          git -C "$worktree_dir" add data/dawn-harvest-ledger-openlibrary.json data/dawn-10k-openlibrary-works.json
          if git -C "$worktree_dir" diff --cached --quiet; then
            echo "No autonomous harvest-state changes."
          else
            git -C "$worktree_dir" commit -m "data(dawn): advance autonomous harvest state [skip ci]"
            git -C "$worktree_dir" push origin "HEAD:$DAWN_GROWTH_STATE_BRANCH"
          fi
          git worktree remove --force "$worktree_dir"

      - name: Publish library scan and drained promotion artifact
        uses: actions/upload-artifact@v4
        with:
          name: dawn-canonical-promotion-candidate
          if-no-files-found: error
          retention-days: 14
          path: |
            data/dawn-library-build-index.json
            data/dawn-library-chinese-projection.json
            data/dawn-promotion-gate-report.json
            data/dawn-promotion-batch-report.json
            data/dawn-promoted-canonical-resource-index.json
            data/dawn-10k-work-queue.json
            data/dawn-resource-queue.json
