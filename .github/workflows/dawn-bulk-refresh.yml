name: Dawn Bulk Corpus Refresh

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/dawn-corpus/**'
      - 'scripts/build_dawn_resource_queue.py'
      - 'scripts/build_dawn_resource_substrate.py'
      - 'scripts/refresh_dawn_bulk_corpus.py'
      - '.github/workflows/dawn-bulk-refresh.yml'

permissions:
  contents: write

concurrency:
  group: dawn-bulk-corpus-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh Dawn bulk and resource corpus
        run: python3 scripts/refresh_dawn_bulk_corpus.py

      - name: Persist refreshed corpus
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          generated_paths=(
            data/dawn-10k-openlibrary-works.json
            data/dawn-10k-work-queue.json
            data/dawn-resource-queue.json
            public/dawn/canonical-index.json
            static/dawn-library/canonical-index.json
            static/dawn-library/canonical-resource-index.json
            static/dawn-library/surfaces/dawn-resources.json
          )
          for path in "${generated_paths[@]}"; do
            if [ -e "$path" ]; then
              git add "$path"
            fi
          done
          if git diff --cached --quiet; then
            echo "No corpus changes to persist."
            exit 0
          fi
          git commit -m "data(dawn): refresh bulk resource corpus"
          # The refresh script can touch derived files outside the persisted corpus set.
          # Restore those uncommitted derivatives so rebase always starts from a clean tree.
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin main
          git push origin HEAD:main
