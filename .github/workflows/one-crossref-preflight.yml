name: ONE cross-reference preflight
on:
  push:
    branches: [one/wisdom-major-prophets-scripture]
  pull_request:
    paths:
      - 'static/one/**'
      - 'scripts/one-crossref-preflight.sh'
      - '.github/workflows/one-crossref-preflight.yml'
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check cross-reference renderer and audit guards
        run: bash scripts/one-crossref-preflight.sh
