name: 117 Editorial Detail Church
on:
  pull_request:
    paths:
      - 'static/experiments/096-editorial-composition/**'
      - 'static/church/visit/index.html'
      - 'static/images/section-identity/**'
      - 'tests/117-editorial-detail-church.cjs'
      - '.github/workflows/117-editorial-detail-church.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: npm install --no-save --no-package-lock playwright && npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 4173 --directory static >/tmp/folio117-http.log 2>&1 &
          node tests/117-editorial-detail-church.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editorial-117
          path: artifacts/117/