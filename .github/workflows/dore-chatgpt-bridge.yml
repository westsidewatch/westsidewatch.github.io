name: Doré ChatGPT Bridge

on:
  push:
    paths:
      - 'functions/api/dore/openai-response.js'
      - 'functions/api/dore/respond.js'
      - 'functions/api/dore/conversation.js'
      - 'static/dore/dore-search-runtime.js'
      - 'static/dore/search/index.html'
      - 'scripts/dore/chatgpt-bridge-gate.mjs'
      - '.github/workflows/dore-chatgpt-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prove Doré routes conversation through OpenAI Responses
        run: node scripts/dore/chatgpt-bridge-gate.mjs
