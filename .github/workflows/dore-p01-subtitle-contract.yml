name: Doré P01 Subtitle Contract

on:
  push:
    branches: [main]
    paths:
      - 'functions/api/dore/video-subtitle-result.js'
      - 'tests/dore-p01-video-subtitle-result.test.mjs'
      - '.github/workflows/dore-p01-subtitle-contract.yml'
  pull_request:
    paths:
      - 'functions/api/dore/video-subtitle-result.js'
      - 'tests/dore-p01-video-subtitle-result.test.mjs'
      - '.github/workflows/dore-p01-subtitle-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  subtitle-result-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify rights-aware reader-result behavior
        run: node tests/dore-p01-video-subtitle-result.test.mjs
