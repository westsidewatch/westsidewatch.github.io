name: Doré Design native image patch
on:
  push:
    branches: [dore-design-native-image-runtime]
    paths:
      - scripts/patch_dore_design_native_image.py
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dore-design-native-image-runtime
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/patch_dore_design_native_image.py
      - run: python -m py_compile dore-design/app_workspace.py
      - name: Commit generated runtime
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add dore-design/app_workspace.py
          git commit -m "Enable native image nodes in Doré Design"
          git push
