name: Doré Researcher 06 Unit 07 Reference Audit

on:
  push:
    branches: [main]
    paths:
      - 'scripts/dore/mandarin-reference-coverage-audit.mjs'
      - '.github/workflows/dore-researcher06-unit07-reference-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dore-researcher06-unit07-reference-audit
  cancel-in-progress: false

jobs:
  reference-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned research-only pronunciation reference
        run: npm install --no-save pinyin-pro@3.29.3
      - name: Measure whole-corpus reference coverage
        run: |
          mkdir -p dore-core/knowledge/researcher/evidence
          node scripts/dore/mandarin-reference-coverage-audit.mjs > dore-core/knowledge/researcher/evidence/researcher06-unit07-reference-coverage.json
      - name: Persist experiment evidence
        run: |
          git config user.name 'Doré Researcher'
          git config user.email 'westsidewatchca@gmail.com'
          git add dore-core/knowledge/researcher/evidence/researcher06-unit07-reference-coverage.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'test(dore): persist Unit 07 pinned reference coverage evidence [skip ci]'
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          exit 1
