name: 111 Seven Section Name Seals
on:
  pull_request:
    paths:
      - 'static/experiments/section-name-seals/**'
      - 'tests/111-name-seals.cjs'
      - '.github/workflows/111-name-seals.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: npm install --no-save --no-package-lock playwright && npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 4173 --directory static >/tmp/seals111-http.log 2>&1 &
          node tests/111-name-seals.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editorial-111
          path: artifacts/111/
