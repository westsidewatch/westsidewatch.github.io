name: R178 Emmaus context field proof
on:
  pull_request:
    branches: [design/emmaus-continuous-reading-r177-20261127]
permissions:
  contents: read
jobs:
  proof:
    if: github.head_ref == 'design/emmaus-context-fields-r178-20261127'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 4173 --directory static >/tmp/r178-server.log 2>&1 &
          node tests/seven-realm-r178.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seven-realm-r178
          path: artifacts/r178/
