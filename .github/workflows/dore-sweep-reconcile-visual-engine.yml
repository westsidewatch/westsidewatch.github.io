name: Doré Sweep Reconcile Visual Engine

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dore-sweep-reconcile-visual-engine.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Reconcile Sweep 01 canonical ledgers
        run: |
          python3 - <<'PY'
          from pathlib import Path

          master = Path('dore-core/projects/DORÉ-MASTER-WORK-REGISTER.md')
          sweep = Path('dore-core/projects/DORÉ-MEMORY-CONSOLIDATION-SWEEP-01.md')
          retired = Path('dore-core/projects/DORÉ-SUPERSEDED-RETIRED-INDEX.md')

          master_marker = '## Sweep 01 canonical reconciliation — local visual-engine single-source (2026-09-01)'
          master_snippet = '''\n\n## Sweep 01 canonical reconciliation — local visual-engine single-source (2026-09-01)\n\nThe bounded local Doré/Penpot implementation now has one active model source: `DORE_LOCAL_MODEL`, with `VISION_MODEL=MODEL` in the current executable agent. The historical independent `DORE_LOCAL_VISION_MODEL` override is therefore `SUPERSEDED`, while `.github/workflows/dore-engine-single-source-cleanup.yml` is `RETIRED-AS-ACTION`: its intended target state already exists, but its own successful self-removing execution is not proven. This is configuration-convergence evidence only; it does not prove D4 visual readback, aesthetic competence, or global single-runtime unification. Evidence: `DORÉ-LOCAL-VISUAL-ENGINE-SINGLE-SOURCE-EVIDENCE-LEDGER-2026-09-01.md`. P01 state is unchanged.\n'''
          text = master.read_text(encoding='utf-8')
          if master_marker not in text:
              master.write_text(text.rstrip() + master_snippet + '\n', encoding='utf-8')

          sweep_marker = '## Checkpoint — local visual-engine single-source canonical reconciliation (2026-09-01)'
          sweep_snippet = '''\n\n## Checkpoint — local visual-engine single-source canonical reconciliation (2026-09-01)\n\nBounded evidence reviewed: `.github/workflows/dore-engine-single-source-cleanup.yml`, `local/dore-local/penpot_agent.py`, the current source search for `DORE_LOCAL_VISION_MODEL`, commit-history evidence, and `DORÉ-LOCAL-VISUAL-ENGINE-SINGLE-SOURCE-EVIDENCE-LEDGER-2026-09-01.md`.\n\nReconciliation findings:\n\n1. Current executable local Doré/Penpot configuration uses a single active model source (`DORE_LOCAL_MODEL`); `VISION_MODEL=MODEL` is present in current source and no active `DORE_LOCAL_VISION_MODEL` residue was found outside the historical one-shot workflow.\n2. The independent visual-model override is `SUPERSEDED`. The one-shot cleanup workflow is `RETIRED-AS-ACTION`: its intended post-migration source state is already present, while the exact workflow execution/self-removal history remains unproven.\n3. This does not promote `VIS-GRAMMAR`, D4 visual readback, or broader Evolution autonomy. Configuration convergence and visual/design competence remain separate evidence layers.\n4. The canonical Superseded/Retired Index now records the retired-action interpretation so the stale workflow cannot silently reactivate itself as current work.\n5. No P01 runtime, source order, deployment, credential, binding, subtitle logic, or blocker state was changed.\n\nSweep 01 remains `ACTIVE_PARALLEL`; this bounded reconciliation does not justify `VERIFIED_COMPLETE`.\n'''
          text = sweep.read_text(encoding='utf-8')
          if sweep_marker not in text:
              sweep.write_text(text.rstrip() + sweep_snippet + '\n', encoding='utf-8')

          retired_marker = '## SR-015 — Local visual-engine independent override / one-shot cleanup action'
          retired_snippet = '''\n\n## SR-015 — Local visual-engine independent override / one-shot cleanup action\n\n**Historical source:** `.github/workflows/dore-engine-single-source-cleanup.yml` and the former `DORE_LOCAL_VISION_MODEL` override path.\n\n**Classification:** independent visual-model override `SUPERSEDED`; one-shot cleanup workflow `RETIRED-AS-ACTION` while retained as provenance.\n\n**Superseding evidence:** current `local/dore-local/penpot_agent.py` binds `VISION_MODEL=MODEL`, where `MODEL` comes from `DORE_LOCAL_MODEL` (default `gemma4:e4b`); bounded repository search found no active `DORE_LOCAL_VISION_MODEL` residue outside the historical cleanup workflow. `DORÉ-LOCAL-VISUAL-ENGINE-SINGLE-SOURCE-EVIDENCE-LEDGER-2026-09-01.md` records the source reconciliation.\n\n**Conflict resolved:** the one-shot workflow still exists and contains imperative migration language plus self-deletion logic, but its target post-migration source state is already the current implementation. It must not be interpreted as an unfinished current instruction or re-run merely because the file remains. A bounded commit search found no commit carrying its intended self-removal message, so the workflow's own successful execution history is not claimed.\n\n**Retained value:** the workflow preserves provenance for why the independent visual-engine override was removed. The durable rule is that current executable source/runtime evidence outranks stale migration-script wording.\n\n**Important boundary:** single-source local model selection is not evidence that D4 Penpot visual readback/correction has passed, that Westside visual grammar is complete, or that every Doré execution surface globally shares one model/runtime. Those claims remain separately evidence-gated.\n\n**Current authority:** treat `DORE_LOCAL_MODEL` as the current local model source; keep the old independent visual override superseded and the cleanup workflow retired as an action. No P01 state follows from this historical cleanup artifact.\n'''
          text = retired.read_text(encoding='utf-8')
          if retired_marker not in text:
              rule = '\n## Rule\n'
              if rule in text:
                  text = text.replace(rule, retired_snippet + rule, 1)
              else:
                  text = text.rstrip() + retired_snippet + '\n'
              retired.write_text(text, encoding='utf-8')
          PY
      - name: Commit canonical reconciliation and remove one-shot workflow
        run: |
          git config user.name 'Doré Memory Sweep'
          git config user.email 'westsidewatchca@gmail.com'
          git add dore-core/projects/DORÉ-MASTER-WORK-REGISTER.md dore-core/projects/DORÉ-MEMORY-CONSOLIDATION-SWEEP-01.md dore-core/projects/DORÉ-SUPERSEDED-RETIRED-INDEX.md
          git rm .github/workflows/dore-sweep-reconcile-visual-engine.yml
          if [[ -n "$(git status --porcelain)" ]]; then
            git commit -m 'Sweep 01: reconcile local visual-engine retirement'
            git push origin HEAD:main
          fi
