name: Doré Brain Bridge Regression

on:
  push:
    branches: [main]
    paths:
      - 'scripts/dore/brain-bridge-regression.mjs'
      - 'static/dore/brain/knowledge-index.json'
      - 'static/dore/dore-brain-bridge.js'
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generic Brain to Product regression
        run: node scripts/dore/brain-bridge-regression.mjs
