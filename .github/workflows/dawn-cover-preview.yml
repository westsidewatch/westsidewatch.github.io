name: Dawn Cover Preview Shards
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/build_dawn_cover_preview_shards.py
      - static/dawn-library/canonical/**
      - .github/workflows/dawn-cover-preview.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build cover preview shards
        run: python3 scripts/build_dawn_cover_preview_shards.py
      - name: Verify cover surface
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('static/dawn-library/cover-preview')
          p=json.load(open(root/'root.json'))
          assert p['workCount']==203448
          assert p['previewShardSize']==500
          assert p['shardCount']==407
          assert p['shards'][0]['offset']==0 and p['shards'][0]['count']==500
          first=json.load(open(root/p['shards'][0]['href']))
          assert first['count']==500 and len(first['items'])==500
          assert any(x.get('cover',{}).get('src') for x in first['items'])
          print(p['workCount'],p['shardCount'],first['count'])
          PY
      - name: Publish cover preview surface
        run: |
          git config user.name 'Dore CI'
          git config user.email 'dore-ci@users.noreply.github.com'
          git add static/dawn-library/cover-preview
          if git diff --cached --quiet; then
            echo 'Cover preview surface already current.'
          else
            git commit -m 'data(dawn): publish cover preview surface [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dawn-cover-preview
          path: static/dawn-library/cover-preview
