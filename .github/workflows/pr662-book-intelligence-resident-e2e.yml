name: PR662 Book Intelligence Resident E2E

on:
  push:
    paths:
      - '.github/workflows/pr662-book-intelligence-resident-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr662-book-intelligence-resident-e2e
  cancel-in-progress: true

jobs:
  resident-e2e:
    runs-on: [self-hosted, macOS, dore]
    timeout-minutes: 8
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Bounded resident inventory
        shell: bash
        run: |
          set -u
          echo "E2E_SHA=$(git rev-parse HEAD)"
          echo "E2E_HOST=$(hostname)"
          sw_vers

          echo '--- Firefox candidates ---'
          for APP in '/Applications/Firefox.app' '/Applications/Firefox Developer Edition.app' '/Applications/Firefox Nightly.app' "$HOME/Applications/Firefox.app"; do
            test -d "$APP" && echo "FOUND_APP=$APP"
          done
          command -v mdfind >/dev/null && mdfind "kMDItemCFBundleIdentifier == 'org.mozilla.firefox'" | head -n 20 || true

          echo '--- Firefox profile ---'
          FFROOT="$HOME/Library/Application Support/Firefox"
          if test -d "$FFROOT"; then
            ls -la "$FFROOT" || true
            test -f "$FFROOT/profiles.ini" && { echo '--- profiles.ini ---'; cat "$FFROOT/profiles.ini"; }
            for P in "$FFROOT"/Profiles/*; do
              test -d "$P" || continue
              echo "PROFILE=$P"
              if test -f "$P/extensions.json"; then
                python3 -c 'import json,sys; d=json.load(open(sys.argv[1],encoding="utf-8")); [print("ACTIVE_EXTENSION",a.get("id"),a.get("path"),a.get("type")) for a in d.get("addons",[]) if a.get("active")]' "$P/extensions.json"
              fi
            done
          else
            echo 'NO_FIREFOX_PROFILE_ROOT'
          fi

          echo '--- Native Messaging manifests ---'
          for D in "$HOME/Library/Application Support/Mozilla/NativeMessagingHosts" '/Library/Application Support/Mozilla/NativeMessagingHosts'; do
            echo "NATIVE_DIR=$D"
            if test -d "$D"; then
              ls -la "$D"
              for M in "$D"/*.json; do
                test -f "$M" || continue
                echo "MANIFEST=$M"
                python3 -c 'import json,sys; d=json.load(open(sys.argv[1],encoding="utf-8")); print({k:d.get(k) for k in ("name","description","path","type","allowed_extensions","allowed_origins")})' "$M"
              done
            fi
          done

          echo '--- Ollama ---'
          OLLAMA=''
          for O in "$(command -v ollama 2>/dev/null || true)" /opt/homebrew/bin/ollama /usr/local/bin/ollama; do
            test -n "$O" -a -x "$O" && { OLLAMA="$O"; break; }
          done
          if test -n "$OLLAMA"; then
            echo "OLLAMA=$OLLAMA"
            "$OLLAMA" list || true
          else
            echo 'NO_OLLAMA_BINARY'
          fi

          echo '--- Checked-out repo candidates ---'
          git ls-files | grep -Ei '(firefox|companion|native.?messag|extension|webext|manifest|book.?intelligence|book.?compile|manuscript|e2e|acceptance)' | head -n 300 || true
          git grep -Il -E 'connectNative|sendNativeMessage|NativeMessaging|allowed_extensions|gemma4:e4b|publishing\.book-intelligence|publishing\.book-compile' -- ':!*.min.js' | head -n 300 || true
          echo 'E2E_INVENTORY_COMPLETE'
