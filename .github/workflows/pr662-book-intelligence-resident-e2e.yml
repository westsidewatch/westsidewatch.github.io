name: PR662 Book Intelligence Resident E2E

on:
  push:
    paths:
      - '.github/workflows/pr662-book-intelligence-resident-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr662-book-intelligence-resident-e2e
  cancel-in-progress: true

jobs:
  resident-e2e:
    runs-on: [self-hosted, macOS, dore]
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inventory resident browser native and model environment
        shell: bash
        run: |
          set -u
          echo "E2E_SHA=$(git rev-parse HEAD)"
          echo "E2E_HOST=$(hostname)"
          sw_vers
          echo '--- browser applications ---'
          find /Applications "$HOME/Applications" -maxdepth 2 -type d \( -iname '*Firefox*.app' -o -iname '*Waterfox*.app' -o -iname '*LibreWolf*.app' \) -print 2>/dev/null || true
          echo '--- Firefox-related home paths ---'
          find "$HOME/Library/Application Support" -maxdepth 4 \( -iname '*Firefox*' -o -iname '*Mozilla*' -o -iname '*NativeMessagingHosts*' \) -print 2>/dev/null | head -n 160 || true
          echo '--- native manifests ---'
          for D in "$HOME/Library/Application Support/Mozilla/NativeMessagingHosts" "/Library/Application Support/Mozilla/NativeMessagingHosts"; do
            if test -d "$D"; then
              echo "DIR=$D"
              find "$D" -maxdepth 1 -type f -name '*.json' -print -exec sh -c 'echo --- $1; cat "$1"' _ {} \;
            fi
          done
          echo '--- resident repo browser/native references ---'
          ROOT="$HOME/westsidewatch.github.io"
          if test -d "$ROOT/.git"; then
            cd "$ROOT"
            git status --short || true
            find . -maxdepth 8 -type f | grep -Ei 'firefox|companion|native.?messag|extension|webext|manifest' | head -n 200 || true
            grep -RIlE 'connectNative|sendNativeMessage|NativeMessaging|native messaging|allowed_extensions' . --exclude-dir=.git --exclude='*.min.js' 2>/dev/null | head -n 200 || true
          fi
          echo '--- ollama ---'
          (command -v ollama || true)
          (/opt/homebrew/bin/ollama list 2>/dev/null || /usr/local/bin/ollama list 2>/dev/null || ollama list 2>/dev/null || true)
          echo '--- repo manuscript/book acceptance candidates ---'
          cd "$GITHUB_WORKSPACE"
          find . -maxdepth 8 -type f \( -iname '*book*intelligence*' -o -iname '*book*compile*' -o -iname '*manuscript*' -o -iname '*e2e*' -o -iname '*acceptance*' \) -print | head -n 250 || true
          grep -RIlE 'publishing.book-intelligence|publishing.book-compile|gemma4:e4b' . --exclude-dir=.git --exclude='*.min.js' 2>/dev/null | head -n 250 || true

      - name: Stop until inventory is interpreted
        run: |
          echo 'E2E_INVENTORY_COMPLETE'
