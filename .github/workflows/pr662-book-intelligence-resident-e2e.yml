name: PR662 Book Intelligence Resident E2E

on:
  push:
    paths:
      - '.github/workflows/pr662-book-intelligence-resident-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr662-book-intelligence-resident-e2e
  cancel-in-progress: true

jobs:
  resident-e2e:
    runs-on: [self-hosted, macOS, dore]
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Discover resident Firefox Companion and native host
        id: discover
        shell: bash
        run: |
          set -euo pipefail
          echo "E2E_SHA=$(git rev-parse HEAD)"
          echo "E2E_HOST=$(hostname)"
          sw_vers

          FIREFOX="/Applications/Firefox.app/Contents/MacOS/firefox"
          test -x "$FIREFOX" || { echo 'E2E_FAIL firefox_missing' >&2; exit 1; }
          "$FIREFOX" --version

          PROFILES="$HOME/Library/Application Support/Firefox/Profiles"
          test -d "$PROFILES" || { echo 'E2E_FAIL firefox_profiles_missing' >&2; exit 1; }

          EXT_JSON=$(find "$PROFILES" -maxdepth 2 -name extensions.json -print | head -n 1 || true)
          test -n "$EXT_JSON" || { echo 'E2E_FAIL firefox_extensions_json_missing' >&2; exit 1; }

          python3 - "$EXT_JSON" <<'PY'
          import json,sys
          p=sys.argv[1]
          d=json.load(open(p,encoding='utf-8'))
          hits=[]
          for a in d.get('addons',[]):
              hay=' '.join(str(a.get(k,'')) for k in ('id','defaultLocale','path')).lower()
              if any(x in hay for x in ('dore','doré','companion','westside')):
                  hits.append({k:a.get(k) for k in ('id','path','active','type')})
          print('E2E_COMPANION_CANDIDATES='+json.dumps(hits,ensure_ascii=False))
          if not any(x.get('active') for x in hits):
              raise SystemExit('E2E_FAIL active_companion_extension_not_found')
          PY

          NM_DIR="$HOME/Library/Application Support/Mozilla/NativeMessagingHosts"
          test -d "$NM_DIR" || { echo 'E2E_FAIL native_manifest_dir_missing' >&2; exit 1; }
          MANIFEST=$(grep -ilE 'dore|doré|westside|companion' "$NM_DIR"/*.json 2>/dev/null | head -n 1 || true)
          test -n "$MANIFEST" || { echo 'E2E_FAIL dore_native_manifest_missing' >&2; ls -la "$NM_DIR" || true; exit 1; }
          echo "E2E_NATIVE_MANIFEST=$MANIFEST"
          cat "$MANIFEST"
          HOST_PATH=$(python3 - "$MANIFEST" <<'PY'
          import json,sys
          print(json.load(open(sys.argv[1],encoding='utf-8')).get('path',''))
          PY
          )
          test -n "$HOST_PATH" -a -x "$HOST_PATH" || { echo "E2E_FAIL native_host_not_executable path=$HOST_PATH" >&2; exit 1; }
          echo "E2E_NATIVE_HOST=$HOST_PATH"

          if command -v ollama >/dev/null 2>&1; then
            OLLAMA=ollama
          elif test -x /usr/local/bin/ollama; then OLLAMA=/usr/local/bin/ollama
          elif test -x /opt/homebrew/bin/ollama; then OLLAMA=/opt/homebrew/bin/ollama
          else echo 'E2E_FAIL ollama_missing' >&2; exit 1; fi
          "$OLLAMA" list
          "$OLLAMA" list | grep -F 'gemma4:e4b' >/dev/null || { echo 'E2E_FAIL gemma4:e4b_missing' >&2; exit 1; }
          echo 'E2E_MODEL=gemma4:e4b'

      - name: Locate real book manuscript and repo E2E entrypoints
        shell: bash
        run: |
          set -euo pipefail
          echo '--- book intelligence files ---'
          find . -maxdepth 6 -type f \( -iname '*book*intelligence*' -o -iname '*book*compile*' -o -iname '*manuscript*' \) -print | head -n 120
          echo '--- likely real manuscripts ---'
          find . -maxdepth 7 -type f \( -name '*.md' -o -name '*.json' -o -name '*.txt' \) -size +2k -print | grep -Ei 'book|folio|multiwrite|manuscript|job|約伯|三個朋友' | head -n 80 || true
          echo '--- native/browser bridge references ---'
          grep -RIlE 'connectNative|sendNativeMessage|NativeMessaging|native messaging|browser_capability_transport|publishing.book-intelligence|publishing.book-compile' . \
            --exclude-dir=.git --exclude='*.min.js' | head -n 120

      - name: Run repository resident/model-backed acceptance if present
        shell: bash
        run: |
          set -euo pipefail
          mapfile_cmd() { :; }
          CANDIDATES=$(find . -maxdepth 7 -type f \( -name '*e2e*.py' -o -name '*acceptance*.py' -o -name '*e2e*.sh' -o -name '*acceptance*.sh' \) -print | grep -Ei 'book|publishing|multiwrite|native|companion|model' || true)
          printf '%s\n' "$CANDIDATES"
          TEST=$(printf '%s\n' "$CANDIDATES" | head -n 1)
          if test -z "$TEST"; then
            echo 'E2E_FAIL no_repository_full_chain_acceptance_entrypoint' >&2
            exit 1
          fi
          case "$TEST" in
            *.py) python3 "$TEST" ;;
            *.sh) bash "$TEST" ;;
            *) echo "E2E_FAIL unsupported_acceptance=$TEST" >&2; exit 1 ;;
          esac

      - name: Require full-chain pass marker
        shell: bash
        run: |
          set -euo pipefail
          echo 'E2E_FAIL full_chain_marker_not_emitted_by_repository_acceptance' >&2
          echo 'The repository acceptance must itself prove Firefox Companion -> Native Messaging -> gemma4:e4b -> real manuscript and emit its own durable PASS evidence.' >&2
          exit 1
