name: ONE Global Audit

on:
  pull_request:
    paths:
      - 'static/one/**'
      - 'scripts/one-global-audit.mjs'
      - 'scripts/one-cover-backlog-audit.mjs'
      - 'scripts/one-canon-index-audit.mjs'
      - '.github/workflows/one-global-audit.yml'
  push:
    branches: [ main ]
    paths:
      - 'static/one/**'
      - 'scripts/one-global-audit.mjs'
      - 'scripts/one-cover-backlog-audit.mjs'
      - 'scripts/one-canon-index-audit.mjs'
      - '.github/workflows/one-global-audit.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run 66-book / 1189-chapter audit
        id: audit
        continue-on-error: true
        run: node scripts/one-global-audit.mjs
      - name: Classify cover backlog and quality
        id: cover_audit
        continue-on-error: true
        run: node scripts/one-cover-backlog-audit.mjs
      - name: Audit shared Canon Index
        id: canon_index
        continue-on-error: true
        run: node scripts/one-canon-index-audit.mjs
      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-global-audit
          path: audit-output/
          if-no-files-found: error
      - name: Persist latest audit reports on main
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          test -f audit-output/one-global-audit.json
          test -f audit-output/one-cover-backlog.json
          test -f audit-output/one-canon-index.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit-output/one-global-audit.json audit-output/one-global-audit.md audit-output/one-cover-backlog.json audit-output/one-cover-backlog.md audit-output/one-canon-index.json audit-output/one-canon-index.md
          if git diff --cached --quiet; then
            echo 'Audit reports unchanged.'
          else
            git commit -m 'chore: update ONE audit reports'
            git push
          fi
      - name: Enforce audit failures
        if: steps.audit.outcome == 'failure' || steps.cover_audit.outcome == 'failure' || steps.canon_index.outcome == 'failure'
        run: exit 1
