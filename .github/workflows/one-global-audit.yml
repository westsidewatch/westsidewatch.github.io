name: ONE Global Audit

on:
  pull_request:
    paths:
      - 'static/one/**'
      - 'scripts/one-global-audit.mjs'
      - 'scripts/one-cover-backlog-audit.mjs'
      - 'scripts/one-canon-index-audit.mjs'
      - 'scripts/one-crossref-preflight.sh'
      - '.github/workflows/one-global-audit.yml'
  push:
    branches: [ main, one/wisdom-major-prophets-scripture ]
    paths:
      - 'static/one/**'
      - 'scripts/one-global-audit.mjs'
      - 'scripts/one-cover-backlog-audit.mjs'
      - 'scripts/one-canon-index-audit.mjs'
      - 'scripts/one-crossref-preflight.sh'
      - '.github/workflows/one-global-audit.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish verified Doré binary packages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, json

          ready_files = sorted(Path('.dore-upload').glob('*/READY'))
          if not ready_files:
              print('No Doré READY package; continuing audit.')
              raise SystemExit(0)

          for ready in ready_files:
              package = ready.parent
              manifest = json.loads((package / 'manifest.json').read_text())
              parts = sorted(package.glob('part-*.b64'))
              expected_parts = int(manifest['parts'])
              if len(parts) != expected_parts:
                  raise SystemExit(f"part count mismatch: {len(parts)} != {expected_parts}")

              encoded = ''.join(p.read_text().strip() for p in parts)
              data = base64.b64decode(encoded, validate=True)
              expected_bytes = int(manifest['bytes'])
              if len(data) != expected_bytes:
                  raise SystemExit(f"byte size mismatch: {len(data)} != {expected_bytes}")

              digest = hashlib.sha256(data).hexdigest()
              if digest != manifest['sha256']:
                  raise SystemExit(f"sha256 mismatch: {digest} != {manifest['sha256']}")

              kind = manifest.get('kind')
              if kind == 'avif' and not (len(data) > 12 and data[4:12] == b'ftypavif'):
                  raise SystemExit('invalid AVIF signature')
              if kind == 'webp' and not (data[:4] == b'RIFF' and data[8:12] == b'WEBP'):
                  raise SystemExit('invalid WEBP signature')

              target = Path(manifest['target'])
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
              print(f"verified {target}: {len(data)} bytes sha256={digest}")

              for replacement in manifest.get('text_replacements', []):
                  path = Path(replacement['path'])
                  text = path.read_text()
                  old = replacement['old']
                  new = replacement['new']
                  expected = int(replacement.get('expected', 1))
                  count = text.count(old)
                  if count != expected:
                      raise SystemExit(f"{path}: expected {expected} occurrences, found {count}")
                  path.write_text(text.replace(old, new))
                  print(f"wired {path}: {old} -> {new}")

          for ready in ready_files:
              import shutil
              shutil.rmtree(ready.parent)
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Cross-reference preflight
        run: bash scripts/one-crossref-preflight.sh
      - name: Run 66-book / 1189-chapter audit
        id: audit
        continue-on-error: true
        run: node scripts/one-global-audit.mjs
      - name: Classify cover backlog and quality
        id: cover_audit
        continue-on-error: true
        run: node scripts/one-cover-backlog-audit.mjs
      - name: Audit shared Canon Index
        id: canon_index
        continue-on-error: true
        run: node scripts/one-canon-index-audit.mjs
      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-global-audit
          path: audit-output/
          if-no-files-found: error
      - name: Persist audit reports and verified Doré assets on main
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          test -f audit-output/one-global-audit.json
          test -f audit-output/one-cover-backlog.json
          test -f audit-output/one-canon-index.json
          git config user.name 'github-actions[bot]'
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A audit-output static/one .dore-upload
          if git diff --cached --quiet; then
            echo 'Audit reports and Doré assets unchanged.'
          else
            git commit -m 'chore: publish verified Doré assets and update ONE audit reports'
            git push
          fi
      - name: Enforce audit failures
        if: steps.audit.outcome == 'failure' || steps.cover_audit.outcome == 'failure' || steps.canon_index.outcome == 'failure'
        run: exit 1
