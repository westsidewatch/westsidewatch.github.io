name: ONE Global Audit

on:
  pull_request:
    paths:
      - 'static/one/**'
      - 'scripts/one-global-audit.mjs'
      - '.github/workflows/one-global-audit.yml'
  push:
    branches: [ main ]
    paths:
      - 'static/one/**'
      - 'scripts/one-global-audit.mjs'
      - '.github/workflows/one-global-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run 66-book / 1189-chapter audit
        run: node scripts/one-global-audit.mjs
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-global-audit
          path: audit-output/
          if-no-files-found: error
