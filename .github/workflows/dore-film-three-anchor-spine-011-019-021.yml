name: DORÉ Film Three-Anchor Spine 011-019-021
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/dore-film-three-anchor-spine-011-019-021.yml']
jobs:
  three-anchor-spine:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install render stack
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender ffmpeg libegl1 libgl1 libglx-mesa0
          python -m pip install --quiet pillow
      - name: Fetch canonical Doré anchors
        run: |
          mkdir -p .three/input .three/output
          curl -L --fail --retry 3 'https://upload.wikimedia.org/wikipedia/commons/e/e5/011.Abraham_Goes_to_the_Land_of_Canaan.jpg' -o .three/input/011.jpg
          curl -L --fail --retry 3 'https://upload.wikimedia.org/wikipedia/commons/c/c6/019.The_Meeting_of_Isaac_and_Rebekah.jpg' -o .three/input/019.jpg
          curl -L --fail --retry 3 'https://upload.wikimedia.org/wikipedia/commons/1/14/021.Jacob%27s_Dream.jpg' -o .three/input/021.jpg
      - name: Build three-anchor continuous world
        env: {LIBGL_ALWAYS_SOFTWARE: '1', MESA_LOADER_DRIVER_OVERRIDE: llvmpipe}
        run: |
          cat > .three/build.py <<'PY'
          import bpy,os,math,json
          from mathutils import Vector
          B=os.path.abspath('.three'); O=os.path.join(B,'output'); bpy.ops.wm.read_factory_settings(use_empty=True); s=bpy.context.scene
          s.world=bpy.data.worlds.new('WORLD'); s.world.color=(.012,.012,.012)
          def wall(id,fn,c,w,ry=0):
            img=bpy.data.images.load(os.path.join(B,'input',fn)); ar=img.size[0]/img.size[1]; h=w/ar; C,R=32,24; vs=[]; uv=[]; fs=[]
            for j in range(R+1):
              v=j/R; y=(v-.5)*h
              for i in range(C+1):
                u=i/C; x=(u-.5)*w; z=-.08*(x/(w/2))**2; vs.append((x,y,z)); uv.append((u,v))
            for j in range(R):
              for i in range(C):
                a=j*(C+1)+i; fs.append((a,a+1,a+C+2,a+C+1))
            me=bpy.data.meshes.new(id); me.from_pydata(vs,[],fs); me.update(); layer=me.uv_layers.new(name='UVMap')
            for p in me.polygons:
              for li,vi in zip(p.loop_indices,p.vertices): layer.data[li].uv=uv[vi]
            ob=bpy.data.objects.new('DORE_'+id,me); bpy.context.collection.objects.link(ob); ob.location=c; ob.rotation_euler[1]=ry
            m=bpy.data.materials.new('MAT_'+id); m.use_nodes=True; n=m.node_tree.nodes; l=m.node_tree.links
            for q in list(n): n.remove(q)
            t=n.new('ShaderNodeTexImage'); t.image=img; t.extension='CLIP'; e=n.new('ShaderNodeEmission'); o=n.new('ShaderNodeOutputMaterial'); l.new(t.outputs['Color'],e.inputs['Color']); l.new(e.outputs['Emission'],o.inputs['Surface']); me.materials.append(m)
          wall('011','011.jpg',(0,0,-5.2),5.8,0); wall('019','019.jpg',(7.2,0,-11),5.3,math.radians(-10)); wall('021','021.jpg',(13.8,.2,-17.2),5.3,math.radians(-8))
          # Continuous neutral ground/bridge, intentionally crude: road proof, not art polish.
          bpy.ops.mesh.primitive_plane_add(size=40,location=(7,-2.8,-10)); g=bpy.context.object; gm=bpy.data.materials.new('GROUND'); gm.use_nodes=True; bs=gm.node_tree.nodes.get('Principled BSDF'); bs.inputs['Base Color'].default_value=(.028,.028,.028,1); bs.inputs['Roughness'].default_value=1; g.data.materials.append(gm)
          cd=bpy.data.cameras.new('ONE_CAMERA'); c=bpy.data.objects.new('ONE_CAMERA',cd); bpy.context.collection.objects.link(c); s.camera=c; cd.sensor_fit='HORIZONTAL'; cd.sensor_width=36; cd.lens=46; cd.clip_start=.02; cd.clip_end=120
          # One path: 011 canonical encounter -> 019 -> 021. No camera reset.
          K=[(1,(0,0,0),(0,0,-5.2)),(32,(.5,0,-1.5),(.2,0,-5.5)),(64,(2.4,-.1,-4.1),(4,0,-8.4)),(96,(5.1,0,-6.9),(7,0,-10.8)),(120,(7.2,0,-7.9),(7.2,0,-11)),(150,(8.7,-.1,-10),(10.5,0,-13.5)),(180,(11.3,0,-12.8),(13.1,.1,-16.3)),(210,(13.8,.1,-14),(13.8,.2,-17.2))]
          for f,loc,t in K:
            c.location=loc; c.rotation_euler=(Vector(t)-c.location).to_track_quat('-Z','Y').to_euler(); c.keyframe_insert('location',frame=f); c.keyframe_insert('rotation_euler',frame=f)
          for fc in c.animation_data.action.fcurves:
            for kp in fc.keyframe_points: kp.interpolation='BEZIER'
          s.render.engine='BLENDER_EEVEE'; s.render.resolution_x=960; s.render.resolution_y=720; s.render.resolution_percentage=100; s.render.image_settings.file_format='PNG'; s.view_settings.view_transform='Standard'; s.frame_start=1; s.frame_end=210; s.render.fps=24; s.render.filepath=os.path.join(O,'frame-')
          bpy.ops.wm.save_as_mainfile(filepath=os.path.join(O,'three-anchor-spine.blend')); bpy.ops.render.render(animation=True)
          json.dump({'experiment':'DF-THREE-ANCHOR-SPINE-01','anchors':['011','019','021'],'camera_resets':0,'generation':False,'purpose':'prove repeatable multi-anchor Virtual Stage architecture on one continuous Camera Spine','acceptance':'011,019,021 must each become recognizable encounters in one uninterrupted camera path; bridge quality is not acceptance-critical.'},open(os.path.join(O,'metadata.json'),'w'),indent=2)
          PY
          blender -b --python .three/build.py
      - name: Encode evidence
        run: |
          ffmpeg -y -framerate 24 -i '.three/output/frame-%04d.png' -c:v libx264 -pix_fmt yuv420p .three/output/three-anchor-spine.mp4
          python - <<'PY'
          from PIL import Image,ImageDraw
          from pathlib import Path
          p=Path('.three/output'); ns=[1,64,120,150,180,210]; a=[Image.open(p/f'frame-{n:04d}.png').convert('RGB') for n in ns]; w,h=a[0].size; s=Image.new('RGB',(w*3,h*2+60),'black'); d=ImageDraw.Draw(s)
          for i,(n,im) in enumerate(zip(ns,a)): x=(i%3)*w;y=(i//3)*(h+30)+30;s.paste(im,(x,y));d.text((x+8,y-22),f'frame {n}',fill='white')
          s.save(p/'contact-sheet.png')
          PY
      - uses: actions/upload-artifact@v4
        with: {name: dore-film-three-anchor-spine-011-019-021, path: .three/output/, retention-days: 14, if-no-files-found: error}
