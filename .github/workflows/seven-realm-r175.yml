name: R175 Emmaus content skeleton proof
on:
  pull_request:
    branches: [design/emmaus-master-r174-20261127]
permissions:
  contents: read
jobs:
  proof:
    if: github.head_ref == 'design/emmaus-content-skeleton-r175-20261127'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 4173 --directory static >/tmp/r175-server.log 2>&1 &
          node tests/seven-realm-r175.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seven-realm-r175
          path: artifacts/r175/
