name: Temp crossref branch audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/.trigger-crossref-branch-audit'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: one/wisdom-major-prophets-scripture
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run exhaustive cross-reference audit
        shell: bash
        run: |
          set +e
          node scripts/one-crossref-missing-audit.mjs > /tmp/missing.log 2>&1
          miss=$?
          bash scripts/one-crossref-preflight.sh > /tmp/preflight.log 2>&1
          pre=$?
          node scripts/one-global-audit.mjs > /tmp/global.log 2>&1
          glob=$?
          mkdir -p audit-output
          cp /tmp/missing.log audit-output/one-crossref-missing-run.log
          cp /tmp/preflight.log audit-output/one-crossref-preflight.log
          cp /tmp/global.log audit-output/one-global-audit-run.log
          printf '{"missingExit":%s,"preflightExit":%s,"globalExit":%s}\n' "$miss" "$pre" "$glob" > audit-output/one-crossref-run-status.json
          exit 0
      - name: Commit audit results to work branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add audit-output
          git diff --cached --quiet && exit 0
          git commit -m "Audit all remaining cross-reference Scripture gaps"
          git push origin HEAD:one/wisdom-major-prophets-scripture
