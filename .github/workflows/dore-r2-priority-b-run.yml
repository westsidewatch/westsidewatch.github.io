name: Doré R2 Priority B corrected run
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/dore-r2-priority-b-run.yml']
permissions: {contents: write}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Wait for site migrator deployment and migrate
        env: {TOKEN: "${{ secrets.DORE_HEARTBEAT_TOKEN }}"}
        shell: bash
        run: |
          set -euo pipefail; test -n "${TOKEN:-}"
          python3 - <<'PY'
          import os,json,subprocess,time,urllib.parse,hashlib
          items=[('background.jpg','SITE-BACKGROUND'),('static/images/damascus-gate.jpg','SITE-DAMASCUS-GATE'),('static/images/jerusalem-wall.png','SITE-JERUSALEM-WALL'),('static/images/temple-stone-light.png','SITE-TEMPLE-STONE-LIGHT'),('static/wechat-qr.png','SITE-WECHAT-QR')]
          def curl(args):
            p=subprocess.run(['curl','-sS','-L']+args,capture_output=True,text=True); raw=p.stdout.strip()
            try:return json.loads(raw)
            except:return {'ok':False,'raw':raw,'stderr':p.stderr}
          out=[]
          for src,code in items:
            h=hashlib.sha256(open(src,'rb').read()).hexdigest(); body=json.dumps({'source_path':src,'asset_code':code,'title':code,'products_using_it':['SITE']}); r=None
            for n in range(12):
              r=curl(['-X','POST','-H',f'Authorization: Bearer {os.environ["TOKEN"]}','-H','Content-Type: application/json','--data',body,'https://westsidewatch-github-io.pages.dev/api/dore/assets/migrate-site'])
              if r.get('ok'): break
              time.sleep(15)
            if not r or not r.get('ok'): raise SystemExit(f'{code} migration failed: {r}')
            q=urllib.parse.quote(code); s=curl(['https://westsidewatch-github-io.pages.dev/api/dore/assets/search?q='+q]); rows=s.get('results') or []
            assert any(x.get('asset_code')==code for x in rows),(code,s)
            out.append({'asset_code':code,'source_path':src,'sha256':h,'migration':r})
          json.dump({'milestone':'priority-b-site-media','status':'MIGRATED','assets':out},open('/tmp/b.json','w'),indent=2)
          PY
      - name: Cut references and remove migrated binaries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          R={'/background.jpg':'/api/dore/assets/site-file?code=SITE-BACKGROUND','/images/damascus-gate.jpg':'/api/dore/assets/site-file?code=SITE-DAMASCUS-GATE','/images/jerusalem-wall.png':'/api/dore/assets/site-file?code=SITE-JERUSALEM-WALL','/images/temple-stone-light.png':'/api/dore/assets/site-file?code=SITE-TEMPLE-STONE-LIGHT','/wechat-qr.png':'/api/dore/assets/site-file?code=SITE-WECHAT-QR'}
          for p in Path('.').rglob('*'):
            if not p.is_file() or '.git' in p.parts or p.parts[:2]==('.github','workflows') or p.parts[:2]==('dore-core','cloudflare'): continue
            if p.suffix.lower() not in {'.html','.css','.js','.md','.json','.toml','.yaml','.yml'}: continue
            try:s=p.read_text()
            except: continue
            old=s
            for a,b in R.items(): s=s.replace(a,b)
            if s!=old:p.write_text(s)
          PY
          files=(background.jpg static/images/damascus-gate.jpg static/images/jerusalem-wall.png static/images/temple-stone-light.png static/wechat-qr.png)
          : >/tmp/refs
          for f in "${files[@]}"; do git grep -n -F "$(basename "$f")" -- ':!.github/workflows/**' ':!dore-core/cloudflare/**' >>/tmp/refs || true; done
          cat /tmp/refs; test ! -s /tmp/refs; git rm -- "${files[@]}"
      - name: Verify R2 delivery and close milestone
        shell: bash
        run: |
          set -euo pipefail
          for c in SITE-BACKGROUND SITE-DAMASCUS-GATE SITE-JERUSALEM-WALL SITE-TEMPLE-STONE-LIGHT SITE-WECHAT-QR; do curl -fsS "https://westsidewatch-github-io.pages.dev/api/dore/assets/site-file?code=$c" -o /tmp/x; test -s /tmp/x; done
          mkdir -p dore-core/cloudflare/receipts
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/b.json')); r.update(status='PASS',asset_count=5,runtime_old_path_references=0,github_binaries_removed=5,r2_delivery_verified=5,brand_svg_policy='KEEP_IN_GITHUB',canonical_dore_241_touched=False); json.dump(r,open('dore-core/cloudflare/receipts/R2-PRIORITY-B-SITE-MEDIA-PASS.json','w'),indent=2)
          PY
          git config user.name dore-migration-bot; git config user.email dore-migration-bot@users.noreply.github.com
          git add -A; git commit -m 'feat(dore): complete Priority B site media R2 cutover [skip ci]'; git pull --rebase origin main || true; git push