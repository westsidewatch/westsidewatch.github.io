name: DORÉ Dawn Library Continuous Loop
on:
  workflow_dispatch:
  schedule:
    - cron: '23 9 * * *'
  push:
    paths:
      - 'static/dawn-library/**'
      - 'scripts/run_dawn_library_discovery.py'
      - 'scripts/run_dawn_library_chinese_discovery.py'
      - 'scripts/run_dawn_library_relevance.py'
      - 'scripts/run_dawn_library_chinese_relevance.py'
      - 'scripts/run_dawn_library_english_resolver.py'
      - 'scripts/run_dawn_library_chinese_resolver.py'
      - 'scripts/promote_dawn_library_english_catalog.py'
      - 'scripts/promote_dawn_library_chinese_catalog.py'
      - 'scripts/test_dawn_collection_source_policy.py'
      - 'scripts/run_dawn_library_loop.py'
      - 'scripts/build_dawn_storefront.py'
      - '.github/workflows/dore-dawn-library-loop.yml'
concurrency:
  group: dore-dawn-library-main
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  library-loop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Dawn source policy before discovery
        run: python scripts/test_dawn_collection_source_policy.py
      - name: Discover Chinese Biblical World candidates
        run: python scripts/run_dawn_library_chinese_discovery.py
      - name: Gate Chinese candidates
        run: python scripts/run_dawn_library_chinese_relevance.py
      - name: Resolve Chinese Gutenberg editions and explicit rights
        run: python scripts/run_dawn_library_chinese_resolver.py
      - name: Promote verified Chinese works into canonical catalog
        run: python scripts/promote_dawn_library_chinese_catalog.py
      - name: Discover English Biblical World candidates
        run: python scripts/run_dawn_library_discovery.py
      - name: Gate English candidates
        run: python scripts/run_dawn_library_relevance.py
      - name: Resolve English Gutenberg editions and explicit rights
        run: python scripts/run_dawn_library_english_resolver.py
      - name: Promote verified English works into canonical catalog
        run: python scripts/promote_dawn_library_english_catalog.py
      - name: Produce measurable outputs after promotion
        run: python scripts/run_dawn_library_loop.py
      - name: Build real bookstore storefront from mature public catalogs
        run: python scripts/build_dawn_storefront.py
      - name: Validate autonomous bilingual library loop and storefront
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('reports/DAWN-LIBRARY-DISCOVERY.json').read_text())
          z=json.loads(Path('reports/DAWN-LIBRARY-CHINESE-DISCOVERY.json').read_text())
          g=json.loads(Path('reports/DAWN-LIBRARY-RELEVANCE.json').read_text())
          zg=json.loads(Path('reports/DAWN-LIBRARY-CHINESE-RELEVANCE.json').read_text())
          er=json.loads(Path('reports/DAWN-LIBRARY-ENGLISH-RESOLVER.json').read_text())
          zr=json.loads(Path('reports/DAWN-LIBRARY-CHINESE-RESOLVER.json').read_text())
          ep=json.loads(Path('reports/DAWN-LIBRARY-ENGLISH-PROMOTION.json').read_text())
          zp=json.loads(Path('reports/DAWN-LIBRARY-CHINESE-PROMOTION.json').read_text())
          r=json.loads(Path('reports/DAWN-LIBRARY-LOOP.json').read_text())
          cat=json.loads(Path('static/dawn-library/biblical-world/catalog.json').read_text())
          store=json.loads(Path('static/dawn-library/storefront.json').read_text())
          identities=json.loads(Path('static/dawn-library/identity-cache.json').read_text())
          zcand=json.loads(Path('static/dawn-library/biblical-world/chinese-candidates.json').read_text())
          eresolver=json.loads(Path('static/dawn-library/biblical-world/english-resolver-results.json').read_text())
          zresolver=json.loads(Path('static/dawn-library/biblical-world/chinese-resolver-results.json').read_text())
          def assert_clean_source(provider='',url='',source=''):
            text=' '.join(str(v or '') for v in (provider,url,source)).casefold()
            assert 'wikisource' not in text and '維基文庫' not in text and '维基文库' not in text
          assert z['source']=='project-gutenberg'
          for x in zcand.get('items',[]): assert_clean_source(x.get('provider'),x.get('sourceUrl'))
          for x in zg.get('items',[]): assert_clean_source(x.get('provider'),x.get('sourceUrl'))
          for x in zresolver.get('items',[]): assert_clean_source(x.get('provider'),x.get('sourceUrl'))
          for item in cat.get('items',[]):
            for src in item.get('sources',[]): assert_clean_source(src.get('provider'),src.get('url'))
            assert_clean_source(source=(item.get('provenance') or {}).get('source'))
          assert er['qualifiedInput']==g['results']['qualified']==len(eresolver['items'])
          assert sum(er['results'].values())==er['qualifiedInput']
          assert all(x.get('contentDownloaded') is False for x in eresolver['items'])
          assert all(x.get('rights',{}).get('status')=='public-domain' for x in eresolver['items'] if x['stage']=='verified')
          assert zr['qualifiedInput']==zg['results']['qualified']==len(zresolver['items'])
          assert sum(zr['results'].values())==zr['qualifiedInput']
          assert all(x.get('contentDownloaded') is False for x in zresolver['items'])
          assert all(x.get('rights',{}).get('declaredBy')=='Project Gutenberg' for x in zresolver['items'] if x['stage']=='verified')
          assert all((x.get('edition') or {}).get('language')=='zh' for x in zresolver['items'] if x['stage']=='verified')
          assert r['results']['pipelineThisRun']['chinesePromotedThisRun']==zp['promoted']
          assert r['results']['pipelineThisRun']['englishPromotedThisRun']==ep['promoted']
          urls=[]
          for item in cat['items']:
            for src in item.get('sources',[]):
              assert src.get('downloadOnCatalog') is False
              if src.get('url'): urls.append(src['url'])
          assert len(urls)==len(set(urls))
          auto=[x for x in cat['items'] if x.get('provenance',{}).get('origin')=='autonomous-discovery']
          assert all(x.get('rights',{}).get('status')=='public-domain' for x in auto)
          assert r['results']['books']['published']==len(cat['items'])
          assert store['storagePolicy']=='index-only'
          assert store['metrics']['mappedBooks']>=30
          assert all(x.get('contentDownloaded') is False for s in store['shelves'] for x in s['items'])
          assert isinstance(identities.get('items'),dict)
          ia=[x for s in store['shelves'] for x in s['items'] if x.get('source',{}).get('provider')=='Internet Archive']
          assert all(x.get('rights',{}).get('status')=='source-rights-check' for x in ia)
          assert all(not x.get('source',{}).get('downloadUrl') for x in ia)
          print(json.dumps({'chineseSource':z['source'],'chineseCandidates':z['candidateQueue'],'chineseQualified':zg['results']['qualified'],'chineseVerified':zr['results']['verified'],'chinesePromoted':zp['promoted'],'catalogTotal':len(cat['items']),'autonomousCatalog':len(auto),'storefrontMapped':store['metrics']['mappedBooks'],'identity':store['metrics'].get('identity',{}),'internetArchiveScans':len(ia),'storefrontShelves':[(s['title'],len(s['items'])) for s in store['shelves']]},ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dawn-library-loop-results
          path: |
            reports/DAWN-LIBRARY-*.json
            static/dawn-library/storefront.json
            static/dawn-library/identity-cache.json
            static/dawn-library/collections.json
            static/dawn-library/biblical-world/catalog.json
            static/dawn-library/biblical-world/discovery-state.json
            static/dawn-library/biblical-world/discovery-candidates.json
            static/dawn-library/biblical-world/chinese-candidates.json
            static/dawn-library/biblical-world/relevance-results.json
            static/dawn-library/biblical-world/chinese-relevance-results.json
            static/dawn-library/biblical-world/english-resolver-results.json
            static/dawn-library/biblical-world/chinese-resolver-results.json
      - name: Persist autonomous library growth
        if: github.event_name != 'pull_request'
        run: |
          git config user.name 'Doré CI'
          git config user.email 'westsidewatchca@gmail.com'
          current_ref="${GITHUB_REF_NAME}"
          add_outputs() {
            git add reports/DAWN-LIBRARY-*.json static/dawn-library/storefront.json static/dawn-library/identity-cache.json static/dawn-library/collections.json static/dawn-library/biblical-world/*.json
          }
          regenerate() {
            python scripts/test_dawn_collection_source_policy.py
            python scripts/run_dawn_library_chinese_discovery.py
            python scripts/run_dawn_library_chinese_relevance.py
            python scripts/run_dawn_library_chinese_resolver.py
            python scripts/promote_dawn_library_chinese_catalog.py
            python scripts/run_dawn_library_discovery.py
            python scripts/run_dawn_library_relevance.py
            python scripts/run_dawn_library_english_resolver.py
            python scripts/promote_dawn_library_english_catalog.py
            python scripts/run_dawn_library_loop.py
            python scripts/build_dawn_storefront.py
          }
          add_outputs
          if git diff --cached --quiet; then exit 0; fi
          for attempt in 1 2 3 4; do
            git commit -m 'chore(dawn): persist autonomous bookstore growth [skip ci]'
            if git push origin "HEAD:${current_ref}"; then exit 0; fi
            git fetch origin "${current_ref}"
            git reset --hard "origin/${current_ref}"
            regenerate
            add_outputs
            if git diff --cached --quiet; then exit 0; fi
          done
          exit 1
