name: DORÉ Dawn Library Continuous Loop
on:
  workflow_dispatch:
  schedule:
    - cron: '23 */3 * * *'
  push:
    paths:
      - 'static/dawn-library/**'
      - 'scripts/run_dawn_library_discovery.py'
      - 'scripts/run_dawn_library_chinese_discovery.py'
      - 'scripts/run_dawn_library_relevance.py'
      - 'scripts/run_dawn_library_chinese_relevance.py'
      - 'scripts/run_dawn_library_english_resolver.py'
      - 'scripts/run_dawn_library_chinese_resolver.py'
      - 'scripts/promote_dawn_library_english_catalog.py'
      - 'scripts/promote_dawn_library_chinese_catalog.py'
      - 'scripts/test_dawn_collection_source_policy.py'
      - 'scripts/run_dawn_library_loop.py'
      - 'scripts/discover_dawn_10k_openlibrary_works.py'
      - 'scripts/build_dawn_10k_work_queue.py'
      - 'scripts/build_dawn_canonical_substrate.py'
      - 'scripts/build_dawn_storefront.py'
      - 'scripts/build_dawn_living_library.py'
      - '.github/workflows/dore-dawn-library-loop.yml'
concurrency:
  group: dore-dawn-library-main
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  library-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONPATH: .
      DAWN_TARGET_WORKS: '1000000'
      DAWN_CHINESE_TARGET: '100000'
      DAWN_OL_PAGE_SIZE: '100'
      DAWN_OL_MAX_PAGES_PER_QUERY: '300'
      DAWN_OL_DELAY_SECONDS: '0.08'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate hard collection source policy
        run: python scripts/test_dawn_collection_source_policy.py
      - name: Discover and admit Chinese collection inventory
        run: |
          python scripts/run_dawn_library_chinese_discovery.py
          python scripts/run_dawn_library_chinese_relevance.py
          python scripts/run_dawn_library_chinese_resolver.py
          python scripts/promote_dawn_library_chinese_catalog.py
      - name: Discover and admit English collection inventory
        run: |
          python scripts/run_dawn_library_discovery.py
          python scripts/run_dawn_library_relevance.py
          python scripts/run_dawn_library_english_resolver.py
          python scripts/promote_dawn_library_english_catalog.py
      - name: Expand authority inventory and reconcile canonical substrate
        run: |
          python scripts/discover_dawn_10k_openlibrary_works.py
          python scripts/build_dawn_10k_work_queue.py
          python scripts/build_dawn_canonical_substrate.py
      - name: Project living library
        run: python scripts/build_dawn_living_library.py
      - name: Produce measurable collection outputs
        run: |
          python scripts/run_dawn_library_loop.py
          python scripts/build_dawn_storefront.py
      - name: Validate growth boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          cat=json.loads(Path('static/dawn-library/biblical-world/catalog.json').read_text())
          r=json.loads(Path('reports/DAWN-LIBRARY-LOOP.json').read_text())
          store=json.loads(Path('static/dawn-library/storefront.json').read_text())
          canonical=json.loads(Path('static/dawn-library/canonical-index.json').read_text())
          living=json.loads(Path('static/dawn-library/living-library.json').read_text())
          def clean_collection_payload(value):
            t=json.dumps(value,ensure_ascii=False).casefold()
            assert 'wikisource.org' not in t and 'zh-wikisource' not in t and '維基文庫' not in t and '维基文库' not in t
          clean_collection_payload(cat)
          assert canonical.get('runtimePolicy',{}).get('wikisource') == 'forbidden'
          assert r['results']['books']['published']==len(cat['items'])
          assert store['storagePolicy']=='index-only'
          assert all(x.get('contentDownloaded') is False for s in store['shelves'] for x in s['items'])
          assert canonical['workCount']==len(canonical['works'])
          assert canonical['workCount'] > 100000
          assert living['projectionOnly'] is True and living['admissionAuthority'] is False
          assert living['canonicalWorkCount']==canonical['workCount']
          assert len(living['livingWall']['workRefs'])==canonical['workCount']
          assert all(x['workId'] in canonical['works'] for x in living['livingWall']['workRefs'])
          roots=living['classification']['roots']
          leaf_count=sum(len(x.get('children',[])) for x in roots)
          assert len(roots)==7 and leaf_count>=40
          print(json.dumps({'catalogTotal':len(cat['items']),'canonicalWorkCount':canonical['workCount'],'livingLibraryWorkCount':living['canonicalWorkCount'],'classificationRoots':len(roots),'classificationLeaves':leaf_count,'phase3':True,'phase3Target':1000000,'pipeline':r['results']['pipelineThisRun']},ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dawn-library-loop-results
          path: |
            reports/DAWN-LIBRARY-*.json
            data/dawn-10k-openlibrary-works.json
            data/dawn-10k-work-queue.json
            data/dawn-canonical/**
            static/dawn-library/canonical-index.json
            static/dawn-library/living-library.json
            static/dawn-library/surfaces/*.json
            static/dawn-library/storefront.json
            static/dawn-library/identity-cache.json
            static/dawn-library/collections.json
            static/dawn-library/biblical-world/*.json
      - name: Persist autonomous collection growth
        if: github.event_name != 'pull_request'
        run: |
          git config user.name 'Doré CI'
          git config user.email 'westsidewatchca@gmail.com'
          current_ref="${GITHUB_REF_NAME}"
          add_outputs() {
            git add reports/DAWN-LIBRARY-*.json static/dawn-library/storefront.json static/dawn-library/identity-cache.json static/dawn-library/collections.json static/dawn-library/biblical-world/*.json
            git add data/dawn-10k-openlibrary-works.json data/dawn-10k-work-queue.json static/dawn-library/canonical-index.json static/dawn-library/living-library.json static/dawn-library/surfaces/*.json
            [ ! -d data/dawn-canonical ] || git add data/dawn-canonical
          }
          regenerate() {
            python scripts/test_dawn_collection_source_policy.py
            python scripts/run_dawn_library_chinese_discovery.py
            python scripts/run_dawn_library_chinese_relevance.py
            python scripts/run_dawn_library_chinese_resolver.py
            python scripts/promote_dawn_library_chinese_catalog.py
            python scripts/run_dawn_library_discovery.py
            python scripts/run_dawn_library_relevance.py
            python scripts/run_dawn_library_english_resolver.py
            python scripts/promote_dawn_library_english_catalog.py
            python scripts/discover_dawn_10k_openlibrary_works.py
            python scripts/build_dawn_10k_work_queue.py
            python scripts/build_dawn_canonical_substrate.py
            python scripts/build_dawn_living_library.py
            python scripts/run_dawn_library_loop.py
            python scripts/build_dawn_storefront.py
          }
          add_outputs
          if git diff --cached --quiet; then exit 0; fi
          for attempt in 1 2 3 4; do
            git commit -m 'chore(dawn): persist autonomous collection growth [skip ci]'
            if git push origin "HEAD:${current_ref}"; then exit 0; fi
            git fetch origin "${current_ref}"
            git reset --hard "origin/${current_ref}"
            regenerate
            add_outputs
            if git diff --cached --quiet; then exit 0; fi
          done
          exit 1
