name: DORÉ Dawn Library Continuous Loop
on:
  workflow_dispatch:
  schedule:
    - cron: '23 */3 * * *'
  push:
    paths:
      - 'static/dawn-library/**'
      - 'scripts/run_dawn_library_*.py'
      - 'scripts/promote_dawn_library_*.py'
      - 'scripts/test_dawn_collection_source_policy.py'
      - 'scripts/validate_dawn_living_product.py'
      - 'scripts/discover_dawn_10k_openlibrary_works.py'
      - 'scripts/build_dawn_10k_work_queue.py'
      - 'scripts/build_dawn_canonical_substrate.py'
      - 'scripts/build_dawn_canonical_shards.py'
      - 'scripts/build_dawn_storefront.py'
      - 'scripts/build_dawn_living_library.py'
      - 'scripts/build_dawn_living_shards.py'
      - '.github/workflows/dore-dawn-library-loop.yml'
concurrency:
  group: dore-dawn-library-main
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  library-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONPATH: .
      DAWN_TARGET_WORKS: '1000000'
      DAWN_CHINESE_TARGET: '100000'
      DAWN_OL_PAGE_SIZE: '100'
      DAWN_OL_MAX_PAGES_PER_QUERY: '300'
      DAWN_OL_DELAY_SECONDS: '0.08'
      DAWN_CANONICAL_SHARD_SIZE: '10000'
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Configure checkpoint writer
        run: |
          git config user.name 'Doré CI'
          git config user.email 'westsidewatchca@gmail.com'
      - name: Validate hard collection source policy
        run: python scripts/test_dawn_collection_source_policy.py
      - name: Discover and admit Chinese collection inventory
        run: |
          python scripts/run_dawn_library_chinese_discovery.py
          python scripts/run_dawn_library_chinese_relevance.py
          python scripts/run_dawn_library_chinese_resolver.py
          python scripts/promote_dawn_library_chinese_catalog.py
      - name: Discover and admit English collection inventory
        run: |
          python scripts/run_dawn_library_discovery.py
          python scripts/run_dawn_library_relevance.py
          python scripts/run_dawn_library_english_resolver.py
          python scripts/promote_dawn_library_english_catalog.py
      - name: Expand authority inventory and reconcile canonical substrate
        run: |
          python scripts/discover_dawn_10k_openlibrary_works.py
          python scripts/build_dawn_10k_work_queue.py
          python scripts/build_dawn_canonical_substrate.py
          python scripts/build_dawn_canonical_shards.py
      - name: Validate canonical shard coverage
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          monolith=json.loads(Path('static/dawn-library/canonical-index.json').read_text())
          root=json.loads(Path('static/dawn-library/canonical/root.json').read_text())
          assert root['workCount']==monolith['workCount']
          assert root['authorityBackedWorks']==monolith['authorityBackedWorks']
          assert root['shardCount']==len(root['shards'])
          seen=0
          ids=set()
          for ref in root['shards']:
            p=Path('static/dawn-library/canonical')/ref['href']
            raw=p.read_bytes(); shard=json.loads(raw)
            assert hashlib.sha256(raw).hexdigest()==ref['sha256']
            assert shard['offset']==seen and shard['workCount']==len(shard['works'])
            assert shard['admissionAuthority'] is False
            overlap=ids.intersection(shard['works'])
            assert not overlap
            ids.update(shard['works']); seen+=shard['workCount']
          assert seen==root['workCount']==len(ids)==len(monolith['works'])
          assert ids==set(monolith['works'])
          print(json.dumps({'canonicalWorkCount':seen,'canonicalShards':root['shardCount']},ensure_ascii=False))
          PY
      - name: Checkpoint canonical growth immediately
        run: |
          git add static/dawn-library/canonical static/dawn-library/surfaces/*.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore(dawn): checkpoint sharded canonical growth [skip ci]'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Project and shard living library
        run: |
          python scripts/build_dawn_living_library.py
          python scripts/build_dawn_living_shards.py
      - name: Validate living projection before checkpoint
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          canonical=json.loads(Path('static/dawn-library/canonical-index.json').read_text())
          living=json.loads(Path('static/dawn-library/living-library.json').read_text())
          root=json.loads(Path('static/dawn-library/living/root.json').read_text())
          assert living['projectionOnly'] is True and living['admissionAuthority'] is False
          assert root['projectionOnly'] is True and root['admissionAuthority'] is False
          assert root['canonicalWorkCount']==living['canonicalWorkCount']==canonical['workCount']
          assert root['shardCount']==len(root['shards'])
          seen=0
          for s in root['shards']:
            p=Path('static/dawn-library/living')/Path(s['href']).name
            raw=p.read_bytes(); shard=json.loads(raw)
            assert hashlib.sha256(raw).hexdigest()==s['sha256']
            assert shard['offset']==seen and shard['workCount']==len(shard['workRefs'])
            assert shard['projectionOnly'] is True and shard['admissionAuthority'] is False
            seen+=shard['workCount']
          assert seen==canonical['workCount']
          print(json.dumps({'canonicalWorkCount':seen,'livingShards':root['shardCount']},ensure_ascii=False))
          PY
      - name: Checkpoint living projection immediately
        run: |
          git add static/dawn-library/living-library.json static/dawn-library/living
          if ! git diff --cached --quiet; then
            git commit -m 'chore(dawn): checkpoint living projection [skip ci]'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Produce measurable collection outputs
        run: |
          python scripts/run_dawn_library_loop.py
          python scripts/build_dawn_storefront.py
      - name: Validate complete growth boundaries
        run: |
          python scripts/validate_dawn_living_product.py
          python - <<'PY'
          import json
          from pathlib import Path
          canonical=json.loads(Path('static/dawn-library/canonical-index.json').read_text())
          canonical_root=json.loads(Path('static/dawn-library/canonical/root.json').read_text())
          cat=json.loads(Path('static/dawn-library/biblical-world/catalog.json').read_text())
          report=json.loads(Path('reports/DAWN-LIBRARY-LOOP.json').read_text())
          store=json.loads(Path('static/dawn-library/storefront.json').read_text())
          assert canonical.get('runtimePolicy',{}).get('wikisource')=='forbidden'
          assert canonical_root['workCount']==canonical['workCount']
          assert report['results']['books']['published']==len(cat['items'])
          assert store['storagePolicy']=='index-only'
          assert canonical['workCount']==len(canonical['works']) and canonical['workCount']>100000
          print(json.dumps({'canonicalWorkCount':canonical['workCount'],'canonicalShards':canonical_root['shardCount'],'phase3Target':1000000},ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dawn-library-loop-results
          path: |
            reports/DAWN-LIBRARY-*.json
            data/dawn-10k-openlibrary-works.json
            data/dawn-10k-work-queue.json
            static/dawn-library/canonical/root.json
            static/dawn-library/canonical/works-*.json
            static/dawn-library/living-library.json
            static/dawn-library/living/**
            static/dawn-library/surfaces/*.json
            static/dawn-library/storefront.json
            static/dawn-library/identity-cache.json
            static/dawn-library/collections.json
            static/dawn-library/biblical-world/*.json
      - name: Persist secondary outputs
        run: |
          git add reports/DAWN-LIBRARY-*.json static/dawn-library/storefront.json static/dawn-library/identity-cache.json static/dawn-library/collections.json static/dawn-library/biblical-world/*.json
          [ ! -d data/dawn-canonical ] || git add data/dawn-canonical
          if ! git diff --cached --quiet; then
            git commit -m 'chore(dawn): persist secondary collection outputs [skip ci]'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
