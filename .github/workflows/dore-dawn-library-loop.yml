name: DORÉ Dawn Library Continuous Loop
on:
  workflow_dispatch:
  schedule:
    - cron: '23 9 * * *'
  push:
    paths:
      - 'static/dawn-library/**'
      - 'scripts/run_dawn_library_discovery.py'
      - 'scripts/run_dawn_library_chinese_discovery.py'
      - 'scripts/run_dawn_library_relevance.py'
      - 'scripts/run_dawn_library_chinese_relevance.py'
      - 'scripts/run_dawn_library_chinese_resolver.py'
      - 'scripts/promote_dawn_library_chinese_catalog.py'
      - 'scripts/run_dawn_library_loop.py'
      - '.github/workflows/dore-dawn-library-loop.yml'
permissions:
  contents: write
jobs:
  library-loop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Discover English Biblical World candidates
        run: python scripts/run_dawn_library_discovery.py
      - name: Discover Chinese Biblical World candidates
        run: python scripts/run_dawn_library_chinese_discovery.py
      - name: Gate English candidates
        run: python scripts/run_dawn_library_relevance.py
      - name: Gate Chinese candidates
        run: python scripts/run_dawn_library_chinese_relevance.py
      - name: Resolve Chinese editions and page-level rights
        run: python scripts/run_dawn_library_chinese_resolver.py
      - name: Promote verified Chinese works into canonical catalog
        run: python scripts/promote_dawn_library_chinese_catalog.py
      - name: Produce measurable outputs after promotion
        run: python scripts/run_dawn_library_loop.py
      - name: Validate autonomous bilingual library loop
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('reports/DAWN-LIBRARY-DISCOVERY.json').read_text())
          z=json.loads(Path('reports/DAWN-LIBRARY-CHINESE-DISCOVERY.json').read_text())
          g=json.loads(Path('reports/DAWN-LIBRARY-RELEVANCE.json').read_text())
          zg=json.loads(Path('reports/DAWN-LIBRARY-CHINESE-RELEVANCE.json').read_text())
          zr=json.loads(Path('reports/DAWN-LIBRARY-CHINESE-RESOLVER.json').read_text())
          r=json.loads(Path('reports/DAWN-LIBRARY-LOOP.json').read_text())
          cat=json.loads(Path('static/dawn-library/biblical-world/catalog.json').read_text())
          zresolver=json.loads(Path('static/dawn-library/biblical-world/chinese-resolver-results.json').read_text())
          assert zr['qualifiedInput']==zg['results']['qualified']==len(zresolver['items'])
          assert sum(zr['results'].values())==zr['qualifiedInput']
          assert all(x.get('contentDownloaded') is False for x in zresolver['items'])
          assert all('/' not in x['title'] for x in zresolver['items'] if x['stage']=='verified')
          urls=[]
          for item in cat['items']:
            for src in item.get('sources',[]):
              assert src.get('downloadOnCatalog') is False
              if src.get('url'): urls.append(src['url'])
          assert len(urls)==len(set(urls))
          zh=[x for x in cat['items'] if x.get('work',{}).get('language')=='zh']
          assert all(x.get('rights',{}).get('status')=='public-domain' for x in zh)
          assert all(x.get('cover',{}).get('mode')=='one-fallback' for x in zh)
          assert r['results']['books']['published'] >= len(cat['items'])
          print(json.dumps({'chineseDiscovery':z,'chineseRelevance':zg,'chineseResolver':zr,'catalogTotal':len(cat['items']),'chineseCatalog':len(zh),'library':r['results']},ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dawn-library-loop-results
          path: |
            reports/DAWN-LIBRARY-*.json
            static/dawn-library/collections.json
            static/dawn-library/biblical-world/catalog.json
            static/dawn-library/biblical-world/discovery-state.json
            static/dawn-library/biblical-world/discovery-candidates.json
            static/dawn-library/biblical-world/chinese-candidates.json
            static/dawn-library/biblical-world/relevance-results.json
            static/dawn-library/biblical-world/chinese-relevance-results.json
            static/dawn-library/biblical-world/chinese-resolver-results.json
      - name: Persist autonomous library growth
        if: github.event_name != 'pull_request'
        run: |
          git config user.name 'Doré CI'
          git config user.email 'westsidewatchca@gmail.com'
          git add reports/DAWN-LIBRARY-*.json static/dawn-library/collections.json static/dawn-library/biblical-world/catalog.json static/dawn-library/biblical-world/discovery-state.json static/dawn-library/biblical-world/discovery-candidates.json static/dawn-library/biblical-world/chinese-candidates.json static/dawn-library/biblical-world/relevance-results.json static/dawn-library/biblical-world/chinese-relevance-results.json static/dawn-library/biblical-world/chinese-resolver-results.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore(dawn): persist autonomous bilingual library growth [skip ci]'
            for attempt in 1 2 3 4; do
              if git push; then exit 0; fi
              git pull --rebase origin "${GITHUB_REF_NAME}"
            done
            exit 1
          fi
