name: First Look Stage III Acceptance
on:
  pull_request:
    paths:
      - 'layouts/journal/**'
      - 'layouts/church/**'
      - 'layouts/dawn-library/**'
      - 'layouts/_default/portal.html'
      - 'layouts/_default/surface-carrier.html'
      - 'layouts/_default/baseof.html'
      - 'content/journal/**'
      - 'content/vol-00/**'
      - 'content/one/**'
      - 'content/emmaus/**'
      - 'content/daylight-cafe/**'
      - 'data/volumes/vol-00.yaml'
      - 'static/css/westside-design-os.css'
      - 'scripts/check_first_look_stage3.cjs'
      - '.github/workflows/first-look-stage3.yml'
  workflow_dispatch:
jobs:
  five-realms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Hugo
        run: |
          wget -q -O "${{ runner.temp }}/hugo.deb" "https://github.com/gohugoio/hugo/releases/download/v0.164.0/hugo_extended_0.164.0_linux-amd64.deb"
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"
      - name: Normalize legacy front matter
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for path in Path('content').rglob('*.md'):
              original=path.read_text(encoding='utf-8')
              updated=re.sub(r'(?m)^([ \t]*)_build([ \t]*:)',r'\1build\2',original)
              if updated!=original: path.write_text(updated,encoding='utf-8')
          PY
      - run: hugo --minify --baseURL /
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - name: Serve site
        run: python3 -m http.server 8765 --directory public > /tmp/first-look-server.log 2>&1 &
      - name: Verify five content realms
        run: node scripts/check_first_look_stage3.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: first-look-stage3-screenshots
          path: /tmp/first-look-stage3/*.png
