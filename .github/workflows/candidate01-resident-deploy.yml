name: Candidate 01 Resident Deploy

on:
  push:
    branches:
      - dore/candidate01-visual-graph-experiment
    paths:
      - 'dore-design/**'
      - 'static/dore-design/italian-editorial-atlas.html'
      - 'static/dore-design/italian-editorial-grammars.v1.json'
      - '.github/workflows/candidate01-resident-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate01-resident-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, macOS, dore]
    timeout-minutes: 20
    steps:
      - name: Verify local Doré repo
        run: |
          ROOT="$HOME/westsidewatch.github.io"
          test -d "$ROOT/.git"
          cd "$ROOT"
          git remote get-url origin
      - name: Resolve current Candidate 01 head
        run: |
          ROOT="$HOME/westsidewatch.github.io"
          cd "$ROOT"
          git fetch origin +refs/heads/dore/candidate01-visual-graph-experiment:refs/remotes/origin/dore/candidate01-visual-graph-experiment
          CANDIDATE_SHA="$(git rev-parse refs/remotes/origin/dore/candidate01-visual-graph-experiment)"
          test -n "$CANDIDATE_SHA"
          echo "CANDIDATE_SHA=$CANDIDATE_SHA" >> "$GITHUB_ENV"
          echo "candidate=$CANDIDATE_SHA"
      - name: Build detached Candidate 01 Design worktree
        run: |
          ROOT="$HOME/westsidewatch.github.io"
          WT="$HOME/.dore/design-candidate01"
          cd "$ROOT"
          git worktree remove --force "$WT" 2>/dev/null || true
          rm -rf "$WT"
          git worktree add --force --detach "$WT" "$CANDIDATE_SHA"
          cd "$WT"
          python3 -m py_compile dore-design/codrops_site_8x5.py dore-design/design_motion_registry.py dore-design/candidate01_visual_graph_experiment.py dore-design/sitecustomize.py dore-design/italian_editorial_atlas_runtime.py dore-design/app_design2.py
          test -f static/dore-design/italian-editorial-atlas.html
          test -f static/dore-design/italian-editorial-grammars.v1.json
      - name: Install into local Candidate 01 Design resident
        run: |
          WT="$HOME/.dore/design-candidate01"
          cd "$WT"
          export DORE_REPO_ROOT="$WT"
          export DORE_SKIP_CONTROL_PLANE_REFRESH=1
          bash dore-design/install-macos.sh
      - name: Verify running localhost Candidate 01 resident
        run: |
          FOUND=0
          for i in $(seq 1 30); do
            HTML=$(curl -fsS 'http://127.0.0.1:4310/editor-canvas?page=living-water-candidate-01' 2>/dev/null || true)
            if grep -q 'candidate01-exact-grid-preview-geometry' <<<"$HTML"; then
              grep -q 'candidate01-living-current-runtime' <<<"$HTML"
              grep -q 'candidate01-page2-assembly-runtime' <<<"$HTML"
              grep -q 'centered-mirror-' <<<"$HTML"
              grep -q 'candidate01-four-w-runtime' <<<"$HTML"
              grep -q 'WATCH' <<<"$HTML"
              grep -q 'WITNESS' <<<"$HTML"
              grep -q 'WALK' <<<"$HTML"
              grep -q 'WORSHIP' <<<"$HTML"
              ! grep -q 'dore-mosaic-layer' <<<"$HTML"
              FOUND=1
              break
            fi
            sleep 2
          done
          test "$FOUND" = 1
          EDITOR=$(curl -fsS 'http://127.0.0.1:4310/editor?page=italian-editorial-atlas')
          grep -q 'Italian Editorial Atlas / 義大利編輯圖譜' <<<"$EDITOR"
          ATLAS=$(curl -fsS 'http://127.0.0.1:4310/editor-canvas?page=italian-editorial-atlas')
          grep -q 'italian-editorial-atlas.html' <<<"$ATLAS"
          SURFACE=$(curl -fsS 'http://127.0.0.1:4310/dore-design/italian-editorial-atlas.html')
          grep -q 'Italian Editorial Atlas' <<<"$SURFACE"
          REGISTRY=$(curl -fsS 'http://127.0.0.1:4310/dore-design/italian-editorial-grammars.v1.json')
          grep -q 'dore.italian-editorial-grammars.v1' <<<"$REGISTRY"
          echo "CANDIDATE01_LOCAL_RESIDENT_PASS sha=$CANDIDATE_SHA markers=exact-grid,living-current,page2-centered,four-w,italian-atlas"
