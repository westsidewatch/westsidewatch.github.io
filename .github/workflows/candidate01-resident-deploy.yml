name: Candidate 01 Resident Deploy

on:
  push:
    paths:
      - '.github/workflows/candidate01-resident-deploy.yml'
      - 'dore-design/**'
      - 'static/dore-design/italian-editorial-atlas.html'
      - 'static/dore-design/italian-editorial-grammars.v1.json'
      - 'local/dore-local/semantic_decision.py'
      - 'local/dore-local/semantic_decision_blind_test.py'
      - 'local/dore-local/design_local_inference.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate01-resident-deploy
  cancel-in-progress: true

jobs:
  semantic-decision-blind-gate:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'semantic blind gate'))
    runs-on: [self-hosted, macOS, dore]
    timeout-minutes: 10
    steps:
      - name: Verify Doré Mac resident and Ollama
        run: |
          ROOT="$HOME/westsidewatch.github.io"
          test -d "$ROOT/.git"
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
      - name: Resolve current main head
        run: |
          ROOT="$HOME/westsidewatch.github.io"
          cd "$ROOT"
          git fetch origin +refs/heads/main:refs/remotes/origin/main
          SHA="$(git rev-parse refs/remotes/origin/main)"
          echo "SEMANTIC_SHA=$SHA" >> "$GITHUB_ENV"
          echo "semantic=$SHA"
      - name: Run isolated semantic decision blind gate
        run: |
          ROOT="$HOME/westsidewatch.github.io"
          WT="$HOME/.dore/semantic-decision-v0"
          cd "$ROOT"
          git worktree remove --force "$WT" 2>/dev/null || true
          rm -rf "$WT"
          git worktree add --force --detach "$WT" "$SEMANTIC_SHA"
          cd "$WT/local/dore-local"
          python3 -m py_compile semantic_decision.py semantic_decision_blind_test.py design_local_inference.py
          python3 semantic_decision_blind_test.py
          cat artifacts/semantic-decision-blind-gate.json

  deploy:
    if: github.ref != 'refs/heads/main' || !(github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'semantic blind gate'))
    runs-on: [self-hosted, macOS, dore]
    timeout-minutes: 20
    steps:
      - name: Verify local Doré repo
        run: |
          ROOT="$HOME/westsidewatch.github.io"
          test -d "$ROOT/.git"
          cd "$ROOT"
          git remote get-url origin
      - name: Resolve current workflow revision
        run: |
          ROOT="$HOME/westsidewatch.github.io"
          cd "$ROOT"
          git fetch origin "$GITHUB_REF"
          CANDIDATE_SHA="$(git rev-parse "$GITHUB_SHA")"
          echo "CANDIDATE_SHA=$CANDIDATE_SHA" >> "$GITHUB_ENV"
          echo "candidate=$CANDIDATE_SHA"
      - name: Build detached Candidate 01 publication worktree
        run: |
          ROOT="$HOME/westsidewatch.github.io"
          WT="$HOME/.dore/design-candidate01"
          cd "$ROOT"
          git worktree remove --force "$WT" 2>/dev/null || true
          rm -rf "$WT"
          git worktree add --force --detach "$WT" "$CANDIDATE_SHA"
          cd "$WT"
          python3 -m py_compile dore-design/codrops_site_8x5.py dore-design/design_motion_registry.py dore-design/app_design2.py
          test -f static/candidate01/watch-witness.html
          test -f static/candidate01/walk-worship.html
          test -f static/dore-design/italian-editorial-atlas.html
          test -f static/dore-design/italian-editorial-grammars.v1.json
      - name: Verify published Candidate 01 motion contracts
        run: |
          WT="$HOME/.dore/design-candidate01"
          cd "$WT"
          python3 - <<'PY'
          from pathlib import Path
          pages = [
              Path('static/candidate01/watch-witness.html'),
              Path('static/candidate01/walk-worship.html'),
          ]
          required = (
              'living-water-8x5-current',
              'lw-current-a',
              'lw-current-b',
              'translateX(',
              'function pv(p)',
              'function covered(preview)',
              'product-preview.--left',
              'product-preview.--right',
              'aspect-ratio:8/5',
              'candidate-01-4w-labels',
              'candidate01-exact-grid-preview-geometry',
              'const groupW=cr[1].right-cr[0].left',
          )
          for page in pages:
              html = page.read_text(encoding='utf-8')
              missing = [marker for marker in required if marker not in html]
              assert not missing, f'{page}: missing {missing}'
              assert 'translateY(-50%) scale(1)' in html, f'{page}: preview must remain vertically anchored'
              assert 'opacity:.08' in html and 'scale(.42)' in html, f'{page}: covered cards must contract behind preview'
          print('CANDIDATE01_PUBLICATION_CONTRACT_PASS')
          PY
      - name: Verify Italian atlas publication assets
        run: |
          WT="$HOME/.dore/design-candidate01"
          cd "$WT"
          grep -q 'Italian Editorial Atlas' static/dore-design/italian-editorial-atlas.html
          grep -q 'dore.italian-editorial-grammars.v1' static/dore-design/italian-editorial-grammars.v1.json
          echo "CANDIDATE01_PUBLICATION_PASS sha=$CANDIDATE_SHA markers=horizontal-current,opposite-preview,covered-card-fold,atlas"
