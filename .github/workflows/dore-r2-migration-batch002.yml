name: Doré governed R2 migration batch 002

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/dore-r2-migration-batch002.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Run migration and persist diagnostic receipt
        env:
          TOKEN: ${{ secrets.DORE_HEARTBEAT_TOKEN }}
        shell: bash
        run: |
          set -u
          mkdir -p dore-core/cloudflare/receipts
          python3 - <<'PY'
          import json, os, time, datetime, urllib.request, urllib.parse, urllib.error

          receipt={
            'batch_id':'asset-migration-002',
            'status':'FAIL',
            'completed_at':None,
            'assets':[],
            'registry_search_verified':[],
            'error':None
          }
          items=[
            {'source':'static/one/studio/jude-01-michael-moses-dore-studio-r2.png','code':'ONE-JUDE-01-MICHAEL-MOSES-STUDIO','preserve':'working'},
            {'source':'static/one/studio/obadiah-01-dore-studio-r2.png','code':'ONE-OBA-01-DORE-STUDIO','preserve':'working'},
            {'source':'static/one/studio/revelation-02-dore-final-full.png','code':'ONE-REV-02-DORE-FINAL','preserve':'working'},
            {'source':'static/one/dore-restorations/183-john-baptist-preaching-restored-r1.png','code':'ONE-MAT-03-JOHN-BAPTIST-PREACHING-RESTORED','preserve':'permanent'},
            {'source':'static/one/dore-restorations/184-baptism-of-jesus-restored-r1.png','code':'ONE-MAT-03-BAPTISM-JESUS-RESTORED','preserve':'permanent'},
            {'source':'static/one/motion-assets/matthew-03-baptism-dove-removed-r1.png','code':'ONE-MAT-03-BAPTISM-MOTION-SOURCE','preserve':'regenerable'}
          ]
          token=os.environ.get('TOKEN','')
          try:
              if not token:
                  raise RuntimeError('DORE_HEARTBEAT_TOKEN missing')
              for item in items:
                  body=json.dumps({
                      'source_path':item['source'],
                      'asset_code':item['code'],
                      'title':item['code'].replace('-',' '),
                      'generated_by':'dore',
                      'preservation_class':item['preserve'],
                      'products_using_it':['ONE']
                  }).encode()
                  result=None
                  for attempt in range(1,6):
                      req=urllib.request.Request(
                          'https://westsidewatch-github-io.pages.dev/api/dore/assets/migrate',
                          data=body,
                          headers={'Authorization':f'Bearer {token}','Content-Type':'application/json'},
                          method='POST')
                      try:
                          with urllib.request.urlopen(req,timeout=120) as r:
                              result=json.load(r)
                          if result.get('ok'): break
                      except urllib.error.HTTPError as e:
                          raw=e.read().decode('utf-8','replace')
                          try: result=json.loads(raw)
                          except: result={'ok':False,'http_status':e.code,'raw':raw}
                      except Exception as e:
                          result={'ok':False,'exception':repr(e)}
                      if attempt<5: time.sleep(attempt*15)
                  receipt['assets'].append({'asset_code':item['code'],'source_path':item['source'],'migration':result})
                  if not result or not result.get('ok'):
                      raise RuntimeError(f"migration failed for {item['code']}: {result}")
                  if result.get('action')!='dedupe_no_copy' and not result.get('registry_verified'):
                      raise RuntimeError(f"registry verification failed for {item['code']}: {result}")

                  q=urllib.parse.quote(item['code'])
                  with urllib.request.urlopen('https://westsidewatch-github-io.pages.dev/api/dore/assets/search?q='+q,timeout=60) as r:
                      search=json.load(r)
                  rows=search.get('results') or search.get('assets') or []
                  if not any(x.get('asset_code')==item['code'] for x in rows):
                      raise RuntimeError(f"registry search failed for {item['code']}: {search}")
                  receipt['registry_search_verified'].append(item['code'])
              receipt['status']='PASS'
          except Exception as e:
              receipt['error']=repr(e)
          receipt['asset_count']=len(receipt['assets'])
          receipt['completed_at']=datetime.datetime.now(datetime.timezone.utc).isoformat()
          path='dore-core/cloudflare/receipts/ASSET-MIGRATION-BATCH-002-RESULT.json'
          json.dump(receipt,open(path,'w'),ensure_ascii=False,indent=2)
          print(json.dumps(receipt,ensure_ascii=False,indent=2))
          PY

          git config user.name 'dore-migration-bot'
          git config user.email 'dore-migration-bot@users.noreply.github.com'
          git add dore-core/cloudflare/receipts/ASSET-MIGRATION-BATCH-002-RESULT.json
          git commit -m 'chore(dore): record batch 002 migration result [skip ci]' || true
          git pull --rebase origin main || true
          git push || true

          python3 - <<'PY'
          import json
          r=json.load(open('dore-core/cloudflare/receipts/ASSET-MIGRATION-BATCH-002-RESULT.json'))
          raise SystemExit(0 if r.get('status')=='PASS' else 1)
          PY
