name: 096 Foundation Visual Workchain
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'static/experiments/foundation-096-r05/**'
      - 'dore-design/visual-workchain/runs/foundation-096-r05/**'
      - '.github/workflows/096-foundation-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify source-only workchain gate and exact preview projection
        run: |
          git worktree add --detach /tmp/096-source ab1f7a58f2d2c5d0524df8245f65b15162fb1562
          (cd /tmp/096-source && python3 scripts/dore_visual_workchain.py --base ec208f1629d8066a9793b8149508e26ae88acb45 --run dore-design/visual-workchain/runs/foundation-096-r05/evidence.json)
          for p in index church journal dawn wall; do cmp "dore-design/visual-workchain/runs/foundation-096-r05/$p.html" "static/experiments/foundation-096-r05/$p.html"; done
          git worktree remove /tmp/096-source
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.167.0'
          extended: true
      - name: Build isolated site
        run: hugo --gc --minify --baseURL "https://westsidewatch-github-io.pages.dev/"
      - name: Install browser and Storybook
        working-directory: dore-design/knowledge-lab/storybook
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build-storybook
      - name: Render actual candidates in Chromium at four sizes
        run: |
          python3 -m http.server 4173 --directory public >/tmp/096-review.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          node dore-design/knowledge-lab/storybook/scripts/foundation-096-review.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foundation-096-r05-browser
          path: artifacts/foundation-096-r05
          if-no-files-found: warn
      - name: Publish isolated preview only
        if: always() && !cancelled()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_BRANCH: pr-${{ github.event.pull_request.number || github.run_id }}
        run: |
          test -s public/experiments/foundation-096-r05/index.html
          npx --yes wrangler@4 pages deploy public --project-name=westsidewatch-github-io --branch="$PREVIEW_BRANCH" --commit-hash="$(git rev-parse HEAD)" --commit-message="096 foundation visual review"
