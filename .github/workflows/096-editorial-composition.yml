name: 096 Editorial Composition
on:
  pull_request:
    paths:
      - 'static/church/visit/index.html'
      - 'static/experiments/096-editorial-composition/**'
      - 'tests/096-editorial-composition.cjs'
      - '.github/workflows/096-editorial-composition.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: npm install --no-save --no-package-lock playwright && npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 4173 --directory static >/tmp/composition-http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          node tests/096-editorial-composition.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editorial-composition
          path: artifacts/096-editorial-composition/