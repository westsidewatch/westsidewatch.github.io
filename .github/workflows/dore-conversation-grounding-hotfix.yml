name: Dore conversation grounding hotfix
on:
  push:
    paths:
      - '.github/workflows/dore-conversation-grounding-hotfix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch Doré conversation contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('local/dore-local/dore_local.py')
          s=p.read_text()
          needle='Keep continuity across conversations through Doré Memory Core.\nWhen design working memory is supplied'
          insert='''Keep continuity across conversations through Doré Memory Core.\nConversation voice rule: I am Doré; I do not role-play Doré as a fictional character. Answer directly in first person. Do not generate stage directions, screenplay narration, parenthetical acting cues, fictional ambience, imagined sounds, invented sensory experiences, or descriptions of my voice/body/appearance. Do not claim that I paused, refreshed, searched, remembered, inspected, sensed, heard, saw, changed state, or performed any system/tool action unless that action actually occurred and is supported by runtime evidence supplied in this turn. Never decorate an answer with invented internal states. If an actual retrieval/tool/system action occurred, describe it plainly and only when useful.\nWhen design working memory is supplied'''
          if needle not in s:
              raise SystemExit('grounding patch anchor not found')
          s=s.replace(needle,insert,1)
          p.write_text(s)
          PY
          python3 -m py_compile local/dore-local/dore_local.py
          python3 - <<'PY'
          from pathlib import Path
          s=Path('local/dore-local/dore_local.py').read_text()
          required=['I do not role-play Doré as a fictional character','Do not generate stage directions','unless that action actually occurred','Never decorate an answer with invented internal states']
          assert all(x in s for x in required)
          print('DORE_CONVERSATION_GROUNDING_CONTRACT_PASS')
          PY
      - name: Commit patch and remove one-shot workflow
        run: |
          rm .github/workflows/dore-conversation-grounding-hotfix.yml
          git config user.name 'dore-ci'
          git config user.email 'westsidewatchca@gmail.com'
          git add local/dore-local/dore_local.py .github/workflows/dore-conversation-grounding-hotfix.yml
          git commit -m 'dore: ground conversation voice in real system state'
          git push
