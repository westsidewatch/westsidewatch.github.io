name: 110 Enlarged Crest Spatial Crop
on:
  pull_request:
    paths:
      - 'static/experiments/096-editorial-composition/**'
      - 'static/church/visit/index.html'
      - 'tests/110-enlarged-crest-spatial-crop.cjs'
      - '.github/workflows/110-enlarged-crest-spatial-crop.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: npm install --no-save --no-package-lock playwright && npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 4173 --directory static >/tmp/folio110-http.log 2>&1 &
          node tests/110-enlarged-crest-spatial-crop.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editorial-110
          path: artifacts/110/