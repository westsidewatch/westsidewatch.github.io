name: Olive Portrait Asset Gate
on:
  pull_request:
    paths:
      - 'olive/**'
      - 'static/dore-design/runtime/olive-verified-portraits.v1.json'
      - 'static/olive/**'
      - 'scripts/check_olive_verified_portraits.py'
      - '.github/workflows/olive-portrait-assets.yml'
  push:
    branches: [main]
    paths:
      - 'olive/**'
      - 'static/dore-design/runtime/olive-verified-portraits.v1.json'
      - 'static/olive/**'
      - 'scripts/check_olive_verified_portraits.py'
      - '.github/workflows/olive-portrait-assets.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/check_olive_verified_portraits.py
