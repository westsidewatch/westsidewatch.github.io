name: Paradise Cinema Moment Anchor

on:
  pull_request:
    paths:
      - 'cinema/**'
      - '.github/workflows/paradise-cinema-moment-anchor.yml'
  push:
    branches: [main]
    paths:
      - 'cinema/**'
      - '.github/workflows/paradise-cinema-moment-anchor.yml'

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Moment and BiblicalAnchor substrate
        run: python cinema/moment_anchor_acceptance.py
