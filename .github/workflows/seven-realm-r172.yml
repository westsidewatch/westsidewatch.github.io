name: R172 isolated editorial masters proof
on:
  push:
    branches: [design/seven-realm-masters-r172-20261127]
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 4173 --directory static >/tmp/r172-server.log 2>&1 &
          node tests/seven-realm-r172.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seven-realm-r172
          path: artifacts/r172/
