name: Doré Complete Recall Wire 2026-08-29
on:
  push:
    paths: ['.github/workflows/dore-complete-recall-wire-20260829.yml']
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - shell: python
        run: |
          from pathlib import Path
          p=Path('local/dore-local/coordination_worker.py')
          s=p.read_text()
          if 'from complete_recall import complete_recall' not in s:
              s=s.replace('from bridge_reminder import bridge_packet','from bridge_reminder import bridge_packet\nfrom complete_recall import complete_recall')
          helper='''\ndef handle_complete_recall(msg):\n    subject=str(msg.get("subject") or "").lower()\n    body=str(msg.get("body") or "")\n    if not (msg.get("kind")=="complete_recall" or "complete recall" in subject or "完整回憶" in subject or "完整回忆" in subject):\n        return False\n    query=str(msg.get("query") or body).strip()\n    packet=complete_recall(query)\n    send_to_chatgpt(\n        "Doré complete recall: "+query[:80],\n        json.dumps(packet,ensure_ascii=False),\n        requires_reply=False, priority="high",\n        related_goal="complete-recall-automation",\n        evidence_refs=["local-memory:"+str(packet.get("conversation_count",0))+"-conversations"],\n        thread_id=msg.get("thread_id"))\n    return True\n'''
          if 'def handle_complete_recall(msg):' not in s:
              s=s.replace('def run_acceptance_tasks(prev):',helper+'\ndef run_acceptance_tasks(prev):',1)
          old='current=pending[0] if pending else None; new_messages=[current] if current else []'
          new='''current=pending[0] if pending else None\n if current and handle_complete_recall(current):\n  processed.add(current["message_id"])\n  prev.update({"repo_inbox_processed":sorted(processed),"checked_at":datetime.now(timezone.utc).isoformat()})\n  save(prev); flush_outbox(); return 0\n new_messages=[current] if current else []'''
          if old in s:
              s=s.replace(old,new,1)
          elif 'handle_complete_recall(current)' not in s:
              raise SystemExit('worker insertion point missing')
          p.write_text(s)
      - name: Verify
        run: |
          python -m py_compile local/dore-local/complete_recall.py local/dore-local/coordination_worker.py
          grep -F 'handle_complete_recall(current)' local/dore-local/coordination_worker.py
      - name: Commit
        run: |
          git config user.name WATCHMAN
          git config user.email westsidewatchca@gmail.com
          git add local/dore-local/coordination_worker.py
          git commit -m 'dore: wire complete recall into resident worker'
          git rm .github/workflows/dore-complete-recall-wire-20260829.yml
          git commit -m 'ci: remove one-shot recall wiring workflow'
          git push
