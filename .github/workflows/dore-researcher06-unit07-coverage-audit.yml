name: Doré Researcher 06 Unit 07 Coverage Audit

on:
  push:
    branches: [main]
    paths:
      - 'scripts/dore/mandarin-coverage-audit.mjs'
      - 'scripts/dore/phonetic-encoders.mjs'
      - 'static/dore/entity-index.json'
      - '.github/workflows/dore-researcher06-unit07-coverage-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dore-researcher06-unit07-coverage-audit
  cancel-in-progress: false

jobs:
  coverage-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Measure corpus-wide Mandarin entity coverage
        run: |
          mkdir -p dore-core/knowledge/researcher/evidence
          node scripts/dore/mandarin-coverage-audit.mjs > dore-core/knowledge/researcher/evidence/researcher06-unit07-mandarin-coverage.json
      - name: Persist audit evidence
        run: |
          git config user.name 'Doré Researcher'
          git config user.email 'westsidewatchca@gmail.com'
          git add dore-core/knowledge/researcher/evidence/researcher06-unit07-mandarin-coverage.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'test(dore): persist Researcher 06 Unit 07 Mandarin coverage evidence [skip ci]'
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          exit 1
