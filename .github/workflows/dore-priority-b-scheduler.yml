name: Doré Priority B scheduler
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  actions: write
  contents: read
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch corrected Priority B run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run dore-r2-priority-b-run.yml --repo ${{ github.repository }}