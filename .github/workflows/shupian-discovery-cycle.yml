name: PARADISO full-cycle source discovery
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/shupian_recovery/discover_sources.py'
      - 'scripts/shupian_recovery/source_lifecycle.py'
      - 'scripts/shupian_recovery/source_providers.json'
      - 'scripts/shupian_recovery/test_discover_sources.py'
      - '.github/workflows/shupian-discovery-cycle.yml'
permissions:
  contents: write
concurrency:
  group: shupian-source-evidence
  cancel-in-progress: false
jobs:
  source-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit regression (including original recovered core)
        run: python3 -m unittest discover -s scripts/shupian_recovery -p 'test_*.py' -v
      - name: Repeat source scan for Black Mirror and Sherlock HLS segments
        id: discovery
        run: |
          python3 scripts/shupian_recovery/discover_sources.py \
            --keywords '黑鏡' '神探夏洛克' \
            --max-audits 16 --rescan-previous \
            --report static/shupian/recovery/engine-live-round.json
      - name: Verify report schema and no fake catalog admission
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          path=Path('static/shupian/recovery/engine-live-round.json')
          assert path.is_file(), 'No live round evidence report produced'
          data=json.loads(path.read_text())
          assert data['run_id'] == os.environ['GITHUB_RUN_ID'], 'Stale report from another workflow'
          observed=datetime.fromisoformat(data['observed_at_utc'].replace('Z', '+00:00'))
          freshness=(datetime.now(timezone.utc)-observed).total_seconds()
          assert -120 <= freshness < 600, 'Report is not fresh'
          assert data['schema'] >= 3, 'Old report schema'
          assert data['completion']=='NOT_COMPLETED'
          assert data['stages']['playback']=='not-tested-in-browser'
          assert all('url' not in a for a in data['audits'])
          assert all('url' not in a for a in data['tracked_sources'])
          assert len(data['tracked_sources']) >= len(data['audits'])
          assert all(not (a.get('manifest') == 'parsed' and a.get('failure_class'))
                     for a in data['audits']), 'Manifest success must not carry an HTTP failure'
          print('Real provider searches attempted:',data['provider_queries_attempted'])
          print('Provider failures:',data['provider_queries_failed'])
          print('Unique media candidates:',data['unique_media_candidates'])
          print('Manifest inspections passed:',data['manifests_parsed'])
          print('Exact URL continuity:',data.get('same_exact_url_count'))
          print('Changed URL identity:',data.get('changed_url_count'))
          print('404 media errors:',data.get('http_404_count'))
          print('Alternate episodes probed:',data.get('alternative_candidates_audited'))
          print('New candidate audits:',data.get('new_candidates_audited'))
          print('Start/middle/end segment checks passed:',data.get('segment_sample_pass',0))
          PY
      - name: Commit sanitized evidence to website (not playback approval)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/shupian/recovery/engine-live-round.json
          if ! git diff --cached --quiet; then
            git commit -m 'data(shupian): publish live source discovery and validation evidence'
            git push || (git pull --rebase -X theirs origin main && git push)
          fi
      - name: Preserve full technical report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shupian-engine-source-round
          path: static/shupian/recovery/engine-live-round.json
          if-no-files-found: warn
