name: Dore Visual Engineer

on:
  pull_request:
    paths:
      - 'static/**'
      - 'assets/**'
      - 'layouts/**'
      - 'content/**'
      - 'dore-design/**'
      - 'tools/dore-visual/**'
      - '.github/workflows/dore-visual-engineer.yml'
  workflow_dispatch:
    inputs:
      url:
        description: Public or preview URL to probe
        required: true
        default: https://westsidewatch.github.io/candidate01/walk-worship.html

jobs:
  sitewide-visual-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Build PR-local Hugo site
        run: |
          HUGO_VERSION=0.167.0
          curl -fsSL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" -o /tmp/hugo.tgz
          tar -xzf /tmp/hugo.tgz -C /tmp hugo
          /tmp/hugo --minify --destination public
      - name: Start PR-local site preview
        run: |
          python3 -m http.server 4173 --directory public >/tmp/dore-preview.log 2>&1 &
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && curl -fsS http://127.0.0.1:4173/candidate01/walk-worship.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/dore-preview.log
          exit 1
      - name: Probe sitewide visual contracts
        run: |
          node tools/dore-visual/geometry-probe.js "http://127.0.0.1:4173/"
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dore-visual-evidence
          path: artifacts/dore-visual
          if-no-files-found: error
