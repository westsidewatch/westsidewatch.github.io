name: Dore Full Memory Phase 1 M3 Test
on:
  push:
    paths:
      - functions/api/dore/memory.js
      - functions/api/dore/memory-phase1-m3-diagnostic.js
      - .github/workflows/dore-full-memory-phase1-m3-test.yml
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - run: sleep 35
      - env:
          DORE_HEARTBEAT_TOKEN: ${{ secrets.DORE_HEARTBEAT_TOKEN }}
        run: |
          test -n "$DORE_HEARTBEAT_TOKEN"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $DORE_HEARTBEAT_TOKEN" \
            https://westsidewatch-github-io.pages.dev/api/dore/memory-phase1-m3-diagnostic \
            | tee /tmp/m3.json
      - run: python3 -c "import json; d=json.load(open('/tmp/m3.json')); assert d.get('milestone')=='M3_CONVERSATION_INGESTION_PASS',d; print(json.dumps(d,ensure_ascii=False))"
