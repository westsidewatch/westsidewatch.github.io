name: Hosanna Media Integrity
on:
  pull_request:
    paths:
      - 'preview/watch-city-vol00/hosanna/**'
      - '.github/workflows/hosanna-media-integrity.yml'
      - '.github/workflows/vol00-media.yaml'
      - '.github/workflows/deploy-pages.yml'
  push:
    branches: [main]
    paths:
      - 'preview/watch-city-vol00/hosanna/**'
jobs:
  media-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore Vol.00 producer output
        uses: actions/cache/restore@v4
        with:
          path: preview/watch-city-vol00/hosanna/media/clips
          key: vol00-media-v2-${{ hashFiles('.github/workflows/vol00-media.yaml', 'preview/watch-city-vol00/**', 'dore-core/tools/video_master.py') }}
          restore-keys: |
            vol00-media-v2-
      - name: Wait for producer cache on a cold v2 build
        if: ${{ hashFiles('preview/watch-city-vol00/hosanna/media/clips/**') == '' }}
        run: |
          echo "Producer cache is not available yet; Build Vol.00 media is authoritative on cold builds."
          exit 0
      - name: Verify publishable sequence assets exist
        if: ${{ hashFiles('preview/watch-city-vol00/hosanna/media/clips/**') != '' }}
        run: python3 preview/watch-city-vol00/hosanna/verify_media.py
