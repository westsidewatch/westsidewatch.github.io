name: R184 Emmaus original texture extension proof
on:
  pull_request:
    branches: [design/emmaus-incised-edge-r183-20261127]
permissions:
  contents: read
jobs:
  proof:
    if: github.head_ref == 'design/emmaus-texture-extension-r184-20261127'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 4173 --directory static >/tmp/r184-server.log 2>&1 &
          node tests/seven-realm-r184.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seven-realm-r184
          path: artifacts/r184/
