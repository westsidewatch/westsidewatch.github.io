name: Fix Jerusalem prose
on:
  push:
    paths:
      - '.github/workflows/fix-jerusalem-prose.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair prose rhythm
        shell: python
        run: |
          from pathlib import Path
          p = Path('docs/projects/watch-city-vol00/manuscript/JERUSALEM-BUILD.md')
          s = p.read_text(encoding='utf-8')
          start = s.index('## 上帝擦去一切的眼淚')
          end = s.index('## 附錄｜詩篇九十一篇', start)
          revised = '''## 上帝擦去一切的眼淚

世界是一場巨大的風暴。城滅城建，耶路撒冷在風暴眼中。梁贊、基輔、巴格達、安條克，每一次屠城留下的死亡數字都在不同史料之間漂移。城破時還有多少居民，多少逃走，多少被俘，多少死於刀兵，多少死於飢餓和疾病，隔幾百年已經很難分清。年表更不會留下母親哭了多久，一個孩子在廢墟裡找過幾天父親，一個人離開自己的城以後，一生還有多少次在夢裡回去。

《啟示錄》第五章，約翰哭過，長老對他說：「不要哭。」到了第二十一章，約翰又看見一座城。不是大衛建的，不是所羅門建的，不是希律建的，不是哈德良建的，也不是十字軍、馬穆魯克或蘇萊曼建的。聖城新耶路撒冷，由神那裡從天而降。寶座有大聲音說，神的帳幕在人間，他要與人同住，他們要作他的子民，神要親自與他們同在。「神要擦去他們一切的眼淚。」不再有死亡，也不再有悲哀、哭號、疼痛。

從示劍的兩把刀，到梁贊的城牆，到釣魚城飛出去的石頭，再到君士坦丁堡的大炮，人類一直在延長自己的手臂。人為保護自己築牆，又為穿過別人的牆發明更遠的武器。牆越建越厚，武器也越來越大。石頭本來拿來建城，也拿來殺人。聖殿的石頭一塊一塊堆起來，耶穌卻說，將來沒有一塊留在另一塊上。世界上的建造都在時間裡等待自己的破。帝國建城，下一個帝國拆掉它；人築牆保護自己，另一群人研究怎樣把牆打穿。

《彼得前書》卻把石頭放到了另一個地方。人來到基督面前，「也就像活石，被建造成為靈宮」。石頭第一次不再只是山裡鑿下來的東西，人自己成了石頭，而人原本只是塵土，被顧念的塵土。最後的拯救不是人終於建成一座誰也攻不破的城，城從神那裡降下來。

雅各臨死以前還記得兒子手上的刀。他說：「我的靈啊，不要與他們同謀。」約翰在世界的末了，看見神擦去人的眼淚。兩句話之間隔着漫長的歷史，中間全是人的城。

'''
          p.write_text(s[:start] + revised + s[end:], encoding='utf-8')
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/fix-jerusalem-prose.yml
          git config user.name "westsidewatch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/projects/watch-city-vol00/manuscript/JERUSALEM-BUILD.md .github/workflows/fix-jerusalem-prose.yml
          git commit -m "Edit Jerusalem manuscript prose rhythm"
          git push