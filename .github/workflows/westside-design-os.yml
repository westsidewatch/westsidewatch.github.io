name: Westside Design OS
on:
  pull_request:
    paths:
      - 'static/css/**'
      - 'assets/css/**'
      - 'layouts/**'
      - 'scripts/check_westside_design_os.py'
      - 'scripts/check_design_os_entrypoints.py'
      - '.github/workflows/westside-design-os.yml'
  workflow_dispatch:
jobs:
  authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate single visual authority
        run: python3 scripts/check_westside_design_os.py
      - name: Audit standalone Design OS entrypoints
        run: python3 scripts/check_design_os_entrypoints.py
