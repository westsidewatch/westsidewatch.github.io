name: ONE Matthew 5 Luke Plain Sermon + Doré Lesson 2026-08-29
on:
  push:
    paths:
      - '.github/workflows/one-matthew5-luke-plain-sermon-lesson-20260829.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Matthew 5 harmony and write lesson
        shell: python
        run: |
          from pathlib import Path
          p=Path('static/one/matthew-complete.js')
          s=p.read_text()
          old='harmony: [["寶訓","山上寶訓 · 太 5:1–7:29","—","平原寶訓 · 路 6:20–49","—"],["鹽與光","太 5:13–16","可 9:50","路 11:33；14:34–35","—"],["愛仇敵","太 5:43–48","—","路 6:27–36","—"]],'
          new='harmony: [["山上寶訓","太 5:1–7:29","—","—","—"],["平原寶訓","—","—","路 6:20–49","—"],["鹽與光","太 5:13–16","可 9:50","路 11:33；14:34–35","—"],["愛仇敵","太 5:43–48","—","路 6:27–36","—"]],'
          if old not in s:
              raise SystemExit('Expected Matthew 5 harmony row not found')
          p.write_text(s.replace(old,new,1))
          lesson=Path('docs/dore/lessons/ONE-LESSON-001-GOSPEL-HARMONY-AUDIT.md')
          lesson.parent.mkdir(parents=True,exist_ok=True)
          lesson.write_text('''# Doré 教案 001：ONE 四福音合參校訂\n\n日期：2026-08-29\n真實產品：ONE\n工作類型：知識結構維護 / 福音書合參 / 編輯判斷 / GitHub 驗證\n\n## 原始要求\n\n使用者指出馬太福音第 5 章的四福音合參中，「平原寶訓」必須明確放在路加福音；同時要求重新察看 ONE 現有四福音合參，有錯即改。後續使用者查看實際頁面後再次指出：僅把「平原寶訓」寫在同一個「寶訓」事件格內仍不夠，頁面上應當**直接提到路加福音的平原寶訓**，不能讓它視覺上依附於馬太的「山上寶訓」。\n\n## 為甚麼第一版仍不夠好\n\n第一版資料是：\n\n`寶訓 | 山上寶訓 · 太 5:1–7:29 | — | 平原寶訓 · 路 6:20–49 | —`\n\n資料欄位 technically 正確，但產品語義仍不夠清楚：事件欄只有「寶訓」，讀者掃讀時不能直接看到「平原寶訓」是一個路加福音事件。使用者的截圖揭示了**資料正確 ≠ 介面傳達正確**。\n\n## 正確修法\n\n拆成兩條獨立合參行：\n\n- `山上寶訓 | 太 5:1–7:29 | — | — | —`\n- `平原寶訓 | — | — | 路 6:20–49 | —`\n\n如此事件名稱與福音欄位同時表達來源，也保留兩篇講論可比較但不可粗暴視為同一事件的編輯判斷。\n\n## 全量審核方法\n\n1. 找出 ONE 四福音資料中所有 `harmony:`。\n2. 逐行檢查事件名稱、馬太/馬可/路加/約翰欄位與章節範圍。\n3. 驗證引用沒有落入錯誤福音欄、章號沒有超出該福音範圍。\n4. 對同名事件的不同經文範圍做人工語義判斷，不機械統一。\n5. 特別辨識「相似材料」與「同一次歷史事件」的差別。\n6. 修改後做語法檢查與資料斷言。\n\n## 本次發現的重要案例\n\n### 1. 山上寶訓 / 平原寶訓\n\n馬太 5–7 與路加 6:20–49 有大量平行教導，但敘事場景和編排不同。ONE 應讓讀者看見它們的關聯，也應保留各自名稱與福音位置。\n\n### 2. 復活顯現不可錯合為一次事件\n\n馬太 28:16–17 是加利利山上的顯現；馬可較長結尾、路加 24、約翰 20–21 包含不同時間與地點。合參可以並列神學/使命主題，但不能用資料結構暗示它們全是同一次顯現。\n\n### 3. 不要為了資料一致而抹平文本差異\n\n例如同名事件可能因編輯目的取較窄或較寬經文範圍；約翰潔淨聖殿的敘事位置也與符類福音不同。應標示差異，而不是機械改成同一範圍。\n\n## Doré 必須學會的能力\n\n這不是「搜尋字串然後改檔案」的工作。完成黎明書局與 ONE 維護至少需要：\n\n- 理解使用者自然語言要求；\n- 找到真實產品資料來源；\n- 理解資料 schema 與 UI 如何呈現；\n- 以聖經文本與敘事位置核查知識關係；\n- 分辨真正錯誤、資料差異與合理編輯選擇；\n- 修改 GitHub 來源；\n- 執行語法與內容驗證；\n- 查看實際產品呈現，接受使用者回饋再修正；\n- 留下可追溯 evidence。\n\n## 學習循環\n\n`使用者要求 → 定位資料 → 提出預期 → 全量檢查 → 發現異常 → 經文/敘事核查 → 修改 → 測試 → 實際頁面察看 → 使用者指出殘餘問題 → 修正策略 → 再驗證 → 留下教案`\n\n關鍵教訓：**驗收不是「程式碼看起來對」，而是知識、資料結構與讀者實際看到的產品三者一致。**\n\n## 接手標準\n\nDoré 未來若要獨立接手這類工作，必須在沒有使用者充當傳聲筒或 Terminal 操作者的情況下，完成上述完整閉環，並留下可核查 commit、測試與產品結果。只有搜尋到相關經文、生成建議或聲稱理解，不算 PASS。\n''')
      - name: Verify
        run: |
          node --check static/one/matthew-complete.js
          python - <<'PY'
          from pathlib import Path
          s=Path('static/one/matthew-complete.js').read_text()
          assert '["山上寶訓","太 5:1–7:29","—","—","—"]' in s
          assert '["平原寶訓","—","—","路 6:20–49","—"]' in s
          assert 'ONE 四福音合參校訂' in Path('docs/dore/lessons/ONE-LESSON-001-GOSPEL-HARMONY-AUDIT.md').read_text()
          PY
      - name: Commit result and remove one-shot workflow
        run: |
          git config user.name WATCHMAN
          git config user.email westsidewatchca@gmail.com
          git add static/one/matthew-complete.js docs/dore/lessons/ONE-LESSON-001-GOSPEL-HARMONY-AUDIT.md
          git commit -m 'fix(one): show Luke Plain Sermon as explicit harmony event'
          git rm .github/workflows/one-matthew5-luke-plain-sermon-lesson-20260829.yml
          git commit -m 'ci: remove one-shot Matthew 5 lesson workflow'
          git push
