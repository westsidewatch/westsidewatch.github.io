name: Doré Bible Search
on:
  workflow_dispatch:
  push:
    paths:
      - 'dore-core/reflex/**'
      - 'dore_core/search/**'
      - 'dore_core/language/**'
      - 'dore_core/readers/**'
      - 'scripts/build_dore_browser_search_index.py'
      - 'scripts/build_dore_crossrefs_index.py'
      - 'scripts/verify_dore_bible_search_product.py'
      - 'scripts/verify_dore_bible_intelligence.js'
      - 'scripts/verify_dore_open_crossrefs.js'
      - 'static/dore/**'
      - 'join/index.html'
      - 'static/one/one-opening-simple.js'
      - 'static/one/one-cross-reference-scripture-global-audit.js'
      - 'layouts/index.html'
      - '.github/workflows/dore-bible-search.yml'
permissions:
  contents: write
jobs:
  build-search:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build browser Scripture indexes
        env:
          PYTHONPATH: .
        run: python scripts/build_dore_browser_search_index.py
      - name: Build NEUU OpenBible + TSK cross-reference shards
        run: |
          git lfs install
          python scripts/build_dore_crossrefs_index.py
      - name: Verify million-edge open cross-reference ingestion
        run: node scripts/verify_dore_open_crossrefs.js
      - name: Verify Search 2 Bible Intelligence semantic benchmark
        run: node scripts/verify_dore_bible_intelligence.js
      - name: Verify index, function page, and learning reflex 001
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          core_path=Path('static/dore/search-index.json')
          original_path=Path('static/dore/original-index.json')
          core=json.loads(core_path.read_text(encoding='utf-8'))
          original=json.loads(original_path.read_text(encoding='utf-8'))
          manifest=json.loads(Path('static/dore/crossrefs/manifest.json').read_text(encoding='utf-8'))
          assert core['schema']=='dore.browser-search-core.v1'
          assert original['schema']=='dore.browser-original-index.v1'
          assert len(core['verses']) >= 31000
          assert original['lemma'] and original['morphology'] and original['original_surface']
          assert manifest['schema']=='dore.crossrefs.manifest.v1'
          assert manifest['stats']['directed_edges'] >= 1_000_000
          assert manifest['stats']['unique_verses'] >= 30_000
          assert manifest['license']=='CC BY 4.0' and manifest['contains_bible_text'] is False
          refs={v['r'] for v in core['verses']}
          assert 'bible.ref.JHN.3.16' in refs
          assert 'bible.ref.JER.33.3' in refs
          assert all(isinstance(i,int) for refs_ in list(original['lemma'].values())[:20] for i in refs_)
          html=Path('static/dore/search/index.html').read_text(encoding='utf-8')
          redirect=Path('static/dore/index.html').read_text(encoding='utf-8')
          js=Path('static/dore/dore-search.js').read_text(encoding='utf-8')
          reflex=Path('dore-core/reflex/signals/001-translated-phrase-to-original-language.md').read_text(encoding='utf-8')
          assert '耶利米書 33:3' in html and ('/background.jpg' in html or 'SITE-BACKGROUND' in html) and 'id="search-form"' in html
          assert '/dore/search/' in redirect
          jesse=[(i,v) for i,v in enumerate(core['verses']) if '耶西的本' in v.get('z','')]
          assert jesse, 'CUV phrase 耶西的本 must resolve to a canonical passage'
          isa=[(i,v) for i,v in jesse if v['r']=='bible.ref.ISA.11.1']
          assert isa, '耶西的本 must include Isaiah 11:1 in the pinned CUV witness'
          verse_id=isa[0][0]
          surfaces=[k for k,ids in original['original_surface'].items() if verse_id in ids]
          lemmas=[k for k,ids in original['lemma'].items() if verse_id in ids]
          assert surfaces and lemmas, 'Isaiah 11:1 must have OSHB original-language evidence'
          assert 'translated-to-original' in js and 'originalEvidence' in js
          assert '耶西的本 希伯來原文' in reflex
          print({'status':'PASS','function_url':'/dore/search/','reflex':'001-translated-phrase-to-original-language','crossrefs':manifest['stats'],'query':'耶西的本 希伯來原文','passage':'bible.ref.ISA.11.1','original_surfaces':surfaces,'lemmas':lemmas})
          PY
      - name: Accept Doré Bible Search work node
        run: python scripts/verify_dore_bible_search_product.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dore-bible-search
          path: |
            static/dore/search-index.json
            static/dore/original-index.json
            static/dore/crossrefs/
            reports/DORÉ-BIBLE-SEARCH-WORK-NODE.json
      - name: Persist public search indexes and acceptance evidence
        if: always() && github.event_name == 'push'
        run: |
          git config user.name 'Doré CI'
          git config user.email 'westsidewatchca@gmail.com'
          git add static/dore/search-index.json static/dore/original-index.json static/dore/crossrefs reports/DORÉ-BIBLE-SEARCH-WORK-NODE.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'chore(dore): publish Bible Search work-node evidence [skip ci]'
            for attempt in 1 2 3 4; do
              if git push; then exit 0; fi
              git pull --rebase origin "${GITHUB_REF_NAME}"
            done
            exit 1
          fi
