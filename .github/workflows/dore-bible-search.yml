name: Doré Bible Search
on:
  workflow_dispatch:
  push:
    paths:
      - 'dore_core/search/**'
      - 'dore_core/language/**'
      - 'dore_core/readers/**'
      - 'scripts/build_dore_browser_search_index.py'
      - 'scripts/verify_dore_bible_search_product.py'
      - 'static/dore/**'
      - 'join/index.html'
      - 'static/one/one-opening-simple.js'
      - 'layouts/index.html'
      - '.github/workflows/dore-bible-search.yml'
permissions:
  contents: write
jobs:
  build-search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build browser Scripture indexes
        env:
          PYTHONPATH: .
        run: python scripts/build_dore_browser_search_index.py
      - name: Verify index and dedicated function page
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          core_path=Path('static/dore/search-index.json')
          original_path=Path('static/dore/original-index.json')
          core=json.loads(core_path.read_text(encoding='utf-8'))
          original=json.loads(original_path.read_text(encoding='utf-8'))
          assert core['schema']=='dore.browser-search-core.v1'
          assert original['schema']=='dore.browser-original-index.v1'
          assert len(core['verses']) >= 31000
          assert original['lemma'] and original['morphology'] and original['original_surface']
          refs={v['r'] for v in core['verses']}
          assert 'bible.ref.JHN.3.16' in refs
          assert 'bible.ref.JER.33.3' in refs
          assert all(isinstance(i,int) for refs_ in list(original['lemma'].values())[:20] for i in refs_)
          html=Path('static/dore/search/index.html').read_text(encoding='utf-8')
          redirect=Path('static/dore/index.html').read_text(encoding='utf-8')
          assert '耶利米書 33:3' in html and '/background.jpg' in html and 'id="search-form"' in html
          assert '/dore/search/' in redirect
          print({'status':'PASS','function_url':'/dore/search/','verses':len(core['verses']),'lemmas':len(original['lemma']),'core_bytes':core_path.stat().st_size,'original_bytes':original_path.stat().st_size})
          PY
      - name: Accept Doré Bible Search work node
        run: python scripts/verify_dore_bible_search_product.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dore-bible-search
          path: |
            static/dore/search-index.json
            static/dore/original-index.json
            reports/DORÉ-BIBLE-SEARCH-WORK-NODE.json
      - name: Persist public search indexes and acceptance evidence
        if: always() && github.event_name == 'push'
        run: |
          git config user.name 'Doré CI'
          git config user.email 'westsidewatchca@gmail.com'
          git add static/dore/search-index.json static/dore/original-index.json reports/DORÉ-BIBLE-SEARCH-WORK-NODE.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'chore(dore): publish Bible Search work-node evidence [skip ci]'
            for attempt in 1 2 3 4; do
              if git push; then exit 0; fi
              git pull --rebase origin main
            done
            exit 1
          fi
