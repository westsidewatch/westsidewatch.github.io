name: DORE Universal Source Probe v0
on:
  pull_request:
    paths:
      - 'local/dore-local/source_probe_capability.py'
      - 'local/dore-local/source_probe_acceptance.py'
      - 'local/dore-local/source_probe_action.py'
      - 'local/dore-local/source_capability_envelope.py'
      - 'local/dore-local/source_capability_envelope_acceptance.py'
      - 'local/dore-local/source_capability_action.py'
      - 'local/dore-local/native_host.py'
      - 'local/dore-local/runtime_source_probe.js'
      - 'local/dore-companion-extension/runtime_probe_background.js'
      - 'local/dore-companion-extension/runtime_probe_executor.js'
      - 'local/dore-companion-extension/site_bridge.js'
      - 'local/dore-companion-extension/manifest.json'
      - 'cinema/preview-controller.js'
      - 'dore-core/runtime/capability-registry.v1.json'
      - '.github/workflows/dore-universal-source-probe-v0.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          python -m py_compile local/dore-local/source_probe_capability.py local/dore-local/source_probe_acceptance.py local/dore-local/source_probe_action.py local/dore-local/source_capability_envelope.py local/dore-local/source_capability_envelope_acceptance.py local/dore-local/source_capability_action.py local/dore-local/native_host.py
          python -c "import json; json.load(open('local/dore-companion-extension/manifest.json')); json.load(open('dore-core/runtime/capability-registry.v1.json'))"
          node --check local/dore-local/runtime_source_probe.js
          node --check local/dore-companion-extension/runtime_probe_background.js
          node --check local/dore-companion-extension/runtime_probe_executor.js
          node --check local/dore-companion-extension/site_bridge.js
          node --check cinema/preview-controller.js
      - name: Standard-first and runtime provider-neutral acceptance
        run: python local/dore-local/source_probe_acceptance.py
      - name: Source Capability Envelope v1 acceptance
        run: python local/dore-local/source_capability_envelope_acceptance.py
      - name: Runtime to Cinema contract
        run: |
          python - <<'PY'
          from pathlib import Path
          files=[
            Path('local/dore-companion-extension/runtime_probe_background.js'),
            Path('local/dore-companion-extension/site_bridge.js'),
            Path('cinema/preview-controller.js'),
          ]
          text='\n'.join(p.read_text() for p in files)
          background=Path('local/dore-companion-extension/runtime_probe_background.js').read_text()
          action=Path('local/dore-local/source_capability_action.py').read_text()
          host=Path('local/dore-local/native_host.py').read_text()
          assert 'dore.runtime-source-probe.v0' in text
          assert 'dore:runtime-source-probe' in text
          assert 'dore:runtime-source-probe-result' in text
          assert 'source.probe' in text
          assert 'runtimeSnapshot' in text
          assert 'source.capability-envelope' in background
          assert 'runtimeBoundary?.required' in background
          assert "needs.includes('runtime-browser-probe')" not in background
          assert 'source.capability-envelope' in action
          assert 'source_capability_action' in host
          assert 'goodtv' not in text.lower()
          print('DORE_RUNTIME_PROBE_CINEMA_HANDOFF=PASS')
          print('DORE_RUNTIME_PROBE_CAPABILITY_ROUTING=PASS')
          print('DORE_RUNTIME_PROBE_PROVIDER_NEUTRAL=PASS')
          PY
      - name: Real GOOD TV first-party static boundary probe
        run: python local/dore-local/source_probe_acceptance.py
        env:
          DORE_SOURCE_PROBE_LIVE: '1'
