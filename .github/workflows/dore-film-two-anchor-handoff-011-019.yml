name: DORÉ Film Two-Anchor Handoff 011-019

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/dore-film-two-anchor-handoff-011-019.yml'

jobs:
  two-anchor-handoff-road-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install mature stack
        run: |
          python -m pip install --quiet pillow numpy
          git clone --depth 1 https://github.com/ByteDance-Seed/Depth-Anything-3.git /tmp/depth-anything-3
          python -m pip install -e /tmp/depth-anything-3
          sudo apt-get update -qq
          sudo apt-get install -y blender ffmpeg
          blender --version

      - name: Fetch canonical Doré originals
        run: |
          mkdir -p .handoff011019/input .handoff011019/output
          curl -L --fail --retry 3 'https://upload.wikimedia.org/wikipedia/commons/e/e5/011.Abraham_Goes_to_the_Land_of_Canaan.jpg' -o .handoff011019/input/dore-011.jpg
          curl -L --fail --retry 3 'https://upload.wikimedia.org/wikipedia/commons/c/c6/019.The_Meeting_of_Isaac_and_Rebekah.jpg' -o .handoff011019/input/dore-019.jpg

      - name: Recover both Doré fields and export native OBJ handoff
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, numpy as np, torch
          from depth_anything_3.api import DepthAnything3
          root=Path('.handoff011019'); out=root/'output'
          model=DepthAnything3.from_pretrained('depth-anything/DA3-SMALL').to(device=torch.device('cpu'))
          items=[('011',root/'input/dore-011.jpg'),('019',root/'input/dore-019.jpg')]
          meta={'experiment':'DORE-TWO-ANCHOR-HANDOFF-011-019','anchors':[],'rule':'ROAD FIRST: one continuous viewing camera, two canonical fields, no character animation, no generative bridge, no fidelity polishing.'}
          for dore_id,src in items:
              pred=model.inference([str(src)])
              depth=np.asarray(pred.depth[0],dtype=np.float32); K=np.asarray(pred.intrinsics[0],dtype=np.float32)
              h,w=depth.shape; stride=6; z=depth[::stride,::stride]; hh,ww=z.shape
              yy,xx=np.mgrid[0:hh,0:ww].astype(np.float32); px=xx*stride; py=yy*stride
              x=(px-K[0,2])*z/K[0,0]; y=(py-K[1,2])*z/K[1,1]
              pts=np.stack([x,-y,-z],axis=-1).astype(np.float32); med=float(np.median(z[z>0]))
              if med>0: pts/=med
              obj=out/f'dore-{dore_id}.obj'
              with obj.open('w',encoding='utf-8') as f:
                  f.write(f'o DORE_{dore_id}_FIELD\n')
                  for v in pts.reshape(-1,3): f.write(f'v {v[0]} {v[1]} {v[2]}\n')
                  for j in range(hh):
                      for i in range(ww): f.write(f'vt {i/(ww-1):.8f} {1-j/(hh-1):.8f}\n')
                  for j in range(hh-1):
                      for i in range(ww-1):
                          a=j*ww+i+1; b=a+1; c=(j+1)*ww+i+1; d2=c+1
                          f.write(f'f {a}/{a} {c}/{c} {b}/{b}\n'); f.write(f'f {b}/{b} {c}/{c} {d2}/{d2}\n')
              meta['anchors'].append({'dore_id':dore_id,'source':src.name,'depth_shape':[h,w],'mesh_grid':[hh,ww]})
          (out/'metadata.json').write_text(json.dumps(meta,indent=2),encoding='utf-8')
          PY

      - name: Build two projection stages with one continuous viewing camera
        run: |
          cat > .handoff011019/build.py <<'PY'
          import bpy, os, json, math
          from mathutils import Vector
          base=os.path.abspath('.handoff011019'); out=os.path.join(base,'output')
          bpy.ops.wm.read_factory_settings(use_empty=True)
          scene=bpy.context.scene
          if scene.world is None:
              scene.world=bpy.data.worlds.new('DORE_FILM_WORLD')
          scene.world.color=(0,0,0)
          def import_obj(path):
              if hasattr(bpy.ops.wm,'obj_import'): bpy.ops.wm.obj_import(filepath=path)
              else: bpy.ops.import_scene.obj(filepath=path)
              return bpy.context.selected_objects[0]
          def make_stage(dore_id,img_name,location,scale=(4.4,4.4,4.4)):
              obj=import_obj(os.path.join(out,f'dore-{dore_id}.obj')); obj.name=f'DORE_{dore_id}_STAGE'; obj.location=location; obj.scale=scale
              img=bpy.data.images.load(os.path.join(base,'input',img_name)); img.colorspace_settings.name='sRGB'
              mat=bpy.data.materials.new(f'DORE_{dore_id}_ORIGINAL'); mat.use_nodes=True
              nodes=mat.node_tree.nodes; links=mat.node_tree.links
              for n in list(nodes): nodes.remove(n)
              tex=nodes.new('ShaderNodeTexImage'); tex.image=img; tex.interpolation='Linear'
              emit=nodes.new('ShaderNodeEmission'); output=nodes.new('ShaderNodeOutputMaterial')
              links.new(tex.outputs['Color'],emit.inputs['Color']); links.new(emit.outputs['Emission'],output.inputs['Surface']); obj.data.materials.append(mat)
              return obj
          a=make_stage('011','dore-011.jpg',(0,0,-4.0)); b=make_stage('019','dore-019.jpg',(7.0,0,-10.0)); b.rotation_euler[1]=math.radians(-18)
          bpy.ops.mesh.primitive_plane_add(size=30, location=(3.5,2.6,-9.0), rotation=(math.radians(90),0,0))
          bridge=bpy.context.object; bridge.name='BRIDGE_WORLD_PROXY'
          mat=bpy.data.materials.new('BRIDGE_NEUTRAL'); mat.use_nodes=True; bsdf=mat.node_tree.nodes.get('Principled BSDF')
          if bsdf: bsdf.inputs['Base Color'].default_value=(0.025,0.025,0.025,1); bsdf.inputs['Roughness'].default_value=1.0
          bridge.data.materials.append(mat)
          cam_data=bpy.data.cameras.new('ONE_CONTINUOUS_CAMERA'); cam=bpy.data.objects.new('ONE_CONTINUOUS_CAMERA',cam_data); bpy.context.collection.objects.link(cam); scene.camera=cam
          cam_data.sensor_fit='HORIZONTAL'; cam_data.sensor_width=36; cam_data.lens=48; cam_data.clip_start=.02; cam_data.clip_end=100
          keys=[(1,(0.,0.,0.),(0.,0.,-4.)),(36,(0.6,-0.1,-1.4),(0.4,0.,-5.)),(72,(2.8,-0.1,-4.2),(4.2,0.,-8.5)),(108,(5.2,0.,-6.8),(6.6,0.,-10.)),(144,(7.,0.,-7.4),(7.,0.,-10.))]
          def point_at(obj,target): obj.rotation_euler=(Vector(target)-obj.location).to_track_quat('-Z','Y').to_euler()
          for f,loc,target in keys:
              cam.location=loc; point_at(cam,target); cam.keyframe_insert(data_path='location',frame=f); cam.keyframe_insert(data_path='rotation_euler',frame=f)
          if cam.animation_data and cam.animation_data.action:
              for fc in cam.animation_data.action.fcurves:
                  for kp in fc.keyframe_points: kp.interpolation='BEZIER'
          scene.render.engine='BLENDER_EEVEE'; scene.render.resolution_x=960; scene.render.resolution_y=720; scene.render.resolution_percentage=100
          scene.render.image_settings.file_format='PNG'; scene.view_settings.view_transform='Standard'; scene.frame_start=1; scene.frame_end=144; scene.render.fps=24; scene.render.filepath=os.path.join(out,'frame-')
          bpy.ops.wm.save_as_mainfile(filepath=os.path.join(out,'two-anchor-handoff.blend')); bpy.ops.render.render(animation=True)
          meta=json.load(open(os.path.join(out,'metadata.json'))); meta['frames']=144; meta['camera_keyframes']=[{'frame':f,'location':list(loc),'look_target':list(target)} for f,loc,target in keys]; meta['acceptance_question']='Can one uninterrupted viewing camera leave Doré 011 world-space and arrive in Doré 019 world-space without reverting to a slideshow or camera reset?'; json.dump(meta,open(os.path.join(out,'metadata.json'),'w'),indent=2)
          PY
          blender -b --python .handoff011019/build.py

      - name: Encode one-take handoff evidence
        run: |
          ffmpeg -y -framerate 24 -i '.handoff011019/output/frame-%04d.png' -c:v libx264 -pix_fmt yuv420p .handoff011019/output/two-anchor-handoff-road-test.mp4
          python - <<'PY'
          from PIL import Image,ImageDraw
          from pathlib import Path
          p=Path('.handoff011019/output'); nums=[1,36,72,108,144]; ims=[Image.open(p/f'frame-{n:04d}.png').convert('RGB') for n in nums]; w,h=ims[0].size
          sheet=Image.new('RGB',(w*5,h+34),'black'); d=ImageDraw.Draw(sheet)
          for i,(n,im) in enumerate(zip(nums,ims)): sheet.paste(im,(i*w,34)); d.text((i*w+10,10),f'frame {n}',fill='white')
          sheet.save(p/'contact-sheet.png')
          PY
          test -s .handoff011019/output/two-anchor-handoff-road-test.mp4
          test -s .handoff011019/output/two-anchor-handoff.blend

      - name: Upload two-anchor handoff evidence
        uses: actions/upload-artifact@v4
        with:
          name: dore-film-two-anchor-handoff-011-019
          path: .handoff011019/output/
          if-no-files-found: error
          retention-days: 14
