name: Doré Generation → Native Publisher

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: 'HTTPS URL of the complete generated image artifact'
        required: true
        type: string
      target:
        description: 'Repository target path, e.g. static/one/studio/lamentations-03-dore-hq.webp'
        required: true
        type: string
      expected_sha256:
        description: 'Expected SHA-256 of the complete image binary'
        required: true
        type: string
      publish_branch:
        description: 'Branch to receive the binary commit'
        required: false
        default: 'main'
        type: string
      commit_message:
        description: 'Commit message'
        required: false
        default: 'asset(one): publish Doré generated binary'
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download complete generated artifact
        shell: bash
        env:
          SOURCE_URL: ${{ inputs.source_url }}
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
        run: |
          set -euo pipefail
          case "$SOURCE_URL" in
            https://*) ;;
            *) echo 'source_url must be HTTPS' >&2; exit 1 ;;
          esac
          mkdir -p .dore-runtime
          ext="${SOURCE_URL%%\?*}"
          ext="${ext##*.}"
          case "${ext,,}" in
            png|jpg|jpeg|webp|avif) ;;
            *) ext='bin' ;;
          esac
          out=".dore-runtime/generated.${ext}"
          curl --fail --location --retry 3 --retry-delay 2 --max-time 180 \
            --output "$out" "$SOURCE_URL"
          bytes=$(wc -c < "$out" | tr -d ' ')
          if [ "$bytes" -lt 100000 ]; then
            echo "artifact too small for production: ${bytes} bytes" >&2
            exit 1
          fi
          actual=$(sha256sum "$out" | awk '{print $1}')
          if [ "$actual" != "${EXPECTED_SHA256,,}" ]; then
            echo "sha256 mismatch: $actual != ${EXPECTED_SHA256,,}" >&2
            exit 1
          fi
          echo "DORÉ_SOURCE=$out" >> "$GITHUB_ENV"
          echo "Downloaded complete binary: $bytes bytes sha256=$actual"

      - name: Publish one native Git blob
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET: ${{ inputs.target }}
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
          PUBLISH_BRANCH: ${{ inputs.publish_branch }}
          COMMIT_MESSAGE: ${{ inputs.commit_message }}
        run: |
          set -euo pipefail
          python3 tools/dore_publish_binary.py \
            --repo "${GITHUB_REPOSITORY}" \
            --branch "$PUBLISH_BRANCH" \
            --source "$DORÉ_SOURCE" \
            --target "$TARGET" \
            --message "$COMMIT_MESSAGE" \
            --expected-sha256 "$EXPECTED_SHA256"

      - name: Record bridge success
        shell: bash
        run: |
          echo 'Doré generation artifact crossed the bridge as one complete binary.'
