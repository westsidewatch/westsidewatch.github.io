name: Doré Researcher 06 Held-out Final

on:
  push:
    branches: [main]
    paths:
      - 'dore-core/knowledge/researcher/evidence/researcher06-unit06-freeze.json'
      - '.github/workflows/dore-researcher06-heldout-final.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dore-researcher06-heldout-final
  cancel-in-progress: false

jobs:
  heldout-final:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require frozen parameters
        run: test -f dore-core/knowledge/researcher/evidence/researcher06-unit06-freeze.json
      - name: Encoder self-test
        run: node scripts/dore/phonetic-encoder-selftest.mjs
      - name: Open sealed held-out split once and measure
        run: |
          mkdir -p dore-core/knowledge/researcher/evidence
          node scripts/dore/noise-retrieval-baseline.mjs --test > /tmp/researcher06-heldout.ndjson
          tail -n 1 /tmp/researcher06-heldout.ndjson > dore-core/knowledge/researcher/evidence/researcher06-unit06-heldout-summary.json
          cp /tmp/researcher06-heldout.ndjson dore-core/knowledge/researcher/evidence/researcher06-unit06-heldout.ndjson
      - name: Enforce Unit 06 held-out gate
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const s=JSON.parse(fs.readFileSync('dore-core/knowledge/researcher/evidence/researcher06-unit06-heldout-summary.json','utf8'));
          if(s.split!=='test') throw new Error('Expected held-out test split');
          if(s.recall_at_budget!==1) throw new Error(`Held-out recall gate failed: ${s.recall_at_budget}`);
          if(s.gold_misses!==0) throw new Error(`Held-out gold misses: ${s.gold_misses}`);
          if(s.negative_abstention_correct!==2) throw new Error(`Held-out abstention gate failed: ${s.negative_abstention_correct}/2`);
          if(s.encoder_versions?.mandarin!=='mandarin-pinyin-lite-v1'||s.encoder_versions?.english!=='english-metaphone-lite-v1') throw new Error('Encoder version drift after freeze');
          console.log('Researcher 06 Unit 06 held-out gate PASS');
          NODE
      - name: Persist held-out evidence
        if: always()
        run: |
          git config user.name 'Doré Researcher'
          git config user.email 'westsidewatchca@gmail.com'
          git add dore-core/knowledge/researcher/evidence/researcher06-unit06-heldout-summary.json || true
          git add dore-core/knowledge/researcher/evidence/researcher06-unit06-heldout.ndjson || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'test(dore): persist Researcher 06 held-out final evidence [skip ci]'
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          exit 1
