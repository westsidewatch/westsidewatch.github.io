name: Temp bump ONE Scripture cache
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: one/wisdom-major-prophets-scripture
      - name: Refresh Scripture runtime cache
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('static/one/index.html')
          s=p.read_text(encoding='utf-8')
          old='<script src="./one-cross-reference-scripture-major-prophets.js?v=20260821a"></script>'
          new='<script src="./one-cross-reference-scripture-major-prophets.js?v=20260821b"></script>'
          if old in s:s=s.replace(old,new,1)
          elif new not in s:raise SystemExit('major Scripture script marker missing')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit cache refresh
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add static/one/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Refresh completed Scripture audit cache"
          git push origin HEAD:one/wisdom-major-prophets-scripture
