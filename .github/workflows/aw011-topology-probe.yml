name: AW-011 Topology Probe

on:
  push:
    branches: [feat/aw-011-camera-corridor]
    paths:
      - ".github/workflows/aw011-topology-probe.yml"
      - "tools/aw_corridor/experiment_static_cinema_v16.py"
  workflow_dispatch:

concurrency:
  group: aw011-topology-probe-${{ github.ref }}
  cancel-in-progress: true

permissions: {contents: read}

jobs:
  topology-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Fetch Doré source and isolated learned provider assets
        run: |
          mkdir -p experiments/aw-011/assets build/topology-probe build/aw011-provider
          curl --fail --location --retry 3 "https://commons.wikimedia.org/wiki/Special:Redirect/file/011.Abraham_Goes_to_the_Land_of_Canaan.jpg" -o experiments/aw-011/assets/dore-011.jpg
          curl --fail --location --retry 3 "https://raw.githubusercontent.com/vt-vl-lab/3d-photo-inpainting/master/networks.py" -o build/aw011-provider/networks.py
          curl --fail --location --retry 3 "https://huggingface.co/ai-minamo/3d-photo-inpainting/resolve/main/edge-model.pth?download=true" -o build/aw011-provider/edge-model.pth
          curl --fail --location --retry 3 "https://huggingface.co/ai-minamo/3d-photo-inpainting/resolve/main/depth-model.pth?download=true" -o build/aw011-provider/depth-model.pth
          curl --fail --location --retry 3 "https://huggingface.co/ai-minamo/3d-photo-inpainting/resolve/main/color-model.pth?download=true" -o build/aw011-provider/color-model.pth
      - run: python -m pip install --disable-pip-version-check numpy pillow opencv-python-headless torch torchvision matplotlib "transformers>=4.45,<5" 'git+https://github.com/microsoft/MoGe.git'
      - run: python tools/aw_corridor/experiment_depth_bakeoff.py --source experiments/aw-011/assets/dore-011.jpg --provider moge --output build/topology-probe/depth.png --report build/topology-probe/depth-report.json
      - name: Run V16 three-blade corridor
        run: >-
          python tools/aw_corridor/experiment_static_cinema_v16.py
          --source experiments/aw-011/assets/dore-011.jpg
          --depth build/topology-probe/depth.png
          --spine experiments/aw-011/camera-spine.json
          --output build/topology-probe/traversal-v16.mp4
          --report build/topology-probe/traversal-v16-report.json
          --diagnostic-dir build/topology-probe/v16-diagnostics
          --networks build/aw011-provider/networks.py
          --edge-checkpoint build/aw011-provider/edge-model.pth
          --depth-checkpoint build/aw011-provider/depth-model.pth
          --color-checkpoint build/aw011-provider/color-model.pth
          --device cpu --width 480 --output-width 640 --fps 12 --segment-frames 4 --samples 4 --behind 0.08 --edge-q 0.90 --min-jump 0.055 --target-residual 0.001 --min-view-scale 0.45 --raster-step 3 --deviation-threshold 1.25 --warp-max-component-pixels 256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aw-011-v16-three-blade
          path: build/topology-probe/
          if-no-files-found: warn
