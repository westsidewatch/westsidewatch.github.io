name: AW-011 Topology Probe

on:
  push:
    branches: [feat/aw-011-camera-corridor]
    paths:
      - ".github/workflows/aw011-topology-probe.yml"
  workflow_dispatch:

permissions: {contents: read}

jobs:
  topology-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: |
          mkdir -p experiments/aw-011/assets
          curl --fail --location --retry 3 "https://commons.wikimedia.org/wiki/Special:Redirect/file/011.Abraham_Goes_to_the_Land_of_Canaan.jpg" -o experiments/aw-011/assets/dore-011.jpg
      - run: python -m pip install --disable-pip-version-check numpy pillow opencv-python-headless torch torchvision "transformers>=4.45,<5" 'git+https://github.com/microsoft/MoGe.git'
      - run: |
          mkdir -p build/topology-probe
          python tools/aw_corridor/experiment_depth_bakeoff.py --source experiments/aw-011/assets/dore-011.jpg --provider moge --output build/topology-probe/depth.png --report build/topology-probe/depth-report.json
      - name: Run fast nearest-edge topology probe
        run: python tools/aw_corridor/experiment_edge_aware_hidden_surface_v4.py --source experiments/aw-011/assets/dore-011.jpg --depth build/topology-probe/depth.png --spine experiments/aw-011/camera-spine.json --output build/topology-probe/traversal.mp4 --report build/topology-probe/traversal-report.json --support-map build/topology-probe/world-support-map.png --edge-map build/topology-probe/occlusion-edge-map.png --background-map build/topology-probe/background-side-map.png --foundation-map build/topology-probe/foundation-support-map.png --width 480 --fps 12 --segment-frames 4 --samples 4 --behind 0.08 --edge-q 0.90 --min-jump 0.055 --sever-threshold 0.065
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aw-011-topology-probe
          path: build/topology-probe/
          if-no-files-found: warn
