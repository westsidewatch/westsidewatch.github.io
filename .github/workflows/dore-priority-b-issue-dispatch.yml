name: Doré Priority B issue dispatcher
on:
  issues:
    types: [opened]
permissions:
  actions: write
  contents: read
jobs:
  dispatch:
    if: startsWith(github.event.issue.title, '[DORE-RUN] Priority B')
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run dore-r2-priority-b-run.yml --repo ${{ github.repository }}