name: Doré issue event probe
on:
  issues:
    types: [opened]
permissions: {contents: write}
jobs:
  probe:
    if: startsWith(github.event.issue.title, '[DORE-PROBE]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p dore-core/cloudflare/receipts
          printf '{"status":"PASS","event":"issues.opened"}\n' > dore-core/cloudflare/receipts/ISSUE-EVENT-PROBE.json
          git config user.name dore-probe-bot; git config user.email dore-probe-bot@users.noreply.github.com
          git add dore-core/cloudflare/receipts/ISSUE-EVENT-PROBE.json
          git commit -m 'chore(dore): persist issue event probe [skip ci]'; git push