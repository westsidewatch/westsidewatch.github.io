name: R121 Emmaus static composition proof
on:
  pull_request:
    paths:
      - 'static/experiments/emmaus-r121/**'
      - 'static/css/emmaus-r121.css'
      - 'tests/emmaus-r121.cjs'
      - '.github/workflows/emmaus-r121.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save --no-package-lock playwright && npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 4173 --directory static >/tmp/emmaus-http.log 2>&1 &
          node tests/emmaus-r121.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emmaus-r121
          path: artifacts/121/
