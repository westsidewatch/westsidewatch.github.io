name: Dawn Exhibition Original Historical Art Cache
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/dawn-exhibition-image-cache.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  exact-artwork-assets:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'dawn/editorial-curation-core-v1-20261122'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || 'dawn/editorial-curation-core-v1-20261122' }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check actual archive images, copy only verified source pixels
        run: |
          python -m pip install --quiet requests Pillow beautifulsoup4
          python scripts/dawn_exhibition_verified_image_cache.py
      - name: Commit confirmed small heritage images to this Draft branch
        run: |
          git config user.name 'Dawn Heritage Asset Audit'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add static/dawn-library/reading-room/assets/historic-*.jpg
          if git diff --cached --quiet; then echo 'No images obtained'; exit 0; fi
          git commit -m 'assets(dawn): cache accurately identified historic Jerusalem plates for review'
          for attempt in 1 2 3 4; do
            git fetch origin dawn/editorial-curation-core-v1-20261122
            git rebase origin/dawn/editorial-curation-core-v1-20261122
            if git push origin HEAD:dawn/editorial-curation-core-v1-20261122; then exit 0; fi
            sleep 3
          done
          echo '::error::Could not safely commit verified images after concurrent branch updates'
          exit 1
