name: Doré Design Acceptance

on:
  push:
    paths:
      - 'dore-design/**'
      - 'local/dore-local/ui_taste_memory.py'
      - 'local/dore-local/ui_preference_field.py'
      - '.github/workflows/dore-design-agent-acceptance.yml'
  workflow_dispatch:

jobs:
  dore-design:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and legacy engine lifecycle
        run: |
          python3 -m py_compile dore-design/app.py dore-design/cli.py dore-design/selftest.py dore-design/integration_test.py
          python3 dore-design/selftest.py
      - name: Legacy HTTP integration
        run: python3 dore-design/integration_test.py
      - name: Workspace product lifecycle
        run: |
          python3 -m py_compile dore-design/app_workspace.py dore-design/app_product.py dore-design/app_visual.py dore-design/app_visual_v2.py dore-design/multiwrite_integration.py dore-design/multiwrite_wysiwyg.py dore-design/multipage_wysiwyg.py dore-design/template_library.py dore-design/template_library_selftest.py dore-design/workspace_cli.py dore-design/workspace_selftest.py dore-design/local_acceptance.py dore-design/upgrade_living_fortress_v2.py dore-design/deploy_visual_current.py
          python3 dore-design/workspace_selftest.py
          python3 dore-design/template_library_selftest.py
      - name: Workspace machine control surface
        env:
          DORE_DESIGN_DATA: ${{ runner.temp }}/dore-design-workspace
        run: |
          python3 dore-design/workspace_cli.py get >/tmp/workspace.json
          python3 dore-design/workspace_cli.py verify >/tmp/workspace-verify.json
          python3 dore-design/workspace_cli.py add-text contents 'Machine edit'
          python3 dore-design/workspace_cli.py export-svg cover
          python3 dore-design/workspace_cli.py verify
          test -s "${DORE_DESIGN_DATA}/exports/westside-watch.cover.svg"
          python3 dore-design/upgrade_living_fortress_v2.py >/tmp/front-door-upgrade.json
          python3 dore-design/workspace_cli.py get >/tmp/front-door-workspace.json
          python3 -c "import json; w=json.load(open('/tmp/front-door-workspace.json')); assert w['active_surface']=='homepage-watch-for-the-dawn-wysiwyg-v4' and w['design_direction']=='watch-for-the-dawn' and any(p['id']=='homepage' and any(n['id']=='one-territory' for n in p['nodes']) for p in w['pages'])"
      - name: Resident same-artifact and Multiwrite acceptance
        shell: bash
        run: |
          set -euo pipefail
          export DORE_DESIGN_DATA="${{ runner.temp }}/dore-design-http"
          export DORE_DESIGN_PORT=4310
          python3 dore-design/workspace_cli.py get >/tmp/dd-http-workspace.json
          python3 dore-design/upgrade_living_fortress_v2.py >/tmp/dd-http-upgrade.json
          python3 dore-design/app_visual_v2.py >/tmp/dd-http.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          sleep 1
          if ! curl -fsS http://127.0.0.1:4310/api/health >/tmp/dd-health.json; then
            echo '--- resident startup log ---'; cat /tmp/dd-http.log; exit 1
          fi
          if ! python3 dore-design/local_acceptance.py >/tmp/dd-local-acceptance.json 2>/tmp/dd-local-acceptance.err; then
            echo '--- local acceptance error ---'; cat /tmp/dd-local-acceptance.err
            echo '--- resident log ---'; cat /tmp/dd-http.log; exit 1
          fi
          grep -q 'DORE_DESIGN_LOCAL_ACCEPTANCE_PASS' /tmp/dd-local-acceptance.json
          grep -q 'Edit in Doré Design' <(curl -fsS http://127.0.0.1:4310/)
          grep -q 'DORÉ · 多寫' <(curl -fsS 'http://127.0.0.1:4310/editor?page=multiwrite-home')
          grep -q '多寫' <(curl -fsS 'http://127.0.0.1:4310/editor-canvas?page=multiwrite-home')
          grep -q 'Write on. Make it a book.' <(curl -fsS 'http://127.0.0.1:4310/editor-canvas?page=multiwrite-home')
          python3 - <<'PY'
          import json, urllib.request
          base='http://127.0.0.1:4310'
          def get(path): return json.load(urllib.request.urlopen(base+path))
          def post(path,payload):
              req=urllib.request.Request(base+path,data=json.dumps(payload).encode(),headers={'Content-Type':'application/json'},method='POST')
              return json.load(urllib.request.urlopen(req))
          h=get('/api/health')
          assert h['version']=='2.0-production' and h['source_of_truth']=='structured-workspace'
          assert h['templates']['count']==3 and h['templates']['external_editor_dependency'] is False
          m=get('/api/multiwrite/status'); assert m['ok'] and m['editable']
          t=get('/api/templates'); assert t['ok'] and t['count']==3 and t['external_editor_dependency'] is False
          w=post('/api/workspace',{'op':'design_decision','page_id':'multiwrite-home','decision':{'color':'watch-night','hierarchy':'quiet','axis':'center','density':'1','lines':'1'}})
          p=next(x for x in w['pages'] if x['id']=='multiwrite-home'); assert p['design']['decision']['color']=='watch-night'
          w=post('/api/workspace',{'op':'design_decision','page_id':'multiwrite-home','decision':{'color':'paper','hierarchy':'quiet','axis':'center','density':'1','lines':'1'}})
          p=next(x for x in w['pages'] if x['id']=='multiwrite-home'); assert p['design']['decision']=={'color':'paper','hierarchy':'quiet','axis':'center','density':'1','lines':'1'}
          print('DORE_MULTIWRITE_INTEGRATION_PASS')
          PY
      - name: Design 2.0 syntax
        run: python3 -m py_compile dore-design/app_design2.py dore-design/design2_snapshot.py dore-design/design2_renderer.py dore-design/design2_validation.py dore-design/design2_staging.py dore-design/design2_publication.py dore-design/design2_phase4_http.py dore-design/design2_http_acceptance.py dore-design/design2_recommendations.py dore-design/design2_phase5_http.py dore-design/design2_phase5_acceptance.py dore-design/design2_phase6.py dore-design/design2_phase6_http.py dore-design/design2_phase6_acceptance.py dore-design/design2_phase7_http.py dore-design/design2_final_acceptance.py dore-design/design_intelligence_runtime.py dore-design/design2_phase8_http.py dore-design/design_intelligence_acceptance.py local/dore-local/ui_taste_memory.py local/dore-local/ui_preference_field.py
      - name: Phase 7 production health contract
        shell: bash
        run: |
          set -euo pipefail
          export DORE_DESIGN_DATA="${{ runner.temp }}/dd2-phase7"
          export DORE_DESIGN_PUBLICATION_REGISTRY="${{ runner.temp }}/dd2-phase7-publication.json"
          export DORE_DESIGN_RECOMMENDATION_LOG="${{ runner.temp }}/dd2-phase7-recommendations.json"
          export DORE_DESIGN_PORT=4311
          python3 dore-design/workspace_cli.py get >/dev/null
          python3 dore-design/upgrade_living_fortress_v2.py >/dev/null
          python3 dore-design/app_design2.py >/tmp/dd2-phase7.log 2>&1 & pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          sleep 1
          curl -fsS http://127.0.0.1:4311/api/design2/production-health >/tmp/dd2-health.json
          python3 -c "import json; h=json.load(open('/tmp/dd2-health.json')); assert h['version']=='2.0-production' and h['phase']==7 and 'acceptance' in h"
      - name: Phase 8 design intelligence regression
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/dore-design:$PWD/local/dore-local"
          python3 dore-design/design_intelligence_acceptance.py | tee /tmp/dd2-intelligence-acceptance.json
          grep -q '"ok": true' /tmp/dd2-intelligence-acceptance.json
          export DORE_DESIGN_DATA="${{ runner.temp }}/dd2-phase8"
          export DORE_DESIGN_PUBLICATION_REGISTRY="${{ runner.temp }}/dd2-phase8-publication.json"
          export DORE_DESIGN_RECOMMENDATION_LOG="${{ runner.temp }}/dd2-phase8-recommendations.json"
          export DORE_UI_TASTE_DB="${{ runner.temp }}/dd2-phase8-taste.sqlite3"
          export DORE_DESIGN_PORT=4315
          python3 dore-design/workspace_cli.py get >/dev/null
          python3 dore-design/upgrade_living_fortress_v2.py >/dev/null
          python3 dore-design/app_design2.py >/tmp/dd2-phase8.log 2>&1 & pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          sleep 1
          curl -fsS http://127.0.0.1:4315/api/design2/intelligence/health >/tmp/dd2-intelligence-health.json
          python3 - <<'PY'
          import json, urllib.request
          base='http://127.0.0.1:4315'
          h=json.load(open('/tmp/dd2-intelligence-health.json'))
          assert h['ok'] and h['phase']==8 and h['model_inference_connected'] is False
          payload={'surface_id':'fresh','surface_family':'fresh-family','task_context':'fresh test','primary_axis':'composition','candidates':['A','B']}
          req=urllib.request.Request(base+'/api/design2/intelligence/route',data=json.dumps(payload).encode(),headers={'Content-Type':'application/json'},method='POST')
          routed=json.load(urllib.request.urlopen(req))
          assert routed['decision']=='explore' and routed['variant_generation_required'] is True
          print('DORE_DESIGN_INTELLIGENCE_HTTP_PASS')
          PY
      - name: Phase 4 immutable publication regression
        shell: bash
        run: |
          set -euo pipefail
          export DORE_DESIGN_DATA="${{ runner.temp }}/dd2-phase4"
          export DORE_DESIGN_PUBLICATION_REGISTRY="${{ runner.temp }}/dd2-phase4-publication.json"
          export DORE_DESIGN_RECOMMENDATION_LOG="${{ runner.temp }}/dd2-phase4-recommendations.json"
          export DORE_DESIGN_PORT=4312
          python3 dore-design/workspace_cli.py get >/dev/null
          python3 dore-design/upgrade_living_fortress_v2.py >/dev/null
          python3 dore-design/app_design2.py >/tmp/dd2-phase4.log 2>&1 & pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          sleep 1
          python3 dore-design/design2_http_acceptance.py
      - name: Phase 5 recommendation regression
        shell: bash
        run: |
          set -euo pipefail
          export DORE_DESIGN_DATA="${{ runner.temp }}/dd2-phase5"
          export DORE_DESIGN_PUBLICATION_REGISTRY="${{ runner.temp }}/dd2-phase5-publication.json"
          export DORE_DESIGN_RECOMMENDATION_LOG="${{ runner.temp }}/dd2-phase5-recommendations.json"
          export DORE_DESIGN_PORT=4313
          python3 dore-design/workspace_cli.py get >/dev/null
          python3 dore-design/upgrade_living_fortress_v2.py >/dev/null
          python3 dore-design/app_design2.py >/tmp/dd2-phase5.log 2>&1 & pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          sleep 1
          python3 dore-design/design2_phase5_acceptance.py
      - name: Phase 6 Multiwrite specimen regression
        shell: bash
        run: |
          set -euo pipefail
          export DORE_DESIGN_DATA="${{ runner.temp }}/dd2-phase6"
          export DORE_DESIGN_PUBLICATION_REGISTRY="${{ runner.temp }}/dd2-phase6-publication.json"
          export DORE_DESIGN_RECOMMENDATION_LOG="${{ runner.temp }}/dd2-phase6-recommendations.json"
          export DORE_DESIGN_PORT=4314
          python3 dore-design/workspace_cli.py get >/dev/null
          python3 dore-design/upgrade_living_fortress_v2.py >/dev/null
          python3 dore-design/app_design2.py >/tmp/dd2-phase6.log 2>&1 & pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          sleep 1
          python3 dore-design/design2_phase6_acceptance.py
      - name: macOS installer static contract
        run: |
          bash -n dore-design/install-macos.sh
          grep -q 'dore-design/app_design2.py' dore-design/install-macos.sh
          ! grep -q 'APP=.*app_visual_v2.py' dore-design/install-macos.sh
      - name: Acceptance gate
        run: echo DORE_DESIGN_PRODUCT_ACCEPTANCE_PASS
