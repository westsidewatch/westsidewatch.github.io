name: Doré Design Acceptance

on:
  push:
    paths:
      - 'dore-design/**'
      - '.github/workflows/dore-design-agent-acceptance.yml'
  workflow_dispatch:

jobs:
  dore-design:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and engine lifecycle
        run: |
          python3 -m py_compile dore-design/app.py dore-design/cli.py dore-design/selftest.py dore-design/integration_test.py
          python3 dore-design/selftest.py
      - name: HTTP integration
        id: integration
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python3 dore-design/integration_test.py > /tmp/dore-design-integration.log 2>&1
          rc=$?
          cat /tmp/dore-design-integration.log
          echo "$rc" > /tmp/dore-design-integration.rc
          exit "$rc"
      - name: Upload integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dore-design-integration-evidence
          path: |
            /tmp/dore-design-integration.log
            /tmp/dore-design-integration.rc
      - name: Machine control surface
        if: steps.integration.outcome == 'success'
        env:
          DORE_DESIGN_DATA: ${{ runner.temp }}/dore-design-data
        run: |
          python3 dore-design/cli.py get >/tmp/document.json
          python3 dore-design/cli.py verify >/tmp/verification.json
          python3 dore-design/cli.py set hero '{"x":88,"size":84}'
          python3 dore-design/cli.py token gold '#B79838'
          python3 dore-design/cli.py export-svg
          python3 dore-design/cli.py verify
          test -s "${DORE_DESIGN_DATA}/exports/westside-watch.svg"
      - name: macOS installer static contract
        if: steps.integration.outcome == 'success'
        run: bash -n dore-design/install-macos.sh
      - name: Acceptance gate
        if: always()
        shell: bash
        run: |
          test '${{ steps.integration.outcome }}' = 'success'
          echo DORE_DESIGN_ACCEPTANCE_PASS
