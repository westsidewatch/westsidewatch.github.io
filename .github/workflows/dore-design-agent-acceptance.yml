name: Doré Design Acceptance

on:
  push:
    paths:
      - 'dore-design/**'
      - 'local/dore-local/**'
      - '.github/workflows/dore-design-agent-acceptance.yml'
  workflow_dispatch:

jobs:
  dore-design-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: python3 -m py_compile dore-design/app.py dore-design/cli.py dore-design/selftest.py dore-design/integration_test.py
      - name: Structured engine lifecycle
        run: python3 dore-design/selftest.py
      - name: HTTP workbench end to end
        run: python3 dore-design/integration_test.py
      - name: Machine control surface
        env:
          DORE_DESIGN_DATA: ${{ runner.temp }}/dore-design-data
        run: |
          python3 dore-design/cli.py get >/tmp/document.json
          python3 dore-design/cli.py verify >/tmp/verification.json
          python3 dore-design/cli.py set hero '{"x":88,"size":84}'
          python3 dore-design/cli.py token gold '#B79838'
          python3 dore-design/cli.py export-svg
          python3 dore-design/cli.py verify
          test -s "${DORE_DESIGN_DATA}/exports/westside-watch.svg"
          echo DORE_DESIGN_MACHINE_CONTROL_PASS

  legacy-design-memory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        run: python3 -m py_compile local/dore-local/design_memory.py local/dore-local/penpot_agent.py local/dore-local/dore_local.py local/dore-local/test_penpot_execution_gate.py
      - name: D1-D3 truth and consolidation acceptance
        working-directory: local/dore-local
        run: python3 test_design_memory.py
      - name: Penpot execution gate acceptance
        working-directory: local/dore-local
        run: python3 test_penpot_execution_gate.py
