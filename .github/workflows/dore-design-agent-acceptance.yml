name: Doré Design Acceptance

on:
  push:
    paths:
      - 'dore-design/**'
      - '.github/workflows/dore-design-agent-acceptance.yml'
  workflow_dispatch:

jobs:
  dore-design:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and legacy engine lifecycle
        run: |
          python3 -m py_compile dore-design/app.py dore-design/cli.py dore-design/selftest.py dore-design/integration_test.py
          python3 dore-design/selftest.py
      - name: Legacy HTTP integration
        id: integration
        run: python3 dore-design/integration_test.py
      - name: Workspace product lifecycle
        id: workspace
        run: |
          python3 -m py_compile dore-design/app_workspace.py dore-design/workspace_cli.py dore-design/workspace_selftest.py
          python3 dore-design/workspace_selftest.py
      - name: Workspace machine control surface
        env:
          DORE_DESIGN_DATA: ${{ runner.temp }}/dore-design-workspace
        run: |
          python3 dore-design/workspace_cli.py get >/tmp/workspace.json
          python3 dore-design/workspace_cli.py verify >/tmp/workspace-verify.json
          python3 dore-design/workspace_cli.py add-text contents 'Machine edit'
          python3 dore-design/workspace_cli.py export-svg cover
          python3 dore-design/workspace_cli.py verify
          test -s "${DORE_DESIGN_DATA}/exports/westside-watch.cover.svg"
      - name: Resident HTTP workspace integration
        shell: bash
        run: |
          set -euo pipefail
          export DORE_DESIGN_DATA="${{ runner.temp }}/dore-design-http"
          export DORE_DESIGN_PORT=4319
          python3 dore-design/app_workspace.py >/tmp/dd-http.log 2>&1 &
          pid=$!
          trap 'kill $pid || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:4319/api/health && break || sleep .1; done
          curl -fsS http://127.0.0.1:4319/api/workspace >/tmp/dd-workspace.json
          curl -fsS http://127.0.0.1:4319/api/verify >/tmp/dd-verify.json
          curl -fsS 'http://127.0.0.1:4319/api/export.svg?page=cover' >/tmp/dd-cover.svg
          grep -q 'DORÉ DESIGN 0.8' <(curl -fsS http://127.0.0.1:4319/)
          grep -q '<svg' /tmp/dd-cover.svg
          python3 - <<'PY'
import json
v=json.load(open('/tmp/dd-verify.json'))
assert v['ok'] and v['page_count'] >= 2
PY
      - name: macOS installer static contract
        run: |
          bash -n dore-design/install-macos.sh
          grep -q 'app_workspace.py' dore-design/install-macos.sh
      - name: Acceptance gate
        run: echo DORE_DESIGN_WORKSPACE_ACCEPTANCE_PASS
