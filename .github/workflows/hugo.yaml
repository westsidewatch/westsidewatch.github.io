name: Deploy Hugo site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.164.0
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Restore Vol.00 producer output
        id: vol00-cache
        uses: actions/cache/restore@v4
        with:
          path: preview/watch-city-vol00/hosanna/media/clips
          key: vol00-media-v1-
          restore-keys: |
            vol00-media-v1-
      - name: Verify Vol.00 producer output
        run: |
          test "$(find preview/watch-city-vol00/hosanna/media/clips -name '*.webm' -size +100k | wc -l)" -eq 6
          test "$(find preview/watch-city-vol00/hosanna/media/clips -name '*.jpg' -size +10k | wc -l)" -ge 13
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Admit Dawn source identity claims
        run: python scripts/reconcile_dawn_source_identity.py
      - name: Admit Dawn source capabilities
        run: python scripts/build_dawn_source_capability_map.py
      - name: Admit Dawn materialization sources
        run: python scripts/dawn_materialization_gate.py --minimum-admitted 1
      - name: Reconcile Dawn canonical cover assets
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir "Pillow>=10,<12"
          python scripts/build_dawn_cover_registry.py --identity-map .dore-build/dawn-materialization-identity-map.json --minimum-resolved 1
          python scripts/validate_dawn_cover_registry.py
      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
