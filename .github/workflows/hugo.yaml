name: Deploy Hugo site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.164.0
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Materialize Vol.00 diagnostic video
        run: |
          mkdir -p preview/watch-city-vol00/hosanna/media
          curl --fail --location --retry 3 --retry-delay 2 \
            --output preview/watch-city-vol00/hosanna/media/vie-et-passion-du-christ-1903.240p.vp9.webm \
            'https://upload.wikimedia.org/wikipedia/commons/transcoded/5/53/Vie_et_Passion_du_Christ_%281903%29.webm/Vie_et_Passion_du_Christ_%281903%29.webm.240p.vp9.webm'
          test "$(wc -c < preview/watch-city-vol00/hosanna/media/vie-et-passion-du-christ-1903.240p.vp9.webm)" -gt 60000000
          curl --fail --location --retry 3 --retry-delay 2 \
            --output preview/watch-city-vol00/hosanna/media/from-the-manger-to-the-cross-1912.240p.vp9.webm \
            'https://upload.wikimedia.org/wikipedia/commons/transcoded/0/01/From_The_Manger_To_The_Cross_%281912%29_Best_Quality.webm/From_The_Manger_To_The_Cross_%281912%29_Best_Quality.webm.240p.vp9.webm'
          test "$(wc -c < preview/watch-city-vol00/hosanna/media/from-the-manger-to-the-cross-1912.240p.vp9.webm)" -gt 100000000
          curl --fail --location --retry 3 --retry-delay 2 \
            --output preview/watch-city-vol00/hosanna/media/the-king-of-kings-1927.240p.vp9.webm \
            'https://upload.wikimedia.org/wikipedia/commons/transcoded/e/eb/The_King_of_Kings_%281927%29.webm/The_King_of_Kings_%281927%29.webm.240p.vp9.webm'
          test "$(wc -c < preview/watch-city-vol00/hosanna/media/the-king-of-kings-1927.240p.vp9.webm)" -gt 200000000
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Admit Dawn source identity claims
        run: python scripts/reconcile_dawn_source_identity.py
      - name: Admit Dawn source capabilities
        run: python scripts/build_dawn_source_capability_map.py
      - name: Admit Dawn materialization sources
        run: python scripts/dawn_materialization_gate.py --minimum-admitted 1
      - name: Reconcile Dawn canonical cover assets
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir "Pillow>=10,<12"
          python scripts/build_dawn_cover_registry.py --identity-map .dore-build/dawn-materialization-identity-map.json --minimum-resolved 1
          python scripts/validate_dawn_cover_registry.py
      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
