name: Deploy Hugo site to Pages

on:
  workflow_run:
    workflows: ["Build Vol.00 media"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.164.0
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Restore Vol.00 producer output
        id: vol00-cache
        uses: actions/cache/restore@v4
        with:
          path: preview/watch-city-vol00/hosanna/media/clips
          key: vol00-media-v2-
          restore-keys: |
            vol00-media-v2-
      - name: Verify Vol.00 producer output
        run: |
          test "$(find preview/watch-city-vol00/hosanna/media/clips -name '*.webm' -size +100k | wc -l)" -eq 6
          test "$(find preview/watch-city-vol00/hosanna/media/clips -name '*.jpg' -size +10k | wc -l)" -ge 13
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Restore Dawn build cache
        id: dawn-cache
        uses: actions/cache@v4
        with:
          path: .dore-build
          key: dawn-build-v1-${{ hashFiles('scripts/reconcile_dawn_source_identity.py', 'scripts/build_dawn_source_capability_map.py', 'scripts/dawn_materialization_gate.py', 'scripts/build_dawn_cover_registry.py', 'scripts/validate_dawn_cover_registry.py', 'dawn-library/**', 'data/**') }}
      - name: Admit Dawn source identity claims
        if: steps.dawn-cache.outputs.cache-hit != 'true'
        run: python scripts/reconcile_dawn_source_identity.py
      - name: Admit Dawn source capabilities
        if: steps.dawn-cache.outputs.cache-hit != 'true'
        run: python scripts/build_dawn_source_capability_map.py
      - name: Admit Dawn materialization sources
        if: steps.dawn-cache.outputs.cache-hit != 'true'
        run: python scripts/dawn_materialization_gate.py --minimum-admitted 1
      - name: Reconcile Dawn canonical cover assets
        if: steps.dawn-cache.outputs.cache-hit != 'true'
        timeout-minutes: 12
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir "Pillow>=10,<12"
          python scripts/build_dawn_cover_registry.py --identity-map .dore-build/dawn-materialization-identity-map.json --minimum-resolved 1
          python scripts/validate_dawn_cover_registry.py
      - name: Normalize Hugo front matter compatibility
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          roots = [Path('content')]
          changed = []
          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob('*'):
                  if not path.is_file() or path.suffix.lower() not in {'.md', '.html'}:
                      continue
                  text = path.read_text(encoding='utf-8')
                  updated = re.sub(r'(?m)^([ \t]*)_build([ \t]*:)', r'\1build\2', text)
                  if updated != text:
                      path.write_text(updated, encoding='utf-8')
                      changed.append(str(path))
          if changed:
              print('Normalized deprecated _build front matter:')
              print('\n'.join(changed))
          leftovers = []
          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob('*'):
                  if path.is_file() and path.suffix.lower() in {'.md', '.html'}:
                      if re.search(r'(?m)^[ \t]*_build[ \t]*:', path.read_text(encoding='utf-8')):
                          leftovers.append(str(path))
          if leftovers:
              raise SystemExit('Deprecated _build remains in Hugo content tree: ' + ', '.join(leftovers))
          PY
      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Publish Fond static publication and manuscripts
        run: |
          test -f fond/index.html
          mkdir -p public/fond/manuscripts/kingdom-language public/fond/manuscripts/city-building public/fond/manuscripts/cross-shadow
          cp -a fond/. public/fond/
          cp -a static/multiwrite/books/kingdom-language/. public/fond/manuscripts/kingdom-language/
          cp -a docs/projects/watch-city-vol00/manuscripts/carmel/. public/fond/manuscripts/city-building/
          cp -a data/publishing/. public/fond/manuscripts/cross-shadow/
          test -f public/fond/index.html
          test -f public/fond/manuscripts/kingdom-language/chapter-01.md
          test -f "public/fond/manuscripts/city-building/一萬年的建城禮.md"
          test -f public/fond/manuscripts/cross-shadow/cross-shadow.current-edited-manuscript.v1.md
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
