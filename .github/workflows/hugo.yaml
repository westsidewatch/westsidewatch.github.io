name: Deploy Hugo site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.164.0
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Reconstruct and verify staged Doré assets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, json

          for ready in sorted(Path('.dore-upload').glob('*/READY')):
              package = ready.parent
              manifest = json.loads((package / 'manifest.json').read_text())
              parts = sorted(package.glob('part-*.b64'))
              expected_parts = int(manifest['parts'])
              if len(parts) != expected_parts:
                  raise SystemExit(f"part count mismatch: {len(parts)} != {expected_parts}")

              encoded = ''.join(p.read_text().strip() for p in parts)
              data = base64.b64decode(encoded, validate=True)
              expected_bytes = int(manifest['bytes'])
              if len(data) != expected_bytes:
                  raise SystemExit(f"byte size mismatch: {len(data)} != {expected_bytes}")

              digest = hashlib.sha256(data).hexdigest()
              if digest != manifest['sha256']:
                  raise SystemExit(f"sha256 mismatch: {digest} != {manifest['sha256']}")

              kind = manifest.get('kind')
              if kind == 'avif' and not (len(data) > 12 and data[4:12] == b'ftypavif'):
                  raise SystemExit('invalid AVIF signature')
              if kind == 'webp' and not (data[:4] == b'RIFF' and data[8:12] == b'WEBP'):
                  raise SystemExit('invalid WEBP signature')

              target = Path(manifest['target'])
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
              print(f"verified {target}: {len(data)} bytes sha256={digest}")

              for replacement in manifest.get('text_replacements', []):
                  path = Path(replacement['path'])
                  text = path.read_text()
                  old = replacement['old']
                  new = replacement['new']
                  expected = int(replacement.get('expected', 1))
                  count = text.count(old)
                  if count == expected:
                      path.write_text(text.replace(old, new))
                      print(f"wired {path}: {old} -> {new}")
                  elif count == 0 and new in text:
                      print(f"already wired {path}: {new}")
                  else:
                      raise SystemExit(f"{path}: expected {expected} old occurrences or existing new value; old={count}, new={text.count(new)}")
          PY
      - name: Persist verified Doré assets to repository
        shell: bash
        run: |
          git config user.name "Westside Watch Doré Publisher"
          git config user.email "westsidewatchca@gmail.com"
          git add static/one/studio static/one/one-cover-policy.js
          if git diff --cached --quiet; then
            echo "No verified Doré binary changes to persist."
          else
            git commit -m "chore(dore): persist verified Studio binary assets [skip ci]"
            git push origin HEAD:main
          fi
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
