name: Wire Isaiah context and registry
on:
  push:
    branches: [feat/one-isaiah]
permissions:
  contents: write
jobs:
  wire:
    if: ${{ !contains(github.event.head_commit.message, 'wire Isaiah context and registry') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/one-isaiah
      - name: Keep original ONE rendering path and wire Isaiah data
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('static/one/index.html')
          s=p.read_text()
          s=s.replace('<script src="./isaiah-complete.js?v=20260816a"></script>','<script src="./isaiah-complete.js?v=20260816c"></script><script src="./isaiah-context.js?v=20260816c"></script><script src="./isaiah-registry.js?v=20260816c"></script>')
          s=s.replace('<script src="./one-scripture-local.js?v=20260816c"></script>','')
          s=s.replace('<script src="./one-cross-reference-semantic.js?v=20260816c"></script>','')
          p.write_text(s)
          PY
      - name: Commit wiring
        run: |
          git config user.name 'WATCHMAN'
          git config user.email 'westsidewatchca@gmail.com'
          git add static/one/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'feat(one): wire Isaiah context and registry'
          git push origin HEAD:feat/one-isaiah
