name: Screen Lab smoke tests
on:
  pull_request:
    paths:
      - 'screen-lab/**'
      - '.github/workflows/screen-lab-smoke.yml'
  push:
    paths:
      - 'screen-lab/**'
      - '.github/workflows/screen-lab-smoke.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate standalone catalog and UI contracts
        run: node --test screen-lab/tests/catalog.test.mjs
