name: P2 Church Second Layer Ministry QA
on:
  push:
    branches: [main]
    paths:
      - 'static/p2/church-tour.js'
      - 'static/p2/church-tour.html'
      - 'static/js/p2-church-ministry.js'
      - 'static/css/p2-church-ministry.css'
      - 'static/js/p2-living-water.js'
      - 'static/p2/living-water.html'
      - 'scripts/p2-church-ministry-qa.mjs'
      - '.github/workflows/p2-church-ministry-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  second-layer:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test second-page 3D ministry chapters in real Chromium WebGL
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --directory static >/tmp/p2-ministry-http.log 2>&1 &
          CHROME=$(command -v google-chrome || command -v chromium || true)
          test -n "$CHROME"
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage \
            --enable-webgl --ignore-gpu-blocklist --enable-unsafe-swiftshader \
            --use-gl=angle --use-angle=swiftshader --no-first-run \
            --remote-debugging-port=9222 --user-data-dir=/tmp/p2-ministry-cdp \
            --window-size=1366,850 about:blank >/tmp/p2-ministry-chrome.log 2>&1 &
          node scripts/p2-church-ministry-qa.mjs
      - name: Preserve rendered desktop/mobile WebGL acceptance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-church-second-layer-ministry-visual
          path: artifacts/p2-church-ministry-second-layer/
          if-no-files-found: warn
          retention-days: 14
