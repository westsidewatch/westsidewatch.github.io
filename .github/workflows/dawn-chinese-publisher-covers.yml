name: Dawn Chinese publisher cover audit
on:
  pull_request:
    paths:
      - 'scripts/dawn-chinese-cover-audit.cjs'
      - 'static/dawn-library/chinese-contemporary-discovery.json'
      - '.github/workflows/dawn-chinese-publisher-covers.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe publisher book pages and exact image bytes
        run: node scripts/dawn-chinese-cover-audit.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dawn-nine-chinese-source-cover-audit
          path: artifacts/dawn-cover-audit/
          if-no-files-found: warn
