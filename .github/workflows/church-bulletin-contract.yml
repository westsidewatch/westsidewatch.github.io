name: Church Bulletin Contract
on:
  pull_request:
    paths:
      - 'data/church/bulletins/**'
      - 'layouts/church/bulletin.html'
      - 'content/church/bulletin-*.md'
      - 'static/css/church-bulletin.css'
      - 'scripts/check_church_bulletin.cjs'
      - 'scripts/check_church_bulletin_browser.cjs'
      - '.github/workflows/church-bulletin-contract.yml'
  workflow_dispatch:
jobs:
  church-bulletin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate bulletin content contract
        run: node scripts/check_church_bulletin.cjs
      - name: Install Hugo
        run: |
          wget -q -O "${{ runner.temp }}/hugo.deb" "https://github.com/gohugoio/hugo/releases/download/v0.164.0/hugo_extended_0.164.0_linux-amd64.deb"
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"
      - name: Normalize legacy front matter
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for path in Path('content').rglob('*.md'):
              original=path.read_text(encoding='utf-8')
              updated=re.sub(r'(?m)^([ \t]*)_build([ \t]*:)',r'\1build\2',original)
              if updated!=original: path.write_text(updated,encoding='utf-8')
          PY
      - name: Build website
        run: hugo --minify --baseURL /
      - name: Install browser
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Serve website
        run: python3 -m http.server 8765 --directory public > /tmp/church-bulletin-server.log 2>&1 &
      - name: Verify bulletin at mobile tablet and desktop
        run: node scripts/check_church_bulletin_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: church-bulletin-visual-acceptance
          path: /tmp/church-bulletin/*.png
