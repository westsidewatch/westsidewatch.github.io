name: Dore Video Master Acceptance
on:
  pull_request:
    paths:
      - 'dore-core/tools/video_master.py'
      - 'dore-core/tools/test_video_master.py'
      - 'dore-core/contracts/video-master-v0.json'
      - 'local/dore-local/video_bridge.py'
      - '.github/workflows/dore-video-master-acceptance.yml'
  push:
    branches: [main]
    paths:
      - 'dore-core/tools/video_master.py'
      - 'dore-core/contracts/video-master-v0.json'
      - 'local/dore-local/video_bridge.py'
jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Contract and bridge acceptance
        run: python3 dore-core/tools/test_video_master.py
      - name: Generate deterministic AV fixture
        run: ffmpeg -y -f lavfi -i testsrc2=size=640x360:rate=24000/1001 -f lavfi -i sine=frequency=1000:sample_rate=48000 -t 3 -c:v libx264 -pix_fmt yuv420p -c:a aac /tmp/dore-source.mp4
      - name: Probe real media
        run: python3 dore-core/tools/video_master.py probe /tmp/dore-source.mp4 | tee /tmp/probe.json
      - name: Verify probe preserves source timing
        run: python3 -c "import json;d=json.load(open('/tmp/probe.json'));assert d['width']==640 and d['height']==360;assert d['avg_frame_rate'] in ('24000/1001','23976/1000');assert d['class']=='restore-upscale'"
