name: Doré Gemma adapter hotfix
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dore-gemma-adapter-hotfix.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch Doré Ollama adapter and migration script
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('local/dore-local/dore_local.py')
          s=p.read_text()
          old="""def ollama(messages):\n data=json.dumps({'model':MODEL,'messages':messages,'stream':False}).encode(); req=urllib.request.Request(OLLAMA+'/api/chat',data=data,headers={'Content-Type':'application/json'}); return json.loads(urllib.request.urlopen(req,timeout=300).read())['message']['content']\n"""
          new="""def ollama(messages):\n data=json.dumps({'model':MODEL,'messages':messages,'stream':False,'think':False}).encode()\n req=urllib.request.Request(OLLAMA+'/api/chat',data=data,headers={'Content-Type':'application/json'})\n payload=json.loads(urllib.request.urlopen(req,timeout=300).read())\n msg=payload.get('message') or {}\n content=msg.get('content')\n if isinstance(content,str) and content.strip(): return content.strip()\n raise RuntimeError('ollama_empty_content:'+json.dumps({'model':payload.get('model'),'done_reason':payload.get('done_reason'),'message_keys':sorted(msg.keys())},ensure_ascii=False))\n"""
          if old not in s:
              raise SystemExit('expected ollama adapter block not found')
          p.write_text(s.replace(old,new,1))

          p=Path('local/dore-local/migrate-conversation-engine-gemma4.sh')
          s=p.read_text()
          old='''echo "[4/5] Restart Doré Local"\nlaunchctl kickstart -k "gui/$(id -u)/io.westsidewatch.dore-local"\n'''
          new='''echo "[4/5] Persist Gemma in LaunchAgent and restart Doré Local"\nPLIST="$HOME/Library/LaunchAgents/io.westsidewatch.dore-local.plist"\nif [[ -f "$PLIST" ]]; then\n  /usr/libexec/PlistBuddy -c "Set :EnvironmentVariables:DORE_LOCAL_MODEL $MODEL" "$PLIST" 2>/dev/null || \\\n  /usr/libexec/PlistBuddy -c "Add :EnvironmentVariables:DORE_LOCAL_MODEL string $MODEL" "$PLIST"\n  launchctl bootout "gui/$(id -u)/io.westsidewatch.dore-local" 2>/dev/null || true\n  launchctl bootstrap "gui/$(id -u)" "$PLIST"\nelse\n  echo "MIGRATION_BLOCKED: LaunchAgent plist missing: $PLIST" >&2\n  exit 5\nfi\nlaunchctl kickstart -k "gui/$(id -u)/io.westsidewatch.dore-local"\n'''
          if old not in s:
              raise SystemExit('expected migration restart block not found')
          s=s.replace(old,new,1)
          old2="""OUT=\"$(curl -fsS http://127.0.0.1:11434/api/chat -H 'Content-Type: application/json' -d '{\"model\":\"gemma4:e4b\",\"messages\":[{\"role\":\"system\",\"content\":\"You are the replaceable inference engine for Doré. Reply only ENGINE_PASS.\"},{\"role\":\"user\",\"content\":\"health check\"}],\"stream\":false}')\"\n"""
          new2="""OUT=\"$(curl -fsS http://127.0.0.1:11434/api/chat -H 'Content-Type: application/json' -d '{\"model\":\"gemma4:e4b\",\"messages\":[{\"role\":\"system\",\"content\":\"You are the replaceable inference engine for Doré. Reply only ENGINE_PASS.\"},{\"role\":\"user\",\"content\":\"health check\"}],\"stream\":false,\"think\":false}')\"\n"""
          if old2 not in s:
              raise SystemExit('expected smoke request not found')
          p.write_text(s.replace(old2,new2,1))
          PY

          python3 -m py_compile local/dore-local/dore_local.py
          grep -q "'think':False" local/dore-local/dore_local.py
          grep -q 'Persist Gemma in LaunchAgent' local/dore-local/migrate-conversation-engine-gemma4.sh
      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          git config user.name 'westsidewatch-bot'
          git config user.email 'westsidewatchca@gmail.com'
          git add local/dore-local/dore_local.py local/dore-local/migrate-conversation-engine-gemma4.sh
          git rm .github/workflows/dore-gemma-adapter-hotfix.yml
          git commit -m 'dore: fix Gemma empty replies and launch agent persistence'
          git push
