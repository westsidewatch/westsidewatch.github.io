name: First Look Branch Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'static/experiments/**'
      - 'static/css/**'
      - '.github/workflows/first-look-branch-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: first-look-preview-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.167.0'
          extended: true
      - name: Build isolated preview
        run: |
          hugo --gc --minify --baseURL "https://westsidewatch-github-io.pages.dev/"
          test -s public/experiments/sevenfold-first-to-second.html
      - name: Verify Vol.00 and protected Church to Magazine handoff in Chromium
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install chromium
          python3 -m http.server 4173 --directory public >/tmp/p2-integration-http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          node tests/p2-vol00-preview.cjs
          node tests/p2-church-magazine-handoff.cjs
      - name: Save browser proofs for Church continuity and Contents
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-church-magazine-continuity
          path: |
            artifacts/p2-vol00/
            artifacts/p2-church-magazine/
          if-no-files-found: warn
          retention-days: 14
      - name: Deploy Cloudflare Pages preview (never production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_BRANCH: pr-${{ github.event.pull_request.number || github.run_id }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Cloudflare preview credentials missing"; exit 1; }
          npx --yes wrangler@4 pages deploy public \
            --project-name=westsidewatch-github-io \
            --branch="$PREVIEW_BRANCH" \
            --commit-hash="${GITHUB_SHA}" \
            --commit-message="First Look isolated preview"
          echo "### Branch preview (no merge required)" >> "$GITHUB_STEP_SUMMARY"
          echo "https://${PREVIEW_BRANCH}.westsidewatch-github-io.pages.dev/experiments/sevenfold-first-to-second.html" >> "$GITHUB_STEP_SUMMARY"
