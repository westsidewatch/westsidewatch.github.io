name: Church Editorial Branch Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'static/experiments/**'
      - 'static/css/**'
      - '.github/workflows/first-look-branch-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: church-editorial-preview-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.167.0'
          extended: true
      - name: Build isolated preview
        run: |
          hugo --gc --minify --baseURL "https://westsidewatch-github-io.pages.dev/"
          test -s public/experiments/sevenfold-first-to-second.html
          test -s public/experiments/living-water-engraving-compare.html
          test -s public/experiments/assets/living-water-contour-engraving-v6.svg
          test -s public/experiments/assets/living-water-contour-engraving-v7.svg
          test -s public/experiments/assets/living-water-contour-engraving-v10.svg
          test -s public/experiments/living-water-motion-study.html
          test -s public/experiments/living-water-motion-flow-v2.html
          grep -q 'living-water-contour-engraving-v10.svg' public/experiments/sevenfold-first-to-second.html
          grep -q 'living-water-contour-engraving-v10.svg' public/experiments/living-water-engraving-compare.html
          grep -q 'growth-top' public/experiments/living-water-motion-study.html
          test -s public/experiments/editorial-layout-safety-lab.html
          test -s public/experiments/john-7-38-template-clean.html
          grep -q 'data-preview="john-7-38-clean"' public/experiments/john-7-38-template-clean.html
      - name: Deploy Cloudflare Pages preview (never production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_BRANCH: pr-${{ github.event.pull_request.number || github.run_id }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Cloudflare preview credentials missing"; exit 1; }
          npx --yes wrangler@4 pages deploy public \
            --project-name=westsidewatch-github-io \
            --branch="$PREVIEW_BRANCH" \
            --commit-hash="${GITHUB_SHA}" \
            --commit-message="Church Editorial isolated preview"
          echo "### Branch preview (no merge required)" >> "$GITHUB_STEP_SUMMARY"
          echo "https://${PREVIEW_BRANCH}.westsidewatch-github-io.pages.dev/experiments/sevenfold-first-to-second.html" >> "$GITHUB_STEP_SUMMARY"
          echo "https://${PREVIEW_BRANCH}.westsidewatch-github-io.pages.dev/experiments/living-water-engraving-compare.html" >> "$GITHUB_STEP_SUMMARY"
          echo "https://${PREVIEW_BRANCH}.westsidewatch-github-io.pages.dev/experiments/editorial-layout-safety-lab.html" >> "$GITHUB_STEP_SUMMARY"
          echo "https://${PREVIEW_BRANCH}.westsidewatch-github-io.pages.dev/experiments/john-7-38-template-clean.html" >> "$GITHUB_STEP_SUMMARY"
