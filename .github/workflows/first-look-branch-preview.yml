                          const coords=p=>(p?.getAttribute('d')?.match(/-?[0-9]+(?:\.[0-9]+)?/g)||[]).map(Number);
                          const origin=coords(paths.find(p=>p.getAttribute('data-role')==='threshold-flash'));
