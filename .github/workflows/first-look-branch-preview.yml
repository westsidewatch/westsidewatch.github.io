name: First Look Branch Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'static/experiments/**'
      - 'static/css/**'
      - '.github/workflows/first-look-branch-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: first-look-preview-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.167.0'
          extended: true
      - name: Build isolated preview
        run: |
          hugo --gc --minify --baseURL "https://westsidewatch-github-io.pages.dev/"
          test -s public/experiments/sevenfold-first-to-second.html
      - name: Deploy Cloudflare Pages preview (never production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_BRANCH: pr-${{ github.event.pull_request.number || github.run_id }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Cloudflare preview credentials missing"; exit 1; }
          npx --yes wrangler@4 pages deploy public \
            --project-name=westsidewatch-github-io \
            --branch="$PREVIEW_BRANCH" \
            --commit-hash="${GITHUB_SHA}" \
            --commit-message="First Look isolated preview"
          echo "### Branch preview (no merge required)" >> "$GITHUB_STEP_SUMMARY"
          echo "https://${PREVIEW_BRANCH}.westsidewatch-github-io.pages.dev/experiments/sevenfold-first-to-second.html" >> "$GITHUB_STEP_SUMMARY"

      - name: Review asymmetric 5:8 cover + square Contents and seven-colour spine
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
          mkdir -p artifacts/p2-dual-square
          python3 -m http.server 4173 --directory public >/tmp/p2-dual-square-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          node <<'JS'
          const {chromium}=require('playwright');
          const fs=require('node:fs'),path=require('node:path');
          const out='artifacts/p2-dual-square',logs=[];
          const states=[['night-half',12,'cover-right'],['gold-half',33,'cover-right'],['gold-complete',44,'cover-right'],['dawn-arrival',54,'cover-right'],['morning-star',68,'cover-right'],['cover-and-star',82,'cover-right'],['temple-stone-transition',93,'cover-right'],['temple-stone-contents',100,'cover-right']];
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
            try{
              for(const [screen,width,height] of [['desktop',1648,928],['tablet',768,1024],['phone',390,844],['small',320,720]]){
                // Load the heavy original star and film ONCE per viewport.
                // Every snapshot then scrubs the SAME scroll clock, testing its
                // real continuity and avoiding 24 pointless iframe reloads.
                const page=await browser.newPage({viewport:{width,height},reducedMotion:'no-preference'});
                let currentErrors=[];
                page.on('pageerror',e=>currentErrors.push('PAGE_ERROR: '+e.message));
                const url='http://127.0.0.1:4173/experiments/p2-double-square-video-lab.html?p=0&side=cover-right';
                let loadedOK=false,loadFailure=null;
                try{
                  const initial=await page.goto(url,{waitUntil:'load',timeout:45000});
                  loadedOK=initial?.status()===200;
                  await page.evaluate(()=>document.fonts.ready);
                }catch(e){loadFailure=e.message;}
                for(const [state,p,side] of states){
                  const id=screen+'-'+state,errors=[];
                  currentErrors=errors;
                  try{
                    if(loadFailure)throw new Error(loadFailure);
                    await page.evaluate(p=>{
                      const slider=document.getElementById('dual-progress');
                      slider.value=String(p);
                      slider.dispatchEvent(new Event('input',{bubbles:true}));
                    },p);
                    await page.waitForTimeout(80);
                    const m=await page.evaluate(()=>{
                      const rect=x=>{let r=x.getBoundingClientRect();return {left:r.left,right:r.right,top:r.top,bottom:r.bottom,width:r.width,height:r.height}};
                      const root=document.querySelector('#dual-stage');
                      const a=rect(document.querySelector('#dual-cover')),b=rect(document.querySelector('#dual-contents'));
                      const coverImg=document.querySelector('.dual-cover__mast');
                      const video=document.querySelector('#dual-film-frame');
                      return {
                        scrollWidth:document.documentElement.scrollWidth,width:innerWidth,
                        phase:root.dataset.phase,orientation:root.dataset.orientation,
                        panels:[a,b],
                        rows:document.querySelectorAll('.dual-movement li').length,
                        lines:Number(root.dataset.xiwangLines),
                        blueReveal:Number(root.dataset.blueReveal),
                        dawnReveal:Number(root.dataset.dawnReveal),
                        officialWorks:document.querySelectorAll('.dual-work').length,
                        readerReach:(()=>{
                          const index=document.querySelector('.dual-contents__index');
                          const last=document.querySelector('.dual-movement:last-child li:last-child');
                          if(!index||!last)return {desktopVisible:false,keyboard:false,mobileScrollable:false};
                          const items=[...document.querySelectorAll('.dual-movement li,.dual-work')];
                          const rect=index.getBoundingClientRect();
                          const allVisible=items.every(el=>{const r=el.getBoundingClientRect();return r.top>=rect.top-2&&r.bottom<=rect.bottom+2});
                          return {desktopVisible:allVisible,
                            keyboard:index.tabIndex===0 && index.getAttribute('role')==='region',
                            mobileScrollable:index.scrollHeight>index.clientHeight+4};
                        })(),
                        reliefPrint:(()=>{
                          const el=document.getElementById('dual-contents-relief');
                          const index=document.querySelector('.dual-contents__index');
                          const contents=document.querySelector('#dual-stone-contents');
                          const marks=[...el.querySelectorAll('g.ws-relief-mark')];
                          const source=[...document.querySelectorAll('#dual-letterfield g.ws-print-band')].slice(4);
                          const residual=[...el.querySelectorAll('g.ws-relief-band')];
                          const region=el.getBoundingClientRect();
                          const itemRects=[...document.querySelectorAll('.dual-movement li,.dual-work')].map(el=>el.getBoundingClientRect());
                          const maxItemBottom=Math.max(0,...itemRects.map(r=>r.bottom));
                          return {
                            marks:marks.length,
                            faces:el.querySelectorAll('use.ws-print-face').length,
                            depths:el.querySelectorAll('use.ws-print-depth').length,
                            registers:residual.length,
                            sourcesEqual:residual.every((g,i)=>g.dataset.originalRegister===source[i]?.dataset.register),
                            sameGeometry:residual.every((g,i)=>g.querySelector('g.ws-relief-mark')?.getAttribute('transform')===source[i]?.querySelector('g.ws-print-mark')?.getAttribute('transform')),
                            noText:el.querySelectorAll('text,foreignObject').length===0,
                            opacity:Number(getComputedStyle(el).opacity),
                            clipStart:region.top+region.height*.58,
                            indexBottom:index.getBoundingClientRect().bottom,
                            lastArticleBottom:maxItemBottom,
                            stoneOpacity:Number(getComputedStyle(contents).opacity),
                          };
                        })(),
                        svgPrint:{
                          marks:document.querySelectorAll('#dual-letterfield g.ws-print-mark').length,
                          faces:document.querySelectorAll('#dual-letterfield use.ws-print-face').length,
                          depths:document.querySelectorAll('#dual-letterfield use.ws-print-depth').length,
                          registers:new Set([...document.querySelectorAll('#dual-letterfield g.ws-print-band')].map(el=>el.dataset.register)).size,
                          originalAsset:document.querySelector('#ws-source-mask image')?.getAttribute('href'),
                          allOfficial:[...document.querySelectorAll('#dual-letterfield g.ws-print-mark')].every(g=>g.dataset.officialSvg==='westside-watch-xiwang-horizontal-motion.svg'),
                          noText:document.querySelectorAll('.dual-typefield,.dual-typefield__glyph,#dual-letterfield text').length===0,
                          svgVisible:Number(getComputedStyle(document.getElementById('dual-letterfield')).opacity),
                          pressClip:getComputedStyle(document.getElementById('dual-letterfield')).clipPath,
                          revealOpacity:[...document.querySelectorAll('#dual-letterfield g.ws-print-band')].map(b=>Number(b.style.opacity)||0),
                        },
                        nightCaptionClearance:(()=>{
                          const wall=document.getElementById('dual-cover-wall')?.getBoundingClientRect();
                          const caption=document.querySelector('.dual-cover__tagline')?.getBoundingClientRect();
                          return wall&&caption?wall.top-caption.bottom:-999;
                        })(),
                        coverTitleLayout:(()=>{
                          const light=document.querySelector('.dual-cover__en span:last-child');
                          const folio=document.getElementById('dual-cover-vol');
                          const chinese=document.getElementById('dual-cover-zh');
                          const cover=document.getElementById('dual-cover');
                          if(!light||!folio||!chinese||!cover)return {overlap:999,overflow:999};
                          const textBounds=el=>{const range=document.createRange();range.selectNodeContents(el);return range.getBoundingClientRect()};
                          const lightFont=parseFloat(getComputedStyle(light).fontSize)||0;
                          const chineseFont=parseFloat(getComputedStyle(chinese).fontSize)||0;
                          const rawLight=textBounds(light),v=textBounds(folio),rawZh=textBounds(chinese),page=cover.getBoundingClientRect();
                          // The edition folio is now above the illustrated city, not forced to the right on phones.
                          // A Bodoni inked letter does not fill its line box:
                          // trim font-leading rather than treating empty ascender/
                          // descender space as an actual glyph collision.
                          const x={...rawLight,bottom:rawLight.bottom-lightFont*.24};
                          const z={...rawZh,top:rawZh.top+chineseFont*.13};
                          const intersect=(a,b)=>{
                            const commonX=Math.min(a.right,b.right)-Math.max(a.left,b.left);
                            const commonY=Math.min(a.bottom,b.bottom)-Math.max(a.top,b.top);
                            return commonX>2?Math.max(0,commonY):0;
                          };
                          const footer=document.getElementById('dual-cover-folio');
                          const footerVisible=!!footer&&getComputedStyle(footer).display!=='none'&&Number(getComputedStyle(footer).opacity)>.1;
                          return {overlap:Math.max(intersect(x,v),intersect(v,z),intersect(x,z),
                              footerVisible?intersect(z,footer.getBoundingClientRect()):0),
                            overflow:Math.max(0,x.right-page.right),
                            storyCount:document.querySelectorAll('.dual-cover__coverline').length,
                            mobileFooterClear:!footerVisible,
                            issueCopyConsolidated:document.querySelector('.dual-cover__editorial')?.querySelectorAll('.dual-cover__en,.dual-cover__zh').length===2};
                        })(),
                        unifiedCity:(()=>{
                          const city=document.getElementById('dual-cover-city');
                          const paper=city?.querySelector('.dual-cover__paper');
                          const wall=city?.querySelector('.dual-cover__wall');
                          return {shared:!!(city&&paper&&wall&&paper.parentElement===city&&wall.parentElement===city),
                            originalStoneDisplayed:getComputedStyle(wall).backgroundImage.includes('p2-magazine-sandstone-wall.png') &&
                               getComputedStyle(wall).clipPath==='none' &&
                               getComputedStyle(wall).display!=='none',
                            skyMaskOnly:getComputedStyle(wall).maskImage.includes('p2-magazine-stone-gate-cutout.png') &&
                               getComputedStyle(wall).maskImage.includes('linear-gradient') &&
                               getComputedStyle(wall).maskComposite.includes('add'),
                            originalSecondLayerHidden:getComputedStyle(paper).display==='none'&&
                               getComputedStyle(paper).backgroundImage==='none',
                            oldGateHidden:getComputedStyle(wall.querySelector('.dual-cover__gate')).display==='none'};
                        })(),
                        movementOverlap:(()=>{
                          // Works for both the original 2x2 and the new four-column
                          // Contents editorial grid; never mistake adjacent columns
                          // for vertically overlapping text.
                          if(innerWidth<=820)return 0;
                          const ms=[...document.querySelectorAll('.dual-movement')];
                          if(ms.length!==4)return 999;
                          const rs=ms.map(m=>m.getBoundingClientRect());
                          let overlap=0;
                          for(let i=0;i<rs.length;i++)for(let j=i+1;j<rs.length;j++){
                            const x=Math.min(rs[i].right,rs[j].right)-Math.max(rs[i].left,rs[j].left);
                            const y=Math.min(rs[i].bottom,rs[j].bottom)-Math.max(rs[i].top,rs[j].top);
                            if(x>2&&y>2)overlap=Math.max(overlap,Math.min(x,y));
                          }
                          return overlap;
                        })(),
                        legacyLaser:!!document.querySelector('#dual-light-bridge'),
                        stoneVisible:document.getElementById('dual-stone-contents').getAttribute('aria-hidden')==='false',
                        stoneBg:getComputedStyle(document.getElementById('dual-stone-contents')).backgroundImage.includes('temple-stone-light.png'),
                        starOpacity:Number(getComputedStyle(document.getElementById('dual-star')).opacity),
                         starParent:document.getElementById('dual-star').parentElement.id,
                         spine:(()=>{const bar=document.getElementById('dual-continuum');const r=bar.getBoundingClientRect();return {targets:[...bar.querySelectorAll('button[data-realm]')].map(x=>x.dataset.href),opacity:Number(getComputedStyle(bar).opacity),clickable:getComputedStyle(bar).pointerEvents==='auto',width:r.width,visibleBottom:r.bottom<=innerHeight+4,flip:Number(root.dataset.spineFlip),colorBands:bar.querySelectorAll('.dual-continuum__spectrum button').length};})(),
                        logoLoaded:coverImg.complete&&coverImg.naturalWidth>0,
                        videoOriginLoaded:video?.contentDocument?.querySelector('.hosanna')!=null,
                        filmSrc:video.getAttribute('src'),
                        aria:[...document.querySelectorAll('[data-position]')].filter(x=>x.getAttribute('aria-pressed')==='true').length
                      };
                    });
                    if(!loadedOK||m.rows!==12||!m.logoLoaded||m.aria!==1)errors.push('SOURCE_OR_UI');
                    if(m.officialWorks!==11||m.legacyLaser)errors.push('EDITORIAL_WORKS_OR_REMOVED_LASER');
                    if(m.svgPrint.marks!==84||m.svgPrint.faces!==84||m.svgPrint.depths!==252||m.svgPrint.registers!==7)errors.push('VECTOR_WESTSIDE_84_OFFICIAL_WORDMARKS_REQUIRED');
                    if(!m.svgPrint.allOfficial||!m.svgPrint.noText||m.svgPrint.originalAsset!=='/images/westside-watch-xiwang-horizontal-motion.svg')errors.push('LEFT_FIELD_NOT_EXCLUSIVELY_ORIGINAL_SVG_XIWANG');
                     // Preserve official lead-type vectors without displaying the rejected result.
                     if(m.svgPrint.svgVisible>.01||m.svgPrint.pressClip!=='none')errors.push('ARCHIVED_LEAD_TYPE_MUST_REMAIN_HIDDEN');
                    if(m.reliefPrint.marks!==36||m.reliefPrint.faces!==36||m.reliefPrint.depths!==108||m.reliefPrint.registers!==3||!m.reliefPrint.sourcesEqual||!m.reliefPrint.noText||!m.reliefPrint.sameGeometry)errors.push('CONTENTS_MUST_RETAIN_SAME_LOWER_VECTOR_LEAD_TYPE');
                     if(m.reliefPrint.opacity>.01)errors.push('ARCHIVED_CONTENTS_LETTERPRESS_MUST_REMAIN_HIDDEN');
                    if(!m.unifiedCity.shared||!m.unifiedCity.originalStoneDisplayed||
                       !m.unifiedCity.skyMaskOnly||!m.unifiedCity.originalSecondLayerHidden||
                       !m.unifiedCity.oldGateHidden)
                      errors.push('ORIGINAL_GATE_MUST_KEEP_STONE_DOOR_WITH_ALPHA_SKYLINE_MASK');
                    if(p===100&&m.movementOverlap>2)errors.push('CONTENTS_MOVEMENT_OVERLAP');
                    if(p===100&&!m.readerReach.keyboard)errors.push('CONTENTS_NOT_KEYBOARD_ACCESSIBLE');
                    if(p===100&&width>1100&&!m.readerReach.desktopVisible)errors.push('DESKTOP_TWELVE_ENTRIES_NOT_VISIBLE');
                    if(p===100&&width<=1100&&!m.readerReach.mobileScrollable)errors.push('MOBILE_CONTENTS_SCROLL_NOT_AVAILABLE');
                    if(m.scrollWidth>m.width+2)errors.push('HORIZONTAL_OVERFLOW');
                    if(p===100&&!m.videoOriginLoaded)errors.push('HOME_FILM_NOT_LOADED');
                    if(p===12&&(m.phase!=='cover-arrival'||m.blueReveal<=.1||m.blueReveal>=.9||m.dawnReveal!==0))errors.push('NIGHT_HALF_NOT_REVEALING_SCHEDULE_FIRST');
                    if(p===33&&(m.blueReveal<.999||m.dawnReveal<=.1||m.dawnReveal>=.9))errors.push('GOLD_HALF_NOT_REVEALING_WATER_SECOND');
                    if(p===44&&(m.blueReveal<.999||m.dawnReveal<.999))errors.push('HALF_PANELS_NOT_COMPLETE_BEFORE_TYPE');
                     if(p===54&&(m.phase!=='morning-star-rise'||m.lines!==0||m.stoneVisible))errors.push('STAR_ENTRANCE_SEQUENCE_BROKEN');
                     if(p===68&&(m.phase!=='morning-star-rise'||m.lines!==0||m.starOpacity<.85||m.starParent!=='dual-contents'||m.stoneVisible))errors.push('THREE_D_STAR_MUST_RISE_IN_CONTENTS_PANEL');
                     if(p===82&&(m.phase!=='cover-and-star'||m.lines!==0||m.starOpacity<.85||m.stoneVisible))errors.push('MISSING_COVER_AND_STAR_HOLD');
                    if(p===82&&(m.coverTitleLayout.overlap>8||m.coverTitleLayout.overflow>8))errors.push('COVER_DISPLAY_TITLE_COLLISION');
                    if(p===82&&(m.coverTitleLayout.storyCount!==0||!m.coverTitleLayout.issueCopyConsolidated))errors.push('UNWANTED_COVER_TEASERS_OR_SPLIT_TITLE');
                    if(p===82&&!m.coverTitleLayout.mobileFooterClear)errors.push('MOBILE_COVER_FOOTER_CROWDS_CHINESE_TITLE');
                    if(p===82&&m.nightCaptionClearance < -3)errors.push('NIGHT_TAGLINE_CROSSES_CITY_WALL');
                    if(p===93&&(m.phase!=='stone-contents-reveal'||!m.stoneBg))errors.push('MISSING_ORIGINAL_STONE_REVEAL');
                     if(p===100&&(!m.stoneVisible||!m.stoneBg||m.lines!==0))errors.push('FINAL_STONE_CONTENTS_INCOMPLETE');
                     if(p===100&&Math.abs(m.panels[0].width/m.panels[0].height-5/8)>.008)errors.push('COVER_MUST_BE_PORTRAIT_5_8');
                     if(p===100&&Math.abs(m.panels[1].width/m.panels[1].height-1)>.008)errors.push('CONTENTS_MUST_BE_SQUARE');
                     if(p===100){
                       const gap=(width>820)?Math.abs(m.panels[1].right-m.panels[0].left):Math.abs(m.panels[1].bottom-m.panels[0].top);
                       if(gap>3)errors.push('ASYMMETRIC_SPREAD_NOT_ADJACENT');
                       if(m.spine.targets.join('|')!=='/church/|/journal/|/one/|/olive/|/dawn-library/|/cinema/|/daylight-cafe/'||m.spine.colorBands!==7||!m.spine.clickable||m.spine.opacity<.98)errors.push('SEVEN_COLOUR_FUNCTIONAL_SPINE_MISSING');
                       if(width>1100&&!m.spine.visibleBottom)errors.push('FUNCTIONAL_SPINE_BELOW_VIEWPORT');
                     }
                     if(p===82&&!(m.spine.flip>.02&&m.spine.flip<.5))errors.push('SPINE_FLIP_MUST_START_WITH_COVER');
                    await page.screenshot({path:path.join(out,id+'.png'),fullPage:true,animations:'disabled'});
                    logs.push({id,viewport:{width,height},metrics:m,errors});
                    console.log(id,errors.length?errors:'CAPTURE_OK');
                  }catch(e){logs.push({id,errors:[e.message]});console.error(id,e.stack)}
                }

                // Compare BOTH authored cover systems at the SAME real p82
                // pose. The A/B control changes cover layout, never P2 timing.
                for(const variant of ['masthead']){
                  const errors=[],id=screen+'-art-'+variant;
                  try {
                    // Fixed approved masthead: no public alternative cover controls.
                    await page.locator('#dual-progress').evaluate(el=>{
                      el.value='82';el.dispatchEvent(new Event('input',{bubbles:true}));
                    });
                    await page.waitForTimeout(90);
                    const metrics=await page.evaluate(()=>{
                      const box=el=>{const r=el.getBoundingClientRect();return {left:r.left,right:r.right,top:r.top,bottom:r.bottom,width:r.width,height:r.height}};
                      const cv=document.getElementById('dual-cover'),view=box(cv);
                      const part=name=>box(cv.querySelector('.dual-cover__'+name));
                      const src=cv.querySelector('.dual-cover__mast');
                      const engraving=cv.querySelector('.dual-cover__engraving');
                      const title=part('en'),zh=part('zh'),wall=part('wall');
                      const star=box(document.getElementById('dual-star')),starPage=box(document.getElementById('dual-contents')),city=part('city'),gate=part('gate');
                      const paperEl=cv.querySelector('.dual-cover__paper'),wallEl=cv.querySelector('.dual-cover__wall'),cityEl=cv.querySelector('.dual-cover__city');
                      const sloganEl=cv.querySelector('.dual-cover__tagline');
                      const intersection=(a,b)=>Math.max(0,Math.min(a.right,b.right)-Math.max(a.left,b.left))*Math.max(0,Math.min(a.bottom,b.bottom)-Math.max(a.top,b.top));
                      return {variant:cv.querySelector('.dual-cover').dataset.coverVariant,view,mast:part('mast'),title,zh,
                        mastLoaded:src.complete&&src.naturalWidth>0,
                        mastRatio:part('mast').width/view.width,
                        wallClearance:title.top-wall.bottom,
                        starCentreError:Math.abs((star.left+star.right)/2-(starPage.left+starPage.right)/2),
                        starScale:star.width/starPage.width,
                         starInContents:document.getElementById('dual-star').parentElement.id==='dual-contents',
                         starAboveSheet:Number(getComputedStyle(document.getElementById('dual-star')).zIndex)>Number(getComputedStyle(document.getElementById('dual-stone-contents')).zIndex),
                        cityTopRatio:(city.top-view.top)/view.height,
                        wallHeightRatio:wall.height/view.height,
                        headlineCentered:(()=>{
                           const glyph=cv.querySelector('.dual-cover__en span:last-child');
                           if(!glyph)return false;
                           const range=document.createRange();range.selectNodeContents(glyph);
                           const ink=range.getBoundingClientRect();
                           return Math.abs((ink.left+ink.right)/2-(view.left+view.right)/2)<view.width*.065&&ink.width>=view.width*.45;
                         })(),
                        titleGroupUnified:!!cv.querySelector('.dual-cover__editorial')&&
                          ['en','zh'].every(name=>cv.querySelector('.dual-cover__'+name)?.parentElement===cv.querySelector('.dual-cover__editorial')),
                        starInNavy:false, // retired when the star moved to Contents
                        mastheadNavyOnly:part('mast').bottom<=city.top+2,
                        originalStoneWithSkyMask:getComputedStyle(wallEl).backgroundImage.includes('p2-magazine-sandstone-wall.png')&&
                          getComputedStyle(wallEl).maskImage.includes('p2-magazine-stone-gate-cutout.png')&&
                          getComputedStyle(wallEl).maskImage.includes('linear-gradient')&&
                          getComputedStyle(wallEl).maskComposite.includes('add')&&
                          getComputedStyle(wallEl).clipPath==='none'&&
                          getComputedStyle(paperEl).display==='none'&&
                          getComputedStyle(wallEl.querySelector('.dual-cover__gate')).display==='none',
                        foldLightPaths:cv.querySelectorAll('.dual-cover__fold-light path').length,
                        foldLightOpacity:Number(getComputedStyle(cv.querySelector('.dual-cover__fold-light')).opacity),
                         materialFit:getComputedStyle(wallEl).backgroundSize,
                         silhouetteFit:getComputedStyle(wallEl).maskSize,
                        goldAtThreshold:(()=>{
                           const paths=[...cv.querySelectorAll('.dual-cover__fold-light path')]
                             .map(el=>((el.getAttribute('d')||'').match(/[0-9]+/g)||[]).map(Number));
                           return paths.length===4&&paths.every(p=>
                             p.length>=8&&p[0]>=485&&p[0]<=510&&p[1]>=645&&p[1]<=675&&
                             p[2]>=495&&p[2]<=515&&p[3]===p[1]&&p.slice(4).every(v=>v>=0&&v<=1000));
                         })(),
                         stoneSource:getComputedStyle(paperEl).backgroundImage,
                        wallSource:getComputedStyle(wallEl).backgroundImage,
                        wallShadow:getComputedStyle(wallEl).filter,
                        paperShadow:getComputedStyle(paperEl).boxShadow,
                        wallSeam:getComputedStyle(cityEl,'::after').display,
                        sloganHidden:getComputedStyle(sloganEl).display==='none',
                        engravingSource:getComputedStyle(engraving).backgroundImage,
                        stories:cv.querySelectorAll('.dual-cover__coverline').length,
                        selected:[...document.querySelectorAll('[data-cover-choice]')].filter(x=>x.getAttribute('aria-pressed')==='true').length,
                        phase:document.getElementById('dual-stage').dataset.phase};
                    });
                    if(metrics.variant!==variant||metrics.selected!==1||!metrics.mastLoaded||metrics.stories!==0||metrics.phase!=='cover-and-star')errors.push('COVER_VARIANT_NOT_IN_REVIEW_STATE');
                    // Two small coverlines are intentionally absent; no teaser collision to test.
                    if(variant==='masthead'&&(metrics.mastRatio<.90||metrics.mastRatio>.97))
                      errors.push('COVER_IDENTITY_MUST_BE_PRIMARY');
                    if(variant==='masthead'&&!metrics.engravingSource.includes('westside-cover-night-intaglio-v3.svg'))
                      errors.push('COVER_ENGRAVING_SOURCE_NOT_ETCHED_V3');
                    if(variant==='masthead'){
                      const art=await page.request.get('http://127.0.0.1:4173/experiments/assets/westside-cover-night-intaglio-v3.svg');
                      const body=art.ok()?await art.text():'';
                      if(!art.ok()||!body.includes('data-variant="night-intaglio-v3"')||
                         !body.includes('curvilinear bands')||!body.includes('open star centre'))
                        errors.push('COVER_ENGRAVING_ASSET_NOT_DEPLOYED');
                    }
                    // The cutout skyline is intentionally the full wall image rectangle;
                    // bounding boxes must overlap the lower editorial title.
                    if(variant==='masthead'&&(metrics.starCentreError>3||metrics.starScale<.35||metrics.starScale>.6))
                      errors.push('MORNING_STAR_NOT_CENTRED_IN_CONTENTS');
                    // Vol.00 B balances 44% midnight-blue sky with the original stone silhouette;
                    // retain a bounded design check, calibrated to this approved composition.
                    if(variant==='masthead'&&(metrics.cityTopRatio<.42||metrics.cityTopRatio>.46||metrics.wallHeightRatio<.54))
                      errors.push('VOL00_SKY_AND_WALL_BALANCE_OUT_OF_RANGE');
                    if(variant==='masthead'&&(!metrics.headlineCentered||!metrics.sloganHidden||!metrics.titleGroupUnified))
                      errors.push('CENTER_LIGHT_NOT_PRIMARY_EDITORIAL_HEADLINE');
                    if(variant==='masthead'&&(!metrics.starInContents||!metrics.mastheadNavyOnly||!metrics.starAboveSheet))
                      errors.push('STAR_MUST_BE_IN_SQUARE_CONTENTS_AND_MASTHEAD_IN_NAVY');
                    if(variant==='masthead'&&(!metrics.originalStoneWithSkyMask||
                      metrics.wallShadow!=='none'||metrics.wallSeam!=='none'))
                      errors.push('STONE_DOOR_TRANSPARENT_OR_DUAL_PNG_STITCH_REINTRODUCED');
                    if(variant==='masthead'&&(metrics.foldLightPaths!==4||metrics.foldLightOpacity<.95))
                      errors.push('GEOMETRIC_LIGHT_NOT_RENDERED');
                    if(variant==='masthead'&&(metrics.materialFit!=='cover'||!metrics.silhouetteFit.startsWith('cover')))
                       errors.push('COVER_STONE_ASSETS_MUST_NOT_BE_STRETCHED');
                     if(variant==='masthead'&&!metrics.goldAtThreshold)
                      errors.push('FOLDED_LIGHT_MUST_BEGIN_AT_GATE_THRESHOLD_AND_SHARE_EDGES');
                    if(variant==='masthead'){
                      const alpha=await page.request.get('http://127.0.0.1:4173/p2/magazine-cover/p2-magazine-stone-gate-cutout.png');
                      const stone=await page.request.get('http://127.0.0.1:4173/p2/magazine-cover/p2-magazine-sandstone-wall.png');
                      if(!alpha.ok()||!stone.ok()||
                         !(alpha.headers()['content-type']||'').includes('image/png')||
                         !(stone.headers()['content-type']||'').includes('image/png'))
                        errors.push('PR1356_STONE_AND_SKY_MASK_ASSETS_NOT_DEPLOYED');
                    }
                                        for(const key of ['mast','title','zh']){
                      const r=metrics[key],b=metrics.view;
                      if(r.left<b.left-8||r.right>b.right+10||r.top<b.top-8||r.bottom>b.bottom+10)errors.push('COVER_'+key.toUpperCase()+'_OUT_OF_BOUNDS');
                    }
                    await page.screenshot({path:path.join(out,id+'.png'),fullPage:true,animations:'disabled'});
                    logs.push({id,viewport:{width,height},metrics,errors});
                    console.log(id,errors.length?errors:'ART_VARIANT_CAPTURE_OK');
                  }catch(e){logs.push({id,errors:[e.message]});console.error(id,e.message)}
                }

                // Seven independent interactive leaves: one tap opens a labelled
                // colour panel, a second tap reaches its own site section.
                const realmErrors=[],realmId=screen+'-seven-colour-navigation';
                await page.locator('#dual-progress').evaluate(el=>{
                  el.value='100';el.dispatchEvent(new Event('input',{bubbles:true}));
                });
                const mapping=await page.locator('#dual-continuum button[data-realm]').evaluateAll(
                  buttons=>buttons.map(b=>b.dataset.href));
                const expected=['/church/','/journal/','/one/','/olive/',
                  '/dawn-library/','/cinema/','/daylight-cafe/'];
                if(JSON.stringify(mapping)!==JSON.stringify(expected))realmErrors.push('SEVEN_PORTAL_MAPPING');
                const journal=page.locator('#dual-continuum button[data-realm="journal"]');
                await journal.click();
                // Allow the intentional .56s editorial unfolding transition to complete.
                await page.waitForTimeout(650);
                const opened=await journal.evaluate(b=>({
                  expanded:b.getAttribute('aria-expanded'),
                  width:b.getBoundingClientRect().width,
                  others:[...document.querySelectorAll('#dual-continuum button[data-realm]')]
                    .filter(x=>x!==b&&x.getAttribute('aria-expanded')==='true').length
                }));
                if(opened.expanded!=='true'||opened.others!==0||opened.width<28)
                  realmErrors.push('COLOUR_LEAF_DID_NOT_EXPAND');
                if(screen==='desktop'){
                  await journal.click();
                  await page.waitForURL('**/journal/',{timeout:10000});
                  if(!page.url().endsWith('/journal/'))realmErrors.push('JOURNAL_SWATCH_NOT_NAVIGABLE');
                }
                logs.push({id:realmId,errors:realmErrors,mapping,opened});
                console.log(realmId,realmErrors.length?realmErrors:'COLOUR_NAVIGATION_OK');
                await page.close();
              }
              // Also verify actual Church → Red Sea → magazine *one timeline* integration.
              // This is NOT a second P2; the same p2-living-water.js clock drives it.
              for(const [name,width,height] of [['church-desktop',1648,928],['church-phone',390,844],['church-small',320,720]]){
                const page=await browser.newPage({viewport:{width,height},reducedMotion:'no-preference'});
                const id=name+'-final',errors=[];
                page.on('pageerror',e=>errors.push('PAGE_ERROR: '+e.message));
                try{
                  await page.goto('http://127.0.0.1:4173/experiments/p2-magazine-transition-lab.html?dual=1&final=1',{waitUntil:'load',timeout:45000});
                  await page.waitForFunction(()=>{
                    const church=document.querySelector('#p2scene')?.contentDocument;
                    const duo=church?.querySelector('.p2-magazine iframe')?.contentDocument;
                    return church?.querySelector('.showcase')?.dataset.p2Phase==='magazine'&&duo?.querySelector('#dual-stage')?.dataset.phase==='contents-final';
                  },{timeout:15000});
                  const m=await page.evaluate(()=>{
                    const c=document.querySelector('#p2scene')?.contentDocument;
                    const root=c?.querySelector('.showcase'),stage=c?.querySelector('.p2-magazine iframe')?.contentDocument;
                    const cov=stage?.querySelector('#dual-cover'),cont=stage?.querySelector('#dual-contents');
                    const a=cov?.getBoundingClientRect(),b=cont?.getBoundingClientRect();
                    const mast=stage?.querySelector('.dual-cover__mast')?.getBoundingClientRect();
                    const last=stage?.querySelector('.dual-movement:last-child li:last-child');
                    const index=stage?.querySelector('.dual-contents__index');
                    return {phase:root?.dataset.p2Phase,design:root?.dataset.magazineDesign,
                      water:!!c?.querySelector('.ocean-rise'),doors:!!c?.querySelector('.water-doors'),church:!!c?.querySelector('.church-editorial'),
                      duo:stage?.querySelector('#dual-stage')?.dataset.phase,coverVariant:stage?.querySelector('.dual-cover')?.dataset.coverVariant,logoRatio:mast?.width/a?.width,
                      coverSize:a&&{width:a.width,height:a.height},contentSize:b&&{width:b.width,height:b.height},
                      entries:stage?.querySelectorAll('.dual-movement li').length,
                      homeVideo:!!stage?.querySelector('#dual-film-frame')?.contentDocument?.querySelector('.hosanna'),
                      lastRect:last?.getBoundingClientRect()?.bottom,contentsRect:b?.bottom,
                      directoryScrollable:index&&index.scrollHeight>index.clientHeight
                    };
                  });
                  if(m.phase!=='magazine'||m.design!=='duo-bridge'||m.duo!=='contents-final'||!m.water||!m.doors||!m.church)errors.push('CHURCH_MOTION_NOT_PRESERVED');
                  if(m.entries!==12||!m.homeVideo)errors.push('CANON_OR_ORIGINAL_HOME_FILM');
                  // The old A/B presentations were declined for insufficient publication
                  // identity. The selected art study must show the official SVG
                  // across nearly the entire cover width, at desktop and mobile.
                  if(m.coverVariant!=='masthead'||m.logoRatio<.90||m.logoRatio>.97)
                    errors.push('COVER_APPROVED_MASTHEAD_IDENTITY_MISSING');
                  if(Math.abs((m.coverSize?.width||0)/(m.coverSize?.height||1)-5/8)>.008||Math.abs((m.contentSize?.width||0)/(m.contentSize?.height||1)-1)>.008)errors.push('CHURCH_SPREAD_NOT_5_8_PLUS_SQUARE');
                  if(m.lastRect>m.contentsRect+2&&!m.directoryScrollable)errors.push('LAST_ENTRIES_UNREACHABLE');
                  await page.screenshot({path:path.join(out,id+'.png'),animations:'disabled'});
                  logs.push({id,viewport:{width,height},metrics:m,errors});
                  console.log(id,errors.length?errors:'CHURCH_TO_MAGAZINE_CAPTURE_OK');
                  // Assert the ORIGINAL schedule/water remains visible under
                  // the two independent half-page masks in the integrated P2.
                  // These scenes cannot be judged from the isolated navy stage.
                  for(const [label,p,kind] of [['schedule-night-half',.64,'night'],['water-gold-half',.72,'gold']]){
                    const detailErrors=[];
                    try{
                      await page.evaluate(progress=>{
                        const slider=document.getElementById('progress');
                        slider.value=String(progress*100);
                        slider.dispatchEvent(new Event('input',{bubbles:true}));
                      },p);
                      // Wait for the posted outer-P2 scroll to traverse both
                      // iframe levels; fixed-duration screenshot capture raced
                      // the previous final=1 state at the first checkpoint.
                      await page.waitForFunction(kind=>{
                        const c=document.querySelector('#p2scene')?.contentDocument;
                        const duo=c?.querySelector('.p2-magazine iframe')?.contentDocument;
                        const stage=duo?.getElementById('dual-stage');
                        const blue=Number(stage?.dataset.blueReveal),gold=Number(stage?.dataset.dawnReveal);
                        return kind==='night'?(blue>.1&&blue<.9&&gold===0):
                          (blue>.999&&gold>.1&&gold<.9);
                      },kind,{timeout:12000});
                      const detail=await page.evaluate(()=>{
                        const c=document.querySelector('#p2scene')?.contentDocument;
                        const duo=c?.querySelector('.p2-magazine iframe')?.contentDocument;
                        const st=duo?.getElementById('dual-stage'),ch=c?.querySelector('.church-editorial');
                        return {blue:Number(st?.dataset.blueReveal),gold:Number(st?.dataset.dawnReveal),
                          church:ch?getComputedStyle(ch).visibility:'missing',
                          schedule:!!c?.querySelector('.sunday-schedule'),
                          water:!!c?.querySelector('.ocean-rise')};
                      });
                      if(detail.church!=='visible'||!detail.schedule||!detail.water)detailErrors.push('CHURCH_UNDERLAY_MISSING');
                      if(kind==='night'&&(detail.blue<=.05||detail.blue>=.95||detail.gold!==0))detailErrors.push('NIGHT_REVEAL_NOT_RIGHT_HALF_FIRST');
                      if(kind==='gold'&&(detail.blue<.999||detail.gold<=.05||detail.gold>=.95))detailErrors.push('GOLD_REVEAL_NOT_LEFT_HALF_SECOND');
                      await page.screenshot({path:path.join(out,name+'-'+label+'.png'),animations:'disabled'});
                      logs.push({id:name+'-'+label,viewport:{width,height},metrics:detail,errors:detailErrors});
                    }catch(e){logs.push({id:name+'-'+label,errors:[e.message]});}
                  }
                }catch(e){logs.push({id,errors:[e.message]});console.error(id,e.message)}
                finally{await page.close()}
              }
            }finally{await browser.close()}
            fs.writeFileSync(path.join(out,'manifest.json'),JSON.stringify({source:'Westside P2 two-square concept',commit:process.env.GITHUB_SHA,editorialApproval:'PENDING',tests:logs},null,2));
            if(logs.some(x=>x.errors.length))process.exitCode=1;
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
      - name: Upload two-square proof screenshot set
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-two-square-video-study
          path: artifacts/p2-dual-square/
          if-no-files-found: warn
          retention-days: 14
