name: Enrich Isaiah ONE
on:
  push:
    branches: [feat/one-isaiah]
permissions:
  contents: write
jobs:
  enrich:
    if: ${{ !contains(github.event.head_commit.message, 'enrich Isaiah all chapters') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/one-isaiah
      - name: Enrich all 66 chapters without changing renderer
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('static/one/isaiah-complete.js')
          s=p.read_text()
          needle='      connections: linksFor(n),\n'
          repl='''      route: [["全章","閱讀本章","先辨認審判、呼召、應許與盼望如何推進。"],["核心","抓住轉折","留意「因此／到那日／耶和華說」等結構標記。"],["回望","放回全卷","把本章放回以賽亞書從審判走向安慰與新創造的主線。"]],\n      background: [["歷史處境", n<=39 ? "本章位於亞述危機與猶大王國的歷史張力中；閱讀時要分辨先知當下的政治處境與更遠的救恩盼望。" : "本章位於安慰、歸回與終末更新的宏大視野中；閱讀時要分辨被擄／歸回語境與更遠的救恩盼望。\", "先確定本章所面對的人群、城邑與列國，再理解神學宣告。"],["全卷位置", sec[2], sec[3], "不要把單句抽離；先看它在本段落中的功能。"]],\n      scout: ["重複出現的耶和華稱號","審判與救恩如何並置","錫安／耶路撒冷的角色","列國與餘民","本章如何推進全卷盼望"],\n      connections: linksFor(n),\n'''
          if needle not in s: raise SystemExit('connections insertion point not found')
          s=s.replace(needle,repl,1)
          p.write_text(s)
          PY
      - name: Commit enrichment
        run: |
          git config user.name 'WATCHMAN'
          git config user.email 'westsidewatchca@gmail.com'
          git add static/one/isaiah-complete.js
          git diff --cached --quiet && exit 0
          git commit -m 'feat(one): enrich Isaiah all chapters'
          git push origin HEAD:feat/one-isaiah
