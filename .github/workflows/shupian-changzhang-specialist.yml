name: Shupian Changzhang specialist source experiment
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/shupian_recovery/changzhang_sweep.py'
      - 'scripts/shupian_recovery/test_changzhang_sweep.py'
      - 'scripts/shupian_recovery/changzhang_status_export.py'
      - '.github/workflows/shupian-changzhang-specialist.yml'
permissions:
  contents: write
jobs:
  changzhang-specialist:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check original and new engine regressions
        run: python3 -m unittest discover -s scripts/shupian_recovery -p 'test_*.py' -v
      - name: Install media analyzer
        run: sudo apt-get update -qq && sudo apt-get install -qq -y ffmpeg
      - name: Scan native Changzhang categories across four content groups
        continue-on-error: true
        run: |
          python3 scripts/shupian_recovery/changzhang_sweep.py \
            --max-pages 5 --page-size 20 --detail-batch 30 \
            --probe-count 12 --sleep 0.15 \
            --output shupian-changzhang-specialist.json
      - name: Export browser-readable four-stage status
        if: always()
        run: |
          if test -f shupian-changzhang-specialist.json; then
            python3 scripts/shupian_recovery/changzhang_status_export.py \
              --scan shupian-changzhang-specialist.json \
              --output static/shupian/recovery/changzhang-round-status.json
          fi
      - name: Publish source evidence status to existing cinema test bench
        if: always()
        run: |
          if test -f static/shupian/recovery/changzhang-round-status.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add static/shupian/recovery/changzhang-round-status.json
            if ! git diff --cached --quiet; then
              git commit -m "data(shupian): publish Changzhang experiment stage status [skip ci]"
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi
      - name: Sync safe stage status to published gh-pages cinema
        if: always()
        run: |
          if test -f static/shupian/recovery/changzhang-round-status.json; then
            git fetch origin gh-pages
            git worktree add /tmp/shupian-published origin/gh-pages
            mkdir -p /tmp/shupian-published/shupian/recovery
            cp static/shupian/recovery/changzhang-round-status.json /tmp/shupian-published/shupian/recovery/changzhang-round-status.json
            cd /tmp/shupian-published
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add shupian/recovery/changzhang-round-status.json
            if ! git diff --cached --quiet; then
              git commit -m "data(shupian): sync Changzhang evidence to published cinema"
              git push origin HEAD:gh-pages
            fi
          fi
      - name: Preserve real API, catalog, manifest, segment, and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shupian-changzhang-specialist
          path: |
            shupian-changzhang-specialist.json
            static/shupian/recovery/changzhang-round-status.json
          if-no-files-found: warn
