name: Shupian Changzhang specialist source experiment
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/shupian_recovery/changzhang_sweep.py'
      - 'scripts/shupian_recovery/test_changzhang_sweep.py'
      - 'scripts/shupian_recovery/changzhang_status_export.py'
      - 'scripts/shupian_recovery/changzhang_browser_probe.py'
      - '.github/workflows/shupian-changzhang-specialist.yml'
concurrency:
  group: shupian-changzhang-specialist
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  changzhang-specialist:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check original and new engine regressions
        run: python3 -m unittest discover -s scripts/shupian_recovery -p 'test_*.py' -v
      - name: Install media analyzer
        run: sudo apt-get update -qq && sudo apt-get install -qq -y ffmpeg
      - name: Scan native Changzhang categories across four content groups
        continue-on-error: true
        run: |
          python3 scripts/shupian_recovery/changzhang_sweep.py \
            --max-pages 5 --page-size 20 --detail-batch 30 \
            --probe-count 12 --sleep 0.15 \
            --output shupian-changzhang-specialist.json
      - name: Install Chromium HLS playback test environment
        continue-on-error: true
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
      - name: Test first frame and real time advancement on sampled HLS
        continue-on-error: true
        run: |
          if test -f shupian-changzhang-specialist.json; then
            if ! python3 scripts/shupian_recovery/changzhang_browser_probe.py \
              --scan shupian-changzhang-specialist.json \
              --limit 3 --timeout-ms 20000 \
              --output shupian-changzhang-playback.json; then
              python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('shupian-changzhang-playback.json')
          if not p.exists():
              p.write_text(json.dumps({'schema':1,'status':'BROWSER_TOOL_FAILURE',
                 'samples':[],'error':'Browser probe exited without results; inspect CI step logs.'})+'\n')
          PY
            fi
          fi
      - name: Export browser-readable four-stage status
        if: always()
        run: |
          if test -f shupian-changzhang-specialist.json; then
            python3 scripts/shupian_recovery/changzhang_status_export.py \
              --scan shupian-changzhang-specialist.json \
              --playback shupian-changzhang-playback.json \
              --output static/shupian/recovery/changzhang-round-status.json
          fi
      - name: Publish source evidence status to existing cinema test bench
        if: always()
        run: |
          if test -f static/shupian/recovery/changzhang-round-status.json; then
            python3 -m json.tool static/shupian/recovery/changzhang-round-status.json >/dev/null
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add static/shupian/recovery/changzhang-round-status.json
            if ! git diff --cached --quiet; then
              git commit -m "data(shupian): publish Changzhang experiment stage status"
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi
      - name: Preserve real API, catalog, manifest, segment, and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shupian-changzhang-specialist
          path: |
            shupian-changzhang-specialist.json
            shupian-changzhang-playback.json
            static/shupian/recovery/changzhang-round-status.json
          if-no-files-found: warn
