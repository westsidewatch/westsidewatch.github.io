name: Calligraphy Preview Batch

on:
  push:
    branches: [feat/calligraphy-jizi-core]
    paths:
      - 'scripts/calligraphy_preview_batch.py'
      - 'scripts/calligraphy_preview_resolver.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resolve-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/calligraphy-jizi-core
      - name: Resolve visible previews
        run: python3 scripts/calligraphy_preview_batch.py
      - name: Build immediate TC001 preview
        run: |
          python3 - <<'PY'
          import json, html
          from pathlib import Path
          root=Path('.')
          d=json.loads((root/'data/calligraphy/corpus.json').read_text())
          chars={x['id']:x['literal'] for x in d['characters']}
          glyph={chars[g['characterId']]:g for g in d['glyphs']}
          text=d['tc001']['text']
          W=720; cell=150; margin=70; H=margin*2+cell*len(text)
          out=[f'<svg xmlns="http://www.w3.org/2000/svg" width="{W}" height="{H}" viewBox="0 0 {W} {H}">',f'<rect width="100%" height="100%" fill="#f4efe3"/>']
          for i,ch in enumerate(text):
            y=margin+i*cell
            g=glyph.get(ch,{})
            u=g.get('previewUrl')
            if u:
              out.append(f'<image href="{html.escape(u,quote=True)}" x="270" y="{y}" width="180" height="140" preserveAspectRatio="xMidYMid meet"/>')
            else:
              out.append(f'<text x="360" y="{y+90}" text-anchor="middle" font-size="82" opacity=".18">{html.escape(ch)}</text>')
          out.append('</svg>')
          p=root/'data/calligraphy/renders/tc001-preview-live.svg'; p.parent.mkdir(parents=True,exist_ok=True); p.write_text(''.join(out))
          PY
      - name: Persist results
        run: |
          git config user.name 'Calligraphy Preview Batch'
          git config user.email 'westsidewatchca@gmail.com'
          git add data/calligraphy/corpus.json data/calligraphy/renders/tc001-preview-live.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat(calligraphy): persist resolved TC001 previews [skip ci]'
          git push origin HEAD:feat/calligraphy-jizi-core
