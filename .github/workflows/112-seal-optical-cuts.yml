name: 112 Optical Seal Cuts
on:
  pull_request:
    paths:
      - 'static/experiments/section-name-seals/r112/**'
      - 'tests/112-seal-optical-cuts.cjs'
      - '.github/workflows/112-seal-optical-cuts.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: npm install --no-save --no-package-lock playwright && npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 4173 --directory static >/tmp/seals112-http.log 2>&1 &
          node tests/112-seal-optical-cuts.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editorial-112
          path: artifacts/112/
