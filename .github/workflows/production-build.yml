name: Production Build
on:
  pull_request:
    branches: [main]
    paths:
      - 'layouts/**'
      - 'content/**'
      - 'static/**'
      - 'assets/**'
      - 'cinema/**'
      - 'hugo.toml'
      - 'config.toml'
      - '.github/workflows/production-build.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Hugo Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Hugo
        env:
          HUGO_VERSION: 0.164.0
        run: |
          wget -q -O "${{ runner.temp }}/hugo.deb" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"
      - name: Normalize Hugo front matter compatibility
        run: python3 scripts/normalize_hugo_frontmatter.py
      - name: Build production website
        run: |
          hugo --minify --baseURL /
          test -s public/index.html
