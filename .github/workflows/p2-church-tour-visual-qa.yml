name: P2 Virtual Church Visual QA
on:
  push:
    branches: [main]
    paths:
      - 'static/p2/church-tour.html'
      - 'static/p2/church-tour.js'
      - 'static/p2/church-geometry-union.js'
      - 'scripts/p2-church-browser-cdp.mjs'
      - '.github/workflows/p2-church-tour-visual-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser-prove architectural geometry and moving camera
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --directory static >/tmp/p2-server.log 2>&1 &
          CHROME=$(command -v google-chrome || command -v chromium || true)
          if [ -z "$CHROME" ]; then echo "No Chromium available"; exit 1; fi
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage \
            --enable-webgl --ignore-gpu-blocklist --enable-unsafe-swiftshader \
            --use-gl=angle --use-angle=swiftshader --no-first-run \
            --remote-debugging-port=9222 --user-data-dir=/tmp/p2-chrome-cdp \
            --window-size=900,600 about:blank >/tmp/p2-chrome.log 2>&1 &
          node scripts/p2-church-browser-cdp.mjs
      - name: Preserve all visual verification frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-church-v41-camera-visual-proof
          path: artifacts/p2-church-visual-qa/
          if-no-files-found: warn
          retention-days: 30
