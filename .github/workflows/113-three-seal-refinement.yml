name: 113 Three Seal Refinement
on:
  pull_request:
    paths:
      - 'static/experiments/section-name-seals/r113/**'
      - 'tests/113-three-seal-refinement.cjs'
      - '.github/workflows/113-three-seal-refinement.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: npm install --no-save --no-package-lock playwright && npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 4173 --directory static >/tmp/seals113-http.log 2>&1 &
          node tests/113-three-seal-refinement.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editorial-113
          path: artifacts/113/
