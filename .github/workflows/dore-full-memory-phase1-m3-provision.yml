name: Dore Full Memory Phase 1 M3 Provision

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dore-full-memory-phase1-m3-provision.yml'

permissions:
  contents: read

concurrency:
  group: dore-full-memory-m3-provision
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DORE_HEARTBEAT_TOKEN: ${{ secrets.DORE_HEARTBEAT_TOKEN }}
      PROJECT: westsidewatch-github-io
      BUCKET: dore-conversation-memory-archive
      INDEX: dore-conversation-memory
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true
      - name: Verify Cloudflare automation credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'CLOUDFLARE_API_TOKEN missing'; exit 78; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'CLOUDFLARE_ACCOUNT_ID missing'; exit 78; }
          test -n "$DORE_HEARTBEAT_TOKEN" || { echo 'DORE_HEARTBEAT_TOKEN missing'; exit 78; }
          npx --yes wrangler@4 whoami
      - name: Verify M3 storage resources
        run: |
          npx --yes wrangler@4 r2 bucket list | tee /tmp/r2.txt
          grep -q "$BUCKET" /tmp/r2.txt || npx --yes wrangler@4 r2 bucket create "$BUCKET"
          npx --yes wrangler@4 vectorize get "$INDEX" --json >/tmp/vector.json
          cat /tmp/vector.json
      - name: Download exact current Pages configuration
        run: |
          rm -f wrangler.toml
          npx --yes wrangler@4 pages download config "$PROJECT" --force
          test -s wrangler.toml
      - name: Merge complete M3 production binding set
        run: |
          if ! grep -A4 '^\[\[env.production.r2_buckets\]\]' wrangler.toml | grep -q 'binding = "DORE_MEMORY_ARCHIVE"'; then
            printf '\n[[env.production.r2_buckets]]\nbinding = "DORE_MEMORY_ARCHIVE"\nbucket_name = "dore-conversation-memory-archive"\n' >> wrangler.toml
          fi
          if ! grep -A4 '^\[\[env.production.vectorize\]\]' wrangler.toml | grep -q 'binding = "DORE_MEMORY_VECTOR"'; then
            printf '\n[[env.production.vectorize]]\nbinding = "DORE_MEMORY_VECTOR"\nindex_name = "dore-conversation-memory"\n' >> wrangler.toml
          fi
          grep -n -E '^\[\[env.production.r2_buckets\]\]|^\[\[env.production.vectorize\]\]|binding = "DORE_MEMORY_(ARCHIVE|VECTOR)"|bucket_name = "dore-conversation-memory-archive"|index_name = "dore-conversation-memory"' wrangler.toml
      - name: Build Pages output
        run: hugo --gc --minify
      - name: Deploy complete M3 production binding set
        run: |
          npx --yes wrangler@4 pages deploy public \
            --project-name="$PROJECT" \
            --branch=main \
            --commit-hash="${GITHUB_SHA}" \
            --commit-message="Doré Full Memory M3 production bindings ${GITHUB_SHA}" \
            --commit-dirty=true
      - name: Verify M3 production ingestion end to end
        run: |
          sleep 20
          for i in $(seq 1 18); do
            OUT=$(curl --silent --show-error \
              -X POST \
              -H "Authorization: Bearer $DORE_HEARTBEAT_TOKEN" \
              https://westsidewatch-github-io.pages.dev/api/dore/memory-phase1-m3-diagnostic || true)
            echo "$OUT"
            if echo "$OUT" | python3 -c "import sys,json; d=json.load(sys.stdin); raise SystemExit(0 if d.get('milestone')=='M3_CONVERSATION_INGESTION_PASS' else 1)"; then
              echo 'M3_CONVERSATION_INGESTION_PASS'
              exit 0
            fi
            sleep 5
          done
          echo 'M3_CONVERSATION_INGESTION_FAIL'
          exit 1
