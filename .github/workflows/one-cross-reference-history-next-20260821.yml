name: ONE History Cross Reference Next
on:
  push:
    paths:
      - '.github/workflows/one-cross-reference-history-next-20260821.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add reviewed Scripture references
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('static/one/one-cross-reference-scripture.js')
          s=p.read_text()
          needle="    '列王紀上 19:19–21':'於是，以利亞離開那裡走了，遇見沙法的兒子以利沙耕地。在他前頭有十二對牛，自己趕著第十二對。以利亞到他那裡去，將自己的外衣搭在他身上。以利沙就離開牛，跑到以利亞那裡，說：「求你容我先與父母親嘴，然後我便跟隨你。」以利亞對他說：「你回去吧，我向你做了什麼呢？」以利沙就離開他回去，宰了一對牛，用套牛的器具煮肉給民吃，隨後就起身跟隨以利亞，服侍他。'"
          replacement=needle+",\n    '路加福音 4:25–27':'我對你們說實話，當以利亞的時候，天閉塞了三年零六個月，遍地有大饑荒，那時，以色列中有許多寡婦，以利亞並沒有奉差往她們一個人那裏去，只奉差往西頓的撒勒法一個寡婦那裏去。先知以利沙的時候，以色列中有許多長大痲瘋的，但內中除了敘利亞國的乃縵，沒有一個得潔淨的。',\n    '詩篇 105:1–15':'你們要稱謝耶和華，求告他的名，在萬民中傳揚他的作為！要向他唱詩歌頌，談論他一切奇妙的作為！要以他的聖名誇耀！尋求耶和華的人，心中應當歡喜！要尋求耶和華與他的能力，時常尋求他的面。他僕人亞伯拉罕的後裔，他所揀選雅各的子孫哪，你們要記念他奇妙的作為和他的奇事，並他口中的判語。他是耶和華－我們的上帝；全地都有他的判斷。他記念他的約，直到永遠；他所吩咐的話，直到千代－就是與亞伯拉罕所立的約，向以撒所起的誓。他又將這約向雅各定為律例，向以色列定為永遠的約，說：我必將迦南地賜給你，作你產業的分。當時，他們人丁有限，數目稀少，並且在那地為寄居的。他們從這邦遊到那邦，從這國行到那國。他不容甚麼人欺負他們，為他們的緣故責備君王，說：不可難為我受膏的人，也不可惡待我的先知。',\n    '以斯拉記 1:1–4':'波斯王塞魯士元年，耶和華為要應驗藉耶利米口所說的話，就激動波斯王塞魯士的心，使他下詔通告全國說：波斯王塞魯士如此說：耶和華天上的上帝已將天下萬國賜給我，又囑咐我在猶大的耶路撒冷為他建造殿宇。在你們中間凡作他子民的，可以上猶大的耶路撒冷，在耶路撒冷重建耶和華－以色列上帝的殿（只有他是上帝）。願上帝與這人同在。凡剩下的人，無論寄居何處，那地的人要用金銀、財物、牲畜幫助他，另外也要為耶路撒冷上帝的殿甘心獻上禮物。'"
          if needle not in s:
              raise SystemExit('Scripture insertion point not found')
          s=s.replace(needle,replacement,1)
          old='const reviewedExplanationBooks=[6,7,8,11,12];'
          new='const reviewedExplanationBooks=[6,7,8,11,12,13,14];'
          if old not in s:
              raise SystemExit('reviewed book list not found')
          s=s.replace(old,new,1)
          s=s.replace("batch:'history-reference-fill-through-kings-start'","batch:'history-reference-fill-through-chronicles'",1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'westsidewatch-scripture-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/one/one-cross-reference-scripture.js
          git commit -m 'Expand history cross-reference Scripture through Chronicles'
          git push
