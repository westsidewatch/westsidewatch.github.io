name: Sevenfold executable editorial grammar QA
on:
  pull_request:
    paths:
      - 'content/*/folio.md'
      - 'data/editorial/**'
      - 'layouts/partials/editorial/**'
      - 'layouts/_default/ws-editorial-interior.html'
      - 'layouts/_default/baseof.html'
      - 'static/css/westside-editorial-grammar.css'
      - 'static/experiments/scripture-studio-motherform-live.html'
      - 'scripts/editorial-sevenfold-contract.mjs'
      - 'scripts/editorial-grammar-new.mjs'
      - 'scripts/editorial-grammar-links.mjs'
      - 'tests/editorial-sevenfold-browser.cjs'
      - 'fixtures/editorial-grammar/**'
      - '.github/workflows/editorial-sevenfold.yml'
  workflow_dispatch:
jobs:
  grammar-to-website:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.167.0'
          extended: true
      - name: Validate the production grammar and all seven original realms
        run: node scripts/editorial-sevenfold-contract.mjs
      - name: Create a completely new article from editorial grammar input
        run: |
          node scripts/editorial-grammar-new.mjs \
            --realm=journal --slug=grammar-proof \
            --source=fixtures/editorial-grammar/journal-proof.json --publish
          test -f content/journal/grammar-proof.md
          test -f data/editorial/grammar/journal-grammar-proof.json
      - name: Build the actual Hugo pages
        run: |
          hugo --gc --minify --baseURL 'http://127.0.0.1:4186/'
          test -f public/journal/grammar-proof/index.html
          for realm in church journal emmaus olive dawn-library cinema daylight-cafe; do
            test -f "public/$realm/folio/index.html"
          done
      - name: Require real built destinations for every editorial reading link
        run: node scripts/editorial-grammar-links.mjs
      - name: Install real Chromium browser
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install chromium
      - name: Prove 7 distinct grammar pages and the generated page actually render
        run: |
          python3 -m http.server 4186 --directory public > /tmp/ws-grammar-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          node tests/editorial-sevenfold-browser.cjs
      - name: Preserve every screenshot for editorial design review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editorial-grammar-web-pages
          path: artifacts/sevenfold-editorial/
          retention-days: 14
          if-no-files-found: ignore
