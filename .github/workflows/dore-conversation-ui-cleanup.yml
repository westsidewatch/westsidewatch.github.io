name: Doré conversation UI cleanup
on:
  push:
    branches: [main]
    paths: ['.github/workflows/dore-conversation-ui-cleanup.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove legacy inline mode listener and bust runtime cache
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('static/dore/search/index.html')
          s=p.read_text()
          s=s.replace('/dore/dore-search-runtime.js?v=ask-dore-20260828a','/dore/dore-search-runtime.js?v=conversation-v7-20260829a',1)
          start=s.find('<script>\n(()=>{const form=document.getElementById(\'search-form\')')
          if start!=-1:
              end=s.find('</script>',start)
              if end==-1: raise SystemExit('legacy inline script end missing')
              s=s[:start]+s[end+9:]
          if 'Local first / Cloud fallback' in s: raise SystemExit('legacy cloud fallback copy remains')
          if 'conversation-v7-20260829a' not in s: raise SystemExit('runtime cache bust missing')
          p.write_text(s)
          PY
      - name: Verify syntax markers
        run: |
          grep -F 'dore-search-runtime.js?v=conversation-v7-20260829a' static/dore/search/index.html
          grep -F "version:'7.0.0'" static/dore/dore-search-runtime.js
          grep -F "(?:搜索|search)" static/dore/dore-search-runtime.js
          ! grep -F 'Cloud fallback' static/dore/search/index.html
      - name: Commit and self-delete
        run: |
          rm .github/workflows/dore-conversation-ui-cleanup.yml
          git config user.name 'westsidewatch-bot'
          git config user.email 'westsidewatchca@gmail.com'
          git add static/dore/search/index.html .github/workflows/dore-conversation-ui-cleanup.yml
          git commit -m 'dore: finalize persistent AI conversation surface'
          git push origin HEAD:main
