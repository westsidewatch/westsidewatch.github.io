name: Doré Capability Runtime

on:
  pull_request:
    paths:
      - 'dore_core/**'
      - 'dore-core/runtime/**'
      - 'local/dore-local/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/dore-capability-runtime.yml'
  push:
    branches: [main]
    paths:
      - 'dore_core/**'
      - 'dore-core/runtime/**'
      - 'local/dore-local/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/dore-capability-runtime.yml'

permissions:
  contents: read

jobs:
  sparse-runtime-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run minimum-sufficient Bible routing tests
        run: python -m unittest tests.test_bible_query_planner -v
      - name: Run capability runtime tests
        run: |
          python -m unittest discover -s tests -p 'test_dore_*capability*.py' -v
          python -m unittest discover -s tests -p 'test_dore_intelligence*.py' -v
          python -m unittest tests.test_dore_substrates -v
          python -m unittest tests.test_dore_living_retrieval -v
          python -m unittest tests.test_dore_knowledge_substrate_install -v
          python -m unittest tests.test_dore_knowledge_substrate_control_plane -v
          python -m unittest discover -s tests -p 'test_dore_provider*.py' -v
          python -m unittest discover -s tests -p 'test_dore_control_plane*.py' -v
          python -m unittest tests.test_dore_local_a2a_control_bridge -v
          python -m unittest tests.test_dore_companion_4312 -v
          python -m unittest tests.test_dore_companion_native_contract -v
          python -m unittest tests.test_dore_companion_bootstrap_contract -v
          python local/dore-local/test_native_host.py
      - name: Run Dimensional Writing A2A acceptance
        run: python local/dore-local/dimensional_writing_a2a_acceptance.py
      - name: Validate macOS installer shells
        run: |
          bash -n local/dore-local/install_companion.sh
          bash -n local/dore-local/install_native_messaging.sh
          bash -n local/dore-local/install-knowledge-substrates-macos.sh
          bash -n local/dore-local/bootstrap_companion_1.command
          python -m py_compile local/dore-local/knowledge-substrate-poc.py local/dore-local/production_actions.py local/dore-local/capability_bus.py local/dore-local/book_intelligence_capability.py local/dore-local/dimensional_writing_capability.py dore_core/bible/query_planner.py
      - name: Run zero-metered-cost benchmark
        run: python scripts/dore_capability_benchmark.py
      - name: Run shared-state visual execution probe
        run: python scripts/dore_visual_pipeline_probe.py
      - name: Verify renderer probe fails closed when absent
        run: |
          set +e
          python scripts/dore_renderer_probe.py > /tmp/dore-renderer-probe.json
          code=$?
          cat /tmp/dore-renderer-probe.json
          if [ "$code" -ne 2 ]; then
            echo "Expected NOT_READY/exit 2 without resident renderer, got $code"
            exit 1
          fi
