name: Doré P01 Production Probe

on:
  push:
    branches: [main]
    paths:
      - 'tests/dore-p01-production-probe.mjs'
      - '.github/workflows/dore-p01-production-probe.yml'
  workflow_run:
    workflows: ['Doré P01 Pages Deploy']
    types: [completed]
  workflow_dispatch:
    inputs:
      origin:
        description: 'Deployed Pages origin'
        required: false
        default: 'https://westsidewatch-github-io.pages.dev'
        type: string
      source_url:
        description: 'Public biblical-world YouTube source used to seed a real subtitle job'
        required: false
        default: 'https://youtube.com/watch?v=ak06MSETeo4'
        type: string
      job_id:
        description: 'Optional existing real dore_video_subtitle_jobs id; when omitted the probe creates/deduplicates its own job'
        required: false
        type: string

permissions:
  contents: read

jobs:
  production-probe:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Seed or resume a real production subtitle job and verify reader result
        env:
          DORE_P01_ORIGIN: ${{ github.event.inputs.origin || 'https://westsidewatch-github-io.pages.dev' }}
          DORE_P01_SOURCE_URL: ${{ github.event.inputs.source_url || 'https://youtube.com/watch?v=ak06MSETeo4' }}
          DORE_P01_JOB_ID: ${{ github.event.inputs.job_id || '' }}
          DORE_P01_EVIDENCE_FILE: /tmp/dore-p01-production-evidence.json
        run: node tests/dore-p01-production-probe.mjs
      - name: Show production evidence
        if: always()
        run: |
          if [ -f /tmp/dore-p01-production-evidence.json ]; then
            cat /tmp/dore-p01-production-evidence.json
          else
            echo '{"ok":false,"error":"production probe did not create evidence file"}'
          fi
      - name: Upload production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dore-p01-production-evidence
          path: /tmp/dore-p01-production-evidence.json
          if-no-files-found: warn
          retention-days: 30
