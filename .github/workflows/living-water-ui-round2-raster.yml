name: Living Water UI Round 2 Raster
on:
  push:
    branches: ['dore/living-water-ui-round2']
    paths:
      - 'static/dore-design/living-water-ui-round2.html'
      - '.github/workflows/living-water-ui-round2-raster.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  raster:
    runs-on: [self-hosted, macOS, dore]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Resolve browser
        run: |
          if [ -x '/Applications/Google Chrome.app/Contents/MacOS/Google Chrome' ]; then echo "DORE_DESIGN_BROWSER=/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" >> "$GITHUB_ENV"; elif [ -x '/Applications/Chromium.app/Contents/MacOS/Chromium' ]; then echo "DORE_DESIGN_BROWSER=/Applications/Chromium.app/Contents/MacOS/Chromium" >> "$GITHUB_ENV"; elif [ -x '/Applications/Microsoft Edge.app/Contents/MacOS/Microsoft Edge' ]; then echo "DORE_DESIGN_BROWSER=/Applications/Microsoft Edge.app/Contents/MacOS/Microsoft Edge" >> "$GITHUB_ENV"; else echo "DORE_DESIGN_BROWSER=/opt/homebrew/bin/firefox" >> "$GITHUB_ENV"; fi
      - name: Raster four candidates
        run: |
          python3 - <<'PY'
          import os, pathlib, subprocess, time
          root=pathlib.Path.cwd(); out=root/'.living-water-ui-round2-raster'; out.mkdir(exist_ok=True)
          port='8765'; server=subprocess.Popen(['python3','-m','http.server',port,'--directory',str(root)],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
          time.sleep(1)
          try:
            browser=os.environ['DORE_DESIGN_BROWSER']
            base=f'http://127.0.0.1:{port}/static/dore-design/living-water-ui-round2.html'
            for candidate in ['sacred-threshold','living-community','quiet-light','architectural-bloom']:
              target=out/f'{candidate}.png'
              url=base+'#'+candidate
              if 'firefox' in browser.lower():
                raise SystemExit('Firefox CLI screenshot is not admitted by this workflow; install Chrome/Chromium/Edge on Doré runner')
              subprocess.run([browser,'--headless=new','--hide-scrollbars','--window-size=1440,1000',f'--screenshot={target}',url],check=True,timeout=60)
              assert target.is_file() and target.stat().st_size>10000, candidate
          finally: server.terminate(); server.wait(timeout=5)
          print('LIVING_WATER_UI_ROUND2_REAL_BROWSER_RASTER=PASS')
          PY
      - name: Upload visible evidence
        uses: actions/upload-artifact@v4
        with:
          name: living-water-ui-round2-raster-${{ github.run_id }}
          path: .living-water-ui-round2-raster/*.png
          if-no-files-found: error
          retention-days: 30
