name: R124 seven-realm composition proof
on:
  push:
    branches: [research/seven-realm-visual-system-r124-20261126]
  workflow_dispatch:
jobs:
  proof:
    if: github.ref == 'refs/heads/research/seven-realm-visual-system-r124-20261126'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 4173 --directory static >/tmp/r124-server.log 2>&1 &
          node tests/seven-realm-r124.cjs
      - name: R125 source acquisition and provenance
        if: always()
        run: python3 scripts/r125-material-research.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seven-realm-r124
          path: artifacts/r124/
