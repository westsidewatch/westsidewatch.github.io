name: Doré governed R2 migration

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/dore-r2-migration.yml'
      - 'dore-core/cloudflare/ASSET-MIGRATION-BATCH-001.json'
      - 'dore-core/cloudflare/ASSET-MIGRATION-BATCH-002.json'

permissions:
  contents: write

jobs:
  migrate-priority-one:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run governed migration and verification
        env:
          TOKEN: ${{ secrets.DORE_HEARTBEAT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${TOKEN:-}" || { echo 'DORE_HEARTBEAT_TOKEN missing'; exit 1; }
          mkdir -p dore-core/cloudflare/receipts
          python3 - <<'PY'
          import json, os, time, datetime, subprocess, urllib.parse
          items=[
            {'source':'static/one/share/matthew-03-baptism-motion-r5-mobile.gif','code':'ONE-MAT-03-BAPTISM-COVER-MOTION','preserve':'working','scripture':['Matthew 3'],'social':['share','mobile']},
            {'source':'static/one/studio/jude-01-michael-moses-dore-studio-r2.png','code':'ONE-JUDE-01-MICHAEL-MOSES-STUDIO','preserve':'working'},
            {'source':'static/one/studio/obadiah-01-dore-studio-r2.png','code':'ONE-OBA-01-DORE-STUDIO','preserve':'working'},
            {'source':'static/one/studio/revelation-02-dore-final-full.png','code':'ONE-REV-02-DORE-FINAL','preserve':'working'},
            {'source':'static/one/dore-restorations/183-john-baptist-preaching-restored-r1.png','code':'ONE-MAT-03-JOHN-BAPTIST-PREACHING-RESTORED','preserve':'permanent','scripture':['Matthew 3']},
            {'source':'static/one/dore-restorations/184-baptism-of-jesus-restored-r1.png','code':'ONE-MAT-03-BAPTISM-JESUS-RESTORED','preserve':'permanent','scripture':['Matthew 3']},
            {'source':'static/one/motion-assets/matthew-03-baptism-dove-removed-r1.png','code':'ONE-MAT-03-BAPTISM-MOTION-SOURCE','preserve':'regenerable','scripture':['Matthew 3']}
          ]
          receipt={'milestone':'priority-one-media-migration','status':'FAIL','assets':[],'verified':[],'error':None}
          token=os.environ['TOKEN']
          def curl_json(args,timeout=240):
              p=subprocess.run(['curl','--silent','--show-error','--location','--user-agent','curl/8.0']+args,capture_output=True,text=True,timeout=timeout)
              raw=p.stdout.strip()
              if p.returncode!=0:
                  return {'ok':False,'curl_returncode':p.returncode,'stderr':p.stderr,'raw':raw}
              try:return json.loads(raw)
              except:return {'ok':False,'raw':raw,'stderr':p.stderr}
          try:
              for item in items:
                  body=json.dumps({
                      'source_path':item['source'],'asset_code':item['code'],'title':item['code'].replace('-',' '),
                      'generated_by':'dore','preservation_class':item['preserve'],'products_using_it':['ONE'],
                      'scripture_refs':item.get('scripture',[]),'social_uses':item.get('social',[])
                  })
                  result=None
                  for attempt in range(1,6):
                      result=curl_json(['--request','POST','--header',f'Authorization: Bearer {token}','--header','Content-Type: application/json','--data',body,'https://westsidewatch-github-io.pages.dev/api/dore/assets/migrate'])
                      if result.get('ok'): break
                      if attempt<5: time.sleep(attempt*15)
                  receipt['assets'].append({'asset_code':item['code'],'source_path':item['source'],'migration':result})
                  if not result or not result.get('ok'): raise RuntimeError(f"migration failed {item['code']}: {result}")
                  if result.get('action')!='dedupe_no_copy' and not result.get('registry_verified'): raise RuntimeError(f"registry verify failed {item['code']}: {result}")
                  q=urllib.parse.quote(item['code'])
                  search=curl_json(['https://westsidewatch-github-io.pages.dev/api/dore/assets/search?q='+q],timeout=90)
                  rows=search.get('results') or search.get('assets') or []
                  if not any(x.get('asset_code')==item['code'] for x in rows): raise RuntimeError(f"search verify failed {item['code']}: {search}")
                  receipt['verified'].append(item['code'])
              receipt['status']='PASS'
          except Exception as e:
              receipt['error']=repr(e)
          receipt['asset_count']=len(receipt['assets'])
          receipt['verified_count']=len(receipt['verified'])
          receipt['completed_at']=datetime.datetime.now(datetime.timezone.utc).isoformat()
          json.dump(receipt,open('dore-core/cloudflare/receipts/ASSET-MIGRATION-PRIORITY-ONE-RESULT.json','w'),ensure_ascii=False,indent=2)
          print(json.dumps(receipt,ensure_ascii=False,indent=2))
          if receipt['status']!='PASS': raise SystemExit(1)
          PY
      - name: Persist milestone receipt
        if: always()
        shell: bash
        run: |
          test -f dore-core/cloudflare/receipts/ASSET-MIGRATION-PRIORITY-ONE-RESULT.json || exit 0
          git config user.name 'dore-migration-bot'
          git config user.email 'dore-migration-bot@users.noreply.github.com'
          git add dore-core/cloudflare/receipts/ASSET-MIGRATION-PRIORITY-ONE-RESULT.json
          git commit -m 'chore(dore): record priority ONE media migration result [skip ci]' || exit 0
          git pull --rebase origin main || true
          git push || true
