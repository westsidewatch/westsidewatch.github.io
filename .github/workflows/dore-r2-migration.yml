name: Doré governed R2 migration

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/dore-r2-migration.yml'
      - 'dore-core/cloudflare/ASSET-MIGRATION-BATCH-001.json'

permissions:
  contents: read

jobs:
  migrate-batch-001:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Migrate Matthew 3 canonical cover motion
        env:
          DORE_HEARTBEAT_TOKEN: ${{ secrets.DORE_HEARTBEAT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DORE_HEARTBEAT_TOKEN:-}" || { echo 'DORE_HEARTBEAT_TOKEN missing'; exit 1; }

          body='{"source_path":"static/one/share/matthew-03-baptism-motion-r5-mobile.gif","asset_code":"ONE-MAT-03-BAPTISM-COVER-MOTION","title":"Matthew 3 — Baptism Cover Motion","description":"Canonical final retained motion cover for Matthew chapter 3.","alt_text":"Matthew 3 baptism cover motion","creator":"Doré","generated_by":"dore","preservation_class":"working","scripture_refs":["Matthew 3"],"products_using_it":["ONE"],"social_uses":["share","mobile"]}'

          for attempt in 1 2 3 4 5; do
            echo "Migration attempt ${attempt}/5"
            code=$(curl --silent --show-error --output response.json --write-out '%{http_code}' \
              --request POST \
              --header "Authorization: Bearer ${DORE_HEARTBEAT_TOKEN}" \
              --header 'Content-Type: application/json' \
              --data "$body" \
              'https://westsidewatch-github-io.pages.dev/api/dore/assets/migrate' || true)
            cat response.json || true
            echo
            if [ "$code" = "200" ]; then break; fi
            if [ "$attempt" = "5" ]; then echo "Migration failed with HTTP ${code}"; exit 1; fi
            sleep $((attempt * 15))
          done

          python3 - <<'PY'
          import json
          with open('response.json', encoding='utf-8') as f:
              r=json.load(f)
          if not r.get('ok'):
              raise SystemExit(f"migration response not ok: {r}")
          if r.get('action') != 'dedupe_no_copy' and not r.get('registry_verified'):
              raise SystemExit(f"registry verification did not pass: {r}")
          print('MIGRATION_PASS', r.get('action'), r.get('target_key') or r.get('existing',{}).get('storage_locator'))
          PY

      - name: Verify searchable registry record
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            'https://westsidewatch-github-io.pages.dev/api/dore/assets/search?q=ONE-MAT-03-BAPTISM-COVER-MOTION' \
            -o search.json
          cat search.json
          python3 - <<'PY'
          import json
          with open('search.json', encoding='utf-8') as f:
              r=json.load(f)
          rows=r.get('results') or r.get('assets') or []
          if not any(x.get('asset_code')=='ONE-MAT-03-BAPTISM-COVER-MOTION' for x in rows):
              raise SystemExit('canonical asset not found in registry search')
          print('REGISTRY_SEARCH_PASS')
          PY
