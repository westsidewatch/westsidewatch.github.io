name: Dawn Library Books

on:
  pull_request:
    paths:
      - 'local/dore-local/dawn_library_books.py'
      - 'local/dore-local/dawn_library_books_acceptance.py'
      - 'dore-design/knowledge-lab/capabilities/registry.json'
      - '.github/workflows/dawn-library-books.yml'

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline contract acceptance
        run: python3 local/dore-local/dawn_library_books_acceptance.py
