name: Doré Language Core

on:
  push:
    paths:
      - 'dore_core/language/**'
      - 'dore_core/readers/**'
      - 'scripts/run_language_core_parity.py'
      - 'scripts/ingest_lxx_language_core.py'
      - '.github/workflows/dore-language-core.yml'
  pull_request:
    paths:
      - 'dore_core/language/**'
      - 'dore_core/readers/**'
      - 'scripts/run_language_core_parity.py'
      - 'scripts/ingest_lxx_language_core.py'
      - '.github/workflows/dore-language-core.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  language-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Text-Fabric
        run: python -m pip install --upgrade pip text-fabric
      - name: Run 66-book language-core parity benchmark
        id: parity
        continue-on-error: true
        env:
          PYTHONPATH: .
        run: python scripts/run_language_core_parity.py
      - name: Clone pinned LXX witness
        id: lxx_source
        if: always()
        continue-on-error: true
        run: |
          rm -rf .cache/centerblc-lxx
          git clone --no-checkout https://github.com/CenterBLC/LXX.git .cache/centerblc-lxx
          git -C .cache/centerblc-lxx checkout 4829f3746c84d75576702498e75a68856358f289
      - name: Ingest complete LXX witness
        id: lxx
        if: always()
        continue-on-error: true
        env:
          PYTHONPATH: .
          DORE_LXX_TF_DIR: .cache/centerblc-lxx/tf/1935
        run: python scripts/ingest_lxx_language_core.py
      - name: Ensure reports exist
        if: always()
        run: |
          mkdir -p reports
          if [ ! -f reports/DORÉ-LANGUAGE-CORE-PARITY.json ]; then
            printf '{"status":"INFRA_FAIL","error":"language core parity report was not produced","parity":"%s"}\n' "${{ steps.parity.outcome }}" > reports/DORÉ-LANGUAGE-CORE-PARITY.json
          fi
          if [ ! -f reports/DORÉ-LXX-INGESTION.json ]; then
            printf '{"status":"INFRA_FAIL","error":"LXX ingestion report was not produced","lxx_source":"%s","lxx":"%s"}\n' "${{ steps.lxx_source.outcome }}" "${{ steps.lxx.outcome }}" > reports/DORÉ-LXX-INGESTION.json
          fi
      - name: Upload language-core reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dore-language-core-reports
          path: |
            reports/DORÉ-LANGUAGE-CORE-PARITY.json
            reports/DORÉ-LXX-INGESTION.json
          retention-days: 30
      - name: Persist language-core reports
        if: always() && github.event_name == 'push'
        run: |
          git config user.name 'Doré CI'
          git config user.email 'westsidewatchca@gmail.com'
          git add reports/DORÉ-LANGUAGE-CORE-PARITY.json reports/DORÉ-LXX-INGESTION.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore(dore): persist language core reports [skip ci]'
            git push
          fi
      - name: Enforce language-core result
        if: always()
        run: |
          test "${{ steps.parity.outcome }}" = "success"
          test "${{ steps.lxx_source.outcome }}" = "success"
          test "${{ steps.lxx.outcome }}" = "success"
