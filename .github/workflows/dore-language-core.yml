name: Doré Language Core

on:
  push:
    paths:
      - 'dore_core/language/**'
      - 'dore_core/readers/**'
      - 'scripts/run_language_core_parity.py'
      - 'scripts/ingest_lxx_language_core.py'
      - 'scripts/ingest_vulgate_language_core.py'
      - 'scripts/ingest_webu_language_core.py'
      - 'scripts/ingest_cuv_traditional_language_core.py'
      - 'scripts/ingest_asv_language_core.py'
      - 'scripts/ingest_kjv_language_core.py'
      - '.github/workflows/dore-language-core.yml'
  pull_request:
    paths:
      - 'dore_core/language/**'
      - 'dore_core/readers/**'
      - 'scripts/run_language_core_parity.py'
      - 'scripts/ingest_lxx_language_core.py'
      - 'scripts/ingest_vulgate_language_core.py'
      - 'scripts/ingest_webu_language_core.py'
      - 'scripts/ingest_cuv_traditional_language_core.py'
      - 'scripts/ingest_asv_language_core.py'
      - 'scripts/ingest_kjv_language_core.py'
      - '.github/workflows/dore-language-core.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  language-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Text-Fabric
        run: python -m pip install --upgrade pip text-fabric
      - name: Run 66-book language-core parity benchmark
        id: parity
        continue-on-error: true
        env: {PYTHONPATH: .}
        run: python scripts/run_language_core_parity.py
      - name: Clone pinned LXX witness
        id: lxx_source
        if: always()
        continue-on-error: true
        run: |
          rm -rf .cache/centerblc-lxx
          git clone --no-checkout https://github.com/CenterBLC/LXX.git .cache/centerblc-lxx
          git -C .cache/centerblc-lxx checkout 4829f3746c84d75576702498e75a68856358f289
      - name: Ingest complete LXX witness
        id: lxx
        if: always()
        continue-on-error: true
        env: {PYTHONPATH: ., DORE_LXX_TF_DIR: .cache/centerblc-lxx/tf/1935}
        run: python scripts/ingest_lxx_language_core.py
      - name: Ingest complete Latin Vulgate witness
        id: vulgate
        if: always()
        continue-on-error: true
        env: {PYTHONPATH: .}
        run: python scripts/ingest_vulgate_language_core.py
      - name: Ingest complete English WEBU witness
        id: webu
        if: always()
        continue-on-error: true
        env: {PYTHONPATH: .}
        run: python scripts/ingest_webu_language_core.py
      - name: Clone pinned ASV witness
        id: asv_source
        if: always()
        continue-on-error: true
        run: |
          rm -rf .cache/asv
          git clone --no-checkout https://github.com/openbibleinfo/American-Standard-Version-Bible.git .cache/asv
          git -C .cache/asv checkout 5c83ee265c75b3b1c056435eff622a875f1edc45
      - name: Ingest complete English ASV witness
        id: asv
        if: always()
        continue-on-error: true
        env: {PYTHONPATH: ., DORE_ASV_USX_DIR: .cache/asv/usx}
        run: python scripts/ingest_asv_language_core.py
      - name: Clone pinned KJV witness
        id: kjv_source
        if: always()
        continue-on-error: true
        run: |
          rm -rf .cache/kjv
          git clone --no-checkout https://github.com/TheologyCommons/Bible.TEI.KJV.git .cache/kjv
          git -C .cache/kjv checkout 014f6966aad1dc8888b088cd11ea8216a46fa738
      - name: Ingest complete English KJV witness
        id: kjv
        if: always()
        continue-on-error: true
        env: {PYTHONPATH: ., DORE_KJV_JSON: .cache/kjv/KJV.json}
        run: python scripts/ingest_kjv_language_core.py
      - name: Ingest complete Traditional Chinese CUV witness
        id: cuv_traditional
        if: always()
        continue-on-error: true
        env: {PYTHONPATH: .}
        run: python scripts/ingest_cuv_traditional_language_core.py
      - name: Ensure reports exist
        if: always()
        run: |
          mkdir -p reports
          test -f reports/DORÉ-LANGUAGE-CORE-PARITY.json || printf '{"status":"INFRA_FAIL"}\n' > reports/DORÉ-LANGUAGE-CORE-PARITY.json
          test -f reports/DORÉ-LXX-INGESTION.json || printf '{"status":"INFRA_FAIL"}\n' > reports/DORÉ-LXX-INGESTION.json
          test -f reports/DORÉ-VULGATE-INGESTION.json || printf '{"status":"INFRA_FAIL"}\n' > reports/DORÉ-VULGATE-INGESTION.json
          test -f reports/DORÉ-WEBU-INGESTION.json || printf '{"status":"INFRA_FAIL"}\n' > reports/DORÉ-WEBU-INGESTION.json
          test -f reports/DORÉ-ASV-INGESTION.json || printf '{"status":"INFRA_FAIL","asv_source":"${{ steps.asv_source.outcome }}","asv":"${{ steps.asv.outcome }}"}\n' > reports/DORÉ-ASV-INGESTION.json
          test -f reports/DORÉ-KJV-INGESTION.json || printf '{"status":"INFRA_FAIL","kjv_source":"${{ steps.kjv_source.outcome }}","kjv":"${{ steps.kjv.outcome }}"}\n' > reports/DORÉ-KJV-INGESTION.json
          test -f reports/DORÉ-CUV-TRADITIONAL-INGESTION.json || printf '{"status":"INFRA_FAIL"}\n' > reports/DORÉ-CUV-TRADITIONAL-INGESTION.json
      - name: Upload language-core reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dore-language-core-reports
          path: reports/DORÉ-*.json
          retention-days: 30
      - name: Persist language-core reports
        if: always() && github.event_name == 'push'
        run: |
          git config user.name 'Doré CI'
          git config user.email 'westsidewatchca@gmail.com'
          git add reports/DORÉ-*.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore(dore): persist language core reports [skip ci]'
            git push
          fi
      - name: Enforce language-core result
        if: always()
        run: |
          test "${{ steps.parity.outcome }}" = "success"
          test "${{ steps.lxx_source.outcome }}" = "success"
          test "${{ steps.lxx.outcome }}" = "success"
          test "${{ steps.vulgate.outcome }}" = "success"
          test "${{ steps.webu.outcome }}" = "success"
          test "${{ steps.asv_source.outcome }}" = "success"
          test "${{ steps.asv.outcome }}" = "success"
          test "${{ steps.kjv_source.outcome }}" = "success"
          test "${{ steps.kjv.outcome }}" = "success"
          test "${{ steps.cuv_traditional.outcome }}" = "success"
