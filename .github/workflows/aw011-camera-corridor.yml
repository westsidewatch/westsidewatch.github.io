name: AW-011 Camera Corridor

on:
  push:
    branches: [feat/aw-011-camera-corridor]
    paths: ["tools/aw_corridor/**", "experiments/aw-011/**", ".github/workflows/aw011-camera-corridor.yml"]
  pull_request:
    paths: ["tools/aw_corridor/**", "experiments/aw-011/**", ".github/workflows/aw011-camera-corridor.yml"]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - working-directory: tools/aw_corridor
        run: python -m unittest discover -v -p "test_*.py"

  world-scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: |
          mkdir -p experiments/aw-011/assets
          curl --fail --location --retry 3 "https://commons.wikimedia.org/wiki/Special:Redirect/file/011.Abraham_Goes_to_the_Land_of_Canaan.jpg" -o experiments/aw-011/assets/dore-011.jpg
      - run: python -m pip install --disable-pip-version-check "transformers>=4.45,<5" torch torchvision pillow numpy opencv-python-headless
      - run: python tools/aw_corridor/experiment_depth_scaffold.py --source experiments/aw-011/assets/dore-011.jpg --output build/aw-011-world/depth.png --report build/aw-011-world/depth-report.json
      - run: python tools/aw_corridor/experiment_depth_traversal.py --source experiments/aw-011/assets/dore-011.jpg --depth build/aw-011-world/depth.png --spine experiments/aw-011/camera-spine.json --output build/aw-011-world/aw-011-depth-traversal.mp4 --report build/aw-011-world/geometric-traversal-report.json --width 960 --fps 24 --segment-frames 24
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: aw-011-world-scaffold, path: build/aw-011-world/}

  v5-depth-bakeoff:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: {provider: [depth-anything, depth-pro, moge]}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: |
          mkdir -p experiments/aw-011/assets
          curl --fail --location --retry 3 "https://commons.wikimedia.org/wiki/Special:Redirect/file/011.Abraham_Goes_to_the_Land_of_Canaan.jpg" -o experiments/aw-011/assets/dore-011.jpg
      - run: python -m pip install --disable-pip-version-check numpy pillow opencv-python-headless torch torchvision "transformers>=4.45,<5"
      - if: matrix.provider == 'depth-pro'
        run: |
          python -m pip install --disable-pip-version-check 'git+https://github.com/apple/ml-depth-pro.git'
          mkdir -p checkpoints
          curl --fail --location --retry 3 https://ml-site.cdn-apple.com/models/depth-pro/depth_pro.pt -o checkpoints/depth_pro.pt
      - if: matrix.provider == 'moge'
        run: python -m pip install --disable-pip-version-check 'git+https://github.com/microsoft/MoGe.git'
      - run: |
          mkdir -p build/v5-${{ matrix.provider }}
          python tools/aw_corridor/experiment_depth_bakeoff.py --source experiments/aw-011/assets/dore-011.jpg --provider ${{ matrix.provider }} --output build/v5-${{ matrix.provider }}/depth.png --report build/v5-${{ matrix.provider }}/depth-report.json
      - run: python tools/aw_corridor/experiment_depth_traversal.py --source experiments/aw-011/assets/dore-011.jpg --depth build/v5-${{ matrix.provider }}/depth.png --spine experiments/aw-011/camera-spine.json --output build/v5-${{ matrix.provider }}/traversal.mp4 --report build/v5-${{ matrix.provider }}/traversal-report.json --width 960 --fps 24 --segment-frames 24
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aw-011-v5-${{ matrix.provider }}
          path: build/v5-${{ matrix.provider }}/
          if-no-files-found: warn

  v5-world-cache:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: |
          mkdir -p experiments/aw-011/assets
          curl --fail --location --retry 3 "https://commons.wikimedia.org/wiki/Special:Redirect/file/011.Abraham_Goes_to_the_Land_of_Canaan.jpg" -o experiments/aw-011/assets/dore-011.jpg
      - run: python -m pip install --disable-pip-version-check numpy pillow opencv-python-headless torch torchvision "transformers>=4.45,<5" 'git+https://github.com/microsoft/MoGe.git'
      - run: |
          mkdir -p build/v5-world-cache
          python tools/aw_corridor/experiment_depth_bakeoff.py --source experiments/aw-011/assets/dore-011.jpg --provider moge --output build/v5-world-cache/depth.png --report build/v5-world-cache/depth-report.json
      - run: python tools/aw_corridor/experiment_world_cache.py --source experiments/aw-011/assets/dore-011.jpg --depth build/v5-world-cache/depth.png --spine experiments/aw-011/camera-spine.json --output build/v5-world-cache/traversal.mp4 --report build/v5-world-cache/traversal-report.json --width 960 --fps 24 --segment-frames 24
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: aw-011-v5-world-cache, path: build/v5-world-cache/}

  v7-residual-ldi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: |
          mkdir -p experiments/aw-011/assets
          curl --fail --location --retry 3 "https://commons.wikimedia.org/wiki/Special:Redirect/file/011.Abraham_Goes_to_the_Land_of_Canaan.jpg" -o experiments/aw-011/assets/dore-011.jpg
      - run: python -m pip install --disable-pip-version-check numpy pillow opencv-python-headless torch torchvision "transformers>=4.45,<5" 'git+https://github.com/microsoft/MoGe.git'
      - run: |
          mkdir -p build/v7-residual-ldi
          python tools/aw_corridor/experiment_depth_bakeoff.py --source experiments/aw-011/assets/dore-011.jpg --provider moge --output build/v7-residual-ldi/depth.png --report build/v7-residual-ldi/depth-report.json
      - run: python tools/aw_corridor/experiment_residual_ldi.py --source experiments/aw-011/assets/dore-011.jpg --depth build/v7-residual-ldi/depth.png --spine experiments/aw-011/camera-spine.json --output build/v7-residual-ldi/traversal.mp4 --report build/v7-residual-ldi/traversal-report.json --width 960 --fps 24 --segment-frames 24 --layers 4
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: aw-011-v7-residual-ldi, path: build/v7-residual-ldi/}

  v8-predictive-local-ldi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: |
          mkdir -p experiments/aw-011/assets
          curl --fail --location --retry 3 "https://commons.wikimedia.org/wiki/Special:Redirect/file/011.Abraham_Goes_to_the_Land_of_Canaan.jpg" -o experiments/aw-011/assets/dore-011.jpg
      - run: python -m pip install --disable-pip-version-check numpy pillow opencv-python-headless torch torchvision "transformers>=4.45,<5" 'git+https://github.com/microsoft/MoGe.git'
      - run: |
          mkdir -p build/v8-predictive-local-ldi
          python tools/aw_corridor/experiment_depth_bakeoff.py --source experiments/aw-011/assets/dore-011.jpg --provider moge --output build/v8-predictive-local-ldi/depth.png --report build/v8-predictive-local-ldi/depth-report.json
      - run: python tools/aw_corridor/experiment_predictive_local_ldi.py --source experiments/aw-011/assets/dore-011.jpg --depth build/v8-predictive-local-ldi/depth.png --spine experiments/aw-011/camera-spine.json --output build/v8-predictive-local-ldi/traversal.mp4 --report build/v8-predictive-local-ldi/traversal-report.json --demand-map build/v8-predictive-local-ldi/world-demand-map.png --width 960 --fps 24 --segment-frames 24 --local-layers 3
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: aw-011-v8-predictive-local-ldi, path: build/v8-predictive-local-ldi/}
