name: AW-011 Camera Corridor

on:
  push:
    branches:
      - feat/aw-011-camera-corridor
    paths:
      - "tools/aw_corridor/**"
      - "experiments/aw-011/**"
      - ".github/workflows/aw011-camera-corridor.yml"
  pull_request:
    paths:
      - "tools/aw_corridor/**"
      - "experiments/aw-011/**"
      - ".github/workflows/aw011-camera-corridor.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run AW-011 contract tests
        working-directory: tools/aw_corridor
        run: python -m unittest discover -v -p "test_*.py"

  experiment-source-preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch Doré 011 experiment source
        run: |
          mkdir -p experiments/aw-011/assets
          curl --fail --location --retry 3 \
            "https://commons.wikimedia.org/wiki/Special:Redirect/file/011.Abraham_Goes_to_the_Land_of_Canaan.jpg" \
            --output experiments/aw-011/assets/dore-011.jpg
          test -s experiments/aw-011/assets/dore-011.jpg
          file experiments/aw-011/assets/dore-011.jpg
          sha256sum experiments/aw-011/assets/dore-011.jpg

      - name: Generate first real planar warp masks from Camera Spine
        run: |
          python tools/aw_corridor/experiment_warp.py \
            --source experiments/aw-011/assets/dore-011.jpg \
            --spine experiments/aw-011/camera-spine.json \
            --out-root experiments/aw-011 \
            --manifest-out experiments/aw-011/mask.input.ci.json

      - name: Bind real source and generated warp evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          src = Path('experiments/aw-011/production.input.example.json')
          data = json.loads(src.read_text())
          data['source']['asset'] = 'assets/dore-011.jpg'
          data['anchors'] = {'mask_manifest_file': 'mask.input.ci.json'}
          Path('experiments/aw-011/production.input.ci.json').write_text(json.dumps(data, indent=2) + '\n')
          PY

      - name: Run real AW-011 production preflight
        run: |
          set +e
          python tools/aw_corridor/run_aw011.py \
            experiments/aw-011/production.input.ci.json \
            --out-dir build/aw-011-real
          code=$?
          set -e
          # exit 0 = corridor already covered; exit 3 = real unseen evidence debt found.
          # Both are valid outcomes for this first experiment. Input/runtime errors remain failures.
          if [ "$code" -ne 0 ] && [ "$code" -ne 3 ]; then
            exit "$code"
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('build/aw-011-real/build-manifest.json')
          data = json.loads(p.read_text())
          if data['status'] not in {'READY_FOR_SCAFFOLD', 'NEEDS_ANCHOR_EVIDENCE'}:
              raise SystemExit(f"unexpected status: {data['status']}")
          print(json.dumps({
              'status': data['status'],
              'source_sha256': data['source']['sha256'],
              'ordered_pose_ids': data['camera']['ordered_pose_ids'],
              'unresolved_pose_ids': data['evidence']['unresolved_pose_ids'],
          }, indent=2))
          PY

      - name: Show real preflight evidence
        if: always()
        run: |
          find build/aw-011-real -maxdepth 2 -type f -print || true
          cat build/aw-011-real/build-manifest.json || true
          cat build/aw-011-real/anchor-plan.json || true

      - name: Upload AW-011 real experiment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aw-011-real-preflight
          path: |
            build/aw-011-real/
            experiments/aw-011/mask.input.ci.json
            experiments/aw-011/poses/*/*-mask.png
          if-no-files-found: warn
