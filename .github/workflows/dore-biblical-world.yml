name: Doré Biblical World Education
on:
  workflow_dispatch:
  push:
    paths:
      - 'dore_core/world/**'
      - 'dore-core/knowledge/foundation/biblical-world/**'
      - 'scripts/run_biblical_entity_recognition_checkpoint.py'
      - '.github/workflows/dore-biblical-world.yml'
permissions:
  contents: write
jobs:
  entity-recognition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch pinned STEPBible educational witness
        run: |
          git clone --filter=blob:none https://github.com/STEPBible/STEPBible-Data.git .cache/stepbible
          git -C .cache/stepbible checkout efe428a0047bf7b9c3ce2624f60c252c6e435945
      - name: Run Biblical Entity Recognition checkpoint
        env:
          PYTHONPATH: .
          DORE_TIPNR_FILE: .cache/stepbible/Proper Nouns/TIPNR - Translators Individualised Proper Names with all References - STEPBible.org CC BY.txt
        run: python scripts/run_biblical_entity_recognition_checkpoint.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dore-biblical-entity-recognition
          path: reports/DORÉ-BIBLICAL-ENTITY-RECOGNITION.json
      - name: Persist educational checkpoint evidence
        if: always() && github.event_name == 'push'
        run: |
          git config user.name 'Doré CI'
          git config user.email 'westsidewatchca@gmail.com'
          git add reports/DORÉ-BIBLICAL-ENTITY-RECOGNITION.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'chore(dore): persist Biblical Entity Recognition evidence [skip ci]'
            for attempt in 1 2 3 4; do
              if git push; then exit 0; fi
              git pull --rebase origin main
            done
            exit 1
          fi
