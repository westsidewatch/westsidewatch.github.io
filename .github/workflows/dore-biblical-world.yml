name: Doré Biblical World Education
on:
  workflow_dispatch:
  push:
    paths:
      - 'dore_core/world/**'
      - 'dore-core/knowledge/foundation/biblical-world/**'
      - 'scripts/run_biblical_entity_recognition_checkpoint.py'
      - 'scripts/run_biblical_geography_checkpoint.py'
      - 'scripts/build_dore_browser_entity_index.py'
      - 'scripts/run_bw1_entity_graduation.py'
      - 'scripts/run_biblical_world_graduation.py'
      - 'scripts/run_dore_search_self_exam.py'
      - 'static/dore/dore-search.js'
      - 'static/dore/dore-entity-search.js'
      - 'static/dore/dore-gallery.js'
      - 'tests/test_biblical_world_*.py'
      - '.github/workflows/dore-biblical-world.yml'
permissions:
  contents: write
jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install pytest
      - name: Fetch pinned educational witnesses
        run: |
          mkdir -p .cache/stepbible .cache/openbible
          python - <<'PY'
          from pathlib import Path
          from urllib.request import urlopen
          files={
            Path('.cache/stepbible/TIPNR.txt'):'https://raw.githubusercontent.com/STEPBible/STEPBible-Data/efe428a0047bf7b9c3ce2624f60c252c6e435945/Proper%20Nouns/TIPNR%20-%20Translators%20Individualised%20Proper%20Names%20with%20all%20References%20-%20STEPBible.org%20CC%20BY.txt',
            Path('.cache/openbible/ancient.jsonl'):'https://raw.githubusercontent.com/openbibleinfo/Bible-Geocoding-Data/7eb18a5ee62f27b9b93bd6689ea272d76dd23b8f/data/ancient.jsonl'}
          for target,url in files.items():
            with urlopen(url,timeout=120) as r:target.write_bytes(r.read())
            assert target.stat().st_size>1_000_000
            print(target,target.stat().st_size)
          PY
      - name: Biblical Entity Recognition checkpoint
        env:
          PYTHONPATH: .
          DORE_TIPNR_FILE: .cache/stepbible/TIPNR.txt
        run: python scripts/run_biblical_entity_recognition_checkpoint.py
      - name: Build real browser Entity Corpus
        env:
          PYTHONPATH: .
        run: |
          python scripts/build_dore_browser_entity_index.py \
            --tipnr .cache/stepbible/TIPNR.txt \
            --search-index static/dore/search-index.json \
            --output static/dore/entity-index.json \
            --source-sha efe428a0047bf7b9c3ce2624f60c252c6e435945
      - name: BW-1 reflex and intent transfer tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_biblical_world_entity_reflex.py tests/test_biblical_world_entity_query.py
      - name: BW-1 end-to-end graduation gate
        env:
          PYTHONPATH: .
        run: python scripts/run_bw1_entity_graduation.py
      - name: Biblical Geography checkpoint
        env:
          PYTHONPATH: .
          DORE_OPENBIBLE_ANCIENT: .cache/openbible/ancient.jsonl
        run: python scripts/run_biblical_geography_checkpoint.py
      - name: BW-2 through BW-6 transfer gates
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_biblical_world_geography_reflex.py tests/test_biblical_world_bw2_bw6.py
      - name: Biblical World cross-domain graduation gate
        env:
          PYTHONPATH: .
        run: python scripts/run_biblical_world_graduation.py
      - name: Public Doré Search self-examination
        run: python scripts/run_dore_search_self_exam.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dore-biblical-world-checkpoints
          path: |
            reports/DORÉ-BIBLICAL-ENTITY-RECOGNITION.json
            reports/DORÉ-BW1-ENTITY-GRADUATION.json
            reports/DORÉ-BIBLICAL-GEOGRAPHY.json
            reports/DORÉ-BIBLICAL-WORLD-GRADUATION.json
            reports/DORÉ-SEARCH-SELF-EXAM.json
            static/dore/entity-index.json
      - name: Persist educational checkpoint evidence and browser corpus
        if: always() && github.event_name == 'push'
        run: |
          git config user.name 'Doré CI'
          git config user.email 'westsidewatchca@gmail.com'
          git add reports/DORÉ-BIBLICAL-ENTITY-RECOGNITION.json reports/DORÉ-BW1-ENTITY-GRADUATION.json reports/DORÉ-BIBLICAL-GEOGRAPHY.json reports/DORÉ-BIBLICAL-WORLD-GRADUATION.json reports/DORÉ-SEARCH-SELF-EXAM.json static/dore/entity-index.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'chore(dore): persist Biblical World checkpoint evidence [skip ci]'
            for attempt in 1 2 3 4; do
              if git push; then exit 0; fi
              git pull --rebase origin main
            done
            exit 1
          fi
