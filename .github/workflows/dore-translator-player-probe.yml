name: DORE Translator Player Probe

on:
  push:
    paths:
      - 'local/dore-local/translation_player_probe.py'
      - 'cinema/data/translation-source.v0.json'
      - '.github/workflows/dore-translator-player-probe.yml'
  pull_request:
    paths:
      - 'local/dore-local/translation_player_probe.py'
      - 'cinema/data/translation-source.v0.json'
      - '.github/workflows/dore-translator-player-probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probe official player metadata
        run: python local/dore-local/translation_player_probe.py
