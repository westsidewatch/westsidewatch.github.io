name: Jerusalem 3000 Governance Gate

on:
  pull_request:
    branches: [main]
    paths: ['preview/jerusalem-3000/**','.github/workflows/jerusalem-3000-governance-gate.yml']
  push:
    branches: [main]
    paths: ['preview/jerusalem-3000/**','.github/workflows/jerusalem-3000-governance-gate.yml']
permissions:
  contents: read
jobs:
  architecture-authority:
    name: Architecture Authority
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce Three.js source authority and modular evidence geometry
        shell: bash
        run: |
          set -euo pipefail
          ROOT='preview/jerusalem-3000'
          for f in three-scene.js jerusalem-3000-three.js jerusalem-architecture.js spatial-registration.js architectural-grammar.js historical-time-engine.js ruin-transformation-engine.js data/continuous-build-timeline.json data/objects/herodian-30ce.json; do test -f "$ROOT/$f"; done
          grep -q "from 'three'" "$ROOT/three-scene.js"
          grep -q 'OrbitControls' "$ROOT/three-scene.js"
          grep -q 'PerspectiveCamera' "$ROOT/three-scene.js"
          grep -q 'WebGLRenderer' "$ROOT/three-scene.js"
          grep -q 'addEvidenceArchitecture' "$ROOT/three-scene.js"
          grep -q 'resolveSpatialRegistration' "$ROOT/jerusalem-architecture.js"
          grep -q 'buildArchitecturalGrammar' "$ROOT/jerusalem-architecture.js"
          grep -q "startsWith('withheld')" "$ROOT/spatial-registration.js"
          grep -q 'HistoricalTimeEngine' "$ROOT/jerusalem-3000-three.js"
          grep -q 'RuinTransformationEngine' "$ROOT/jerusalem-3000-three.js"
          grep -q 'setRuinProgress' "$ROOT/three-scene.js"
          grep -q 'await three.ready' "$ROOT/jerusalem-3000-three.js"
          if grep -Eq 'j3k-orbit-scene|rotateX\(var\(--j3k-pitch|rotateZ\(var\(--j3k-yaw' "$ROOT/jerusalem-3000.css"; then echo 'ERROR: CSS pseudo-3D camera detected.' >&2; exit 1; fi
          if grep -Eq 'Temporary geometry consumer|placeholder city grid|for\(let z=-1900' "$ROOT/three-scene.js"; then echo 'ERROR: placeholder geometry detected.' >&2; exit 1; fi
  evidence-authority:
    name: Evidence Authority
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Validate ledger and withheld geometry policy
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');const root='preview/jerusalem-3000';const ledger=JSON.parse(fs.readFileSync(`${root}/data/objects/herodian-30ce.json`,'utf8'));if(!Array.isArray(ledger.objects)||!ledger.objects.length)throw new Error('Herodian ledger has no objects');const terms=['observed','archaeological','reconstructed','textual','inferred','disputed'];for(const o of ledger.objects){if(!o.id)throw new Error('ledger object missing id');if(!terms.some(t=>String(o.evidence||'').includes(t)))throw new Error(`${o.id}: unclassified evidence`);}const resolver=fs.readFileSync(`${root}/spatial-registration.js`,'utf8');if(!resolver.includes("startsWith('withheld')"))throw new Error('spatial resolver must reject every withheld prefix');
          NODE
  historical-time-authority:
    name: Historical Time + Transformation Authority
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Validate continuous reversible time and ruin engines
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';const phases=JSON.parse(fs.readFileSync('preview/jerusalem-3000/data/continuous-build-timeline.json','utf8')).phases;const {HistoricalTimeEngine}=await import('./preview/jerusalem-3000/historical-time-engine.js');const {RuinTransformationEngine}=await import('./preview/jerusalem-3000/ruin-transformation-engine.js');const t=new HistoricalTimeEngine(phases),r=new RuinTransformationEngine(phases);if(phases.length!==18)throw new Error('canonical timeline must have 18 phases');if(!t.reversibleCheck(1024)||!r.reversibleCheck(1024))throw new Error('temporal engines must be reversible');const h=phases.findIndex(p=>p.id==='herodian-jesus'),d=phases.findIndex(p=>p.id==='roman-destruction');if(t.herodianVisibility(h)!==1)throw new Error('Herodian city missing');if(r.sample(d).ruin!==0)throw new Error('destruction boundary must begin standing');if(r.sample(d+1).ruin!==1)throw new Error('post-destruction state must be ruin');for(let i=0;i<=100;i++){const s=r.sample(d+i/100);if(Math.abs(s.standing+s.ruin-1)>1e-9)throw new Error('standing/ruin conservation failed');}
          NODE
  completion-contract:
    name: Completion Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify execution-until-stage-complete governance and prior stages
        shell: bash
        run: |
          set -euo pipefail
          GOV='preview/jerusalem-3000/GOVERNANCE.md'; test -f "$GOV"; grep -q 'Execution-until-stage-complete directive' "$GOV"; grep -q 'acknowledgement is not execution' "$GOV"; grep -q 'reporting is permitted only after the stage Definition of Done' "$GOV"; grep -q 'genuine hard blocker' "$GOV"; for n in 1 3 4 6; do test -f "preview/jerusalem-3000/STEP-$n-COMPLETION.json"; done
