name: ONE Gospel Harmony Consistency 2026-08-29
on:
  push:
    paths: ['.github/workflows/one-gospel-harmony-consistency-20260829.yml']
permissions:
  contents: write
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Compare repeated Gospel-harmony events
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,json,collections
          root=Path('static/one')
          gospel_files=[]
          for p in root.glob('*.js'):
              n=p.name
              if n=='one-data.js' or n=='matthew-complete.js' or n.startswith(('mark-','luke-','john-')):
                  gospel_files.append(p)
          rows=[]; parse_fail=[]
          full={'馬太福音':'太','馬可福音':'可','路加福音':'路','約翰福音':'約'}
          expected={1:'太',2:'可',3:'路',4:'約'}
          chapmax={'太':28,'可':16,'路':24,'約':21}
          def canon_cell(cell):
              s=str(cell).strip()
              for k,v in full.items(): s=s.replace(k,v)
              # notes in parentheses may legitimately mention another Gospel as a warning/comparison.
              primary=s.split('（',1)[0]
              return s,primary
          for p in sorted(gospel_files):
              for ln,line in enumerate(p.read_text(encoding='utf-8',errors='ignore').splitlines(),1):
                  if 'harmony:' not in line: continue
                  m=re.search(r'harmony:\s*(\[\[.*?\]\])\s*,',line)
                  if not m:
                      parse_fail.append(f'{p.name}:{ln}')
                      continue
                  try:block=json.loads(m.group(1))
                  except Exception:
                      parse_fail.append(f'{p.name}:{ln}')
                      continue
                  for r in block:
                      if isinstance(r,list) and len(r)==5: rows.append((p.name,ln,r))
          wrong=[]
          for fn,ln,r in rows:
              for i in range(1,5):
                  s,primary=canon_cell(r[i])
                  if s in {'—','-',''}:continue
                  refs=re.findall(r'(太|可|路|約)\s*(\d+)',primary)
                  if not refs:
                      wrong.append(f'{fn}:{ln} {r[0]} — {expected[i]}欄無可辨識經文：{s}')
                      continue
                  for pref,ch in refs:
                      if pref!=expected[i]:wrong.append(f'{fn}:{ln} {r[0]} — {expected[i]}欄誤引{pref}：{s}')
                      if not 1<=int(ch)<=chapmax[pref]:wrong.append(f'{fn}:{ln} {r[0]} — 章號越界：{s}')
          groups=collections.defaultdict(list)
          for fn,ln,r in rows:
              sig=tuple(canon_cell(x)[0] for x in r[1:])
              groups[str(r[0]).strip()].append((sig,fn,ln))
          inconsistent=[]
          for title,items in sorted(groups.items()):
              sigs=collections.defaultdict(list)
              for sig,fn,ln in items:sigs[sig].append(f'{fn}:{ln}')
              if len(items)>1 and len(sigs)>1:
                  inconsistent.append((title,sigs))
          out=Path('docs/one/GOSPEL-HARMONY-CONSISTENCY-20260829.md')
          L=['# ONE Gospel Harmony Cross-Gospel Consistency — 2026-08-29','',f'- Gospel harmony rows parsed: **{len(rows)}**',f'- Gospel-source parse failures: **{len(parse_fail)}**',f'- Wrong-column/chapter-bound findings: **{len(wrong)}**',f'- Repeated event titles with differing parallel references: **{len(inconsistent)}**','']
          if parse_fail:L+=['## Parse failures','']+[f'- {x}' for x in parse_fail]+['']
          if wrong:L+=['## Reference-column findings','']+[f'- {x}' for x in wrong]+['']
          L+=['## Repeated-title differences','']
          if not inconsistent:L+=['None.','']
          for title,sigs in inconsistent:
              L.append(f'### {title}')
              for sig,locs in sigs.items():L.append(f'- `{ " | ".join(sig) }` — {", ".join(locs)}')
              L.append('')
          out.write_text('\n'.join(L),encoding='utf-8')
          print('\n'.join(L))
          PY
      - name: Commit evidence and self-remove
        run: |
          git config user.name westsidewatch
          git config user.email westsidewatchca@gmail.com
          git rm .github/workflows/one-gospel-harmony-consistency-20260829.yml
          git add docs/one/GOSPEL-HARMONY-CONSISTENCY-20260829.md
          git commit -m 'audit(one): compare Gospel harmony consistency'
          git push
