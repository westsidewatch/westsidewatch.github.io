name: 098 Dual Impression Folio
on:
  pull_request:
    paths:
      - 'static/experiments/096-editorial-composition/**'
      - 'static/experiments/scripture-studio-motherform-live.html'
      - 'static/church/visit/index.html'
      - 'tests/098-dual-impression-folio.cjs'
      - '.github/workflows/098-dual-impression-folio.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: npm install --no-save --no-package-lock playwright && npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 4173 --directory static >/tmp/folio098-http.log 2>&1 &
          node tests/098-dual-impression-folio.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dual-impression-folio
          path: artifacts/098/