name: Dawn Full Library Editorial Scan
on:
  workflow_dispatch:
  push:
    branches: [dawn/full-library-editorial-scan-v1]
    paths:
      - 'static/dawn-library/canonical/**'
      - 'scripts/dawn/full-library-editorial-scan.mjs'
      - 'docs/projects/dawn-library/EDITORIAL-PROJECTION-CANON.md'
      - 'docs/projects/dawn-library/DUAL-INDEX-CANON.md'
      - '.github/workflows/dawn-full-library-editorial-scan.yml'
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Scan canonical Works and build P2 gap map
        run: node scripts/dawn/full-library-editorial-scan.mjs
      - name: Validate complete canonical corpus
        run: node -e "const r=require('./static/dawn-library/editorial/canonical-scan-v2.json'); if(!r.integrity.countMatchesRoot) process.exit(1); console.log(r.scannedWorkCount+' canonical Works scanned; '+r.chinese.workCount+' Chinese Works; P2 gap map generated')"
      - uses: actions/upload-artifact@v4
        with:
          name: dawn-canonical-scan-v2
          path: static/dawn-library/editorial/canonical-scan-v2.json
