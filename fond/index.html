(async()=>{const host=document.getElementById('numberBook');try{const r=await fetch('./assets/fond-numerals-source.svg?v=20260926-inline-one-v1',{cache:'no-store'});if(!r.ok)throw Error(r.status);const d=new DOMParser().parseFromString(await r.text(),'image/svg+xml');const s=d.documentElement;s.id='fondNumerals';s.removeAttribute('width');s.removeAttribute('height');s.style.background='transparent';s.querySelectorAll('style').forEach(n=>n.remove());s.querySelectorAll(':scope > rect').forEach(n=>n.remove());s.querySelectorAll('.pair').forEach((g,i)=>{g.removeAttribute('style');g.dataset.book=['p01','p02','p03','p04'][i]});const p01=s.querySelector('.p01');const oldOne=p01?.querySelector('use:nth-of-type(2)');if(oldOne)oldOne.remove();if(p01){const one=d.createElementNS('http://www.w3.org/2000/svg','path');one.setAttribute('d','M37 139 L127 85 L162 49 L188 49 L188 432 L126 432 L126 112 L43 153 Z');one.setAttribute('transform','translate(208.9 206.2) scale(.517 .424)');one.setAttribute('fill','#252525');one.setAttribute('class','p01-trimmed-one');one.setAttribute('pointer-events','none');p01.appendChild(one)}host.replaceChildren(document.importNode(s,true));window.dispatchEvent(new Event('fond:numerals-ready'))}catch(e){console.error(e)}})();
