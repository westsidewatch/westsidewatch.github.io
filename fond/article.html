<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>池底 · 閱讀</title><link rel="stylesheet" href="./fond.css"><style>
.reader{--reader-edge:clamp(18px,2.8vw,84px);--canvas:clamp(720px,62vw,1500px);--measure:clamp(620px,43vw,1120px);--nav-size:clamp(11px,.62vw,18px);--kicker-size:clamp(10px,.58vw,17px);--title-size:clamp(30px,2.35vw,68px);--body-size:clamp(18px,1.08vw,31px);--h2-size:clamp(28px,1.72vw,48px);--h3-size:clamp(23px,1.38vw,39px);--space-sm:clamp(14px,1vw,30px);--space-md:clamp(24px,1.8vw,52px);min-height:100vh;padding:0 var(--reader-edge) clamp(96px,12vh,220px)}.reader-nav{position:fixed;z-index:8;top:clamp(16px,2.2vh,42px);left:var(--reader-edge);right:var(--reader-edge);display:flex;justify-content:space-between;gap:var(--space-sm);font:var(--nav-size)/1.2 Arial,"Noto Sans TC",sans-serif;letter-spacing:.1em}.opening{width:min(94vw,var(--canvas));min-height:clamp(300px,40svh,680px);margin:0 auto;display:grid;place-items:center;text-align:center;border-bottom:1px solid var(--line)}.opening-inner{width:min(100%,clamp(680px,55vw,1320px));padding-inline:var(--space-md)}.opening .kicker{font:var(--kicker-size)/1.3 Arial,"Noto Sans TC",sans-serif;letter-spacing:.15em;opacity:.46;margin-bottom:clamp(14px,1.2vw,32px)}.opening h1{font-family:"I.Ming","I.MingCP","PMingLiU","Noto Serif TC",serif;font-size:var(--title-size);line-height:1.2;font-weight:400;letter-spacing:.015em;margin:0;text-wrap:balance}.sheet{width:min(94vw,var(--canvas));margin:clamp(42px,6vh,110px) auto 0;display:block}.folio{font:var(--nav-size)/1.4 Arial,"Noto Sans TC",sans-serif;letter-spacing:.09em;opacity:.4;text-align:center;margin-bottom:clamp(34px,4.5vh,82px)}.prose{width:min(100%,var(--measure));margin:0 auto;font-family:"Source Han Serif TC","Noto Serif TC","Songti TC",serif;font-size:var(--body-size);line-height:1.88;letter-spacing:.018em}.prose>h1:first-child{display:none}.prose h1,.prose h2,.prose h3{font-family:"I.Ming","I.MingCP","PMingLiU","Noto Serif TC",serif;font-weight:400;text-wrap:balance}.prose h2{font-size:var(--h2-size);line-height:1.35;margin:clamp(64px,8vh,140px) 0 clamp(26px,3.2vh,56px);text-align:center}.prose h3{font-size:var(--h3-size);line-height:1.45;margin:clamp(52px,6.5vh,110px) 0 clamp(22px,2.8vh,46px);text-align:center}.prose p{margin:0 0 1.38em}.prose p.pause{font-size:clamp(20px,1.22vw,35px);line-height:1.75;margin:clamp(36px,4.8vh,78px) 0;text-align:center}.prose p.lede:first-of-type:first-letter{float:left;font-family:"I.Ming","I.MingCP","PMingLiU","Noto Serif TC",serif;font-size:4.1em;line-height:.82;padding:.08em .1em .02em 0}.prose blockquote{margin:clamp(40px,5vh,88px) 0;padding:clamp(22px,2.7vh,48px) clamp(18px,3vw,64px);border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:clamp(18px,1.08vw,31px);line-height:1.85}.prose hr{border:0;margin:clamp(54px,6.5vh,110px) 0;height:1px;background:var(--line)}.prose strong{font-weight:600}.prose em{font-family:Georgia,"Source Han Serif TC","Noto Serif TC",serif}.plate{margin:clamp(54px,6.5vh,110px) 0;padding:clamp(38px,4.5vh,82px) 0;border-block:1px solid var(--line);text-align:center;font:var(--nav-size) Arial,"Noto Sans TC",sans-serif;opacity:.4}.error{text-align:center;font:clamp(16px,.95vw,26px)/1.6 Arial,"Noto Sans TC",sans-serif;opacity:.6}.running{position:fixed;left:clamp(8px,.55vw,16px);top:50%;transform:rotate(-90deg) translateX(-50%);transform-origin:left top;font:clamp(9px,.48vw,14px) Arial,"Noto Sans TC",sans-serif;letter-spacing:.14em;opacity:.24}@media(max-width:760px){.reader{--reader-edge:clamp(16px,4.8vw,24px);--canvas:100%;--measure:100%;--nav-size:clamp(10px,3vw,12px);--kicker-size:clamp(10px,3vw,12px);--title-size:clamp(29px,8.7vw,42px);--body-size:clamp(18px,5vw,21px);--h2-size:clamp(27px,7.5vw,34px);--h3-size:clamp(22px,6.2vw,29px)}.opening{width:100%;min-height:clamp(280px,40svh,420px)}.opening-inner{padding-inline:clamp(8px,3vw,18px)}.sheet{width:100%;margin-top:clamp(34px,5vh,54px)}.prose{line-height:1.84;letter-spacing:.012em}.prose h2{margin-top:clamp(54px,8vh,84px)}.prose p.pause{font-size:clamp(19px,5.4vw,23px)}.prose blockquote{font-size:clamp(18px,5vw,21px);padding-inline:clamp(10px,4vw,22px)}.running{display:none}}
</style></head><body><main class="reader"><nav class="reader-nav"><a id="back" href="./">← 池底</a><span id="book"></span></nav><header class="opening"><div class="opening-inner"><div class="kicker" id="kicker"></div><h1 id="displayTitle"></h1></div></header><div class="sheet"><aside class="folio" id="folio"></aside><article class="prose" id="prose"><p class="error">讀取正文…</p></article></div></main><div class="running" id="running"></div><div class="quiet-mark" aria-hidden="true"><img class="logo-spin logo-light" src="./assets/Fondlogo-transparent.svg" alt=""></div><footer>池底設</footer><script>
const q=new URLSearchParams(location.search),src=q.get('src'),book=q.get('book')||'池底',key=q.get('key')||'kingdom-language';document.body.classList.add(`book-${key}`);document.querySelector('#book').textContent=book;kicker.textContent=book;running.textContent=`池底 / ${book}`;back.href=`./read.html?book=${key}`;
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function inline(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>').replace(/`(.+?)`/g,'<code>$1</code>')}
const editorial=/^(?:>\s*)?(?:保存狀態|保存状态|來源|来源|本文件|編輯(?:註|注|說明|说明|補錄|补录)|恢復(?:說明|说明|記錄|记录)|工作稿|恢復稿|恢复稿|研究稿|診斷稿|诊断稿|版本|canonical|authority|source\s*:|status\s*:)/i;
function readerText(text){return text.replace(/\r/g,'').split('\n').filter(line=>!editorial.test(line.trim())&&!/^<!--(?:.|\s)*-->$/.test(line.trim())).join('\n')}
function mdTitle(text){const m=text.match(/^#\s+(.+)$/m);return m?m[1].replace(/[*_`]/g,'').trim():''}
function md(text){const lines=text.split('\n'),out=[];let para=[],quote=[];const flush=()=>{if(para.length){const raw=para.join(' '),plain=raw.replace(/[*_`]/g,'');out.push(`<p${plain.length<34&&/[。！？；：]$/.test(plain)?' class="pause"':''}>${inline(raw)}</p>`);para=[]}if(quote.length){out.push(`<blockquote>${inline(quote.join(' '))}</blockquote>`);quote=[]}};for(const raw of lines){const s=raw.trim();if(!s){flush();continue}if(/^### /.test(s)){flush();out.push(`<h3>${inline(s.slice(4))}</h3>`)}else if(/^## /.test(s)){flush();out.push(`<h2>${inline(s.slice(3))}</h2>`)}else if(/^# /.test(s)){flush();out.push(`<h1>${inline(s.slice(2))}</h1>`)}else if(/^> ?/.test(s)){if(para.length)flush();quote.push(s.replace(/^> ?/,''))}else if(/^---+$/.test(s)){flush();out.push('<hr>')}else if(/^!\[/.test(s)){flush();out.push('<div class="plate">IMAGE</div>')}else if(/^[-*] /.test(s)){flush();out.push(`<p>— ${inline(s.slice(2))}</p>`)}else para.push(s)}flush();return out.join('')}
fetch(src,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status);return r.text()}).then(raw=>{const t=readerText(raw),title=mdTitle(t);displayTitle.textContent=title;folio.textContent=title;prose.innerHTML=md(t);const first=prose.querySelector('p:not(.pause)');if(first)first.classList.add('lede');document.title=title?`池底 · ${title}`:`池底 · ${book}`}).catch(e=>{prose.innerHTML=`<p class="error">正文載入失敗（${e.message}）</p>`});
</script></body></html>
