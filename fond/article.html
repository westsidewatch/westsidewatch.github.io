<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>池底 · 閱讀</title><link rel="stylesheet" href="./fond.css"><style>.reader{min-height:100vh;padding:5vh var(--edge) 18vh}.reader-nav{display:flex;justify-content:space-between;font:10px/1.2 Arial,sans-serif;letter-spacing:.16em}.opening{min-height:86svh;display:grid;grid-template-columns:1fr minmax(0,760px) 1fr;align-items:end;padding:12vh 0 9vh;border-bottom:1px solid var(--line)}.opening-inner{grid-column:2}.opening .kicker{font:10px/1.2 Arial,sans-serif;letter-spacing:.18em;opacity:.55}.opening h1{font-size:clamp(52px,8.6vw,126px);line-height:.98;font-weight:400;margin:.18em 0 0;letter-spacing:.005em}.sheet{max-width:1280px;margin:15vh auto 0;display:grid;grid-template-columns:minmax(90px,1fr) minmax(0,680px) minmax(120px,1fr);gap:clamp(28px,5vw,92px)}.folio{font:10px/1.4 Arial,sans-serif;letter-spacing:.13em;opacity:.45;position:sticky;top:5vh;height:max-content}.prose{grid-column:2;font-size:clamp(18px,1.42vw,22px);line-height:2.08;letter-spacing:.025em}.prose>h1:first-child{display:none}.prose h2{font-size:clamp(30px,4.2vw,58px);line-height:1.14;font-weight:400;margin:22vh -10vw 8vh;max-width:900px}.prose h3{font-size:clamp(21px,2.4vw,32px);font-weight:400;line-height:1.35;margin:14vh 0 5vh}.prose p{margin:0 0 1.42em}.prose p.pause{font-size:clamp(27px,3vw,43px);line-height:1.55;margin:14vh -7vw;text-align:center}.prose p.lede:first-of-type:first-letter{float:left;font-size:5.7em;line-height:.74;padding:.1em .11em .05em 0}.prose blockquote{margin:12vh -11vw;padding:0 0 0 3vw;border-left:1px solid var(--line);font-size:clamp(24px,2.8vw,40px);line-height:1.62}.prose strong{font-weight:600}.prose em{font-family:Georgia,serif}.prose hr{border:0;margin:18vh -12vw;height:1px;background:var(--line)}.prose code{font-size:.82em}.prose .plate{margin:16vh -18vw;min-height:54vh;border-top:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:11px;letter-spacing:.15em;opacity:.55}.running{position:fixed;left:12px;top:50%;transform:rotate(-90deg) translateX(-50%);transform-origin:left top;font:9px Arial,sans-serif;letter-spacing:.18em;opacity:.35}.error{font-size:12px;opacity:.6}@media(max-width:800px){.opening{grid-template-columns:1fr;min-height:72svh}.opening-inner{grid-column:1}.sheet{grid-template-columns:1fr;margin-top:10vh}.folio{position:static}.prose{grid-column:1}.prose h2,.prose blockquote,.prose hr,.prose p.pause{margin-left:0;margin-right:0}.running{display:none}}</style></head><body><main class="reader"><nav class="reader-nav"><a id="back" href="./">← FOND</a><span id="book"></span></nav><header class="opening"><div class="opening-inner"><div class="kicker" id="kicker"></div><h1 id="displayTitle"></h1></div></header><div class="sheet"><aside class="folio" id="folio"></aside><article class="prose" id="prose"><p class="error">讀取正文…</p></article></div></main><div class="running" id="running"></div><footer>© 2026 池底設</footer><script>
const q=new URLSearchParams(location.search),src=q.get('src'),label=q.get('title')||'',book=q.get('book')||'池底',key=q.get('key')||'kingdom-language';bookEl=document.querySelector('#book');bookEl.textContent=book;folio.textContent=label;displayTitle.textContent=label;kicker.textContent=`FOND · ${book}`;running.textContent=`池底 / ${book}`;back.href=`./read.html?book=${key}`;
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function inline(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>').replace(/`(.+?)`/g,'<code>$1</code>')}
function md(text){const lines=text.replace(/\r/g,'').split('\n'),out=[];let para=[],quote=[];const flush=()=>{if(para.length){const raw=para.join(' '),plain=raw.replace(/[*_`]/g,'');const cls=(plain.length<34&&/[。！？；：]$/.test(plain))?' class="pause"':'';out.push(`<p${cls}>${inline(raw)}</p>`);para=[]}if(quote.length){out.push(`<blockquote>${inline(quote.join(' '))}</blockquote>`);quote=[]}};for(const raw of lines){const s=raw.trim();if(!s){flush();continue}if(/^### /.test(s)){flush();out.push(`<h3>${inline(s.slice(4))}</h3>`)}else if(/^## /.test(s)){flush();out.push(`<h2>${inline(s.slice(3))}</h2>`)}else if(/^# /.test(s)){flush();out.push(`<h1>${inline(s.slice(2))}</h1>`)}else if(/^> ?/.test(s)){if(para.length)flush();quote.push(s.replace(/^> ?/,''))}else if(/^---+$/.test(s)){flush();out.push('<hr>')}else if(/^!\[/.test(s)){flush();out.push('<div class="plate">PLATE / IMAGE</div>')}else if(/^[-*] /.test(s)){flush();out.push(`<p>— ${inline(s.slice(2))}</p>`)}else para.push(s)}flush();return out.join('')}
if(!src){prose.innerHTML='<p class="error">沒有指定正文。</p>'}else fetch(src).then(r=>{if(!r.ok)throw Error(r.status);return r.text()}).then(t=>{prose.innerHTML=md(t);const first=prose.querySelector('p:not(.pause)');if(first)first.classList.add('lede');const sourceTitle=prose.querySelector('h1');if(sourceTitle&&(!label||label==='連載')){displayTitle.textContent=sourceTitle.textContent;folio.textContent=sourceTitle.textContent}document.title=`池底 · ${displayTitle.textContent}`}).catch(()=>prose.innerHTML='<p class="error">正文暫時無法載入。</p>');
</script></body></html>
