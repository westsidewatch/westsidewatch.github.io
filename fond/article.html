<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>池底 · 閱讀</title><link rel="stylesheet" href="./fond.css"><style>
.reader{--reader-canvas:clamp(760px,72vw,1760px);--reader-measure:clamp(680px,48vw,1280px);--reader-title:clamp(34px,1.5vw + .75rem,76px);--reader-body:clamp(19px,.62vw + .62rem,34px);--reader-h2:clamp(29px,1vw + .72rem,52px);--reader-h3:clamp(24px,.78vw + .68rem,42px);min-height:100vh;padding:0 var(--ui-edge) clamp(96px,12vh,220px)}.reader-nav{position:fixed;z-index:8;top:clamp(16px,2.2vh,42px);left:var(--ui-edge);right:var(--ui-edge);min-height:var(--ui-control);display:flex;align-items:center;justify-content:space-between;gap:var(--ui-space-2);font:var(--ui-sm)/1.2 Arial,"Noto Sans TC",sans-serif;letter-spacing:.1em}.opening{width:min(94vw,var(--reader-canvas));min-height:clamp(300px,40svh,680px);margin:0 auto;display:grid;place-items:center;text-align:center;border-bottom:1px solid var(--line)}.opening-inner{width:min(100%,clamp(680px,58vw,1420px));padding-inline:var(--ui-space-4)}.opening .kicker{font:var(--ui-sm)/1.3 Arial,"Noto Sans TC",sans-serif;letter-spacing:.15em;opacity:.46;margin-bottom:var(--ui-space-3)}.opening h1{font-family:"I.Ming","I.MingCP","PMingLiU","Noto Serif TC",serif;font-size:var(--reader-title);line-height:1.2;font-weight:400;letter-spacing:.015em;margin:0;text-wrap:balance}.sheet{width:min(94vw,var(--reader-canvas));margin:clamp(42px,6vh,110px) auto 0;display:block}.folio{font:var(--ui-sm)/1.4 Arial,"Noto Sans TC",sans-serif;letter-spacing:.09em;opacity:.4;text-align:center;margin-bottom:clamp(34px,4.5vh,82px)}.prose{width:min(100%,var(--reader-measure));margin:0 auto;font-family:"Source Han Serif TC","Noto Serif TC","Songti TC",serif;font-size:var(--reader-body);line-height:1.88;letter-spacing:.018em}.prose>h1:first-child{display:none}.prose h1,.prose h2,.prose h3{font-family:"I.Ming","I.MingCP","PMingLiU","Noto Serif TC",serif;font-weight:400;text-wrap:balance;scroll-margin-top:clamp(72px,9vh,120px)}.prose h2{font-size:var(--reader-h2);line-height:1.35;margin:clamp(64px,8vh,140px) 0 clamp(26px,3.2vh,56px);text-align:center}.prose h3{font-size:var(--reader-h3);line-height:1.45;margin:clamp(52px,6.5vh,110px) 0 clamp(22px,2.8vh,46px);text-align:center}.prose p{margin:0 0 1.38em;text-align:left}.prose p.lede:first-of-type:first-letter{float:left;font-family:"I.Ming","I.MingCP","PMingLiU","Noto Serif TC",serif;font-size:4.1em;line-height:.82;padding:.08em .1em .02em 0}.prose blockquote{margin:clamp(40px,5vh,88px) 0;padding:clamp(22px,2.7vh,48px) var(--ui-space-4);border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:var(--reader-body);line-height:1.85}.prose hr{border:0;margin:clamp(54px,6.5vh,110px) 0;height:1px;background:var(--line)}.prose strong{font-weight:600}.prose em{font-family:Georgia,"Source Han Serif TC","Noto Serif TC",serif}.plate{margin:clamp(54px,6.5vh,110px) 0;padding:clamp(38px,4.5vh,82px) 0;border-block:1px solid var(--line);text-align:center;font:var(--ui-sm) Arial,"Noto Sans TC",sans-serif;opacity:.4}.error{text-align:center;font:var(--ui-md)/1.6 Arial,"Noto Sans TC",sans-serif;opacity:.6}.running{position:fixed;left:clamp(8px,.55vw,16px);top:50%;transform:rotate(-90deg) translateX(-50%);transform-origin:left top;font:var(--ui-xs) Arial,"Noto Sans TC",sans-serif;letter-spacing:.14em;opacity:.24}@media(min-width:1800px){.reader{--reader-measure:clamp(820px,50vw,1420px);--reader-body:clamp(22px,.54vw + .75rem,36px)}}@media(min-width:2800px){.reader{--reader-canvas:clamp(1700px,66vw,2400px);--reader-measure:clamp(1180px,46vw,1720px);--reader-title:clamp(52px,1.35vw + .8rem,86px);--reader-body:clamp(26px,.48vw + .8rem,40px);--reader-h2:clamp(38px,.78vw + .9rem,58px);--reader-h3:clamp(31px,.6vw + .85rem,47px)}}@media(max-width:760px){.reader{--reader-canvas:100%;--reader-measure:100%;--reader-title:clamp(29px,8.7vw,42px);--reader-body:clamp(18px,5vw,21px);--reader-h2:clamp(27px,7.5vw,34px);--reader-h3:clamp(22px,6.2vw,29px);padding-inline:var(--ui-edge)}.opening{width:100%;min-height:clamp(280px,40svh,420px)}.opening-inner{padding-inline:var(--ui-space-2)}.sheet{width:100%;margin-top:clamp(34px,5vh,54px)}.prose{line-height:1.84;letter-spacing:.012em}.prose h2{margin-top:clamp(54px,8vh,84px)}.prose blockquote{font-size:var(--reader-body);padding-inline:var(--ui-space-2)}.running{display:none}}
</style></head><body><main class="reader"><nav class="reader-nav"><a id="back" href="./">← 池底</a><span id="book"></span></nav><header class="opening"><div class="opening-inner"><div class="kicker" id="kicker"></div><h1 id="displayTitle"></h1></div></header><div class="sheet"><aside class="folio" id="folio"></aside><article class="prose" id="prose"><p class="error">讀取正文…</p></article></div></main><div class="running" id="running"></div><div class="quiet-mark" aria-hidden="true"><img class="logo-spin logo-light" src="./assets/Fondlogo-transparent.svg" alt=""></div><footer>池底設</footer><script>
const q=new URLSearchParams(location.search),src=q.get('src'),book=q.get('book')||'池底',key=q.get('key')||'kingdom-language',bridgeKey=`fond:${key}:${src||''}`;let lastHash='',remoteTimer=null,remoteBusy=false,remoteHash='',lastGoodText='';document.body.classList.add(`book-${key}`);document.querySelector('#book').textContent=book;kicker.textContent=book;running.textContent=`池底 / ${book}`;back.href=`./read.html?book=${key}`;
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function inline(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>').replace(/`(.+?)`/g,'<code>$1</code>')}function localSlug(text){return String(text||'').replace(/[*_`~[\]()]/g,'').trim().toLowerCase().replace(/\s+/g,'-').replace(/[^\p{L}\p{N}\-]+/gu,'').replace(/-+/g,'-')}
const editorial=/^(?:>\s*)?(?:保存狀態|保存状态|來源|来源|本文件|編輯(?:註|注|說明|说明|補錄|补录)|恢復(?:說明|说明|記錄|记录)|工作稿|恢復稿|恢复稿|研究稿|診斷稿|诊断稿|版本|canonical|authority|source\s*:|status\s*:)/i;
function readerText(text){return text.replace(/\r/g,'').split('\n').filter(line=>!editorial.test(line.trim())&&!/^<!--(?:.|\s)*-->$/.test(line.trim())).join('\n')}function mdTitle(text){const m=text.match(/^#\s+(.+)$/m);return m?m[1].replace(/[*_`]/g,'').trim():''}function headingSlug(v){return window.ManuscriptBridge?window.ManuscriptBridge.slug(v):localSlug(v)}
function md(text){const lines=text.split('\n'),out=[];let para=[],quote=[];const flush=()=>{if(para.length){out.push(`<p>${inline(para.join(' '))}</p>`);para=[]}if(quote.length){out.push(`<blockquote>${inline(quote.join(' '))}</blockquote>`);quote=[]}};for(const raw of lines){const s=raw.trim();if(!s){flush();continue}if(/^### /.test(s)){flush();const v=s.slice(4);out.push(`<h3 id="${headingSlug(v)}">${inline(v)}</h3>`)}else if(/^## /.test(s)){flush();const v=s.slice(3);out.push(`<h2 id="${headingSlug(v)}">${inline(v)}</h2>`)}else if(/^# /.test(s)){flush();const v=s.slice(2);out.push(`<h1 id="${headingSlug(v)}">${inline(v)}</h1>`)}else if(/^> ?/.test(s)){if(para.length)flush();quote.push(s.replace(/^> ?/,''))}else if(/^---+$/.test(s)){flush();out.push('<hr>')}else if(/^!\[/.test(s)){flush();out.push('<div class="plate">IMAGE</div>')}else if(/^[-*] /.test(s)){flush();out.push(`<p>— ${inline(s.slice(2))}</p>`)}else para.push(s)}flush();return out.join('')}
function render(raw,hs=[],live=false){if(!raw)return;lastGoodText=raw;const h=window.ManuscriptBridge?window.ManuscriptBridge.hash(raw):String(raw.length);if(h===lastHash)return;const anchor=window.ManuscriptBridge?.nearestHeading?.(prose),y=scrollY;lastHash=h;const t=readerText(raw),title=mdTitle(t);displayTitle.textContent=title;folio.textContent=title;prose.innerHTML=md(t);const first=prose.querySelector('p');if(first)first.classList.add('lede');document.title=title?`池底 · ${title}`:`池底 · ${book}`;requestAnimationFrame(()=>{if(anchor){const target=[...prose.querySelectorAll('h1,h2,h3')].find(el=>el.id===anchor.id||el.textContent.trim()===anchor.title);if(target)target.scrollIntoView({block:'start'});else scrollTo(0,y)}else scrollTo(0,y)});window.dispatchEvent(new CustomEvent('manuscript:ready',{detail:{key,src,headings:hs,live}}))}
async function fetchRemote(){const u=new URL(src,location.href);u.searchParams.set('_live',Date.now().toString(36));const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw Error(`Manuscript remote read failed (${r.status})`);return r.text()}
async function pollRemote(){if(remoteBusy||document.hidden||!src)return;remoteBusy=true;try{const text=await fetchRemote(),h=window.ManuscriptBridge?window.ManuscriptBridge.hash(text):String(text.length);if(h!==remoteHash){remoteHash=h;if(window.ManuscriptBridge){const synced=window.ManuscriptBridge.syncFromGit(src,text,{remote:true});if(!synced?.conflict)render(text,synced.headings||[],true)}else render(text,[],true)}}catch(e){console.debug('[Fond remote sync]',e.message)}finally{remoteBusy=false}}
function startRemote(){clearInterval(remoteTimer);pollRemote();remoteTimer=setInterval(pollRemote,2000)}
async function loadManuscript(){try{if(window.ManuscriptBridge){try{const result=await window.ManuscriptBridge.read(src,{fresh:true,preferLive:false});remoteHash=result.hash;render(result.text,result.headings,result.live)}catch(e){const cached=window.ManuscriptBridge.get(src);if(cached?.text)render(cached.text,cached.headings||[],true);else throw e}window.ManuscriptBridge.subscribe(src,s=>render(s.text,s.headings,true),{immediate:false});window.FondManuscriptWriter=window.ManuscriptBridge.writer(src,{writer:'fond'});window.ManuscriptBridge.startBus?.();startRemote();return}render(await fetchRemote(),[],false);startRemote()}catch(e){if(lastGoodText)render(lastGoodText,[],true);else prose.innerHTML=`<p class="error">正文暫時無法連線，正在重試。</p>`;startRemote()}}
function loadBridge(){return new Promise(resolve=>{if(window.ManuscriptBridge?.version==='2.2.0')return resolve(true);const s=document.createElement('script');s.src='../assets/js/manuscript-bridge.js?v=2.2.0';s.onload=()=>resolve(!!window.ManuscriptBridge);s.onerror=()=>resolve(false);document.head.appendChild(s)})}
document.addEventListener('visibilitychange',()=>{if(!document.hidden){window.ManuscriptBridge?.pollBus?.();pollRemote()}});addEventListener('focus',()=>{window.ManuscriptBridge?.pollBus?.();pollRemote()});addEventListener('online',()=>{window.ManuscriptBridge?.pollBus?.();pollRemote()});addEventListener('pagehide',()=>{clearInterval(remoteTimer);window.ManuscriptBridge?.rememberAnchor(bridgeKey,prose)});addEventListener('beforeunload',()=>window.ManuscriptBridge?.rememberAnchor(bridgeKey,prose));loadBridge().then(loadManuscript);
</script></body></html>
