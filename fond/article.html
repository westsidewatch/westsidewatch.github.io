<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>池底 · 閱讀</title><link rel="stylesheet" href="./fond.css"><style>.reader{min-height:100vh;padding:5vh var(--edge) 18vh}.reader-nav{display:flex;justify-content:space-between;font:10px/1.2 Arial,sans-serif;letter-spacing:.16em}.sheet{max-width:1240px;margin:16vh auto 0;display:grid;grid-template-columns:minmax(80px,1fr) minmax(0,680px) minmax(80px,1fr);gap:clamp(24px,5vw,90px)}.folio{font:10px/1.2 Arial,sans-serif;letter-spacing:.14em;opacity:.48;position:sticky;top:5vh;height:max-content}.prose{grid-column:2;font-size:clamp(18px,1.45vw,22px);line-height:2.05;letter-spacing:.025em}.prose h1{font-size:clamp(44px,7vw,92px);line-height:1.06;font-weight:400;letter-spacing:.01em;margin:0 0 18vh}.prose h2{font-size:clamp(28px,4vw,52px);line-height:1.18;font-weight:400;margin:15vh 0 7vh}.prose h3{font-size:clamp(20px,2.3vw,30px);font-weight:400;margin:10vh 0 4vh}.prose p{margin:0 0 1.35em}.prose blockquote{margin:8vh -8vw;padding:0 0 0 3vw;border-left:1px solid var(--line);font-size:clamp(22px,2.6vw,36px);line-height:1.65}.prose strong{font-weight:600}.prose em{font-family:Georgia,serif}.prose hr{border:0;border-top:1px solid var(--line);margin:12vh 0}.error{font-size:12px;opacity:.6}@media(max-width:800px){.sheet{grid-template-columns:1fr;margin-top:12vh}.folio{position:static}.prose{grid-column:1}.prose blockquote{margin:7vh 0;padding-left:22px}}</style></head><body><main class="reader"><nav class="reader-nav"><a id="back" href="./">← FOND</a><span id="book"></span></nav><div class="sheet"><aside class="folio" id="folio"></aside><article class="prose" id="prose"><p class="error">讀取正文…</p></article></div></main><footer>© 2026 池底設</footer><script>
const q=new URLSearchParams(location.search),src=q.get('src'),label=q.get('title')||'',book=q.get('book')||'池底';document.querySelector('#book').textContent=book;document.querySelector('#folio').textContent=label;document.querySelector('#back').href=`./read.html?book=${q.get('key')||'kingdom-language'}`;
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function inline(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>').replace(/`(.+?)`/g,'<code>$1</code>')}
function md(text){const lines=text.replace(/\r/g,'').split('\n'),out=[];let para=[],quote=[];const flush=()=>{if(para.length){out.push(`<p>${inline(para.join(' '))}</p>`);para=[]}if(quote.length){out.push(`<blockquote>${inline(quote.join(' '))}</blockquote>`);quote=[]}};for(const raw of lines){const s=raw.trim();if(!s){flush();continue}if(/^### /.test(s)){flush();out.push(`<h3>${inline(s.slice(4))}</h3>`)}else if(/^## /.test(s)){flush();out.push(`<h2>${inline(s.slice(3))}</h2>`)}else if(/^# /.test(s)){flush();out.push(`<h1>${inline(s.slice(2))}</h1>`)}else if(/^> ?/.test(s)){if(para.length)flush();quote.push(s.replace(/^> ?/,''))}else if(/^---+$/.test(s)){flush();out.push('<hr>')}else if(/^[-*] /.test(s)){flush();out.push(`<p>— ${inline(s.slice(2))}</p>`)}else para.push(s)}flush();return out.join('')}
if(!src){prose.innerHTML='<p class="error">沒有指定正文。</p>'}else fetch(src).then(r=>{if(!r.ok)throw Error(r.status);return r.text()}).then(t=>{prose.innerHTML=md(t);const h=prose.querySelector('h1,h2');if(h)document.title=`池底 · ${h.textContent}`}).catch(()=>prose.innerHTML='<p class="error">正文暫時無法載入。</p>');
</script></body></html>
