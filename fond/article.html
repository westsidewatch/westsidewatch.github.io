<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>池底 · 閱讀</title><link rel="stylesheet" href="./fond.css"><style>
.reader{min-height:100vh;padding:0 var(--edge) 18vh}.reader-nav{position:fixed;z-index:8;top:clamp(20px,2.5vh,36px);left:var(--edge);right:var(--edge);display:flex;justify-content:space-between;font:14px/1.2 Arial,"Noto Sans TC",sans-serif;letter-spacing:.1em}.opening{width:min(90vw,1180px);min-height:42svh;margin:0 auto;display:flex;align-items:center;justify-content:center;text-align:center;border-bottom:1px solid var(--line)}.opening-inner{width:100%;max-width:1040px}.opening .kicker{font:14px Arial,"Noto Sans TC",sans-serif;letter-spacing:.15em;opacity:.46;margin-bottom:24px}.opening h1{font-family:"I.Ming","I.MingCP","PMingLiU","Noto Serif TC",serif;font-size:clamp(52px,5vw,82px);line-height:1.18;font-weight:400;margin:0}.sheet{width:min(90vw,1180px);margin:7vh auto 0;display:block}.folio{font:14px/1.4 Arial,"Noto Sans TC",sans-serif;letter-spacing:.09em;opacity:.4;text-align:center;margin-bottom:6vh}.prose{width:min(100%,980px);margin:0 auto;font-family:"Source Han Serif TC","Noto Serif TC","Songti TC",serif;font-size:clamp(26px,1.65vw,30px);line-height:1.85;letter-spacing:.018em}.prose>h1:first-child{display:none}.prose h1,.prose h2,.prose h3{font-family:"I.Ming","I.MingCP","PMingLiU","Noto Serif TC",serif;font-weight:400}.prose h2{font-size:clamp(40px,3.2vw,54px);line-height:1.3;margin:10vh 0 4vh;text-align:center}.prose h3{font-size:clamp(31px,2.4vw,40px);line-height:1.45;margin:8vh 0 3vh;text-align:center}.prose p{margin:0 0 1.38em}.prose p.pause{font-size:clamp(28px,1.9vw,34px);line-height:1.7;margin:6vh 0;text-align:center}.prose p.lede:first-of-type:first-letter{float:left;font-family:"I.Ming","I.MingCP","PMingLiU","Noto Serif TC",serif;font-size:4.1em;line-height:.82;padding:.08em .1em .02em 0}.prose blockquote{margin:6vh 0;padding:3vh 5%;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:clamp(26px,1.7vw,31px);line-height:1.8}.prose hr{border:0;margin:8vh 0;height:1px;background:var(--line)}.prose strong{font-weight:600}.prose em{font-family:Georgia,"Source Han Serif TC","Noto Serif TC",serif}.plate{margin:8vh 0;padding:6vh 0;border-block:1px solid var(--line);text-align:center;font:14px Arial,"Noto Sans TC",sans-serif;opacity:.4}.error{text-align:center;font:20px/1.6 Arial,"Noto Sans TC",sans-serif;opacity:.6}.running{position:fixed;left:10px;top:50%;transform:rotate(-90deg) translateX(-50%);transform-origin:left top;font:11px Arial,"Noto Sans TC",sans-serif;letter-spacing:.14em;opacity:.24}@media(max-width:760px){.reader{padding-inline:18px}.reader-nav{left:18px;right:18px;font-size:12px}.opening{width:94vw;min-height:42svh}.opening .kicker{font-size:12px}.opening h1{font-size:clamp(42px,11vw,58px)}.sheet{width:94vw;margin-top:5vh}.folio{margin-bottom:4vh;font-size:12px}.prose{width:100%;font-size:clamp(21px,5.7vw,24px);line-height:1.82;letter-spacing:.012em}.prose h2{font-size:clamp(32px,8.6vw,42px)}.prose h3{font-size:clamp(26px,7vw,34px)}.prose p.pause{font-size:clamp(23px,6.1vw,28px)}.prose blockquote{font-size:clamp(21px,5.7vw,25px)}.running{display:none}}
</style></head><body><main class="reader"><nav class="reader-nav"><a id="back" href="./">← 池底</a><span id="book"></span></nav><header class="opening"><div class="opening-inner"><div class="kicker" id="kicker"></div><h1 id="displayTitle"></h1></div></header><div class="sheet"><aside class="folio" id="folio"></aside><article class="prose" id="prose"><p class="error">讀取正文…</p></article></div></main><div class="running" id="running"></div><div class="quiet-mark" aria-hidden="true"><img class="logo-spin logo-light" src="./assets/Fondlogo-transparent.svg" alt=""></div><footer>池底設</footer><script>
const q=new URLSearchParams(location.search),src=q.get('src'),book=q.get('book')||'池底',key=q.get('key')||'kingdom-language';document.body.classList.add(`book-${key}`);document.querySelector('#book').textContent=book;kicker.textContent=book;running.textContent=`池底 / ${book}`;back.href=`./read.html?book=${key}`;
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function inline(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>').replace(/`(.+?)`/g,'<code>$1</code>')}
const editorial=/^(?:>\s*)?(?:保存狀態|保存状态|來源|来源|本文件|編輯(?:註|注|說明|说明|補錄|补录)|恢復(?:說明|说明|記錄|记录)|工作稿|恢復稿|恢复稿|研究稿|診斷稿|诊断稿|版本|canonical|authority|source\s*:|status\s*:)/i;
function readerText(text){return text.replace(/\r/g,'').split('\n').filter(line=>!editorial.test(line.trim())&&!/^<!--(?:.|\s)*-->$/.test(line.trim())).join('\n')}
function mdTitle(text){const m=text.match(/^#\s+(.+)$/m);return m?m[1].replace(/[*_`]/g,'').trim():''}
function md(text){const lines=text.split('\n'),out=[];let para=[],quote=[];const flush=()=>{if(para.length){const raw=para.join(' '),plain=raw.replace(/[*_`]/g,'');out.push(`<p${plain.length<34&&/[。！？；：]$/.test(plain)?' class="pause"':''}>${inline(raw)}</p>`);para=[]}if(quote.length){out.push(`<blockquote>${inline(quote.join(' '))}</blockquote>`);quote=[]}};for(const raw of lines){const s=raw.trim();if(!s){flush();continue}if(/^### /.test(s)){flush();out.push(`<h3>${inline(s.slice(4))}</h3>`)}else if(/^## /.test(s)){flush();out.push(`<h2>${inline(s.slice(3))}</h2>`)}else if(/^# /.test(s)){flush();out.push(`<h1>${inline(s.slice(2))}</h1>`)}else if(/^> ?/.test(s)){if(para.length)flush();quote.push(s.replace(/^> ?/,''))}else if(/^---+$/.test(s)){flush();out.push('<hr>')}else if(/^!\[/.test(s)){flush();out.push('<div class="plate">IMAGE</div>')}else if(/^[-*] /.test(s)){flush();out.push(`<p>— ${inline(s.slice(2))}</p>`)}else para.push(s)}flush();return out.join('')}
fetch(src,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status);return r.text()}).then(raw=>{const t=readerText(raw),title=mdTitle(t);displayTitle.textContent=title;folio.textContent=title;prose.innerHTML=md(t);const first=prose.querySelector('p:not(.pause)');if(first)first.classList.add('lede');document.title=title?`池底 · ${title}`:`池底 · ${book}`}).catch(e=>{prose.innerHTML=`<p class="error">正文載入失敗（${e.message}）</p>`});
</script></body></html>
