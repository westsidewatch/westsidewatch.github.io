<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>池底｜01 Flip</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#f4f2eb;color:#242423;overflow:hidden}.stage{position:relative;width:100vw;height:100vh;perspective:1800px}.sheet{position:absolute;left:15vw;top:5vh;width:48vw;height:88vh;transform-origin:0 50%;transform-style:preserve-3d;transition:transform 900ms cubic-bezier(.2,.7,.16,1);pointer-events:none}.sheet.open{transform:rotateY(-62deg)}.n{position:absolute;font-family:Didot,"Bodoni 72","Bodoni MT","Times New Roman",serif;line-height:.72}.zero{left:0;top:36%;font-size:min(40vw,610px);transform:scaleX(.78);transform-origin:left center}.one{left:20%;top:2%;font-size:min(37vw,565px);font-weight:600;transform:scaleX(.62);transform-origin:left top}.hit{position:absolute;left:14vw;top:4vh;width:31vw;height:90vh;z-index:5;cursor:pointer}.note{position:fixed;right:18px;bottom:18px;font:10px/1 Helvetica,Arial,sans-serif;letter-spacing:.16em;opacity:.28}@media(max-width:700px){.sheet{left:9vw;top:9vh;width:70vw;height:78vh}.zero{top:38%;font-size:72vw}.one{left:22%;font-size:68vw}.hit{left:7vw;top:7vh;width:48vw;height:82vh}}</style></head><body><main class="stage"><div class="sheet" id="p01"><span class="n one">1</span><span class="n zero">0</span></div><div class="hit" id="hit" aria-label="01"></div></main><div class="note">01 · PAGE STUDY</div><script>const p=document.getElementById('p01'),h=document.getElementById('hit');h.addEventListener('pointerenter',()=>p.classList.add('open'));h.addEventListener('pointerleave',()=>p.classList.remove('open'));</script><!-- deploy retrigger: 2026-09-25 --></body></html>
