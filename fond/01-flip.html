<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>池底｜01 02 03 04 Opening Type</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#faf8f2}
.stage{position:relative;width:100vw;height:100vh;display:grid;place-items:center}
#numerals{height:min(100vh,841.8898px);width:auto;max-width:100vw;display:block;overflow:visible}
#numerals .pair{fill:#252525;transform-box:fill-box;transform-origin:left center;backface-visibility:hidden;transition:transform 900ms cubic-bezier(.16,.74,.14,1),filter 900ms ease;cursor:pointer;will-change:transform}
#numerals .pair:hover{transform:perspective(900px) rotateY(-88deg);filter:drop-shadow(10px 5px 8px rgba(37,37,37,.08))}
@media(prefers-reduced-motion:reduce){#numerals .pair{transition:none}}
</style>
</head>
<body>
<main class="stage" id="stage" aria-label="01 02 03 04 interactive opening type"></main>
<script>
(async()=>{
  const stage=document.getElementById('stage');
  try{
    const r=await fetch('./assets/fond-numerals-source.svg?v=20260926-inline-hover',{cache:'no-store'});
    if(!r.ok) throw new Error('SVG '+r.status);
    const text=await r.text();
    const doc=new DOMParser().parseFromString(text,'image/svg+xml');
    const svg=doc.documentElement;
    svg.id='numerals';
    svg.removeAttribute('width');
    svg.removeAttribute('height');
    svg.querySelectorAll('style').forEach(el=>el.remove());
    svg.querySelectorAll('.pair').forEach(pair=>pair.removeAttribute('style'));
    stage.replaceChildren(document.importNode(svg,true));
  }catch(e){
    console.error(e);
  }
})();
</script>
</body>
</html>
