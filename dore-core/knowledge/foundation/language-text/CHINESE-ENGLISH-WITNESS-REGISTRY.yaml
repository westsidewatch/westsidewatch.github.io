completion_gate:
  requires:
    - every baseline witness has a sourced version dossier
    - every baseline witness has a verified lawful access policy
    - every local_corpus witness passes canonical coverage validation
    - every licensed_api/external_reader witness has a tested canonical-reference route
    - comparison benchmarks span Chinese, English, and original-language evidence
  on_pass: BIBLICAL_CORPUS_READING_COMPLETE
  current_state: open
  notes: English baseline is verified complete; broader Chinese baseline and comparison requirements remain open.
