schema: dore.witness-registry.v1
status: ACTIVE
selection_rule: >-
  Include mainstream circulating witnesses and versions a researcher of Doré's
  intended identity must know. Do not optimize for a predetermined count.
  Additional/specialized witnesses become research_on_demand after baseline completion.

