training_notes:
  - Abram and Abraham are modeled as one entity because Genesis explicitly records the renaming.
  - Sarai and Sarah are modeled as one entity for the same reason.
  - Jacob and Israel are modeled as one entity because the text explicitly supplies the new name.
  - No geographic coordinates are supplied: coordinates would be scholarly metadata requiring separate provenance.
  - The fixture intentionally begins small; graph expansion must preserve evidence per edge.
