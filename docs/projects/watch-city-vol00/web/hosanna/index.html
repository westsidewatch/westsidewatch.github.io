<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>守望，一座光明的城 · Vol.00</title>
<meta name="description" content="和散那。王進城了。">
<link rel="stylesheet" href="./hosanna.css">
</head>
<body>
<main class="hosanna" data-state="approach" aria-label="守望，一座光明的城 Vol.00">
  <div class="stage" aria-hidden="true">
    <div class="master" data-master>
      <div class="master-fallback"></div>
    </div>
    <div class="montage" data-montage></div>
    <div class="grain"></div>
    <div class="vignette"></div>
  </div>

  <header class="issue-mark">
    <span>WESTSIDE WATCH</span><span>VOL.00</span>
  </header>

  <section class="arrival" aria-live="polite">
    <p class="hosanna-word" data-hosanna>和散那。</p>
    <h1 data-king>王進城了。</h1>
  </section>

  <button class="enter" type="button" data-enter aria-label="進入本期">
    <span>入城</span><i aria-hidden="true"></i>
  </button>

  <p class="sound-note" data-sound-note>點擊開啟聲音</p>

  <section class="city-entry" data-city-entry aria-hidden="true">
    <div class="gate-leaf gate-leaf-left"></div><div class="gate-leaf gate-leaf-right"></div>
    <div class="threshold-line"></div>
    <div class="city-depth">
      <p class="city-name">JERUSALEM</p>
      <div class="strata" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
      <h2>一萬年的建城禮</h2>
      <p class="depth-note">向下，是城的時間。</p>
    </div>
  </section>
</main>

<script type="module" src="./hosanna.js"></script>
</body>
</html>
