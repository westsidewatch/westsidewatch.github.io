<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DORÉ FILM · Camera Motion Lab 01</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080808;color:#ddd;font:12px system-ui,-apple-system,sans-serif}canvas{display:block;width:100%;height:100%}.hud{position:fixed;left:18px;top:16px;z-index:5;pointer-events:none;text-shadow:0 1px 10px #000}.hud b{letter-spacing:.16em}.hud div{margin-top:5px;color:#999}.hud .bridge{color:#cebd74}.legend{position:fixed;right:18px;top:16px;text-align:right;color:#777;z-index:5;pointer-events:none}.controls{position:fixed;left:18px;right:18px;bottom:18px;z-index:6;display:grid;grid-template-columns:auto auto auto auto 1fr auto;gap:8px;align-items:center;padding:10px 12px;background:rgba(8,8,8,.78);border:1px solid #2c2c2c;backdrop-filter:blur(10px)}button{background:#141414;color:#bbb;border:1px solid #343434;padding:7px 10px;cursor:pointer}button.active{border-color:#cebd74;color:#eadfae}input[type=range]{width:100%;accent-color:#cebd74}.time{min-width:78px;text-align:right;color:#888;font-variant-numeric:tabular-nums}.progress{position:fixed;left:0;bottom:0;height:2px;background:#cebd74;width:0;z-index:8}.splitLabel{position:fixed;display:none;top:50%;right:18px;z-index:5;transform:translateY(-50%);color:#666;writing-mode:vertical-rl;letter-spacing:.12em;pointer-events:none}.help{position:fixed;right:18px;bottom:72px;color:#555;z-index:5;pointer-events:none}@media(max-width:760px){.controls{grid-template-columns:repeat(4,auto);left:8px;right:8px;bottom:8px}.controls input{grid-column:1/-2}.time{grid-column:-2/-1}.help{display:none}.legend{top:auto;bottom:118px}}
</style>
</head><body>
<div class="hud"><b>CAMERA MOTION LAB · 01</b><div id="beat">P001 · Abraham enters journey</div><div id="grammar">TARR-01</div><div id="bridge" class="bridge"></div></div>
<div class="legend">ONE CAMERA · ZERO CUTS<br>ABRAHAM → ISAAC → JACOB</div>
<div class="splitLabel" id="splitLabel">CAMERA VIEW ← → PATH VIEW</div>
<div class="help">SPACE play/pause · ← → scrub · 1 camera · 2 top · 3 split</div>
<div class="controls">
  <button id="play">PAUSE</button>
  <button id="cameraBtn" class="active">CAMERA</button>
  <button id="topBtn">TOP</button>
  <button id="splitBtn">SPLIT</button>
  <input id="scrub" type="range" min="0" max="1000" value="0" step="1" aria-label="Camera path position">
  <span class="time" id="time">00:00 / 00:52</span>
</div>
<div class="progress" id="progress"></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

const data=await fetch('./camera-spine-experiment-01.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('camera-spine JSON '+r.status);return r.json()});
const DURATION=52;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x080808);
scene.fog=new THREE.FogExp2(0x080808,.012);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.setScissorTest(false);document.body.prepend(renderer.domElement);

const pts=data.nodes.map(n=>new THREE.Vector3(...n.p));
const lookPts=data.nodes.map(n=>new THREE.Vector3(...n.look));
const curve=new THREE.CatmullRomCurve3(pts,false,'centripetal',.5);
const lookCurve=new THREE.CatmullRomCurve3(lookPts,false,'centripetal',.5);
const sampled=curve.getPoints(900);
scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(sampled),new THREE.LineBasicMaterial({color:0xcebd74,transparent:true,opacity:.5})));

const ground=new THREE.GridHelper(180,90,0x242424,0x151515);ground.position.set(30,0,-58);scene.add(ground);
const nodeGroup=new THREE.Group();scene.add(nodeGroup);
const nodeMeshes=[];
for(const [i,n] of data.nodes.entries()){
  const s=new THREE.Mesh(new THREE.SphereGeometry(.24,14,10),new THREE.MeshBasicMaterial({color:n.timeBridge?0xcebd74:0xd8d8d8}));
  s.position.set(...n.p);s.userData.index=i;nodeGroup.add(s);nodeMeshes.push(s);
  const stem=new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(n.p[0],0,n.p[2]),new THREE.Vector3(...n.p)]),new THREE.LineBasicMaterial({color:0x333333,transparent:true,opacity:.5}));scene.add(stem);
}

// Three neutral generation proxies only. They are spatial markers, not Doré images.
for(const n of [data.nodes[0],data.nodes[7],data.nodes[14]]){
  const p=new THREE.Mesh(new THREE.PlaneGeometry(3.2,4.4),new THREE.MeshBasicMaterial({color:0x171717,side:THREE.DoubleSide,transparent:true,opacity:.82}));
  p.position.set(n.p[0]+2,n.p[1]+.25,n.p[2]-3);p.rotation.y=-.25;scene.add(p);
}

const filmCamera=new THREE.PerspectiveCamera(45,1,.1,400);scene.add(filmCamera);
const topCamera=new THREE.OrthographicCamera(-42,42,28,-28,.1,500);topCamera.position.set(31,90,-57);topCamera.lookAt(31,0,-57);topCamera.up.set(0,0,-1);
const cameraMarker=new THREE.Group();
const markerBody=new THREE.Mesh(new THREE.ConeGeometry(.45,1.4,4),new THREE.MeshBasicMaterial({color:0xcebd74,wireframe:true}));markerBody.rotation.x=Math.PI/2;cameraMarker.add(markerBody);scene.add(cameraMarker);

const beatEl=document.getElementById('beat'),grammarEl=document.getElementById('grammar'),bridgeEl=document.getElementById('bridge'),progressEl=document.getElementById('progress'),scrub=document.getElementById('scrub'),playBtn=document.getElementById('play'),cameraBtn=document.getElementById('cameraBtn'),topBtn=document.getElementById('topBtn'),splitBtn=document.getElementById('splitBtn'),timeEl=document.getElementById('time'),splitLabel=document.getElementById('splitLabel');
let playing=true, t=0, last=performance.now(), mode='camera';

function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function nodeIndexAt(u){return Math.min(data.nodes.length-1,Math.round(u*(data.nodes.length-1)))}
function focalToFov(mm){return 2*Math.atan(36/(2*mm))*180/Math.PI}
function fmt(sec){sec=Math.round(sec);return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}
function setMode(next){mode=next;for(const [b,k] of [[cameraBtn,'camera'],[topBtn,'top'],[splitBtn,'split']])b.classList.toggle('active',k===mode);splitLabel.style.display=mode==='split'?'block':'none'}
function updateCamera(u){
  const pos=curve.getPointAt(clamp(u,0,.999999));filmCamera.position.copy(pos);
  const exact=u*(data.nodes.length-1),i0=Math.floor(exact),i1=Math.min(data.nodes.length-1,i0+1),a=exact-i0;
  const n0=data.nodes[i0],n1=data.nodes[i1];
  const lens=THREE.MathUtils.lerp(n0.lens||45,n1.lens||45,a);filmCamera.fov=focalToFov(lens);filmCamera.updateProjectionMatrix();
  const authored=lookCurve.getPointAt(clamp(u,0,.999999));const tangent=curve.getTangentAt(clamp(u,0,.999)).normalize();const forward=pos.clone().add(tangent.multiplyScalar(7));const look=forward.lerp(authored,.62);filmCamera.lookAt(look);
  cameraMarker.position.copy(pos);cameraMarker.quaternion.copy(filmCamera.quaternion);
  const idx=nodeIndexAt(u),n=data.nodes[idx];beatEl.textContent=n.id+' · '+n.beat;grammarEl.textContent=n.grammar+' · '+n.action;bridgeEl.textContent=n.timeBridge?('TIME BRIDGE · '+n.timeBridge.replaceAll('_',' → ')):'';
  nodeMeshes.forEach((m,j)=>m.scale.setScalar(j===idx?1.9:1));
  scrub.value=Math.round(u*1000);progressEl.style.width=(u*100)+'%';timeEl.textContent=fmt(u*DURATION)+' / '+fmt(DURATION);
}
function renderViewport(cam,x,y,w,h){renderer.setViewport(x,y,w,h);renderer.setScissor(x,y,w,h);cam.aspect!==undefined&&!(cam instanceof THREE.OrthographicCamera)&&(cam.aspect=w/h,cam.updateProjectionMatrix());renderer.render(scene,cam)}
function render(){
  const w=innerWidth,h=innerHeight;renderer.setScissorTest(true);renderer.setClearColor(0x080808,1);
  if(mode==='camera')renderViewport(filmCamera,0,0,w,h);
  else if(mode==='top')renderViewport(topCamera,0,0,w,h);
  else{const half=Math.floor(w/2);renderViewport(filmCamera,0,0,half,h);renderViewport(topCamera,half,0,w-half,h)}
  renderer.setScissorTest(false);
}
function frame(now){
  const dt=Math.min(.1,(now-last)/1000);last=now;if(playing)t=(t+dt/DURATION)%1;updateCamera(t);render();requestAnimationFrame(frame)
}
playBtn.onclick=()=>{playing=!playing;playBtn.textContent=playing?'PAUSE':'PLAY'};
cameraBtn.onclick=()=>setMode('camera');topBtn.onclick=()=>setMode('top');splitBtn.onclick=()=>setMode('split');
scrub.addEventListener('input',()=>{t=Number(scrub.value)/1000;playing=false;playBtn.textContent='PLAY';updateCamera(t);render()});
addEventListener('keydown',e=>{if(e.target===scrub)return;if(e.code==='Space'){e.preventDefault();playBtn.click()}else if(e.key==='1')setMode('camera');else if(e.key==='2')setMode('top');else if(e.key==='3')setMode('split');else if(e.key==='ArrowRight'){playing=false;t=clamp(t+.005,0,1);playBtn.textContent='PLAY'}else if(e.key==='ArrowLeft'){playing=false;t=clamp(t-.005,0,1);playBtn.textContent='PLAY'}});
addEventListener('resize',()=>renderer.setSize(innerWidth,innerHeight));
updateCamera(0);requestAnimationFrame(frame);
</script></body></html>
