<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DORÉ FILM · Camera Motion Lab 01</title><style>:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080808;color:#ddd;font:12px system-ui,-apple-system,sans-serif}canvas{display:block;width:100%;height:100%}.hud{position:fixed;left:18px;top:16px;z-index:5;pointer-events:none;text-shadow:0 1px 10px #000}.hud b{letter-spacing:.16em}.hud div{margin-top:5px;color:#999}.hud .state,.hud .bridge{color:#cebd74}.legend{position:fixed;right:18px;top:16px;text-align:right;color:#777;z-index:5;pointer-events:none}.controls{position:fixed;left:18px;right:18px;bottom:18px;z-index:6;display:grid;grid-template-columns:auto auto auto auto auto 1fr auto;gap:8px;align-items:center;padding:10px 12px;background:#080808c7;border:1px solid #2c2c2c;backdrop-filter:blur(10px)}button{background:#141414;color:#bbb;border:1px solid #343434;padding:7px 10px;cursor:pointer}button.active{border-color:#cebd74;color:#eadfae}input{width:100%;accent-color:#cebd74}.time{min-width:92px;text-align:right;color:#888;font-variant-numeric:tabular-nums}.progress{position:fixed;left:0;bottom:0;height:2px;background:#cebd74;width:0;z-index:8}@media(max-width:760px){.controls{grid-template-columns:repeat(5,auto);left:8px;right:8px;bottom:8px}.controls input{grid-column:1/-2}.time{grid-column:-2/-1}}</style></head><body><div class="hud"><b>CAMERA MOTION LAB · 01</b><div id="beat">P001</div><div id="grammar">TARR-01</div><div id="state" class="state">DWELL</div><div id="bridge" class="bridge"></div></div><div class="legend">ONE CAMERA · ZERO CUTS<br>AUTHORED SPEED + DWELL</div><div class="controls"><button id="play">PAUSE</button><button id="reset">RESET</button><button id="cameraBtn" class="active">CAMERA</button><button id="topBtn">TOP</button><button id="splitBtn">SPLIT</button><input id="scrub" type="range" min="0" max="1000" value="0"><span class="time" id="time">00:00</span></div><div class="progress" id="progress"></div><script type="module">import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';import{buildCameraTimeline,sampleCameraTimeline}from'./tools/camera-spine-timeline.js';const data=await fetch('./camera-spine-experiment-01.json',{cache:'no-store'}).then(r=>r.json()),timeline=buildCameraTimeline(data.nodes,52),D=timeline.duration,scene=new THREE.Scene();scene.background=new THREE.Color(0x080808);scene.fog=new THREE.FogExp2(0x080808,.012);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);document.body.prepend(renderer.domElement);const pts=data.nodes.map(n=>new THREE.Vector3(...n.p)),looks=data.nodes.map(n=>new THREE.Vector3(...n.look)),curve=new THREE.CatmullRomCurve3(pts,false,'centripetal',.5),lookCurve=new THREE.CatmullRomCurve3(looks,false,'centripetal',.5);scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(curve.getPoints(900)),new THREE.LineBasicMaterial({color:0xcebd74,transparent:true,opacity:.55})));const grid=new THREE.GridHelper(180,90,0x242424,0x151515);grid.position.set(30,0,-58);scene.add(grid);const nodes=[];for(const n of data.nodes){const s=new THREE.Mesh(new THREE.SphereGeometry(.24,12,8),new THREE.MeshBasicMaterial({color:n.timeBridge?0xcebd74:0xd8d8d8}));s.position.set(...n.p);scene.add(s);nodes.push(s)}const film=new THREE.PerspectiveCamera(45,1,.1,400),top=new THREE.OrthographicCamera(-42,42,28,-28,.1,500);top.position.set(31,90,-57);top.lookAt(31,0,-57);top.up.set(0,0,-1);const marker=new THREE.Mesh(new THREE.ConeGeometry(.45,1.4,4),new THREE.MeshBasicMaterial({color:0xcebd74,wireframe:true}));marker.rotation.x=Math.PI/2;scene.add(marker);let playing=true,sec=0,last=performance.now(),mode='camera';const q=id=>document.getElementById(id),beat=q('beat'),grammar=q('grammar'),state=q('state'),bridge=q('bridge'),scrub=q('scrub'),play=q('play'),reset=q('reset'),progress=q('progress'),time=q('time'),cameraBtn=q('cameraBtn'),topBtn=q('topBtn'),splitBtn=q('splitBtn');function fov(mm){return 2*Math.atan(36/(2*mm))*180/Math.PI}function fmt(s){s=Math.round(s);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}function setMode(m){mode=m;cameraBtn.classList.toggle('active',m==='camera');topBtn.classList.toggle('active',m==='top');splitBtn.classList.toggle('active',m==='split')}function update(seconds){const sample=sampleCameraTimeline(timeline,data.nodes,seconds),u=Math.min(.999999,Math.max(0,sample.pathT)),pos=curve.getPointAt(u);film.position.copy(pos);const e=u*(data.nodes.length-1),i0=Math.floor(e),i1=Math.min(data.nodes.length-1,i0+1),a=e-i0,n0=data.nodes[i0],n1=data.nodes[i1];film.fov=fov(THREE.MathUtils.lerp(n0.lens||45,n1.lens||45,a));film.updateProjectionMatrix();const ahead=pos.clone().add(curve.getTangentAt(u).multiplyScalar(7)),auth=lookCurve.getPointAt(u);film.lookAt(ahead.lerp(auth,.62));marker.position.copy(pos);marker.quaternion.copy(film.quaternion);const n=data.nodes[sample.nodeIndex];beat.textContent=n.id+' · '+n.beat;grammar.textContent=n.grammar+' · '+n.action;state.textContent=sample.kind+(sample.kind==='DWELL'?' · '+Number(n.dwell||0).toFixed(1)+'s':'');bridge.textContent=n.timeBridge?'TIME BRIDGE · '+n.timeBridge.replaceAll('_',' → '):'';nodes.forEach((m,j)=>m.scale.setScalar(j===sample.nodeIndex?1.9:1));const ratio=Math.min(1,seconds/D);scrub.value=Math.round(ratio*1000);progress.style.width=ratio*100+'%';time.textContent=fmt(seconds)+' / '+fmt(D)}function vp(cam,x,w){renderer.setViewport(x,0,w,innerHeight);renderer.setScissor(x,0,w,innerHeight);if(cam===film){cam.aspect=w/innerHeight;cam.updateProjectionMatrix()}renderer.render(scene,cam)}function render(){renderer.setScissorTest(true);if(mode==='camera')vp(film,0,innerWidth);else if(mode==='top')vp(top,0,innerWidth);else{const h=Math.floor(innerWidth/2);vp(film,0,h);vp(top,h,innerWidth-h)}renderer.setScissorTest(false)}function frame(now){const dt=Math.min(.1,(now-last)/1000);last=now;if(playing){sec+=dt;if(sec>=D){sec=D;playing=false;play.textContent='PLAY'}}update(sec);render();requestAnimationFrame(frame)}play.onclick=()=>{if(sec>=D)sec=0;playing=!playing;play.textContent=playing?'PAUSE':'PLAY'};reset.onclick=()=>{sec=0;playing=false;play.textContent='PLAY';update(0)};cameraBtn.onclick=()=>setMode('camera');topBtn.onclick=()=>setMode('top');splitBtn.onclick=()=>setMode('split');scrub.oninput=()=>{sec=(+scrub.value/1000)*D;playing=false;play.textContent='PLAY';update(sec)};addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();play.click()}else if(e.key==='1')setMode('camera');else if(e.key==='2')setMode('top');else if(e.key==='3')setMode('split');else if(e.key==='ArrowRight'){playing=false;sec=Math.min(D,sec+.5);play.textContent='PLAY'}else if(e.key==='ArrowLeft'){playing=false;sec=Math.max(0,sec-.5);play.textContent='PLAY'}});addEventListener('resize',()=>renderer.setSize(innerWidth,innerHeight));update(0);requestAnimationFrame(frame)</script></body></html>
