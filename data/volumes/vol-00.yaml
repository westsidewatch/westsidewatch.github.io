movements:
  - number: "I"
    name: "Watch"
    name_zh: "守望"
    tempo: "第一樂章"
    statement: "思想、異象、真理。"
    opening: "Watchfulness begins by looking toward God."
    columns:
      - number: "01"
        name: "米斯巴"
        role: "卷首"
      - number: "02"
        name: "伯利恆"
        role: "Bethlehem · 本月靈糧"
      - number: "03"
        name: "門"
        role: "The Gate · 約稿論壇"
      - number: "04"
        name: "迦密"
        role: "Feature · 專題"
      - number: "05"
        name: "何烈山"
        role: "神學 · 神先尋找人"
      - number: "06"
        name: "西區的夜晚"
        role: "以馬忤斯"
    interlude:
      name: "Selah"
      name_zh: "細拉"
      rhythm: "▆▅▅▆▇"
      character: "停頓、默想"
      form: "滿版圖片＋經文＋一句默想"
      modulation: "WATCH → WALK"

  - number: "II"
    name: "Walk"
    name_zh: "同行"
    tempo: "第二樂章 · 慢板"
    statement: "從信仰到生活。沉澱、默想、生命、教會。"
    opening: "Faith is not merely believed; it is lived."
    columns:
      - number: "07"
        name: "以琳"
        role: "靈修"
      - number: "08"
        name: "別是巴"
        role: "默想"
      - number: "09"
        name: "伯特利"
        role: "教會生活"
    interlude:
      name: "The Silent Dove in the Distance"
      name_zh: "遠方無聲鴿"
      rhythm: "▅▆▇▆▅"
      character: "安靜、等待"
      form: "滿版攝影＋一句散文"
      modulation: "WALK → WITNESS"

  - number: "III"
    name: "Witness"
    name_zh: "見證"
    tempo: "第三樂章"
    statement: "信仰向世界展開。人物、故事與共同見證，節奏開始活躍。"
    opening: "The light we receive becomes the light we bear."
    columns:
      - number: "10"
        name: "以斯帖"
        role: "人物"
      - number: "11"
        name: "亞杜蘭洞"
        role: "Adullam · 守望者訪談"
    interlude:
      name: "Kinneret"
      name_zh: "基尼烈"
      rhythm: "▆▇▅▇▆▅"
      character: "敬拜、藝術"
      form: "詩歌／樂譜／藝術作品跨頁"
      modulation: "WITNESS → WORSHIP"

  - number: "IV"
    name: "Worship"
    name_zh: "敬拜"
    tempo: "第四樂章 · 終曲"
    statement: "把所有主題帶回敬拜與同行，以敬拜回應整本刊物。"
    opening: "The highest form of watchfulness is praise."
    columns:
      - number: "12"
        name: "瑪拉拿"
        role: "結語"
