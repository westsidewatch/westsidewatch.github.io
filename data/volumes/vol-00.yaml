movements:
  - number: "I"
    name: "Watch"
    name_zh: "守望"
    tempo: "第一樂章"
    statement: "神先看見人，向人啟示自己；人因而看見神、聽見呼召。"
    opening: "We watch because God first watched over us."
    columns:
      - number: "01"
        name: "米斯巴"
        role: "Mizpah · 卷首"
      - number: "02"
        name: "伯利恆"
        role: "Bethlehem · 本月經文與每日靈糧"
      - number: "03"
        name: "門"
        role: "The Gate · 約稿、時代觀察與守望性的信仰思考"
      - number: "04"
        name: "迦密"
        role: "Carmel · 本期核心特稿"
    interlude:
      watch: "初更"
      watch_en: "First Watch"
      name: "Selah"
      name_zh: "細拉"
      rhythm: "▆▅▅▆▇"
      character: "停頓、思想、回應"
      form: "滿版圖片＋經文＋一句默想"
      modulation: "WATCH → WITNESS"

  - number: "II"
    name: "Witness"
    name_zh: "見證"
    tempo: "第二樂章"
    statement: "看見神如何在前人與今日信徒的生命中工作，受引導進入同行之路。"
    opening: "We see how others answered the call of God."
    columns:
      - number: "05"
        name: "以斯帖"
        role: "Esther · 歷史人物專稿"
      - number: "06"
        name: "亞杜蘭洞"
        role: "Adullam · 當代人物訪談"
    interlude:
      watch: "中更"
      watch_en: "Middle Watch"
      name: "The Silent Dove in the Distance"
      name_zh: "遠方無聲鴿"
      rhythm: "▅▆▇▆▅"
      character: "遠方、使命、盼望"
      form: "滿版攝影＋一句散文"
      modulation: "WITNESS → WALK"

  - number: "III"
    name: "Walk"
    name_zh: "同行"
    tempo: "第三樂章 · 慢板"
    statement: "從教會生活的入口，領受神的供應，作出盟約的回應，進入神家的共同生活。"
    opening: "Grace received becomes a life lived together."
    columns:
      - number: "07"
        name: "西區的夜晚"
        role: "Emmaus · 教會生活、查經與共同學習的入口"
      - number: "08"
        name: "以琳"
        role: "Elim · 神的供應、同在與生命恢復"
      - number: "09"
        name: "別是巴"
        role: "Beersheba · 人的回應、委身與盟約生活"
      - number: "10"
        name: "伯特利"
        role: "Bethel · 神家中的教會生活與彼此建造"
    interlude:
      watch: "晨更"
      watch_en: "Morning Watch"
      name: "Kinneret"
      name_zh: "基尼烈"
      rhythm: "▆▇▅▇▆▅"
      character: "匯聚、生命流動"
      form: "詩歌／樂譜／藝術作品跨頁"
      modulation: "WALK → WORSHIP"

  - number: "IV"
    name: "Worship"
    name_zh: "敬拜"
    tempo: "第四樂章 · 終曲"
    statement: "因神是神而高舉祂，以禱告、感恩與盼望回應整本刊物。"
    opening: "Because God is God, we worship and wait for His coming."
    columns:
      - number: "11"
        name: "何烈山"
        role: "Horeb · 神的啟示與因神是神而有的敬拜"
      - number: "12"
        name: "瑪拉拿"
        role: "Maranatha · 感恩、回應、代求、交託與等候主來的閉卷禱告"
