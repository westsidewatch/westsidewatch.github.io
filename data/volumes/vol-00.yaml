movements:
  - number: "I"
    name: "Watch"
    name_zh: "守望"
    tempo: "第一樂章"
    statement: "神先看見人，向人啟示自己；人因而看見神、聽見呼召。"
    opening: "We watch because God first watched over us."
    columns:
      - number: "01"
        name: "米斯巴"
        name_en: "Mizpah"
        section_zh: "卷首"
        section_en: "Editor's Note"
        role: "Mizpah · 卷首"
        title: "守望，一座光明的城"
        deck: "從黑夜中的城牆出發，仰望那座有根基的城；守望不是人的雄心，而是對神建造之工的回應。"
        source: "本期卷首 · 希伯來書 11:10"
      - number: "02"
        name: "伯利恆"
        name_en: "Bethlehem"
        section_zh: "感動"
        section_en: "Scripture"
        role: "Bethlehem · 本月經文與每日靈糧"
        title: "他等候那座有根基的城"
        deck: "以希伯來書十一章為晨光，七次默想信心、寄居、應許與神所預備的家鄉。"
        source: "本月經文 · 希伯來書 11:8–16"
      - number: "03"
        name: "門"
        name_en: "The Gate"
        section_zh: "看見"
        section_en: "Seeing"
        role: "The Gate · 約稿、時代觀察與守望性的信仰思考"
        title: "誰在建造我們的城？"
        deck: "當城市以速度、慾望與成功塑造人，教會如何重新思想建造、根基與公共生活。"
        source: "信仰思考 · 預想約稿"
      - number: "04"
        name: "迦密"
        name_en: "Carmel"
        section_zh: "特輯"
        section_en: "Feature"
        role: "Carmel · 本期核心特稿"
        title: "城牆之上，黎明之前"
        deck: "從耶路撒冷的守望者，到今日城市中的教會：誰在黑夜裡站立，誰又宣告白晝將近？"
        source: "本期核心特稿 · 預想選題"
    interlude:
      watch: "初更"
      watch_en: "First Watch"
      name: "Selah"
      name_zh: "細拉"
      rhythm: "▆▅▅▆▇"
      character: "停頓、思想、回應"
      form: "滿版圖片＋經文＋一句默想"
      modulation: "WATCH → WITNESS"

  - number: "II"
    name: "Witness"
    name_zh: "見證"
    tempo: "第二樂章"
    statement: "看見神如何在前人與今日信徒的生命中工作，受引導進入同行之路。"
    opening: "We see how others answered the call of God."
    columns:
      - number: "05"
        name: "以斯帖"
        name_en: "Esther"
        section_zh: "人物"
        section_en: "Witness"
        role: "Esther · 歷史人物專稿"
        title: "在日常中守望神的同在"
        deck: "從勞倫斯弟兄與《與神同在》出發，看一位沒有站在高臺上的守望者，如何在平凡工作中注目於神。"
        source: "守望者 · 勞倫斯弟兄"
      - number: "06"
        name: "亞杜蘭洞"
        name_en: "Adullam"
        section_zh: "對話"
        section_en: "Dialogue"
        role: "Adullam · 當代人物訪談"
        title: "守望城市的人"
        deck: "一場關於呼召、教會與日常忠心的預想訪談：在尚未天亮的時候，今日信徒如何守住自己的位置。"
        source: "當代人物訪談 · 人選徵集中"
    interlude:
      watch: "中更"
      watch_en: "Middle Watch"
      name: "The Silent Dove in the Distance"
      name_zh: "遠方無聲鴿"
      rhythm: "▅▆▇▆▅"
      character: "遠方、使命、盼望"
      form: "滿版攝影＋一句散文"
      modulation: "WITNESS → WALK"

  - number: "III"
    name: "Walk"
    name_zh: "同行"
    tempo: "第三樂章 · 慢板"
    statement: "從教會生活的入口，領受神的供應，作出盟約的回應，進入神家的共同生活。"
    opening: "Grace received becomes a life lived together."
    columns:
      - number: "07"
        name: "西區的夜晚"
        name_en: "Westside Night"
        section_zh: "查經"
        section_en: "Bible Study"
        role: "Emmaus · 教會生活、查經與共同學習的入口"
        title: "路上，祂向我們打開聖經"
        deck: "從以馬忤斯到西區的夜晚：我們一起讀經、彼此提問，也在同行中重新認出那位復活的主。"
        source: "ONE · 查經與共同學習"
      - number: "08"
        name: "以琳"
        name_en: "Elim"
        section_zh: "靈修"
        section_en: "Devotion"
        role: "Elim · 神的供應、同在與生命恢復"
        title: "十二股水泉，七十棵棕樹"
        deck: "曠野的道路不是靠意志走完；在人的回應以前，神先預備水泉、蔭庇與恢復。"
        source: "靈命供應 · 出埃及記 15:27"
      - number: "09"
        name: "別是巴"
        name_en: "Beersheba"
        section_zh: "默想"
        section_en: "Meditation"
        role: "Beersheba · 人的回應、委身與盟約生活"
        title: "在井旁重新立約"
        deck: "領受恩典的人如何回應神的愛，在變動的城市中記念祂的信實，重新選擇順服與委身。"
        source: "盟約生活 · 默想"
      - number: "10"
        name: "伯特利"
        name_en: "Bethel"
        section_zh: "教會生活"
        section_en: "Church Life"
        role: "Bethel · 神家中的教會生活與彼此建造"
        title: "一座城，也是一個家"
        deck: "那座光明之城不是孤獨者的理想；神把人帶進祂的家，使我們在團契、服事與彼此建造中一同居住。"
        source: "教會生活 · 西區故事"
    interlude:
      watch: "晨更"
      watch_en: "Morning Watch"
      name: "Kinneret"
      name_zh: "基尼烈"
      rhythm: "▆▇▅▇▆▅"
      character: "匯聚、生命流動"
      form: "詩歌／樂譜／藝術作品跨頁"
      modulation: "WALK → WORSHIP"

  - number: "IV"
    name: "Worship"
    name_zh: "敬拜"
    tempo: "第四樂章 · 終曲"
    statement: "因神是神而高舉祂，以禱告、感恩與盼望回應整本刊物。"
    opening: "Because God is God, we worship and wait for His coming."
    columns:
      - number: "11"
        name: "何烈山"
        name_en: "Horeb"
        section_zh: "頌讚"
        section_en: "Praise"
        role: "Horeb · 神的啟示與因神是神而有的敬拜"
        title: "是神先看見我們"
        deck: "何烈山上的火不是人的發明。神主動臨近、啟示祂自己；敬拜始於被祂看見，也終於看見祂。"
        source: "守望神學 · 出埃及記 3"
      - number: "12"
        name: "瑪拉拿"
        name_en: "Maranatha"
        section_zh: "禱告"
        section_en: "Prayer"
        role: "Maranatha · 感恩、回應、代求、交託與等候主來的閉卷禱告"
        title: "主啊，願你來"
        deck: "為這座城、教會與仍在黑夜中的人獻上感恩、代求與交託；我們在大光中，仍等候完全的黎明。"
        source: "閉卷禱告 · 啟示錄 22:20"
