<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>西區守望 | Westside Watch</title>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Noto+Serif+TC:wght@400;500;600&display=swap" rel="stylesheet">


<style>


* {
    box-sizing: border-box;
}


body {

    margin: 0;

    padding: 35px 15px;

    text-align: center;

    background-image:
    linear-gradient(
        rgba(206,189,116,0.78),
        rgba(206,189,116,0.78)
    ),
    url("../background.jpg");

    background-size: cover;

    background-position: center;

    color: #252525;

    font-family: "Noto Serif TC", serif;

}



/* Invitation Card */

.card {

    max-width: 430px;

    margin: 0 auto;

    padding: 55px 30px;

    text-align: center;

    border: 1px solid rgba(37,37,37,0.65);

    position: relative;

}



/* Inner Frame */

.card::before {

    content: "";

    position: absolute;

    top: 9px;

    left: 9px;

    right: 9px;

    bottom: 9px;

    border: 1px solid rgba(37,37,37,0.25);

    pointer-events: none;

}



/* Brand Chinese */

.brand-cn {

    font-size: 36px;

    letter-spacing: 5px;

    font-weight: 500;

    margin-bottom: 8px;

}



/* Brand English */

.brand-en {

    font-family: "Cormorant Garamond", serif;

    font-size: 34px;

    letter-spacing: 6px;

    font-weight: 500;

    margin-bottom: 30px;

}



/* Tagline */

.tagline {

    font-family: "Cormorant Garamond", serif;

    font-style: italic;

    font-size: 23px;

    letter-spacing: 1px;

    margin-bottom: 35px;

}



/* Divider */

.divider {

    width: 55px;

    border-top: 1px solid #252525;

    margin: 30px auto;

}



/* Scripture */

.verse {

    max-width: 330px;

    margin: 0 auto;

    font-size: 17px;

    line-height: 2;

}



/* Scripture Reference */

.reference {

    margin-top: 18px;

    font-size: 14px;

    letter-spacing: 1px;

}



.reference-number {

    font-family: "Cormorant Garamond", serif;

    font-style: italic;

    font-size: 18px;

}



/* QR Code */

.qr {

    width: 240px;

    max-width: 80%;

    margin: 35px auto;

    display: block;

    filter: drop-shadow(0 4px 8px rgba(37,37,37,0.25));

}



/* Join */

.join {

    font-size: 18px;

    line-height: 1.8;

}



/* Footer */

.footer {

    margin-top: 50px;

    line-height: 1.8;

}



/* Church Chinese Name */

.church-name {

    font-family: "HYRuishou",
                 "Noto Serif TC",
                 serif;

    font-size: 20px;

    white-space: nowrap;

}



/* Church English Name */

.church-en {

    font-family: "Cormorant Garamond", serif;

    font-size: 15px;

    letter-spacing: 0.5px;

    max-width: 100%;

    margin: 0 auto;

}



/* Small Footer Text */

.tag {

    font-size: 13px;

    margin-top: 18px;

}



</style>

</head>


<body>


<div class="card">


<div class="brand-cn">
西區守望
</div>


<div class="brand-en">
WESTSIDE WATCH
</div>


<div class="tagline">
Watch for the Dawn
</div>


<div class="divider"></div>


<div class="verse">

「黑夜已深，白晝將近；<br>
我們就當脫去暗昧的行為，<br>
帶上光明的兵器。」


<div class="reference">

—— 羅馬書 

<span class="reference-number">
13:12
</span>

</div>

</div>



<img class="qr" src="../wechat-qr.png" alt="WeChat QR Code">



<div class="join">

加入西區守望微信群<br>

Join Westside Watch Community

</div>


<div class="divider"></div>



<div class="footer">


<div class="church-name">

神召會活水堂西區教會

</div>


<div class="church-en">

P.A.O.C. Living Water Assembly West

</div>


<div class="tag">

Bible Study · Fellowship · Community

</div>


</div>


</div>


</body>

</html>
